[[convention]]
id = "instruments.pregnancy-provision"
group = "instruments"
title = "הוראה \"בקשר להריון\" שלוקחת מן העובדת עבודה ושכר"
value = "סעיף 3(א) לחוק שוויון ההזדמנויות בעבודה שומר על הוראה שמגינה על ההריון או על העובדת; הוראה שלוקחת מעובדת בהריון עבודה או שכר בשל ההריון היא הפליה שסעיף 2 אוסר"
detail = "סעיף 3(א) אומר: \"הוראה שנקבעה בחיקוק, בהסכם קיבוצי או בחוזה עבודה בקשר להריון, לשמירת הריון, ללידה, להנקה או לפוריות, אין בה הפליה\". כלשונו הוא פוטר כל הוראה \"בקשר להריון\", גם כזו שפוגעת בעובדת. הבחירה היא לקרוא אותו לפי תכליתו, לצד סעיף 2(א) שמונה את ההריון בין הטעמים שאין להפלות בגללם: הוא שומר על הוראה שמגינה — היעדרות, הקלה בעבודה, שחרור ממאמץ — ולא על הוראה שמשאירה את העובדת בלי עבודה ובלי שכר משום שהיא בהריון. מי שיקרא את 3(א) כלשונו יגיע לתוצאה אחרת: ההוראה תעמוד."
basis = "ours"
lawyer = "MMS-486"
corpus = [
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 1.27.1.3", eId = "chp_1ב__sec_1_27__ssec_1_27_1__para_3__subpara_e/p2", how = "מועברת בהריון שמועד לידתה בתוך שישה שבועות מתחילת השנה אינה משובצת, ויוצאת לחופשה ללא שכר" },
