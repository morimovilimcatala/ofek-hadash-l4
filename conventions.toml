[[convention]]
id = "instruments.misquote"
group = "instruments"
title = "תיקון שמצטט מילים שאינן מודפסות בסעיף שהוא מתקן"
value = "חל על המילים שהסעיף מדפיס, כשהכוונה ברורה"
detail = "כשתיקון 'במקום X יבוא Y' מצטט X שאינו מודפס בסעיף שנחתם — מילה אחת שונה, או סעיף סמוך שבו המילים כן מודפסות — התיקון חל על הנוסח המודפס, ובלבד שאין תיקון ביניים חסר וההשפעה ברורה; כשהמילים שונות במילה אחת, כך הוחלט כבר (22.9.2026). הבחירה הזמנית: גם סעיף 5(ב) להסכם עוז מיום 26.6.2014, שמתקן את 'סעיף 7(ו)' במילים שמודפסות רק בסעיף 7(ז), חל על 7(ז): היישום המלא נדחה מתשע\"ה לתשע\"ז."
basis = "ours"
lawyer = "MMS-294"
corpus = [
  { doc = "agreements/oz-latmura/2014-06-26_oz-latmura_bagrut-reform-amendments.xml", name = "הסכם עוז לתמורה מיום 26.6.2014", eId = "art_5__para_b", how = "התיקון מופנה לסעיף 7(ז) של הסכם 14.8.2011" },
  { doc = "agreements/ofek-hadash/2025-06-29_ofek-hadash_approved-teacher-agreement_wage-reduction-2025-2026.xml", name = "ההסכם הקיבוצי המאושר להפחתות השכר (29.6.2025)", eId = "art_19", how = "'החל בשנת' מול 'החל משנת' — הוחל, באישור הלקוח (MMS-335)" },
]

[[convention]]
id = "instruments.every-printing"
group = "instruments"
title = "תיקון 'במקום X יבוא Y' בסעיף שמדפיס את X פעמיים"
value = "חל על כל הופעה של X בסעיף, כשכל ההופעות מתארות אותו דבר"
detail = "תיקון שאומר 'בסעיף פלוני, במקום X יבוא Y' אינו אומר אם הוא חל על ההופעה הראשונה של X בסעיף או על כולן. כשהסעיף מדפיס את X יותר מפעם אחת, וכל ההופעות מתארות אותו דבר — כך שהחלפת אחת בלבד משאירה את הסעיף סותר את עצמו — הבחירה היא שהתיקון חל על כולן. סעיף 46(ג) להסכם אופק חדש קובע רצפה אחת לשכר הטבלאי \"בותק 0\" פעמיים במשפט אחד (בתחילת תשס\"ט ובמשכורת דצמבר 2008), וההסכם מ־29.2.2012 מעביר אותה ל\"בותק 1\"; החלפה של ההופעה הראשונה בלבד הייתה משאירה רצפה אחת בשני שלבי ותק. השאלה לעורך הדין: האם 'במקום X יבוא Y' שמכוון לסעיף חל על כל הופעה של X בו, או על הראשונה בלבד."
basis = "ours"
lawyer = "MMS-682"
corpus = [
  { doc = "agreements/ofek-hadash/2012-02-29_ofek-hadash_amendment_hascam-hashlama.xml", name = "ההסכם הקיבוצי מיום 29.2.2012, סעיף 23(א)", eId = "art_23__para_a", how = "במקום \"בותק 0\" יבוא \"בותק 1\" — חל על שתי ההופעות בסעיף 46(ג) של ההסכם הכולל" },
]

