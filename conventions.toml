[[convention]]
id = "instruments.parenthood-right"
group = "instruments"
title = "הטבה לאם שחוק שוויון ההזדמנויות בעבודה אינו מונה בזכויות ההורה"
value = "סעיף 4(א) מעביר לאב רק את ארבע הזכויות שסעיף 4(ב) מונה; תשלום או הטבה אחרת לאם בלבד היא זכות יתר שסעיף 3(ב) שומר עליה, ואינה הפליה"
detail = "סעיף 4(ב) לחוק מגדיר \"זכות בקשר להורות\" כ\"אחד מאלה\": היעדרות בשל מחלת הילד, יום עבודה מקוצר בשל היות העובדת אם לילד, שירותי מעון של המעסיק, והשתתפות המעסיק בעלות המעון. רק את אלה סעיף 4(א) נותן גם לאב. מסמך שנותן לאם בלבד משהו אחר — תשלום במקום יום מקוצר כשהיא עובדת משרה מלאה (המימוש הכספי של משרת אם), או תוספת מורה־אם של 10% — אינו נותן לאב פחות מהחוק: סעיף 3(ב) אומר שאין בחוק כדי לגרוע מזכות יתר המוענקת לעובדת לפי חיקוק, הסכם קיבוצי או חוזה עבודה, ואין רואים אותה כהפליה. הבחירה היא לקרוא את הרשימה של 4(ב) כסגורה ואת התשלום כזכות נפרדת מן היום המקוצר, ולא כ\"מימוש\" של אותה זכות שעובר לאב איתה. חוזר תשע\"ה/1 עצמו מתאר את התשלום כ\"מימוש כספי במסגרת הזכות למשרת אם\", ומי שיקרא אותו כחלק מן הזכות יגיע לתוצאה אחרת."
