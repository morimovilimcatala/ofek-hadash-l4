[[convention]]
id = "instruments.minimum-wage-fixed-supplement"
group = "instruments"
title = "איזו תוספת היא \"תוספת קבועה המשתלמת לעובד עקב עבודתו\" שחוק שכר מינימום מביא בחשבון"
value = "תוספת שמשתלמת מדי חודש, בסכום או בשיעור קבועים, לכל עובד בדרגה, בדירוג או במעמד שהמסמך מונה, בעד עבודתו — תוספת קבועה לפי סעיף 3(ב)(3), שהחוק מביא בחשבון בשכר שנספר לקראת שכר המינימום; מענק חד־פעמי או שנתי אינו כזה"
detail = "סעיף 3(ב) לחוק שכר מינימום מביא בחשבון שכר יסוד או שכר משולב, תוספת יוקר ו\"תוספת קבועה המשתלמת לעובד עקב עבודתו\", ומוציא בשמם תוספת משפחה, ותק, משמרות, פרמיות, משכורת י\"ג, מענקים על בסיס שנתי והחזר הוצאות. החוק אינו מגדיר \"תוספת קבועה\". הבחירה היא לקרוא אותה כתוספת חודשית שאינה תלויה בתפוקה או בהוצאה, המשתלמת לכל עובד מן הקבוצה שהמסמך מונה בעד עבודתו — התוספת השקלית, תוספת המעו\"ף לפי דרגה, התוספת של 1% משכר הפנסיה לעובד ההוראה בבעלות. הקריאה מכריעה בשני כיוונים: מסמך שמוציא תוספת כזו מן החישוב נותן השלמה גדולה מזו שבחוק ועומד ברצפה; מסמך שמביא אותה בחשבון נותן את ההשלמה שבחוק ועומד ברצפה גם הוא. רק מסמך שמביא בחשבון רכיב שהחוק מוציא (ותק, מענק שנתי) נופל ממנה. שהסכם המסגרת ברשויות המקומיות אומר שתוספת המעו\"ף אינה \"תוספת קבועה\" כהגדרתה בסעיף 2.3 להסכם הבלתי ייחודיים הוא מונח של אותו הסכם, לא של החוק. השאלה לעורך הדין: אם בית הדין יראה בתוספת חודשית שהסכם קובע — ובפרט תוספת שבאה לפצות על שיעור הפרשה לפנסיה — \"תוספת קבועה\" שסעיף 3(ב)(3) מביא בחשבון."
basis = "ours"
lawyer = "MMS-486"
corpus = [
  { doc = "circulars/2009-10_tasha_01.xml", name = "חוזר תש\"ע/1", eId = "art_3__para_b/p2", how = "התוספת של 1% משכר הפנסיה \"תובא בחשבון לחישוב השלמה לשכר מינימום\"" },
  { doc = "agreements/framework/2012-05-17_framework-agreement_local-government.xml", name = "הסכם המסגרת ברשויות המקומיות, 17.5.2012", eId = "art_4__para_d", how = "תוספת המעו\"ף \"תילקח בחשבון לצורך החישוב לשכר מינימום\"" },
]
