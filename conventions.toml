[[convention]]
id = "instruments.converted-supplements"
group = "instruments"
title = "תוספות ששכר ההמרה של אופק חדש כולל, למורה שמשתכר לפי טבלאות הרפורמה"
value = "אינן משולמות שוב לצד הטבלה"
detail = "סעיף 44(ב)(1) להסכם אופק חדש מיום 25.12.2008 מונה את תוספת 94', תוספת 2001 ותוספת 2008 בין רכיבי השכר להמרה (X), ואחרי המעבר המורה משתכר לפי השכר המומר בטבלאות הרפורמה (סעיפים 44(ד), 46). ההסכם אינו אומר במפורש שהתוספות פוסקות. הבחירה: למורה שמשתכר לפי טבלאות הרפורמה, תשובת ההסכם על כל אחת מהן היא 0, והיא גוברת על סעיף 1.1 לתקנון, שמונה אותן לכל עובד הוראה (מבוא התקנון: הסכם קיבוצי גובר על התקנון); וחוזר לבעלויות שמעדכן את סכומה של תוספת כזו אינו מדבר עליו. כך גם ההסכמים שנתנו אותן לעובדי המדינה — הסכם 18.12.2001 (תוספת 2001) והסכם 21.2.2008 עם ההסכמים שמתקנים אותו (תוספת 2008) — אינם מדברים עליו, ולכן סעיף 23 אינו שוקל את ה־3% או ה־5% שלהם מול ה־0 של סעיף 44: את מדרגות תוספת 2008 מביא אליו סעיף 47(א), שממיר את X שוב 'במועדים המופיעים בסעיף 4 להסכם הקיבוצי מיום 21.2.08', ולא תשלום לצד הטבלה. תוספת 2011, שבאה אחרי ההמרה, אינה כאן: ההסכמים והחוזרים של 2011–2013 עצמם מעלים את טבלאות הרפורמה במקומה."
basis = "ours"
lawyer = "MMS-486"
applies = [
  { l4 = "l4/agreements/ofek-hadash/2008-12-25_ofek-hadash_base-agreement/base-agreement-44.l4", rule = "a converted supplement according to the base agreement §44" },
  { l4 = "l4/agreements/teachers-general/2008-02-21_teachers_tosefet-2008_wage-supplement.l4", rule = "the agreement of 21.2.2008 speaks of the 2008 supplement for" },
  { l4 = "l4/agreements/teachers-general/2001-12-18_histadrut-hamorim_wage-agreement-1999-2001.l4", rule = "the 3% supplement according to the agreement of 18.12.2001" },
  { l4 = "l4/circulars/2008-09_tashsat_03.l4", rule = "the 2008 supplement according to circular תשס\"ט/3" },
  { l4 = "l4/circulars/2008-09_tashsat_03.l4", rule = "the 1994 supplement according to circular תשס\"ט/3" },
