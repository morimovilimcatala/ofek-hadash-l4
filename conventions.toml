  { l4 = "l4/agreements/ofek-hadash/2022-10-19_ofek-hadash_wage-agreement.l4", rule = "the activity hours a meeting before the opening of the school year counts for", value = "\"עד 3 שעות\" כולל 3", why = "\"(עד 3 שעות)\" היא תקרת השעות שמפגש נמנה בהן, לא סף; מפגש של שלוש שעות הוא בדיוק המקרה שהמילים מתארות" },
  { l4 = "l4/agreements/ofek-hadash/2007-09-10_ofek-hadash_reform-founding-agreement.l4", rule = "a group for individual hours", value = "\"עד 5 תלמידים\" כולל 5", why = "גודל קבוצה נספר בתלמידים שלמים, ו\"קבוצת תלמידים (עד 5 תלמידים)\" מתארת קבוצה שיש בה עד חמישה; קבוצה של חמישה היא בדיוק המקרה שהמילים מתארות" },
