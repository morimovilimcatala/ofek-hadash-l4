[[convention]]
id = "reading.unlettered-last-item"
group = "reading"
title = "פסקה בלי אות אחרי הסעיף הקטן האחרון, כשהפניה מונה אות אחת יותר"
value = "הפסקה היא הסעיף הקטן הבא, וההפניה מגיעה אליה"
detail = "כשסעיף מסמן באותיות את סעיפיו הקטנים עד אות מסוימת, ואחריהם מדפיס פסקה אחת שאין לה אות, והפניה מונה את סעיפיו עד האות הבאה בדיוק — הפסקה נקראת כסעיף הקטן שהאות שלו חסרה, וההפניה חלה עליה. היא הטקסט היחיד בסעיף אחרי האות האחרונה, והאות שההפניה מונה היא בדיוק זו שהייתה ניתנת לה. סעיף 20.3 להסכם המסגרת מיום 18.4.2016 מסמן (א) עד (ד) ואחריהם פסקה בלי אות על ברירות המחדל של סעיפים 13 עד 15, וסעיף 20.4.4 מחיל את \"סעיפים 20.3(ב) עד (ה)\" על דירוג החינוך נוער חברה וקהילה. הקריאה האחרת היא ש־(ה) טעות ל־(ד) וההפניה נגמרת ב־(ד). השאלה לעורך הדין: האם ההפניה ל־(ה) מגיעה לפסקה שאין לה אות."
basis = "ours"
lawyer = "MMS-631"
applies = [
  { l4 = "l4/agreements/framework/2016-04-18_framework-agreement_public-sector.l4", rule = "the clauses of 20.3 that reach youth education" },
]
