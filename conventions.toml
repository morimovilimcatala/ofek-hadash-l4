[[convention]]
id = "reading.role-allowances-in-the-month"
group = "reading"
title = "גמולי התפקיד של התפקידים שהמורה ממלא, בשכר החודש"
value = "כל גמול של תפקיד שהמורה ממלא נוסף לשכר החודש; כשהתקרה על מספר הגמולים חלה, הגמולים שברשימת התוספות האחוזיות משולמים קודם, והמקומות שנותרו הולכים לגבוהים מבין רכז פדגוגי, חונך ומנהל חטיבה צעירה"
detail = "המקרה אומר אילו תפקידים המורה ממלא: רכז פדגוגי, חונך (מתמחה אחד לפחות) ומנהל חטיבה צעירה. גמולו של כל תפקיד כזה נוסף לשכר החודש, בשיעור ששורש הדין נותן, כתוספת האחוזית של סעיף 1.1ו שהוא נחשב לה (reading.role-allowance-kinds): גמול באחוזים — על בסיס התוספות האחוזיות כפי שהדין נותן אותו; גמול בשקלים (מנהל חטיבה צעירה) — הסכום ששורש הדין נותן למשרה מלאה, משולם כמו למשרה מלאה החל משליש משרה, כמו כל תוספת של ו.1. סעיף 39(ב) להסכם אופק חדש מגביל את מספר גמולי התפקיד (שניים, ושלישי באישור מנהל המחוז), וההסכם מיום 19.3.2017 (סעיף 3(ו)) מחיל אותו על גמול החונך ועל גמול הרכז הפדגוגי; גם גמול ניהול החטיבה הצעירה נמנה בו. שורש הדין עונה כמה גמולים משולמים, ומספר התפקידים שהמקרה מונה אינו קטן ממספר התפקידים שסומנו. הבחירה: תפקידים אחרים שהמקרה מונה (כמו חינוך כיתה), שגמוליהם מוזנים ברשימת התוספות האחוזיות, נחשבים משולמים כפי שהוזנו ותופסים את מקומם ראשונים; המקומות שנותרו הולכים לגמולים הגבוהים מבין התפקידים שסומנו (amounts.highest)."
basis = "ours"
lawyer = "MMS-486"
applies = [
  { l4 = "l4/lib/salary-root.l4", rule = "the places the cap leaves the roles held" },
  { l4 = "l4/lib/salary-root.l4", rule = "the role allowances paid in the month" },
  { l4 = "l4/lib/salary-root.l4", rule = "the item as a percentage allowance in the month" },
]

[[convention]]
id = "reading.ofek-2022-in-role-allowances"
group = "reading"
title = "תוספת אופק 2022 בבסיס של גמולי התפקיד"
value = "גמול תפקיד שנקבע באחוזים מהשכר המשולב הוא תוספת אחוזית המחושבת על בסיס השכר המשולב, ותוספת אופק 2022 נכללת בבסיסו"
detail = "סעיף 5.4 להסכם השכר מיום 19.10.2022 קובע שתוספת אופק 2022 \"תובא בחשבון לעניין חישוב תוספות אחוזיות המחושבות על בסיס השכר המשולב\". התוספות האחוזיות של סעיף 1.1ו לתקנון הן כאלה, והיא נכללת בבסיסן. ההסכם קורא לגמולי התפקיד \"גמול\" ולא \"תוספת\", ואינו אומר במפורש אם גם הם בכלל זה. הבחירה: גמול תפקיד שנקבע באחוזים מהשכר המשולב — גמול הרכז הפדגוגי, גמול החונך וגמול ניהול החטיבה הצעירה (20%, וסכום מינימלי לפי סעיף 10) — הוא תוספת אחוזית המחושבת על בסיס השכר המשולב, כפי שסעיף 1.1ו מונה גמולים כאלה בין התוספות האחוזיות (reading.role-allowance-kinds), ולכן תוספת אופק 2022 נכללת בבסיסו."
basis = "ours"
lawyer = "MMS-486"
corpus = [
  { doc = "agreements/ofek-hadash/2022-10-19_ofek-hadash_wage-agreement.xml", name = "הסכם השכר מיום 19.10.2022", eId = "art_5__para_5-4", how = "תוספת אופק 2022 בבסיס גמולי התפקיד שבאחוזים" },
]
applies = [
  { l4 = "l4/agreements/ofek-hadash/2022-10-19_ofek-hadash_wage-agreement_signed-appendices.l4", rule = "the junior-division head's allowance according to the agreement of 19.10.2022 and its annexes" },
  { l4 = "l4/lib/salary-root.l4", rule = "the base of the percentage allowances by the law" },
]

