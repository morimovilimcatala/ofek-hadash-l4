[[convention]]
id = "reading.contracts-law"
group = "reading"
title = "החוק שלפיו קוראים הסכם, חוזר ואת התקנון"
value = "סעיף 25(א) לחוק החוזים בנוסחו הקודם: לפי אומד דעת הצדדים, ולפי הלשון כשהאומד משתמע ממנה במפורש; חוזר והתקנון דרך סעיף 61(ב)"
detail = "כל ההסכמים שבקורפוס נכרתו לפני 7.1.2026, ולכן קורא אותם סעיף 25(א) לחוק החוזים (חלק כללי) בנוסח שקדם לתיקון מס' 3: לפי אומד דעתם של הצדדים, כפי שהוא משתמע מתוך ההסכם ומנסיבות העניין, ואם אומד הדעת משתמע במפורש מלשון ההסכם — לפי לשונו. המוסכמות שבקבוצה זו הן הדרכים שבהן הקידוד קורא את אומד הדעת מתוך הטקסט, ו־reading.as-printed היא החלק השני של הסעיף. הסכם שייכרת או יחודש מיום 7.1.2026 ייקרא לפי הנוסח החדש: הסכם קיבוצי וחוזה עבודה לפי אומד דעת הצדדים (סעיף 25(א)(4)), אלא אם הצדדים, כשעורך דין ייצג אותם בעריכתו, הסכימו אחרת על אופן הפירוש (פסקאות (1) ו־(5)(א)). חוזר, התקנון ומכתב אינם חוזה, וחוק החוזים חל עליהם לפי סעיף 61(ב), ככל שהדבר מתאים לעניין ובשינויים המחויבים. הבחירה: הם נקראים כמו ההסכם שהם מבצעים — חוזר שפורסם עד 6.1.2026 לפי הנוסח הקודם, וחוזר שפורסם מיום 7.1.2026 (תשפ\"ו/5 עד תשפ\"ו/8) לפי אומד הדעת, כפי שסעיף 25(א)(4) קורא חוזה שאינו עסקי. מבין שני פירושים, סעיף 25(ב) מעדיף את זה שמקיים את ההוראה, וסעיף 25(ב1) את הפירוש נגד הצד שהייתה לו עדיפות בעיצוב התנאים; החוק אינו אומר מה גובר כשהשניים מושכים לכיוונים שונים, והקידוד אינו מכריע ביניהם."
basis = "ours"
lawyer = "MMS-486"
applies = [
  { l4 = "l4/laws/contracts-law.l4", rule = "the way section 25 reads it" },
  { l4 = "l4/laws/contracts-law.l4", rule = "how section 61 brings the Contracts Law to it" },
]

[[convention]]
id = "reading.interpretation-law"
group = "reading"
title = "חוק הפרשנות והמסמכים שבקורפוס"
value = "חל על ההסכמים דרך סעיף 25(ד) לחוק החוזים — סעיפים 2, 4, 5, 6, 7, 8 ו־10 בלבד; על החוזרים ועל התקנון דרך סעיף 61(ב) לחוק החוזים"
detail = "חוק הפרשנות חל, לפי סעיף 1 שלו, על חיקוק ועל הוראת מינהל — הוראה שניתנה בכתב מכוח חוק. הסכם קיבוצי אינו אחד מהם, וסעיף 25(ד) לחוק החוזים הוא שמחיל על פירושו את סעיפים 2, 4, 5, 6, 7, 8 ו־10 של חוק הפרשנות, בשינויים המחויבים, אם אין הוראה אחרת לעניין ואין בעניין או בהקשרו דבר שאינו מתיישב עם תחולתם. סעיף 3 (הגדרות כמו 'יום', 'חודש' ו'שנה') אינו ביניהם. הבחירה: חוזרי המשרד לבעלויות והתקנון אינם הוראת מינהל — הם אינם ניתנים מכוח סמכות שחוק מעניק — ולכן אותם שבעה סעיפים חלים עליהם דרך סעיף 61(ב) לחוק החוזים, כמו שאר החוק (reading.contracts-law). כך סעיף 6 (זכר ונקבה) הוא הבסיס של instruments.equal-pay-teaching לקריאת הוראה שנכתבה בלשון מין אחד; וסעיף 8 ('עד…' לעניין זמן — עד ועד בכלל) עומד מול thresholds.until, שקורא 'עד N' כלא כולל את N."
basis = "ours"
lawyer = "MMS-486"
applies = [
  { l4 = "l4/laws/interpretation-law.l4", rule = "how the Interpretation Law reaches the instrument" },
  { l4 = "l4/laws/contracts-law.l4", rule = "section 25(ד) applies those sections" },
]

