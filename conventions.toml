[[convention]]
id = "instruments.amendment-chain"
group = "instruments"
title = "הסכם קיבוצי וההסכמים שמתקנים אותו, באותו עניין"
value = "התיקון האחרון שבתוקף בחודש השכר מדבר; ההסכם המקורי והתיקונים שקדמו לו אינם נשקלים מולו לפי סעיף 23"
detail = "סעיף 23 לחוק הסכמים קיבוציים הולך אחר ההוראה שלטובת העובד כשחלים עליו יותר מהסכם קיבוצי אחד. כשהסכם מאוחר בין אותם צדדים מחליף את מילותיו של הסכם קודם ('במקום ... יבוא ...'), ההוראה הקודמת שונתה כדין, וסעיף 19 משאיר הוראה אישית בחוזה העבודה רק 'כל עוד לא שונו או לא בוטלו כדין'. החוק אינו אומר זאת במפורש על שני הסכמים מיוחדים בין אותם צדדים, ולכן זו בחירה: בשרשרת של הסכם והסכמים שמתקנים אותו, התיקון האחרון שבתוקף בחודש השכר הוא ההוראה שחלה — טענתו כבר מרכיבה את ההסכם שהוא מתקן, כפי שתוקן — וההסכם המקורי והתיקונים שקדמו לו אינם נשקלים מולו לפי סעיף 23. תיקון מדבר מחודש השכר שבו נחתם (כמו dates.undated-amendment), ובחודש שקדם לו ההסכם שהוא מתקן מדבר. כך הסכם 21.2.2008 (תוספת 2008), הדחייה מיום 17.6.2009 וההקדמה מיום 24.11.2010: לעובד מהאוכלוסייה שהשלב השלישי שלו נדחה, מדצמבר 2009 עד אוקטובר 2010 3% ולא ה־5% של ההסכם כפי שנחתם — אחרת סעיף 23 היה מבטל את הדחייה שהצדדים חתמו עליה. סעיף 4 להסכם 17.6.2009 תולה את תחילתו בהשלמת חקיקת חוק ההבראה, יום שאינו בקורפוס; עד דצמבר 2009 הוא אינו משנה דבר בהסכם שהוא מתקן."
