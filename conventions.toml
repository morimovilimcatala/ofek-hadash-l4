[[convention]]
id = "position.hour-beyond-unit"
group = "position"
title = "שעה מעבר למשרה מלאה: יחידה של המשרה, ובמערכת — שיעור"
value = "שעה מעבר למשרה היא שעה שבועית של המשרה שהיא מגדילה (בעוז לתמורה: ארבעים אחד ממשרה של 40 ש\"ש, ומ־1.9.2024 אחד משלושים ושמונה), ובמערכת השעות — שיעור פרונטלי באורך שקובע משרד החינוך; היא אינה שעת נוכחות של 60 דקות"
detail = "סעיף 14(ד) להסכם עוז לתמורה משלם את השעות שמעבר ל־100% \"באמצעות הגדלת היקף משרה\", ולכן כל שעה היא חלק מהמשרה באותה יחידה שבה המשרה נמדדת. סעיף 14(ב)(2) קובע שהן \"בשעות הוראה פרונטאלית בלבד\", וסעיף 9(יא), שקובע לשעת הנוכחות 60 דקות, מוסיף: \"אין באמור בסעיף זה כדי לשנות את אורכה של שעת הוראה במערכת, כפי שנקבע בהוראות משרד החינוך\"; ההסכם מ־26.6.2014 מחק מטבלאות שבוע העבודה גם את המילים \"(שעות של 60 דקות)\". הבחירה היא שהשעה הנוספת נמנית כחלק מהמשרה לעניין השכר, ואורכה בפועל הוא אורך השיעור, שאינו בידי הקורפוס. מול חוק שעות עבודה ומנוחה זה אינו משנה את התוצאה: השבוע שההסכם עצמו קובע — חמישה ימי עבודה (היום החופשי שבסעיף 9(ד)) של 9 שעות לכל היותר (סעיף 62) — אינו עולה על 45 שעות. השאלה לעורך הדין: האם שעה מעבר למשרה היא שעה של 60 דקות, כמו שעת המשרה שהיא מגדילה, או שיעור."
basis = "ours"
lawyer = "MMS-486"
corpus = [
  { doc = "agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement.xml", name = "הסכם עוז לתמורה, סעיף 14(ד)", eId = "art_14__para_d", how = "התגמול עבור העבודה בשעות שמעבר ל – 100% משרה באמצעות הגדלת היקף משרה" },
  { doc = "agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement.xml", name = "הסכם עוז לתמורה, סעיף 14(ב)(2)", eId = "art_14__para_b__subpara_2", how = "השעות שמעבר למשרה הן שעות הוראה פרונטאלית בלבד" },
]
