group = "instruments"
title = "'הסכם השכר הכללי במגזר הציבורי' שהסכם של עובדי הוראה מפנה אליו לפני שנחתם"
value = "הסכם המסגרת של אותו סבב, לפי מסגרת העלות שלו"
detail = "כשהסכם של עובדי הוראה מתחייב לשיעורים ולמועדים של 'הסכם השכר הכללי במגזר הציבורי', או של 'הסכם תוספת השכר במגזר הציבורי שייחתם על-ידי הסתדרות העובדים הכללית החדשה', לפני שנחתם, ההפניה היא להסכם המסגרת שנחתם אחריו בין המדינה והמעסיקים הציבוריים לבין ההסתדרות, ו'השיעורים והמועדים' הם של מסגרת עלות התוספות שבו — לא של הדרך שבה הוא מקצה אותה. כך סעיף 76(ג) להסכם הרפורמה מיום 10.9.2007, סעיף 4(י) להסכם ארגון המורים מיום 24.1.2008 וסעיף 4(יא) להסכם הסתדרות המורים מיום 21.2.2008: הסכם המסגרת מיום 17.4.2008, 1.5% מ־1.1.2008, 3% מ־1.12.2008 ו־5% מ־1.12.2009, אף שאת ה־1.5% של 2008 הוא משלם כמענק חד פעמי ולא כתוספת לשכר. ומכאן גם שהמענק הזה אינו 'תוספת שכר נוספת לכלל העובדים הפעילים' (סעיף 4(יא) להסכם 24.1.2008, סעיף 4(יב) להסכם 21.2.2008): הוא אותו 1.5%."
