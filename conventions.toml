[[convention]]
id = "instruments.leave-days-measure"
group = "instruments"
title = "ימי חופשה של מסמך מול ימי חוק חופשה שנתית"
value = "ימי חופשה שמסמך נותן מושווים לימי סעיף 3 לחוק חופשה שנתית בשבועות: שבעה מימי החוק הם שבוע חופשה, כי סעיף 3(א) מונה בהם מנוחה שבועית אחת לכל שבעה; ימים קלנדריים של מסמך נמנים כך גם הם; וימי עבודה של מסמך מתחלקים במספר ימי העבודה בשבוע של העובד עצמו, ובמשרה חלקית — בחלק של שבוע העבודה שהמשרה היא"
detail = "סעיף 3(א) לחוק מונה ימים של לוח השנה: \"בימי החופשה לא ייכלל אלא מנוחה שבועית אחת לכל שבעה ימי חופשה\", ו־28 ימיו הם ארבעה שבועות. המסמכים מונים אחרת: חופשת הקיץ של התקנון היא 6 או 7 ימים לכל חודש עבודה, ועשרה חודשים הם חודשי יולי ואוגוסט — ימים של לוח השנה; מדריך מקבל 26 ימי חופשה בשנה (סעיף 8.1) ומורה באולפן 60 (סעיף 14.5), שניהם יחסית להיקף המשרה — ימים שהיו ימי עבודה. הבחירה היא להשוות בשבועות, היחידה שאינה תלויה במספר ימי העבודה בשבוע: מדריך בחמישה ימים מקבל 26/5 שבועות, ומדריך ביום אחד, שהוא שישית משרה, מקבל 26/6 ימים ליום עבודה אחד בשבוע — 4.33 שבועות. מורה באולפן נמדד בחלק המשרה שלו משבוע של ששה ימים, כי הסעיף אינו קובע את שבוע העבודה שלו. מי שישווה ימים בימים, בלי להתאים לשבוע העבודה ולהיקף המשרה, ימצא שמדריך בשישית משרה מקבל 4.33 ימים מול 16 עד 28; אבל אלה ימים של משרה מלאה, ולו הם 26 מימי העבודה שלו."
basis = "ours"
lawyer = "MMS-486"
