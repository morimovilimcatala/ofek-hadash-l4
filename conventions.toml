  { l4 = "l4/circulars/2012-13_tashag_09.l4", rule = "the 1994 supplement according to circular תשע\"ג/9" },
]

[[convention]]
id = "reading.role-allowance-kinds"
group = "reading"
title = "לאיזו תוספת אחוזית של סעיף 1.1ו לתקנון שייך כל גמול תפקיד"
value = "רכז פדגוגי — גמול ריכוז; חונך — גמול אימון; מנהל חטיבה צעירה — גמול ניהול"
detail = "סעיף 1.1ו מונה את התוספות האחוזיות ואת האופן שבו כל אחת מותאמת לחלקיות המשרה, אבל נכתב לפני הסכמי אופק חדש של 2017 ו־2022, שקובעים את גמול הרכז הפדגוגי, גמול החונך וגמול ניהול החטיבה הצעירה. הבחירה: גמול הרכז הפדגוגי הוא גמול ריכוז (ריכוז מקצוע, מעבדה, שכבה וחברתי), גמול החונך הוא גמול אימון (כך התקנון קורא לו ב־ו.1), וגמול ניהול החטיבה הצעירה הוא גמול ניהול — שלושתם ב־ו.1, משולמים כמו למשרה מלאה החל משליש משרה. מספר גמולי התפקיד אינו תוספת."
basis = "ours"
