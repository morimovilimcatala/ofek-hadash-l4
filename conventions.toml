[[convention]]
id = "instruments.hours-law-teaching"
group = "instruments"
title = "חוק שעות עבודה ומנוחה ועובד הוראה: על מי הוא חל ואילו שעות הוא מונה"
value = "חוק שעות עבודה ומנוחה חל על העסקתו של עובד הוראה, וסעיף 30(א) אינו מוציא אותו — למעט מנהל בית ספר ומפקח, שתפקידם נקרא תפקיד הנהלה (30(א)(5)); שעות העבודה שהחוק מונה לו הן השעות שהמשרה קובעת לו במוסד החינוכי (פרונטליות, פרטניות ושהייה) וכל שעה שהוא נדרש בה עם תלמידים מחוצה לו, ואילו עבודה שהוא עושה בביתו, שאיש אינו קובע את זמנה ואינו מפקח עליה, אינה נמנית"
detail = "סעיף 30(א) לחוק אינו חל על העסקתם של עובדים בתפקידי הנהלה או אמון אישי מיוחד (5), ושל עובדים שתנאי עבודתם \"אינם מאפשרים למעסיק כל פיקוח על שעות העבודה והמנוחה שלהם\" (6); סעיף 31 עושה את עובד המדינה ככל עובד, ו־30(א)(2) מוציא רק עובד מדינה שתפקידו מחייב לעמוד לרשות העבודה גם מחוץ לשעות הרגילות. החוק אינו אומר דבר על עובד הוראה, שמשרתו היא שעות במערכת השעות של בית הספר ובחלקה — במבנה שלפני הרפורמות — גם עבודה בבית. הבחירה היא שהחוק חל עליו: שעותיו במוסד נקבעות במערכת, והוא חייב להיות במוסד בכל ימי הלימודים (התקנון, סעיף 1.25.1, כללי 3), כך שהמעסיק מפקח עליהן ו־30(א)(6) אינו חל; ועובד הוראה מן השורה אינו בתפקיד הנהלה. החוק מונה את \"הזמן שבו עומד העובד לרשות העבודה\", ולכן נמנות השעות שהמשרה קובעת במוסד וכל שעה שהעובד נדרש בה עם תלמידים מחוצה לו, ואילו עבודה בבית — שאין מי שקובע את זמנה — אינה נמנית. מנהל בית ספר ומפקח נקראים בעלי תפקידי הנהלה, והחוק אינו נבחן מולם. המסמכים שבקורפוס קוראים כך את עצמם: הסכם עוז לתמורה מחיל את החוק על מורה שמועסק מעבר למשרה (סעיף 14(ח)) ומבקש לפי סעיף 5 לחוק את אישור השר ליום של 9 שעות (סעיף 62); חוזר תשפ\"ב/3 אוסר להשלים שעות \"בשעות נוספות כמשמעותן בחוק\"; התקנון נותן שעת הנקה \"בנוסף להפסקות על פי שעות עבודה ומנוחה\" (1.25.5) ומשלם למדריך של\"ח בשבת את התוספת \"לפי חוק שעות עבודה ומנוחה\" (6.17.7). השאלה לעורך הדין: אם בית הדין יקרא את 30(א)(6) כמוציא עובדי הוראה משום שחלק מעבודתם נעשה בבית, ואם ליווי תלמידים מחוץ למוסד הוא כולו שעות עבודה. מי שיקרא את החוק כאינו חל על עובדי הוראה לא ימצא כאן רצפה, והחריגות שנמצאו מולו בטלות."
basis = "ours"
lawyer = "MMS-486"
