[[convention]]
id = "instruments.section-29-approval"
group = "instruments"
title = "חוזר לבעלויות שמשלם יותר מההסכם, וסעיף 29 לחוק יסודות התקציב"
value = "שיטת החישוב של משרד האוצר היא אישור שר האוצר, והעודף אינו בטל"
detail = "סעיף 29(א) לחוק יסודות התקציב אוסר על גוף מתוקצב או גוף נתמך — והבעלויות על בתי הספר העל־יסודיים הן כאלה — לשלם שינוי בשכר אלא כפי שהוסכם או הונהג לגבי כלל עובדי המדינה או באישור שר האוצר, וסעיף 29(ב) מבטל הסדר נוגד במידה שהוא נוגד. חוזר תשס\"ט/3 מוסר את שיטת החישוב (התוספת לחלק ל־1.04, מודפסת בשתי ספרות) כ\"הוראות משרד האוצר\", לפי מכתבו של סגן בכיר לממונה על השכר מיום 7.12.2008; חוזר תש\"ע/2 ממשיך אותו לשלב הבא באותה שיטה ואינו מזכיר את האוצר. הבחירה: השיטה אושרה בידי האוצר, ולכן השיעור המעוגל של תש\"ע/2 (4.81%) אינו בטל לפי סעיף 29(ב), והוא עומד לפי סעיף 22 (instruments.favourable-circular). אם האישור לא חל על השלב השני, העודף מעל 5% לחלק ל־1.04 בטל, והסכום הוא כלל ההסכם."
basis = "ours"
lawyer = "MMS-528"
applies = [
  { l4 = "l4/circulars/2009-10_tasha_02.l4", rule = "the phase C completion" },
  { l4 = "l4/lib/precedence.l4", rule = "what the employer's term gives under section 29" },
]

[[convention]]
id = "instruments.favourable-circular"
group = "instruments"
title = "חוזר שמשלם יותר מההסכם שהוא מבצע"
value = "השיעור של החוזר חל, לפי סעיף 22"
detail = "סכום או שיעור שחוזר קובע והמעסיק משלם לפיו הוא תנאי של חוזה העבודה. לפי סעיף 22 לחוק הסכמים קיבוציים, תנאי כזה שהוא לטובת העובד, וההסכם אינו אוסר שינוי כזה במפורש, עומד בפני ההסכם; תנאי שאינו לטובת העובד נסוג מפני ההסכם. כך שיעור מעוגל כלפי מעלה בחוזר חל, ושיעור מעוגל כלפי מטה אינו חל. כשהמעסיק גוף מתוקצב או גוף נתמך, העודף עומד רק אם סעיף 29 לחוק יסודות התקציב אינו מבטל אותו (instruments.section-29-approval)."
basis = "ours"
