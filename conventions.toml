[[convention]]
id = "instruments.marital-status-condition"
group = "instruments"
title = "זכות יתר לעובדת שמותנית בנישואים"
value = "סעיף 3(ב) לחוק שוויון ההזדמנויות בעבודה שומר על זכות שמסמך נותן לעובדת על פני עובד; הוא אינו שומר על תנאי של מעמד אישי — נישואים — שממיין את העובדות ביניהן, וזכות כזאת חלה גם על עובדת שאינה נשואה ומצבה זהה"
detail = "סעיף 3(ב) אומר: \"אין בחוק זה כדי לגרוע מזכות יתר המוענקת לעובדת לפי חיקוק, לפי הסכם קיבוצי או לפי חוזה עבודה, ואין רואים זכות כזו כהפליה\". זכות שמסמך נותן ל\"עובדת נשואה, שבעלה...\" היא זכות יתר לעובדת כלפי עובד, וסעיף 3(ב) שומר עליה (המוסכמה instruments.parenthood-right). אבל היא גם מבחינה בין עובדת נשואה לעובדת שבן זוגה ידוע בציבור או שהיא נשואה לאישה, ומעמד אישי הוא אחד הטעמים שסעיף 2(א) מונה. הבחירה היא לקרוא את סעיף 3(ב) כשומר על ההבחנה בין המינים בלבד: מה שהוא מתיר הוא לתת לעובדת יותר מלעובד, ולא לתת לעובדת אחת פחות מאחרת בגלל מעמדה האישי. לכן הזכות עומדת כלפי הגברים, וחלה גם על עובדת שאינה נשואה ומצבה זהה — בן זוג שעבר, אישור רשמי על כך. מי שיקרא את 3(ב) כשומר על הזכות על כל תנאיה יגיע לתוצאה אחרת: הזכות לנשואות בלבד תעמוד."
basis = "ours"
lawyer = "MMS-486"
corpus = [
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 1.27.1.3(ב)–(ג)", eId = "chp_1ב__sec_1_27__ssec_1_27_1__para_3__subpara_b", how = "נימוק להעברה לעובדת נשואה שבעלה עבר או הועבר למחוז אחר" },
]
