exceptions = [
  { l4 = "l4/circulars/2013-14_tashad_08.l4", rule = "the reduced allowance", value = "עד 25 שנים כולל את 25", why = "\"עד 25 שנים ( ועד בכלל)\"" },
  { l4 = "l4/agreements/ofek-hadash/2008-12-25_ofek-hadash_base-agreement/base-agreement-15.l4", rule = "a primary grade coordinator's week", value = "\"עד 4 כיתות\" כולל 4", why = "\"עד 4\" היא השורה הראשונה של טבלה שספירתה בכיתות שלמות, והשורה הבאה נפתחת ב־5 (\"5 - 6\", או \"מעל 4\" בסעיף 39): אילו \"עד 4\" לא כלל את 4, שכבה של 4 כיתות לא הייתה באף שורה" },
  { l4 = "l4/agreements/ofek-hadash/2008-12-25_ofek-hadash_base-agreement/base-agreement-17.l4", rule = "a junior-high grade coordinator's week", value = "\"עד 4 כיתות\" כולל 4", why = "\"עד 4\" היא השורה הראשונה של טבלה שספירתה בכיתות שלמות, והשורה הבאה נפתחת ב־5 (\"5 - 6\", או \"מעל 4\" בסעיף 39): אילו \"עד 4\" לא כלל את 4, שכבה של 4 כיתות לא הייתה באף שורה" },
  { l4 = "l4/agreements/ofek-hadash/2008-12-25_ofek-hadash_base-agreement/base-agreement-39.l4", rule = "the role rate", value = "ממונה שכבה \"עד 4 כיתות בשכבה\" כולל 4", why = "\"עד 4\" היא השורה הראשונה של טבלה שספירתה בכיתות שלמות, והשורה הבאה נפתחת ב־5 (\"5 - 6\", או \"מעל 4\" בסעיף 39): אילו \"עד 4\" לא כלל את 4, שכבה של 4 כיתות לא הייתה באף שורה" },
  { l4 = "l4/agreements/ofek-hadash/2008-12-25_ofek-hadash_base-agreement/base-agreement-15.l4", rule = "a group for individual hours in a primary school", value = "\"עד 5 תלמידים\" כולל 5", why = "גודל קבוצה נספר בתלמידים שלמים, ו\"קבוצה המונה עד 3\" (סעיף 18) היא קבוצה ש־3 תלמידים בה: הסף מתאר את הקבוצה, ואינו גבול שתקופה או סכום מגיעים אליו" },
  { l4 = "l4/agreements/ofek-hadash/2008-12-25_ofek-hadash_base-agreement/base-agreement-17.l4", rule = "a group for individual hours in a junior high school", value = "\"עד 5 תלמידים\" כולל 5", why = "גודל קבוצה נספר בתלמידים שלמים, ו\"קבוצה המונה עד 3\" (סעיף 18) היא קבוצה ש־3 תלמידים בה: הסף מתאר את הקבוצה, ואינו גבול שתקופה או סכום מגיעים אליו" },
  { l4 = "l4/agreements/ofek-hadash/2008-12-25_ofek-hadash_base-agreement/base-agreement-18.l4", rule = "a special-education group for individual hours", value = "\"עד 3 תלמידים\" כולל 3", why = "גודל קבוצה נספר בתלמידים שלמים, ו\"קבוצה המונה עד 3\" (סעיף 18) היא קבוצה ש־3 תלמידים בה: הסף מתאר את הקבוצה, ואינו גבול שתקופה או סכום מגיעים אליו" },
  { l4 = "l4/agreements/ofek-hadash/2008-12-25_ofek-hadash_base-agreement/base-agreement-66.l4", rule = "a Pais cluster's level", value = "\"עד 280 שעות שבועיות\" כולל 280", why = "החלופה השנייה היא \"גדול מ- 280\": אילו \"עד 280\" לא כלל את 280, אשכול של 280 שעות לא היה באף רמה" },
  { l4 = "l4/agreements/ofek-hadash/2022-10-19_ofek-hadash_wage-agreement.l4", rule = "the rate §10 compares", value = "ממונה שכבה \"עד 4 כיתות בשכבה\" כולל 4", why = "\"עד 4\" היא השורה הראשונה של טבלה שספירתה בכיתות שלמות, והשורה הבאה היא \"מעל 4\": אילו \"עד 4\" לא כלל את 4, שכבה של 4 כיתות לא הייתה באף שורה (כמו בסעיף 39(א)(9) להסכם אופק חדש)" },
  { l4 = "l4/agreements/ofek-hadash/2022-10-19_ofek-hadash_wage-agreement.l4", rule = "a teacher may leave these hours undone after a preparation day", value = "\"עד שעתיים\", \"עד ארבע שעות\" ו\"עד 6 שעות\" כוללים את המספר", why = "\"עד שעתיים\", \"עד ארבע שעות\" ו\"עד 6 שעות\" הם תקרה של שעות שמותר לא לבצע, לא סף שתקופה מגיעה אליו; סעיף 14.1 עצמו מסכם \"שעתיים ... ובנוסף עד 4 שעות ... סך הכל עד 6\", כלומר המספרים נכללים" },
  { l4 = "l4/agreements/ofek-hadash/2022-10-19_ofek-hadash_wage-agreement.l4", rule = "the activity hours a meeting before the opening of the school year counts for", value = "\"עד 3 שעות\" כולל 3", why = "\"(עד 3 שעות)\" היא תקרת השעות שמפגש נמנה בהן, לא סף; מפגש של שלוש שעות הוא בדיוק המקרה שהמילים מתארות" },
  { l4 = "l4/agreements/ofek-hadash/2007-09-10_ofek-hadash_reform-founding-agreement.l4", rule = "a group for individual hours", value = "\"עד 5 תלמידים\" כולל 5", why = "גודל קבוצה נספר בתלמידים שלמים, ו\"קבוצת תלמידים (עד 5 תלמידים)\" מתארת קבוצה שיש בה עד חמישה; קבוצה של חמישה היא בדיוק המקרה שהמילים מתארות" },
  { l4 = "l4/agreements/ofek-hadash/2007-09-10_ofek-hadash_reform-founding-agreement.l4", rule = "hours of the activity a half-year at most of 10.9.2007", value = "\"עד 4\", \"עד 8\" ו\"עד 6 שעות במחצית\" כוללים את המספר", why = "אלה תקרות של שעות שמשולמות, וסכומן 18 הוא התקרה ש־21(א) קובעת ל\"מספר שעות שלא יעלה על 18\"" },
  { l4 = "l4/agreements/ofek-hadash/2008-12-25_ofek-hadash_base-agreement/base-agreement-15.l4", rule = "work meetings a week at most, in a primary school", value = "\"עד 2 שעות שבועיות\" כולל 2", why = "זו תקרת השעות של ישיבות עבודה מתוך שעות השהייה, לא סף" },
  { l4 = "l4/agreements/ofek-hadash/2012-02-29_ofek-hadash_amendment_hascam-hashlama.l4", rule = "the complexity level of a farm or marine centre", value = "\"עד 175\" כולל את 175", why = "השורה הבאה נפתחת ב־\"176\" בטבלה שספירתה בשעות תקן שלמות: אילו \"עד 175\" לא כלל את 175, חווה של 175 שעות לא הייתה באף רמה" },
  { l4 = "l4/agreements/ofek-hadash/2021-06-17_ofek-hadash_gan-cluster-managers.l4", rule = "the cluster-management allowance rate on", value = "\"עד 6 גנים\" כולל 6", why = "\"עד 6 גנים\" היא השורה הראשונה של טבלה שספירתה בגנים שלמים, והשורה הבאה נפתחת ב־\"7 גנים ומעלה\": אילו \"עד 6\" לא כלל את 6, אשכול של שישה גנים לא היה באף שורה" },
  { l4 = "l4/agreements/ofek-hadash/2021-06-17_ofek-hadash_gan-cluster-managers_special-education.l4", rule = "the special-education cluster-management allowance rate", value = "\"עד 6 גנים\" כולל 6", why = "\"עד 6 גנים\" היא השורה הראשונה של טבלה שספירתה בגנים שלמים, והשורה הבאה נפתחת ב־\"7 גנים ומעלה\": אילו \"עד 6\" לא כלל את 6, אשכול של שישה גנים לא היה באף שורה" },
  { l4 = "l4/agreements/ofek-hadash/2023-08-06_ofek-hadash_ulpan-teachers-application.l4", rule = "further frontal hours an ulpan principal may ask for", value = "\"עד 3 שעות פרונטאליות\" כולל 3", why = "זו תקרת השעות שמנהל האולפן רשאי לבקש, לא סף שתקופה או סכום מגיעים אליו; בקשה לשלוש שעות היא בדיוק המקרה שהמילים מתארות" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-9.l4", rule = "an Oz individual-hours group", value = "\"עד 3 תלמידים\" ו\"עד 5 תלמידים\" כוללים את המספר", why = "גודל קבוצה נספר בתלמידים שלמים, ו\"קבוצה של עד 3 תלמידים\" מתארת קבוצה שיש בה עד שלושה; קבוצה של שלושה היא בדיוק המקרה שהמילים מתארות (כמו בסעיפים 15 ו־17 להסכם אופק חדש)" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-11.l4", rule = "section 11(ד) spares the Ministry's approval", value = "\"עד היקף משרה של 107%\" כולל 107%", why = "107% הוא היקף המשרה שסעיף 11(ב) עצמו נותן למורה אם במשרה מלאה; ההבהרה \"למען הסר ספק\" נועדה לו בדיוק" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-11.l4", rule = "a mother's change of position founds a claim", value = "\"שינויים של עד 3%\" כוללים שינוי של 3%", why = "זו תקרת השינוי שאינו מקים טענה, לא סף שתקופה או סכום מגיעים אליו; שינוי של שלוש נקודות הוא בדיוק המקרה שהמילים מתארות" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-13.l4", rule = "a part-time teacher's change of position founds a claim", value = "\"שינויים של עד 1%\" כוללים שינוי של 1%", why = "זו תקרת השינוי שאינו מקים טענה, לא סף שתקופה או סכום מגיעים אליו; שינוי של נקודה אחת הוא בדיוק המקרה שהמילים מתארות" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-14.l4", rule = "within section 14(א)'s full position", value = "\"עד 100% בלבד\" כולל משרה מלאה", why = "משרה של 100% היא המשרה המלאה שעליה בנוי שבוע העבודה של הרפורמה (סעיף 9(א)); \"בלבד\" אוסר את מה שמעבר לה, לא אותה" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-17.l4", rule = "a rate a subject coordinator outside English and mathematics may have", value = "\"5% עד 7%\" כולל 7%", why = "טווח שיעורים: שני קצותיו הם שיעורים שהגמול יכול לקבל, כמו \"בשיעור של 5% עד 9%\" של היועץ החינוכי באותה טבלה" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-17.l4", rule = "a rate an educational counsellor may have", value = "\"5% עד 9%\" כולל 9%", why = "טווח שיעורים: שני קצותיו הם שיעורים שהגמול יכול לקבל" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-22.l4", rule = "frontal hours an Oz principal may teach", value = "\"3 עד 6 שעות שבועיות\" כולל 6", why = "טווח של שעות: שני קצותיו הם מספרי שעות שהמנהל יכול ללמד, כמו \"5% עד 7%\" ו־\"5% עד 9%\" בטבלת סעיף 17" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-26.l4", rule = "a change of position between stages founds a claim", value = "\"שינויים של עד 1%\" כוללים שינוי של 1%", why = "זו תקרת השינוי שאינו מקים טענה, כמו בסעיף 13(ב); שינוי של נקודה אחת הוא בדיוק המקרה שהמילים מתארות" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-26.l4", rule = "a mother's change of position between stages founds a claim", value = "\"שינויים של עד 3%\" כוללים שינוי של 3%", why = "זו תקרת השינוי שאינו מקים טענה, כמו בסעיף 11(ו); שינוי של שלוש נקודות הוא בדיוק המקרה שהמילים מתארות" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-26.l4", rule = "section 26(ו) spares the Ministry's approval in", value = "\"עד היקף משרה של 108.6%\" (108.3%, 107.6%) כולל את המספר", why = "כל תקרה היא היקף המשרה שסעיף 26(ה) נותן באותה שנה למורה אם במשרה מלאה, כמו 107% בסעיף 11(ד)" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-36.l4", rule = "a share section 36(ב) allows", value = "\"עד 40% מבתי הספר\" כולל 40%", why = "ארבע העשיריות שבטבלת סעיף 36(ב) מגיעות ל־40%, וסעיף-קטן (ג) מגדיל את הסכומים רק כשנמצאו \"פחות מ־40%\": אילו \"עד 40%\" לא כלל את 40%, העשירית הרביעית לא הייתה מלאה לעולם" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-53.l4", rule = "within section 53's number in", value = "\"עד 1500 עובדי הוראה\" כולל 1500", why = "זה המספר הגדול ביותר של עובדי הוראה שהסעיף מתיר להעסיק בחוזה אישי-מיוחד בשנת לימודים, תקרה של ספירת אנשים ולא סף שמגיעים אליו; 1,500 עובדים הם בדיוק המקרה שהמילים מתארות" },
  { l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-annex-h.l4", rule = "the examination period is within stage ב's range", value = "\"3 עד 4 חודשים\" כולל את 4", why = "טווח שהטקסט נותן לתקופה שהמנהל קובע, ששני קצותיו בתוכו, כמו \"3 עד 6\" של סעיף 22(ד)" },
  { l4 = "l4/agreements/oz-latmura/2013-05-28_oz-latmura_vaadat-higui-decision.l4", rule = "section 26(ו) spares the Ministry's approval, as the 2013 decision amends it, in", value = "\"עד היקף משרה של 138.6%\" (139.3%, 124.6%, ו־135.6% באישור) כולל את המספר", why = "כל תקרה היא ההיקף המירבי של סעיף 27 בנוסחו החדש לאותה שנה ועוד השלב של סעיף 26(ה), כמו 107% בסעיף 11(ד)" },
  { l4 = "l4/agreements/oz-latmura/1994-08-31_oz-latmura_wage-supplements-1994.l4", rule = "the 1994 Oz inflation compensation rate for", value = "\"ועד לתקרה של 15%\" כולל 15%", why = "זו תקרת האינפלציה שמפוצה, לא סף שמגיעים אליו: אינפלציה של 15% מפוצה במלואה, ומה שמעליה אינו מוסיף, כמו \"עד 1500\" בסעיף 53 להסכם עוז לתמורה" },
  { l4 = "l4/agreements/teachers-general/1993-05-11_histadrut-hamorim_wage-agreement-1993.l4", rule = "the position a 1993 study-fund contribution is made on", value = "\"עד למשרה וחצי\" כולל משרה וחצי", why = "זו תקרת ההפרשה, לא סף שמגיעים אליו: מורה במשרה וחצי מפריש על כולה, ומי שמעליה מפריש עד אליה" },
  { l4 = "l4/agreements/teachers-general/1993-05-11_histadrut-hamorim_wage-agreement-1993.l4", rule = "owed the 1993 mother-teacher supplement", value = "\"(עד 140%)\" כולל 140%", why = "140% הוא ההיקף המרבי שבו מותר להעסיק עובד הוראה (סעיף 1.24.1.2(א) לתקנון); הסוגריים מתארים את טווח ההעסקה לפי דרישת המעסיק, ואמא שהמעסיק דרש ממנה את המרב היא בדיוק המקרה שהמילים מתארות" },
  { l4 = "l4/takam/2008-08-01_takam_H-13-4-7_telefon-kavi-ishi_v1.l4", rule = "within the bureau's three landline aides", value = "\"עד 3 עוזרים בלשכה\" כולל את העוזר השלישי", why = "זו תקרה של ספירת אנשים שהלשכה רשאית לזכות, לא סף שמגיעים אליו; לשכה ששלושה עוזרים בה היא בדיוק המקרה שהמילים מתארות, כמו \"עד 1500 עובדי הוראה\" בסעיף 53 להסכם עוז לתמורה" },
]

[[convention]]
id = "thresholds.shared-bound"
group = "thresholds"
