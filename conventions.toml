[[convention]]
id = "dates.undated-amendment"
group = "dates"
title = "תיקון שאינו קובע לעצמו תחילה"
value = "חל מיום החתימה, אלא אם מילותיו מדברות בתקופה קודמת"
detail = "כשמסמך מתקן קובע תחילה לחלק מהוראותיו ('תחילתו של סעיף זה בשנת הלימודים תשע\"ב') ואינו קובע לאחרות, הוראה שלא נקבעה לה תחילה חלה מיום חתימת המסמך, ונבדקת מול האירוע שהיא מסדירה (dates.commencement-event): יום העבודה או התשלום, יום הזכאות, פתיחת שנת הלימודים שבה עובד מצטרף. הוראה שמילותיה עצמן מדברות בתקופה שקדמה לחתימה — שנה מודפסת בטבלה, מענק ששולם לפניה, 'לא חל כל שינוי' מאז יום מסוים — חלה על אותה תקופה. כך החלטת ועדת ההיגוי של עוז לתמורה מיום 28.5.2013: סעיפים 5(ב) ו־6(ג) שלה חלים מתשע\"ב, סעיפים 13, 14 ו־16 לפי השנים והתקופה שהם נוקבים בהן, והשאר — כגון גמול סגן המנהל של סעיף 7 ובסיס תוספת המעבר של סעיף 11 — מיום ההחלטה. החלטת ועדת היגוי מיום 24.12.2013, שחוזר תשע\"ד/2 מביא ושאינה בקורפוס, החילה את סעיף 11 מתחילת הרפורמה: כלומר, בלעדיה לא חל מתחילתה."
basis = "ours"
lawyer = "MMS-486"
applies = [
  { l4 = "l4/agreements/oz-latmura/2013-05-28_oz-latmura_vaadat-higui-decision.l4", rule = "an undated section of the 2013 decision governs on" },
  { l4 = "l4/agreements/oz-latmura/2013-05-28_oz-latmura_vaadat-higui-decision.l4", rule = "an undated section of the 2013 decision governs the school year" },
  { l4 = "l4/agreements/oz-latmura/2013-05-28_oz-latmura_vaadat-higui-decision.l4", rule = "what sets the contributions on pay beyond a full position, by the 2013 decision, on" },
  { l4 = "l4/agreements/oz-latmura/2013-05-28_oz-latmura_vaadat-higui-decision.l4", rule = "entitled to the section 40 grant, as the 2013 decision amends (ה)" },
]
exceptions = [
  { l4 = "l4/circulars/2013-14_tashad_02.l4", rule = "section 12 of circular תשע\"ד/2 governs on", value = "סעיף 11 להחלטה (תוספת המעבר לרפורמה) חל מיום תחילת הרפורמה, 1.9.2011, ולא מיום ההחלטה", why = "\"הערה: בהתאם להחלטת ועדת היגוי מיום 24.12.2013, הוחלט כי תחולת סעיף זה הינה מיום תחילת רפורמת עוז לתמורה\" (חוזר תשע\"ד/2, סעיף 12)" },
]

