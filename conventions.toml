[[convention]]
id = "reading.role-table-column"
group = "reading"
title = "בעל תפקיד שטבלה הבנויה לפי תפקידים אינה נותנת לו טור"
value = "בטור של בעלי התפקידים שאינם מחנכים (טור הרכזים); ומי שבשני טורים — הגבוה מביניהם"
detail = "טבלת נקודות הזכות בגין הערכה בסעיף 20(ב) להסכם עוז לתמורה, ובנוסחה החדש בסעיף 10 להחלטת ועדת ההיגוי מיום 28.5.2013 (שחוזר תשע\"ד/2 מפרסם בסעיף 11 שלו), בנויה משלושה טורים: מחנך; שישה רכזים בשמם; ו\"מורה שאינו בעל תפקיד\". סגן מנהל, יועץ חינוכי, מורה שהמנהל הטיל עליו משימות ו\"כל בעל תפקיד שהוא אינו מהמנויים לעיל\" הם בעלי תפקיד (סעיף 17 להסכם, וטבלת סעיף 17(ד) בנוסח ההחלטה מונה אותם בשמם), ואינם באף טור. הפתיח של 20(ב) מזכה בנקודות את \"המורים אשר תוצאות ההערכה לגביהם הינן הגבוהות ביותר\" — 30% ממורי בית הספר — והטבלה קובעת רק כמה; לכן המילים תומכות בכך שבעל תפקיד כזה זכאי לנקודות, ואינן אומרות באיזה טור. הבחירה: הוא בטור הרכזים, טור בעלי התפקידים שאינם מחנכים; ומורה שתפקידיו מציבים אותו בשני טורים (מחנך שהוא גם רכז) מקבל את הנקודות הגבוהות מביניהם, כפי שסעיף 20(א)(2) קובע לנקודות בשל תפקיד. הקריאה החלופית — שהטבלה מוחלת כפי שהיא מודפסת ובעל תפקיד מחוץ לטוריה אינו צובר נקודות לפיה — נדחתה, כי היא מוציאה מהזכאות מורים שהפתיח מזכה."
basis = "ours"
