# The conventions: the rules of reading the encoding follows where the text
# does not decide (MMS-485). The client, 2026-10-13/14: "a non interactive
# settings view", "all ambiguities decisions should follow a convention", "maybe
# it should be called conventions". Each value is a current choice, not a
# ruling: change one here, then bring the rules it names and the findings that
# rely on it into line. A finding names the one its reading applies in
# `convention`; the site's "מוסכמות" page lists them under it.
#
#   basis       text | ours: the text decides it, or the encoding chose
#   applies     the L4 rules that apply it: {l4, rule}; tests/test_repo.py holds
#               every rule to a definition in that file
#   exceptions  where the text itself answers the same question otherwise, and why

