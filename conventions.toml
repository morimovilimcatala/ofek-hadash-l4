[[convention]]
id = "instruments.regular-hour-wage"
group = "instruments"
title = "השכר הרגיל לשעה של עובד הוראה, לעניין חוק שעות עבודה ומנוחה"
value = "שעה של השכר הרגיל היא השכר החודשי מחולק בשעות החודש של המשרה המלאה שהמסמך עצמו קובע (בהסכם אופק חדש: 4.33 שבועות כפול 36 שעות, סעיף 31(ב)); כגבול הנדיב ביותר למעסיק נבדק גם חודש של 195 שעות — השבוע הארוך ביותר של סעיף 3, 45 שעות, כפול 52 שבועות חלקי 12. חריגה שנמצאת גם בגבול הזה עומדת בכל קריאה"
detail = "סעיף 16 לחוק משלם את השעות הנוספות כחלק מ\"השכר הרגיל\" לשעה, וסעיף 18 מוסיף לשכר הרגיל כל תוספת. החוק אינו אומר כיצד מחלקים משכורת חודשית של עובד הוראה, שמשרתו נקבעת בשעות שבועיות, לשעות. הבחירה: השעה היא החודש מחולק בשעות החודש של המשרה המלאה כפי שהמסמך החל עליו קובע אותן — כך הסכם אופק חדש עצמו מגדיר את ערך השעה (סעיף 31(ב)) — ולכן שעה של מורה במשרה של 36 שעות שווה יותר משעה בחודש של 45 שעות. כדי שהממצא לא יהיה תלוי בבחירה, כל תשלום נבדק גם מול חודש של 195 שעות, החודש הארוך ביותר שהחוק מתיר, שבו השעה זולה ביותר; מה שחסר גם שם חסר בכל קריאה. כשהתוצאה מתהפכת בין שני המדדים (יום טיול ביום החופשי לפי נספח ה' וסעיף 40(ב)), זו שאלה לעורך הדין, והכרטיס אומר זאת."
