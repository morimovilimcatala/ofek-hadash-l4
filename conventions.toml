[[convention]]
id = "instruments.sick-days-measure"
group = "instruments"
title = "ימי מחלה של משרה מלאה מול ימי חוק דמי מחלה"
value = "ימי מחלה שמסמך צובר כימים של משרה מלאה, לפי היקף המשרה, מושווים ליום וחצי לחודש של סעיף 4 לחוק דמי מחלה בשבועות של מערכת השעות של העובד עצמו: 30 ימים למשרה מלאה הם ארבעה שבועות שלה, ו־18 ימי החוק לשנה הם שלושה שבועות עבודה של ששה ימים"
detail = "סעיף 4 לחוק דמי מחלה צובר יום וחצי לכל חודש עבודה מלא, ולפי סעיף 4(ב) חודש שבו העובד לא עבד בכל ימי העבודה נמנה כמלא ב־25 ימי עבודה — ימי היעדרות של העובד עצמו, שאינם תלויים בהיקף משרתו. חוזר תשע\"ג/5 צובר \"30 ימי מחלה בשנה\" לפי היקף המשרה, עד התקרה: 15 ימים לחצי משרה, 39.3 ל־131% — ימים של משרה מלאה, שהתקנון (סעיף 1.25.3.1(1)ב) והחוזר (סעיף 2א) ממירים לשעות, ארבע פעמים בסיס המשרה. הבחירה היא להשוות את שני הצדדים באותה יחידה, שבועות של מערכת השעות של העובד: משרה עד התקרה צוברת ארבעה שבועות של מערכת שלה, וימי החוק לשנה, 18, הם שלושה שבועות של ששה ימים (או 2.6 שבועות קלנדריים, לפי סעיף 2(ב)(1), שמונה לעובד במשכורת גם ימי מנוחה) — היחידה הקשה מבין השתיים. מי שישווה ימים בימים, בלי להתאים להיקף המשרה, ימצא שחצי משרה צוברת 15 ימים מול 18; אבל אלה ימים של משרה מלאה, ולמורה בחצי משרה הם 30 מימי העבודה שלה. ממילא סעיף 1 לחוק מוציא מגדר \"עובד\" את מי שתשלום ימי המחלה שלו מוסדר בהסכם קיבוצי, כמו המורים (ההסכם מ־1.9.1958), כך שההשוואה אינה מכריעה דבר שהחוק קובע לגביהם."
basis = "ours"
lawyer = "MMS-486"
corpus = [
  { doc = "circulars/2012-13_tashag_05.xml", name = "חוזר לבעלויות תשע\"ג/5", eId = "art_1__para_b", how = "הצבירה נמנית בימים גם מעבר ל־100% משרה, לפי היקף המשרה ועד התקרה" },
]
applies = [
  { l4 = "l4/circulars/2012-13_tashag_05.l4", rule = "weeks of the teacher's own timetable a year's sick days make" },
]

[[convention]]
id = "instruments.health-retirement-dismissal"
group = "instruments"
title = "פרישה מן השירות מטעמי בריאות מול האיסור לפטר עובד חולה"
value = "פרישה של עובד הוראה שנפסל לשירות מטעמי בריאות, בתאריך שהמעסיק קובע, היא פיטורים לעניין סעיף 4א לחוק דמי מחלה"
detail = "סעיף 4א לחוק דמי מחלה אוסר \"לפטר\" עובד שנעדר מעבודתו עקב מחלתו בימי המחלה הצבורים לו, עד 90, וחל גם על עובד שדמי המחלה שלו מוסדרים בהסכם קיבוצי (4א(ג)). סעיף 1.25.3.1(7) בתקנון קובע שמורה שנפסל לשירות מטעמי בריאות מנצל רק חלק מימי המחלה הצבורים (51% עד 99% נכות) או אף אחד מהם (עד 50%), \"והוא יפרוש מן השירות בתאריך שנקבע\". החוק אינו אומר אם פרישה כזאת היא פיטורים. הבחירה היא לקרוא אותה כפיטורים: סיום ההעסקה בא מהחלטת המעסיק ובתאריך שהוא קובע, לא מבחירת העובד, והתקנון עצמו קורא לסיום שירות מטעמי בריאות \"פיטורין מטעמי בריאות\" (סעיף 6.5). מי שיקרא אותה כפרישה לגמלה, שאינה פיטורים, ימצא שסעיף 4א אינו חל, וסעיף 7 עומד כפי שהוא. גם לפי הבחירה, פרישה שההודעה עליה ניתנה לפני שהמורה נעדר בשל מחלתו אינה אסורה (4א(ב)(1))."
basis = "ours"
lawyer = "MMS-486"
corpus = [
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 1.25.3.1(7)", eId = "chp_1ב__sec_1_25__ssec_1_25_3_1/p67", how = "עובד הוראה שנפסל לשירות מטעמי בריאות ונקבעו לו עד 50% נכות יפרוש מן השירות בתאריך שנקבע" },
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 6.5", eId = "chp_6__sec_6_5__hc_2__para_26/p3", how = "פיטורין מטעמי בריאות" },
]
