[[convention]]
id = "instruments.school-recess-as-annual-leave"
group = "instruments"
title = "חופשות מערכת החינוך כחופשה השנתית של חוק חופשה שנתית"
value = "חופשות מערכת החינוך שעובד הוראה מקבל עליהן את משכורתו — חופשת הקיץ וחופשות החגים — הן \"החופשה\" שחוק חופשה שנתית דורש; ימיהן נבחנים מול ימי סעיף 3 לחוק, ודמי החופשה ופדיונה מול סעיפים 10 ו־13"
detail = "חוק חופשה שנתית חל על עובד המדינה ככל עובד (סעיף 33) ואינו מוציא עובד שהסכם קיבוצי מסדיר את חופשתו; הוא נותן 16 עד 28 ימים בשנה, לפי הוותק, וחלק יחסי למי שעבד פחות מ־200 ימים בשנה (או 240, כשהקשר התקיים בחלק מן השנה). התקנון אינו קורא לחופשות בית הספר \"חופשה שנתית\" ואינו מונה לעובד ההוראה ימי חופשה שנתית אחרים: חופשת הקיץ (סעיף 1.25.2) משולמת \"בהתאם להיקף משכורתו ולתקופת עבודתו\", 6 או 7 ימים לכל חודש עבודה, וחופשות החגים (1.25.1) משולמות גם הן. הטקסט אינו אומר אם אלה החופשה שהחוק דורש. הבחירה היא לקרוא אותן כך: הן חופשה בתשלום, שהעובד אינו עובד בה, ניתנת מדי שנה ובשל העבודה בה, ואתר תנאי השירות אומר ש\"חופשת הקיץ היא חלק אינטגרלי של עבודת המורה במשך השנה\". לפי הבחירה, ימי חופשת הקיץ לבדם — 60 או 70 בשנה מלאה — עולים על ימי החוק, ולכן ההשוואה מכריעה במקרי הקצה: מי שעבד חלק קצר מן השנה, ומי שהחוק נותן לו זכות שאינה בימים (היום שהעובד בוחר, סעיף 6(ב)). מי שיקרא את החופשות כפגרה שאינה החופשה השנתית ימצא שהתקנון אינו נותן לעובד ההוראה חופשה שנתית כלל, והחוק חל עליו במלואו מעבר לחופשות."
basis = "ours"
lawyer = "MMS-486"
corpus = [
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 1.25.2", eId = "chp_1ב__sec_1_25__ssec_1_25_2__para_2__subpara_a", how = "עובד הוראה זכאי בחופשת הקיץ לתשלום משכורתו, בהתאם להיקף משכורתו ולתקופת עבודתו במהלך שנת הלימודים" },
