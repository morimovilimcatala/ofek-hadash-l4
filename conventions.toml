[[convention]]
id = "instruments.signed-annex"
group = "instruments"
title = "טבלה שהסכם מצרף כנספח, מול הפרסום של המשרד לאותה טבלה"
value = "הנספח כפי שנחתם"
detail = "כשהסכם מצרף טבלת שכר כנספח, והטבלה שהמשרד מפרסם לאותו קוד ולאותו יום שונה ממנה, חל הנספח כפי שנחתם — גם כשאינו הולך כמו הנספחים שלצדו, וגם כשהסכם מאוחר בנה את הטבלה שלו על הפרסום. נספח חתום אינו מתוקן לפי הדפוס של הנספחים האחרים: תיקון של טעות הוא של הצדדים (כפי שהחלטת ועדת המעקב מיום 14.1.2025 החליפה את טבלאות 1.9.2022 בטבלאות עד האגורה), והסכם מאוחר חל מיומו ואינו חוזר לאחור. כך נספח א'7 להסכם 30.9.2016 (בלתי מוסמך, קוד דירוג 106): הוא מוסיף לדרגה 7 7.8% ולדרגות 8 ו־9 8.5%, כמו נספח א'7 להסכם 22.2.2016, ואילו נספחים א'1–א'6 והטבלה שבאתר תנאי השירות לאותו יום מוסיפים 7.5%. מדרגה 6.5 טבלאות השכר בתוקף קוראות את הנספח, בשקלים שלמים כפי שהוא מדפיס, עד שהסכם 19.10.2022 מחליף אותו מ־1.9.2022."
basis = "ours"
lawyer = "MMS-630"
applies = [
