[[convention]]
id = "precedence.takanon-over-older-circular"
group = "precedence"
title = "התקנון מול חוזר לבעלויות שאינו מאוחר מהסעיף, כשאף הסכם אינו חל על המורה"
value = "התקנון גובר"
detail = "מבוא התקנון (אתר תנאי השירות) אומר שבכל מקום שהתקנון אינו תואם הסכמים קיבוציים, הוראות החוק, חוזרי מנכ\"ל, נהלי המשרד או חוזרים לבעלויות עדכניים יותר, מה שהם אומרים גובר. \"עדכניים יותר\" נקרא על החוזרים לבעלויות בלבד (F-terms-a), ונבחן מול תאריך התיקון של הסעיף שבו מדובר, כפי שהסעיף מדפיס אותו (F-terms-b). הבחירה: חוזר לבעלויות שאינו מאוחר מהתיקון האחרון של הסעיף אינו גובר עליו; וכשאף מקור שגובר על התקנון אינו מדבר על המורה — אין הסכם קיבוצי שחל עליו (instruments.agreement-scope) — התקנון גובר על החוזר, גם כשמעסיקו בעלות ולא המדינה: סעיף 1.1 אינו מונה מעסיק, והוא מדבר על כל עובד הוראה. כך תוספת 2008: סעיף 1.1 עודכן ב־2.2.2010, וחוזרי תשס\"ט/3 (14.12.2008) ותש\"ע/2 (15.12.2009) קודמים לו; למורה של בעלות שאינו בתחולת הסכם ארגון המורים — מעסיקו אינו רשות מקומית, או שאינו מיוצג בידי הארגון — השורש מכריע לפי השיעור של התקנון על השכר המשולב של היום, ולא לפי החוזר. אם חוזר לבעלויות גובר על התקנון בכל מועד, או שהתקנון אינו חל על עובד של בעלות, החוזר הוא שקובע."
