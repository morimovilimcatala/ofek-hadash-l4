detail = "סכום או שיעור שחוזר קובע והמעסיק משלם לפיו הוא תנאי של חוזה העבודה. לפי סעיף 22 לחוק הסכמים קיבוציים, תנאי כזה שהוא לטובת העובד, וההסכם אינו אוסר שינוי כזה במפורש, עומד בפני ההסכם; תנאי שאינו לטובת העובד נסוג מפני ההסכם. כך שיעור מעוגל כלפי מעלה בחוזר חל, ושיעור מעוגל כלפי מטה אינו חל. כשהמעסיק גוף מתוקצב או גוף נתמך, העודף עומד רק אם סעיף 29 לחוק יסודות התקציב אינו מבטל אותו (instruments.section-29-approval)."
