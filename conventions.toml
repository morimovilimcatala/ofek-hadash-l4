group = "reading"
title = "הפניה לסעיף שעוסק בעניין אחר"
value = "הסעיף שהמשפט עוסק בעניינו, כשאחד מסעיפי ההסכם הוא בבירור הסעיף הזה; כשגם הסעיף המודפס מתיישב עם המשפט — כפי שהודפס"
detail = "כשהפניה פנימית מודפסת בבירור (אין טעות העתקה) אבל הסעיף שהיא מונה עוסק בעניין אחר מזה של המשפט המפנה, וסעיף אחר של אותו הסכם הוא בבירור הסעיף שהמשפט עוסק בו — ההפניה נקראת כמפנה לסעיף ההוא. כשגם הסעיף המודפס מתיישב עם עניין המשפט, ההפניה נקראת כפי שהודפסה. בהסכם המכללות מיום 22.5.1997: סעיף 13.ג.4 (ותק לצבירה לגמלאות) מפנה ל־11.ז (ערך שעה והפרשות סוציאליות) ונקרא כמפנה ל־11.ט (פנסיה תקציבית); סעיף 16.א (מי קובע את הדרגות) מפנה לסעיף 7 (חריגים) ונקרא כפי שהודפס, כי הוא מתיישב עמו (ספק, מול סעיף 6); סעיף 14.יט מפנה ל\"ס\"ק א\" (לוח הזמנים) לעניין המכסות ונקרא כמפנה לסעיף 6.א, כמו המשפט המקביל בסעיף 5.ה. כך גם בהפניה לסעיף של הסכם אחר: בשטר הבוררות מיום 1.2.2007, סעיף 4.1 מייחס את מאגר נתוני השחיקה ל\"סעיף 5\" להסכם 11.5.93 (תוספת 1993), ונקרא כמפנה לסעיף 8(ב)(5) שבו הוקם המאגר. השאלה לעורך הדין: האם כל אחת מן ההפניות מכוונת לסעיף שנבחר."
