[[convention]]
id = "instruments.equal-pay-teaching"
group = "instruments"
title = "חוק שכר שווה ועובדי הוראה: מהי אותה עבודה, איך נקראת הוראה שנכתבה בלשון מין אחד, ומה נשקל מול סעיף 2"
value = "עובדת ועובד הוראה באותה דרגה, באותו ותק, באותו היקף משרה ובאותו תפקיד, אצל אותו מעסיק, עושים אותה עבודה; הוראה שנכתבה בלשון מין אחד (\"על שם אשתו\") נקראת לשני המינים; וגמול אחר שמסמך נותן לבני מין אחד ולא לבני המין האחר באותו גיל ובאותה עבודה — שלא בקשר להולדה או להורות — נשקל מול סעיף 2 גם כשסעיף 3(ב) לחוק שוויון ההזדמנויות שומר אותו מלהיות הפליה לפי אותו חוק, ומי שמקבל פחות זכאי למה שמקבל האחר"
detail = "סעיף 2 לחוק שכר שווה מזכה עובדת ועובד אצל אותו מעסיק באותו מקום עבודה בשכר שווה ובגמול אחר שווה בעד אותה עבודה, וסעיף 6 מתיר הפרש רק כשהוא נובע מאופי העבודה (תפוקה, איכות, ותק, השכלה, מיקום) ולא מטעמי מין. החוק אינו אומר מה היא אותה עבודה בהוראה; הבחירה היא שטבלאות השכר — לפי דרגה, ותק והיקף משרה — הן שמגדירות אותה, ולכן שני עובדי הוראה באותה שורה של הטבלה ובאותו תפקיד עושים אותה עבודה. הוראה בתקנון שכתובה בלשון זכר או נקבה (\"רכב הרשום על שמו או על שם אשתו\", סעיפים 1.15.4.3, 7.3.6.3, 7.6.6.3) נקראת לשני המינים, כפי שחוק הפרשנות קורא חיקוק, וכך היא עומדת בסעיף 2. הטבה בקשר להולדה או להורות (משרת אם, תוספת אם, השתתפות במעון) אינה נשקלת כאן (סעיף 13), והיא נשקלת מול חוק שוויון ההזדמנויות (המוסכמה instruments.parenthood-right). גמול אחר שמסמך נותן לנשים ולא לגברים, או להפך, באותו גיל ובאותה עבודה — כמו מסלולי הפרישה המוקדמת של חוזר תשפ\"א/6 — נשקל מול סעיף 2: סעיף 3(ב) לחוק שוויון ההזדמנויות שומר זכות יתר לעובדת \"אין בחוק זה\", כלומר לעניין אותו חוק בלבד, ולחוק שכר שווה אין סייג כזה; מי שמקבל פחות זכאי למה שמקבל האחר, והחוק אינו מוריד את מי שמקבל יותר. הבחנה שחוק עצמו עושה והמסמך רק מצטט אותה (הגילים 60 ו־65 שסעיף 11(ה) לחוק פיצויי פיטורים קבע לפני חוק גיל פרישה, התשס\"ד-2004, כפי שסעיף 1.28.2.2 לתקנון מצטט אותו; היום הסעיף מפנה לגיל הפרישה שחוק גיל פרישה קובע, גם הוא לפי מין) אינה של המסמך ואינה נשקלת. השאלה לעורך הדין: אם בית הדין יקרא את סעיף 3(ב) לחוק שוויון ההזדמנויות, או את גיל הפרישה השונה שבחוק גיל פרישה, כמתירים גמול שונה לנשים ולגברים לפי חוק שכר שווה."
basis = "ours"
lawyer = "MMS-486"
corpus = [
  { doc = "circulars/2020-21_tashpa_06.xml", name = "חוזר לבעלויות תשפ\"א/6", eId = "hc_1/p6", how = "מסלול ב' לעובדות הוראה מגיל 55, ולעובדי הוראה מגיל 58" },
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 7.3.6.3", eId = "chp_7__sec_7_3__ssec_7_3_6_3__para_1", how = "רכב הרשום על שמו או על שם אשתו נקרא גם על שם בעלה" },
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 1.28.2.2", eId = "chp_1ב__sec_1_28__ssec_1_28_2_2/p55", how = "הגילים 60 ו־65 הם של חוק פיצויי פיטורים כנוסחו לפני 2004, והתקנון מצטט אותם" },
]
applies = [
  { l4 = "l4/circulars/2020-21_tashpa_06.l4", rule = "a man of 55 to 57 is given track A where a woman is given track B, which section 2 of the Equal Pay Law does not allow" },
  { l4 = "l4/takanon/takanon-sherut-ovdei-horaa/7.3.l4", rule = "the car refund read for both sexes meets section 2 of the Equal Pay Law" },
  { l4 = "l4/agreements/ofek-hadash/2021-06-17_ofek-hadash_gan-cluster-managers.l4", rule = "the cluster allowance meets section 2 of the Equal Pay Law" },
  { l4 = "l4/agreements/ofek-hadash/2021-06-17_ofek-hadash_gan-cluster-managers_special-education.l4", rule = "the special-education cluster allowance meets section 2 of the Equal Pay Law" },
  { l4 = "l4/agreements/ofek-hadash/2023-08-06_ofek-hadash_ulpan-teachers-application.l4", rule = "the evening supplement meets section 2 of the Equal Pay Law" },
]

[[convention]]
id = "instruments.notice-law-teaching"
group = "instruments"
title = "חוק הודעה מוקדמת ועובדי הוראה: מתי נכנסים לתוקף פיטורים שהתקנון קובע להם מועד, מי עובד במשכורת, והודעת התפטרות ארוכה מן החוק"
value = "פיטורי עובד הוראה שהתקנון או ההסכם קובעים להם מועד אחרון להודעה (31 במאי, 30 ביוני) נכנסים לתוקף ב־1 בספטמבר שאחריו, וההודעה המוקדמת שהחוק מונה היא מיום מסירת מכתב הפיטורים ועד אותו יום; עובד הוראה שמשכורתו לפי דרגה וותק הוא \"עובד במשכורת\" (סעיף 3), ומי ששכרו לפי שעות הוא \"עובד בשכר\" (סעיף 4); העסקה לתקופה שנקבעה מראש מסתיימת בתומה בלי הודעה, שכן התקופה עצמה היא ההודעה; והודעת התפטרות ארוכה מזו שהחוק מחייב שמסמך דורש מעובד ההוראה אינה נופלת מן הרצפה"
detail = "החוק קובע את אורך ההודעה לפי חודשי העבודה ואת חובת הכתב (סעיפים 2–5), אבל לא אומר מתי נכנסים לתוקף פיטורים של עובד הוראה, שמערכת החינוך מפטרת בסוף שנת לימודים. התקנון קובע מועד אחרון למשלוח מכתב הפיטורים (1.28.2.1(ג), 3.5(ה)(8), 5.5, 6.5(6)), וסעיף 6.5 מנסח את הכלל הנהוג במערכת: \"יש להודיע לעובד הוראה על פיטוריו עד לתאריך ה־31 במאי של שנה פלונית. הפיטורים נכנסים לתוקפם ביום ה־1 בספטמבר שלאחר מכן\". הבחירה היא שכל פיטורים שהתקנון או הסכם קובעים להם מועד הודעה בסוף שנת הלימודים נכנסים לתוקף ב־1 בספטמבר שאחריו, וכך נמנית ההודעה: מיום המכתב ועד אותו יום — 93 ימים מ־31 במאי, 63 מ־30 ביוני, יותר מחודש לכל ותק. מי עובד במשכורת ומי עובד בשכר החוק משאיר לסעיף 12 לחוק פיצויי פיטורים (משכורת לפי חודש או תקופה ארוכה יותר); עובד הוראה שמשולמת לו משכורת לפי דרגה וותק — ובכללו ממלא מקום שהועסק יותר מ־51 ימי עבודה רצופים או יותר מחודשיים (התקנון, 1.30) — הוא עובד במשכורת. העסקה לתקופה מוגדרת מראש (6.5(7)(ג)) מסתיימת בתום התקופה, שהעובד ידע מראשיתה, ואין בה פיטורים שהחוק מחייב בהם הודעה. החוק חל גם על התפטרות (סעיף 5), אבל אינו אומר שמסמך אינו רשאי לבקש מהעובד הודעה ארוכה יותר: סעיף 12 שומר על זכויות העובד, וההודעה שהעובד חייב בה אינה זכות שלו. לכן חודשיים (1.28.1) או חודש (1.39) שהתקנון מבקש מהמורה אינם נופלים מן הרצפה, וחובת הפיצוי שהעובד חייב בה אם לא נתן הודעה נשארת זו של סעיף 7(ב). השאלה לעורך הדין: אם בית הדין ימנה את ההודעה עד 1 בספטמבר גם כשהתקנון אומר רק \"מועד אחרון לפיטורין\", ואם יאכוף על עובד הוראה הודעת התפטרות ארוכה מזו שבחוק."
basis = "ours"
lawyer = "MMS-486"
corpus = [
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 6.5.27(ב)(ב)", eId = "chp_6__sec_6_5__hc_2__para_27__subpara_b__cls_b", how = "הודעה עד 31 במאי, והפיטורים נכנסים לתוקף ב־1 בספטמבר שלאחר מכן" },
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 1.28.2.1(ג)", eId = "chp_1ב__sec_1_28__ssec_1_28_2_1/p28", how = "31 במאי — מועד אחרון לפיטורין בחינוך היסודי ובעל־יסודי" },
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 3.5(ה)(8)", eId = "chp_3__sec_3_5__hc_2__para_e__subpara_8", how = "30 ביוני — מועד אחרון למשלוח מכתבי פיטורין מנהליים" },
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 1.30 (שכרם של ממלאי מקום, 6)", eId = "chp_1ב__sec_1_30__hc_3__para_6/p2", how = "ממלא מקום מעל 51 ימי עבודה רצופים מקבל שכר לפי דרגתו וותקו" },
  { doc = "takanon/takanon-sherut-ovdei-horaa.xml", name = "תקנון שירות עובדי הוראה, סעיף 1.28.1", eId = "chp_1ב__sec_1_28__ssec_1_28_1__para_2", how = "המורה חייב להודיע על התפטרותו לפחות חודשיים מראש" },
]
applies = [
