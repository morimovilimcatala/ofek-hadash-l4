[[convention]]
id = "instruments.agreement-scope"
group = "instruments"
title = "על מי חל הסכם קיבוצי מיוחד של עובדי הוראה — העובדות שהשורש בודק"
value = "על העובדים בסוגים שסעיף התחולה מונה, אצל המעסיקים שהם צד להסכם, בלי קשר לארגון שהם חברים בו; עובד של בעלות שאינה צד להסכם — מחוצה לו"
detail = "סעיף 15 לחוק הסכמים קיבוציים מחיל הסכם קיבוצי מיוחד על העובדים בסוגים שהוא מונה, אצל מעסיק שהוא צד לו או שארגון מעסיקים שהוא צד מייצג אותו, אם הם חברים בארגון העובדים שחתם עליו ואם לאו. הסכם ארגון המורים מיום 24.1.2008 מונה בסעיף 3 כל עובד בשירות המעסיקים בחינוך העל־יסודי, בדירוג עובדי ההוראה, המיוצג על ידי הארגון, והמעסיקים שחתמו עליו הם המדינה, מרכז השלטון המקומי ושלוש הערים הגדולות; הסכם הסתדרות המורים מיום 21.2.2008 נחתם בידי המדינה בלבד. הבחירה, והיא העובדות שהרשת של השורש משנה מקרה למקרה: \"מיוצג על ידי הארגון\" היא עובדה של המקרה — העובד בחינוך העל־יסודי שהארגון הוא נציגו — ולא חברות בארגון; מחוץ לחינוך העל־יסודי היא אינה עולה, וגם החטיבה העליונה אינה עולה; עובד של בעלות שאינה רשות מקומית אינו בתחולת אף אחד משני ההסכמים, והשורש אינו רושם צו הרחבה שמחיל אותם עליו. לכן אצלו מדברים רק התקנון והחוזרים לבעלויות (precedence.takanon-over-older-circular). אם צו הרחבה או הסכם אחר מחילים את ההסכמים על עובדי הבעלויות, או ש\"מיוצג\" פירושו חבר, השורש שומע מסמכים אחרים במקרים האלה."
basis = "ours"
lawyer = "MMS-486"
corpus = [
