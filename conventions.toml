title = "הבחנה שמסמך מעתיק מחוק אחר, מול חוק מגן"
value = "ההבחנה של החוק שהמסמך מפנה אליו, ואינה נשקלת מול חוק המגן"
detail = "כשמסמך מבחין בין עובדים כפי שחוק אחר מבחין ביניהם, ואומר שהוא נוהג לפי אותו חוק — ולא מוסיף הבחנה משלו — ההבחנה היא של החוק ההוא, והיא אינה נשקלת מול חוק המגן כאילו המסמך יצר אותה. סעיף 1.29.3.3(10) לתקנון זוקף ותק בעד שירות צבאי \"ולא יותר מהחודשים שנקבעו בחוק בכל תקופה\", ומדפיס תקרות שונות לגבר ולאישה: התקרות הן תקופות שירות החובה שחוק שירות ביטחון קבע לכל מין בכל תקופה. לכן ההבחנה אינה נשקלת מול חוק שכר שווה לעובדת ולעובד. כשהתקנון נותן לאישה פחות ממה ששירתה בפועל בחובה — קצינה שחויבה בשירות נוסף — הממצא F-1.29-g הוא שנושא את זה. השאלה לעורך הדין: האם התקרות הן ההבחנה של חוק שירות ביטחון, או הבחנה של התקנון עצמו שיש לשקול לפי סעיפים 2 ו־6 לחוק שכר שווה."
basis = "ours"
lawyer = "MMS-680"
