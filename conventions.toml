detail = "טבלאות השכר של 1.12.2008 מדפיסות ותק 0 עד 36, וכל טבלה מ־1.1.2011 מדפיסה 1 עד 36. הסכם ההשלמה מיום 29.2.2012 (סעיף 23(א)) שם 'בותק 1' במקום 'בותק 0' בסעיפי השיבוץ של ההסכם הכולל, וצירף טבלאות 'המתחילות בותק 1'. הבחירה: הוותק שהמורה נושא נמנה כך — מורה חדש בוותק 1 — והוא שורת התווית שלו בכל טבלה מ־1.1.2011; בטבלאות 1.12.2008 הוא השורה שמתחתיו (מורה חדש בשורה 0). מ־36 ואילך — השורה האחרונה."
basis = "ours"
lawyer = "MMS-486"
applies = [
