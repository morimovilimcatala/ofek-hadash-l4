[[convention]]
id = "amounts.offset-after-share"
group = "amounts"
title = "קיזוז מתוספת שמשולמת יחסית למשרה"
value = "מקזזים מהסכום היחסי"
detail = "כשהטקסט מקזז מתוספת סכום שנמדד בשכרו של העובד עצמו (יתרה, תוספות שהוא מקבל), ובהוראה אחרת נותן את התוספת לעובד במשרה חלקית יחסית לחלקיות משרתו, ואינו אומר מה בא קודם — הקיזוז נעשה מהסכום היחסי שהעובד זכאי לו, ולא מסכום המשרה המלאה לפני החלוקה. כך תוספת המעו\"ף בהסכם הרשויות המקומיות מיום 17.5.2012: סעיף 4(ו) מקזז את 'היתרה' מ'סכום תוספת המעו\"ף לפי סעיף קטן (א)', וסעיף 4(ט)(3) נותן לעובד במשרה חלקית תוספת יחסית."
basis = "ours"
lawyer = "MMS-486"
applies = [
  { l4 = "l4/agreements/framework/2012-05-17_framework-agreement_local-government.l4", rule = "the Ma'of supplement of 17.5.2012 for a part-timer with a balance" },
]

