detail = "מינימום הנדרש 'לאורך' תקופה, או 'בשלוש השנים האחרונות', צריך להתקיים בכל אחת מהן."
basis = "ours"

[[setting]]
id = "thresholds.main"
group = "thresholds"
title = "'עיקרי', 'רוב'"
value = "יותר ממחצית"
detail = "'עיקרי' נקרא כיותר ממחצית, לא כגדול מכל אחד אחר."
basis = "ours"

[[setting]]
id = "thresholds.per-n"
group = "thresholds"
title = "'לכל N' (תלמידים, שעות, יחידות)"
value = "רק יחידות שלמות"
detail = "המרה 'לכל N' סופרת יחידות שלמות בלבד; שארית אינה מוסיפה יחידה ואינה מחושבת יחסית."
basis = "ours"

[[setting]]
id = "thresholds.ties"
group = "thresholds"
title = "תיקו בין מועמדים (בעלויות, בתי ספר)"
value = "כל המועמדים בתיקו"
detail = "כשההכרעה היא 'מי שיש לו הכי הרבה' ושניים שווים, שניהם נבחרים."
basis = "ours"

[[setting]]
id = "thresholds.seniority"
group = "thresholds"
title = "ספירת שנות ותק מול טבלה"
value = "שנים שלמות שהושלמו"
detail = "'N שנות ותק' הן N שנים שהושלמו. טבלה שבנויה לפי 'שנת הוותק ה־N' סופרת את השנה שבה העובד נמצא."
basis = "ours"

[[setting]]
id = "thresholds.missing-row"
group = "thresholds"
title = "שורה חסרה בטבלה"
value = "נשארת ריקה"
detail = "שורה שהטבלה אינה מדפיסה אינה מושלמת מהשכנות שלה; הקידוד אינו נותן לה ערך, אלא אם הטקסט אומר 'וכן הלאה'."
basis = "ours"

[[setting]]
id = "position.work-share"
group = "position"
title = "תשלום על סוג עבודה"
value = "לפי חלק המשרה באותה עבודה"
detail = "תשלום שקשור לסוג עבודה נמדד על החלק במשרה שהוא אותה עבודה, לא על המשרה כולה."
