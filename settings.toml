# The conventions the encoding follows where the text does not decide (MMS-485).
# The client, 2026-10-13/14: "a non interactive settings view" and "all ambiguities
# decisions should follow a convention". Each is a current choice, not a ruling:
# change a value here, then bring the rules it names and the findings that rely on
# it into line. A finding names the one its reading applies in `convention`.
#
#   basis       text | ours — the text decides it, or the encoding chose
#   applies     the L4 rules that apply it: {l4, rule}; tests/test_repo.py holds
#               every rule to a definition in that file
#   exceptions  where a rule answers the same question otherwise, and why

[[group]]
id = "rounding"
title = "עיגול"

[[group]]
id = "dates"
title = "תאריכים ותקופות"

[[group]]
id = "thresholds"
title = "ספים, טווחים וספירה"

[[group]]
id = "position"
title = "היקף משרה"

[[group]]
id = "amounts"
title = "סכומים ושיעורים"

[[group]]
id = "precedence"
title = "עדיפות בין הוראות"

[[group]]
id = "reading"
title = "קריאת הלשון"

[[setting]]
id = "rounding.default"
group = "rounding"
title = "עיגול כשהטקסט אינו קובע עיגול"
value = "ללא עיגול: חישוב מדויק"
detail = "סכום מחושב במדויק, כשבר. מעגלים רק היכן שהטקסט אומר לעגל, ורק את הסכום שהוא מציין; בדיקה מול סכום מודפס מעגלת את הבדיקה, לא את הכלל."
basis = "ours"

[[setting]]
id = "rounding.half"
group = "rounding"
title = "חצי בדיוק, בעיגול לקרוב"
value = "כלפי מעלה"
detail = "כשהטקסט אומר לעגל לשקל או לאגורה הקרובים, חצי בדיוק מעוגל כלפי מעלה (0.5 → 1), לא לזוגי הקרוב."
basis = "ours"

[[setting]]
id = "rounding.printed-figure"
group = "rounding"
title = "סכום מודפס מול החישוב שאמור להפיק אותו"
value = "הסכום המודפס קובע"
detail = "סכום שהטקסט מדפיס הוא הכלל; החשבון שמאחוריו משמש לבדיקה בלבד, ופער ביניהם נרשם כממצא."
basis = "ours"

[[setting]]
id = "dates.start"
group = "dates"
title = "יום התחילה ('מיום', 'החל מ־')"
value = "נכלל"
detail = "תקופה שמתחילה ביום מסוים כוללת את אותו יום."
basis = "ours"

[[setting]]
id = "dates.end"
group = "dates"
title = "יום הסיום, מועד אחרון ('עד יום')"
value = "נכלל"
detail = "מועד אחרון ויום סיום של תקופה נכללים בה; חודש שנקבע בשמו נמשך עד יומו האחרון."
basis = "ours"

[[setting]]
id = "dates.school-year"
group = "dates"
title = "תחילת שנת הלימודים"
value = "1 בספטמבר"
detail = "שנת לימודים מתחילה ב־1 בספטמבר; כשהטקסט אינו קובע יום תחילה לזכאות, היא מתחילה ב־1 בספטמבר של השנה שבה נוצרה."
basis = "ours"

[[setting]]
id = "dates.calendar"
group = "dates"
title = "ספירת ימים ושנים מעוברות"
value = "לוח השנה האמיתי"
detail = "ימים נספרים בלוח השנה כפי שהוא, כולל 29 בפברואר."
basis = "ours"

[[setting]]
id = "dates.commencement"
group = "dates"
title = "על מה חלה שורת תחולה"
value = "על כל היחידה שהיא חותמת"
detail = "שורת 'תחולה' מתארכת את כל השינויים שהיא חותמת, לא רק את הסעיף שמעליה."
basis = "ours"

[[setting]]
id = "dates.commencement-event"
group = "dates"
title = "מול מה נבדק תאריך תחולה"
value = "מול האירוע שההוראה מסדירה"
detail = "תאריך תחולה נבדק מול האירוע עצמו (השירות, ההעסקה), לא מול מועד התשלום."
basis = "ours"

[[setting]]
id = "dates.no-deadline"
group = "dates"
title = "חובה שהטקסט אינו קובע לה מועד"
value = "ללא מועד אחרון"
detail = "חובה בלי מועד מקודדת בלי מועד אחרון; הקידוד אינו מכריע מתי איחור הופך להפרה. גם 'בדחיפות' אינו מועד."
basis = "ours"

[[setting]]
id = "dates.deduction-limit"
group = "dates"
title = "מועד שנקבע לניכוי"
value = "המועד המוקדם ביותר לניכוי"
detail = "מגבלת זמן על ניכוי מגינה על העובד: היא היום המוקדם ביותר שבו מותר לנכות, לא מועד אחרון."
basis = "ours"

[[setting]]
id = "dates.salary-month"
group = "dates"
title = "'עם משכורת חודש X'"
value = "חודש המשכורת עצמו"
detail = "מועד שנקבע 'עם משכורת' של חודש נמדד בחודש המשכורת, לא ביום התשלום בתחילת החודש שאחריו."
basis = "ours"

[[setting]]
id = "dates.school-year-share"
group = "dates"
title = "חלק יחסי משנת לימודים"
value = "מתוך 12 חודשים"
detail = "חלק יחסי של שנת לימודים נמדד על פני שנים־עשר חודשים, ספטמבר עד אוגוסט, אלא אם הטקסט קובע מכנה אחר."
basis = "ours"

[[setting]]
id = "dates.week-of-month"
group = "dates"
title = "'השבוע השלישי של החודש'"
value = "שבעה ימים שלישיים מ־1 בחודש"
detail = "שבוע של חודש נספר בשביעיות מהיום הראשון בחודש, לא לפי שבוע לוח השנה."
basis = "ours"

[[setting]]
id = "dates.period-by-start"
group = "dates"
title = "לאיזו תקופה שייך שירות"
value = "לפי היום שבו התחיל"
detail = "שירות או אירוע שייכים לתקופה שבה החלו."
basis = "ours"

[[setting]]
id = "dates.circular-year"
group = "dates"
title = "לאיזו שנה הסכומים שבחוזר"
value = "שנת הלימודים שהחוזר יצא לה"
detail = "סכומי חוזר חלים על שנת הלימודים שלה החוזר יצא, מה שלא תהיה תווית השנה או התאריך שהם נושאים."
basis = "ours"

[[setting]]
id = "dates.update-in-force"
group = "dates"
title = "עדכון תקופתי של סכום"
value = "חל על הסכום שבתוקף במועדו"
detail = "כל עדכון חל על הסכום שבתוקף ביום העדכון; סכום שהודפס לתקופה מאוחרת משולם כפי שהודפס מתחילתה."
basis = "ours"

[[setting]]
id = "dates.quoted-rule"
group = "dates"
title = "כלל מצוטט שהועבר לתקופה חדשה"
value = "נושא איתו את תאריכיו"
detail = "כלל שמצוטט לתקופה חדשה מביא איתו את התאריכים שבו."
basis = "ours"

[[setting]]
id = "thresholds.above"
group = "thresholds"
title = "'מעל', 'יותר מ־', 'למעלה מ־'"
value = "גדול ממש (>)"
detail = "'מעל N' אינו כולל את N עצמו. כשהטקסט מוסיף 'לפחות' או 'ומעלה', N נכלל."
basis = "ours"

[[setting]]
id = "thresholds.until"
group = "thresholds"
title = "'עד N' בכמות, בשיעור או בגיל"
value = "לא כולל את N"
detail = "'עד N' נגמר ב־N: 'עד גיל 65' נגמר ביום ההולדת ה־65, ו'עד 0.3' אינו כולל 0.3. 'ועד בכלל' או 'כולל' כוללים את N. בתאריכים חל 'יום הסיום'."
basis = "ours"

[[setting]]
id = "thresholds.shared-bound"
group = "thresholds"
