[[setting]]
id = "amounts.partial"
group = "amounts"
title = "הפחתה על מילוי חלקי"
value = "יחסית לחלק שמולא"
detail = "הפחתה על מילוי חלקי של חובה היא יחסית לחלק שמולא."
basis = "ours"

[[setting]]
id = "amounts.floor"
group = "amounts"
title = "רצפת שכר בניכוי של תשלום יתר"
value = "מנכים עד הרצפה"
