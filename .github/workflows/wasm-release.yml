# Publish l4.wasm as the release toolchain/L4_WASM_RELEASE names (MMS-776),
# so that toolchain/fetch-wasm.sh can download it instead of the repository
# committing 21 MB at every rebuild. Run by hand (Actions → wasm-release →
# Run workflow) after toolchain/build-wasm.sh has moved the pins.
#
#   source: committed  uploads tools/assets/l4wasm/l4.wasm, the copy the
#                      pins were written from (a minute)
#   source: build      builds it again with toolchain/build-wasm.sh at the
#                      pins (an hour or more cold) and uploads that
#
# Either way the file must have the sha256 L4_WASM_RELEASE pins, or nothing
# is published; an existing release of the tag is left as it is.
name: wasm-release

on:
  workflow_dispatch:
    inputs:
      source:
        description: "committed (upload the committed l4.wasm) or build (rebuild it at the pins)"
        required: true
        default: committed
        type: choice
        options: [committed, build]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Read the pins
        id: pin
        run: |
          echo "tag=$(awk '$1 == "tag" { print $2 }' toolchain/L4_WASM_RELEASE)" >> "$GITHUB_OUTPUT"
          echo "sha=$(awk '$1 == "sha256" { print $2 }' toolchain/L4_WASM_RELEASE)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: inputs.source == 'build'
        with:
          node-version: "22"

      - name: Build l4.wasm at the pins
        if: inputs.source == 'build'
        run: |
          toolchain/build-wasm.sh "$RUNNER_TEMP/l4wasm"
          cp "$RUNNER_TEMP/l4wasm/l4.wasm" "$RUNNER_TEMP/l4.wasm"

      - name: Take the committed l4.wasm
        if: inputs.source == 'committed'
        run: cp tools/assets/l4wasm/l4.wasm "$RUNNER_TEMP/l4.wasm"

      - name: Check it against the pinned sha256
        run: |
          got="$(sha256sum "$RUNNER_TEMP/l4.wasm" | cut -d' ' -f1)"
          echo "l4.wasm: $got"
          [ "$got" = "${{ steps.pin.outputs.sha }}" ] || { echo "toolchain/L4_WASM_RELEASE pins ${{ steps.pin.outputs.sha }}"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; nothing to do"
            exit 0
          fi
          gh release create "$TAG" "$RUNNER_TEMP/l4.wasm" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "l4.wasm for the site's calculator: legalese/l4-ide@$(cat toolchain/L4_WASM_COMMIT) with toolchain/wasm-trace.patch, sha256 ${{ steps.pin.outputs.sha }} (toolchain/L4_WASM_RELEASE)."
