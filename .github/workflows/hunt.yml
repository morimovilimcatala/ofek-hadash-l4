# The analysis backends over every file (tools/hunt.py, MMS-804): `l4 lts`,
# `l4 explore`, `l4 verify`, `l4 prove` (z3), `l4 coverage` and TLC on the
# TLA+ models `l4 explore --emit` writes; then tests/test_hunt.py, which
# holds every count exactly. Its own workflow, not a step of site.yml: a
# cold run takes hours, and a deploy does not wait on it.
name: hunt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    # the runner site.yml uses, for the reason it gives (glibc 2.43)
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Read the toolchain pin
        id: pin
        run: echo "l4=$(cat toolchain/L4_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Install l4 at the pin
        run: toolchain/fetch-l4.sh ~/.local/bin/l4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # update first: the image's index can name a package the mirror has
      # since replaced (a 404 on openjdk, the first run)
      - name: Install z3 and Java
        run: sudo apt-get update && sudo apt-get install -y z3 default-jre-headless

      # the obligations hunter compares `l4 lts` with `make l4`'s results
      - name: Restore the previous run's L4 results
        uses: actions/cache/restore@v4
        with:
          path: build/l4
          key: l4-run-${{ runner.os }}-${{ steps.pin.outputs.l4 }}-${{ github.sha }}
          restore-keys: l4-run-${{ runner.os }}-${{ steps.pin.outputs.l4 }}-

      - name: Check every encoding
        id: l4
        run: L4=~/.local/bin/l4 make l4

      # site.yml saves under the same key; whichever finishes first keeps it
      - name: Keep the L4 results
        if: steps.l4.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/l4
          key: l4-run-${{ runner.os }}-${{ steps.pin.outputs.l4 }}-${{ github.sha }}

      # each file's result is kept under the key make l4 uses for it, so a
      # push re-runs only what it touched. Saved even when the step fails or
      # the job times out: a cold hunt can outlast one job on two cores, and
      # the next run then continues where this one stopped
      - name: Restore the previous run's hunt results
        id: hunt-cache
        uses: actions/cache/restore@v4
        with:
          path: build/hunt
          key: hunt-${{ runner.os }}-${{ steps.pin.outputs.l4 }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: hunt-${{ runner.os }}-${{ steps.pin.outputs.l4 }}-

      - name: Run the analysis backends
        # what the job has left after a cold make l4, with room to save
        timeout-minutes: 240
        run: L4=~/.local/bin/l4 make hunt

      - name: Keep the hunt results
        if: always() && steps.hunt-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/hunt
          key: hunt-${{ runner.os }}-${{ steps.pin.outputs.l4 }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Hold what they find
        run: python3 -m unittest -v tests.test_hunt
