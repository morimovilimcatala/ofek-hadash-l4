# Install the pinned L4 compiler, check every encoding, build the site and
# publish it to GitHub Pages (Settings → Pages → Source: GitHub Actions).
#
# The compiler is Legalese's own build of toolchain/L4_COMMIT from
# legalese/prereleases, checked against the sha256 in toolchain/L4_SHELF
# (toolchain/fetch-l4.sh, MMS-558): seconds, where building it from source
# took ~40 min on a cold runner.
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # pinned, never -latest: an image bump changes GHC's environment under
    # the compiler and would show up here as a diff nobody made
    runs-on: ubuntu-24.04
    # the root's check alone takes ~12 minutes and more memory than the
    # runner has (tools/l4run.py); a deploy that re-checks it can run long
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Read the toolchain pin
        id: pin
        run: echo "l4=$(cat toolchain/L4_COMMIT)" >> "$GITHUB_OUTPUT"

      # the binary and the libraries it resolves IMPORT prelude from, both
      # from the release toolchain/L4_SHELF names; a mismatch fails the job
      - name: Install l4 at the pin
        run: toolchain/fetch-l4.sh ~/.local/bin/l4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each file's result is kept under a key that hashes the compiler, the
      # file and everything it imports (tools/l4run.py's
      # key()), and the verdict is recomputed from it, so a restored result
      # can never stand in for a changed file. Restoring the last run's
      # results means a push re-runs only what it touched: the cold check of
      # every file took 13 of a deploy's 19 minutes (2026-10-21). The edge
      # cases' traces are kept here too (build/l4/traces, tools/edge_traces.py):
      # run afresh, the site and the tests took 25 of 28 minutes (2026-10-22).
      - name: Restore the previous run's L4 results
        uses: actions/cache@v4
        with:
          path: build/l4
          key: l4-run-${{ runner.os }}-${{ steps.pin.outputs.l4 }}-${{ github.sha }}
          restore-keys: l4-run-${{ runner.os }}-${{ steps.pin.outputs.l4 }}-

      - name: Check every encoding (l4 run + l4 render)
        run: L4=~/.local/bin/l4 make l4

      # GraphViz draws `l4 state-graph`'s diagrams of each obligation
      - name: Install GraphViz
        run: sudo apt-get install -y graphviz

      # Node runs the committed l4.wasm: the findings' traces at build time
      # (tools/edge_traces.py) and the calculator's test, as the page runs it
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the site
        run: make site

      - name: Tests
        run: make test

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
