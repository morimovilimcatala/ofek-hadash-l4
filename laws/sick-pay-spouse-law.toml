# חוק דמי מחלה (היעדרות בשל מחלת בן זוג), התשנ"ח-1998 — the sections the L4
# encodes (l4/laws/sick-pay-spouse-law.l4, MMS-601): the six days a year an
# employee may charge to his accrued sick leave for his spouse's illness,
# the sixty for a spouse's malignant illness, what an ill spouse is, that
# the law adds to every other right, and that the State is an employer like
# any other.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped,
# and with it the notes "פורסמו ..." that name the regulations made under a
# section) on 8.11.2026, as amended up to תשע"ט.
#
# The takanon's §1.25.3.1 restates §§1, 1א and 3 as its clause 5 and cites
# the law twice (notes 7 and 7(א)).

title = "חוק דמי מחלה (היעדרות בשל מחלת בן זוג), התשנ\"ח-1998"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%93%D7%9E%D7%99_%D7%9E%D7%97%D7%9C%D7%94_%28%D7%94%D7%99%D7%A2%D7%93%D7%A8%D7%95%D7%AA_%D7%91%D7%A9%D7%9C_%D7%9E%D7%97%D7%9C%D7%AA_%D7%91%D7%9F_%D7%96%D7%95%D7%92%29"
text_as_of = "2026-11-08"
about = "החוק שמתיר לעובד לזקוף על חשבון ימי המחלה שלו, או ימי החופשה, היעדרות בשל מחלת בן זוגו ובשל מחלה ממארת שלו"
shared = "בן הזוג החולה כפי שסעיף 3 מגדיר אותו: תלוי לחלוטין בעזרת הזולת בביצוע פעולות יום־יום."

[[section]]
num = "1"
heading = "היעדרות בשל מחלת בן זוג"
text = "עובד זכאי לזקוף עד 6 ימים בשנה של היעדרות, בשל מחלת בן זוגו, על חשבון תקופת המחלה הצבורה שלו."

[[section]]
num = "1א"
heading = "היעדרות בשל מחלה ממארת של בן זוג"
text = "(א) עובד שעבד שנה לפחות אצל אותו מעסיק או באותו מקום עבודה, זכאי לזקוף עד 60 ימים בשנה של היעדרות, בשל מחלה ממארת של בן זוגו, על חשבון תקופת המחלה הצבורה שלו או על חשבון ימי החופשה המגיעים לו, לפי בחירת העובד. (ב) בחישוב מספר ימי ההיעדרות לפי סעיף זה, יבואו בחשבון ימי ההיעדרות שזקף העובד לפי סעיף 1."

[[section]]
num = "3"
heading = "הגדרת מחלה"
text = "לעניין סעיף 1 – (1) יראו כחולה – בן זוג שחלה והפך להיות תלוי לחלוטין בעזרת הזולת בביצוע פעולות יום־יום; (2) ”פעולות יום־יום“ – בהגדרת מונח זה בסעיף 223 לחוק הביטוח הלאומי [נוסח משולב], התשנ״ה–1995."

[[section]]
num = "4"
heading = "שמירת זכויות"
text = "חוק זה בא להוסיף על זכות עובד מכוח דין או הסכם ולא לגרוע ממנה."

[[section]]
num = "5"
heading = "דין המדינה"
text = "לענין חוק זה דין המדינה כמעסיק כדין כל מעסיק אחר."
