# חוק שכר שווה לעובדת ולעובד, התשנ"ו-1996 — the sections the L4 encodes
# (l4/laws/equal-pay-law.l4, MMS-601): the law's purpose, the right of a
# woman and a man to equal pay and equal other remuneration for the same
# work, work equal in substance or work of equal value, what work of equal
# value is, the differences in pay the law allows and who proves them, that
# the right cannot be conditioned or waived, that a benefit given in
# connection with birth or parenthood is not taken into account, and that
# the State is an employer under the law, each ministry a workplace of its
# own.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped)
# on 8.11.2026, as amended up to תש"ף (amendment 6).
#
# The corpus does not cite the law, by name or by link. It rules all the
# same on its subject wherever an instrument gives pay or other
# remuneration by sex or by a sex-linked status: the early-retirement
# tracks of circular תשפ"א/6, whose ages differ for women and men; the
# personal-car refund and the rent participation, printed "על שמו או על שם
# אשתו" (the takanon's §§1.15.4.3, 7.3.6.3, 7.6.6.3); and the mother's
# position, the mother's supplement and the day-care participation, which
# are benefits in connection with parenthood (§13) and are weighed against
# the Equal Opportunities Law instead.

title = "חוק שכר שווה לעובדת ולעובד, התשנ\"ו-1996"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%A9%D7%9B%D7%A8_%D7%A9%D7%95%D7%95%D7%94_%D7%9C%D7%A2%D7%95%D7%91%D7%93%D7%AA_%D7%95%D7%9C%D7%A2%D7%95%D7%91%D7%93"
text_as_of = "2026-11-08"
about = "החוק שמזכה עובדת ועובד באותו מקום עבודה בשכר שווה ובגמול אחר שווה בעד אותה עבודה, עבודה שווה בעיקרה או עבודה שוות ערך, מתיר הפרש רק כשהוא נובע מאופי העבודה ולא מטעמי מין, ואינו מביא בחשבון הטבה בקשר להולדה או להורות"

[[section]]
num = "1"
heading = "מטרת החוק"
text = "חוק זה נועד לקדם שוויון ולמנוע אפליה בין המינים בכל הנוגע לשכר או לכל גמול אחר בקשר לעבודה."

[[section]]
num = "2"
heading = "הזכות לשכר שווה"
text = "עובדת ועובד המועסקים אצל אותו מעסיק באותו מקום עבודה, זכאים לשכר שווה בעד אותה עבודה, עבודה שווה בעיקרה או עבודה שוות ערך; הוראה זו תחול גם לענין כל גמול אחר, שנותן מעסיק לעובד או עבורו בקשר לעבודתו; לענין חוק זה, ”גמול אחר“ – כל תוספת, טובת הנאה, קצובה, מענק, תנאים נלווים, תשלום לכיסוי הוצאות, תשלומים בשל החזקת רכב, שימוש בטלפון, מכסת שעות נוספות, רכישת ספרות מקצועית, ביגוד, שימוש ברכב, או כל תגמול אחר בכסף או בשווה כסף, במישרין או בעקיפין, והכל אף אם אינם שכר עבודה."

[[section]]
num = "3"
heading = "עבודות שוות ערך"
text = "יראו עבודה כשוות ערך לחברתה, אף אם הן אינן אותן עבודות או עבודות השוות בעיקרן זו לזו, אם הן בעלות משקל שווה, בין היתר מבחינת הכישורים, המאמץ, המיומנות והאחריות הנדרשים לביצוען ומבחינת התנאים הסביבתיים שבהם הן מבוצעות."

[[section]]
num = "6"
heading = "הפרש בשכר"
text = "(א) אין בהוראות סעיף 2 כדי למנוע הפרש בשכר או בגמול אחר המתחייב מאופיה או ממהותה של העבודה הנדונה ובכלל זה תפוקת העבודה, איכות העבודה, הוותק בעבודה, ההכשרה או ההשכלה, או מיקומו הגיאוגרפי של מקום העבודה, והכל כשאין בכך משום אפליה מטעמי מין. (ב) מצא בית הדין לעבודה, בתובענה לפי חוק זה, כי העבודות שבמחלוקת הינן אותן עבודות, עבודות שוות בעיקרן או עבודות שוות ערך, וטען המעסיק שקיימות נסיבות כאמור בסעיף קטן (א) המצדיקות הפרש בשכר או בגמול אחר, עליו נטל ההוכחה."

[[section]]
num = "12"
heading = "איסור התנייה"
text = "זכותו של עובד לפי חוק זה, אינה ניתנת להתניה או לויתור."

[[section]]
num = "13"
heading = "שמירת זכויות"
text = "הטבה הניתנת לעובד, בקשר להולדה או להורות, לא תילקח בחשבון לענין חוק זה."

[[section]]
num = "14"
heading = "המדינה כמעסיק"
text = "הוראות חוק זה יחולו על המדינה כמעסיק ואולם – (1) יראו כל משרד כהגדרתו בסעיף 1 לחוק שירות המדינה (מינויים), התשי״ט–1959, כמקום עבודה נפרד; (2) שר העבודה והרווחה ושר האוצר, באישור ועדת העבודה והרווחה של הכנסת, רשאים לקבוע בצו כי יחידה מסויימת או מספר יחידות באותו משרד הם מקום עבודה נפרד."
