[[section]]
num = "20"
heading = "פיצויי הלנת פיצויי פיטורים"
text = "(א) בסעיף זה, ”המועד לתשלום פיצויי פיטורים“, לגבי עובד או מי שזכאי לפיצויי פיטורים מכוחו – המאוחר שבין המועדים האלה: (1) יום הפסקת יחסי עבודה; (2) המועד שנקבע לתשלום פיצויי הפיטורים על־פי הוראת הסכם קיבוצי, הסדר קיבוצי אחר או צו הרחבה החלה על העובד; (3) אם נקבעה, על־פי חוזה עבודה או הסכם אחר, זכות לפיצויי פיטורים העודפת על זו הקבועה בחיקוק, בהסכם קיבוצי, בהסדר קיבוצי אחר או בצו הרחבה – היום שנקבע לתשלום פיצויי הפיטורים על־פי אותו חוזה עבודה או הסכם, ואם לא נקבע יום כאמור והזכות כאמור נקבעה לאחר יום הפסקת יחסי עבודה – היום שבו נקבעה הזכות; (4) אם נקבעה, על פי הסכם קיבוצי, הסדר קיבוצי אחר או צו הרחבה, זכות לפיצויי פיטורים לאחר יום הפסקת יחסי עבודה ולא נקבע מועד לתשלומם – היום שבו נקבעה הזכות; (5) אם הזכות לפיצויי פיטורים מותנית, על פי הוראה שבחיקוק, במילוי תנאי מצד העובד לאחר יום הפסקת יחסי עבודה או במילוי תנאי במשך תקופה מסויימת שלאחר אותו יום – יום מילוי התנאי האמור או יום תום התקופה האמורה, לפי הענין. (ב) יראו פיצויי פיטורים כמולנים אם לא שולמו תוך 15 ימים מהמועד לתשלומם; פיצוי הלנת פיצויי פיטורים יהיה כדלקמן: (1) שולמו פיצויי הפיטורים בתקופה שבין היום הששה עשר לבין היום השלושים שלאחר המועד לתשלומם – הפרשי הצמדה לתקופה שמן המועד לתשלומם עד ליום שבו שולמו; (2) שולמו פיצויי הפיטורים לאחר היום השלושים שלאחר המועד לתשלומם – הפרשי הצמדה לתקופה שמן המועד לתשלומם עד ליום שבו שולמו, בתוספת 20% על הסכום הכולל של פיצויי הפיטורים והפרשי ההצמדה כאמור בעד כל חודש שבו לא שולמו פיצויי הפיטורים; בעד חלק מחודש תשולם התוספת של 20% האמורה באופן יחסי. (ב1) פיצוי הלנת פיצויי פיטורים יהיה לכל דבר, פרט לענין סעיף קטן (ב), חלק מפיצויי הפיטורים. (ב2) המעסיק רשאי להפחית מפיצויי הפיטורים ומפיצוי ההלנה סכום של חוב שחייב העובד למעסיק או סכום שהמעסיק חייב או זכאי לנכותו מפיצויי הפיטורים. (ג) מי שזכאי לפיצויי פיטורים שלא מכוח סעיפים 1(א) או 5 לחוק פיצויי פיטורים, תשכ״ג–1963, לא יחול לגביו המועד לתשלום פיצויי פיטורים כאמור בסעיף קטן (א) אלא לאחר שנמסרה למעסיק קודם לכן דרישה בכתב לתשלום הפיצויים תוך ציון העילה לדרישה; נמסרה הדרישה למעסיק לאחר המועד האמור – יחול לגביו המועד לתשלום הפיצויים ביום מסירת הדרישה. (ד) הוראות סעיפים 17א, 18 ו־19 יחולו, בשינויים המחוייבים, לגבי הלנת פיצויי פיטורים כאילו היא הלנת שכר, ואולם בית דין אזורי יהיה מוסמך להפחית או לבטל פיצוי הלנת פיצויי פיטורים, כאמור בסעיף 18, אף אם פיצויי הפיטורים לא שולמו עקב אחד מאלה: (1) חילוקי דעות בדבר עצם הזכות לפיצויי פיטורים, שיש בהם ממש לדעת בית הדין; (2) חילוקי דעות בדבר המועד שבו נפסקו יחסי עבודה; (3) הזכאי לקבלת פיצויי הפיטורים לא מסר למעסיק לפי דרישתו פרטים הנוגעים לעובד או לזכאי כאמור והדרושים לענין קביעת הזכות לפיצויי הפיטורים או שיעורם. (ה) מי שזכאי לקבל מקופת גמל את פיצויי הפיטורים או חלק מהם מכוח תשלומים ששילם לה מעסיק, לא יהיה זכאי לפיצוי הלנת פיצויי פיטורים על הסכום המגיע לו מקופת הגמל, על פי זכותו האמורה, אם המעסיק הודיע לקופת הגמל בכתב, תוך 15 ימים מהמועד לתשלום פיצויי הפיטורים, כי הוא מסכים לתשלומם; הוראת סעיף קטן זה אינה באה לגרוע מהוראות סעיפים 14 ו־20 לחוק פיצויי פיטורים, תשכ״ג–1963. (ו) נפטר עובד או מי שהיה עובד, והפקיד המעסיק בקופת בית דין אזורי סכום של פיצויי פיטורים על־מנת שבית־דין יעבירו לזכאי לו – יראו, לענין סעיף קטן (ב), כאילו שולם הסכום האמור לזכאי ביום ההפקדה."

[[section]]
num = "25"
heading = "ניכויים משכר עבודה"
text = "(א) לא ינוכו משכר עבודה אלא סכומים אלה: (1) סכום שחובה לנכותו, או שמותר לנכותו על פי חיקוק; (2) תרומות שהעובד הסכים בכתב כי ינוכו; (3) דמי חבר בארגון עובדים שהעובד חבר בו, שיש לנכותם מן השכר על פי הסכם קיבוצי או חוזה עבודה או שהעובד הסכים בכתב כי ינוכו, והתשלומים הרגילים לועד העובדים במפעל; (3א) תוספת לדמי החבר שמותר לנכותם על־פי פסקה (3), המיועדת למימון פעילות מפלגתית, זולת אם הודיע העובד למעסיקו בכתב על התנגדותו לתשלום התוספת; (3ב) דמי טיפול מקצועי־ארגוני לטובת הארגון היציג כמשמעותו בחוק הסכמים קיבוציים, תשי״ז–1957, שיש לנכותם על פי הסכם קיבוצי או חוזה עבודה משכרו של עובד שאיננו חבר בשום ארגון עובדים, או שהעובד הסכים בכתב לניכוי כאמור; שר העבודה, לאחר התייעצות עם ארגון העובדים המייצג את המספר הגדול ביותר של עובדים במדינה, ובאישור ועדת העבודה של הכנסת, יקבע בתקנות את מקסימום דמי הטיפול המקצועי־ארגוני שמותר לנכותם לפי פסקה זו; (4) סכום שהוטל כקנס משמעת בהתאם להסכם קיבוצי או על פי חיקוק; (5) תשלומים שוטפים לקופות גמל ובלבד שתשלומים כאמור לקופת גמל שהעובד בלבד חייב לשלם לה לא ינוכו משכרו של העובד אם הוא הודיע למעסיקו בכתב על התנגדותו לתשלומם; (6) חוב על פי התחייבות בכתב מהעובד למעסיק, בתנאי שלא ינוכה על חשבון חוב כאמור יותר מרבע שכר העבודה; (7) מקדמות על חשבון שכר עבודה, אם אין המקדמות עולות על שכר עבודה בעד שלושה חדשים; עולות המקדמות על שכר עבודה לשלושה חדשים – חלות על היתרה הוראות פסקה (6). (ב) על אף האמור בסעיף קטן (א), חדל עובד לעבוד אצל המעסיק, רשאי המעסיק לנכות משכרו האחרון של העובד כל יתרה של חוב שהעובד חייב לו, לרבות מקדמות."
