# חוק שכר מינימום, התשמ"ז-1987 — the sections the L4 encodes
# (l4/laws/minimum-wage-law.l4, MMS-601): what the minimum wage is, who is
# owed it, which components of pay count toward it, and that the law adds to
# an agreement and never takes from it.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped)
# on 1.11.2026, as amended up to the temporary provision of תשע"ח.
#
# The corpus cites the law by its term — "שכר המינימום כמשמעותו בחוק שכר
# מינימום", "השלמת השכר עד לשכר המינימום" — in the documents
# data/statute-citations.json lists, and no section of it by number. The
# term is §1's definition, the right to it §2 and the pay that
# counts toward it §3; §11 is the law's own rule against an agreement.
# Of §1 only the definitions of the minimum wage and the average wage it is
# a share of are pinned, the others standing as "…". The page's editorial
# note on the current amount ("החל מאפריל 2023, 5,571.75 ש״ח לחודש") is not
# the law's words and is left out: the amount is published by the Minister
# under §6 and raised by temporary provisions, and the L4 takes it as an
# input. §3(ה)–(ו), which the temporary provision of תשע"ה-2015 inserted,
# have lapsed and are pinned as the page prints them; that provision's
# "excluded supplement" is outside this pin.

title = "חוק שכר מינימום, התשמ\"ז-1987"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%A9%D7%9B%D7%A8_%D7%9E%D7%99%D7%A0%D7%99%D7%9E%D7%95%D7%9D"
text_as_of = "2026-11-01"
about = "החוק שקובע את שכר המינימום, מי זכאי לו ואילו רכיבי שכר נספרים לקראתו; רצפה שהסכם, חוזר או חוזה אינם יורדים ממנה"
shared = "שכר המינימום לחודש, כפי שהשר מפרסם אותו לפי סעיף 6 — קלט, שאינו נקבע בסעיפים האלה."

[[section]]
num = "1"
heading = "הגדרות"
text = "בחוק זה – … ”השכר הממוצע“ – כהגדרתו בסעיף 1 לחוק הביטוח הלאומי [נוסח משולב], התשכ״ח–1968; … ”שכר מינימום“, לחודש – 47.5 אחוזים מהשכר הממוצע כפי שהוא ב־1 באפריל של כל שנה וכפי שהוא מוגדל על פי חוק זה; ”שכר מינימום יומי“ – החלק ה־25 של שכר המינימום לגבי עובד המועסק שבוע עבודה בן ששה ימים, והחלק ה־21⅔ של שכר המינימום לגבי עובד המועסק שבוע עבודה בן חמישה ימים; ”שכר מינימום לשעה“ – החלק ה־186 של שכר המינימום."

[[section]]
num = "2"
heading = "הזכות לשכר מינימום"
text = "(א) עובד שמלאו לו 18 שנים (להלן – עובד) המועסק במשרה מלאה, כנהוג במקום עבודתו, זכאי לקבל ממעסיקו שכר עבודה שלא יפחת משכר המינימום לחודש, שכר המינימום היומי או שכר המינימום לשעה, הכל לפי הענין. (ב) עובד המועסק במשרה חלקית זכאי לשכר מינימום חלקי שיחושב יחסית לחלקיות משרתו. (ג) נעדר עובד מעבודתו, יקטן שכר המינימום שהוא זכאי לו לפי סעיף קטן (א), בשיעור יחסי לזמן היעדרו, ואולם אם הוא זכאי לקבל תשלום בעד זמן ההיעדרות לפי דין, חוזה עבודה, הסכם קיבוצי, צו הרחבה או הסדר קיבוצי אחר או לפי ההוראות המחייבות קופת גמל (בסעיף זה – ההסדר), יהיה התשלום לפי הוראות ההסדר."

[[section]]
num = "3"
heading = "חישוב השכר לענין שכר המינימום"
text = "(א) השכר שיובא בחשבון לענין סעיף 2 יהיה שכר העבודה שמשלם מעסיק לעובדו בעד יום עבודה רגיל כנהוג במקום עבודתו. (ב) לענין סעיף קטן (א) יבואו בחשבון רכיבי השכר הבאים: (1) שכר יסוד או שכר משולב; (2) תוספת יוקר אם איננה כלולה בשכר המשולב; (3) תוספת קבועה המשתלמת לעובד עקב עבודתו, (4) (פקעה); (5) (פקעה); ואולם לא יובאו בחשבון תוספת משפחה, תוספת ותק, תוספת בשל עבודה במשמרות, פרמיה מדודה, מוסכמת, קבועה או קבוצתית, משכורת י״ג, מענקים על בסיס שנתי, והחזר הוצאות לרבות הוצאות כלכלה, אש״ל ונסיעות שמשלם המעסיק. (ג) (בוטל). (ד) לא היה שכרו של עובד משתלם לפי הרכיבים המנויים בסעיף קטן (ב)(1) ו־(2), או לפי חלק מהם, יחושב השכר לענין סעיף קטן (א) לפי שכר העבודה הרגיל ללא תוספות. (ה) (פקע). (ו) (פקע)."

[[section]]
num = "11"
heading = "שמירת זכויות"
text = "חוק זה, למעט סעיפים 9 ו־10, בא להוסיף על זכותו של עובד מכוח דין, הסכם קיבוצי, הסדר קיבוצי או חוזה עבודה ולא לגרוע ממנה."

