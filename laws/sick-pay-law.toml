# חוק דמי מחלה, התשל"ו-1976 — the sections the L4 encodes
# (l4/laws/sick-pay-law.l4, MMS-601): who is an employee for the law, the
# right to sick pay from the second day of an absence for illness and its
# rate, how many days accrue and up to how many, the protection from
# dismissal while the accrued days last, the wage it is paid on, and that
# the law takes no right a collective agreement gives.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped,
# and with it the notes "פורסמו ..." that name the regulations made under a
# section) on 8.11.2026, as amended up to תשפ"ב (amendment 6); §4(ב)'s fraction, which the
# page prints as a superscript 2 over a subscript 3, is written 21²⁄₃.
#
# The corpus does not cite the law by name: the takanon's §1.25.3.1 quotes
# its definition of an illness ("מחלה מוגדרת בחוק כ...") and rules, with the
# circulars and agreements that follow it, on every subject below — the
# days a year (§4), the pay for a day of absence (§§2, 5, 6), the medical
# certificate (§2(ג)), and a teacher's leaving the service while sick
# (§4א). §12 keeps every right a collective agreement gives.

title = "חוק דמי מחלה, התשל\"ו-1976"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%93%D7%9E%D7%99_%D7%9E%D7%97%D7%9C%D7%94"
text_as_of = "2026-11-08"
about = "החוק שקובע דמי מחלה לעובד שנעדר מעבודתו עקב מחלה: ממתי משלמים ובאיזה שיעור, כמה ימים נצברים ועד כמה, ושאין לפטר עובד בתקופת המחלה הצבורה לו"
shared = "מי \"עובד\" לעניין החוק (סעיף 1): עובד שתשלום לתקופת מחלה אינו מוסדר לגביו בהסכם קיבוצי — ולעניין סעיף 4א, גם עובד שהוא מוסדר לגביו."

[[section]]
num = "1"
heading = "הגדרות"
text = "בחוק זה – ”הסכם קיבוצי“ – כמשמעותו בסעיף 1 לחוק הסכמים קיבוציים, תשי״ז–1957, בין שנעשה והוגש לרישום לפי החוק האמור ובין אם לאו, או הסדר קיבוצי אחר, לרבות צו הרחבה לפי החוק האמור; ”עובד“ – עובד שענין תשלום לתקופת מחלה אינו מוסדר לגביו על פי הסכם קיבוצי; ”עובד במשכורת“ – עובד שעיקר גמול עבודתו משתלם על בסיס של חודש או של תקופה ארוכה יותר; ”עובד בשכר“ – עובד שאינו עובד במשכורת; ”מחלה“ – אי כשרו הזמני או הקבוע של העובד לבצע עבודתו, הנובע, על פי ממצאים רפואיים, ממצב בריאות לקוי; ”קופת גמל“ – כהגדרתה בחוק הפיקוח על שירותים פיננסיים (קופות גמל), התשס״ה–2005."

[[section]]
num = "2"
heading = "הזכות לדמי מחלה"
text = "(א) עובד שנעדר מעבודתו עקב מחלה יהיה זכאי לקבל ממעסיקו, בכפיפות לתקופת הזכאות המקסימלית כאמור בסעיף 4 – (1) החל מהיום הרביעי להעדרו כאמור – תשלום על פי חוק זה בעד תקופת מחלתו (להלן – דמי מחלה); (2) בעד הימים השני והשלישי להעדרו כאמור – מחצית דמי מחלה; אולם שר העבודה, באישור ועדת העבודה של הכנסת, רשאי לקבוע בתקנות הוראות לענין תשלום דמי מחלה בעד הימים הראשון, השני והשלישי להעדר העובד כאמור, וכוחן יפה על אף האמור בסעיף זה. (א1) על אף האמור בסעיף קטן (א), עובד שחלה במחלה ממארת או מחלה שנדרש בשלה טיפול קבוע בדיאליזה, ונעדר בשל כך מעבודתו לשם טיפול תקופתי או בדיקות תקופתיות, אף לאחר החלמתו, יהיה זכאי לקבל ממעסיקו תשלום דמי מחלה החל מהיום הראשון להיעדרו או מחלקו, בכפיפות לתקופת הזכאות המקסימלית כאמור בסעיף 4, ובלבד שמסר למעסיקו אישור רפואי בכתב כי הטיפול או הבדיקה נדרשים בקשר לאותה מחלה. (ב) ”תקופת מחלה“ תחושב לפי הוראות אלה: (1) לגבי עובד במשכורת – תהא תקופת המחלה כל ימי מחלתו, לרבות ימי מנוחה שבועית וחגים; (2) לגבי עובד בשכר שעבד עבודה מלאה אצל אותו מעסיק או באותו מקום עבודה – תהא תקופת המחלה כל ימי מחלתו, למעט ימי מנוחה שבועית וחגים; (3) לגבי עובד בשכר שלא עבד עבודה מלאה אצל אותו מעסיק או באותו מקום עבודה (להלן – עובד לסירוגין) – תהא תקופת המחלה כל ימי מחלתו, למעט ימי מנוחה שבועית וחגים, כפול היחס שבין הימים שעבד העובד ברבע השנה של העבודה המלאה ביותר שבשנים עשר החדשים שקדמו למחלה לבין ימי העבודה באותו רבע שנה; (4) לגבי עובד לסירוגין שטרם עבד אצל אותו מעסיק או באותו מקום עבודה תקופה של שלושה חדשים – תהא תקופת המחלה כל ימי מחלתו, למעט ימי מנוחה שבועית וחגים, כפול היחס שבין הממוצע השבועי של ימי עבודתו בתקופת עבודתו שקדמה למחלה לבין שש; (5) עובד בשכר או עובד לסירוגין שנהגו לעבוד בימי מנוחה שבועית וחגים על פי היתר לפי חוק שעות עבודה ומנוחה, תשי״א–1951, יובאו הימים האמורים בחשבון תקופת המחלה, ולגבי עובד לסירוגין כאמור בפסקה (3) יבוא ”תשעים“ במקום ”ימי העבודה באותו רבע שנה“ בפסקה האמורה, ולגבי עובד לסירוגין כאמור בפיסקה (4) יבוא ”שבע“ במקום ”שש“ שבפסקה האמורה. (ג) שר העבודה, באישור ועדת העבודה של הכנסת, רשאי להתקין תקנות בדבר נהלים הכרוכים בקבלת דמי מחלה, לרבות מסירת פרטים וראיות למעסיק בקשר למחלה, וכן בדבר מועד תשלום דמי המחלה."

[[section]]
num = "4"
heading = "תקופת הזכאות המקסימלית לדמי מחלה"
text = "(א) תקופת הזכאות לדמי מחלה לא תעלה על תקופה מצטברת של יום וחצי לכל חודש עבודה מלא שהעובד עבד אצל אותו מעסיק או באותו מקום עבודה החל מהיום שבו חל עליו חוק זה ולא יותר מ־90 יום, בניכוי התקופה שבעדה קיבל העובד דמי מחלה על פי חוק זה. (ב) עובד שבחודש פלוני לא עבד אצל אותו מעסיק או באותו מקום עבודה בכל ימי העבודה שבאותו חודש, יראו, לענין סעיף קטן (א), 25 ימי עבודה כחודש עבודה מלא, ואם נהוג במקום העבודה שבוע עבודה בן חמישה ימים – 21²⁄₃ ימי עבודה וחלק של חודש עבודה מלא יזכה את העובד בימי מחלה יחסיים. (ג) התקופה שבה קיים לגבי עובד ביטוח דמי מחלה על פי הוראות סעיפים 8 ו־9 לא תובא בחשבון לענין חישוב תקופת הזכאות המקסימלית לדמי מחלה, אולם תקופת זכאותו לדמי מחלה של עובד שנעשה לגביו ביטוח כאמור, תעמוד לו לגבי כל תקופת מחלה שבעדה אין הוא זכאי לתשלום בהתאם לתנאי הביטוח, למעט תקופת המתנה או אכשרה לדמי מחלה המתחייבת מתנאי הביטוח. (ד) שר העבודה, באישור ועדת העבודה של הכנסת, רשאי להתקין תקנות בדבר שיטת חישוב תקופת הזכאות ובדבר תקופות עבודה והפסקות עבודה שיובאו בחשבון לענין זה, ובלבד שיראו כעבודה גם כל הפסקה בעבודה שבעדה זכאי העובד לשכר או לתשלום אחר שדינו כדין שכר."

[[section]]
num = "4א"
heading = "פיטורים בתקופת הזכאות לדמי מחלה"
text = "(א) מעסיק לא יפטר עובד שנעדר מעבודתו עקב מחלתו, במהלך תקופת הזכאות לדמי מחלה הצבורה לו לפי חוק זה או לפי הסכם קיבוצי, וזאת עד לתקופת הזכאות המקסימלית לפי סעיף 4. (ב) הוראות סעיף זה לא יחולו באחד מאלה: (1) המעסיק נתן לעובד הודעה מוקדמת לפיטורים לפי חוק הודעה מוקדמת לפיטורים ולהתפטרות, התשס״א–2001, בטרם נעדר העובד עקב מחלתו; (2) מקום עבודתו של העובד פסק מלפעול או שהמעסיק הוכרז פושט רגל לפי פקודת פשיטת הרגל [נוסח חדש], התש״ם–1980, ואם הוא תאגיד – ניתן צו פירוק לפי פקודת החברות [נוסח חדש], התשמ״ג–1983; לעניין זה, ”פסק מלפעול“ – הפסקת פעילות שאינה זמנית. (ג) בסעיף זה, ”עובד“ – לרבות עובד שעניין תשלום לתקופת מחלה מוסדר לגביו על פי הסכם קיבוצי."

[[section]]
num = "5"
heading = "גובה דמי מחלה"
text = "(א) דמי המחלה יהיו בגובה שכר העבודה שהיה העובד זכאי לקבל בתקופת זכאותו לדמי מחלה אילו המשיך בעבודתו. (ב) לגבי עובד ששכרו משתלם לפי כמות התוצרת – דמי המחלה יהיו בגובה שכר העבודה שהיה העובד זכאי לקבל בתקופת זכאותו לדמי מחלה אילו המשיך לעבוד והפיק בכל אחד מהימים הכלולים בתקופה האמורה את כמות התוצרת הממוצעת ליום עבודה שהפיק בשלושת החדשים שקדמו למחלתו."

[[section]]
num = "6"
heading = "רכיבי השכר לענין דמי מחלה"
text = "(א) רכיבים אלה יובאו בחשבון השכר המשמש בסיס לחישוב דמי מחלה: (1) שכר יסוד; (2) תוספת ותק; (3) תוספת יוקר או פיצוי בעד התייקרות; (4) תוספת משפחה; (5) תוספת מחלקתית או מקצועית. (ב) לא היה שכר העובד משתלם לפי הרכיבים המנויים בסעיף קטן (א) או לפי חלק מהם, יובא בחשבון לענין סעיף קטן (א) שכרו המשתלם לו בעד יום עבודתו הרגילה בצירוף כל תוספת מהתוספות האמורות בסעיף קטן (א) שהשתלמה לו. (ג) שר העבודה באישור ועדת העבודה של הכנסת רשאי לקבוע בתקנות שיטה אחרת או רכיבים אחרים לענין השכר שישמש בסיס לחישוב דמי מחלה."

[[section]]
num = "12"
heading = "שמירת זכויות"
text = "(א) היה העובד זכאי לדמי מחלה הן לפי חוק זה והן לפי תנאי העבודה המוסכמים בינו לבין מעסיקו או הנהוגים במקום עבודתו, יהיה זכאי לדמי מחלה לפי אחת מהעילות האמורות לפי בחירתו. (ב) חוק זה אינו בא לגרוע מזכויות עובדים על פי הסכמים קיבוציים, בין אם חל על העובדים חוק זה ובין אם לאו."
