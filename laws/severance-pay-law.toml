# חוק פיצויי פיטורים, התשכ"ג-1963 — the sections the L4 encodes
# (l4/laws/severance-pay-law.l4, MMS-601): who is owed severance pay, how
# much, on what wage, and when a payment to a provident fund takes its
# place.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup and its
# editorial notes dropped) on 1.11.2026, as amended up to תשע"ט.
#
# The corpus cites §14 by number (data/statute-citations.json) — the
# contributions that take the place of 72% or of all the severance pay —
# and the law by its term, "פיצויי פיטורים כמשמעותם בחוק פיצויי פיטורים",
# where a supplement or a grant is said not to count for it. The term is
# §1's right and §12's amount; §13 sends the wage it is computed on to the
# regulations and §13ב sets that wage's floor; §31 is the law's own rule
# against an agreement.

title = "חוק פיצויי פיטורים, התשכ\"ג-1963"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%A4%D7%99%D7%A6%D7%95%D7%99%D7%99_%D7%A4%D7%99%D7%98%D7%95%D7%A8%D7%99%D7%9D"
text_as_of = "2026-11-01"
about = "החוק שמזכה עובד שפוטר בפיצויי פיטורים: מי זכאי, כמה, לפי איזה שכר, ומתי תשלום לקופת גמל בא במקומם"
shared = "השכר שהפיצויים מחושבים לפיו, כפי שהתקנות לפי סעיף 13 קובעות אותו — קלט."

[[section]]
num = "1"
heading = "הזכות לפיצויי פיטורים"
text = "(א) מי שעבד שנה אחת ברציפות – ובעובד עונתי שתי עונות בשתי שנים רצופות – אצל מעסיק אחד או במקום עבודה אחד ופוטר, זכאי לקבל ממעסיקו שפיטרו פיצויי פיטורים. ”עונה“ לענין חוק זה – שלושה חדשים רצופים בשנה שבהם עבד לפחות 60 יום. (ב) עובד שעבר ממקום עבודה למקום עבודה אצל אותו מעסיק ונתחלפו המעסיקים במקום העבודה הנוכחי, זכאי לקבל פיצויי פיטורים מהמעסיק הקודם בעד תקופת עבודתו אצלו או במקום העבודה הקודם כאילו פוטר העובד ביום חילופי המעסיקים כאמור; קיבל המעסיק החדש כאמור על עצמו, על פי התחייבות בכתב כלפי העובד, את האחריות לפיצויי הפיטורים שהיה העובד זכאי לקבלם מהמעסיק הקודם כאמור, יהיה המעסיק הקודם פטור מתשלום הפיצויים ויראו לענין חוק זה את תקופת עבודתו של העובד אצל המעסיק הקודם או במקום העבודה הקודם כאילו עבד במקום העבודה הנוכחי."

[[section]]
num = "12"
heading = "שיעור הפיצויים"
text = "(א) שיעורם של פיצויי הפיטורים הוא: שכר חודש אחד לכל שנת עבודה בעובד במשכורת אצל מעסיק, או באותו מקום עבודה, ושכר שבועיים לכל שנת עבודה בעובד בשכר כאמור; חלק של שנה שלאחר שנת עבודה מזכה את העובד בפיצויים יחסיים, ולגבי עובד עונתי – חלק של שנה מזכה אותו בפיצויים יחסיים אף אם תקופות עבודתו אינן מצטרפות לשנה. לענין זה, ”עובד במשכורת“ – עובד שעיקר גמול עבודתו, משתלם על בסיס של חודש או של תקופה ארוכה יותר; ”עובד־בשכר“ – עובד שאינו עובד במשכורת. (ב) שר העבודה רשאי, לאחר התייעצות בשר האוצר ובאישור ועדת העבודה של הכנסת, להגדיל בתקנות את שיעור פיצויי הפיטורים לעובד בשכר; תקנות כאמור יכול שיהיו כלליות או לפי ענפי עבודה."

[[section]]
num = "13"
heading = "חישוב שכר עבודה"
text = "שר העבודה באישור ועדת העבודה של הכנסת, יקבע בתקנות, דרך כלל או לסוגים, את המרכיבים של שכר העבודה הכולל שיובאו בחשבון שכר העבודה לענין פיצויי פיטורים, את שיטת חישוב השכר שישמש בסיס לחישוב פיצויי הפיטורים ואת ההפסקות שחלו בעבודה בנסיבות האמורות בפסקאות (1) – למעט שירות מילואים לפי חוק שירות המילואים – (5), (7) או (9) לסעיף 2 שלא יבואו במנין לקביעת סכום הפיצויים; בהתקנת תקנות אלה יתחשב שר העבודה בהוראות לענין זה שבהסכם הקיבוצי החל על המספר הגדול ביותר של עובדים שהתקנות נוגעות להם."

[[section]]
num = "13ב"
heading = "חישוב הפיצויים לפי שכר מינימום"
text = "על אף הוראות סעיף 13, לא יפחת שכר העבודה שיובא בחשבון לענין חישוב פיצויי פיטורים, משיעור שכר המינימום כהגדרתו בסעיף 1 לחוק שכר מינימום, תשמ״ז–1987, לפי היקף המשרה."

[[section]]
num = "14"
heading = "פיצויים ותגמולים"
text = "תשלום לקופת תגמולים, לקרן פנסיה או לקרן כיוצא באלה, לא יבוא במקום פיצויי פיטורים אלא אם נקבע כך בהסכם הקיבוצי החל על המעסיק והעובד ובמידה שנקבע, או אם תשלום כאמור אושר על ידי שר העבודה ובמידה שאושר."

[[section]]
num = "31"
heading = "שמירת זכויות"
text = "(א) חוק זה אינו בא למעט מכל זכות הנתונה לעובד לפי דין, הסכם קיבוצי או חוזה עבודה, ולענין סעיף 12 גם לפי הנוהג, ולא יתפרש כממצה זכויותיו של עובד בכל משא ומתן לקביעת זכויות בקשר לפרישה מעבודה. (ב) אין בזכאות לפיצויי פיטורים לפי חוק זה כדי לגרוע מזכויות העובד התלויות בוותק."
