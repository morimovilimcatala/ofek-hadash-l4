[[section]]
num = "21"
heading = "הגדרות לענין תאגידים"
text = "בפרק זה – ”תאגיד“ – (1) תאגיד שהוקם בחוק או מכוח סמכותו של שר שניתנה בחוק, והוא מוסד של המדינה או שנתקיים בו אחד מאלה: (א) הממשלה משתתפת בתקציבו, במישרין או בעקיפין; (ב) חבריו או חברי הנהלתו, כולם או מקצתם, מתמנים בידי הממשלה או בידי שר; למעט בנק ישראל, רשות מקומית וחברה ממשלתית; (2) חברה מוגבלת בערבות או הקדש, אשר שר או ראש רשות מקומית ממנה להם דירקטור או נאמן, לפי הענין, ואשר שר האוצר קבע שהוראות פרק זה, כולן או מקצתן, יחולו עליהם; ”תאגיד בריאות“ – עמותה, אגודה שיתופית, חברה או כל גוף משפטי אחר הכשר לחיובים, לזכויות ולפעולות משפטיות, המוכר שירותי בריאות בתוך בית חולים ממשלתי או תוך שימוש במתקני בית חולים כאמור; ”גוף מתוקצב“ – תאגיד, רשות מקומית, מועצה דתית, בנק ישראל, חברה ממשלתית וחברה עירונית; ”גוף נתמך“ – כהגדרתו בסעיף 32; ”שנה“ – שנת כספים, לרבות שנים עשר החדשים המתחילים בתאריך כלשהוא בשנה פלונית לגבי תאגידים המנהלים את תקציבם על בסיס של תקופה כאמור; ”סכום החריגה“ – סכום שבו חרגו תאגיד או רשות מקומית מתקציבם המאושר, או משיא כוח אדם, או סכום ההלוואה שלקחו ללא אישור; לענין זה אין נפקא מינה אם הסכומים הוצאו או נתקבלו למעשה או שהתאגיד או הרשות המקומית התחייבו או הסכימו להוציאם או לקבלם; ”חברה ממשלתית“ – כמשמעותה בחוק החברות הממשלתיות, התשל״ה–1975, לרבות חברת בת ממשלתית וחברה מעורבת כמשמעותן בחוק האמור; ”חברה עירונית“ – חברה שיותר ממחצית כוח ההצבעה או הזכות למנות יותר ממחצית מספר הדירקטורים שלה הם בידי רשות מקומית או בידי רשות מקומית יחד עם המדינה או עם חברה עירונית אחרת או חברת בת עירונית; ”חברת בת עירונית“ – חברה שיותר ממחצית כוח ההצבעה או הזכות למנות יותר ממחצית מספר הדירקטורים שלה הם בידי חברה עירונית, או בידי חברת בת עירונית או בידי חברת בת עירונית יחד עם חברת בת עירונית אחרת; ”שר הנוגע בדבר“, לענין תאגיד – השר הממונה על ביצוע החוק שלפיו הוקם אותו תאגיד, ולענין חברה ממשלתית – השר שנקבע כאחראי לעניני החברה."

[[section]]
num = "29"
heading = "שינויים בשכר ובתנאי שירות"
text = "(א) גוף מתוקצב או גוף נתמך לא יסכים על שינויים בשכר, בתנאי פרישה או בגימלאות, או על הטבות כספיות אחרות הקשורות לעבודה, ולא ינהיג שינויים או הטבות כאמור, אלא בהתאם למה שהוסכם או הונהג לגבי כלל עובדי המדינה או באישורו של שר האוצר; ואולם רשאי שר האוצר, באישור הועדה, לפטור מהוראות סעיף זה, חברה מעורבת כהגדרתה בחוק החברות הממשלתיות, התשל״ה–1975, אם ראה שטעמים של מכירת מניותיה, לרבות הנפקתן לציבור או למשקיעים, מחייבים זאת, ונחה דעתו שלא תהיה למתן הפטור ולשינויים שיונהגו בעקבותיו, השפעה בלתי רצויה על מדיניות השכר הכוללת במגזר הציבורי; הפטור יכנס לתוקפו עם ביצוע המכירה או במועד מאוחר יותר שיקבע השר. (ב) על אף האמור בכל דין, כל הסכם או הסדר בטל במידה שהוא נוגד את הוראות סעיף קטן (א). (ג) ראה שר האוצר כי גוף מתוקצב או גוף נתמך לא קיים את הוראות סעיף קטן (א), רשאי הוא להפחית סכום השווה לסכום ששולם עקב כך מן הסכומים שיש להעבירם לאותו גוף מתקציב המדינה לפי כל דין, ורשאי הוא להפסיק או להפחית כל מענק או השתתפות שהגוף היה מקבל מהממשלה אלמלא החריגה, כל עוד מבצע הגוף תשלומים בניגוד להוראות סעיף זה. (ד)(1) לענין סעיף 22(א)(6) לחוק החברות הממשלתיות, התשל״ה–1975, יראו דירקטור שהסכים ביודעין על שינויים או הטבות בניגוד להוראות סעיף קטן (א), כדירקטור שאינו ממלא תפקידו כראוי. (2) לענין סעיף 42(א)(2) לחוק החברות הממשלתיות, התשל״ה–1975, יראו הסכמה של מנהל כללי לשינויים או להטבות בניגוד להוראות סעיף קטן (א), עילה מספקת לממשלה להעבירו מכהונתו."

[[section]]
num = "32"
heading = "הגדרות (ההגדרה של \"גוף נתמך\" בלבד)"
text = "”גוף נתמך“ – תאגיד שהממשלה משתתפת בתקציבו במישרין או בעקיפין, ושר האוצר קבע לגביו בהודעה ברשומות כי הינו גוף נתמך לענין חוק זה;"
