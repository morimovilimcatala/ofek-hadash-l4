# חוק דמי מחלה (היעדרות בשל מחלת הורה), התשנ"ד-1993 — the sections the L4
# encodes (l4/laws/sick-pay-parent-law.l4, MMS-601): the six days a year an
# employee may charge to his accrued sick leave for the illness of his
# parent or his spouse's, what an ill parent is, that the law adds to every
# other right, and that the State is an employer like any other.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped,
# and with it the notes "פורסמו ..." that name the regulations made under a
# section) on 8.11.2026, as amended up to תשע"ט.
#
# The takanon's §1.25.3.1 restates §§1 and 3 as its clause 4 and names the
# law among its sources (note 11); the corpus prints the name without a
# link to the live page.

title = "חוק דמי מחלה (היעדרות בשל מחלת הורה), התשנ\"ד-1993"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%93%D7%9E%D7%99_%D7%9E%D7%97%D7%9C%D7%94_%28%D7%94%D7%99%D7%A2%D7%93%D7%A8%D7%95%D7%AA_%D7%91%D7%A9%D7%9C_%D7%9E%D7%97%D7%9C%D7%AA_%D7%94%D7%95%D7%A8%D7%94%29"
text_as_of = "2026-11-08"
about = "החוק שמתיר לעובד לזקוף על חשבון ימי המחלה שלו היעדרות בשל מחלת הורהו או הורה של בן זוגו"
shared = "ההורה החולה כפי שסעיף 3 מגדיר אותו: תלוי לחלוטין בעזרת הזולת לביצוע פעולות יום יום."

[[section]]
num = "1"
heading = "היעדרות בשל מחלת הורה או הורה של בן הזוג"
text = "(א) עובד זכאי לזקוף עד ששה ימים בשנה של היעדרות בשל מחלת ההורה שלו או של בן זוגו (להלן – ההורה), על חשבון תקופת המחלה הצבורה שלו, ובלבד שבן זוגו הינו עובד ושלא נעדר מעבודתו מכוח זכאותו לפי חוק זה. (ב) בזקיפת ימי היעדרות כאמור בסעיף קטן (א), זכאי עובד להביא בחשבון, לפי בחירתו, גם חלקי ימים שבהם נעדר לפי הוראות אותו סעיף קטן; חלקי ימים לעניין זה יחושבו לפי היחס שבין שעות ההיעדרות ובין שעות העבודה של העובד באותו יום אילולא נעדר."

[[section]]
num = "3"
heading = "הגדרת מחלה"
text = "לעניין סעיף 1 – (1) יראו כחולה – הורה שחלה והפך להיות תלוי לחלוטין בעזרת הזולת לביצוע פעולות יום יום; (2) ”פעולות יום יום“ – כהגדרת מונח זה בסעיף 127פג לחוק הביטוח הלאומי [נוסח משולב], התשכ״ח–1968."

[[section]]
num = "4"
heading = "שמירת זכויות"
text = "חוק זה בא להוסיף על זכות עובד מכוח דין או הסכם ולא לגרוע ממנה."

[[section]]
num = "4א"
heading = "דין המדינה"
text = "לענין חוק זה דין המדינה כמעסיק כדין כל מעסיק אחר."
