# חוק דמי מחלה (היעדרות עקב הריון ולידה של בת זוג), התש"ס-2000 — the
# sections the L4 encodes (l4/laws/sick-pay-partner-pregnancy-law.l4,
# MMS-601): the seven days a year an employee may charge to his accrued
# sick leave for his partner's pregnancy treatments and tests or her giving
# birth, that the law adds to every other right, and that the State is an
# employer like any other.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped,
# and with it the notes "פורסמו ..." that name the regulations made under a
# section) on 8.11.2026, as amended up to תשע"ד.
#
# The takanon's §1.25.3.1 restates §1 as its clause 6 and cites the law
# (note 15).

title = "חוק דמי מחלה (היעדרות עקב הריון ולידה של בת זוג), התש\"ס-2000"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%93%D7%9E%D7%99_%D7%9E%D7%97%D7%9C%D7%94_%28%D7%94%D7%99%D7%A2%D7%93%D7%A8%D7%95%D7%AA_%D7%A2%D7%A7%D7%91_%D7%94%D7%A8%D7%99%D7%95%D7%9F_%D7%95%D7%9C%D7%99%D7%93%D7%94_%D7%A9%D7%9C_%D7%91%D7%AA_%D7%96%D7%95%D7%92%29"
text_as_of = "2026-11-08"
about = "החוק שמתיר לעובד לזקוף על חשבון ימי המחלה שלו היעדרות בשל טיפולים ובדיקות בהריון של בת זוגו ובשל הלידה"
shared = ""

[[section]]
num = "1"
heading = "היעדרות עקב הריון ולידה"
text = "עובד זכאי לזקוף עד שבעה ימים בשנה של היעדרות, בהתאם לכללים שקבע שר העבודה והרווחה, בשל טיפולים או בדיקות הקשורים להריון בת זוגו, או בשל לידה של בת זוגו, על חשבון תקופת המחלה הצבורה שלו."

[[section]]
num = "3"
heading = "שמירת זכויות"
text = "חוק זה בא להוסיף על זכותו של עובד מכוח דין או הסכם ולא לגרוע ממנה."

[[section]]
num = "4"
heading = "דין המדינה"
text = "לענין חוק זה, דין המדינה כמעסיק כדין כל מעסיק אחר."

# What the MMS-601 batch that weighed the corpus against this law searched
# its text for (tools/statute_record.py): an instrument none of these terms
# is in, and that does not cite the law, rules on nothing of its subject
# and is recorded as not weighed for that reason. A term is a word of the
# text, its Hebrew prefixes allowed; one ending in * may run on.
[inventory]
batch = "6614ef2"
what = "the law's own subject, as the takanon words it"
terms = [
    "לידה של בת זוג*",
    "הריון ולידה של בת זוג",
]
