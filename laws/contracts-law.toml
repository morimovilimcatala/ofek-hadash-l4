# חוק החוזים (חלק כללי), התשל"ג-1973 — the sections the L4 encodes
# (l4/laws/contracts-law.l4, MMS-529): how a contract is read (§25, in both
# its texts: the one for a contract made up to 6.1.2026 and the one
# amendment no. 3 gave a contract made or renewed from 7.1.2026), how a
# detail it does not set is filled (§26), the duty to perform in the
# customary way and in good faith (§39), and what the law applies to (§61):
# where no other law provides specially, and, so far as it suits the matter,
# to legal acts that are not contracts.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped)
# on 12.11.2026, as amended up to תשפ"ו (amendment no. 3).
#
# The corpus does not cite the law, by name or by link. It is here because
# the encoding reads every agreement, circular and takanon section, and the
# conventions it reads them by (conventions.toml, "reading.*") are readings
# of a contract or of an act that is not one: §25 is the law of that
# reading, and §61(ב) is how it reaches a circular or the takanon (the
# convention reading.contracts-law, a pick for the lawyer).

title = "חוק החוזים (חלק כללי), התשל\"ג-1973"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%94%D7%97%D7%95%D7%96%D7%99%D7%9D_(%D7%97%D7%9C%D7%A7_%D7%9B%D7%9C%D7%9C%D7%99)"
text_as_of = "2026-11-12"
about = "החוק הכללי של החוזים: כיצד חוזה מפורש — לפי אומד דעת הצדדים או לפי לשונו, ומה גובר בין פירושים שונים — כיצד משלימים פרט שלא נקבע, החובה לקיים חוזה בדרך מקובלת ובתום לב, ותחולתו גם על פעולות משפטיות שאינן חוזה"

[[section]]
num = "25"
heading = "פירוש של חוזה"
text = "(א) (נוסח לחוזים שנכרתו עד יום 6.1.2026): חוזה יפורש לפי אומד דעתם של הצדדים, כפי שהוא משתמע מתוך החוזה ומנסיבות העניין, ואולם אם אומד דעתם של הצדדים משתמע במפורש מלשון החוזה, יפורש החוזה בהתאם ללשונו. (א) (נוסח לחוזים שנכרתו או חודשו החל מיום 7.1.2026): (1) אופן הפרשנות של חוזה והראיות שיהיו קבילות לפירושו יהיו ככל אשר הסכימו הצדדים; לא הסכימו הצדדים על אופן פרשנות החוזה, יפורש החוזה בהתאם ליתר הוראות חוק זה. (2) חוזה עסקי שלא נקבעו בו הוראות לעניין אופן הפרשנות יפורש בהתאם ללשונו בלבד, אלא אם כן מתקיים אחד מאלה: (א) מלשון החוזה בלבד נובעת תוצאה שאינה מתקבלת על הדעת; (ב) מלשון החוזה בלבד עולה סתירה בין הוראות שונות בו. (3) חוזה שיש לפרשו בהתאם ללשונו בלבד, בין לפי פסקה (1) ובין לפי פסקה (2), שהתקיימו בו הוראות פסקה (2)(א) או (ב), יפורש בהתאם ליתר הוראות חוק זה ובכלל זה פסקה (4). (4) חוזה שאינו חוזה עסקי, חוזה אחיד אף אם הוסכם בו אחרת, וכן חוזה עבודה או הסכם קיבוצי יפורשו לפי אומד דעתם של הצדדים, כפי שהוא משתמע מתוך החוזה ומנסיבות העניין; המשקל היחסי שיינתן ללשון החוזה ולנסיבות העניין יתבסס, בין השאר, על שיקולים אלה: (א) יחסי הצדדים, ובכלל זה פערי מידע או יחסי אמון מיוחדים ביניהם; (ב) מידת הפירוט של החוזה; (ג) הניסיון המקצועי של הצדדים והייצוג המשפטי שהיה להם לעניין עריכת החוזה. (5) לעניין סעיף קטן זה – (א) יראו צדדים שאינם מיוצגים על ידי עורך דין לעניין עריכת החוזה כצדדים שלא הסכימו על אופן הפרשנות לפי פסקה (1); (ב) לא יהיה תוקף להסכמה של הצדדים שנוגדת את הוראת סעיף קטן (ב1). (ב) חוזה הניתן לפירושים שונים, פירוש המקיים אותו עדיף על פירוש שלפיו הוא בטל. (ב1) חוזה הניתן לפירושים שונים והיתה לאחד הצדדים לחוזה עדיפות בעיצוב תנאיו, פירוש נגדו עדיף על פירוש לטובתו. (ג) ביטויים ותניות בחוזה שנוהגים להשתמש בהם בחוזים מאותו סוג יפורשו לפי המשמעות הנודעת להם באותם חוזים. (ד) סעיפים 2, 4, 5, 6, 7, 8 ו־10 לחוק הפרשנות, התשמ״א–1981, וסעיף 57ג לפקודת הראיות [נוסח חדש], התשל״א–1971, יחולו, בשינויים המחוייבים, גם על פירושו של חוזה, אם אין הוראה אחרת לענין הנדון ואם אין בענין הנדון או בהקשרו דבר שאינו מתיישב עם תחולה כאמור."

[[section]]
num = "26"
heading = "השלמת פרטים"
text = "פרטים שלא נקבעו בחוזה או על פיו יהיו לפי הנוהג הקיים בין הצדדים, ובאין נוהג כזה – לפי הנוהג המקובל בחוזים מאותו סוג, ויראו גם פרטים אלה כמוסכמים."

[[section]]
num = "39"
heading = "קיום בתום לב"
text = "בקיום של חיוב הנובע מחוזה יש לנהוג בדרך מקובלת ובתום לב; והוא הדין לגבי השימוש בזכות הנובעת מחוזה."

[[section]]
num = "61"
heading = "תחולה"
text = "(א) הוראות חוק זה יחולו כשאין בחוק אחר הוראות מיוחדות לענין הנדון. (ב) הוראות חוק זה יחולו, ככל שהדבר מתאים לענין ובשינויים המחוייבים, גם על פעולות משפטיות שאינן בבחינת חוזה ועל חיובים שאינם נובעים מחוזה."
