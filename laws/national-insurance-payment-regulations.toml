# תקנות הביטוח הלאומי (תשלום ופטור מתשלום דמי ביטוח), התשנ"ה-1995 —
# regulations 1, 4 and 5: what an "additional payment" (תשלום נוסף) is,
# salary arrears, and how an additional payment is spread for the purpose
# of insurance contributions — one of 25% of the minimum wage or more over
# the twelve months to the month it is paid, a smaller one in that month.
# Pinned for MMS-781 (a candidate cliff in maternity pay, where a clothing
# allowance on either side of that line moves the income a maternity
# allowance is computed from).
#
# SOURCE ONLY: every section here is `source_only = true`. The words are
# held so the rule can be read and cited; no L4 rule computes them yet, and
# whether a teacher's clothing allowance is a תשלום נוסף, and how the
# spreading reaches §54's "הכנסה", is not encoded or decided here.
#
# The corpus holds no copy of a statute or regulation (its standing
# decision 14); the words are pinned as tools/laws.py describes, read from
# the live page of ספר החוקים הפתוח (its wikitext, the {{ח:...}} markup
# dropped) on 18.11.2026, as amended up to תשע"ד, 1126.

title = "תקנות הביטוח הלאומי (תשלום ופטור מתשלום דמי ביטוח), התשנ\"ה-1995"
url = "https://he.wikisource.org/wiki/%D7%AA%D7%A7%D7%A0%D7%95%D7%AA_%D7%94%D7%91%D7%99%D7%98%D7%95%D7%97_%D7%94%D7%9C%D7%90%D7%95%D7%9E%D7%99_(%D7%AA%D7%A9%D7%9C%D7%95%D7%9D_%D7%95%D7%A4%D7%98%D7%95%D7%A8_%D7%9E%D7%AA%D7%A9%D7%9C%D7%95%D7%9D_%D7%93%D7%9E%D7%99_%D7%91%D7%99%D7%98%D7%95%D7%97)"
text_as_of = "2026-11-18"
about = "התקנות שקובעות כיצד מחושבים דמי ביטוח על שכר; כאן נוסח ההגדרות, ההפרשים והפריסה של תשלום נוסף"

[[section]]
num = "1"
heading = "הגדרות"
source_only = true
text = "בתקנות אלה – ”הפקודה“ – פקודת מס הכנסה; ”שכר“ – הכנסה מהמקורות המפורטים בסעיף 2(2) לפקודה; ”שכר חודשי רגיל“ – שכר שנהוג לשלמו לעובד מדי חודש; ”תשלום נוסף“ – שכר הניתן לעובד בנוסף לשכר החודשי הרגיל, לרבות תשלומים שניתנו כבונוס או כמענק השתתפות ברווחי המעביד ולמעט הפרשים."

[[section]]
num = "4"
heading = "הפרשים"
source_only = true
text = "הפרשים ייראו כשכרו החודשי הרגיל של העובד, בעד החודשים שבעדם שולמו."

[[section]]
num = "5"
heading = "תשלום נוסף"
source_only = true
text = "על תשלום נוסף יחולו, לענין תשלום דמי ביטוח, הוראות אלה: (1) אם שיעורו 25% או יותר משכר המינימום כהגדרתו בחוק שכר מינימום (להלן – שכר המינימום) יחולק לשנים עשר, והסכום המתקבל מהחלוקה האמורה יצורף לשכר החודש שבו שולם ולשכר כל אחד מאחד עשר החודשים שקדמו לו; תשלום נוסף כאמור, ששולם לעובד שעבד אצל מעבידו פחות מאחד עשר החודשים שקדמו לחודש שבו שולם, יחולק במספר החודשים שבהם עבד העובד אצל אותו מעביד (להלן – חודשי העבודה הקודמים), והסכום המתקבל מהחלוקה האמורה יצורף לשכר החודשי הרגיל בעד כל אחד מחודשי העבודה הקודמים; (2) אם שיעורו נמוך מ־25% משכר המינימום, יצורף לשכר החודשי הרגיל בחודש שבו שולם."
