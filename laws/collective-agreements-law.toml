title = "חוק הסכמים קיבוציים, התשי\"ז-1957"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%94%D7%A1%D7%9B%D7%9E%D7%99%D7%9D_%D7%A7%D7%99%D7%91%D7%95%D7%A6%D7%99%D7%99%D7%9D"
text_as_of = "2026-10-26"
about = "החוק שקובע מה מעמדן של הוראות הסכם קיבוצי, ואיזו הוראה גוברת כשהסכם, חוק, חוזה עבודה או הסכם אחר אומרים אחרת"
shared = "מה נבדק בהוראה של הסכם."

[[section]]
num = "2"
heading = "סוגי הסכמים קיבוציים"
text = "שני סוגים בהסכמים קיבוציים: (1) הסכם קיבוצי מיוחד – למפעל מסויים או למעסיק מסויים – בין מעסיק או ארגון מעבידים המייצג את המעסיק לבין ארגון העובדים היציג של העובדים שעליהם יחול ההסכם; (2) הסכם קיבוצי כללי – לכל שטח המדינה או לחלק ממנה, לענפי עבודה מסויימים או לכל ענפי העבודה כשההסכם הוא בין ארגון העובדים היציג שבענף העבודה או בשטח הנדון לבין ארגון מעבידים שבהם, הכל לפי הענין."

[[section]]
num = "15"
heading = "היקפו של הסכם קיבוצי מיוחד"
text = "הסכם קיבוצי מיוחד חל על – (1) בעלי ההסכם; (2) המעסיקים המיוצגים, לענין אותו הסכם, על ידי ארגון מעבידים שהוא בעל ההסכם; (3) כל העובדים מהסוגים הכלולים בהסכם, המועסקים על ידי מעסיק שהוא בעל ההסכם או שהוא מיוצג כאמור בפסקה (2), במקצועות או בתפקידים הכלולים בהסכם."

[[section]]
num = "16"
heading = "היקפו של הסכם קיבוצי כללי"
text = "הסכם קיבוצי כללי חל על – (1) בעלי ההסכם; (2) המעבידים (קרי: המעסיקים), בענפים או בשטח הכלולים בהסכם, שהיו בעת חתימת ההסכם חברים בארגון המעבידים שהוא בעל ההסכם, או שנעשו לחברים תוך תקופת תקפו של ההסכם, חוץ מחברים שהוצאו מכלל ההסכם במפורש; (3) כל העובדים מהסוגים הכלולים בהסכם המועסקים, על ידי מעסיק כאמור בפסקה (2), במקצועות או בתפקידים הכלולים בהסכם."

[[section]]
num = "19"
heading = "זכויות וחובות של עובד ומעסיק"
text = "הוראות שבהסכם קיבוצי בדבר תנאי עבודה, סיום עבודה, וחובות אישיות המוטלות לפי אותן הוראות על עובד ומעסיק וזכויות המוקנות להם (להלן – הוראות אישיות), יראו אותן כחוזה עבודה בין כל מעסיק וכל עובד שעליהם חל ההסכם, ותקפן אף לאחר פקיעת תקפו של ההסכם הקיבוצי, כל עוד לא שונו או לא בוטלו כדין; השתתפות בשביתה לא יראו כהפרת חובה אישית."

[[section]]
num = "20"
heading = "איסור לוותר על זכויות"
text = "זכויות המוקנות לעובד בהוראות אישיות שבהסכם קיבוצי אינן ניתנות לויתור."

[[section]]
num = "21"
heading = "שמירת זכויות"
text = "זכויות עובד הקבועות בחוק יכול הסכם קיבוצי להוסיף עליהן אך לא לגרוע מהן."

[[section]]
num = "22"
heading = "חוזה עבודה והסכם קיבוצי"
text = "הוראה בחוזה עבודה שהיא שונה מהוראה אישית שבהסכם קיבוצי החל על בעלי החוזה – ההוראה שבהסכם הקיבוצי עדיפה; היה השינוי לטובת העובד, עדיפה ההוראה בחוזה העבודה, אם אין בהסכם הקיבוצי דבר המונע במפורש אותו שינוי."

[[section]]
num = "23"
heading = "סתירה בין הסכמים"
text = "היו חלים על עובד יותר מהסכם קיבוצי אחד, הולכים אחר הוראה שהיא לטובת העובד."
