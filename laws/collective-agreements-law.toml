# (l4/laws/collective-agreements-law.l4, MMS-516).
#
# The corpus holds no copy of a statute (its standing decision 14): an act
# citation there links to the live page of ספר החוקים הפתוח. The L4 encodes
# this law anyway (the client, 2026-10-20: "don't encode it in AKN, only in
# L4"), so the words it reads are pinned here, one row per section, and each
# row names the anchor of the live page it is read from. A section is
# re-read against the live page whenever the law is amended; `text_as_of`
# says when it last was.
#
# Read from: the copy of the live page the corpus held until 28.9.2026
