shared = "החודשים שבעדם שולמו דמי ביטוח לפני היום הקובע."

[[section]]
num = "50"
heading = "תנאי הזכאות"
text = "(א) מבוטחת ששולמו בעדה דמי ביטוח משכרה כעובדת או ששילמה דמי ביטוח מהכנסתה כעובדת עצמאית (בסעיף זה – דמי ביטוח), תהיה זכאית לדמי לידה – (1) בעד פרק זמן של 15 שבועות – אם שולמו דמי ביטוח בעד 10 חודשים מתוך 14 החודשים שקדמו ליום הקובע או בעד 15 חודשים מתוך 22 החודשים שקדמו ליום הקובע; (2) בעד פרק זמן של 8 שבועות – אם שולמו דמי ביטוח בעד 6 חודשים מתוך 14 החודשים שקדמו ליום הקובע."
