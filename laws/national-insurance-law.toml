# חוק הביטוח הלאומי [נוסח משולב], התשנ"ה-1995 — the sections the L4 encodes
# (l4/laws/national-insurance-law.l4): on what terms the Institute's own
# employees serve (§22), and for how many weeks maternity pay is paid (§50).
# Of §50 only subsection (א) is pinned: (ב)–(ז) say which periods count as
# insured, and the L4 takes the months insured as an input.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, the {{ח:...}} markup dropped) on 22.10.2026.
# Section 50 as amended up to תשע"ז־13. §22, which the 3.3.1999 pension
# agreement cites (its (ב): the Institute's employees are appointed by the
# rules for State employees and serve on their terms), was added from the
# live page on 12.11.2026 (MMS-601), when §50(א) read the same.

title = "חוק הביטוח הלאומי [נוסח משולב], התשנ\"ה-1995"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%94%D7%91%D7%99%D7%98%D7%95%D7%97_%D7%94%D7%9C%D7%90%D7%95%D7%9E%D7%99"
text_as_of = "2026-11-12"
about = "החוק שקובע את גמלאות הביטוח הלאומי; כאן הסעיף שקובע כיצד מתמנים עובדי המוסד ובאילו תנאים הם עובדים, והסעיף שקובע לכמה שבועות משולמים דמי לידה"
shared = "החודשים שבעדם שולמו דמי ביטוח לפני היום הקובע."

[[section]]
num = "22"
heading = "עובדים אחרים"
text = "(א) במסגרת התקן שאישר השר תמנה המינהלה את יתר עובדי המוסד ותקבע את תפקידיהם וסמכויותיהם, להוציא את האקטואר של המוסד, שיתמנה בהתאם לסעיף 24, ואת מנהלי הסניפים, שיתמנו בהתאם לסעיף 23. (ב) מינוים של עובדי המוסד לפי סעיף זה יהיה לפי הכללים הקבועים למינוי עובדי המדינה, בשינויים שהענין מחייבם, ותנאי עבודתם של עובדי המוסד יהיו כתנאי העבודה של עובדי המדינה."

[[section]]
num = "50"
heading = "תנאי הזכאות"
text = "(א) מבוטחת ששולמו בעדה דמי ביטוח משכרה כעובדת או ששילמה דמי ביטוח מהכנסתה כעובדת עצמאית (בסעיף זה – דמי ביטוח), תהיה זכאית לדמי לידה – (1) בעד פרק זמן של 15 שבועות – אם שולמו דמי ביטוח בעד 10 חודשים מתוך 14 החודשים שקדמו ליום הקובע או בעד 15 חודשים מתוך 22 החודשים שקדמו ליום הקובע; (2) בעד פרק זמן של 8 שבועות – אם שולמו דמי ביטוח בעד 6 חודשים מתוך 14 החודשים שקדמו ליום הקובע."
