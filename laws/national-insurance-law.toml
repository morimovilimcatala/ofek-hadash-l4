# חוק הביטוח הלאומי [נוסח משולב], התשנ"ה-1995 — the sections the L4 encodes
# (l4/laws/national-insurance-law.l4): on what terms the Institute's own
# employees serve (§22), and for how many weeks maternity pay is paid (§50).
# Of §50 only subsection (א) is pinned: (ב)–(ז) say which periods count as
# insured, and the L4 takes the months insured as an input.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, the {{ח:...}} markup dropped) on 22.10.2026.
# Section 50 as amended up to תשע"ז־13. §22, which the 3.3.1999 pension
# agreement cites (its (ב): the Institute's employees are appointed by the
# rules for State employees and serve on their terms), was added from the
# live page on 12.11.2026 (MMS-601), when §50(א) read the same.
#
# §§53 and 54 — the daily maternity pay and the ordinary wage it is
# computed from — were pinned from the live page on 18.11.2026 for MMS-781
# (a candidate cliff in maternity pay), as amended up to תשפ"א־11. They are
# SOURCE ONLY (`source_only = true`): the words are held so the rule can be
# read and cited, and NO L4 rule computes them yet; their §§ blocks in
# l4/laws/national-insurance-law.l4 say so.

title = "חוק הביטוח הלאומי [נוסח משולב], התשנ\"ה-1995"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%94%D7%91%D7%99%D7%98%D7%95%D7%97_%D7%94%D7%9C%D7%90%D7%95%D7%9E%D7%99"
text_as_of = "2026-11-18"
about = "החוק שקובע את גמלאות הביטוח הלאומי; כאן הסעיף שקובע כיצד מתמנים עובדי המוסד ובאילו תנאים הם עובדים, הסעיף שקובע לכמה שבועות משולמים דמי לידה, ואת נוסח הסעיפים שקובעים את דמי הלידה ליום ואת השכר הרגיל שממנו הם מחושבים"
shared = "החודשים שבעדם שולמו דמי ביטוח לפני היום הקובע."

[[section]]
num = "22"
heading = "עובדים אחרים"
text = "(א) במסגרת התקן שאישר השר תמנה המינהלה את יתר עובדי המוסד ותקבע את תפקידיהם וסמכויותיהם, להוציא את האקטואר של המוסד, שיתמנה בהתאם לסעיף 24, ואת מנהלי הסניפים, שיתמנו בהתאם לסעיף 23. (ב) מינוים של עובדי המוסד לפי סעיף זה יהיה לפי הכללים הקבועים למינוי עובדי המדינה, בשינויים שהענין מחייבם, ותנאי עבודתם של עובדי המוסד יהיו כתנאי העבודה של עובדי המדינה."

[[section]]
num = "50"
heading = "תנאי הזכאות"
text = "(א) מבוטחת ששולמו בעדה דמי ביטוח משכרה כעובדת או ששילמה דמי ביטוח מהכנסתה כעובדת עצמאית (בסעיף זה – דמי ביטוח), תהיה זכאית לדמי לידה – (1) בעד פרק זמן של 15 שבועות – אם שולמו דמי ביטוח בעד 10 חודשים מתוך 14 החודשים שקדמו ליום הקובע או בעד 15 חודשים מתוך 22 החודשים שקדמו ליום הקובע; (2) בעד פרק זמן של 8 שבועות – אם שולמו דמי ביטוח בעד 6 חודשים מתוך 14 החודשים שקדמו ליום הקובע."

[[section]]
num = "53"
heading = "שיעור דמי לידה, הצמדתם וניכויים מהם"
source_only = true
text = "(א) דמי לידה ליום הם שכר העבודה הרגיל של המבוטחת, אך לא יותר מסכום השווה לסכום הבסיסי כפול 5, כשהוא מחולק ב־30. (ב) (בוטל). (ג) (בוטל). (ד) מדמי הלידה ומגימלה לשמירת הריון ינכה המוסד במקור מס לפי הוראות סעיפים 164 ו־243 לפקודת מס הכנסה והתקנות לפיה וכן ינכה דמי ביטוח בשיעור הקבוע בטור ד׳ בלוח י׳."

[[section]]
num = "54"
heading = "חישוב שכר עבודה רגיל"
source_only = true
text = "(א) שכר העבודה הרגיל, לענין סעיף 53, הוא הסכום המתקבל מחלוקת הכנסת המבוטחת, ברבע השנה שקדם ליום הקובע, בתשעים; ולעניין מבוטחת כאמור בסעיף קטן (ב)(1) ו־(3) – הסכום המתקבל מחלוקת הכנסת המבוטחת ברבע השנה שקדם ליום הקובע ב־90, או בששת החודשים שקדמו ליום הקובע ב־180, לפי הגבוה. (ב) לענין סעיף זה, ”הכנסה“ – (1) בעובדת – ההכנסה שממנה מגיעים דמי ביטוח וכן הכנסה מדמי הסתגלות מיוחדים, למעט הכנסותיה כעובדת עצמאית אלא אם כן היתה זכאית לדמי לידה אילו היתה עובדת עצמאית בלבד; (2) בעובדת עצמאית – ההכנסה ששימשה יסוד לחישוב דמי הביטוח בעד רבע השנה האמור בסעיף קטן (א) או ההכנסה ששימשה יסוד לחישוב דמי הביטוח בעד רבע שנה בשנה שקדמה לשנה שבה חל היום הקובע, לפי הגבוה מביניהן, ולעניין מי שילדה בתקופה שמיום י״א באב התש״ף (1 באוגוסט 2020) עד תום התקופה הקובעת כהגדרתה בסעיף 179א – הכנסה כאמור או ההכנסה ששימשה יסוד לחישוב דמי הביטוח בעד רבע שנה בשנת 2019, לפי הגבוה; (3) במבוטחת לפי סעיף 40(ב)(2) – ההכנסה ששימשה יסוד לחישוב דמי הביטוח בעד רבע השנה או ששת החודשים האמורים בסעיף קטן (א), והכל לרבות אותו סכום שהיו מגיעים ממנו דמי ביטוח אילולא הסכום המרבי הקבוע לתשלום דמי ביטוח."
