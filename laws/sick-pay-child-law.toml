title = "חוק דמי מחלה (היעדרות בשל מחלת ילד), התשנ\"ג-1993"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%93%D7%9E%D7%99_%D7%9E%D7%97%D7%9C%D7%94_%28%D7%94%D7%99%D7%A2%D7%93%D7%A8%D7%95%D7%AA_%D7%91%D7%A9%D7%9C_%D7%9E%D7%97%D7%9C%D7%AA_%D7%99%D7%9C%D7%93%29"
text_as_of = "2026-11-08"
about = "החוק שמתיר לעובד לזקוף על חשבון ימי המחלה שלו היעדרות בשל מחלת ילדו, מחלה קשה של ילדו וסיוע לילדו שהוא אדם עם מוגבלות"
shared = "בני המשפחה של העובד, כפי שהחוק שואל עליהם: אם בן זוגו עובד או עצמאי שלא נעדר, אם הוא הורה עצמאי, ואם הילד בהחזקתו הבלעדית."

[[section]]
num = "1"
heading = "היעדרות בשל מחלת ילד"
text = "עובד שעמו ילד שלא מלאו לו 16 שנים, זכאי לזקוף בשל מחלת ילדו, על חשבון תקופת המחלה הצבורה שלו, ימי היעדרות במספר ובתנאים אם התקיים אחד מאלה: (א) בן זוגו הוא עובד ולא נעדר מעבודתו מכוח זכאותו כאמור, או שבן זוגו הוא עובד עצמאי שלא נעדר מעסקו או שעסק במשלח ידו בימי היעדרות העובד – עד 8 ימים בשנה; (ב) הילד נמצא בהחזקתו הבלעדית של העובד, או שהעובד הוא ההורה העצמאי של הילד – עד 16 ימים בשנה; בחוק זה, ”הורה עצמאי“ – כהגדרתו בחוק סיוע למשפחות שבראשן הורה עצמאי, תשנ״ב–1992."

[[section]]
num = "1א"
heading = "היעדרות בשל מחלה קשה של ילד"
text = "(א) עובד שעמו ילד שלא מלאו לו 18 שנה, ועבד שנה לפחות אצל אותו מעסיק או באותו מקום עבודה, זכאי לזקוף עד 90 ימים בשנה של היעדרות. בשל מחלה קשה של ילדו, על חשבון תקופת המחלה הצבורה שלו או על חשבון ימי החופשה המגיעים לו, לפי בחירת העובד; היה בן זוגו עובד ולא נעדר מעבודתו מכוח זכאותו כאמור או שהעובד הוא הורה עצמאי, או שהילד נמצא בהחזקתו הבלעדית, זכאי העובד לזקוף עד 110 ימים בשנה של היעדרות, בשל מחלה קשה של ילדו, כאמור. (ב) בחישוב מספר ימי ההיעדרות לפי סעיף זה, יבואו בחשבון ימי ההיעדרות שזקף העובד לפי סעיף 1. (ג) לענין סעיף זה, ”מחלה קשה“ – מחלה ממארת, מחלה שנדרש לגביה טיפול קבוע בדיאליזה, או מחלה אחרת שקבע שר הכלכלה והתעשייה, בצו, בהתייעצות עם שר הבריאות ובאישור ועדת העבודה הרווחה והבריאות של הכנסת."

[[section]]
num = "1ב"
heading = "היעדרות לצורך מתן סיוע אישי שאדם עם מוגבלות נזקק לו"
text = "(א) עובד שהוא הורה של אדם עם מוגבלות, ועבד שנה לפחות אצל אותו מעסיק או באותו מקום עבודה, זכאי לזקוף עד 18 ימים בשנה של היעדרות על חשבון תקופת המחלה הצבורה שלו או על חשבון ימי החופשה המגיעים לו, לפי בחירת העובד, לצורך מתן סיוע אישי שמחייב היעדרות כאמור, לאדם עם המוגבלות; ואם התקיים בו אחד מאלה, זכאי העובד לזקוף בשנה עד 18 ימים נוספים של היעדרות כאמור, ובלבד שלא היה אדם אחר שניצל את זכותו לזקיפת ימים נוספים לצורך מתן סיוע אישי לאותו אדם עם מוגבלות: (1) בן זוגו הוא עובד, ולא נעדר מעבודתו מכוח זכאותו כאמור; (2) בן זוגו הוא עובד עצמאי שלא נעדר מעסקו או שלא חדל מעיסוק במשלח ידו לצורך מתן סיוע אישי; (3) הוא הורה עצמאי; (4) האדם עם המוגבלות נמצא בהחזקתו הבלעדית. (א1) (1) בזקיפת ימי היעדרות כאמור בסעיף קטן (א), זכאי עובד להביא בחשבון, לפי בחירתו, גם חלקי ימים שבהם נעדר לפי הוראות סעיף זה בשל מחלת ילדו שהוא אדם עם מוגבלות או לצורך מתן סיוע אישי לו; חלקי ימים לעניין זה יחושבו לפי היחס שבין שעות ההיעדרות ובין שעות העבודה של העובד באותו יום אילולא נעדר. (2) על אף האמור בסעיף 2(א)(1) ו־(2) לחוק דמי מחלה, התשל״ו–1976 (להלן – חוק דמי מחלה), עובד שהוא הורה של אדם עם מוגבלות זכאי לתשלום דמי מחלה החל מהיום הראשון, ובכלל זה מחלקו, שבו נעדר בשל מחלת ילדו שהוא אדם עם מוגבלות או לצורך מתן סיוע אישי לו. (א2) (1) נוסף על הוראות סעיף קטן (א), עובד כאמור באותו סעיף קטן זכאי להיעדר עד 52 שעות בשנה לצורך מתן סיוע אישי שמחייב היעדרות לאדם עם המוגבלות, בלא ניכוי משכר עבודתו; התקיים בעובד כאמור אחד מהתנאים האמורים בפסקאות (1) עד (4) שבסעיף קטן (א), יהיה זכאי להיעדר עד 52 שעות נוספות בשנה בלא ניכוי משכרו, ובלבד שלא היה אדם אחר שניצל את זכותו להיעדרות מכוח פסקה זו; זכותו של עובד לפי סעיף קטן זה נוספת על כל זכות אחרת שנתונה לו לפי חוק זה, ואינה תלויה או מותנית בזכות אחרת לפי חוק זה. (2) הוראות פסקה (1) יחולו גם על עובד המועסק במשרה שאינה משרה מלאה, ואולם שעות ההיעדרות שיהיה זכאי להיעדר בהן יהיו כיחס שבין חלקיות משרתו ובין מספר השעות הנקוב באותה פסקה; שיעור חלקיות המשרה יחושב כיחס שבין שעות העבודה של העובד בחודש ובין מספר שעות עבודה בחודש במשרה מלאה כנהוג במקום העבודה של העובד או 186 שעות, לפי הנמוך. (3) בסעיף קטן זה, ”שעות העבודה של העובד בחודש“ – הממוצע החודשי של שעות העבודה של העובד ברבע השנה שבו עבד בהיקף השעות הגדול ביותר ב־12 החודשים שקדמו למועד ההיעדרות הראשון לפי סעיף קטן זה; במניין שעות העבודה תובא בחשבון גם היעדרות בתשלום שדינו כדין שכר עבודה. (ב) הוראות סעיף זה יחולו, בשינויים המחויבים, לגבי עובד שהוא אפוטרופוס של אדם עם מוגבלות, ובלבד שאין אדם אחר המטפל באדם עם המוגבלות, ואין אפוטרופוס אחר שניצל את זכותו לפי סעיף קטן זה. (ג) בחישוב מספר ימי ההיעדרות לפי סעיף קטן (א), יבואו בחשבון ימי ההיעדרות שזקף העובד לפי סעיף 1 או 1א, בקשר עם מחלת ילדו שהוא אדם עם מוגבלות. (ד) בסעיף זה – ”אדם עם מוגבלות“ – כהגדרתו בסעיף 5 לחוק שוויון זכויות לאנשים עם מוגבלות, התשנ״ח–1998; ”סיוע אישי“ – סיוע שהאדם עם המוגבלות נזקק לו בשל מוגבלותו, לרבות השגחה, ליווי וטיפול. (ה) הוראת סעיף זה לא תחול לגבי עובד שהוא הורה של אדם עם מוגבלות אך מוגבלותו אינה קבועה, צפויה לחלוף בתוך 60 ימים ממועד הופעתה ואינה צפויה להישנות."

[[section]]
num = "1ג"
heading = "משפחת אומנה"
text = "הוראות סעיפים 1 עד 1ב יחולו, בשינויים המחויבים, לגבי עובד שהוא הורה במשפחת אומנה, ואולם ההיעדרות של עובד כאמור תיזקף או תימנה רק אם הורהו הטבעי או הורהו המאמץ, של הילד או של האדם עם המוגבלות, לפי הענין, לא מימש, באותם ימים או שעות, את זכאותו לזקיפה או להיעדרות מכוח אותה זכות; לענין סעיף זה, ”משפחת אומנה“ – משפחת אומנה כהגדרתה בחוק אומנה לילדים, התשע״ו–2016."

[[section]]
num = "3"
heading = "שמירת זכויות"
text = "חוק זה בא להוסיף על זכותו של עובד מכוח דין או הסכם ולא לגרוע ממנה."

[[section]]
num = "3א"
heading = "דין המדינה"
text = "לענין חוק זה דין המדינה כמעסיק כדין כל מעסיק אחר."

