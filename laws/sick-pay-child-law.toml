# חוק דמי מחלה (היעדרות בשל מחלת ילד), התשנ"ג-1993 — the sections the L4
# encodes (l4/laws/sick-pay-child-law.l4, MMS-601): the days an employee may
# charge to his accrued sick leave for a child's illness, a child's serious
# illness and the personal assistance a child with a disability needs, a
# foster parent's share in them, that the law adds to every other right,
