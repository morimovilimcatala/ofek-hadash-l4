# חוק שעות עבודה ומנוחה, התשי"א-1951 — the sections the L4 encodes
# (l4/laws/hours-of-work-law.l4, MMS-601): what working hours, overtime and
# night work are, the working day and week, a longer day or week a collective
# agreement the Minister approved may set, overtime and work in the weekly
# rest forbidden unless permitted, the weekly rest of 36 hours, the pay for
# overtime and for work in the weekly rest and the regular wage it is
# reckoned on, the breaks, whom the law does not reach, that a State employee
# is like any other, and that the law takes away no better right.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped,
# and with it the notes "פורסמו ..." that name the regulations and permits
# made under a section) on 8.11.2026, as amended up to תשע"ח (amendment 18).
# The page prints §16's and §17's fractions as a superscript over a
# subscript; they are written 1¹⁄₄, 1¹⁄₂, and §20's ³⁄₄.
#
# The corpus links the law in six documents: the corona arrangement of
# 16.9.2020 (its §2(ב)), the public-sector framework of 17.7.2023 (its
# §30(א)), the Oz LaTmura agreement of 14.8.2011 (§14(ח), and its §5 in
# §62), the של"ח teachers' agreement of 13.1.1978 and the takanon's §6.17.7
# (the pay for work in the weekly rest), and circular תשפ"ב/3 (overtime).
# The takanon's §1.25.5 names it without a link ("הפסקות על פי שעות עבודה
# ומנוחה"). It rules all the same on every subject below wherever an
# instrument sets a teacher's hours: a full position's week (the Ofek Hadash
# base agreement's §§15, 33; Oz LaTmura's §§9, 14), the hours beyond it and
# their pay (the takanon's §1.24, base §33, Oz §14), and the pay for escorting
# pupils outside school (the takanon's §1.10).

title = "חוק שעות עבודה ומנוחה, התשי\"א-1951"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%A9%D7%A2%D7%95%D7%AA_%D7%A2%D7%91%D7%95%D7%93%D7%94_%D7%95%D7%9E%D7%A0%D7%95%D7%97%D7%94"
text_as_of = "2026-11-08"
about = "החוק שקובע את יום העבודה ושבוע העבודה המרביים, אוסר שעות נוספות ועבודה במנוחה השבועית שלא הותרו, קובע מנוחה שבועית של 36 שעות והפסקות, ומחייב גמול של 125% ו־150% על שעות נוספות ו־150% על עבודה במנוחה השבועית"
shared = "\"שעות עבודה\" (סעיף 1): הזמן שבו העובד עומד לרשות העבודה, לרבות הפסקות קצרות ומוסכמות, חוץ מהפסקות סעיף 20. עובד המדינה דינו ככל עובד (סעיף 31)."

[[section]]
num = "1"
heading = "פירושים"
text = "בחוק זה – ”שעות עבודה“ פירושו – הזמן שבו עומד העובד לרשות העבודה, לרבות הפסקות קצרות ומוסכמות הניתנות לעובד להחלפת כוח ואויר ולרבות הפסקות לפי סעיף 20א(א), חוץ מהפסקות על פי סעיף 20; ”שעות נוספות“ פירושו – שעות העבודה העודפות – (א) על התחום שנקבע ליום עבודה בסעיף 2, או על יום עבודה שייקבע על פי סעיף 4, או (ב) על התחום שנקבע לשבוע עבודה בסעיף 3, או על שבוע עבודה שייקבע על פי סעיף 4; ”עבודת לילה“ פירושו – עבודה ששתי שעות ממנה, לפחות, הן בתחום השעות שבין 22 ובין 06.00; ”מפקח עבודה“ פירושו – מפקח כמשמעותו בפקודת מחלקת העבודה, 1943; ”מפקח עבודה אזורי“ פירושו – מפקח עבודה שנתמנה על ידי שר העבודה להיות מפקח עבודה אזורי."

[[section]]
num = "2"
heading = "יום עבודה"
text = "(א) יום עבודה לא יעלה על שמונה שעות עבודה. (ב) בעבודת לילה וביום שלפני המנוחה השבועית וביום שלפני חג שהעובד אינו עובד בו, בין על פי חוק ובין על פי הסכם או נוהג, לא יעלה יום עבודה על שבע שעות עבודה."

[[section]]
num = "3"
heading = "שבוע עבודה"
text = "שבוע עבודה לא יעלה על ארבעים וחמש שעות עבודה."

[[section]]
num = "5"
heading = "שינוי לפי הסכם קולקטיבי"
text = "(א) אישר שר העבודה הסכם קולקטיבי, שבו נקבע יום עבודה ארוך משמונה שעות עבודה או שבוע עבודה ארוך מארבעים וחמש שעות, דינם של יום עבודה ושבוע עבודה כאלה כדין יום עבודה ושבוע עבודה לפי הסעיפים 2 ו־3. שר העבודה לא יתן אישור על פי סעיף קטן זה, אלא אם – (1) נוכח שבגלל הנסיבות המיוחדות אין לקיים יום עבודה כקבוע בסעיף 2 או שבוע עבודה כקבוע בסעיף 3; (2) המספר הממוצע של שעות העבודה לתקופה שנקבעה בהסכם הקולקטיבי אינו עולה על עשר ליום וארבעים וחמש לשבוע. (ב) אישר שר העבודה הסכם קולקטיבי, שבו נקבע לאחד הימים בשבוע יום עבודה שלא למעלה מחמש שעות עבודה ולשני ימים בשבוע יום עבודה שלא למעלה מתשע שעות עבודה, דינם של ימי עבודה כאלה כדין יום עבודה לפי סעיף 2."

[[section]]
num = "6"
heading = "איסור העסקה בשעות נוספות"
text = "העסקת עובד בשעות נוספות אסורה, אם אינה מותרת לפי סעיף 10, או אם לא הותרה לפי סעיף 11."

[[section]]
num = "7"
heading = "שעות המנוחה השבועית"
text = "(א) לפחות שלושים ושש שעות רצופות לשבוע הן המנוחה השבועית של העובד. (ב) המנוחה השבועית תכלול – (1) לגבי יהודי – את יום השבת; (2) לגבי מי שאינו יהודי – את יום השבת או את יום הראשון או את היום הששי בשבוע, הכל לפי המקובל עליו כיום המנוחה השבועית שלו."

[[section]]
num = "9"
heading = "איסור העסקה במנוחה השבועית"
text = "העסקת עובד במנוחה השבועית אסורה, אם לא הותרה לפי סעיף 12."

[[section]]
num = "16"
heading = "גמול שעות נוספות"
text = "(א) הועסק עובד שעות נוספות, ישלם לו המעסיק בעד שתי השעות הנוספות הראשונות שבאותו יום שכר עבודה לא פחות מ־1¹⁄₄ מהשכר הרגיל, ובעד כל שעה נוספת שאחריהן לא פחות מ־1¹⁄₂ מהשכר הרגיל. היה שכרו של עובד, כולו או חלקו, לפי כמות התוצרת, ישלם לו המעסיק בעד כל יחידה, שנעשתה בשתי השעות הנוספות הראשונות שבאותו יום, שכר עבודה לא פחות מ־1¹⁄₄ מהשכר המשתלם בעד כל יחידה שנעשתה בשעות העבודה הרגילות, ובעד כל יחידה שנעשתה בשעות הנוספות שלמעלה משתים – לא פחות מ־1¹⁄₂ מהשכר המשתלם בעד כל יחידה שנעשתה בשעות העבודה הרגילות. (ב) היה שכרו של העובד על בסיס של חודש או של תקופה ארוכה יותר, יהא המעסיק זכאי ליתן לעובד בעבודה מן העבודות המפורטות בפסקה (2) של סעיף 4(א) ובסעיף 4(ב), במקום תשלום שכר לפי סעיף זה, מנוחה של שעה ורבע לפחות תמורת כל שעה משתי השעות הנוספות הראשונות שבאותו יום, ומנוחה של שעה וחצי לפחות תמורת כל שעה נוספת שאחריהן."

[[section]]
num = "17"
heading = "גמול עבודה במנוחה השבועית"
text = "(א) הועסק עובד בשעות המנוחה השבועית או בחלק מהן: (1) ישלם לו המעסיק בעד שעות אלה שכר עבודה לא פחות מ־1¹⁄₂ משכרו הרגיל. היה שכרו של העובד, כולו או חלקו, לפי כמות התוצרת, ישלם לו המעסיק בעד כל יחידה שנעשתה בשעות המנוחה השבועית שכר עבודה לא פחות מ־1¹⁄₂ מהשכר המשתלם בעד כל יחידה שנעשתה בשעות העבודה הרגילות; (2) יתן לו המעסיק, במקום שעות המנוחה השבועית שבהן עבד, שעות מנוחה במספר ובזמן שנקבעו בהיתר שלפיו הועסק. (ב) היה שכרו של העובד על בסיס של חודש או של תקופה ארוכה יותר, יהא המעסיק זכאי ליתן לעובד, במקום הגמול לפי פסקה (1) של סעיף קטן (א), מנוחה של שעה וחצי לפחות תמורת כל שעה משעות המנוחה השבועית שבה עבד."

[[section]]
num = "18"
heading = "שכר רגיל"
text = "לענין הסעיפים 16 ו־17, ”שכר רגיל“ כולל כל התוספות שמעסיק משלם לעובדו."

[[section]]
num = "20"
heading = "הפסקות"
text = "(א) ביום עבודה של שש שעות ולמעלה, תופסק העבודה למנוחה ולסעודה ל־³⁄₄ שעה לפחות, ובכלל זה תהיה הפסקה רצופה אחת של חצי שעה לפחות; ביום שלפני המנוחה השבועית וביום שלפני חג ההפסקה היא של חצי שעה לפחות. (ב) הפסקה לפי סעיף קטן (א) לא תעלה על שלוש שעות. (ג) בעת הפסקה לפי סעיף קטן (א) הנמשכת חצי שעה או יותר רשאי העובד לצאת מהמקום שבו הוא עובד, אלא אם נוכחותו במקום העבודה היא הכרח לתהליך העבודה או להפעלת הציוד והשימוש בו, והעובד נדרש על ידי מעסיקו להישאר במקום העבודה, ובמקרה זה ייחשב זמן ההפסקה כחלק משעות העבודה. (ד) עובד רשאי להתפלל במהלך יום עבודתו בהתאם לדרישות דתו; זמן התפילה ייקבע במקום העבודה בהתאם לצורכי העבודה ואילוציה, ובהתחשב בדרישות דתו של העובד."

[[section]]
num = "30"
heading = "תחולת החוק"
text = "(א) חוק זה אינו חל על העסקתם של: (1) שוטרים במשטרת ישראל, וכן כל מי שנמנה עם שירות בתי הסוהר; (2) עובדי המדינה שתפקידם מחייב לעמוד לרשות העבודה גם מחוץ לשעות העבודה הרגילות; (3) יורדי ים ועובדי דיג; (4) אנשי צוות אויר; (5) עובדים בתפקידי הנהלה או בתפקידים הדורשים מידה מיוחדת של אמון אישי; (6) עובדים שתנאי עבודתם ונסיבותיה אינם מאפשרים למעסיק כל פיקוח על שעות העבודה והמנוחה שלהם. (ב) נתעוררו חילוקי דעות אם עובד שייך לאחד מסוגי העובדים שחוק זה אינו חל על העסקתם, רשאים העובד, המעסיק, ועד העובדים במקום, אם ישנו, או מפקח עבודה, לבקש את הכרעת בית הדין לעבודה, כמשמעותו בחוק בית הדין לעבודה, תשכ״ט–1969; בית הדין יתן לועד העובדים הזדמנות להשמיע את דברו בדרך שיורה אף אם לא הועד הוא שביקש את ההכרעה."

[[section]]
num = "31"
heading = "המדינה כמעסיק"
text = "לענין חוק זה דין עובד המדינה כדין כל עובד אחר."

[[section]]
num = "35"
heading = "שמירת זכויות"
text = "חוק זה אינו בא למעט מכל זכות הנתונה לעובד על פי חוק, הסכם קולקטיבי, חוזה עבודה או נוהג."
