# חוק חופשה שנתית, התשי"א-1951 — the sections the L4 encodes
# (l4/laws/annual-leave-law.l4, MMS-601): what "the leave" and a work year
# are, the right to it, its length by seniority and in proportion to the
# days worked, the temporary wage-earner, the days not counted as leave,
# when it is given and the day an employee chooses, accumulation and
# continuity, holiday pay, redemption on leaving, the payment for a
# temporary wage-earner, that a State employee is like any other, and that
# the law takes away no better right.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped,
# and with it the notes "פורסמו ..." that name the regulations made under a
# section) on 8.11.2026, as amended up to תשפ"ו (amendment 17).
#
# The corpus links the law once: the takanon's §1.7 prints it among its
# sources ("חוק חופשה שנתית, תשי"א -1951, סעיף 7(א)") for the recuperation
# allowance's accumulation. It rules all the same on every
# subject below — a teacher's vacation is the school recesses (the takanon's
# §§1.25.1-1.25.2), an instructor's and an ulpan teacher's are days a year
# (§§8.1, 14.5), a substitute's is a share of the pay (§§1.30, 2.1.8), and
# the wage agreement of 19.10.2022 adds two days of the teacher's choosing
# (§29).

title = "חוק חופשה שנתית, התשי\"א-1951"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%97%D7%95%D7%A4%D7%A9%D7%94_%D7%A9%D7%A0%D7%AA%D7%99%D7%AA"
text_as_of = "2026-11-08"
about = "החוק שקובע לכל עובד חופשה שנתית בתשלום: כמה ימים לפי הוותק ולפי ימי העבודה, מתי היא ניתנת ויום שהעובד בוחר, צבירה ורציפות, דמי החופשה ופדיון החופשה כשהעובד חדל לעבוד"
shared = "\"שנת עבודה\" (סעיף 1): שנים עשר חודש שתחילתם ב־1 בינואר — לא שנת הלימודים. עובד המדינה דינו ככל עובד (סעיף 33)."

[[section]]
num = "1"
heading = "פירושים"
text = "בחוק זה – ”החופשה“ פירושו – חופשה שנתית המגיעה לעובד על פי חוק זה; ”מפקח עבודה“ פירושו – מפקח, כמשמעותו בפקודת מחלקת העבודה, 1943; ”עובד בשכר“ פירושו – עובד שגמול עבודתו, כולו או חלקו, משתלם שלא על בסיס של חודש או תקופה ארוכה מזו; ”קרן חופשה“ פירושה – קרן חופשה ששר העבודה הקימה או הסמיכה על פי סעיף 18; ”שנת עבודה“ פירושו – פרק זמן של שנים עשר חודש, שתחילתו אחד בינואר של כל שנה."

[[section]]
num = "2"
heading = "הזכות לחופשה"
text = "כל עובד זכאי לחופשה שתינתן לפי הוראות חוק זה."

[[section]]
num = "3"
heading = "אורך החופשה"
text = "(א) אורך החופשה לכל שנת עבודה אצל מעסיק אחד או במקום עבודה אחד הוא: (1) בעד כל אחת מ־5 השנים הראשונות – 16 יום; (2) (נמחקה); (3) בעד השנה השישית – 18 יום; (4) בעד השנה השביעית – 21 יום; (5) בעד השנה השמינית ואילך – יום נוסף לכל שנת עבודה עד לחופשה של 28 יום; אך שר העבודה רשאי לקבוע, בתקנות, לעבודה מסויימת חופשה ארוכה מזו, אם ראה צורך בכך מטעמים שבבריאות העובד או שבנסיבות העבודה; בימי החופשה לא ייכלל אלא מנוחה שבועית אחת לכל שבעה ימי חופשה. (ב) היה הקשר המשפטי שבין העובד ובין המעסיק קיים כל שנת העבודה, והעובד עבד באותה שנה – (1) לפחות 200 ימים – יהיה מספר ימי החופשה כאמור בסעיף קטן (א); (2) פחות מ־200 ימים – יהיה מספר ימי החופשה חלק יחסי ממספר הימים שלפי סעיף קטן (א), כיחס מספר ימי העבודה בפועל אל המספר 200; חלק של יום חופשה לא יובא במנין. (ג) היה הקשר המשפטי שבין העובד ובין המעסיק קיים בחלק משנת העבודה, והעובד עבד בתוך אותו חלק שנה – (1) לפחות 240 ימים – יהיה מספר ימי החופשה כאמור בסעיף קטן (א); (2) פחות מ־240 ימים – יהיה מספר ימי החופשה חלק יחסי ממספר הימים שלפי סעיף קטן (א), כיחס מספר ימי העבודה בפועל אל המספר 240; חלק של יום חופשה לא יובא במנין."

[[section]]
num = "4"
heading = "עובד זמני בשכר"
text = "(א) סעיף 3 אינו חל על עובד בשכר שעבד פחות מ־75 ימים רצופים, אצל מעסיק אחד או במקום עבודה אחד, בין בשנת עבודה אחת ובין בשתי שנות עבודה רצופות. לעובד כאמור תשולם תמורת חופשה, כמפורש בפרק השלישי. (ב) לענין סעיף קטן (א) רואים ימי עבודה כרצופים, אפילו חלה הפסקה בעבודה מחמת – (1) שירות מילואים לפי חוק שירות המילואים, התשס״ח–2008; (2) יום המנוחה השבועית או חג שאין עובדים בהם, אם על פי חוק ואם על פי הסכם או נוהג, וכן אחד במאי; (3) חופשה על פי חוק זה וכל חופשה או פגרה שניתנה לעובד על פי חוק או בהסכמת המעסיק, בין בשכר ובין שלא בשכר; (4) שביתה או השבתה; (5) תאונה או מחלה; (6) ימי אבל במשפחה שמטעמי דת או נוהג לא עבד בהם העובד; (7) הפסקה ארעית ללא הפסקת יחסי עבודה; (8) אימון לשירות עבודה לפי חוק שירות עבודה בשעת חירום, תשכ״ז–1967."

[[section]]
num = "5"
heading = "חישוב ימי החופשה"
text = "(א) ואלה הימים שלא יובאו במנין ימי החופשה; (1) הימים בהם שירת העובד שירות מילואים לפי חוק שירות המילואים, התשס״ח–2008; (2) ימי חג שאין עובדים בהם, אם על פי חוק ואם על פי הסכם או נוהג – להוציא ימי המנוחה השבועית; (3) ימי תקופת לידה והורות; (4) הימים שבהם אין העובד מסוגל לעבוד מחמת תאונה או מחלה; (5) ימי אבל במשפחה, שמטעמי דת או נוהג אין העובד עובד בהם; (6) ימי שביתה או השבתה; (7) ימי הודעה מוקדמת לפיטורים, אלא אם עלו על ארבעה עשר ובמידה שעלו. (ב) חלו ימים מן האמורים בסעיף קטן (א) בימי החופשה, יראו את החופשה כנפסקת לאותם הימים, ויש להשלימה ככל האפשר תוך אותה שנת עבודה."

[[section]]
num = "6"
heading = "מועד החופשה"
text = "(א) החופשה תינתן בחודש האחרון של שנת העבודה שבעדה היא ניתנת, או במשך שנת העבודה שלאחריה. (ב) על אף הוראות סעיף קטן (א), רשאי עובד לקחת יום אחד מן החופשה במהלך שנת העבודה שבעדה היא ניתנת במועד שיבחר ויום אחד נוסף באחד מהימים המנויים בתוספת, ואולם אין ברשימת הימים כאמור כדי לפגוע בהוראות סעיף 5, ובלבד שהודיע על כך למעסיקו 30 ימים מראש לפחות. (ג) שר התעשייה המסחר והתעסוקה רשאי, בצו, להוסיף על רשימת הימים המנויים בתוספת."

[[section]]
num = "7"
heading = "צבירת החופשה"
text = "(א) אין החופשה ניתנת לצבירה; ואולם רשאי העובד בהסכמת המעסיק, לקחת רק שבעה ימי חופשה לפחות ולצרף את היתרה לחופשה שתינתן בשתי שנות העבודה הבאות. (ב) שר העבודה רשאי, בתקנות, לאסור צבירת חופשה אם, לדעתו, בריאות העובד או הנסיבות בהן העבודה נעשית מחייבים כי כל החופשה תינתן לעובד מדי שנה בשנה."

[[section]]
num = "8"
heading = "רציפות החופשה"
text = "החופשה תהיה רצופה, אלא שבהסכמת העובד והמעסיק ובאישור ועד העובדים במקום, אם ישנו, אפשר לחלקה, ובלבד, שפרק אחד ממנה יהיה לפחות שבעה ימים."

[[section]]
num = "10"
heading = "דמי החופשה"
text = "(א) המעסיק חייב לשלם לעובד בעד ימי החופשה דמי חופשה בסכום השווה לשכרו הרגיל. (ב) השכר הרגיל לענין סעיף זה הוא – (1) לגבי עובד שגמול עבודתו, כולו או חלקו, משתלם על בסיס של חודש או תקופה ארוכה מזו – שכר העבודה שהעובד היה מקבל בעד אותו פרק זמן אילו לא יצא לחופשה והוסיף לעבוד; (2) לגבי עובד בשכר – שכר העבודה היומי הממוצע כפול במספר ימי החופשה; שכר העבודה היומי הממוצע הוא הסכום היוצא מחילוק שכר רבע השנה שקדמה לחופשה למספר תשעים; היו ברבע השנה כאמור חדשי עבודה לא־מלאה, יחושב השכר היומי הממוצע לפי רבע השנה של העבודה המלאה ביותר שבשנים עשר החדשים שקדמו לחופשה, הכל לפי בחירת העובד. (ג) שכר עבודה לענין סעיף (ב) הוא כל תמורה, בכסף או בשווה כסף, המשתלמת לעובד על ידי המעסיק בעד שעות העבודה הרגילות, זולת אם נקבע אחרת בהסכם קיבוצי שאושר לענין זה על ידי שר העבודה. סכום המשתלם לעובד לכיסוי הוצאות מיוחדות שאינן קיימות בעת החופשה, אין רואים אותו כחלק משכר העבודה."

[[section]]
num = "13"
heading = "פדיון חופשה"
text = "חדל עובד לעבוד לפני שניתנה לו החופשה המגיעה לו עד ליום שבו חדל לעבוד, ישלם המעסיק פדיון חופשה בסכום השווה לדמי החופשה שהיו משתלמים לעובד אילו יצא לחופשה ביום שבו חדל לעבוד."

[[section]]
num = "15"
heading = "תשלום תמורת חופשה"
text = "(א) עובד בשכר העובד אצל מעסיק אחד או במקום עבודה אחד לפחות יום אחד אך פחות מ־75 ימים רצופים כאמור בסעיף 4, בין בשנת עבודה אחת ובין בשתי שנות עבודה רצופות, ואין ביניהם חוזה עבודה בכתב לתקופת עבודה רצופה העולה על 74 ימים – ישלם בעדו המעסיק תמורת חופשה 4% לפחות משכר העבודה. (ב) תמורת החופשה תשולם לקרן החופשה של ענף העבודה שבו עבד העובד או בכל דרך אחרת שנקבעה בתקנות. (ג) היתה תמורת החופשה משתלמת לקרן החופשה, חייב המעסיק לשלמה בתחילת החודש שלאחר חודש העבודה, לפי שכר העבודה המשתלם בחודש שלפניו לעובדים כאמור בסעיף קטן (א); המשיך העובד לעבוד אצל אותו מעסיק או באותו מקום עבודה מעל ל־74 ימים רצופים, ישלם לו המעסיק את דמי החופשה, או פדיון חופשה, הכל לפי הענין, וקרן החופשה תחזיר למעסיק, לפי בקשתו, את הסכומים שהעביר לה בשל אותו עובד; שר העבודה רשאי לקבוע בתקנות את המועדים והסדרים להחזרת הסכומים על ידי קרן החופשה, כאמור. (ד) תמורת החופשה ששולמה לקרן חופשה תימסר לעובד לפי הוראות תקנון הקרן, ותמורת החופשה ששולמה בדרך אחרת תימסר לעובד בדרך שתיקבע בתקנות. (ה) קרן החופשה רשאית – בהסכמת העובדים שתינתן בהסכם קיבוצי, בחוזה עבודה או בדרך אחרת שתיקבע – לבוא לידי הסכם עם המעסיק בדבר תשלום דמי החופשה לקרן גם בעד עובדים שעבדו אצלו מעל ל־75 ימים."

[[section]]
num = "33"
heading = "דין עובדי המדינה"
text = "לענין חוק זה דין עובד המדינה כדין כל עובד אחר."

[[section]]
num = "38"
heading = "שמירת זכויות"
text = "חוק זה אינו בא למעט מכל זכות הנתונה לעובד לפי חוק, הסכם קולקטיבי, חוזה עבודה או נוהג."

