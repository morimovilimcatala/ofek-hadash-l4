# חוק שוויון ההזדמנויות בעבודה, התשמ"ח-1988 — the sections the L4 encodes
# (l4/laws/equal-opportunities-law.l4, MMS-601): that an employer does not
# discriminate between employees by sex or parenthood, among other grounds;
# what is not discrimination; that a right a mother has in connection with
# parenthood is a father's too, on the law's conditions; and that the State
# is an employer like any other.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped,
# and with it the note "פורסמו ..." that names the regulations made under
# §4) on 8.11.2026, as amended up to תשפ"ו (the amendment of the schedule).
# §2(ג)'s "מאפיים" and §2(א1)(2)'s "בין קבלן כוח אדם המועסקים" are as the
# page prints them.
#
# The sections are the one the corpus cites by number
# (data/statute-citations.json) — §4, which five documents apply to the
# day-care supplement ("ויחולו לגביה הוראות סעיף 4(א) לחוק האמור") — with
# §2, the prohibition the takanon names among the sources of a mother's
# resignation and that every instrument giving mothers alone a benefit rules
# within; §3, which keeps a better right given to a woman from counting as
# discrimination; and §17, which applies the law to the State as an
# employer.

title = "חוק שוויון ההזדמנויות בעבודה, התשמ\"ח-1988"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%A9%D7%95%D7%95%D7%99%D7%95%D7%9F_%D7%94%D7%94%D7%96%D7%93%D7%9E%D7%A0%D7%95%D7%99%D7%95%D7%AA_%D7%91%D7%A2%D7%91%D7%95%D7%93%D7%94"
text_as_of = "2026-11-08"
about = "החוק שאוסר על מעסיק להפלות בין עובדיו, בין השאר מחמת מינם והיותם הורים: מה אינו הפליה, ושזכות בקשר להורות שעובדת זכאית לה ניתנת גם לעובד, בתנאי החוק"
shared = "בני המשפחה של עובד שאב לילד, כפי שסעיף 4(א) שואל עליהם: אם בת זוגו עובדת ולא השתמשה בזכות, ואם הילד בהחזקתו הבלעדית."

[[section]]
num = "2"
heading = "איסור הפליה"
text = "(א) לא יפלה מעסיק בין עובדיו או בין דורשי עבודה מחמת מינם, נטייתם המינית, מעמדם האישי, הריון, טיפולי פוריות, טיפולי הפריה חוץ־גופית, היותם הורים, גילם, גזעם, דתם, לאומיותם, ארץ מוצאם, מקום מגוריהם, השקפתם, מפלגתם או שירות במילואים שלהם, של בני זוגם או של הורהו האחר של ילדם, ובכלל זה קריאתם לשירות מילואים או השירות הצפוי בשירות מילואים, לרבות מחמת תדירותו או משכו, כמשמעותו בחוק שירות בטחון [נוסח משולב], התשמ״ו–1986, הצפוי להם, בכל אחד מאלה: (1) קבלה לעבודה; (2) תנאי עבודה; (3) קידום בעבודה; (4) הכשרה או השתלמות מקצועית; (5) פיטורים או פיצויי פיטורים; (6) הטבות ותשלומים הניתנים לעובד בקשר לפרישה מעבודה; בסעיף קטן זה – ”ילד“ – כהגדרתו בסעיף 41א2(א) לחוק החיילים המשוחררים (החזרה לעבודה), התש״ט–1949; ”שירות מילואים“ – כהגדרתו בחוק שירות ביטחון [נוסח משולב], התשמ״ו–1986. (א1) (1) לא יפלה מעסיק בפועל בין עובדים של קבלן כוח אדם המועסקים אצלו, וכן לא יפלה בין מועמדים לעבודה אצלו שהופנו אליו על ידי קבלן כוח אדם בכל הקשור לקבלה לעבודה, להפסקת עבודה ולתנאים במקום העבודה, והכל מחמת הטעמים המפורטים בסעיף קטן (א); (2) מעסיק בפועל לא יציע לקבלן כוח אדם, לא יבקש ולא ידרוש ממנו להפלות כאמור בסעיף קטן (א) בין קבלן כוח אדם המועסקים אצל המעסיק בפועל או בין המועמדים לעבודה; (3) הוראות סעיף קטן זה באות להוסיף על האיסור החל על פי הוראות סעיף קטן (א) על קבלן כוח אדם כמעסיק. (ב) לענין סעיפים קטנים (א) ו־(א1) רואים כהפליה גם קביעת תנאים שלא ממין הענין. (ג) אין רואים הפליה לפי סעיף זה כאשר היא מתחייבת מאפיים או ממהותם של התפקיד או המשרה."

[[section]]
num = "3"
heading = "שמירת זכויות"
text = "(א) הוראה שנקבעה בחיקוק, בהסכם קיבוצי או בחוזה עבודה בקשר להריון, לשמירת הריון, ללידה, להנקה או לפוריות, אין בה הפליה. (ב) אין בחוק זה כדי לגרוע מזכות יתר המוענקת לעובדת לפי חיקוק, לפי הסכם קיבוצי או לפי חוזה עבודה, ואין רואים זכות כזו כהפליה."

[[section]]
num = "4"
heading = "זכויות הורה"
text = "(א) זכאית עובדת, בהתאם לתנאי העבודה הנהוגים במקום עבודתה, לזכות בקשר להורות, תהא זכות זו נתונה גם לעובד המועסק במקום עבודה שבו נהוגים תנאי עבודה כאמור, אם התקיים בו אחד מאלה: (1) בת זוגו היא עובדת או עובדת עצמאית ולא נעדרה מעבודתה, מעסקה או מעיסוק במשלח ידה מכוח זכאותה כאמור בסעיף קטן (ב)(1) או (2) או שלא השתמשה בזכות כאמור בסעיף קטן (ב)(3) או (4); (2) הילד נמצא בהחזקתו הבלעדית. (ב) בסעיף זה, ”זכות בקשר להורות“ – אחד מאלה: (1) היעדרות מעבודה בשל מחלת הילד; (2) יום עבודה מקוצר בשל היות העובדת אם לילד; (3) זכות להשתמש בשירותי מעון שהמעסיק מעמיד לרשות ילדי העובדים; (4) השתתפות המעסיק בעלות החזקתו של הילד במעון."

[[section]]
num = "17"
heading = "דין המדינה"
text = "לענין חוק זה דין המדינה כמעסיק כדין כל מעסיק אחר."
