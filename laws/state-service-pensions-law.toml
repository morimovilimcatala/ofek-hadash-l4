# supplement, which every wage agreement since 1999 names when it says a new
# supplement counts toward the budgetary pension; §10, how the period of
# service is counted, which the takanon's §1.25.7 applies to maternity leave;
# §17א, the early pension, which the 17.4.2008 agreement reaches; §22, the
