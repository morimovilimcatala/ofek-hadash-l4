about = "החוק שקובע את הגמלאות של עובד המדינה בפנסיה תקציבית: מהי המשכורת הקובעת ומהי תוספת קבועה, כיצד נמנית תקופת השירות, יציאה מוקדמת לקצבה, המענק הנוסף למי שפוטר לפני גיל 60, וקצבה של מי שחזר לשירות"

[[section]]
num = "1"
heading = "הגדרות"
text = "בחוק זה – ”בני זוג“ – (1) עובד או זכאי לקצבת פרישה, ואשתו לרבות הידועה בציבור כאשתו; (2) עובדת או זכאית לקצבת פרישה, ובעלה לרבות הידוע בציבור כבעלה; ”בן זוג לשעבר“, של עובד או עובדת, או של זכאי או זכאית לקצבת פרישה – אחד מהמפורטים להלן, שנקבע בפסק דין לחלוקת חיסכון פנסיוני כי יועבר לו חלק מקצבת פרישה המגיעה לעובד או לעובדת שפרשו משירות: (1) מי שהיתה אשתו של העובד או של הזכאי לקצבת פרישה, לרבות מי שהיתה ידועה בציבור כאשתו; (2) מי שהיה בעלה של העובדת או של הזכאית לקצבת פרישה, לרבות מי שהיה ידוע בציבור כבעלה; (3) פרוד של קבע; ”גיל פרישת חובה“ – כמשמעותו בחוק גיל פרישה, התשס״ד–2004; ”גמלה“ – קצבּה או מענק; ”הטבות פרישה“ – גמלה, פיצויי פיטורים וכיוצא באלה; ”היום הקובע“ – יום שקבע שר האוצר לפי הוראות סעיף 107א(ג); ”התרת נישואין“ – כהגדרתה בסעיף 2(ד) לחוק יחסי ממון; ”ועדה רפואית“ – הועדה המוסמכת לקבוע את כשרם הרפואי של בני אדם המתקבלים לשירות המדינה; ”ועדת השירות“ – ועדת שירות המדינה שנתמנתה על פי חוק המינויים; ”חוק הביטוח הלאומי“ – חוק הביטוח הלאומי [נוסח משולב], תשכ״ח–1968; ”חוק החיילים המשוחררים“ – חוק החיילים המשוחררים (החזרה לעבודה), תש״ט–1949; ”חוק המינויים“ – חוק שירות המדינה (מינויים), תשי״ט–1959; ”חוק המשמעת“ – חוק שירות המדינה (משמעת), תשכ״ג–1963; ”חוק לחלוקת חיסכון פנסיוני“ – חוק לחלוקת חיסכון פנסיוני בין בני זוג שנפרדו, התשע״ד–2014; ”חוק יחסי ממון“ – חוק יחסי ממון בין בני זוג, התשל״ג–1973; ”חוק משפחות החיילים“ – חוק משפחות החיילים שנספו במערכה (תגמולים ושיקום), תש״י–1950; ”חוק נכי המלחמה בנאצים“ – חוק נכי המלחמה בנאצים, תשי״ד–1954; ”חוק הנכים“ – חוק הנכים (תגמולים ושיקום), תשי״ט–1959 [נוסח משולב]; ”חוק שירות בטחון“ – חוק שירות בטחון, תשי״ט–1959 [נוסח משולב]; ”מועד ההעברה“ – 45 ימים מהמועד שבו מסר הממונה או מי שהוא הסמיכו לכך הודעה בדבר רישום הערה בהתאם להוראות סעיף 42ב(ג); ”מועד הפירוד“ – המועד שנקבע בפסק דין לחלוקת חיסכון פנסיוני או בפסק דין לאיזון, לפי העניין, כמועד שבו חל פירוד בין עובד או זכאי לקצבת פרישה ובין בן זוגו לשעבר; ”מענק“ – תשלום חד־פעמי; ”נכה“ – אדם שנפגע כשרו לעבודה וכתוצאה מכך אינו מסוגל לעשות עבודה שבן גילו ומינו מסוגל לעשותה, ואין זו פגיעת כושר ארעית; ”נציב השירות“ – מי שנתמנה נציב שירות המדינה על פי חוק המינויים; ”נציגות עובדי המדינה“ – ארגון עובדי המדינה המייצג את המספר הגדול ביותר של עובדי המדינה; ”סוהר“ – מי שנמנה עם שירות בתי הסוהר לפי פקודת בתי הסוהר, 1946, לרבות סוהר מוסף זמני ולמעט סוהר חדש כהגדרתו בסעיף 108ב; ”עובד המדינה“ או ”עובד“ – מי שנתמנה לשירות המדינה לפי חוק המינויים וכן שוטר וסוהר, למעט עובד חדש כמשמעותו בסעיף 107א, וכן למעט – על אף האמור בסעיף 108 – מי שנתקבל לשירות המדינה בנציגות ישראל בחוץ־לארץ במעמד עובד מקומי; ”עומד ברשות עצמו“ – מי שהגיע לגיל 18, ובילדו ובנכדו של נפטר, לרבות ילדו החורג או המאומץ – מי שהגיע לגיל 20, ואם הוא בשירות סדיר לפי חוק שירות בטחון, תשי״ט–1959 [נוסח משולב] או בשירות לאומי או בהתנדבות קהילתית לפי חוק שירות אזרחי, התשע״ז–2017 – מי שהגיע לגיל 21, והכל פרט למי שאין לו הכנסה כדי מחייתו ואינו מסוגל לכלכל עצמו; ”פירוד“ – אחד מאלה: (1) התרת נישואין; (2) קביעת הסדר איזון משאבים בידי בית משפט או בית דין על פי בקשה לפי סעיף 5א לחוק יחסי ממון, או קביעת הסדר אחר בידי בית משפט או בית דין לחלוקת רכוש בין בני זוג שנפרדו ובכלל זה לחלוקת קצבת פרישה ביניהם; ”פסק דין לאיזון“ – פסק דין לפי סעיף 5(א) לחוק יחסי ממון, בדבר חלוקת נכסים בין בני זוג שנפרדו בשל פקיעת נישואין עקב מותו של עובד או של זכאי לקצבת פרישה או פסק דין אחר לחלוקת רכוש בין בני זוג שנפרדו, ובכלל זה לחלוקת קצבת פרישה ביניהם שניתן עקב מותו של עובד או של זכאי לקצבת פרישה; ”פסק דין לחלוקת חיסכון פנסיוני“ – פסק דין שנקבעה בו, בין השאר, חלוקה של קצבת פרישה המגיעה לעובד שפרש משירות או לזכאי לקצבת פרישה, בין העובד או הזכאי לקצבת פרישה ובין בן זוגו לשעבר, בשל פירוד; ”פרוד של קבע“, של עובד או של זכאי לקצבת פרישה – כל אחד מאלה: (1) אשתו של העובד או של הזכאי לקצבת פרישה, שחלה בינה ובין העובד או הזכאי כאמור פרידה של קבע; (2) בעלה של העובדת או של הזכאית לקצבת פרישה, שחלה בינו ובין העובדת או הזכאית כאמור פרידה של קבע; ”פרוד של קבע שניתן לגביו פסק דין לאיזון“ – פרוד של קבע, שנקבע בפסק דין לאיזון כי הוא היה זכאי לחלק מקצבת הפרישה שהיתה מגיעה לעובד שנפטר אילולא פטירתו או לחלק מקצבת הפרישה של זכאי לקצבת פרישה שנפטר; ”פרידה של קבע“ – מצב שבו מתקיים לגבי בני זוג אחד מאלה: (1) חלפה שנה מיום שנפתח אחד מההליכים המפורטים להלן ואותו הליך לא נסגר בתקופה האמורה: (א) הליך להתרת נישואין; (ב) תביעה לחלוקת רכוש בין בני זוג, לרבות תביעה לפירוק שיתוף במקרקעין המשותפים לבני הזוג לפי חוק המקרקעין, התשכ״ט–1969, במסגרת הליכי פירוד בין בני הזוג; (ג) תביעה לפסק דין הצהרתי בדבר זכויות בני הזוג ברכוש במסגרת הליכי פירוד בין בני הזוג; (ד) בקשה לקביעת הסדר איזון משאבים בידי בית משפט או בית דין לפי סעיף 5א(א) לחוק יחסי ממון או לקביעת הסדר אחר בידי בית משפט או בית דין לחלוקת רכוש בין בני זוג שנפרדו ובכלל זה לחלוקת קצבת פרישה ביניהם; (ה) בקשה לנקוט אמצעים לשמירת זכויות, לפי סעיף 11 לחוק יחסי ממון; (2) קיים קרע בין בני הזוג או שבני הזוג חיים בנפרד, אף אם תחת קורת גג אחת, במשך תקופה מצטברת של 20 חודשים לפחות מתוך תקופה רצופה של שנתיים; ”פרישה משירות“ – יציאה לקצבה, מוות או פיטורים; ”קצבּה“ – קצבת פרישה או קצבת שאיר; ”קצבת פרישה“ – סכום המשתלם מדי חודש לעובד שפרש משירותו; ”קצבת שאיר“ – סכום המשתלם מדי חודש לשאיריו של עובד או של עובד שפרש משירותו; ”שוטר“ – כהגדרתו בפקודת המשטרה [נוסח חדש], התשל״א–1971; ”השיעור להעברה“ – השיעור מקצבת הפרישה שנקבע בפסק דין לחלוקת חיסכון פנסיוני כשיעור שיועבר לבן הזוג לשעבר, או השיעור שנקבע בפסק דין לאיזון כשיעור שהיה מועבר לפרוד של קבע מקצבת הפרישה שהיתה מגיעה לזכאי לה אילולא נפטר; ”השיעור המשותף“ – השיעור המתקבל מחלוקת התקופה המשותפת שעד למועד הפירוד בתקופת השירות שעד למועד הפירוד; ”שירות“ – שירות כעובד; ”התקופה המשותפת“ – תקופה החלה בתקופת השירות, שנקבע לגביה בפסק דין לחלוקת חיסכון פנסיוני או בפסק דין לאיזון, לפי העניין, כי נצברה במהלכה קצבת פרישה המשותפת לעובד או לזכאי לקצבת פרישה ולבן זוגו לשעבר; ”תוספת לקצבה לפי חיקוק אחר“ – תוספת המגיעה לפי חיקוק אחר, לקצבה כהגדרתה בסעיף זה; ”תקופת שירות“ – תקופת שירות רצופה."

[[section]]
num = "8"
heading = "הגדרות"
text = "בפרק זה – ”מועד המעבר“ – יום י׳ באב התשס״ט (31 ביולי 2009); ”ממוצע משוקלל“ של שיעורי חלקיות משרה – השבר היוצא מחיבור המכפלות של כל אחד מהשיעורים האמורים במספר החדשים שבהם שירת העובד לפי אותם שיעורים, וחלוקת סך הכל במספר כל החדשים שבהם שירת; ”משכורת קובעת“, לגבי אדם פלוני בזמן פלוני – שיעור המשכורת, לרבות התוספות הקבועות, ולמעט רכיבי שכר מוחרגים, כמפורט להלן, לפי העניין, כפי שהוא מעודכן לפי הוראות סעיף 9: (1) לגבי פלוני שפרש משירות אחרי מועד המעבר – שיעור המשכורת, לרבות התוספות הקבועות, ולמעט רכיבי שכר מוחרגים המגיע ערב פרישתו של פלוני מהשירות, לעובד שדרגתו כדרגה שהיתה לפלוני ערב פרישתו כאמור; (2) לגבי פלוני שפרש משירות לפני מועד המעבר – שיעור המשכורת, לרבות התוספות הקבועות, המגיע במועד המעבר, לעובד שדרגתו כדרגה שהיתה לפלוני ערב פרישתו מהשירות; (3) על אף הוראות פסקאות (1) ו־(2), הורד פלוני בדרגתו עקב אמצעי משמעת לפי כל דין, תחושב משכורתו הקובעת במשך כל תקופת ההורדה, בהתאם להוראות הפסקאות האמורות, לפי העניין, על פי הדרגה שאליה הורד, ובתום תקופת ההורדה תחזור ותחושב משכורתו הקובעת בהתאם להוראות הפסקאות האמורות, לפי העניין, על פי הדרגה שלפני ההורדה; ”משכורת שנתית“, לגבי עובד שפרש משירותו – משכורתו הקובעת במועד פרישתו כפול שנים עשר; ”רכיב שכר מוחרג“ – רכיב שכר שמתקיימים לגביו כל אלה: (1) הוא מגיע לעובד שדרגתו כדרגה שהייתה לפלוני ערב פרישתו מהשירות, בהתאם להסכם הקיבוצי שחל לגביו, אשר נחתם ביום י״ב בסיוון התשפ״ג (1 ביוני 2023) ואילך (בהגדרה זו – ההסכם הקיבוצי) או בשל הצמדת משכורתו למשכורת של עובד שחל לגביו ההסכם הקיבוצי; (2) נקבע בהסכם הקיבוצי כי הוא לא יובא בחשבון לצורך חישוב המשכורת הקובעת לעניין הוראות חוק זה; (3) הוא לא היה קיים ערב החתימה על ההסכם הקיבוצי; לעניין זה, רכיב שכר שבא במקום רכיב שכר אחר שהיה קיים ערב החתימה על ההסכם הקיבוצי ולא נכלל בחישוב המשכורת הקובעת ערב החתימה על ההסכם הקיבוצי, ייחשב כרכיב שכר שלא היה קיים ערב החתימה על ההסכם הקיבוצי; ”רשימת הדירוגים הבסיסית“ – רשימת הדירוגים שבחלק א׳ לתוספת השלישית; ”תוספת קבועה“ – תוספת המשתלמת על משכורתו היסודית של עובד ושהוּכרה על ידי הממשלה כתוספת קבועה לענין חוק זה."

[[section]]
num = "10"
heading = "חישוב תקופת השירות"
text = "בחישוב תקופת השירות לענין חוק זה יחולו כללים אלה: (1) תקופה שאינה עולה כדי חודש מלא אך עולה על חמישה עשר יום – תחושב כחודש מלא, ושאינה עולה על חמישה עשר יום – לא תחושב כלל; (2) תקופה שאינה עולה כדי שנה תמימה, יחושב בה כל חודש מלא, כאמור בפסקה (1), כחלק השנים עשר של השנה; (3) אין מביאים בחשבון אלא תקופת שירות שמגיעה בעדה משכורת לעובד; (4) עובד שתקופת שירותו הרצופה נפסקה, מותר להביא בחשבון את תקופת השירות שלפני ההפסקה, אם החליט כך נציב השירות לפי כללים שקבעה ועדת השירות; (5) תקופה שבה היה העובד מושעה לפי חוק המשמעת, בין במשכורת ובין שלא במשכורת, לא תובא בחשבון, אלא אם הוחזר לשירות בתום תקופת ההשעיה או אם נפטר בתוך אותה תקופה; (6) עובד שהושעה לפי חוק המשמעת ופוטר תוך תקופת ההשעיה שלא מאחת הסיבות שהביאו לידי ההשעיה, יחליט בית הדין למשמעת שהוקם לפי החוק האמור (להלן – בית הדין למשמעת), על פי בקשתם של נציב השירות או של העובד, אם ובאיזו מידה יראו את תקופת ההשעיה כתקופת שירות; בהכרעתו יביא בית הדין בחשבון אם ובאיזו מידה הוּכחה האשמה שגרמה להשעיית העובד."

[[section]]
num = "17א"
heading = "יציאה מוקדמת לקצבה"
text = "(א) עובד שנסתיים שירותו לאחר ששירת עשר שנים, ואינו זכאי לקצבת פרישה על פי הוראות אחרות של חוק זה, יחול עליו סעיף 46(ג); אולם אם נפסל העובד לשירות בהחלטת בית הדין למשמעת, או החליט בית הדין, אף בלי שפסל אותו לשירות, שלא תשולם לו קצבת פרישה, כולה או מקצתה, תפקע או תצומצם תחולתו של הסעיף, לפי הענין. (ב) סעיף זה אינו חל על מי שקיבל פיצויים עקב סיום שירותו וכן על מי שזכויותיו לגמלאות עקב שירותו נשמרו על פי סעיפים 86 או 92 או על פי חוק אחר; ואולם אם נקבע בפסק דין לחלוקת חיסכון פנסיוני כי משך התקופה המשותפת הוא 120 חודשים לפחות, ונרשמה הערה לפי סעיף 42ב(א), תידרש הסכמתו בכתב של בן הזוג לשעבר של העובד לבחירת העובד בקבלת פיצויים עקב סיום שירותו, אלא אם כן נקבע בפסק הדין כי בן הזוג לשעבר ויתר על הדרישה לקבלת הסכמתו כאמור. (ג) לעניין ההגדרה ”המשכורת הקובעת“ שבסעיף 8, ולעניין סעיפים 9 עד 9ב, יראו את מועד סיום השירות של מי שבחר בזכויות לגמלאות לפי סעיף זה, כמועד פרישתו מהשירות."

[[section]]
num = "22"
heading = "מענק נוסף לקצבה"
text = "(א) מי שפוטר מהשירות לפני שהגיע לגיל 60 והוא זכאי לקצבת פרישה לפי סעיפים 15(2), (3) או (4) או 78 – ישולם לו, נוסף על הקצבּה, מענק השווה לחלק העשרים וארבעה של משכורתו השנתית כפול במספר שנות שירותו, ובלבד שהמענק לא יעלה על הסכום הקטן משני אלה: (1) משכורתו השנתית; (2) הסכום היוצא מהיווּן קצבה, ששיעורה כהפרש שבין הקצבּה שהוא זכאי לה בזמן פיטוריו ובין הקצבּה שהיתה מגיעה לו, אילו שירת בדרגתו האחרונה עד שהיה מגיע לגיל 60 ובהגיעו לגיל 60 היה זכאי לתוספת משפחה בגלל אותם בני משפחה שבגללם היה זכאי לתוספת משפחה בשעת פרישתו. (ב) היה הזכאי לקצבת פרישה כאמור עובד במשרה חלקית, תחושב הקצבּה שהיתה מגיעה לו אילו שירת בדרגתו האחרונה עד שהיה מגיע לגיל 60, לפי חלקיות המשרה שלפיה מחושבת הקצבּה של אותו עובד בזמן פיטוריו. (ג) פוטר אדם כאמור בסעיף קטן (א) על פי החלטת בית הדין למשמעת בלי שנפסל לשירות, רשאי בית הדין להחליט שאינו זכאי למענק, כולו או מקצתו. (ד) (בוטל)."

[[section]]
num = "35"
heading = "קצבה ומשכורת"
text = "(א) זכאי לקצבת פרישה שחזר לשירות במשרד ממשלתי, ביחידת סמך או בגוף אחר שהוראות סעיף קטן זה חלות עליו או הוחלו עליו שמהם פרש, והכנסתו הכוללת עולה על המשכורת הקובעת, תשולם לו קצבה בשיעור שני שלישים מקצבתו הרגילה או בשיעור הקצבה הרגילה בניכוי שליש מהסכום שבו עודפת ההכנסה הכוללת על משכורתו הקובעת, והכול לפי הסכום הגבוה יותר; לא עלתה ההכנסה הכוללת על משכורתו הקובעת, לא תופחת קצבתו מכוח סעיף קטן זה. (ב) לענין סעיף קטן (א) תחושב המשכורת הקיימת לפי המשכורת שקיבל הזכאי לקצבה מאוצר המדינה בעד החודש שבו מגיעה הקצבּה. (ג) חל סעיף 12 על החישוב של המשכורת הקובעת, יובא בחשבון לצורך ההפחתה לפי סעיף קטן (א) רק אותו חלק ממשכורתו הקיימת של הזכאי לקצבה ששיעורו כיחס שבין חלקיות משרתו של העובד שלפיה מחושבת משכורתו הקובעת לבין משכורת של משרה מלאה. (ד) זכאי לקצבת פרישה שתכוף לפני פרישתו עבד במשרה חלקית ושנתמלאו בו אלה: (1) ערב פרישתו עבד במשרה נוספת בשירות המדינה, ומשרה זו אינה מזכה בגמלה או בתשלום כיוצא בה; (2) הוא מוסיף לעבוד במשרה כאמור בפסקה (1); משכורתו בעד העבודה כאמור בפסקה (2) לא תובא בחשבון לענין ההפחתה לפי סעיף זה, אלא במידה ששיעור חלקיות משרתו בעבודה כאמור ביחד עם שיעור חלקיות המשרה שממנה פרש עולים על משרה מלאה. (ה) זכאי לקצבת פרישה שהיוון חלק מקצבתו, ייעשה החישוב לענין סעיף קטן (א) כאילו מקבל הזכאי קצבה מלאה, ורק לאחר שתופחת הקצבּה עקב קבלת משכורת מאוצר המדינה, ינוכה ממנה חלק הקצבּה שהיוון. (ו) הוראות סעיף זה לא יחולו על זכאי לקצבת פרישה שהגיע לגיל 60; ואם ערב פרישתו מהשירות היה עובד שירותי הבטחון כמשמעותו בסעיף 63א, שוטר או סוהר, משהגיעו לגיל הקבוע לגביו, בהתאם לחודש לידתו, בחלק ב׳ בתוספת השנייה. (ז) בסעיף זה – ”הכנסה כוללת“ – המשכוקת הקיימת בצירוף הקצבה הרגילה; ”משכורת קובעת“ – משכורת קובעת משוקללת כהגדרתה בסעיף 32(ד), ואולם הסיפה להגדרה האמורה, החל במילים ”לעניין הגדרה זו“ – לא תחול; ”המשכורת הקיימת“ – המשכורת שהזכאי לקצבת פרישה מקבל מאוצר המדינה; ”קצבה רגילה“ – קצבה שהיתה מגיעה אילולא הוראות סעיף זה."

[[section]]
num = "63א"
heading = "הגדרות"
text = "בפרק זה – ”שירותי הבטחון“ – שירות הבטחון הכללי או המוסד למודיעין ולתפקידים מיוחדים; ”עובד שירותי הבטחון“ – עובד המדינה בשירותי הבטחון, למעט עובד חדש בשירותי הביטחון כהגדרתו בסעיף 108ב; ”שירות בשירותי הבטחון“ – שירות של עובד שירותי הבטחון בשירותי הבטחון."

