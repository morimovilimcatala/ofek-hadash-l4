[[section]]
num = "7א"
heading = "הפרשות לקופת גמל בתקופת לידה והורות ובשמירת הריון"
text = "(א) עובד או עובדת הזכאים לדמי לידה לפי חוק הביטוח הלאומי [נוסח משולב], התשנ״ה–1995 (בסעיף זה – דמי לידה), או עובדת הזכאית לגמלת שמירת הריון לפי החוק האמור (בסעיף זה – גמלת שמירת הריון), והם ומעסיקם או המעסיק בלבד, נהגו לשלם תשלומים לקופת גמל, ימשיך המעסיק לשלם תשלומים כאמור בעד התקופה שבעדה שולמו דמי הלידה או גמלת שמירת ההריון, לפי הענין, ובלבד שהעובדת או העובד שילמו בעד התקופה האמורה את התשלומים החלים עליהם, אם חלים, להבטחת הזכויות האמורות, והכל בשיעורים ולפי שכר העבודה כאילו הוסיפו העובדת או העובד לעבוד בתקופה האמורה; בסעיף קטן זה, ”קופת גמל“ – כהגדרתה בחוק הפיקוח על שירותים פיננסיים (קופות גמל), התשס״ה–2005. (ב) האמור בסעיף קטן (א) יחול על המעסיק שהעובדת או העובד עבדו אצלו שישה חודשים לפחות בתכוף לפני תחילת ההריון של העובדת או של בת זוגו של העובד, לפי העניין, ולענין תשלומים בתקופת הזכאות לדמי לידה – אם נוסף על כך התקיימו יחסי עבודה ביניהם בכל תקופת ההריון. (ג) השר, באישור ועדת העבודה הרווחה והבריאות של הכנסת, יקבע מועדים וכללים לתשלום הסכומים האמורים בסעיף קטן (א); בתקנות כאמור רשאי השר לקבוע כללים שונים למעסיק ולעובדת או לעובד."
