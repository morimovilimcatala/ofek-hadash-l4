[[section]]
num = "7"
heading = "זכות להיעדר מהעבודה"
text = "(א) עובדת שהפילה רשאית להיעדר מעבודתה שבוע לאחר ההפלה, ואם אישר רופא כי מצב בריאותה מחמת ההפלה מחייב שתיעדר זמן רב יותר – הזמן שקבע הרופא, אך לא יותר מששה שבועות. (ב) דין העדר מכוח סעיף קטן (א) כדין העדר מפאת מחלה. (ג) עובדת רשאית להיעדר מעבודתה: (1) בחדשי ההריון, אם אישר רופא בכתב כי מצבה הרפואי לרגל ההריון מחייב זאת ובמידה שאישר; דין היעדרות לפי פסקה זו כדין היעדרות מפאת מחלה, אלא אם כן העובדת זכאית לגמלה לשמירת הריון לפי סעיף 59 לחוק הביטוח הלאומי [נוסח משולב], התשנ״ה–1995, בעבור תקופה זו, או שהיא זכאית לתשלום בשל ההיעדרות מכוח דין אחר, הסכם קיבוצי או חוזה עבודה; היעדרות מכוח פסקה זו לא תפגע בזכויות התלויות בוותק של העובדת אצל מעסיקה; (1א) בחודשי ההיריון, אם אישר רופא בכתב, על גבי טופס שנקבע בתקנות, כי סוג העבודה, מקום ביצוע העבודה או אופן ביצוע העבודה מסכנים את העובדת בשל היותה בהיריון, או את עוברה; דין היעדרות לפי פסקה זו כדין חופשה ללא תשלום, ואולם היעדרות לפי פסקה זו לא תפגע בזכויות התלויות בוותק של העובדת אצל מעסיקה; הוראות פסקה זו לא יחולו עם מעסיקה של העובדת מצא לה עבודה חלופית מתאימה; (1ב) בחודשי ההיריון, אם אישר רופא בכתב, על גבי טופס שנקבע בתקנות, כי בשל סוג העבודה, מקום ביצוע העבודה או אופן ביצוע העבודה, נבצר מהעובדת לבצע את עבודתה בשל היותה בהיריון; דין היעדררות לפי פסקה זו כדין חופשה ללא תשלום, ואולם היעדרות לפי פסקה זו לא תפגע בזכויות התלויות בוותק של העובדת אצל מעסיקה; הוראות פסקה זו לא יחולו אם מעסיקה של העובדת מצא לה עבודה חלופית מתאימה; (1ג) מתום תקופת הלידה וההורות, ועד תום שישה חודשים מיום הלידה, בתקופה שבה היא מניקה, בהתקיים כל אלה: (1) העובדת הודיעה למעסיקה שהיא מניקה; (2) העסקתה נאסרה בתקופה שבה היא מניקה בשל ההנקה, לפי הוראות סעיף 1; (3) מעסיקה של העובדת לא מצא לה עבודה חלופית מתאימה; (4) העובדת אינה רשאית להיעדר מעבודתה לפי סעיף קטן (ד); היעדרה של עובדת מעבודתה לפי פסקה זו דינו כדין חופשה ללא תשלום, וזמן היעדרה לא יבוא במניין לגבי זכויות התלויות בוותק; (2) מתום תקופת הלידה וההורות עד תום ששה חדשים מאותו יום, אם אישר רופא כי מצבה עקב הלידה מחייב זאת ובמידה שאישר; דין היעדרות לפי פסקה זו כדין היעדרות מפאת מחלה; (3) מתום תקופת הלידה וההורות עד תום ארבעה חדשים מאותו יום – שעה אחת ביום, שתיקרא שעת הורות, בתנאי שהיא מועסקת במשרה מלאה כנהוג במקום העבודה של העובדת או שהיא מועסקת במשרה שהיקפה 174 שעות בחודש לפחות, לפי הנמוך; ההיעדרות המותרת על פי פסקה זו היא בנוסף להפסקות על־פי חוק שעות עבודה ומנוחה, התשי״א–1951, ואין מנכים אותה משכר עבודתה. לעניין סעיף זה, עובד שמועסק במשרה מלאה כאמור או שמועסק במשרה שהיקפה 174 שעות בחודש לפחות, לפי הנמוך, יהיה רשאי לממש את הזכות לשעת ההורות לבדו או לסירוגין עם בת זוגו, בהתקיים התנאים המפורטים בסעיף 7ב; (4) (א) בתקופה, שבה היא עוברת טיפולי פוריות לרבות טיפולי הפריה חוץ־גופית, אם אישר הרופא המטפל בכתב כי הטיפול מחייב זאת ובמידה שאישר, ובלבד שהודיעה על כך למעסיקה מראש; דין היעדרות לפי פסקה זו כדין היעדרות מפאת מחלה. שר העבודה הרווחה והשירותים החברתיים, באישור ועדת העבודה הרווחה והבריאות של הכנסת, רשאי לקבוע בתקנות הוראות לעניין תקופת ההיעדרות כאמור; (ב) בזקיפת ימי היעדרות לפי פסקת משנה (א) זכאית עובדת להביא בחשבון, לפי בחירתה, גם חלקי ימים שבהם נעדרה כאמור; (ג) היעדרות של חלקי ימים לפי פסקה זו לא תעלה על 40 שעות בשנה לעובדת המועסקת במשרה מלאה כנהוג במקום העבודה או על החלק היחסי מ־40 שעות כאמור, בהתאם לשיעור חלקיות המשרה; שיעור חלקיות המשרה יחושב כיחס שבין שעות העבודה של העובדת בחודש ובין מספר שעות העבודה בחודש במשרה מלאה כנהוג במקום העבודה, או 182 שעות, לפי הנמוך; (ד) על אף האמור בסעיף 2(א) לחוק דמי מחלה, התשל״ו–1976, עובדת זכאית לתשלום דמי מחלה בשל היעדרות הנכללת במכסת השעות האמורה בפסקת משנה (ג) ביום הראשון להיעדרה; התשלום בעד חלקי ימי היעדרות לעניין זה יחושב לפי היחס שבין שעות ההיעדרות ובין שעות העבודה של העובדת באותו יום אילולא נעדרה; (5) בתקופה שבה היא שוהה במקלט לנשים מוכות באישור המחלקה לשירותים חברתיים או משרד העבודה והרווחה, ובלבד שהתקופה לא תעלה על שישה חודשים בתקופת שנים עשר החודשים שלאחר תחילת שהייתה במקלט כאמור; העדרה של עובדת מעבודתה לפי פסקה זו דינה כדין חופשה בלא תשלום, וזמן העדרה לא יבוא במנין לגבי זכויות התלויות בוותק; הוראות פסקה זו יחולו על עובדת שעבדה אצל אותו מעסיק או באותו מקום עבודה תקופה של שישה חודשים רצופים או יותר; לענין פסקה זו – ”אישור“ – הפניה מראש או אישור בדיעבד; ”מחלקה לשירותים חברתיים“ – כמשמעותה בחוק שירותי הסעד, התשי״ח–1958; ”מקלט לנשים מוכות“ – מקום שבו שוהה אישה מוכה מחשש לחייה או לחיי ילדה, לרבות מקום כאמור שאינו נתמך בידי המדינה או רשות מקומית; לא יהיה תוקף לזכאות לפי פסקה זו אלא אם כן הודיעה העובדת על מימושה למעסיק בדרך ובמועד שקבע שר העבודה והרווחה; (6) (א) בתקופה שבה בן זוגה שוהה בשירות מילואים, כהגדרתו בחוק שירות המילואים, התשס״ח–2008 – שעה אחת ביום, החל ביום הראשון לשירות המילואים, ובלבד שמתקיימים התנאים המפורטים להלן: (1) תקופת המילואים של בן הזוג לא תפחת מחמישה ימים רצופים; (2) לעובדת ילד שטרם מלאו לו 13 שנים הנמצא עמה; (3) העובדת מועסקת במשרה מלאה לפי הנהוג במקום עבודתה; (4) העובדת הודיעה למעסיקה על מימוש הזכות לפי פסקה זו והציגה לפניו אישור המעיד על שירות המילואים של בן זוגה; שר העבודה הרווחה והשירותים החברתיים רשאי לקבוע הוראות נוספות לעניין הודעה כאמור; (ב) עובדת אינה זכאית להיעדר מעבודתה לפי פסקה זו בימים שבהם היא נעדרת מעבודה בשל מימוש הזכות לשעת הורות לפי הוראות פסקה (3) או לפי הנהוג במקום עבודתה בעניין שעת הורות כאמור, או לפי הנהוג במקום עבודתה בעניין קיצור שעות עבודתה בשל הורות; היתה העובדת זכאית להיעדר מעבודתה כאמור פחות משעה אחת ביום, תהיה זכאית להיעדר מעבודתה לפי פסקה זו ביתרת הזמן שבין ההסדר הנהוג במקום עבודתה כאמור ובין שעה אחת; (ג) הוראות פסקה זו יחולו גם על עובד שבת זוגו שוהה בשירות מילואים, בשינויים המחויבים; (ד) על אף האמור בפסקה זו, רשאי ראש רשות ביטחון, בהחלטה מנומקת בכתב, לקבוע כי הוראות פסקה זו לא יחולו על חלק מעובדי אותה הרשות, בשל צורך מבצעי חיוני; החלטה כאמור תעמוד בתוקפה לתקופה שלא תעלה על שבעה ימים ויהיה ניתן להאריכה בתקופות נוספות שלא יעלו על שבעה ימים כל אחת; לעניין זה, ”רשות ביטחון“ – שירות הביטחון הכללי, המוסד למודיעין ולתפקידים מיוחדים, משטרת ישראל, שירות בתי הסוהר או הרשות הארצית לכבאות והצלה; (ה) ההיעדרות המותרת בהתאם להוראות פסקה זו היא נוסף על הפסקות על פי חוק שעות עבודה ומנוחה, התשי״א–1951, ואין מנכים אותה משכר עבודה. (ג1) הוראות סעיף קטן (ג)(4) תחול גם על עובד העובר טיפולי פוריות. (ג2) (1) עובד רשאי להיעדר מעבודתו בהתקיים האמור בפסקה מפסקאות משנה (א) או (ב), ולתקופה כמפורט בהן: (א) בת זוגו של העובד החליטה לפצל את תקופת הלידה וההורות לפי הוראות סעיף 6(ב1)(2) – למשך התקופה שבה היא מאושפזת ושבה פוצלה תקופת הלידה וההורות כאמור אך לא יותר מארבעה שבועות; (ב) לעובד נולד ילד והילד נמצא עמו ובהחזקתו הבלעדית (בפסקת משנה זו – החזקה בלעדית) – מהיום שבו הילד נמצא בהחזקתו הבלעדית וכל עוד הוא נמצא בהחזקה כאמור, למשך יתרת תקופת הלידה וההורות של היולדת שלא נוצלה על ידה עד ליום האמור, ולעניין יולדת שאינה זכאית לתקופת לידה והורות לפי סעיף 6 – למשך יתרת תקופת הלידה וההורות שלה היתה זכאית אילו חלו לגביה הוראות הסעיף האמור. (2) לא יהיה תוקף לזכאות לפי סעיף קטן זה אלא אם כן הודיע העובד על מימושה למעסיקו בדרך ובמועד שקבע שר התעשיה המסחר והתעסוקה. (3) היעדרות של עובד מעבודתו לפי פסקה (1) דינה כדין חופשה ללא תשלום, ואולם היעדרות כאמור לא תפגע בזכויות התלויות בוותק של העובד אצל מעסיקו. (4) עובד שנעדר מעבודתו לפי פסקה (1) והתייצב לעבודה לפני תום תקופת הלידה וההורות שלו, או הביע את רצונו לחזור לעבודה כאמור, לא יוכל המעסיק לדחות את החזרתו לעבודה יותר משבועיים מיום שהתייצב או הביע את רצונו לחזור. (ג3) עובד רשאי להיעדר מעבודתו עד חמישה ימים מהיום שלאחר יום הלידה של בת זוגו; דין היעדרות לפי פסקה זו כמפורט להלן: (1) לעניין שלושת ימי ההיעדרות הראשונים – כדין חופשה שנתית, ואם אין לעובד ימי חופשה המגיעים לו – כדין חופשה ללא תשלום; (2) לעניין שני ימי ההיעדרות הנותרים – כדין היעדרות מפאת מחלה; לעניין עובד הזכאי לדמי מחלה לפי חוק דמי מחלה, התשל״ו–1976, יראו את ימי העדרו לפי פסקת משנה זו כיום השני והשלישי למחלתו לפי סעיף 2 לחוק האמור; ימי ההיעדרות לפי פסקת משנה זו יבואו בחשבון במניין ימי ההיעדרות שהעובד זכאי להם לפי חוק דמי מחלה (היעדרות עקב היריון ולידה של בת זוג), התש״ס–2000. (ג4) (1) עובד שעבד אצל אותו מעסיק או באותו מקום עבודה שנה לפחות והילד שבת זוגו ילדה אושפז בבית החולים לאחר הלידה לתקופה העולה על שבועיים, רשאי להיעדר עד 20 ימי היעדרות, אף אם אינם רצופים, במהלך תקופת האשפוז של הילד ובתוך תקופת הלידה וההורות של בת הזוג לפי סעיף 6, על חשבון תקופת המחלה הצבורה שלו או על חשבון ימי החופשה המגיעים לו, לפי בחירתו. (2) ימי ההיעדרות של עובד כאמור בפסקה (1), שזקף ימי היעדרות לפי הוראות אותה פסקה ולפי הוראות סעיף קטן (ג3) על חשבון תקופת המחלה הצבורה שלו, יימנו לעניין הוראות סעיף 2(א) לחוק דמי מחלה, התשל״ו–1976, ברצף מהיום הראשון שבו נעדר על חשבון תקופת המחלה הצבורה שלו, אף אם ההיעדרויות לא היו רצופות. (3) בזקיפת ימי היעדרות לפי הוראות פסקה (1) זכאי עובד להביא בחשבון, לפי בחירתו, גם חלקי ימים שבהם נעדר לפי הוראות סעיף קטן זה; חלקי ימים לעניין זה יחושבו לפי היחס שבין שעות ההיעדרות ובין שעות העבודה של העובד באותו יום אילולא נעדר. (4) ימי ההיעדרות לפי סעיף קטן זה לא יובאו בחשבון במניין ימי ההיעדרות שהעובד זכאי להם לפי סעיף קטן (ג3) ולפי חוק דמי מחלה (היעדרות עקב היריון ולידה של בת זוג), התש״ס–2000. (5) היעדרות לפי סעיף קטן זה תתאפשר אם העובד מסר למעסיקו אישור רפואי בדבר אשפוז הילד וכן חתם על הצהרה כי בימי ההיעדרות שהה עם הילד שאושפז או עם ילדיו האחרים. (ד) (1) עובדת רשאית להיעדר מהעבודה, מתום תקופת הלידה וההורות, מספר חדשים כרבע מספר החדשים שבהם עבדה אצל אותו מעסיק או באותו מקום עבודה, אך לא יותר משנים עשר חדשים מיום הלידה וחלק של חודש לא יבוא במנין ואולם ממספר החודשים שתהיה העובדת רשאית להיעדר בהתאם לפסקה זו, יופחתו מספר השבועות שבהם עלתה תקופת הלידה וההורות שנוצלה על ידי העובדת לפי סעיף 6(ב)(1), על חמישה עשר שבועות, או על תקופה של חמישה עשר שבועות, בתוספת הארכות. (2) העדרה של העובדת מעבודתה מכוח פסקה (1) דינה כדין חופשה ללא תשלום, וזמן העדרה לא יבוא במנין לגבי זכויות התלויות בותק. (3) עובדת שנעדרה מעבודתה מכוח פסקה (1) והתייצבה לעבודה לפני תום תקופת הלידה וההורות שלה, או הביעה רצונה לחזור לעבודה כאמור, לא יוכל המעסיק לדחות את חזרתה לעבודה יותר מארבעה שבועות מיום שהתייצבה או הביעה רצונה לחזור. (ד1) הוראות סעיף קטן (ד) יחולו, בשינויים המחוייבים, על עובד, ובלבד שנתקיים בו אחד מאלה: (1) בת זוגו הועסקה כעובדת במשך ששה חדשים רצופים לפחות בסמוך לפני תחילת העדרותו מהעבודה בהתאם להוראות סעיף קטן (ד). (2) הילד נמצא בהחזקתו הבלעדית, או בטיפולו הבלעדי מחמת נכות או מחלה של בת זוגו. (ד2) נעדר אחד מבני־הזוג מן העבודה כאמור בסעיף קטן (ד) או (ד1), לפי הענין, לא יחולו הוראות אותם סעיפים קטנים על בן־הזוג השני; אולם, אם נעדר אחד מבני הזוג תקופה קצרה מהאמור בסעיפים קטנים (ד) או (ד1) לפי הענין, רשאי בן זוגו להעדר מהעבודה על פי הוראות אותם סעיפים קטנים למשך יתרת התקופה האמורה. (ד3) לענין חישוב תקופת העבודה הרצופה כאמור בסעיף קטן (ד1), יראו כעבודה גם תקופת הפסקה בעבודה שבה נמשכים יחסי עבודה. (ד4) שר העבודה והרווחה רשאי לקבוע בתקנות, באישור ועדת העבודה והרווחה של הכנסת, הוראות בדבר חובת מסירת הודעות למעסיק לענין סעיף זה, מאת בני־הזוג או אחד מהם ותוצאות אי מסירת הודעות כאמור. (ה) (1) בלי לגרוע מהוראות סעיף קטן (ג)(1), רשאית עובדת להיעדר מעבודתה, ללא ניכוי משכר עבודתה, לשם פיקוח רפואי במשך חדשי ההריון ובדיקות רפואיות שגרתיות הקשורות בהריון הנעשים על ידי רופא נשים או הנעשים בתחנה לבריאות האם והילד שאישר משרד הבריאות (להלן – התחנה), לרבות בדיקות שגרתיות כאמור הנערכות מחוץ לתחנה על פי הפניית התחנה; בפסקה זו, ”רופא נשים“ – רופא מורשה בעל תואר מומחה ביילוד ובגינקולוגיה שניתן לו על פי פקודת הרופאים [נוסח חדש], התשל״ז–1976 (להלן – הפקודה), או רופא מורשה המתמחה לקראת קבלת התואר האמור, במוסד מוכר לפי הפקודה, בפיקוחו של רופא בעל התואר האמור. (2) תקופת ההיעדרות מהעבודה כאמור בפסקה (1) לא תעלה על 40 שעות במשך חודשי הריונה, לעובדת המועסקת במשרה מלאה כנהוג במקום העבודה או על החלק היחסי מ־40 שעות כאמור, בהתאם לשיעור חלקיות המשרה; שיעור חלקיות המשרה יחושב כיחס שבין שעות העבודה של העובדת בחודש ובין מספר שעות עבודה בחודש במשרה מלאה כנהוג במקום העבודה, או 182 שעות, לפי הנמוך. (3) שר העבודה רשאי, באישור ועדת העבודה של הכנסת, לקבוע בתקנות – (א) הוראות לביצוע פסקאות (1) ו־(2); (ב) לגבי סוגי עובדות ובאזורים שיקבע – מספר שעות אחר להיעדרות עובדת מעבודתה כאמור ובלבד שלא יפחת מהאמור בפסקה (2); (ג) הוראות משלימות בדבר זכותה של אשה העובדת אצל יותר ממעסיק אחד להיעדר מעבודתה כאמור בפסקה (1) כאילו היתה עובדת אצל מעסיק אחד לענין האמור בפסקה (2)."

[[section]]
num = "7א"
heading = "הפרשות לקופת גמל בתקופת לידה והורות ובשמירת הריון"
text = "(א) עובד או עובדת הזכאים לדמי לידה לפי חוק הביטוח הלאומי [נוסח משולב], התשנ״ה–1995 (בסעיף זה – דמי לידה), או עובדת הזכאית לגמלת שמירת הריון לפי החוק האמור (בסעיף זה – גמלת שמירת הריון), והם ומעסיקם או המעסיק בלבד, נהגו לשלם תשלומים לקופת גמל, ימשיך המעסיק לשלם תשלומים כאמור בעד התקופה שבעדה שולמו דמי הלידה או גמלת שמירת ההריון, לפי הענין, ובלבד שהעובדת או העובד שילמו בעד התקופה האמורה את התשלומים החלים עליהם, אם חלים, להבטחת הזכויות האמורות, והכל בשיעורים ולפי שכר העבודה כאילו הוסיפו העובדת או העובד לעבוד בתקופה האמורה; בסעיף קטן זה, ”קופת גמל“ – כהגדרתה בחוק הפיקוח על שירותים פיננסיים (קופות גמל), התשס״ה–2005. (ב) האמור בסעיף קטן (א) יחול על המעסיק שהעובדת או העובד עבדו אצלו שישה חודשים לפחות בתכוף לפני תחילת ההריון של העובדת או של בת זוגו של העובד, לפי העניין, ולענין תשלומים בתקופת הזכאות לדמי לידה – אם נוסף על כך התקיימו יחסי עבודה ביניהם בכל תקופת ההריון. (ג) השר, באישור ועדת העבודה הרווחה והבריאות של הכנסת, יקבע מועדים וכללים לתשלום הסכומים האמורים בסעיף קטן (א); בתקנות כאמור רשאי השר לקבוע כללים שונים למעסיק ולעובדת או לעובד."

[[section]]
num = "8"
heading = "איסור העסקה בתקופת לידה והורות"
text = "לא יעסיק מעסיק עובדת או עובד בידעו שהם בתקופת לידה והורות."

[[section]]
num = "9"
heading = "הגבלת פיטורים"
text = "(א) לא יפטר מעסיק עובדת שהיא בהריון וטרם יצאה לתקופת לידה והורות אלא בהיתר מאת שר העבודה והרווחה, ולא יתיר השר פיטורים כאמור אם הפיטורים הם, לדעתו, בקשר להריון; הוראות סעיף קטן זה יחולו הן על עובדת קבועה והן על עובדת ארעית או זמנית ובלבד שהעובדת עבדה אצל אותו מעסיק או באותו מקום עבודה ששה חדשים לפחות. (ב) היה המעסיק קבלן כוח אדם והעובדת הועסקה אצלו בפועל במשך שישה חודשים לפחות יראו, לענין סעיף קטן (א), גם הפסקה זמנית של העסקתה כפיטורים; בסעיף זה, ”קבלן כוח אדם“ – כהגדרתו בסעיף 1 לחוק העסקת עובדים על ידי קבלני כוח אדם, התשנ״ו–1996. (ב1) (1) לעניין עובדת של קבלן כוח אדם המועסקת אצל מעסיק בפועל במשך שישה חודשים לפחות, יחולו הוראות אלה: (א) לא יגרום מעסיק בפועל לכך שקבלן כוח אדם יפטר עובדת בהיריון בניגוד להוראות סעיף זה; (ב) פוטרה עובדת בהיריון בניגוד להוראות סעיף זה, חזקה היא שהמעסיק בפועל הוא שגרם לפיטורים, אלא אם כן הוכיח אחרת; (ג) בקשה להיתר לפי סעיף קטן (א) תוגש הן בידי המעסיק בפועל והן בידי קבלן כוח האדם. (2) הוראות סעיף קטן זה באות להוסיף על החובות והאיסורים החלים על קבלן כוח אדם כמעסיק לפי כל דין. (3) בסעיף קטן זה, ”מעסיק בפועל“ ו”קבלן כוח אדם“ – כהגדרתם בחוק העסקת עובדים על ידי קבלני כוח אדם, התשנ״ו–1996. (ג) (1) לא יפטר מעסיק עובדת או עובד בתקופת לידה והורות או בימי היעדרם מעבודה לפי סעיף 7(ג)(2) או (ג2), ולא ייתן הודעת פיטורים למועד החל בתקופות האמורות. (1א) לא יפטר מעסיק עובדת או עובד בתקופה של 60 ימים לאחר תום תקופת הלידה וההורות או לאחר תום ימי ההיעדרות, כאמור בפסקה (1), לפי העניין, ולא ייתן הודעת פיטורים למועד החל בתקופה האמורה, אלא בהיתר מאת שר התעשיה המסחר והתעסוקה; השר לא יתיר פיטורים לפי פסקה זו אלא אם כן שוכנע כי מתקיימים כל אלה: (א) הפיטורים אינם בקשר ללידה, לתקופת הלידה וההורות או להיעדרות כאמור; (ב) עסקו של המעסיק חדל לפעול או שהמעסיק הוכרז כפושט רגל לפי פקודת פשיטת הרגל [נוסח חדש], התש״ם–1980, ואם הוא תאגיד – ניתן צו פירוק לפי פקודת החברות [נוסח חדש], התשמ״ג–1983; לעניין זה, ”חדל לפעול“ – כהגדרתו בסעיף 9ב. (2) לא יפטר מעסיק עובד או עובדת, בימי העדרם מהעבודה לפי סעיף 7(ג)(1ג), (ד)(1) או (ד1) או במשך תקופה של שישים ימים לאחר תום ההיעדרות כאמור, ולא יתן הודעת פיטורים למועד החל בתקופות האמורות, אלא בהיתר מאת שר התעשיה המסחר והתעסוקה, ולא יתיר השר פיטורים לפי פסקה זו אם הם לדעתו בקשר ללידה או להיעדרות כאמור. (2א) (פקעה). (2ב) (פקעה). (2ג) (הוראת שעה מיום 31.3.2026 עד יום 31.3.2027): (א) הוציא מעסיק עובד או עובדת לחופשה ללא תשלום במהלך התקופה הקובעת, לתקופה של 10 ימים רצופים לפחות או שהיא הוצאה לחופשה ללא תשלום לתקופה של חמישה ימים רצופים לפחות שתחילתם ביום י״א באדר התשפ״ו (28 בפברואר 2026) או י״ב באדר התשפ״ו (1 במרץ 2026), שחלה, כולה או חלקה, ב־60 הימים כאמור בפסקה (1א) או (2), לא תובא תקופת החופשה ללא תשלום במניין 60 הימים; בפסקה זו, ”התקופה הקובעת“ – כהגדרתה בסעיף 179כח לחוק הביטוח הלאומי [נוסח משולב], התשנ״ה–1995, כנוסחו בחוק התוכנית לסיוע כלכלי (הוראת שעה) (תעסוקה), התשפ״ו–2026. (ב) על אף האמור בפסקאות (1א) ו־(2), השר רשאי להתיר פיטורים של עובד או עובדת שהוצאו לחופשה ללא תשלום כאמור בפסקת משנה (א), אם שוכנע כי הפיטורים אינם בקשר ללידה, לתקופת הלידה וההורות או להיעדרות כאמור בפסקה (1א) או (2), ובלבד שחלפו 60 ימים מתום תקופת הלידה וההורות או ההיעדרות. (3) במניין ימי הודעה מוקדמת לפיטורים לא יבואו התקופות האמורות בפסקאות (1), (1א) ו־(2). (ד) לא יפטר מעסיק עובדת השוהה במקלט לנשים מוכות בימי העדרה מעבודתה לפי סעיף 7(ג)(5) או במשך תקופה של 150 ימים לאחר תום ימי ההיעדרות כאמור, ולא ייתן הודעת פיטורים למועד החל בתקופות האמורות, אלא בהיתר מאת שר העבודה והרווחה, ולא יתיר השר פיטורים כאמור אם הפיטורים הם, לדעתו, בקשר לשהייה במקלט; במנין ימי הודעה מוקדמת לפיטורים, לא יבואו התקופות האמורות בסעיף קטן זה. (ה) (1) לא יפטר מעסיק עובדת העוברת טיפולי הפריה חוץ גופית או עובד או עובדת העוברים טיפולי פוריות, בימי העדרם מעבודה לפי סעיף 7(ג)(4) או (ג1), לפי העניין, או במשך תקופה של 150 ימים לאחר תום ימי ההיעדרות כאמור, אלא בהיתר מאת שר התעשייה המסחר והתעסוקה, ולא יתיר השר פיטורים כאמור אם הפיטורים הם, לדעתו, בקשר עם היעדרות כאמור או עם טיפולים כאמור; הוראת סעיף קטן זה תחול לגבי עובד או עובדת העוברים טיפולים כאמור בפסקה זו לקראת שתי לידות לכל היותר, בתקופת העסקתם אצל אותו מעסיק או באותו מקום עבודה, ואם עברו טיפולים כאמור לקראת הולדת ילדים מבני זוג קודמים – גם לקראת שתי לידות עם בן הזוג הנוכחי; (2) הוראת פסקה (1) לא תחול על מעסיק, לגבי עובד או עובדת כאמור, שחלפו שנתיים מהיום הראשון להיעדרותם מעבודה אצלו או באותו מקום עבודה, לפי הפסקה האמורה. (3) הוראות פסקה (1) יחולו גם על עובדת או עובד שלא נעדרו מעבודה, בתקופת הטיפולים כאמור באותה פסקה, או במשך תקופה של 150 ימים לאחר מועד תחילת טיפולי הפוריות או טיפולי ההפריה החוץ־גופית, לפי המאוחר, כפי שאישר הרופא המטפל בכתב, ובלבד שהעובדת או העובד, לפי העניין, הודיעו למעסיק על הטיפולים לא יאוחר משלושה ימי עבודה ממועד מתן ההודעה המוקדמת לפיטורים, ואם לא ניתנה הודעה מוקדמת לפיטורים – ממועד הפיטורים, ומסרו למעסיק אישור רופא כאמור בתוך 14 ימים מאותו מועד, לפי העניין; הוראות פסקה זו יחולו הן על עובדת או עובד קבועים והן על עובדת או עובד ארעיים או זמניים, ובלבד שעבדו אצל אותו מעסיק או באותו מקום עבודה שישה חודשים לפחות; שר התעשייה המסחר והתעסוקה רשאי, בהתייעצות עם שר הבריאות ובאישור ועדת העבודה הרווחה והבריאות של הכנסת, לקבוע סוגים של טיפולי פוריות שהוראות פסקה זו לא יחולו עליהם. (ו) לא יפטר מעסיק עובדת בימי היעדרה מעבודה לפי סעיף 7(א) ולא ייתן הודעת פיטורים למועד החל בתקופה האמורה; במניין ימי הודעה מוקדמת לפיטורים לא תבוא התקופה האמורה בסעיף קטן זה. (ז) בסעיף זה, ”פיטורים“ – לרבות אי־חידוש חוזה עבודה לתקופה קצובה שהוא אחד מאלה: (1) חוזה עבודה לתקופה קצובה של שנים עשר חודשים או יותר; (2) חוזה עבודה לתקופה קצובה הפחותה משנים עשר חודשים, שהאריך או שחידש העסקה קודמת שהיתה סמוך לפני תחילת תוקפו של החוזה."

[[section]]
num = "10"
heading = "עבודה בשעות נוספות ובמנוחה השבועית ועבודת לילה"
text = "(א) עובדת שהיא בחודש החמישי להריונה תודיע על כך למעסיקה, ומשעשתה כן, או משנודע על כך למעסיק בדרך אחרת, לא יעסיקנה בשעות נוספות ובמנוחה השבועית מהחודש החמישי להריון ואילך, אף אם היה רשאי או הותר לעשות זאת על פי חוק שעות עבודה ומנוחה, תשי״א–1951; הוא הדין לגבי עבודת לילה, אם העובדת הודיעה למעסיקה בכתב, כי אין היא מסכימה לעבוד עבודת לילה. (ב) על אף הוראות סעיף קטן (א), רשאי מעסיק להעסיק עובדת בהריון, בשעות נוספות או במנוחה השבועית, אם העובדת הסכימה לכך בכתב ומסרה למעסיקה אישור רפואי של רופא מומחה ביילוד ובגינקולוגיה, כי אין מניעה להעסיקה בשעות נוספות או במנוחה השבועית, ובכפוף לתנאי האישור. (ג) מעסיק לא יעסיק עובדת שילדה בעבודת לילה, או במנוחה השבועית אף אם היה רשאי או הותר לו לעשות זאת על פי חוק שעות עבודה ומנוחה, התשי״א–1951, במשך ארבעה חודשים מתום תקופת הלידה וההורות, אלא אם כן הסכימה העובדת לכך בכתב; הוראות סעיף קטן זה לא יחולו על סוגי מקומות עבודה שנקבעו בתקנות ועל שירותים, על מקומות, על עבודות ועל תפקידים, הכל לפי סעיף 2(ג). (ד) בסעיף זה, ”עבודת לילה“ – עבודה ששתי שעות ממנה, לפחות, הן בתחום השעות שבין 22:00 ובין 06:00."

[[section]]
num = "19"
heading = "המדינה כמעסיק"
text = "לענין חוק זה דין עובד המדינה כדין כל עובד אחר."

[[section]]
num = "23"
heading = "שמירת זכויות"
text = "חוק זה אינו בא למעט מכל זכות הנתונה לעובד לפי חוק, הסכם קולקטיבי, חוזה עבודה או נוהג."
