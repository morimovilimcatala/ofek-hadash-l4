# חוק עבודת נשים, התשי"ד-1954 — the sections the L4 encodes
# (l4/laws/womens-work-law.l4, MMS-601): the birth and parenthood period
# and who may not be employed in it, the absences the law allows (a
# miscarriage, pregnancy, the parent's hour, fertility treatment, the
# months after the period, check-ups), the provident-fund contributions
# through the period, the limits on dismissal, overtime and night work, and
# that the State as employer and every better right are kept.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped,
# and with it the notes "פורסמו ..." that name the regulations made under a
# subsection) on 8.11.2026, as amended up to תשפ"ו־3.
#
# The sections are every one the corpus cites by number
# (data/statute-citations.json) — §6, the period, which 13 documents name
# when they count it towards a grant; §7, whose parent's hour and
# reserve-duty hour the 2023 framework agreement adds to; §9, which the
# takanon's §§1.28.2.1 and 6.5 restate; and §§6א, 8 and 10, which the
# takanon's §1.25.5 lists among its sources — with §7א, which the takanon's
# pension contribution in maternity leave falls short of, and §§19 and 23,
# which apply the law to the State as an employer and keep every better
# right an agreement gives.

