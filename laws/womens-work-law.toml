[[section]]
num = "6"
heading = "תקופת לידה והורות"
text = "(א) עובדת שקרובה ללדת יתן לה מעסיקה תקופת לידה והורות ולא יעסיקנה בתוך תקופת הלידה וההורות. (ב) (1) תקופת הלידה וההורות היא עשרים ושישה שבועות, מהם שבעה שבועות או פחות מזה, כרצון העובדת, לפני יום הלידה המשוער, והשאר אחרי יום הלידה. (2) עובדת רשאית לקצר את תקופת הלידה וההורות, ובלבד שתקופת הלידה וההורות לא תפחת מחמישה עשר שבועות, או מתקופה כאמור בתוספת הארכות של תקופת הלידה וההורות, אם מימשה את זכותה להאריכה לפי סעיפים קטנים (ב1), (ג) ו־(ד) (להלן – הארכות). (3) עובדת שהודיעה על רצונה לקצר את תקופת הלידה וההורות כאמור בפסקה (2), לא יוכל המעסיק לדחות את החזרתה לעבודה למשך יותר משלושה שבועות מיום שהודיעה כאמור. (4) שר התעשייה המסחר והתעסוקה רשאי לקבוע הוראות לעניין מתן הודעה על קיצור תקופת הלידה וההורות כאמור בסעיף קטן זה, ורשאי הוא לקבוע הוראות שונות להודעה למי שהעובדת עבדה אצלו לפני תקופת הלידה וההורות, ולמעסיק אחר. (5) הוראות פסקאות (1) עד (4) לא יחולו על עובדת שעבדה לפני יציאתה לתקופת לידה והורות פחות משנים עשר חודשים אצל אותו מעסיק או באותו מקום עבודה; תקופת הלידה וההורות של עובדת כאמור היא חמישה עשר שבועות, מהם שבעה שבועות או פחות מזה, כרצון העובדת, לפני יום הלידה המשוער והשאר אחרי יום הלידה. (ב1) עובדת שחלתה ואושפזה בבית חולים תוך תקופת הלידה וההורות כאמור בסעיפים קטנים (ב) ו־(ג), לתקופה העולה על שבועיים, זכאית לאלה: (1) להאריך את תקופת הלידה וההורות לתקופה שלא תעלה על תקופת האשפוז אך לא יותר מארבעה שבועות; הוראות פסקה זו יחולו גם לגבי עובדת שתקופת אשפוזה, כאמור ברישה של סעיף קטן זה, אינה רצופה; בסעיף זה, ”אשפוז“ – שהות של אדם בבית חולים במשך 12 שעות לפחות לשם קבלת טיפול רפואי; (2) לפצל את תקופת הלידה וההורות כך ששלושה שבועות או יותר יהיו תכוף לאחר הלידה ויתרת החופשה תחל במהלך תקופת האשפוז או עם סיומה; לא יהיה תוקף לזכאות לפי סעיף קטן זה אלא אם כן הודיעה העובדת על מימושה בדרך, ובמועד ולמי שקבע שר העבודה והרווחה בתקנות. (ג) (1) עובדת שילדה בלידה אחת יותר מילד אחד זכאית להאריך את תקופת הלידה וההורות בשלושה שבועות נוספים בעד כל ילד נוסף שילדה באותה לידה, החל בילד השני; (2) בלי לגרוע מהוראות סעיף קטן (ח) וסעיף 7(ג3) ומהוראות כל דין, עובד שבת זוגו ילדה בלידה אחת יותר מילד אחד יהיה רשאי לממש, בתוך תקופת הלידה וההורות של בת זוגו, החל מיום הלידה ואילך, תקופה אחת רצופה של לפחות שבעה ימים ולכל היותר שבועיים – מתוך שלושת השבועות האמורים בפסקה (1), בעד כל ילד נוסף שנולד באותה לידה, לצורך טיפול בילדו במקום בת זוגו ובהסכמתה. (ד) עובדת שהילד אשר ילדה חייב להישאר בבית החולים או לחזור לבית החולים לאישפוז, תוך תקופת הלידה וההורות כאמור בסעיפים קטנים (ב), (ב1) או (ג), לתקופה העולה על שבועיים, זכאית לאלה: (1) להאריך את תקופת הלידה וההורות לתקופה שלא תעלה על תקופת האשפוז, אך לא ביותר מעשרים שבועות; הוראות פסקה זו יחולו גם לגבי עובדת שתקופת אשפוזו של הילד אשר ילדה, כאמור ברישה של סעיף קטן זה, אינה רצופה; (2) לפצל את תקופת הלידה וההורות כך ששלושה שבועות או יותר יהיו תכוף לאחר הלידה ויתרת החופשה תחל במהלך תקופת האשפוז או עם סיומה; לא יהיה תוקף לזכאות לפי סעיף קטן זה אלא אם כן העובדת הודיעה על מימושה בדרך, ובמועד ולמי שקבע שר העבודה והרווחה בתקנות. (ד1) (בוטל). (ד2) הזכאות להארכת תקופת הלידה וההורות לפי סעיפים קטנים (ב1) עד (ד) ו־(ד3) היא מצטברת, ובלבד שכל ההארכות לפי סעיפים קטנים (ב1)(1), (ד)(1) ו־(ד3) לא יעלו יחד על עשרים שבועות. (ד3) עובדת שהילד אשר ילדה הוא פעוט עם מוגבלות מורכבת שהוכר ככזה בתוך תקופת הלידה וההורות, זכאית להאריך את תקופת הלידה וההורות בחמישה שבועות נוספים; בסעיף קטן זה, ”פעוט עם מוגבלות מורכבת“ – פעוט שזכאי לגמלת ילד נכה לפי תקנה 2(2)(ב), (2א), (3) או (3א) לתקנות הביטוח הלאומי (ילד נכה), התש״ע–2010. (ה) על אף האמור בסעיף קטן (ב) מותר לקצר את תקופת הלידה וההורות, בהסכמת העובדת ובאישור שבכתב מאת רופא, אם הנולד איננו בחיים או שהעובדת הסכימה שילדה יאומץ לפי חוק אימוץ ילדים, התשמ״א–1981, או שהיא אם נושאת כמשמעותה בחוק הסכמים לנשיאת עוברים (אישור הסכם ומעמד היילוד), התשנ״ו–1996 (להלן – אם נושאת), ובלבד שהתקופה תכלול לפחות שלושה שבועות שאחרי הלידה ואולם לגבי עובדת שהסכימה שילדה יאומץ או לגבי עובדת שהיא אם נושאת, לא יהיה תוקף לזכאותה לפי סעיף קטן זה אלא אם כן הודיעה על הסכמתה לקצר את תקופת הלידה וההורות בדרך, במועד ולמי שקבע שר התעשיה המסחר והתעסוקה, בהתייעצות עם שר הרווחה והשירותים החברתיים. (ו) שר העבודה רשאי לנקוב בתקנות עבודות מסויימות שבהן תהא תקופת הלידה וההורות שלפני יום הלידה המשוער פרק זמן שקבע בתקנות ושלא יעלה על שבעה שבועות. (ז) (בוטל). (ז1) (1) עובד שבת זוגו ילדה, ומתקיימים לגביו כל התנאים המפורטים להלן, ייתן לו מעסיקו תקופת לידה והורות בהתאם להוראות פסקה (2): (א) הילד נמצא עמו ובהחזקתו; (ב) הילד נמצא בטיפולו הבלעדי של העובד מחמת נכות או מחלה של בת הזוג ורופא אישר בכתב כי בשל הנכות או המחלה כאמור בת הזוג אינה מסוגלת לטפל בילד. (2) על זכאותו של עובד לתקופת לידה והורות לפי סעיף קטן זה יחולו הוראות סעיפים קטנים (ב), (ג) ו־(ד), ואולם תקופת הלידה וההורות של העובד תחל ביום שבו החלו להתקיים לגביו התנאים האמורים בפסקה (1), ותקופתה תהיה למשך יתרת תקופת הלידה וההורות של בת הזוג שלא נוצלה על ידה עד ליום האמור, וכל עוד מתקיימים לגבי העובד התנאים האמורים, ולעניין עובד שבת זוגו אינה זכאית לתקופת לידה והורות לפי סעיף זה – למשך יתרת התקופה שהיתה בת זוגו בתקופת לידה והורות אילו היתה זכאית לה לפי סעיף זה. (3) יצא עובד לתקופת לידה והורות לפי סעיף קטן זה, אין בכך כדי לדחות, להאריך או לקצר את תקופת הלידה וההורות של בת זוגו. (4) שר התעשיה המסחר והתעסוקה, באישור ועדת העבודה הרווחה והבריאות של הכנסת, רשאי לקבוע כללים לביצוע הוראות פסקה (1), ובין השאר, כללים בדבר חובת מסירת הודעה למעסיק על ידי העובד. (ח) (1) עובד שאשתו ילדה, ייתן לו מעסיקו תקופת לידה והורות חלקית, בתקופת הלידה וההורות שנותרה מתום ששת השבועות הראשונים שלאחר יום הלידה, אם התקיימו כל אלה: (א) אשתו זכאית לתקופת לידה והורות והיא הסכימה בכתב לוותר על חלק מתקופת הלידה וההורות המגיעה לה בתקופה שנותרה מתום ששת השבועות הראשונים שלאחר יום הלידה, וזאת על אף הוראות סעיף קטן (ב)(2); ולעניין אישה שהיא עובדת עצמאית – היא זכאית לדמי לידה לפי חוק הביטוח הלאומי [נוסח משולב], התשנ״ה–1995, והסכימה בכתב לחזור לעסוק במשלח ידה בתקופה שנותרה כאמור, שהיתה מגיעה לה אילו היתה זכאית לתקופת לידה והורות; (ב) אשתו עבדה או עסקה במשלח ידה בתקופה האמורה בפסקת משנה (א). (1א) תקופת הלידה וההורות החלקית של עובד שהתקיימו לגביו הוראות פסקה (1), לא תעלה על חמישה עשר שבועות, בתוספת הארכות, אם התקיימו לגביו גם על אלה: (א) הוא עבד אצל אותו מעסיק או באותו מקום עבודה פחות משנים עשר חודשים עד יציאתו לתקופת לידה והורות; (ב) אשתו עבדה שנים עשר חודשים לפחות אצל אותו מעסיק או באותו מקום עבודה לפני יציאתה לתקופת לידה והורות; ולעניין אישה שהיא עובדת עצמאית – עסקה במשלח ידה שנים עשר חודשים לפחות לפני המועד שבו היתה יוצאת לתקופת לידה והורות, אילו היתה זכאית לתקופת לידה והורות. (1ב) (א) עובד שאשתו ילדה ייתן לו מעסיקו תקופת לידה והורות של שבעה ימים במהלך תקופת הלידה וההורות של אשתו, ובלבד שהיא הסכימה בכתב לוותר על דמי הלידה שהיא זכאית להם בעד השבוע האחרון של פרק הזמן שבעדו היא זכאית לדמי לידה לפי הוראות סעיפים 50 ו־51 לחוק הביטוח הלאומי [נוסח משולב], התשנ״ה–1995. (ב) על אף האמור בסעיף קטן (ב)(2), יצא עובד לתקופת לידה והורות כאמור בפסקת משנה (א) זכאית אשתו לחזור לעבודתה בשבוע האחרון כאמור בפסקת המשנה האמורה, למעט אם היא זכאית לדמי לידה לפי סעיף 50(א)(2) לחוק הביטוח הלאומי [נוסח משולב], התשנ״ה–1995. (ג) אין בתקופת לידה והורות לפי פסקה זו כדי לשנות את אורך תקופת הלידה וההורות שנקבעה בסעיף קטן (ב)(1). (ד) אין בהוראות פסקה זו כדי לגרוע מהוראות פסקאות (1) ו־(1א) ומהוראות סעיף קטן (ז1), סעיף 7(ג3) וחוק דמי מחלה (היעדרות עקב היריון ולידה של בת זוג), התש״ס–2000. (2) שר התעשיה המסחר והתעסוקה יקבע כללים לביצוע הוראות פסקה (1), ובין השאר, כללים בדבר חובת מסירת הודעה למעסיק על ידי שני בני הזוג. (3) שר התעשיה המסחר והתעסוקה יקבע, באישור ועדת העבודה הרווחה והבריאות של הכנסת, נסיבות מיוחדות שבהתקיימן יהיה עובד זכאי לתקופת לידה והורות לפי הוראות סעיף קטן זה, אף אם לא התקיים האמור בפסקה (1)(ב). (ט) היעדרות מעבודה לרגל תקופת לידה והורות לפי הוראות סעיף זה לא תפגע בזכויות התלויות בוותק אצל המעסיק."

