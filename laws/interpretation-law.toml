# חוק הפרשנות, התשמ"א-1981 — the sections the L4 encodes
# (l4/laws/interpretation-law.l4, MMS-689): what the law applies to (§1),
# a defined term (§2), a person (§4), singular and plural (§5), male and
# female (§6), "or" and "other" (§7), "עד" (§8) and counting a period (§10).
# These are §1 and the seven sections §25(ד) of the Contracts Law applies to
# reading a contract, which is how they reach a collective agreement: the
# law speaks of an enactment and an administrative instruction, and an
# agreement is neither (convention reading.interpretation-law, a pick for
# the lawyer).
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped)
# on 12.11.2026. The corpus does not cite the law.

title = "חוק הפרשנות, התשמ\"א-1981"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%94%D7%A4%D7%A8%D7%A9%D7%A0%D7%95%D7%AA"
text_as_of = "2026-11-12"
about = "החוק שקובע כיצד קוראים חיקוק והוראת מינהל: מונח מוגדר, יחיד ורבים, זכר ונקבה, ״או״ ו״אחר״, ״עד״ ועד בכלל, ומניין תקופות. שבעה מסעיפיו חלים גם על פירוש חוזה, לפי סעיף 25(ד) לחוק החוזים"

[[section]]
num = "1"
heading = "תחולת החוק וסייגיה"
text = "חוק זה יחול לגבי כל חיקוק והוראת מינהל, אף אם ניתנו לפני תחילתו, אם אין הוראה אחרת לענין הנדון ואם אין בענין הנדון או בהקשרו דבר שאינו מתיישב עם חוק זה; אולם על מלים וביטויים למעט ”חטא“, ”עוון“ ו”פשע“, שבחיקוקים והוראות מינהל שניתנו לפני תחילת חוק זה לא יחול סעיף 3 אלא יוסיפו לחול ההגדרות שבסעיף 1 לפקודת הפרשנות."

[[section]]
num = "2"
heading = "תחולת הגדרות שבחיקוק"
text = "מונח שהוגדר בחיקוק – משמעו כהגדרתו, והגדרה זו תחול גם על תקנות שהותקנו לפי אותו חיקוק, וכל צורה דקדוקית הנגזרת מהמונח תתפרש לפי אותה משמעות, הכל אם אין הוראה אחרת לענין הנדון ואם אין בענין הנדון או בהקשרו דבר שאינו מתיישב עם אותה הגדרה."

[[section]]
num = "4"
heading = "אדם"
text = "מקום שמדובר באדם – אף חבר־בני־אדם במשמע, בין שהוא תאגיד ובין שאינו תאגיד."

[[section]]
num = "5"
heading = "יחיד ורבים"
text = "האמור בלשון יחיד – אף לשון רבים במשמע, וכן להיפך."

[[section]]
num = "6"
heading = "זכר ונקבה"
text = "האמור בלשון זכר – אף לשון נקבה במשמע, וכן להיפך."

[[section]]
num = "7"
heading = "הכלל אינו מעין הפרט דוקא"
text = "המלים ”או“, ”אחר“ או ביטוי דומה להן – להבדיל מן המפורט שלפניהן הן באות ולא להקיש לו, זולת אם יש עמן המלים ”דומה“ או ”כיוצא בזה“ או ביטוי אחר שמשמעו היקש."

[[section]]
num = "8"
heading = "”עד...“"
text = "הביטוי ”עד...“ לענין זמן או לענין מובאה – משמעו עד ועד בכלל."

[[section]]
num = "10"
heading = "תקופות"
text = "(א) מקום שנקבעה תקופה קצובה במספר ימים או שבועות מיום פלוני, אותו יום לא יבוא במנין. (ב) תקופה קצובה במספר חדשים או שנים לאחר אירוע פלוני תסתיים בחדשה האחרון ביום שמספרו בחודש כמספר יום האירוע, ואם היה החודש חסר אותו יום – ביום האחרון של החודש. (ג) במנין ימי תקופה יבואו גם ימי מנוחה, פגרה או שבתון שעל פי חיקוק, זולת אם הם הימים האחרונים שבתקופה."
