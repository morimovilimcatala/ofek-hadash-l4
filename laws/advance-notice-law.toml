# חוק הודעה מוקדמת לפיטורים ולהתפטרות, התשס"א-2001 — the sections the L4
# encodes (l4/laws/advance-notice-law.l4, MMS-601): who is an employee on a
# salary and on a wage and what the regular wage is, the duty of an employer
# who would dismiss and of an employee who would resign to give written
# notice, how long it is for an employee on a salary and for one on a wage,
# that the same holds for a resignation, the work the employer may waive for
# the regular wage, what is owed where no notice is given, where the law asks
# none, that the State is an employer like any other, and that the law takes
# away no better right.
#
# The corpus holds no copy of a statute (its standing decision 14); the words
# are pinned here as tools/laws.py describes, read from the live page of
# ספר החוקים הפתוח (its wikitext, ?action=raw, the {{ח:...}} markup dropped)
# on 8.11.2026, as amended up to תשע"ד (the law replacing the term "מעביד").
# The law has no section that keeps the employment going through the notice
# period, nor one that lets an agreement give more by that name: §12 keeps
# every better right, and §§6-7 are the pay in lieu.
#
# The corpus does not cite the law, by name or by link. It rules all the
# same on its subject wherever an instrument dismisses a teacher or asks him
# for notice before he leaves: the last day for a dismissal and the day it
# takes effect (the takanon's §§1.28.2.1(ג), 3.5, 5.5, 6.5; the Oz LaTmura
# agreement's annex ה'), a substitute's notice (§6.5.7), dismissal on a
# conviction (§6.5.23), and the notice of a resignation (§§1.28.1, 1.39).

title = "חוק הודעה מוקדמת לפיטורים ולהתפטרות, התשס\"א-2001"
url = "https://he.wikisource.org/wiki/%D7%97%D7%95%D7%A7_%D7%94%D7%95%D7%93%D7%A2%D7%94_%D7%9E%D7%95%D7%A7%D7%93%D7%9E%D7%AA_%D7%9C%D7%A4%D7%99%D7%98%D7%95%D7%A8%D7%99%D7%9D_%D7%95%D7%9C%D7%94%D7%AA%D7%A4%D7%98%D7%A8%D7%95%D7%AA"
text_as_of = "2026-11-08"
about = "החוק שמחייב מעסיק שמבקש לפטר, ועובד שמבקש להתפטר, לתת הודעה מוקדמת בכתב, קובע את אורכה לפי הוותק לעובד במשכורת ולעובד בשכר, ומחייב לשלם את השכר הרגיל בעד תקופת הודעה שלא ניתנה או שהמעסיק ויתר עליה"

[[section]]
num = "1"
heading = "הגדרות"
text = "בחוק זה – ”חוק פיצויי פיטורים“ – חוק פיצויי פיטורים, התשכ״ג–1963; ”עובד במשכורת“, ”עובד בשכר“ – כהגדרתם בסעיף 12 לחוק פיצויי פיטורים; ”שכר רגיל“ – שכר העבודה המובא בחשבון לענין חישוב פיצויי פיטורים לפי סעיף 13 לחוק פיצויי פיטורים."

[[section]]
num = "2"
heading = "חובה ליתן הודעה מוקדמת לפיטורים ולהתפטרות"
text = "(א) מעסיק המבקש לפטר עובד ייתן לו הודעה מוקדמת לפיטורים, לפי הוראות חוק זה. (ב) עובד המבקש להתפטר מעבודתו ייתן למעסיקו הודעה מוקדמת להתפטרות, לפי הוראות חוק זה. (ג) הודעה כאמור בסעיף זה תינתן בכתב ותציין את יום הוצאת ההודעה ואת יום הכניסה לתוקף של הפיטורים או ההתפטרות, לפי הענין, והכל בהתאם להוראות חוק זה."

[[section]]
num = "3"
heading = "הודעה מוקדמת לפיטורים לעובד במשכורת"
text = "עובד במשכורת זכאי להודעה מוקדמת לפיטורים, כמפורט להלן: (1) במהלך ששת חודשי עבודתו הראשונים – של יום אחד בשל כל חודש עבודה; (2) במהלך התקופה החל בחודש השביעי לעבודתו עד תום שנת עבודתו הראשונה – של 6 ימים, בתוספת של יומיים וחצי בשל כל חודש עבודה בתקופה האמורה; (3) לאחר שנת עבודתו הראשונה – של חודש ימים."

[[section]]
num = "4"
heading = "הודעה מוקדמת לפיטורים לעובד בשכר"
text = "עובד בשכר זכאי להודעה מוקדמת לפיטורים, כמפורט להלן: (1) במהלך שנת עבודתו הראשונה – של יום אחד בשל כל חודש עבודה; (2) במהלך שנת עבודתו השניה – של 14 ימים, בתוספת של יום אחד בשל כל שני חודשי עבודה בשנה האמורה; (3) במהלך שנת עבודתו השלישית – של 21 ימים, בתוספת של יום אחד בשל כל שני חודשי עבודה בשנה האמורה; (4) לאחר שנת עבודתו השלישית – של חודש ימים."

[[section]]
num = "5"
heading = "הודעה מוקדמת להתפטרות"
text = "הוראות סעיפים 3 ו־4 יחולו, בשינויים המחויבים לפי הענין, על הודעה מוקדמת להתפטרות."

[[section]]
num = "6"
heading = "ויתור על עבודה בפועל"
text = "(א) מעסיק רשאי להודיע לעובד, בהודעה מוקדמת לפיטורים, כי הוא מוותר על נוכחות העובד ועל עבודתו בפועל בתקופת ההודעה האמורה, כולה או מקצתה, ובלבד שישלם לעובדו פיצוי בסכום השווה לשכרו הרגיל של העובד בעד התקופה שלגביה ויתר על עבודתו. (ב) מעסיק רשאי להודיע לעובד שנתן הודעה מוקדמת להתפטרות, כי הוא מוותר על נוכחותו של העובד ועל עבודתו בפועל בתקופת ההודעה האמורה, כולה או מקצתה, ובלבד שישלם לעובדו פיצוי בסכום השווה לשכרו הרגיל של העובד בעד התקופה שלגביה ויתר על עבודתו."

[[section]]
num = "7"
heading = "תוצאות אי מתן הודעה מוקדמת"
text = "(א) מעסיק שפיטר עובד ולא נתן לו הודעה מוקדמת לפיטורים כאמור בחוק זה, ישלם לעובדו פיצוי בסכום השווה לשכרו הרגיל בעד התקופה שלגביה לא ניתנה ההודעה המוקדמת. (ב) עובד שחדל לעבוד ולא נתן למעסיקו הודעה מוקדמת להתפטרות כאמור בחוק זה, ישלם למעסיקו פיצוי בסכום השווה לשכרו הרגיל בעד התקופה שלגביה לא ניתנה ההודעה המוקדמת."

[[section]]
num = "10"
heading = "פיטורים והתפטרות בלא מתן הודעה מוקדמת"
text = "הוראות סעיפים 2 עד 7 לא יחולו – (1) על עובד, בנסיבות מיוחדות שעקב קיומן אין לדרוש ממנו כי יעבוד בתקופת ההודעה המוקדמת הקבועה בחוק זה; שר העבודה והרווחה רשאי לקבוע באישור ועדת העבודה הרווחה והבריאות של הכנסת ובהתייעצות עם ארגוני עובדים וארגוני מעבידים שלדעתו הם יציגים, נסיבות מיוחדות שעקב קיומן אין לדרוש מהעובד כי יעבוד בתקופת ההודעה המוקדמת; (2) על מעסיק, בנסיבות שבהן העובד שפוטר אינו זכאי לפיצויים, על פי הוראות סעיפים 16 או 17 לחוק פיצויי פיטורים, או על פי החלטת בית דין למשמעת אשר הורה על פיטורים בלא פיצויים מכוח הוראות חיקוק הקובע שיפוט משמעתי."

[[section]]
num = "11"
heading = "דין המדינה"
text = "לענין חוק זה, דין המדינה כדין כל מעסיק אחר."

[[section]]
num = "12"
heading = "שמירת זכויות"
text = "חוק זה, אינו בא למעט מכל זכות הנתונה לעובד לפי חוק, הסכם קיבוצי או חוזה עבודה."

