title = "שני מקורות גוברים על התקנון באותה נקודה ואינם מתאימים זה לזה: הכלל אינו אומר איזה מהם קובע"
body = """
הכלל קובע שכל אחד מהמקורות שברשימה גובר על התקנון, ואינו מדרג אותם זה מול זה. כשהסכם קיבוצי וחוזר לבעלויות עדכני יותר שניהם אינם מתאימים לתקנון באותה נקודה, ואינם מתאימים זה לזה, שניהם גוברים על התקנון, והכלל אינו אומר מה מהם חל.
"""
reading = "הקידוד מחזיר את כל המקורות הגוברים, ואינו בוחר ביניהם."
