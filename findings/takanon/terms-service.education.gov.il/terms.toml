# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the page the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-terms-a"
kind = "ambiguity"
stage = "writing"
keys = ["hc_2/p2"]
quote = "הסכמים קיבוציים, הוראות החוק, חוזרי מנכ\"ל, נהלי משרד החינוך או חוזרים לבעלויות עדכניים יותר – האמור בהם גובר על האמור בתקנון."
title = "\"עדכניים יותר\": רק החוזרים לבעלויות, או כל המקורות שברשימה?"
body = """
כלל העדיפות מונה חמישה מקורות שגוברים על התקנון כשאינם מתאימים לו, ומסיים במילים "עדכניים יותר". אפשר לקרוא אותן כתיאור של המקור האחרון בלבד — החוזרים לבעלויות — ואפשר כתיאור של כל הרשימה.

הקריאות נותנות תשובות שונות למקור ישן: הסכם קיבוצי משנת 1989 שאינו מתאים לסעיף שתוקן בשנת 2004 גובר על התקנון בקריאה הראשונה ואינו גובר בשנייה.
"""
reading = "\"עדכניים יותר\" מתאר את החוזרים לבעלויות בלבד, המילים הסמוכות לו; הסכמים קיבוציים, הוראות החוק, חוזרי מנכ\"ל ונהלי המשרד גוברים על התקנון בכל מועד."
l4 = "l4/takanon/terms-service.education.gov.il/terms.l4"
evidence = "`the two readings of \"more recent\" part on an older agreement`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-terms-b"
kind = "gap"
stage = "writing"
keys = ["hc_2/p1", "hc_2/p2"]
quote = "תקנון שירות עובדי הוראה מצוי בתהליך עדכון. · חוזרים לבעלויות עדכניים יותר"
title = "\"עדכניים יותר\" ממה? לתקנון אין תאריך אחד"
body = """
חוזר לבעלויות גובר על התקנון אם הוא "עדכני יותר", והטקסט אינו אומר ממה. לתקנון כולו אין תאריך: הוא "מצוי בתהליך עדכון", וסעיפיו נושאים כל אחד את תאריך תיקונו או בדיקתו (§1.9.1 "נבדק ב- 19.11.02", §1.11 "תוקן ב 12.01.04").

חוזר מיוני 2003 עדכני יותר מ־§1.9.1 וישן מ־§1.11: אם "התקנון" הוא הסעיף שבו מדובר, החוזר גובר על האחד ולא על השני, ואם הוא תאריך אחר — הטקסט אינו נותן אותו.
"""
reading = "החוזר נבחן מול תאריך התיקון של הסעיף שבו מדובר, כפי שהסעיף מדפיס אותו; התאריך הזה הוא קלט."
l4 = "l4/takanon/terms-service.education.gov.il/terms.l4"
evidence = "`a circular of June 2003 is newer than one section and older than another`"
depends_on = ["F-terms-a"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

