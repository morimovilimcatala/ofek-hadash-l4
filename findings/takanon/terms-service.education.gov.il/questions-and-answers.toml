title = "קרן השתלמות: מצטרפים בבקשה, כבתשובה וכמו ב־§1.15, או שהמסלול הרגיל של §1.26.3 חל על כל עובד הוראה?"
body = """
לפי התשובה, כדי לממש את הזכות עובד ההוראה ממלא טפסים ומבקש להצטרף לקרן.

התקנון אומר שני דברים. §1.26.3 (המסלול הרגיל, 1א–ב) קובע ש"ישלם כל עובד הוראה, מדי חודש בחודשו" באמצעות המעסיק, ואינו מזכיר בקשה להצטרף. §1.15 (ההטבות למורים מהצפון המלמדים בדרום) מורה להם "לפנות איפא ישירות לקרנות ההשתלמות ולמלא טפסים ולהצטרף לקרן במסגרת הרגילה". התשובה הולכת אחרי השני; קידוד §1.26.3 — אחרי הראשון. על חובת המעסיק להפריש ולהעביר את הכספים התשובה והתקנון מסכימים.
"""
reading = "קידוד §1.26.3 נשאר כפי שהוא: המסלול הרגיל חל על כל עובד הוראה; הבקשה להצטרף מקודדת כקריאת המשרד."
convention = "reading.as-printed"
l4 = "l4/takanon/terms-service.education.gov.il/questions-and-answers.l4"
evidence = "`the answer asks for an application the takanon does not`"
