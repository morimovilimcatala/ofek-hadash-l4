# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the page the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# The ministry's answers are its reading, not binding law. Each answer the
# takanon's L4 can decide is run against it; a finding here is an answer
# that the takanon, as encoded, contradicts, or a rule the answer adds where
# the takanon is silent. The takanon's own encoding is not changed to make an
# answer pass: the reading of every finding is that the takanon's encoding
# stands and the answer is recorded beside it.


[[finding]]
id = "F-questions-and-answers-a"
kind = "ambiguity"
stage = "examples"
keys = ["hc_1/p18", "hc_1/p19"]
quote = "האם מורה המלמד 2 מקצועות שונים ב- 3 כיתות, נחשב כמלמד ב- 6 כיתות לצורך זכאות לגמול פיצול ? · לא. כיתה, הכוונה כיתת אם."
title = "גמול פיצול: כיתה שמלמדים בה שני מקצועות — כיתה אחת או שתיים?"
body = """
§1.11.1א מזכה בגמול פיצול עובד הוראה המלמד שש עד שבע כיתות, ואינו אומר אם כיתה שהוא מלמד בה שני מקצועות נספרת פעם אחת או פעמיים (F-1.11-f). קידוד ה־L4 של §1.11 סופר כל קבוצה שהעובד מלמד (`classes counted`), ולכן מורה המלמד 2 מקצועות ב־3 כיתות נספר שם כמלמד 6 כיתות וזכאי.

התשובה קובעת ש"כיתה" היא כיתת אם: המורה מלמד ב־3 כיתות ואינו זכאי. אותו עמוד, בתשובה הבאה, סופר גם הקבצה של תלמידים משתי כיתות (§1.11.2א), שאינה כיתת אם — כך שגם "כיתת אם" אינה המבחן כולו.
"""
reading = "קידוד התקנון נשאר כפי שהוא וסופר קבוצות שהעובד מלמד; התשובה מקודדת לידו כקריאת המשרד, וההכרעה ביניהן שמורה למי שמוסמך לפרש את §1.11."
convention = "reading.as-printed"
l4 = "l4/takanon/terms-service.education.gov.il/questions-and-answers.l4"
evidence = "`the takanon counts two subjects in three classes as six and the answer as three`"
depends_on = ["F-1.11-f"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

