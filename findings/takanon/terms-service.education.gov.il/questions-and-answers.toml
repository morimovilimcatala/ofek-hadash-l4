keys = ["hc_1/p112"]
quote = "רק מורה המלמד במסגרת החינוך המיוחד זכאי לגמול יחסית להיקף העסקתו בחינוך המיוחד."
title = "תוספת חינוך מיוחד: התשובה משלמת לפי חלק ההעסקה בחינוך המיוחד, והתקנון — אחוז מהשכר המשולב בלי חלוקה"
body = """
לפי התשובה, המורה זכאי לגמול "יחסית להיקף העסקתו בחינוך המיוחד".

§4.6.2–3 נותן "תוספת חינוך מיוחד" בשיעור מהשכר המשולב, ואינו אומר מה דינו של מי שרק חלק מהעסקתו בחינוך המיוחד. בקידוד התקנון מורה מוסמכת שמחצית משרתה במסגרת של חינוך מיוחד מקבלת 14% מכל שכרה המשולב; לפי התשובה — מחצית מזה. על כך שמוסמך המלמד במסגרת רגילה אינו זכאי, ושכל מורה במסגרת זכאי ולא רק המחנך, התשובה והתקנון מסכימים.
"""
reading = "קידוד התקנון מקבל את השכר המשולב כקלט; החלוקה לפי היקף ההעסקה בחינוך המיוחד מקודדת כקריאת המשרד."
l4 = "l4/takanon/terms-service.education.gov.il/questions-and-answers.l4"
evidence = "`the takanon pays on the whole salary and the answer on the special-education share`"
