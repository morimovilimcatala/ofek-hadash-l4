[[finding]]
id = "F-questions-and-answers-w"
kind = "contradiction"
stage = "examples"
keys = ["hc_1/p108"]
quote = "מורה שאינו מוסמך לחינוך המיוחד מקבל גמול בגובה 5.5% אם מלמד במסגרת אינטגרטיבית או 9% אם מלמד במסגרת שכולה חינוך מיוחד (זאת לפי קביעת האגף לחינוך המיוחד). מורה מוסמך לחינוך המיוחד מקבל גמול בגובה 8.5% אם מלמד במסגרת אינטגרטיבית או 14% אם מלמד במסגרת שכולה חינוך מיוחד"
title = "תוספת חינוך מיוחד: התשובה מחליפה בין 9% ל־8.5%"
body = """
לפי התשובה: לא מוסמך — 5.5% במסגרת משלבת ו־9% במסגרת שכולה חינוך מיוחד; מוסמך — 8.5% במסגרת משלבת ו־14% במסגרת שכולה חינוך מיוחד.

§4.6.2–3: מוסמך — 14% במסגרת של חינוך מיוחד ו־9% כמורה שילוב; לא מוסמך — 8.5% במסגרת של חינוך מיוחד ו־5.5% כמורה שילוב. שני שיעורים מסכימים (14% ו־5.5%); 9% ו־8.5% מוחלפים: לא מוסמך במסגרת של חינוך מיוחד מקבל לפי התקנון 8.5% ולפי התשובה 9%, ומוסמך כמורה שילוב — 9% לפי התקנון ו־8.5% לפי התשובה.
"""
reading = "קידוד התקנון נשאר כפי שהוא, עם השיעורים של §4.6."
l4 = "l4/takanon/terms-service.education.gov.il/questions-and-answers.l4"
evidence = "`the answer swaps the takanon's 9% and 8.5%`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-questions-and-answers-x"
kind = "gap"
