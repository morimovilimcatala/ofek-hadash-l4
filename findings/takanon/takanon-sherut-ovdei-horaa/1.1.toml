quote = "מחושבות מהשכר המשולב, מתוספת 3% , מתוספת 2008 , מתוספת 2011 ומתוספת \"הסכם הוראה 1994\" (א', ב', ג' ו- ד' לעיל)"
title = "The base of the percentage allowances: five supplements by name, four by letter"
body = """
§1.1ו computes the percentage allowances on five components it names — the combined salary and the 3%, 2008, 2011 and "הסכם הוראה 1994" supplements — and points to them as "(א', ב', ג' ו- ד' לעיל)". Those four letters are the combined salary (א), the 3% supplement (ב), the 2008 supplement (ג) and the 2011 supplement (ד); the 1994 supplement is ה, which the letters leave out.

Read by the names, the base includes the 1994 supplement; read by the letters, it does not. Every percentage allowance in ו.1–3 differs between the readings wherever the 1994 supplement is paid.
"""
reading = "The names govern: the base includes the 1994 supplement, as §1.12.2א's base also does; the letters are read as not updated when ד (the 2011 supplement) was inserted."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.1.l4"
evidence = "`the letters and the names of §1.1ו give different bases`"
