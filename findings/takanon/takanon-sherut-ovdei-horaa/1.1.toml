# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.1-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_1__hc_2__para_b", "chp_1א___sec_1_1__hc_2__para_c__subpara_2", "chp_1א___sec_1_1__hc_2__para_c__subpara_3"]
quote = "(להלן - תוספת השכר) · החל מתאיך 1.1.2009 - השלמת תוספת השכר לשיעור של 3% · החל מתאריך 1.1.2010 - השלמת תוספת השכר לשיעור של 5%"
title = "\"תוספת השכר\" is defined as the 3% supplement, then raised as if it were the 2008 one"
body = """
§1.1ב grants the 3% supplement and names it "תוספת השכר" for what follows ("להלן"). §1.1ג, headed "תוספת 2008", then grants 1.5% from 1.2.2008 and raises "תוספת השכר" to 3% (1.1.2009) and to 5% (1.1.2010).

Read by the defined term, ג.2 raises the 3% supplement to 3% (nothing) and ג.3 raises it to 5%, while the 2008 supplement stays at 1.5%: together 6.5% in 2010. Read by the heading of ג, the steps are the 2008 supplement's (1.5% → 3% → 5%) and the 3% supplement stays 3%: together 8%. The two readings give different salaries, and §1.12.2א ("תוספת 5% (הסכם 2008)") is consistent only with the second.
"""
reading = "The heading of ג governs: \"תוספת השכר\" in ג.2–3 is the 2008 supplement, which rises 1.5% → 3% → 5%; the 3% supplement of ב stays at 3%."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.1.l4"
evidence = "`the defined term \"תוספת השכר\" and the heading of ג give different rates`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.1-b"
kind = "contradiction"
stage = "writing"
keys = ["chp_1א___sec_1_1__hc_2__para_f", "chp_1א___sec_1_1__hc_2__para_e"]
quote = "מחושבות מהשכר המשולב, מתוספת 3% , מתוספת 2008 , מתוספת 2011 ומתוספת \"הסכם הוראה 1994\" (א', ב', ג' ו- ד' לעיל)"
title = "The base of the percentage allowances: five supplements by name, four by letter"
body = """
§1.1ו computes the percentage allowances on five components it names — the combined salary and the 3%, 2008, 2011 and "הסכם הוראה 1994" supplements — and points to them as "(א', ב', ג' ו- ד' לעיל)". Those four letters are the combined salary (א), the 3% supplement (ב), the 2008 supplement (ג) and the 2011 supplement (ד); the 1994 supplement is ה, which the letters leave out.

Read by the names, the base includes the 1994 supplement; read by the letters, it does not. Every percentage allowance in ו.1–3 differs between the readings wherever the 1994 supplement is paid.
"""
reading = "The names govern: the base includes the 1994 supplement, as §1.12.2א's base also does; the letters are read as not updated when ד (the 2011 supplement) was inserted."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.1.l4"
evidence = "`the letters and the names of §1.1ו give different bases`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
