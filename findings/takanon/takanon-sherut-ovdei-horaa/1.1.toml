# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.1-a"
kind = "ambiguity"
stage = "writing"
severity = "medium"
severity_why = "בסימולטור 'טרום רפורמה' תוספת 2001 (3%) ותוספת 2008 מחושבות כשורות נפרדות על בסיסים נפרדים; §4 להסכם 21.2.2008 ו־§1.12.2א לתקנון תומכים בקריאה זו, ולכן בית משפט צפוי להותיר אותה."
keys = ["chp_1א___sec_1_1__hc_2__para_b", "chp_1א___sec_1_1__hc_2__para_c__subpara_2", "chp_1א___sec_1_1__hc_2__para_c__subpara_3"]
quote = "(להלן - תוספת השכר) · החל מתאיך 1.1.2009 - השלמת תוספת השכר לשיעור של 3% · החל מתאריך 1.1.2010 - השלמת תוספת השכר לשיעור של 5%"
title = "\"תוספת השכר\" מוגדרת כתוספת 3%, ואחר כך מועלית כאילו הייתה תוספת 2008"
body = """
§1.1ב מעניק את תוספת 3% וקורא לה "תוספת השכר" לגבי מה שבא אחריו ("להלן"). אחריו §1.1ג, שכותרתו "תוספת 2008", מעניק 1.5% מ־1.2.2008 ומעלה את "תוספת השכר" ל־3% (1.1.2009) ול־5% (1.1.2010).

לפי המונח המוגדר, ג.2 מעלה את תוספת 3% ל־3% (כלומר אינו משנה דבר) ו־ג.3 מעלה אותה ל־5%, ואילו תוספת 2008 נשארת 1.5%: יחד 6.5% ב־2010. לפי הכותרת של ג, המדרגות הן של תוספת 2008 (1.5% ← 3% ← 5%) ותוספת 3% נשארת 3%: יחד 8%. שתי הקריאות נותנות שכר שונה, ו־§1.12.2א ("תוספת 5% (הסכם 2008)") מתיישב רק עם השנייה.
"""
reading = "הכותרת של ג גוברת: \"תוספת השכר\" ב־ג.2–3 היא תוספת 2008, העולה 1.5% ← 3% ← 5%; תוספת 3% של ב נשארת 3%."
convention = "precedence.heading"
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.1.l4"
evidence = "`the defined term \"תוספת השכר\" and the heading of ג give different rates`"
depends_on = []
