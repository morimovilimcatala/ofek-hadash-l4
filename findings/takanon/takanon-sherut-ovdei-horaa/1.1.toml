title = "הבסיס של התוספות האחוזיות: חמש תוספות לפי השם, ארבע לפי האות"
body = """
§1.1ו מחשב את התוספות האחוזיות מחמישה רכיבים שהוא נוקב בשמם — השכר המשולב, ותוספת 3%, תוספת 2008, תוספת 2011 ותוספת "הסכם הוראה 1994" — ומפנה אליהם כ"(א', ב', ג' ו- ד' לעיל)". ארבע האותיות האלה הן השכר המשולב (א), תוספת 3% (ב), תוספת 2008 (ג) ותוספת 2011 (ד); תוספת 1994 היא ה, שהאותיות משמיטות.

בקריאה לפי השמות, הבסיס כולל את תוספת 1994; בקריאה לפי האותיות, אינו כולל אותה. כל תוספת אחוזית ב־ו.1–3 שונה בין הקריאות בכל מקום שבו משולמת תוספת 1994.
"""
reading = "השמות גוברים: הבסיס כולל את תוספת 1994, כפי שגם הבסיס של §1.12.2א כולל אותה; האותיות נקראות כמי שלא עודכנו כאשר הוכנס ד (תוספת 2011)."
