# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.7-a"
kind = "overlap"
stage = "writing"
keys = ["chp_1א___sec_1_7__hc_2__para_2__subpara_b"]
quote = "20-25 … 12 · 25 ואילך … 13"
title = "The recuperation-days table gives year 25 two answers"
body = """
§1.7.2ב sets the number of recuperation days by seniority in six bands. The fifth band is "20-25" (12 days) and the sixth is "25 ואילך", 25 and onward (13 days), so an employee in year 25 falls in both and the table gives 12 and 13 at once.

Written as a function from a year of seniority to a number of days, the table cannot be transcribed as printed: it is a relation. The L4 keeps the printed rows as data and asks them directly; every other year from 1 to 40 gets exactly one row.
"""
reading = "The band that opens at 25 governs year 25 (13 days), reading the fifth band as 20-24. It is the reading under which every year has one answer and every printed row still applies to some year."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.7.l4"
evidence = "`the table gives year 25 two day counts`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
