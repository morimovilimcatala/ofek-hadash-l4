kind = "gap"
stage = "writing"
keys = ["chp_1א___sec_1_7__hc_2__para_1", "chp_1א___sec_1_7__hc_2__para_2__subpara_b", "chp_1א___sec_1_7__hc_2__para_3"]
quote = "החל מהשנה הראשונה לשירותו · 1-3 … 7"
title = "An employee in the first year has no row if seniority counts completed years"
body = """
§1.7.1 grants the allowance "from the first year of service", and the days table's first band starts at 1. §1.7.3 sends the counting of seniority to the takanon's chapter on salary grade and seniority without saying here whether the year being served counts.

If seniority is the number of COMPLETED years, an employee in the first year has seniority 0, which no band covers, and §1.7.1's entitlement has no amount.
"""
reading = "The year being served counts: the first year of service is year 1. It is the reading under which §1.7.1 and the table agree; it awaits the encoding of the seniority chapter (§1.29)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.7.l4"
evidence = "`a first-year employee has no row if seniority counts completed years`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.7-c"
kind = "contradiction"
stage = "writing"
keys = ["chp_1א___sec_1_7__hc_2__para_4", "chp_1א___sec_1_7__hc_2__para_5"]
quote = "שהה עובד הוראה במשך חלק מהשנה בחופשה ללא שכר … בשיעור יחסי · ושאורכן הכולל הוא יותר מ - 30 יום"
title = "§1.7.4 and §1.7.5 give different allowances for short unpaid leave"
body = """
§1.7.4: an employee on unpaid leave for part of the year gets a partial allowance, pro-rated to the months for which salary was received. §1.7.5: where the year's periods without salary total MORE than 30 days, the allowance is pro-rated to the whole months salary was payable — so at 30 days or less it is not reduced.

Unpaid leave is a period without salary, so both clauses decide it. For twenty days of unpaid leave §1.7.4 reduces the allowance and §1.7.5 does not. The two also pro-rate by different measures (months for which salary was received, against whole months in which it was payable).
"""
reading = "§1.7.5 is the rule for every period without salary, unpaid leave included: it is the clause that names the total, the threshold and the measure, and §1.7.4 is read as the case of it where the total passes 30 days."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.7.l4"
evidence = "`§1.7.4 and §1.7.5 disagree on short unpaid leave`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
