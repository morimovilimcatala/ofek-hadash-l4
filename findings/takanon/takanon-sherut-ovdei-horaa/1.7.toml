title = "טבלת ימי ההבראה נותנת לשנה 25 שתי תשובות"
body = """
§1.7.2ב קובע את מספר ימי ההבראה לפי ותק, בשש מדרגות. המדרגה החמישית היא "20-25" (12 ימים) והשישית "25 ואילך" (13 ימים), כך שעובד בשנה 25 נופל בשתיהן והטבלה נותנת 12 ו־13 בבת אחת.

כשהיא נכתבת כפונקציה משנת ותק למספר ימים, אי אפשר להעתיק את הטבלה כפי שהודפסה: היא יחס. ה־L4 שומר את השורות המודפסות כנתונים ושואל אותן ישירות; כל שנה אחרת מ־1 עד 40 מקבלת שורה אחת בדיוק.
"""
reading = "המדרגה הנפתחת ב־25 חלה על שנה 25 (13 ימים), והמדרגה החמישית נקראת כ־20–24. זו הקריאה שבה לכל שנה תשובה אחת וכל שורה מודפסת עדיין חלה על שנה כלשהי."
