kind = "contradiction"
stage = "writing"
severity = "medium"
severity_why = "חופשה ללא שכר קצרה מפחיתה את הקצובה לפי סעיף אחד ואינה מפחיתה לפי האחר, והסעיף הנוקב בסף מכריע."
keys = ["chp_1א___sec_1_7__hc_2__para_4", "chp_1א___sec_1_7__hc_2__para_5"]
quote = "שהה עובד הוראה במשך חלק מהשנה בחופשה ללא שכר … בשיעור יחסי · ושאורכן הכולל הוא יותר מ - 30 יום"
title = "§1.7.4 ו־§1.7.5 נותנים קצובה שונה לחופשה ללא שכר קצרה"
body = """
§1.7.4: עובד ששהה במשך חלק מהשנה בחופשה ללא שכר מקבל קצובה חלקית, בשיעור יחסי למספר החודשים שבעדם קיבל משכורת. §1.7.5: כשהתקופות בשנה שבעדן אין משכורת מצטברות ליותר מ־30 יום, הקצובה יחסית למספר החודשים השלמים שבהם היה זכאי לקבל משכורת — כך שב־30 יום או פחות היא אינה מופחתת.

חופשה ללא שכר היא תקופה שבעדה אין משכורת, ולכן שני הסעיפים מכריעים בה. לעשרים יום של חופשה ללא שכר, §1.7.4 מפחית את הקצובה ו־§1.7.5 אינו מפחית. השניים גם מחשבים את היחס לפי מדדים שונים (חודשים שבעדם התקבלה משכורת, לעומת חודשים שלמים שבהם הייתה זכאות לה).
"""
reading = "§1.7.5 הוא הכלל לכל תקופה ללא משכורת, חופשה ללא שכר בכלל זה: זה הסעיף שנוקב בסך המצטבר, בסף ובמדד, ו־§1.7.4 נקרא כמקרה שלו שבו הסך עובר 30 יום."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.7.l4"
evidence = "`§1.7.4 and §1.7.5 disagree on short unpaid leave`"
