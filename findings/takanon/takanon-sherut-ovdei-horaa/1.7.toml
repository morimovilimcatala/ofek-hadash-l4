quote = "יהיה זכאי לקצובה מלאה, אף אם פרש בתוך שנת הלימודים"
title = "A \"full\" allowance on retirement: full for the months, or full outright?"
body = """
§1.7.6 gives an employee who retires on pension during the school year "a full allowance". The clause it answers is the months pro-rating (§§1.7.3–1.7.5: the year was not worked through), but "full" also reads as the full-position amount, setting aside §1.7.7's pro-rating by position fraction.

The readings differ for any part-time retiree: on a half position, one pays half the full-year amount and the other all of it.
"""
reading = "\"Full\" lifts the months pro-rating only; §1.7.7's position share still applies, as the clause's own words (\"even if retired during the school year\") point at the months."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.7.l4"
evidence = "`\"full\" read as the full-position amount differs for a part-time retiree`"
depends_on = []
