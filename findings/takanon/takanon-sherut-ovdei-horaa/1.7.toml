§1.7.1 מעניק את הקצובה "החל מהשנה הראשונה לשירותו", והמדרגה הראשונה בטבלת הימים מתחילה ב־1. §1.7.3 מפנה את חישוב הוותק לפרק התקנון על קביעת דרגת שכר וותק, בלי לומר כאן אם השנה שבה העובד משרת נמנית.

אם הוותק הוא מספר השנים שהושלמו, לעובד בשנתו הראשונה ותק 0, שאף מדרגה אינה חלה עליו, ולזכאות של §1.7.1 אין סכום.
"""
