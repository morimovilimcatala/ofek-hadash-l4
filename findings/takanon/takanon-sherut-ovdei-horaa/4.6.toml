quote = "\"עובדי הוראה בחינוך המיוחד\" - הם עובדי חינוך המועסקים במסגרות לימוד שהוכרו כחינוך מיוחד על-ידי הפיקוח, כולל גננת שילוב · כמורה שילוב או גננת שילוב"
title = "The definition of a special-education teaching employee leaves out the integration teacher whom the rates pay"
body = """
§4.6.2 and §4.6.3 pay the special-education supplement to "special-education teaching employees", and their sub-clauses (ב) set a rate (9%, or 5.5% uncertified) for those who teach in other frameworks of regular education "as an integration teacher or integration kindergarten teacher".

§4.6.1 defines the term as those employed in frameworks the supervision recognised as special education, "including the integration kindergarten teacher". It names the integration kindergarten teacher and not the integration teacher of a school, who works in a regular-education framework. Read as printed, the integration teacher is not a special-education teaching employee, and the rate the (ב) sub-clauses set for her reaches no one but the kindergarten teacher.
"""
reading = "The integration teacher of a school is a special-education teaching employee as the integration kindergarten teacher is: the (ב) sub-clauses name her, and the definition's \"including\" would otherwise empty them of half their subject."
