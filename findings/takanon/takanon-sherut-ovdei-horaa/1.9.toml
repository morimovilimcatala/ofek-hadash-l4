ההערה ל־§1.9.1.1א מחילה את "סעיפים 2(3), ב2(5) ו-ב2(6) להלן" על מורים המשתמשים בכרטיס חופשי-חודשי. ב־§1.9.1 אין סעיפים כאלה: לפסקה 2 שלו (העסקה מחוץ לתחום השיפוט) יש סעיפים־משנה באותיות א–ה ואין בה פריטים (3), (5) או (6), ושום דבר אינו ממוספר "ב2".

