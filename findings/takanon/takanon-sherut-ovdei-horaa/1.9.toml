# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-1.9-a"
kind = "broken-reference"
stage = "writing"
keys = ["chp_1א___sec_1_9__ssec_1_9_1__para_1__subpara_a/p5"]
quote = "הערה: סעיפים 2(3), ב2(5) ו-ב2(6) להלן חלים גם על מורים המשתמשים בכרטיס חופשי-חודשי."
title = "The note on pass users cites three clauses §1.9.1 does not have"
body = """
The note to §1.9.1.1א applies "סעיפים 2(3), ב2(5) ו-ב2(6) להלן" to teachers who use a free monthly pass. §1.9.1 has no such clauses: its paragraph 2 (employment outside the jurisdiction) has lettered subclauses א–ה and no items (3), (5) or (6), and nothing is numbered "ב2".

The clauses that carry those item numbers are those of paragraph 1ב: 1ב.3 (pay by journeys made), 1ב.5 (no allowance from the second month of an absence or reserve duty longer than a month) and 1ב.6 (none on unpaid leave, on stoppage or in the summer break). Which rules bind pass users — in particular whether their pass is still refunded in the summer and through a long absence, which 1א ¶2 otherwise pays "ללא ניכוי היעדרות ופגרות חג" — turns on the reference.
"""
reading = "The note cites 1ב.3, 1ב.5 and 1ב.6, the only clauses of §1.9.1 bearing items 3, 5 and 6; they apply to pass users, so a pass user is paid by journeys where attendance is required on some days only, and is paid nothing in the cases of 1ב.5–6."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.9.l4"
evidence = "`none of the clauses the note cites exists`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.9-b"
kind = "gap"
stage = "writing"
keys = ["chp_1א___sec_1_9__ssec_1_9_1__para_1__subpara_b__cls_4"]
quote = "יוצמד, לצורך תשלום הקצובה, למקום עבודה אחד בו הוא מועסק במספר השעות הגדול ביותר."
title = "Several schools with equal hours: the allowance has no workplace to attach to"
body = """
§1.9.1.1ב.4 attaches the travel allowance of a teacher employed in several schools (official education) to the ONE workplace where the teacher's hours are greatest. Where two or more schools share the greatest number of hours, there is no single such workplace, and the clause does not say which of them governs.

The choice decides the journey the allowance is paid for, and so its amount.
"""
reading = "The clause decides nothing between tied workplaces; the L4 returns every workplace with the greatest hours and adopts no tie-break of its own."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.9.l4"
evidence = "`a teacher with 12 hours in each of two schools is attached to both`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.9-c"
kind = "overlap"
stage = "writing"
keys = ["chp_1א___sec_1_9__ssec_1_9_1__para_2__subpara_b", "chp_1א___sec_1_9__ssec_1_9_1__para_2__subpara_d"]
quote = "יוסיף לקבל את הוצאות הנסיעה באותו שיעור שניתן לו לפני שעבר למקום מגוריו · בחינוך הרשמי: מורה המרחיק את מקום מגוריו, יקבל הוצאות נסיעה אם מתקיימים כל התנאים המפורטים להלן"
title = "A teacher who moves away: kept at the old rate (2ב) or paid travel expenses (2ד)?"
body = """
§1.9.1.2ב: a teacher who moves home out of the local authority's jurisdiction, where the move raises the travel cost or creates an entitlement, keeps the allowance at the rate paid before the move (unless the move was at the Ministry's demand or for recognised personal reasons). §1.9.1.2ד: in official education, a teacher who moves home farther away "gets travel expenses" if three conditions hold — moved to another city and still works in the old one; asked for work in the new city and was not placed for two years; a realistic placement there was not used.

A teacher in official education who moved to another city and meets ד's three conditions is also within ב, which freezes the allowance at its old rate — possibly nothing — while ד pays travel expenses. The text does not say which governs, nor, for ד, at what rate.
"""
reading = "2ד is the exception to 2ב for official education: where its three conditions hold, the allowance is paid on the present journey; otherwise 2ב freezes it at the rate before the move."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.9.l4"
evidence = "`2ב and 2ד both reach a teacher who moved away and was not placed`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
