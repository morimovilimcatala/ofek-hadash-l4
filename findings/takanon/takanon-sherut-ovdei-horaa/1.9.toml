body = """
§1.9.1.2ב: עובד הוראה העובר למקום מגורים מחוץ לתחום השיפוט של הרשות המקומית, כאשר המעבר מגדיל את הוצאות הנסיעה או יוצר זכאות, ממשיך לקבל את הקצובה בשיעור ששולם לו לפני המעבר (אלא אם המעבר היה לפי דרישת המשרד או מטעמים אישיים שהוכרו). §1.9.1.2ד: בחינוך הרשמי, מורה המרחיק את מקום מגוריו "יקבל הוצאות נסיעה" אם מתקיימים שלושה תנאים — עבר לעיר אחרת וממשיך לעבוד בעיר הקודמת; ביקש לעבוד בעיר החדשה ולא סודר בעבודה במשך שנתיים; אפשרות ריאלית לסידורו שם לא נוצלה.

מורה בחינוך הרשמי שעבר לעיר אחרת ומקיים את שלושת התנאים של ד נכלל גם ב־ב, המקפיא את הקצובה בשיעורה הקודם — ואולי באפס — בעוד ד משלם הוצאות נסיעה. הטקסט אינו אומר איזה מהם גובר, ואף אינו אומר, לגבי ד, באיזה שיעור.
"""
