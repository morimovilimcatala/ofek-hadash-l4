body = """
מ־1.9.90 §1.9.3.3 מבטל את "החזר הוצאות נסיעה בתפקיד" — ההחזר בעד נסיעה בתפקיד — לעובדי הוראה שבאזור מגוריהם הונהג הכרטיס החופשי-חודשי.

מאז 1.4.82 §1.9.3.2 משלם לעובדי הוראה במוסדות החינוך לא החזר אלא "פיצוי כולל", פיצוי גלובלי בשיעור 25% מקצובת הנסיעה שלהם; ההחזר לפי ההוראות הקיימות הוא מה שנשאר לבעלי תפקידים לפי תעריף גלובלי ולעובדים בתפקידי הדרכה, פיקוח, כתיבת תכניות לימוד וכדומה. בקריאה לפי שם התשלום, סעיף 1990 מבטל את ההחזר של הקבוצות האלה ומשאיר על כנו את ה־25% של מורי המוסדות; בקריאה לפי הנושא שלו, "עובדי הוראה שבאזור מגוריהם הונהג הכרטיס", הוא מבטל כל תשלום בעד נסיעה בתפקיד באזור שבו פועל הכרטיס, כולל ה־25%. שתי הקריאות משלמות למורה במוסד באזור שבו פועל הכרטיס 25% מהקצובה, או כלום.
"""
