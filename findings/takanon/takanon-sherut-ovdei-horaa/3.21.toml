quote = "התנאים הנדרשים למילוי התפקיד · ד. השתתפות פעילה בשני מפגשי השתלמות שיוצעו על-ידי המוסד המכשיר את המתמחה במשך שנת החניכה · בכל מקרה ימונה החונך לא יאוחר מחודש ימים לאחר שיבוץ המתמחה בעבודה"
title = "A condition of appointment as mentor that can only be met after the appointment"
body = """
§3.21.2 lists "the conditions required to fill the role" of mentor. Condition (ד) is active participation in two training meetings that the intern's training institution will offer "during the mentoring year". §3.21.3.5 requires the mentor to be appointed no later than a month after the intern's placement — at the start of that year.

At the time of appointment no candidate can have met (ד): the meetings lie ahead. Read as a condition of appointment, the list can never be satisfied when the appointment must be made; and the text does not say what follows if an appointed mentor does not attend the meetings.
"""
reading = "Conditions (א)-(ג) qualify a candidate for appointment; (ד) is a condition of holding the role through the year, judged at its end. What a failure of (ד) entails (loss of the role, of the allowance) is left undecided."
