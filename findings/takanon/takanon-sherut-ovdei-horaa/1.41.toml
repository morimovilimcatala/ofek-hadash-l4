quote = "חייב להודיע על כל שינוי אישי שלו או של בני משפחתו (ראה רשימת השינויים בסעיף ד להלן) · להלן השינויים האישיים שהעובד חייב להודיע עליהם"
title = "\"Every personal change\" or the fourteen listed: is the list closed?"
body = """
The section's first paragraph obliges the employee to report "every personal change of his or of his family members", and points to "the list of changes in clause ד below" — a label the text does not carry anywhere. The fourth paragraph introduces fourteen items as "the personal changes the employee must report".

Read literally, the first paragraph makes any personal change reportable (a change the list does not name included), and the list illustrates it; read with the fourth paragraph, the duty is the fourteen items. The readings differ for every change not on the list, and the 30-day duty and its breach follow the answer.
"""
reading = "The list is closed: the duty is to report the fourteen listed changes, which is what the fourth paragraph calls them and what the first paragraph's pointer sends the reader to."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.41.l4"
evidence = "`\"every personal change\" and the closed list differ on an unlisted change`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

