# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-7.6-a"
kind = "broken-reference"
stage = "writing"
keys = ["chp_7__sec_7_6__ssec_1_3_3__para_a", "chp_7__sec_7_6__ssec_1_3_3__para_d", "chp_7__sec_7_6__ssec_1_3_2__para_e", "chp_7__sec_7_6__ssec_1_3_2__para_ja"]
quote = "במסמכים שהוגשו לוועדה (על פי המצוין בסעיף 1.3.2י לעיל) · משקיף כאמור בסעיף 1.3.2 ד לעיל"
title = "The committee's summing-up cites section 1.3.2 one letter behind, twice"
body = """
Section 1.3.3(a) has each member weigh "the documents submitted to the committee (as stated in section 1.3.2י above)"; section 1.3.2(י) is the rule against political questions, and the documents are laid before the committee by 1.3.2(יא). Section 1.3.3(d) lets "an observer as stated in section 1.3.2(ד) above" attend; 1.3.2(ד) is about the ministry's members and the representation of both sexes, and the observers are in 1.3.2(ה).

Read as written, 1.3.3(a) points the members at no documents and 1.3.3(d) admits no observer — while 1.3.2(ה) obliges the district personnel head to invite the general supervisor as one. Both references look like 1.3.2's letters shifted after 1.3.3 was written.
"""
reading = "1.3.3(a) refers to the material of 1.3.2(יא) and 1.3.3(d) to the observer of 1.3.2(ה)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/7.6.l4"
evidence = "`1.3.3 cites 1.3.2 one letter behind, twice`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-7.6-b"
kind = "broken-reference"
stage = "writing"
keys = ["chp_7__sec_7_6/p40", "chp_7__sec_7_6__ssec_1_3_1__para_b__subpara_1", "chp_7__sec_7_6__ssec_1_5_2", "chp_7__sec_7_6__ssec_7_6_2_8", "chp_7__sec_7_6__ssec_7_6_2_7"]
quote = "תתקבל רק אם הוא עומד בכל תנאי הסף הנדרשים לאותה משרה, כמפורט בנספח 1. · נספח 1 - בקשה לפרסום הודעה על משרה פנויה"
title = "The threshold conditions are \"detailed in Annex 1\", and the takanon's Annex 1 is the request to publish a vacancy"
body = """
The 2021 procedure in section 7.6.2 sends the threshold conditions for a management post to "Annex 1" three times: an application is received only if the candidate meets every threshold condition "as detailed in Annex 1" (1.1.2(b)); a candidate below them is not invited (1.3.1(b)(1)); and the acting-appointment preference goes to one meeting "the threshold conditions in Annex 1" (1.5.2).

The annexes the takanon prints are numbered from the 2011-12 version of the circular: 7.6.2.8 is "Annex 1 — request to publish a vacancy notice", followed by Annex 2 (an application), Annex 4 (the committee's protocol) and Annex 5 (an acting-appointment proposal). The threshold qualifications appear as 7.6.2.7, with no annex number and with only their title in the text. The reference therefore lands on a form, not on the conditions it is meant to state.
"""
reading = "\"Annex 1\" is read as the threshold qualifications of section 7.6.2.7; since their content is not in the text, meeting them is an input."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/7.6.l4"
evidence = "`the annex the procedure calls 1 does not hold the threshold conditions`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-7.6-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_7__sec_7_6__ssec_1_4_3__para_d__subpara_1", "chp_7__sec_7_6__ssec_1_4_3__para_d__subpara_2", "chp_7__sec_7_6__ssec_1_4_3__para_d__subpara_3", "chp_7__sec_7_6__ssec_1_4_3"]
quote = "אם פורסמה הודעה, אך לא מונה מועמד מאחת הסיבות האלה: · בהתקיים ג ו-ד לעיל · בהתקיים א-ד לעיל"
title = "When no one is appointed, the steps apply \"where (c) and (d) hold\" — of four reasons that cannot hold together"
body = """
Section 7.6.2.4(1.4.3) lists four reasons a published post may end without an appointment — no application, no candidate meeting the requirements, the committee finding no one qualified (c), the director-general appointing none of those it found qualified (d) — and introduces them as "one of these reasons". It then orders the district to forward the protocol and tell the candidates "where (c) and (d) above hold", and the senior division to propose a new notice or an acting appointment "where (a)-(d) above hold".

The reasons are alternatives: (c) and (d) cannot both be true of one vacancy, and (a) to (d) still less. Read as conjunctions the steps never apply; read as "or" they apply to each reason named. The difference decides whether candidates are ever told, and whether the senior division ever proposes how to fill the post.
"""
reading = "\"And\" is read as \"or\": steps (1) and (2) apply where the reason is (c) or (d), and step (3) applies whatever the reason."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/7.6.l4"
evidence = "`\"(c) and (d)\" read as a conjunction is never met`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-7.6-d"
kind = "gap"
stage = "writing"
keys = ["chp_7__sec_7_6__ssec_7_6_6_1__para_9__subpara_a", "chp_7__sec_7_6__ssec_7_6_6_1__para_9__subpara_a/p2"]
quote = "מספר הכיתות הממוצע יהיה מספר שלם. אם הממוצע הוא מספר שאינו שלם - יעוגל למספר השלם הקרוב ביותר."
title = "The average of four years' classes is rounded \"to the nearest whole number\", and a half has two"
body = """
Section 7.6.6.1(9)(a) lets a principal of eight years whose classes fell keep the management allowance for the average number of classes over the four years before the fall, rounded to the nearest whole number.

An average of four whole numbers can end in exactly .5 (10, 11, 10, 11 average 10.5), and then two whole numbers are equally near. The text does not say which, and the allowance table is read by whole classes, so the rate differs.
"""
reading = "A half rounds up (10.5 classes count as 11)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/7.6.l4"
evidence = "`four class counts can average to exactly a half`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-7.6-e"
kind = "ambiguity"
stage = "writing"
keys = ["chp_7__sec_7_6__ssec_7_6_9/p6", "chp_7__sec_7_6__ssec_7_6_9/p7", "chp_7__sec_7_6__ssec_7_6_9/p8", "chp_7__sec_7_6__ssec_7_6_9/p9"]
quote = "מנהלים ישתתפו בהשתלמויות, בכנסים ובימי עיון המתקיימים בשעות העבודה רק במקרים האלה: · המנהל יוודא שיהיה מי שימלא את מקומו בבית הספר באותו יום"
title = "Principals attend working-hours seminars \"only in these cases\": any of the three, or all of them?"
body = """
Section 7.6.9.2(b) lets principals attend seminars, conferences and study days held in working hours "only in these cases": (1) the subject needs the principal and not a teacher of the staff; (2) the event is national or for several districts (one-district events being held at hours the district manager sets); (3) the principal ensures someone stands in that day.

Item 3 is a duty rather than a case, so the list cannot be read uniformly as alternatives; read as cumulative, a one-district study day that only the principal can attend is barred in working hours, though (2) itself contemplates such days being held in the morning.
"""
reading = "Case (1) or case (2) suffices, and item (3) is required in every case."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/7.6.l4"
evidence = "`the readings of 7.6.9.2(b) differ for a one-district seminar`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
