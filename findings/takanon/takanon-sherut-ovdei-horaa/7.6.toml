body = """
§7.6.1, פסקה 4 ("המנהלים יעבדו חמישה ימים בשבוע…"), וכמוהו §7.6.9.1, קובעים שביום שהמנהל נעדר ממלא את מקומו סגנו, ובאין סגן "מחנך אחראי אחר", שהוא מחנך המקבל גמול תפקיד אחר. §7.6.3.1(10)–(11) ("בהיעדר המנהל…", "בבית ספר שאין בו סגן…") קובעים למנהל בית ספר יסודי שבהיעדרו ממלא את מקומו הסגן שמינה, אלא אם המפקח קבע אחרת, ובאין סגן — אחד המורים שהמנהל קבע לאותה שנה באישור המפקח.

שני הכללים חלים על אותו אירוע, היעדרות המנהל, ונותנים תשובות שונות. בדיקה על כל בית ספר (עם סגן ובלעדיו) ועל כל החלטה של המפקח מראה שהם נוקבים באותו ממלא מקום רק כשיש סגן והמפקח לא קבע אחרת. באין סגן, האחד דורש גמול תפקיד אחר ולא אישור של המפקח, והאחר דורש אישור של המפקח ולא גמול תפקיד; ועם סגן, רק השני מאפשר למפקח לקבוע אחרת.
"""
reading = "§7.6.1.4 חל על יום החופש השבועי של המנהל (`who stands in on the principal's day off`), שבו המחנך האחראי \"ישלב ביום שישי את 2 התפקידים\"; §7.6.3.1(10)–(11) חלים על היעדרויות אחרות (`who stands in for an absent primary principal`)."
