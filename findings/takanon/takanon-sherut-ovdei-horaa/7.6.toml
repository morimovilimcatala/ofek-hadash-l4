סעיף 7.6.2.4(1.4.3) מונה ארבע סיבות שבגללן משרה שפורסמה עשויה להסתיים בלי מינוי — אין בקשה, אין מועמד העונה על הדרישות, הוועדה לא מצאה מועמד מתאים (ג), המנכ"ל לא מינה אף אחד מאלה שנמצאו מתאימים (ד) — ומציג אותן כ"אחת הסיבות האלה". אחר כך הוא מורה למחוז להעביר את הפרוטוקול ולהודיע למועמדים "בהתקיים ג ו-ד לעיל", ולאגף הבכיר להציע הודעה חדשה או מינוי בפועל "בהתקיים א-ד לעיל".

