body = """
§7.6.6.1(9)א ("מנהל בית ספר (למעט מרכז) שכיהן בתפקידו 8 שנים, לפחות…") שומר למנהל את גמול הניהול כשמספר הכיתות פחת, והערה שבסופו מבהירה ש"הכוונה למנהל הממשיך לעבוד באותה בעלות". (9)ב(1) מחיל את 9א במפורש גם על מי שחדל לנהל. (9)ב(2) ("…העובר לנהל בית ספר באותה רמה…") קובע לעצמו את תנאיו — 8 שנים לפחות, לא מרכז, אותה רמה, פחות כיתות — ואינו מזכיר את ההערה ואינו מפנה ל־9א.

מנהל שעובר לבית ספר אחר עשוי לעבור גם לבעלות אחרת. אם ההערה חלה גם על (9)ב(2), הוא מאבד את הגמול הקודם; אם לא, הוא שומר עליו. בדיקה על כל היסטוריה (6 עד 9 שנים, מרכז או לא, אותה בעלות או לא, אותה רמה או לא) מראה ששתי הקריאות נפרדות בדיוק אצל מנהל של 8 שנים או יותר, שאינו מרכז, העובר לבית ספר באותה רמה של בעלות אחרת.
"""
