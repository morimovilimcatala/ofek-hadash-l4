title = "The half-seniority rounding rule is stated for more than two years, and its first example is one year"
body = """
1.29.3.1(8) rounds an odd number of years recognised at half seniority to the nearest whole number, for an employee "who worked more than two years in teaching". Its own examples are: one year at half seniority is recognised as one year; three as two; five as three.

The first example falls outside the rule's own condition: one year is not more than two. Read as stated, one year at half seniority is half a year, unrounded; the example makes it one. The examples also settle what "the nearest whole number" does with a half (it rounds up), which the words alone do not.
"""
reading = "The examples govern: half-seniority years are halved and rounded up whatever their number (1 → 1, 3 → 2, 5 → 3)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.29.l4"
