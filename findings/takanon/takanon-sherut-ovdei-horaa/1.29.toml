title = "A nursing teacher is given two different grades by two lists, and nothing says which governs"
body = """
1.29.2 lists, grade by grade, who is entitled to each salary grade. The same nursing teacher appears in two lists each time. A registered nurse with a permanent teaching licence is a senior certified teacher by ט(11) and a certified professional instructor by טז(4); a registered nurse without a teaching licence is a certified teacher by י(36) and a de facto certified professional instructor by יז(5).

