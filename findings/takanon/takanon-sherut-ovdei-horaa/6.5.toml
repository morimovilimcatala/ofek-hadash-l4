severity_why = "שנתו השלישית של בעל רישיון זמני היא שנת ניסיון לפי §6.5.2 ולא לפי §6.5.3, וההוראה המיוחדת מכריעה."
keys = ["chp_6__sec_6_5__hc_2__para_2/p1", "chp_6__sec_6_5__hc_2__para_3__subpara_a/p2", "chp_6__sec_6_5__hc_2__para_8__subpara_a"]
quote = "דינו של מורה בעל רישיון זמני ב - 3 השנים הראשונות כדין מורה בעל רישיון קבוע בתקופת ניסיונו · תקופת הניסיון של מורה חדש בעל רישיון הוראה בבית-ספר על-יסודי מסוים היא שנתיים, אלא אם כן הוארכה תקופת ניסיונו בשנה נוספת. · וכן מורה בניסיון בשנת עבודתו השלישית (מורה שתקופת ניסיונו הוארכה)"
title = "השנה השלישית של בעל רישיון זמני: שנת ניסיון לפי §6.5.2, אבל תקופת הניסיון של §6.5.3א מסתיימת אחרי שנתיים בלי הארכה"
body = """
§6.5.2 ("לגבי פיטורין מטעמים פדגוגיים או מטעמי משמעת, דינו של מורה בעל רישיון זמני…") שם את בעל הרישיון הזמני בשלוש שנותיו הראשונות במעמד של "מורה בעל רישיון קבוע בתקופת ניסיונו". אבל §6.5.3א ("תקופת הניסיון של מורה חדש…") קובע שתקופת הניסיון היא שנתיים, ושנה שלישית — רק כשהוארכה; ו־§6.5.8א מחיל את הליך הפיטורין של השנה השלישית רק על "מורה שתקופת ניסיונו הוארכה". מורה בעל רישיון קבוע בשנתו השלישית בלי הארכה אינו בתקופת ניסיון כלל.

בדיקה ממצה על שנים 1 עד 5, בהארכה ובלעדיה (`(2) makes a temporary-licence holder's third year a trial year that 3(a) ends after two`), מראה ששתי ההוראות נפרדות בדיוק בשנה השלישית של מי שתקופת ניסיונו לא הוארכה: לפי 2 הוא בתקופת ניסיון, ולפי 3א היא הסתיימה. הטקסט אינו אומר אם בעל רישיון זמני בשנה זו מפוטר בהליך של 8א, שדורש הארכה שלא ניתנה, או בהליך של מורה קבוע (סעיפים 9 ו־16), שלפי 2 חל עליו רק מהשנה הרביעית.
"""
reading = "§6.5.2, ההוראה המיוחדת לבעל רישיון זמני, גוברת: שלוש שנותיו הראשונות הן שנות ניסיון, ובשנה השלישית חל עליו הליך 8א כאילו הוארכה תקופת ניסיונו (`the trial runs to a third year`)."
