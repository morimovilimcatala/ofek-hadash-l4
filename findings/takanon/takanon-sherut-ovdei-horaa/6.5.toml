[[finding]]
id = "F-6.5-e"
kind = "ambiguity"
stage = "verification"
severity = "medium"
severity_why = "\"10 ימים בין ביקור לביקור\" נקרא לפי ימים או לפי שיעורים — הליך פיקוח ולא זכות כספית."
keys = ["chp_6__sec_6_5__hc_2__para_8__subpara_b"]
quote = "אין המפקחים רשאים לבקר ביותר מאשר ב - 2 שיעורים של מורה כנ\"ל באותו יום, ולקיים הפסקה של 10 ימים לפחות בין ביקור אחד למשנהו"
title = "\"10 ימים לפחות בין ביקור אחד למשנהו\": בין יום ביקור ליום ביקור, או בין שיעור לשיעור?"
body = """
§6.5.8ב ("המפקח הכולל יתאם את עבודתו עם מפקח שני…") מגביל את ביקורי המפקחים בשתי דרכים: לא יותר מ־2 שיעורים של המורה באותו יום, והפסקה של 10 ימים לפחות "בין ביקור אחד למשנהו". אם "ביקור" הוא כל שיעור שבו ביקרו, שני שיעורים באותו יום הם שני ביקורים ללא הפסקה כלל, וההגבלה הראשונה אינה אוסרת דבר. בדיקה ממצה על כל זוג ביקורים בימים 0 עד 20, של כל אחד מהמפקחים (`every two lessons visited are 10 days apart`), מראה שבקריאה זו שני ביקורים שמקיימים את ההפסקה לעולם אינם באותו יום.

אם "ביקור" הוא יום ביקור, שתי ההגבלות פועלות יחד, אבל התוצאה שונה: לוח של שני שיעורים ביום 0 ושניים ביום 10 (`8(b) is met by two lessons a day ten days apart, which a lesson-by-lesson gap forbids`) עומד בקריאה זו ונפסל בקריאה האחרת, שלפיה ארבעת הדו"חות דורשים 30 יום לפחות.
"""
