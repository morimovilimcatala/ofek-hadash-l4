# Errors in the LAW that encoding it in L4 exposed — MMS-415's model (see 1.7.toml for the field legend).

[[finding]]
id = "F-6.5-a"
kind = "gap"
stage = "writing"
keys = ["chp_6__sec_6_5__hc_2__para_7__subpara_a", "chp_6__sec_6_5__hc_2__para_7__subpara_b"]
quote = "ועבד פחות מחודשיים, אפשר יהיה להפסיק את עבודתו, לאחר הודעה מראש של 3 ימים · ועבד יותר מחודשיים, אפשר יהיה לפטרו, לאחר הודעה מראש של שבועיים"
title = "A substitute who has worked exactly two months is owed neither 3 days' notice nor two weeks'"
body = """
§6.5.7 sets the notice for ending the work of a substitute engaged for an undefined period (or a period defined only as a maximum): one who worked LESS than two months, 3 days' notice (a); one who worked MORE than two months, two weeks' (b). A substitute whose work has lasted exactly two months is in neither sub-clause, and the text does not say which notice is owed.
"""
reading = "Exactly two months is treated as (b): two weeks' notice. Sub-clause (a) is the exception for short engagements (\"less than\"), and the longer notice is the one that does not cut short a right."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.5.l4"
evidence = "`a substitute of exactly two months is under neither sub-clause`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-6.5-b"
kind = "gap"
stage = "writing"
keys = ["chp_6__sec_6_5__hc_2__para_15__subpara_d/p1", "chp_6__sec_6_5__hc_2__para_21__subpara_d__cls_4/p1"]
quote = "החלטת הוועדה המשותפת, שנתקבלה פה-אחד, היא סופית ואינה ניתנת לערעור."
title = "Only a unanimous decision of the joint committee is final — a majority decision's fate is not said"
body = """
§6.5.15(ד), and §6.5.21(ד)(4) in the same words for disciplinary cases, make a UNANIMOUS decision of the joint committee final and not open to appeal. The committee has members of three sides (the pedagogical secretariat, the owner, the representative organisation), so a majority decision is to be expected, and the text says nothing of it: whether it binds, whether it may be appealed, and to whom. Read a contrario, a majority decision is open to appeal before a body the section never names.
"""
reading = "None is adopted: the encoding marks only a unanimous decision as final and decides nothing about a majority decision."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.5.l4"
evidence = "`a majority decision of the joint committee is not declared final`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-6.5-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_6__sec_6_5__hc_2__para_12__subpara_a", "chp_6__sec_6_5__hc_2__para_13", "chp_6__sec_6_5__hc_2__para_8__subpara_c__cls_4"]
quote = "להציע לוועדת הפיקוח לפטר את המורה ... שהמורה יבוקר על-ידי 3 מפקחים · החליטה הוועדה מטעם הפיקוח (ראה סעיף 8ג (4)) ... להציע פיטורין של מורה כנ\"ל"
title = "Which committee decides to propose a permanent teacher's dismissal: the supervision committee, or the committee of three?"
body = """
For a permanent teacher whose work did not improve after a warning, §6.5.12(א) has the general supervisor propose the dismissal "to the supervision committee" — defined at the head of the section as all the supervisors of the division — after three supervisors have each visited two lessons. §6.5.13 then speaks of a decision of "the committee on behalf of the supervision (see section 8(c)(4))", which is the committee of three: the head of the division and two supervisors of the division "who did not visit the lessons of the teacher proposed for dismissal in the last year".

The two are different bodies. The supervision committee includes the three supervisors who visited under §6.5.12(א); the committee of three may not include them. The text does not say which of them decides.
"""
reading = "The committee of three of §6.5.8(c)(4) decides, as §6.5.13 names it expressly; the proposal of §6.5.12(א) is addressed to the supervision and reaches that committee."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.5.l4"
evidence = "`a visiting supervisor sits on one committee and not the other`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
