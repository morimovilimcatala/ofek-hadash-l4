# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-8.4-a"
kind = "contradiction"
stage = "writing"
keys = ["chp_8__sec_8_4__ssec_8_4_6__para_3__subpara_c", "chp_8__sec_8_4__ssec_8_4_6__para_3__subpara_d"]
quote = "העובר לתפקיד פיקוח יגרור 25% משנות הוותק שלו · או מניהול לפיקוח - אין הגבלה ומניין שנות הוותק יחושב במלואו"
title = "A principal moving into supervision carries 25% of the seniority by (c) and all of it by (d)"
body = """
Subsection (c) says a school principal (not a deputy or other role holder) who moves into supervision carries 25% of the years served as principal. Subsection (d) says that on a move "from management to supervision" there is no limit and the years are counted in full, subject only to the ceiling ("today 13 years").

Both subsections decide the same move. A principal of eight years carries two years by (c) and eight by (d), and the supervision allowance, which the table sets by seniority, differs accordingly.
"""
reading = "Subsection (c) governs a school principal: it is the clause that names the principal and excludes deputies, and its footnote cites the Treasury's later clarification of 6.5.91. Subsection (d) is read as governing the other moves it names."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/8.4.l4"
evidence = "`(c) and (d) give a principal moving into supervision different seniority`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"


[[finding]]
id = "F-8.4-b"
kind = "gap"
stage = "writing"
keys = ["chp_8__sec_8_4__ssec_8_4_6__para_3__subpara_c", "chp_8__sec_8_4__ssec_8_4_6__para_3__subpara_d"]
quote = "מנהל בית ספר (למעט סגן מנהל או בעל תפקיד אחר(4) העובר לתפקיד פיקוח · או מניהול לפיקוח - אין הגבלה ומניין שנות הוותק יחושב במלואו"
title = "A deputy principal moving into supervision: excluded from (c), and (d)'s \"from management\" does not say whether it covers him"
body = """
Subsection (c) gives a school principal moving into supervision 25% of his years as principal, and excludes in its own words a deputy principal or any other role holder. Subsection (d) counts in full, subject only to the ceiling, a move "from management to supervision" (מניהול לפיקוח), without saying whose management.

So the text does not say what a deputy principal (or another management-role holder) carries into supervision. If (d)'s "management" includes a deputy, a deputy of eight years carries all eight; if it means the principal's management — the move (c) names — he carries none, since (c) excludes him and no other subsection names him.
"""
reading = "A deputy or other role holder carries no management seniority into supervision: (d)'s \"from management\" is read as the principal's move, the one (c) names and excludes the deputy from. Under F-8.4-a's reading (c) then governs that move."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/8.4.l4"
evidence = "`whether a deputy moving from management carries seniority under (d) decides between none and all of it`"
depends_on = ["F-8.4-a"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"


[[finding]]
id = "F-8.4-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_8__sec_8_4__ssec_8_4_6__para_1", "chp_8__sec_8_4__ssec_8_4_6__para_2__subpara_a"]
quote = "יחושב באחוזים משכרו האישי בהתאם לטבלה · הסכום המתקבל מהכפלת השיעור המפורט בשכר המשולב האישי של המפקח"
title = "The supervision allowance is a percentage of \"his personal salary\" by paragraph 1 and of \"the personal combined salary\" by (a)"
body = """
Paragraph 1 of §8.4.6 computes the supervision allowance "as a percentage of his personal salary" (שכרו האישי) by the table; paragraph 2(a) says the allowance for a full position is the rate multiplied by "the personal combined salary of the supervisor" (השכר המשולב האישי).

The two names may be one base, or two: a personal salary that is not the combined salary would give a different allowance. The parallel paragraph of §8.3.6 names the personal combined salary in both places.
"""
reading = "One base, the personal combined salary: (a) states the multiplication the table is applied by, and §8.3.6's parallel wording names that salary in both places."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/8.4.l4"
evidence = "`paragraph 1 and (a) name the allowance's base in different words`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
