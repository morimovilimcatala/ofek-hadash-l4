§1.25.5 maternity 1 adds three weeks for every further child of one birth, so a mother of twins has 17 weeks. Paragraph 2א lets a mother hospitalised for more than two weeks extend the leave to the end of the stay, by at most 4 weeks, "provided the maternity leave does not exceed 16 weeks in all".

For a mother of twins (or more) the ceiling is already passed before any extension. The text does not say whether she gets no extension, whether the ceiling rises with the multiple-birth weeks, or whether it cuts the leave she has.
"""
reading = "The ceiling caps only the hospitalisation extension and never cuts the leave already given: a mother whose leave is 16 weeks or more gets no extension under 2א (she may still split the leave under 2ב)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.25.l4"
