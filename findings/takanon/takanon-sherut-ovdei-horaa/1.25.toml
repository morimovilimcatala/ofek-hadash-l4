title = "A final-year student's weekly study day: unpaid leave (first paragraph) or no unpaid leave in teaching hours (second)?"
body = """
§1.25.8's first paragraph lets employees in the final year of a degree ask the district manager for unpaid leave of one workday a week. The second, "in addition to the above", says a teacher will not receive unpaid leave in teaching hours, but will concentrate the work hours into five days, with the principal's written consent.

A teacher's workday is teaching hours. The first paragraph gives a day of unpaid leave; the second forbids unpaid leave in teaching hours and gives the day by concentrating them, with no loss of pay. For a teacher with six teaching hours on the day off, one reading deducts six hours' pay and the other none.
"""
reading = "The second paragraph governs teaching hours: the day is won by concentrating them with the principal's consent; unpaid leave covers only work hours on that day that are not teaching hours."
