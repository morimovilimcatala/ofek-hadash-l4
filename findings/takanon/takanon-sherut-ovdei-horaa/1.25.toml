body = """
Clause 4 of §1.25.3.1 gives up to six days a year for a parent's illness "provided the spouse ... did not take the absence under his entitlement under this law", dates "this law's amendment" from 13.2.2014, defines a sick parent "for this law", and twice conditions the entitlement on absence "under section 1 of the Law".

