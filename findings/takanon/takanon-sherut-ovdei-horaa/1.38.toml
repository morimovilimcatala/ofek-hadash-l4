[[finding]]
id = "F-1.38-a"
kind = "overlap"
stage = "writing"
keys = ["chp_1ב__sec_1_38__hc_2__para_a__subpara_1", "chp_1ב__sec_1_38__hc_2__para_a__subpara_2"]
quote = "לא יקויימו בשעות העבודה, אלא באישור מנהל המחלקה לתנאי שירות עובדי הוראה · הסמנכ\"ל לכא\"ב, תיאום ובקרה רשאי להתיר כינוס או אספת חירום"
title = "Two authorities, on two different tests, for an assembly in working hours"
body = """
§1.38(a)(1) lets an assembly of teaching employees who are state employees be held in working hours with the approval of the manager of the conditions-of-service department, on no stated test. §1.38(a)(2) lets the deputy director-general permit an emergency assembly in working hours, on a union's request, only if he is convinced it cannot practically be held outside working hours and that its urgency makes it necessary.

The text does not say whether (a)(2) is a further path or the only path for an emergency assembly. If the department manager approves an emergency assembly that (a)(2)'s tests would not allow, the assembly is lawful under (a)(1) and unlawful if (a)(2) governs emergencies alone.
"""
reading = "(a)(2) adds a path and does not narrow (a)(1): an assembly in working hours is lawful with either the department manager's approval or the deputy director-general's emergency permission."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.38.l4"
evidence = "`the two readings differ on an emergency assembly the department manager approved`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.38-b"
kind = "contradiction"
stage = "writing"
keys = ["chp_1ב__sec_1_38__hc_2__para_f/p2", "chp_1ב__sec_1_38__hc_2__para_f__subpara_2"]
quote = "תיחשב לו תקופת היעדרותו בתפקיד, והוא יהיה זכאי לקצובת אש\"ל ולהחזרת הוצאות הנסיעה · שהיעדרותו מן העבודה נזקפת על חשבון העבודה בהתאם להוראות סעיף זה ... לא יהיה זכאי להחזרת הוצאות אש\"ל ונסיעות"
title = "Per diem and travel for the employee invited as a representative: granted by (f), denied by its own note 2"
body = """
§1.38(f) counts the absence of a teaching employee invited by the district or the Ministry to a discussion of work matters, as the teachers' representative, as time on duty, and entitles the employee to a per diem and to travel expenses. Note 2 to the same paragraph says that an employee whose absence is counted on account of work "under the provisions of this section" is deemed to fill a state role during it and is therefore NOT entitled to per diem and travel.

The representative's absence is counted as work under this section, so note 2 denies exactly what (f) grants. The two cannot both apply to the invited representative.
"""
reading = "Note 2 governs the union absences of (c)–(e), which are union business counted on account of work; the representative invited by the employer under (f) keeps the per diem and travel (f) grants."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.38.l4"
evidence = "`note 2 and (f) disagree on the invited representative`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
