# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.42-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_42__ssec_2_1", "chp_1ב__sec_1_42__ssec_2_1__para_a", "chp_1ב__sec_1_42__ssec_2_1__para_b", "chp_1ב__sec_1_42__ssec_2_1__para_c"]
quote = "רשאים להגיש בקשה עובדי הוראה אלו: א. עובדי הוראה החברים בארגוני המורים … ב. עובדי הוראה קבועים במשרתם או עובדים שסיימו שלוש שנות עבודה לפחות והעובדים בהיקף של חצי משרה לפחות. ג. עובדי הוראה בפועל הנמצאים בחצי שנת שבתון"
title = "Who may apply for a tuition refund: three cumulative conditions, or three groups?"
body = """
§1.42 2.1 says that "these teaching employees" may apply and lists three: (א) union members working in an official or other covered institution that has accounting relations with the Ministry; (ב) tenured employees, or employees with three completed years, who work at least half a position; (ג) serving teachers on a half sabbatical year, whose refund is capped at 50%.

The list does not say whether an applicant must meet every item or any one of them. The readings differ: a union member in an official school, in her first year and not tenured, meets (א) and not (ב) — read as alternative groups she may apply, read as cumulative conditions she may not. Read as groups, (ב) would also admit a non-member working outside a covered institution, and (ג) a teacher on half sabbatical who meets neither.
"""
reading = "(א) and (ב) are cumulative — (ב)'s own phrasing (\"והעובדים בהיקף של חצי משרה לפחות\") reads as a further condition, not a separate population — and (ג) is the half-sabbatical case of an applicant who meets them, adding its 50% cap."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.42.l4"
evidence = "`2.1 read as alternatives and as cumulative conditions differ`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.42-b"
kind = "gap"
stage = "writing"
keys = ["chp_1ב__sec_1_42/p6", "chp_1ב__sec_1_42__ssec_2_2", "chp_1ב__sec_1_42__ssec_3"]
quote = "בכלל עובדי הוראה בפועל הרשאים לבקש השתתפות בהחזר שכר לימוד כלולים מדריכים מקצועיים מוסמכים ומורים למקצועות הטכנולוגיים הלומדים לתואר טכנאי והנדסאי · כמו כן על מגישי הבקשה למלא אחר אחד מתנאי הלימוד האלה"
title = "Technician and practical-engineer studies are admitted by 1.2 and meet no study condition or priority"
body = """
Clause 1.2 counts certified professional instructors and teachers of technological subjects "studying for a technician or practical-engineer qualification" among the serving teaching employees who may ask for a tuition refund. Clause 2.2 then requires every applicant to meet one of four study conditions — a first degree or teaching certificate, a course for teaching employees, a second or third degree, a thesis — and clause 3 gives priority only to academic degrees, teaching certificates and courses at training centres.

Technician and practical-engineer studies appear in none of them. Read with 2.2 and 3, the people 1.2 expressly admits for those studies can apply and can never be refunded for them; read as 1.2 means it, the studies need a study condition and a priority the text does not give.
"""
reading = "2.2 and 3 decide the request: technician and practical-engineer studies meet no study condition and have no priority, so they are refunded only through the exceptions committee (7.1)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.42.l4"
evidence = "`1.2 admits technician studies that 2.2 and 3 leave out`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

