title = "The 1.6 cap: three full years or twelve grant hours — separate caps, or one?"
body = """
Clause 1.6 caps a teacher's full refunds at 3 full study years or 12 grant hours. It does not say how a history of both counts. Read as two separate caps, a teacher refunded for 2 years who has also received 11 grant hours is below both and may still be refunded; read as one cap with 12 hours standing for 3 years, the same teacher has used 2/3 + 11/12 of it and may not.
"""
reading = "Two separate caps: the teacher is below the cap while fewer than 3 full years have been refunded and fewer than 12 grant hours received."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.42.l4"
evidence = "`1.6's caps read separately and as one cap differ`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

