title = "מי רשאי לבקש החזר שכר לימוד: שלושה תנאים מצטברים, או שלוש קבוצות?"
body = """
2.1 של §1.42 אומר ש"עובדי הוראה אלו" רשאים להגיש בקשה ומונה שלושה: (א) חברי ארגוני המורים העובדים במוסד רשמי או במוסד אחר הנכלל בהוראה, שיש לו קשרי התחשבנות עם המשרד; (ב) עובדים קבועים במשרתם, או עובדים שסיימו שלוש שנות עבודה, העובדים בהיקף של חצי משרה לפחות; (ג) עובדי הוראה בפועל הנמצאים בחצי שנת שבתון, שהחזר שכר הלימוד שלהם מוגבל ל־50%.

הרשימה אינה אומרת אם המבקש חייב לעמוד בכל הפריטים או באחד מהם. הקריאות נבדלות: חברת ארגון בבית ספר רשמי, בשנתה הראשונה ושאינה קבועה, עומדת ב־(א) ואינה עומדת ב־(ב) — בקריאה כקבוצות חלופיות היא רשאית להגיש בקשה, בקריאה כתנאים מצטברים אינה רשאית. בקריאה כקבוצות, (ב) היה מקבל גם מי שאינו חבר ארגון ועובד מחוץ למוסד הנכלל, ו־(ג) מורה בחצי שבתון שאינו עומד באף אחד מהם.
"""
reading = "(א) ו־(ב) מצטברים — הנוסח של (ב) עצמו (\"והעובדים בהיקף של חצי משרה לפחות\") נקרא כתנאי נוסף, לא כאוכלוסייה נפרדת — ו־(ג) הוא המקרה של חצי שבתון של מבקש העומד בהם, והוא מוסיף את מגבלת ה־50% שלו."
