title = "Does 7.1's proviso bind every approval beyond the criteria, or only its example?"
body = """
Clause 7.1 lets the joint committee approve tuition beyond the criteria, "for example" a second or third degree for one who already had full grants, "provided these studies of theirs" bear directly on classroom work and are not for a parallel academic degree. "These studies of theirs" can refer to the example alone or to any studies the committee approves. The readings differ for a request outside the example — say, a course with no link to classroom work: under the general reading the committee may not approve it, under the narrow one it may.
"""
reading = "The proviso binds every approval beyond the criteria: the committee approves only studies directly linked to classroom work and not for a parallel degree."
