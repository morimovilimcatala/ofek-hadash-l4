סעיף 1.2 מונה מדריכים מקצועיים מוסמכים ומורים למקצועות הטכנולוגיים "הלומדים לתואר טכנאי והנדסאי" בין עובדי ההוראה בפועל הרשאים לבקש החזר שכר לימוד. סעיף 2.2 מחייב אחר כך כל מבקש לעמוד באחד מארבעה תנאי לימוד — תואר ראשון או תעודת הוראה, קורס לעובדי הוראה, תואר שני או שלישי, עבודת תיזה — וסעיף 3 נותן קדימות רק לתארים אקדמיים, לתעודות הוראה ולקורסים במרכזי השתלמות.

לימודים לתואר טכנאי והנדסאי אינם מופיעים באף אחד מהם. בקריאה עם 2.2 ו־3, האנשים ש־1.2 מקבל במפורש בעבור לימודים אלה יכולים להגיש בקשה ולעולם אינם יכולים לקבל עליהם החזר; בקריאה כפי ש־1.2 מתכוון, הלימודים צריכים תנאי לימוד וקדימות שהטקסט אינו נותן.
"""
