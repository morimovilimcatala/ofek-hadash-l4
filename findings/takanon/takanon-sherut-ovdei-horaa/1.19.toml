quote = "תוספת זו מעודכנת במהלך תוקפו של ההסכם הקיבוצי במועד תשלום תוספות יוקר ובשיעוריהן. לאחר תום תקופת תוקפו של ההסכם הקיבוצי, תעודכן תוספת \"תגבור הוראה\" בשיעור תוספות השכר"
title = "The supplement's updating rule switches at the end of an agreement the section never names"
body = """
§1.19 ¶2 gives the supplement two updating rules: while "the collective agreement" is in force it moves only with the cost-of-living increments; after "the end of the term of the collective agreement" it moves with the general wage increases as well. The section's text never says which agreement that is, nor when its term ends — the agreement of 31.8.94 appears only in the source list (אסמכתא), which states no term.

The two rules give different amounts for the same event: a general wage increase moves the supplement after the term and leaves it unchanged during it. Without the date the term ends, the supplement for any month after a general wage increase cannot be computed from the section.
"""
reading = "Whether a month falls within the agreement's term is an input to the encoding, not decided by it. The natural candidate is the agreement of 31.8.94 named first in the source list, but its term would have to come from that agreement."
