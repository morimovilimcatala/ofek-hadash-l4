quote = "מבוטחים בחברת הביטוח \"ענבל\" מפני תביעות בגין עבֵרות פליליות · הנתבע בגין עבֵרה פלילית שיסוד מיסודותיה הוא מעשה רשלנות · כאמור לעיל"
title = "Insured against every criminal claim, but defended only where negligence is an element"
body = """
§1.32.1 says every teaching employee is insured with "Inbal" against claims for criminal offences, without limit. §1.32.2 then gives the insured employee a lawyer only when the offence charged has negligence among its elements and the act was done in the course of the duties.

For an employee charged with an offence of intent committed in the course of the duties, §1.32.1 says the employee is insured and §1.32.2 gives nothing: the text does not say what the insurance of §1.32.1 provides beyond §1.32.2's case. §1.32.3's "as aforesaid" (the right to turn to the Ministry's legal adviser) can be read with either clause, so its reach is unsettled too.
"""
reading = "§1.32.2 states the whole of what the insurance provides, and §1.32.3's \"as aforesaid\" refers to §1.32.2's case; §1.32.1 is read as the statement that the insurance exists."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.32.l4"
evidence = "`section 1.32.1 insures what section 1.32.2 does not defend`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
