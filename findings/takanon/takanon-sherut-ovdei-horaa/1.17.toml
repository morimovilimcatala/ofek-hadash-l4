title = "\"Sections 1 and 2 apply from 1 September 1981\" — which sections?"
body = """
§1.17.4(1)ד says "the application of sections 1 and 2 is from 1 September 1981". In §1.17.4 the numbered sections are 1 (general: the 10% supplement) and 2 (conditions: pension, unpaid leave, severance). Read so, the clause contradicts 1א, which pays the supplement "from 1.6.81", and 2ב, whose conclusions apply "from 1.6.1981": the supplement for June to August 1981 is owed under one and not the other.

Read instead as dating the clauses it closes — 1ב (paid leave, reserve duty, sickness) and 1ג (vacations), which share its source note (6) — it contradicts nothing. The text does not say which.
"""
reading = "1ד dates 1ב and 1ג (absences and vacations) from 1.9.81; the 10% supplement itself runs from 1.6.81 as 1א says."
