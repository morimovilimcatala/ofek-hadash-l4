[[finding]]
id = "F-1.17-a"
kind = "broken-reference"
stage = "writing"
keys = ["chp_1א___sec_1_17__ssec_1_17_1__hc_1__para_6", "chp_1א___sec_1_17__ssec_1_17_1__hc_1__para_3", "chp_1א___sec_1_17__ssec_1_17_2/p137"]
quote = "שעות השהייה האמורות, שיצורפו לשעות המשרה המלאה או החלקית של עובד ההוראה, כאמור בסעיפים 2 ו - 3 לעיל"
title = "\"Sections 2 and 3 above\" do not point at the full- and part-time clauses as the takanon numbers them"
body = """
§1.17.1(6) protects "the stay hours joined to the hours of the full or part-time position, as said in sections 2 and 3 above". In §1.17.1 as printed, the full position is clause 1, part-time is clause 2, and clause 3 is the clause that makes staying a duty. Read as written, the cross-reference names the part-time clause and the duty clause, and leaves out the full position it speaks of.

The numbers fit the agreement of 26.5.1981 itself, whose first clause is the scope clause the takanon prints separately as 1.17.0; the takanon renumbered the clauses and kept the agreement's cross-references. The procedure's "מפקחים המועסקים במשרה חלקית - יעבדו בהתאם להוראות סעיף 3 להסכם" uses the same numbering, explicitly "of the agreement".
"""
reading = "\"Sections 2 and 3\" are the agreement's numbers: the full-position clause (here 1) and the part-time clause (here 2). Clause 6's protection, and the part-time supervisors' rule, are encoded on that reading."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.17.l4"
evidence = "`\"clauses 2 and 3 above\" do not name the full and part-time clauses as printed`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.17-b"
kind = "ambiguity"
stage = "examples"
keys = ["chp_1א___sec_1_17__ssec_1_17_1__hc_2__para_3/p1", "chp_1א___sec_1_17__ssec_1_17_1__hc_2__para_3/p2", "chp_1א___sec_1_17__ssec_1_17_1__hc_1__para_2__subpara_b"]
quote = "מורה העובד מעל למשרה מלאה, ישהה בבית-הספר יחסית למשרתו. · לדוגמה: מורה בבית-ספר על-יסודי, שמשרתו המלאה היא 24 שעות, העובד 32-25 שעות - ישהה ½2 שעות."
title = "\"In proportion to the position\" above a full position has no formula, and the obvious ones miss the example"
body = """
For an employee above a full position the explanation says only that the stay is "in proportion to the position", and gives one example: a post-primary full position of 24 hours, worked at 25 to 32 hours, stays 2½ hours.

The text's own proportional rule, the part-time clause 2ב ("half an hour for every quarter position or part of it"), applied to the whole position gives 2½ hours from 25 to 30 hours but 3 hours at 31 and 32 — so it does not reproduce the example's band. A straight proportion of the two full-position hours (2 × 25/24 ≈ 2.08 … 2 × 32/24 ≈ 2.67) gives neither 2½ nor a constant over the band. The only reading found that reproduces the example for every hour in it applies the part-time rule to the part ABOVE the full position (25–32 hours is up to a third of a position over 24, which 2א sets at half an hour) and adds it to the full position's two hours.
"""
reading = "Above a full position: the full position's 2 hours, plus the part-time clause (2א–2ב) applied to the share above the full position. It agrees with the example at every hour from 25 to 32."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.17.l4"
evidence = "`\"in proportion to the position\" does not give the example under the part-time rule`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.17-c"
kind = "contradiction"
stage = "examples"
keys = ["chp_1א___sec_1_17__ssec_1_17_1__hc_2__para_4__subpara_a__cls_2", "chp_1א___sec_1_17__ssec_1_17_1__hc_2__para_4__subpara_b__cls_2/p3", "chp_1א___sec_1_17__ssec_1_17_1__hc_2__para_1__subpara_a/p3"]
quote = "עובד הוראה המלמד בכיתות ז' ומעלה, וזכאי להפחתת 2 ש\"ש, יהיה בסיס משרתו 26 ש\"ש · יחושב היקף משרתו לכל דבר ועניין כולל חישוב שעות שהייה לפי 19/22 או 19/20 (בהתאם לסיווגו לפי א או ב)"
title = "The position base of a grade-7-and-up teacher with a 2-hour reduction: 26 in the clause, 22 in the worked example"
body = """
Explanation 4 sets the position base after an age reduction "for every matter, including the stay hours": with a 2-hour reduction, 28 hours for grades 1–6 and kindergarten (4א.1) and 26 for grade 7 and up (4א.2); with a 4-hour reduction, 26 (4ב.1) and 20 (4ב.2).

Its own example — 16 hours plus 3 homeroom hours, with a reduction of 2 or 4 — computes the position as 19/22 under א and 19/20 under ב. 20 is 4ב.2's base, but 22 is neither of the bases 4א prints (28, 26). It is what explanation 1 gives — a post-primary full position of 24 hours (the base of explanation 3's example) less the 2 hours of the age-50 reduction — and it fits the 4-hour row (24 less 4 is 20), where 4א.2's 26 does not. For a 19-hour teacher the clause gives a position of 19/26, the example 19/22, and the stay hours computed from it differ.
"""
reading = "For grade 7 and up with a 2-hour reduction the base is 22, as the example, explanation 1's age rule and the 4-hour row all give; the other three rows as printed."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.17.l4"
evidence = "`4א.2 and the worked example give different bases for grade 7 and up`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.17-d"
kind = "undefined-term"
stage = "writing"
keys = ["chp_1א___sec_1_17__ssec_1_17_1__hc_2__para_5__subpara_a", "chp_1א___sec_1_17__ssec_1_17_1__hc_2__para_5__subpara_a__cls_1", "chp_1א___sec_1_17__ssec_1_17_1__hc_2__para_5__subpara_a__cls_2", "chp_1א___sec_1_17__ssec_1_17_1__hc_2__para_5__subpara_a__cls_3", "chp_1א___sec_1_17__ssec_1_17_1__hc_1__para_1"]
quote = "הגננת תקבע שתי שעות שהייה בשבוע · הגננת תישאר 15 דקות בסוף יום העבודה בכל אחד מימי השבוע · הגננת תקבע שעת שהייה בהמשך לאחד מימי העבודה בשעות אחה\"צ, ו - 3 פעמים בשבוע תישאר 15 דקות בסוף יום העבודה"
title = "The kindergarten teacher's three ways are one duty only if a \"stay hour\" is 45 minutes — which is never said"
body = """
Explanation 5א lets the kindergarten teacher choose one of three ways to keep her stay hours: two stay hours a week; fifteen minutes at the end of every working day; or one stay hour plus fifteen minutes on three days. §1.17.1(1) sets a full position's duty at two weekly hours.

With a 60-minute hour the three ways come to 120 minutes, 75 or 90 minutes (five or six working days), and 105 minutes — three different duties offered as alternatives to one. They agree with each other and with "two weekly hours" only if a stay hour is 45 minutes (90 = 6 × 15 = 45 + 3 × 15) and the kindergarten works six days. The section never says how long a stay hour is, nor how many days the week has.
"""
reading = "Each of the three ways, as chosen, discharges the kindergarten teacher's weekly stay duty; the length of a stay hour and the number of working days are inputs, not fixed by the encoding."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.17.l4"
evidence = "`the kindergarten ways are equal only with an undefined 45-minute hour`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

