The procedure's 2א.2 sends the scheduling of half stay hours, for part-time and above-full employees, to "chapter ד', section ה below". Nothing follows it in §1.17.2 but its source list, and the subsection has no chapter ד': its lettered parts are א to ז, where ד is the activity of groups of teaching employees and ה is the planning of work — neither about half-hours. The rule the reference needs is the scheduling clause of §1.17.1, 2ד (two half-hours joined into one hour every two weeks).
"""
reading = "The reference is read as meaning §1.17.1 2ד, the only clause of the section that schedules half stay hours."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.17.l4"
evidence = "`\"chapter ד' section ה\" names no part about half-hours`"
read_by = "Claude (L4 encoder)"
