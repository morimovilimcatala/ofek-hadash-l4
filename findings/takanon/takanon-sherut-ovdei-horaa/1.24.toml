# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-1.24-a"
kind = "gap"
stage = "writing"
keys = ["chp_1א___sec_1_24__ssec_1_24_1__para_1/p1", "chp_1א___sec_1_24__ssec_1_24_1__para_1/p2", "chp_1א___sec_1_24__ssec_1_24_1__para_2__subpara_a"]
quote = "משרה מלאה אחת של עובד הוראה - היא יחידת עבודה שהיקפה נקבע לפי מספר שעות ההוראה במסגרת החינוך שהוא מועסק בה ובהתאמה לגילו, למעט מדריך מקצועי ומדריך של\"ח"
title = "No full position is defined for a professional instructor or an SHL instructor, so their overtime and the 140% cap cannot be measured"
body = """
§1.24.1 defines work in overtime as work above one full position, and one full position by the teaching hours of the employee's education framework and age — "except a professional instructor and an SHL instructor". The section gives those two no other measure and points to none.

§1.24.2א caps "teaching employees in general" at 140% of a position, and §1.24.2ט prices an hour of overtime; both are measured against the full position. For the two excluded roles neither can be computed from the text: in the L4 their full position is NOTHING, and so are their overtime hours and their fraction of a position.
"""
reading = "The section leaves the instructors' full position to whatever other instrument fixes it; until one is encoded it is an input, and the L4 returns no overtime and no position fraction for them rather than borrowing the teachers' measure."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.24.l4"
evidence = "`the instructors' full position is undefined`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.24-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_24__ssec_1_24_1__para_2__subpara_h", "chp_1א___sec_1_24__ssec_1_24_1__para_2__subpara_h/p4", "chp_1א___sec_1_24__ssec_1_24_1__para_2__subpara_a"]
quote = "מנהל בית-ספר רשאי לעבוד שעות נוספות בניהול, עד להיקף של בסיס משרתו · אין להעסיק עובדי הוראה בכלל ומנהלים בפרט בהיקף העולה על % 140 משרה"
title = "A principal's \"overtime in management up to his position base\": up to a second whole position, or management hours up to the base?"
body = """
§1.24.2ח lets a principal "work overtime in management, up to the extent of his position base". Read as an allowance of OVERTIME of up to a whole base on top of the position, it lets a principal work two positions — 60 hours on a 30-hour base — where §1.24.2א forbids employing any teaching employee, "and principals in particular", above 140% of a position.

The clause's own example points the other way: it lists a "maximum number of management hours" of 30 for grades 1-6 and 24 for grades 7-12, with at least 6 teaching hours, which reads as the management hours in all running up to the base. The words and the example give different maxima, and only the second fits the cap.
"""
reading = "A principal's management hours in all run up to the position base of the stratum (the example's 30 and 24), teaching hours come on top, and the 140% cap of §1.24.2א binds the total."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.24.l4"
evidence = "`overtime up to a whole base breaks the 140% cap`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.24-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_24__ssec_1_24_2__para_2__subpara_d", "chp_1א___sec_1_24__ssec_1_24_2__para_2__subpara_c"]
quote = "התשלום המיוחד יהיה בגובה ההפרש שבין סכום השווה ל - % 1/3 8 מערך השכר ששולם לעובד ההוראה בגין עבודתו במשרה נוספת … לבין הסכום שהצטבר לזכותו מהפרשות המעסיק בקופת החיסכון של % 1/3 13"
title = "The special payment is 8⅓% of \"the value of the pay\" less a 13⅓% fund: measured nominally it is never positive, and a negative difference is not decided"
body = """
§1.24.2.2ד sets the special payment as the difference between 8⅓% of "the value of the pay paid" for additional-position work from 1.9.74 and the sum accrued from the employer's 13⅓% deposits, counting principal, interest, linkage and grants.

Wherever the employer deposited 13⅓% of the same pay, the fund holds at least 13⅓% of it, so 8⅓% of the pay as paid less the fund is negative: on the nominal reading the payment the clause creates is never owed. The text does not say whether "the value of the pay" is revalued (and if so, to which date and by which index — §1.24.2.2ו revalues its own pay to the date of payment, but says so expressly), nor what a negative difference means: no payment, or a sum owed back.
"""
reading = "\"The value of the pay\" is an input that the payer measures (the L4 does not choose an index); a difference of zero or less pays nothing and is never a debt of the employee."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.24.l4"
evidence = "`measured on the nominal pay, the special payment's difference is negative`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.24-d"
kind = "undefined-term"
stage = "writing"
keys = ["chp_1א___sec_1_24__ssec_1_24_2__para_2__subpara_b", "chp_1א___sec_1_24__ssec_1_24_2__para_3"]
quote = "ההסדר הקודם בדבר הפרשת המעסיק בשיעור של % 1/3 13 … (להלן - ההסדר הקיים) · אין בהסדר הקודם או בהסדר הקיים, כדי"
title = "\"The existing arrangement\" is defined as the previous (13⅓%) arrangement, yet the saving clause names the two as alternatives"
body = """
§1.24.2.2ב speaks of "the previous arrangement on the employer's deposit of 13⅓%" and defines it "(hereinafter — the existing arrangement)". §1.24.2.3 then says that nothing "in the previous arrangement or in the existing arrangement" limits the parity committees, changes the current pay rules, detracts from express rights or changes the parties' arguments.

Under §1.24.2.2ב's definition the two names denote one arrangement, and the saving clause names it twice; the arrangement the section actually sets up — the 18⅓% plan of §1.24.2.1 — is then saved by nothing. If "the existing arrangement" means the 18⅓% plan, the definition in §1.24.2.2ב is wrong.
"""
reading = "In §1.24.2.3 \"the existing arrangement\" is the 18⅓% plan, so the saving clause covers both plans; the definition in §1.24.2.2ב is read as naming the 13⅓% arrangement as it existed when the summary was signed."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.24.l4"
evidence = "`the two arrangements section 1.24.2.3 names are one under 1.24.2.2(b)'s definition`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
