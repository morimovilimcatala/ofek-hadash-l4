# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-8.1-a"
kind = "contradiction"
stage = "writing"
keys = ["chp_8__sec_8_1/p3", "chp_8__sec_8_1/p4", "chp_8__sec_8_1/p7", "chp_8__sec_8_1/p8"]
quote = "יחידת העבודה השבועית של מורה בתפקיד הדרכה היא בת 42.5 שעות · יום עבודה אחד- 1/6 המשרה (7 שעות ליום עבודה) · 5 ימי עבודה אחד - 5/5 המשרה, שהם משרה מלאה: 8.5 שעות ליום עבודה."
title = "The guidance schedule makes a day 1/6 of the position by one column and 7/42.5 of it by the other"
body = """
Section 8.1.1.1 sets the guide's weekly unit at 42.5 hours and then a schedule: one to four days of guidance are 1/6 to 4/6 of the position at 7 hours a day, and five days are the full position at 8.5 hours a day.

The two columns do not agree. Seven hours are 7/42.5 of the unit, about 16.5%, not 1/6 (16.7%); four days of 7 hours are 28 hours, 66% of the unit, against the 4/6 printed beside them; and the fifth day lifts the position from 4/6 to a whole, so that one day is worth 2/6. Since the guidance allowance is paid pro rata to the guidance position (8.1.6.1), the share chosen sets the pay.
"""
reading = "The fraction column decides the share of the position (1/6 a day for one to four days, the whole position for five); the hours column is read as the working day, not as the measure of the share."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/8.1.l4"
evidence = "`a day of guidance is 1/6 of the position by one column and 7/42.5 by the other`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-8.1-b"
kind = "contradiction"
stage = "writing"
keys = ["chp_8__sec_8_1__ssec_8_1_6_1__para_1/p2", "chp_8__sec_8_1__ssec_8_1_6_1__para_1/p3"]
quote = "גמול זה נשאר קבוע ואינו גדל עם ויתקו של עובד ההוראה בתפקידו · זכאי, מ - 1.9.89, לקבל גמול \"מורה-מדריך\" לפי השיעור הקבוע ל\"מדריך\". (ראה טבלה בסעיף 8.3.6)"
title = "A qualified guide's allowance is a fixed 43% by one sentence and the instructor's table rate by the next"
body = """
Section 8.1.6.1(1) sets the allowance of a teacher in a guidance role at 43% of the personal combined salary, pro rata to the position, fixed and not growing with seniority (from 1.1.01). The next sentence gives a guide with an academic degree, more than two years in the role and at least 1/6 of a position "the teacher-instructor allowance at the rate set for an instructor (see the table in section 8.3.6)" (from 1.9.89).

The instructor's rate comes from the table section 8.3.6 refers to, which sets percentages for instructors; the 43% is a single fixed figure. For every guide who meets the second sentence's conditions the two sentences give different allowances unless the table's rate happens to be 43%. Section 8.2.6, for its part, fixes the teacher-instructor allowance at 43%.
"""
reading = "The fixed 43% governs from 1.1.01 for every guide: the teacher-instructor allowance the second sentence names is the allowance section 8.2.6 fixes at 43%, and the reference to the instructor's table is read as the 1989 arrangement it replaced."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/8.1.l4"
evidence = "`the 43% and the instructor rate give a qualified guide different allowances`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-8.1-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_8__sec_8_1/p31", "chp_8__sec_8_1/p33", "chp_8__sec_8_1/p34"]
quote = "ולא תאושר העסקתו בתפקיד זה לתקופה העולה על 6 שנים · גם לתקופה שתעלה על שש שנים רצופות · לתקופה קצובה שלא תעלה על שש שנות לימוד רצופות"
title = "The six-year limit on a guidance role: six years in all, or six consecutive years?"
body = """
Section 8.1.2.2(a) bars employing a teacher in a guidance role "for a period exceeding 6 years". Subsection (b) lets the district manager or the guidance bureau's head allow employment "for a period exceeding six consecutive years", and (c) exempts from sections 13-15 of the appointments law a posting "not exceeding six consecutive school years".

A guide who served four years, left, and returned for four more has served eight years in all but never more than four consecutively. Under (a) read as a total the employment needs the exception of (b), whose own conditions speak only of consecutive years; read as consecutive, it is within the limit.
"""
reading = "The limit is on consecutive years, as (b) and (c), which state the exception and its consequence, both count them."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/8.1.l4"
evidence = "`the six-year cap gives two answers for a guide of broken service`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"


[[finding]]
id = "F-8.1-d"
kind = "gap"
stage = "writing"
keys = ["chp_8__sec_8_1__ssec_8_1_6_5__para_1"]
quote = "תמשיך לקבל בתפקידה החדש את גמול ריכוז גן-הילדים, וכן תהיה זכאית לקבל את ההפרש שבין גמול זה לבין גמול מורה בתפקיד הדרכה (להלן: ההפרש)"
title = "\"The difference\" between the kindergarten-coordination allowance and the guidance allowance, when the coordination allowance is the larger"
body = """
§8.1.6.5(1) lets a kindergarten teacher appointed to a guidance role keep her kindergarten-coordination allowance and also receive "the difference between this allowance and the allowance of a teacher in a guidance role". The text does not say which is subtracted from which.

Where the guidance allowance is the larger, the difference tops her up to it. Where the coordination allowance is the larger, the text gives no answer: the difference could be nothing, or the same gap the other way round, paid on top of an allowance that already exceeds the guidance allowance.
"""
reading = "The difference is the guidance allowance less the coordination allowance, and nothing when that is negative: the provision keeps her whole while she is paid the larger of the two."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/8.1.l4"
evidence = "`the guidance allowance can fall below the coordination allowance, where the text names no difference`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
