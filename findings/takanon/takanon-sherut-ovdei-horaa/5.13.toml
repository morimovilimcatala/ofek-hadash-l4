# Errors in the LAW that encoding it in L4 exposed — MMS-415's model (see 1.7.toml for the field legend).

[[finding]]
id = "F-5.13-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_5__sec_5_13__ssec_5_13_6__para_2"]
quote = "ישולם למחנכים בחטיבות-הביניים גמול חינוך בגובה % 10 מהשכר המשולב. ומתוספת תיגבור הוראה."
title = "The base of the 10% education allowance: the combined salary alone, or with the teaching-reinforcement supplement?"
body = """
§5.13.6.2 pays middle-school homeroom teachers, from 1.9.94, an education allowance of "10% of the combined salary." and then, after the full stop, "and of the teaching-reinforcement supplement."

The second phrase has no verb of its own. It reads either as a second base of the same 10% (10% of the combined salary and of the supplement), or as a fragment that adds nothing the first sentence does not already say. The two readings pay different allowances to every homeroom teacher who receives the supplement.
"""
reading = "The allowance is 10% of the combined salary plus 10% of the teaching-reinforcement supplement: the conjunction \"ו\" joins the supplement to the base, and a reading that drops the phrase would leave it without effect."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/5.13.l4"
evidence = "`the two readings of the allowance's base differ`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
