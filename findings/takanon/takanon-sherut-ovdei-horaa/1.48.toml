# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-1.48-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_48__hc_2/p1", "chp_1ב__sec_1_48__hc_2__para_1"]
quote = "תחולה: 1.12.85 (3) · מקבלים החל מיום 1.9.94 השתתפות בשכר דירה"
title = "Which clauses does \"in force from 1.12.85\" date?"
body = """
§1.48 ends its three clauses with a free-standing line, "תחולה: 1.12.85", footnoted to a parity-committee summary of 14.1.86. It does not say which clauses it dates. Clause 1 dates the rent participation from 1.9.94; clause 3 (travel refunds) and clause 2 (the training-fund exemption) carry no date of their own.

Read as dating the whole section, the line puts the rent participation in force almost nine years before clause 1 does — a teacher from the north in a Bedouin locality in January 1990 is entitled under one reading and not under the other. Read as dating clause 3 only, clause 2's start is not given anywhere.
"""
reading = "The line dates clause 3, the clause printed directly above it whose source is the 1986 parity-committee summary; clause 1 keeps its own 1.9.94. Clause 2 is left undated."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.48.l4"
evidence = "`the section's start date and 1's start date disagree`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.48-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_48__hc_2", "chp_1ב__sec_1_48__hc_2__para_3"]
quote = "עובד הוראה מהצפון המלמד ביישובי הבדווים בדרום · מורים ערביים שמקום מגוריהם הקבוע הינו בצפון הארץ ומלמדים בדרום הארץ"
title = "The travel refund reaches teachers in the south generally; the section is about the Bedouin localities"
body = """
§1.48 is titled, and its clause 1 is written, for teachers from the north who teach in the Bedouin localities of the south. Clause 3 grants four monthly round-trip refunds to "Arab teachers whose permanent residence is in the north and who teach in the south of the country" — with no reference to the Bedouin localities — and takes away their 25% global duty-travel supplement.

A northern Arab teacher in a southern town that is not a Bedouin locality is within clause 3's words and outside the section's subject. Whether he gets the refunds (and loses the supplement) depends on which governs.
"""
reading = "Clause 3's own words: every Arab teacher living in the north and teaching in the south."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.48.l4"
evidence = "`3 reaches a teacher the section's title does not`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
