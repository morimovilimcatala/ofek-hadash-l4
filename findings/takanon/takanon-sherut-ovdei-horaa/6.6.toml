body = """
§6.6.4 ב(2)(ד) ("תלמידים שהוכנו לבחינות הבגרות במספר שונה של יחידות לימוד…") נותן למורה את הגמול לפי המספר הגדול ביותר של יחידות הלימוד, והשורה שאחריו קובעת ש"גמול זה לא יעלה על 3 ש"ש + 2%". הטקסט אינו אומר אם "גמול זה" הוא הגמול של (ד) בלבד או גמול ההכנה של ב(2) כולו — הגמול לפי הטבלה של (א) והרצפה של (ב), "לא יפחת הגמול מ־2 ש"ש + 2%".

שתי הקריאות נפרדות בכל רמת יחידות שהטבלה מתמחרת ביותר מ־3 שעות: לפי האחת, כיתה שהוכנה ל־5 יחידות בלבד מקבלת את גמול הטבלה במלואו, ותלמידים ב־4 וב־5 יחידות — לכל היותר 3 שעות; לפי האחרת, שתיהן מוגבלות. הטבלה עצמה אינה בטקסט של הקורפוס, ולכן הבדיקה (`(d)'s cap binds pupils at mixed units and not a class at one level`) נעשית בטבלת דמה של שעה ליחידה.
"""
reading = "התקרה היא של (ד) בלבד: היא מודפסת מתחת לו ואחרי ההוראה על המספר הגדול ביותר של יחידות, וכיתה שהוכנה לרמה אחת מקבלת את גמול הטבלה כפי שהוא (`reward for pupils at different numbers of units`)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.6.l4"
