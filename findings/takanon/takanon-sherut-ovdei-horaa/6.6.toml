# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-6.6-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_6__sec_6_6__ssec_6_6_1__para_1__subpara_a"]
quote = "עובד הוראה אקדמאי שהוא בעל השכלה פדגוגית מלאה, או עובד הוראה שהוא בעל רישיון הוראה קבוע וקיבל אישור להדריך תלמיד בעבודת סיום מהמפקח על המוסד"
title = "Does the supervisor's approval to guide a final project bind the academic teacher too?"
body = """
§6.6.1.1א entitles to the final-project reward "an academic teaching employee with full pedagogical education, or a teaching employee who holds a permanent teaching licence and received approval to guide a pupil in a final project from the institution's supervisor".

The approval can be read as part of the second alternative only (a licence holder needs it, an academic with full pedagogical education does not), or as a condition on whoever guides. The readings differ for an academic teacher with full pedagogical education whom the supervisor has not approved: entitled on the first reading, not on the second.
"""
reading = "The approval belongs to the second alternative only: it sits inside the relative clause that describes the licence holder (\"שהוא בעל רישיון הוראה קבוע וקיבל אישור\")."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.6.l4"
evidence = "`the two readings of the approval decide differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-6.6-b"
kind = "gap"
stage = "writing"
keys = ["chp_6__sec_6_6__ssec_6_6_1__para_2/p6", "chp_6__sec_6_6__ssec_6_6_1__para_2/p10"]
quote = "שכר בודק עבודת סיום יהיה בהתאם למספר יחידות הלימוד הצמודות לעבודה לפי הפירוט להלן: · 2 יחידות לימוד = ערך שעה כפול 4"
title = "Checking a final project: no rate for 1 study unit, or for more than 5"
body = """
§6.6.1.2 pays the checker of a final project by the number of study units attached to it, in four rows: 5 units, 10 hour-values; 4 units, 8; 3 units, 6; 2 units, 4. A project attached to 1 study unit, or to more than 5, has no row, although §6.6.1.1א(2) ties the project to exemption from "one of the matriculation exams", which are not all of 2 to 5 units.

The text does not say whether such a project is paid, or at what rate.
"""
reading = "No rate is supplied: the encoding gives the four printed rows and no payment for any other number of units, rather than extending the rows' pattern (2 hour-values a unit)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.6.l4"
evidence = "`a 1-unit project has no row`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-6.6-c"
kind = "overlap"
stage = "writing"
keys = ["chp_6__sec_6_6__ssec_6_6_4/p21", "chp_6__sec_6_6__ssec_6_6_4/p22"]
quote = "בקבוצה המונה 9-6 תלמידים או יותר: הגמול יהיה בשיעור של % 50 · בקבוצה המונה 10 תלמידים או יותר: הגמול יהיה בשיעור של % 100"
title = "A preparation group of 10 or more pupils gets both 50% and 100%"
body = """
§6.6.4 ב(2)(ג) prices the preparation reward of a teacher who prepares one group of a divided class by the group's size: 1–5 pupils, 25%; "6–9 pupils or more", 50%; "10 pupils or more", 100% of the reward.

Because the second row reads "6–9 or more", every group of 10 or more falls in both the second and the third row, and the key gives it 50% and 100% at once. Written as the rows it prints, the key is not a function from group size to share.
"""
reading = "\"Or more\" in the second row adds nothing: 6 to 9 pupils get 50% and 10 or more the whole reward, the reading under which every row applies to some group and the third row is not emptied."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.6.l4"
evidence = "`a group of 12 gets 50% and 100%`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-6.6-d"
kind = "contradiction"
stage = "writing"
keys = ["chp_6__sec_6_6__ssec_6_6_4/p81", "chp_6__sec_6_6__ssec_6_6_4/p83", "chp_6__sec_6_6__ssec_6_6_4/p85", "chp_6__sec_6_6__ssec_6_6_4/p86"]
quote = "ערך שעה x 25 x משך הבחינה בשעות. · ערך שעה x 5 x משך הבחינה בשעות. · סך התשלומים לחברי הוועדה לא יעלה על-פי שניים מן התשלום ליו\"ר הוועדה"
title = "A questionnaire committee member is paid five times the chair, though all members together may not get twice the chair"
body = """
§6.6.4 item 2 pays a member of the committee that writes and proofs a questionnaire the hour value × 25 × the exam's duration, and the committee's chair the hour value × 5 × the duration. Note (2) caps the payments to all the members together at twice the payment to the chair, unless a member holds a doctorate; note (1) computes a member with a doctorate "as the chair".

With the rates as printed, one ordinary member alone receives 25 hour-values per exam hour against a cap of 10 for all the members, so the cap binds every committee without a doctor and cuts each member's printed rate; and a member with a doctorate, computed as the chair, receives a fifth of what an ordinary member does — while note (2) treats the doctorate as a reason to lift the cap. The rates and the notes cannot all be meant as printed.
"""
reading = "Every clause is applied as printed: members at 25, the chair at 5, a doctor at the chair's rate, and the members' total capped at twice the chair's unless a member has a doctorate."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.6.l4"
evidence = "`one member alone exceeds twice the chair`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
