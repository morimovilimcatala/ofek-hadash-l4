# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-9-a"
kind = "gap"
stage = "writing"
keys = ["chp_9__ssec_9_1__para_2/p1", "chp_9__ssec_9_1__para_2__subpara_c", "chp_9__ssec_9_1__para_2__subpara_d"]
quote = "היקף משרתו של עובד הוראה המלמד הנדסאים וטכנאים יהיה לפי תוארו כדלהלן · מורה בעל תואר ב\"א - 21 ש\"ש · מורה בעל תואר ב\"ס בהנדסה - 20 ש\"ש"
title = "The work unit by degree has no row for a first degree other than a BA or a BSc in engineering"
body = """
Section 9.1.2 sets the work unit "by the teacher's degree" in six rows: technician, practical engineer, BA, BSc in engineering, MA or MSc, doctorate. A teacher with a BSc in a field other than engineering (mathematics, computer science), a BEd, or the engineer's title that section 9.10.1(b) names, falls in no row, and the section gives that teacher no work unit.

Reading "ב\"א" generically as any first degree does not close the gap cleanly: a BSc in engineering would then match two rows, 21 hours and 20.
"""
reading = "A first degree the list does not name takes the BA row (21 hours, 20 after two years in classes 13-14); the engineer's title takes the row of the BSc in engineering."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/9.l4"
evidence = "`a BSc outside engineering has no row`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-9-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_9__ssec_9_1__para_3/p1"]
quote = "משך שנת הלימודים יהיה 30 שבועות עבודה נטו, בתוספת 5 שבועות של בחינות בבית ספר לטכנאים ולהנדסאים למבוגרים."
title = "Do the 30 weeks of the school year bind every programme, or only the adult schools?"
body = """
Section 9.1.3 sets the school year at "30 net working weeks, plus 5 weeks of examinations in a school for technicians and practical engineers for adults". The closing words can qualify the whole sentence — the rule is about adult schools only, and the chapter leaves the year of classes 13-14 in other institutions unset — or only the 5 examination weeks, so that every programme has 30 weeks and only adult schools add 5.

The readings differ for any programme that is not an adult school: 30 weeks, or no rule at all.
"""
reading = "30 net weeks for every programme the chapter covers, and the 5 examination weeks in adult schools only."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/9.l4"
evidence = "`the two readings of 9.1.3 differ for a programme that is not an adult school`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
