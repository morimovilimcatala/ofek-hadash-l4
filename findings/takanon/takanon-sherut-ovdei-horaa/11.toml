# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-11-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_11__ssec_11_6_1__para_1/p2", "chp_11__ssec_11_6_1__para_2/p4"]
quote = "מורים המקבלים את שכרם לפי דרגה אקדמית מ\"א והמלמדים בכיתות על-תיכוניות · המקבלים שכרם לפי דרגה אקדמית מ\"א לפחות"
title = "The seminar supplement goes to teachers paid \"by the MA grade\": the MA grade only, or at least it?"
body = """
Section 11.6.1(1) grants the seminar supplement to teachers "paid by the MA academic grade" who teach at least 6 weekly hours in post-secondary classes of a training institution. Paragraph 2(a)(1), extending the supplement from 1.4.1976 to teachers with fewer hours, describes them as paid by "the MA grade AT LEAST".

Paragraph 1 can be read as the MA grade only, so that a teacher paid by the doctorate grade had no supplement until 1976 and gained one only by the later paragraph's wording, or as at least the MA grade throughout. The readings differ for every doctorate-grade teacher from 1.4.1965 to 1.4.1976.
"""
reading = "At least the MA grade throughout: paragraph 2(a)(1) extends the hours condition only, and its \"at least\" is read as restating, not widening, the grade condition."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/11.l4"
evidence = "`a doctorate-grade teacher's entitlement before 1.4.1976 turns on the reading of \"MA\"`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-11-b"
kind = "undefined-term"
stage = "writing"
keys = ["chp_11__ssec_11_6_3__para_2__subpara_a", "chp_11__ssec_11_6_3__para_2__subpara_b", "chp_11__ssec_11_6_3__para_2__subpara_c"]
quote = "א. הגדרות: · \"מסלול\" - הרובד החינוכי אליו מכשיר עצמו הלומד · ב. מרַכז מגמה או מסלול, יהא זכאי החל מ - 1.9.89 ל\"גמול ריכוז\" על-פי המפתח הבא. · ג. מרכז מקצוע בבית-מדרש למו\"ג או במכללה, יקבל \"גמול ריכוז\" מקצוע לפי הטבלה הבאה."
title = "\"Major\" and \"subject\" are paid by different scales, and only \"track\" is defined"
body = """
Section 11.6.3.2 pays the coordinator of a track or a major (מגמה) by one key (b) and the coordinator of a subject (מקצוע) by another table (c). Subparagraph (a), headed "definitions", defines "track" alone.

Whether a coordinated unit is a major or a subject decides which scale pays its coordinator, and the text gives no test for telling them apart.
"""
reading = "The coordinator's post is an input: the file takes as given whether the post is a track or major coordinator or a subject coordinator, and pays it by the corresponding scale."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/11.l4"
evidence = "`\"major\" and \"subject\" are paid apart but not defined`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-11-c"
kind = "gap"
stage = "writing"
keys = ["chp_11__ssec_11_6_3__para_2__subpara_e"]
quote = "ה. עובד הוראה יוכל לקבל רק גמול ריכוז אחד."
title = "A teacher may receive only one concentration allowance, and the text does not say which"
body = """
Section 11.6.3 sets several concentration allowances: 8% of the combined salary for guidance, studies and students coordinators (1), a key for track and major coordinators (2b) and a table for subject coordinators (2c). Subparagraph 2(e) allows a teacher only one.

A teacher who holds two of these posts is left with two allowances of different amounts and no rule saying which is paid — the higher, the first appointed, or the teacher's choice.
"""
reading = "The higher of the allowances the teacher's posts carry is paid."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/11.l4"
evidence = "`a teacher with two posts has two different allowances to choose from`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-11-d"
kind = "gap"
stage = "writing"
keys = ["chp_11__ssec_11_6_5__para_1/p1", "chp_11__ssec_11_9__para_3"]
quote = "כש - 25 תלמידים נחשבים כיתה · כש - 4 שעות ניהול נחשבות, לצורך זה, כיתה"
title = "Students and management hours are converted into classes with nothing said about a remainder"
body = """
The management allowance is set by number of classes. In seminaries and colleges, section 11.6.5.1 counts "25 students as a class"; for the in-service training coordinator, section 11.9.3 counts "4 management hours as a class".

Neither says how a remainder counts. A seminary of 60 students has two classes if only whole groups of 25 count, three if a remainder forms a class, and 2.4 if the count is proportional — and the allowance table, read by whole classes, gives a different rate for each.
"""
reading = "A remainder counts as one more class (60 students are three classes; 6 management hours are two), for both conversions."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/11.l4"
evidence = "`the whole-class readings of \"25 students count as a class\" differ for 60 students`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-11-e"
kind = "ambiguity"
stage = "writing"
keys = ["chp_11__ssec_11_6_5__para_2__subpara_c", "chp_11__ssec_11_6_5__para_2__subpara_c/p2", "chp_11__ssec_11_6_5__para_2__subpara_a"]
quote = "ואלו המכללות שאליהן מתייחסים סעיפים א ו-ב · מוסדות שבהיתר: מכללת ליפשיץ, מכללה להכשרת מורים ערבים בחיפה, מכללת אורות ומכללת תלפיות (תל-אביב)."
title = "Are the institutions \"on permit\" among the academic colleges that take the college allowance?"
body = """
Section 11.6.5.2(a) gives the academic-college management allowance, and (b) the right to deputies per 250 students, to the colleges "listed in (c)". Subparagraph (c) lists nine colleges as "the colleges (a) and (b) refer to", and then, in a separate line, four "institutions on permit".

The permit institutions may be a further part of the list, or a separate category the section names without giving it the allowance. For the principal and deputies of Lifshitz, the Arab teacher-training college in Haifa, Orot and Talpiot the readings give the academic-college table or the seminary rate, and up to five deputies or none.
"""
reading = "The institutions on permit are not among the listed colleges: (c) introduces only the first list as the one (a) and (b) refer to, and (a) also requires recognition to award the BEd."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/11.l4"
evidence = "`the two readings of the permit institutions differ for one of them`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-11-f"
kind = "ambiguity"
stage = "writing"
keys = ["chp_11__ssec_11_10/p12", "chp_11__ssec_11_10/p13"]
quote = "בעל ניסיון בהוראה של שלוש שנים לפחות במערכת החינוך: בגני ילדים או · בבתי-ספר להשכלה גבוהה."
title = "An internship coordinator needs teaching experience \"in kindergartens or in schools of higher education\""
body = """
Section 11.10.2 requires an internship coordinator to have three years of teaching experience "in the education system: in kindergartens or / in schools of higher education", printed over two lines (as in the ministry's own page). "Schools of higher education" is not a category of the education system; the words read either as a run-together list — kindergartens, schools, or higher education — or literally, so that school teaching, the commonest experience, does not count.

For a candidate whose three years were in a school the readings decide eligibility.
"""
reading = "Experience in kindergartens, in schools or in higher education counts, each toward the three years."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/11.l4"
evidence = "`the readings of \"schools of higher education\" differ for a schoolteacher`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
