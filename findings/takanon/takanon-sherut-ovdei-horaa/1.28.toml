# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.28-a"
kind = "broken-reference"
stage = "writing"
keys = ["chp_1ב__sec_1_28__ssec_1_28_2_3/p88", "chp_1ב__sec_1_28__ssec_1_28_2_2/p91", "chp_1ב__sec_1_28__ssec_1_28_2_3/p139"]
quote = "4. הוראות סעיפים 17א, 18 ו - 19 לחוק יחולו, בשינויים המחויבים, על תשלום פיצוי הלנת פיצויי פיטורין · חוק פיצויי פיטורין, תשכ\"ג - 1963 (להלן - \"החוק\" )"
title = "\"Sections 17א, 18 and 19 of the law\" point into the Severance Pay Law, but the clause comes from the Wage Protection Law"
body = """
1.28.2.2's source note 16 names the Severance Pay Law 1963 "the law" (החוק), and 1.28.2.3 uses the word that way throughout: its source notes cite "section 12 of the law", "section 14 of the law" and so on, all of them sections of the Severance Pay Law.

The rules on the date for paying severance and on late payment are taken from another statute — their own source note (59) is section 20 of the Wage Protection Law. Payment item 4 then applies "the provisions of sections 17א, 18 and 19 of the law" to the late-payment compensation, "as if it were compensation for late wages", and lets the regional court reduce or cancel it "as in section 18". Those are the Wage Protection Law's sections on late-wage compensation and the court's power over it; read with the section's own definition, "the law" sends the reader to the Severance Pay Law, where those sections say something else.
"""
reading = "\"The law\" in payment item 4 is read as the Wage Protection Law, the statute the clause is taken from: the court's power to reduce or cancel the compensation is that law's section 18."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.28.l4"
evidence = "`\"sections 17א, 18 and 19 of the law\" point into a law the clause is not from`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.28-b"
kind = "broken-reference"
stage = "writing"
keys = ["chp_1ב__sec_1_28__ssec_1_28_2_3/p43"]
quote = "ה. הפסקה כאמור בחוק העודפת על 7 ימים לשנת עבודה."
title = "Item 12(ה) leaves out of the count \"a break as in the law\" without saying which break"
body = """
1.28.2.3 item 12 lists the periods not counted towards the amount of severance. (א)-(ד) each name their period: military service, partial service over 120 days, unpaid leave over 14 days a year, accident or illness beyond the paid days. (ה) then leaves out "a break as in the law, beyond 7 days a work year" and names none.

The law's list of breaks that do not interrupt continuity (1.28.2.2 item 2) has ten, and several of them are not dealt with by (א)-(ד): the weekly rest and holidays, annual leave, paid leave, a strike or lockout, days of mourning, a temporary break, emergency-service training. Which of them loses every day beyond the seventh changes the amount of severance; applied to annual leave or the weekly rest it would cut almost every year of service.
"""
reading = "(ה) is read as the temporary break of 1.28.2.2 item 2(ט), the only break the law's list itself calls a \"break\" (הפסקה); the days of such a break beyond 7 in a work year are not counted. It awaits the text of the regulation (regulation 10, note 36) it was taken from."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.28.l4"
evidence = "`\"a break as in the law\" can be more than one break`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.28-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_28__ssec_1_28_2_2/p37", "chp_1ב__sec_1_28__ssec_1_28_2_2/p38", "chp_1ב__sec_1_28__ssec_1_28_2_2/p39"]
quote = "1. אם העובד גר לפחות 6 חודשים ביישוב חקלאי או ביישוב באזור פיתוח שאליו העתיק את מגוריו. · 2. אם ההתפטרות באה עקב כוונה להתיישב ביישוב חקלאי או באזור פיתוח."
title = "A move to an agricultural or development town: are its two conditions both required, or either one?"
body = """
1.28.2.2, resignation 3(ב): a resignation because of a move to an agricultural town, or to a development town, counts as dismissal — followed by two numbered conditions, "1. if the employee has lived at least 6 months in the town… 2. if the resignation came of an intention to settle in it". Nothing joins them: no "and", no "or".

Read as cumulative, an employee who resigned to settle and has lived there less than six months is not yet entitled; read as alternatives, she is. The neighbouring grounds do not settle it: where they mean both conditions they say so in one sentence — (א) joins its distance conditions with "and", (ג)(2) and (ג)(5) attach their residence period with "and" or "provided that".
"""
reading = "Both conditions are required: the employee resigned meaning to settle there, and has lived there six months. The numbered list hangs off one ground, and the residence period is otherwise a dead letter."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.28.l4"
evidence = "`the readings of the move to an agricultural or development town differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.28-d"
kind = "undefined-term"
stage = "writing"
keys = ["chp_1ב__sec_1_28__ssec_1_28_2_1/p55"]
quote = "ויעיר הערותיו לגבי עצם החלטתו על הקיצור"
title = "\"His decision on the shortening\": no shortening is provided for"
body = """
1.28.2.1ח(2) says there is no legal bar, and no legal duty, to employ again someone who left with severance pay once three months have passed since the dismissal. The request goes on a form through the district manager, "who will give his opinion on it and comment on his very decision on the shortening".

Nothing in the clause, or in 1.28.2.1, provides for a shortening or a decision on one. It may mean the district manager's original decision to cut the post (קיצור as a cutback, the usual ground for such severance), or a decision to shorten the three-month wait — and on the second reading a request inside the three months is one the clause contemplates.
"""
reading = "\"The shortening\" is read as the decision that ended the service (the cut that gave rise to the severance): the district manager comments on the request and on that decision. The three months are kept as the text states them."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.28.l4"
evidence = "`\"the shortening\" is undefined in 1.28.2.1ח`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.28-e"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_28__ssec_1_28_2_2/p77", "chp_1ב__sec_1_28__ssec_1_28_2_2/p78"]
quote = "ולפי השיעור הרגיל של 1/12 מן המשכורת המשולבת החודשית בעד כל חודש וחלקי חודש של תקופת שירותו העודפת כאמור, ועל בסיס המשכורת הקובעת של העובד ערב פרישתו"
title = "Severance for service beyond 35 years: on the combined salary or on the determining salary?"
body = """
1.28.2.2 item 8(3) pays severance for the service beyond 35 years at "1/12 of the combined monthly salary for every month and part of a month" of it — and in the same sentence "on the basis of the employee's determining salary on the eve of retirement". 8(4) repeats the determining salary alone.

The two are different sums: the determining salary for pension includes the additions recognised as permanent for pension (1.28.2.3 item 2 lists them), which the combined salary does not. The sentence names both as its base, and the amount depends on which.
"""
reading = "The determining salary, which 8(3) names as the basis and 8(4) names alone; \"1/12 of the combined monthly salary\" is read as stating the rate (a month's pay per year)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.28.l4"
evidence = "`the two bases of 8(3) give different sums`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
