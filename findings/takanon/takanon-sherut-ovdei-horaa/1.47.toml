title = "A doctor who also holds a second degree: 10% of the combined salary, or 5% + 10%?"
body = """
§1.47 1 gives teaching employees "holding a second and third degree" an allowance of 5% of the combined salary "for a second degree and" 10% "for a third degree". It does not say whether the rates are alternatives — the rate of the highest degree held — or add up for an employee who holds both, as nearly every doctor does.

The readings differ by half the allowance again: 10% or 15% of the combined salary, on every payslip, counted as salary for pension and severance (2).
"""
