[[finding]]
id = "F-14-d"
kind = "ambiguity"
stage = "verification"
severity = "medium"
severity_why = "גמול שהועלה בשל כיתות שנוספו יורד או נשמר כשהן נסגרות, לפי ממה נמדדת ההקטנה; המוסכמה `amounts.highest` מכריעה בקריאה."
keys = ["chp_14__ssec_14_10_6__para_4"]
quote = "גמול הניהול של מנהל מוסד לחינוך מבוגרים נקבע עם כניסת המנהל לעבודה, בתחילת שנת הלימודים או פתיחת המחזור. אם מספר הכיתות גדל, יפוצה המנהל בהתאם. אם מספר הכיתות קטן, לא יופחת גמול הניהול עד תום שנת הלימודים."
title = "כיתות שנוספו במהלך השנה ואחר כך נסגרו: האם הגמול שהועלה יורד איתן?"
body = """
סעיף 14.10.6(4) ("גמול הניהול של מנהל מוסד לחינוך מבוגרים נקבע עם כניסת המנהל לעבודה…") קובע את הגמול עם כניסת המנהל לעבודה, מפצה אותו אם מספר הכיתות גדל, וקובע ש"אם מספר הכיתות קטן, לא יופחת גמול הניהול עד תום שנת הלימודים".

הטקסט אינו אומר ממה נמדדת ההקטנה. אם מנקודת הכניסה, מוסד שנפתח בשמונה כיתות, גדל לעשר וחזר לתשע מקבל גמול של תשע כיתות: הגמול שהועלה ירד. אם "לא יופחת" חל על הגמול כפי שהוא, אחרי הפיצוי, הגמול נשאר של עשר. בדיקה על כל מספר כיתות בתחילת השנה, בשיאה ועכשיו (0 עד 12, על טבלה העולה עם מספר הכיתות) מראה ששתי הקריאות נפרדות בדיוק כשהשיא עלה גם על מספר הכיתות בתחילת השנה וגם על מספרן עכשיו.
"""
reading = "ההקטנה נמדדת מנקודת הכניסה, שבה הטקסט קובע את הגמול: המנהל מקבל לפי הגדול מבין מספר הכיתות בתחילת השנה ומספרן עכשיו (`the rate paid during the year`)."
convention = "amounts.highest"
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/14.l4"
evidence = "`a centre grown from 8 classes to 10 and back to 9 is paid for 9 on one reading and 10 on the other`"
