title = "A Tehila centre's principal is paid as an \"evening ulpanit\" principal, an allowance no clause sets"
body = """
Section 14.10.6.3 gives the principal of a Tehila centre "the management allowance set for the principal of an evening ulpanit". The section sets allowances for the principal of an ulpan for teaching Hebrew (14.10.6.1, by the primary-school rates) and of an ulpanit for teaching Hebrew (14.10.6.2, by its own table). No clause sets one for an "evening ulpanit", and the term is not defined.

Read as the ulpanit of 14.10.6.2 the reference works; read as a distinct kind of institution it points at nothing.
"""
reading = "The \"evening ulpanit\" is read as the ulpanit for teaching Hebrew of section 14.10.6.2, so a Tehila centre's principal takes the ulpanit table rate."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/14.l4"
