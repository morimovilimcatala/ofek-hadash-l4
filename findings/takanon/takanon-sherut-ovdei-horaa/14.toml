#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-14-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_14__ssec_14_2__para_1/p1"]
quote = "כל עובד חייב בהכשרה מוקדמת של כ-24 שעות לפני היכנסו לעבודה, וחלה עליו חובת השתלמות של כ-80 שעות במשך השנה"
title = "Tehila's training duties are set in \"about\" 24 and \"about\" 80 hours"
body = """
Section 14.2.1 puts two duties on every Tehila teacher: pre-service training of "about 24 hours" before starting work, and in-service training of "about 80 hours" during the year. A duty stated as an approximate figure has no point at which it is met or breached: 22 hours may or may not discharge "about 24", and 75 may or may not discharge "about 80".

The section attaches no consequence that would settle the tolerance, and none is given elsewhere in the chapter.
"""
reading = "Each figure is read as its stated number: at least 24 hours before starting and at least 80 hours during the year."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/14.l4"
evidence = "`both training duties are printed as approximate figures`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

