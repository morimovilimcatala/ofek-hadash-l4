title = "A department-owners dispute is decided by two people jointly, with nothing said if they disagree"
body = """
Section 14.10.2.1(a) resolves a disagreement between the adult-education department and the owners over a Tehila principal's appointment by giving the decision to two people together: the head of the adult-education department and the deputy director-general of the Centre of Local Government.

Each of the two stands for one side of the dispute. When they disagree, the text names no casting vote, no order of precedence and no further forum, so the dispute it set out to resolve is left undecided.
"""
reading = "The file encodes the joint decision as written and returns \"no decision\" when the two disagree; it adopts no tie-break, since the text gives none."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/14.l4"
evidence = "`the two deciders of a dispute can deadlock`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

