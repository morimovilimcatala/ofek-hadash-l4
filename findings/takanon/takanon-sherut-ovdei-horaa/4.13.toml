quote = "תנאי השירות של המורים במרכזים הטיפוליים יהיו כמקובל וכמוסכם בחינוך המיוחד: מורה בעל הסמכה לחינוך המיוחד, יהיה זכאי לגמול חינוך מיוחד בגובה % 9 מורה שאין לו הסמכה כנ\"ל, יהיה זכאי לגמול בגובה % 5.5."
title = "מורי המרכזים הטיפוליים מקבלים את התנאים המקובלים בחינוך המיוחד — ושיעורים של 9% ו־5.5% שאינם של החינוך המיוחד"
body = """
§4.13.1 קובע שתנאי השירות של המורים במרכזים הטיפוליים "יהיו כמקובל וכמוסכם בחינוך המיוחד", ואחרי הנקודתיים נותן להם 9% (מוסמך לחינוך מיוחד) ו־5.5% (לא מוסמך).

מה שהחינוך המיוחד משלם כמקובל הוא §4.6: 14% ו־8.5% למורים בגן, בבית־ספר או במוסד לחינוך מיוחד (§4.6.2(א), §4.6.3(א), כפי שתוקנו בהסכם מיום 18.12.01), ו־9% ו־5.5% רק למורי שילוב במסגרות של החינוך הרגיל (§4.6.2(ב), §4.6.3(ב)). מרכז טיפולי הוא מסגרת של חינוך מיוחד ולא של חינוך רגיל, ולכן המילים הכלליות של הסעיף מפנות ל־14% ו־8.5% והמספרים שלו אומרים 9% ו־5.5%.
"""
