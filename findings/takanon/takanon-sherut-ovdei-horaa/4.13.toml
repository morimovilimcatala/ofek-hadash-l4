# Errors in the LAW that encoding it in L4 exposed — MMS-415's model (see 1.7.toml for the field legend).

[[finding]]
id = "F-4.13-a"
kind = "contradiction"
stage = "writing"
keys = ["chp_4__sec_4_13__hc_2__para_1/p1", "chp_4__sec_4_13__hc_2__para_1/p2"]
quote = "תנאי השירות של המורים במרכזים הטיפוליים יהיו כמקובל וכמוסכם בחינוך המיוחד: מורה בעל הסמכה לחינוך המיוחד, יהיה זכאי לגמול חינוך מיוחד בגובה % 9 מורה שאין לו הסמכה כנ\"ל, יהיה זכאי לגמול בגובה % 5.5."
title = "Treatment-centre teachers get special education's customary terms — and rates of 9% and 5.5% that are not special education's"
body = """
§4.13.1 says the terms of service of treatment-centre teachers "will be as customary and agreed in special education", and after the colon gives them 9% (certified for special education) and 5.5% (uncertified).

What special education customarily pays is §4.6: 14% and 8.5% to teachers in a special-education kindergarten, school or institution (§4.6.2(a), §4.6.3(a), as amended by the agreement of 18.12.01), and 9% and 5.5% only to integration teachers in regular-education frameworks (§4.6.2(b), §4.6.3(b)). A treatment centre is a special-education framework, not a regular-education one, so the clause's general words point to 14% and 8.5% and its figures say 9% and 5.5%.
"""
reading = "The figures §4.13.1 prints govern treatment-centre teachers (9% and 5.5%): they are the clause's own and specific to treatment centres, and the section was updated on 5.11.02, after the 18.12.01 agreement."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/4.13.l4"
evidence = "`the treatment-centre rate is not special education's customary rate`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-4.13-b"
kind = "gap"
stage = "writing"
keys = ["chp_4__sec_4_13__hc_2__para_3/p1"]
quote = "כל 25 שעות שבועיות המוענקות למרכז טיפולי על-ידי הגף לחינוך מיוחד תוכרנה ככיתה."
title = "Weekly hours that are not a multiple of 25 make no whole number of classes, and the text does not say how to count them"
body = """
§4.13.3 reckons a treatment-centre manager's management hours and allowance from the centre's classes, counting every 25 weekly hours the special-education branch grants as a class. It does not say what a remainder is: 60 weekly hours are two classes and ten hours. The management allowance is set by a number of classes, so the remainder must be dropped, rounded or counted as a fraction, and each gives a different allowance. (§3.19.7, for a similar formula, says expressly "round up".)
"""
reading = "Only whole blocks of 25 weekly hours count as classes; a remainder makes no class. It is the literal reading of \"every 25 weekly hours\"."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/4.13.l4"
evidence = "`60 weekly hours are not a whole number of classes`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-4.13-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_4__sec_4_13__hc_2__para_3/p2"]
quote = "אולם גמול הניהול במרכז טיפולי לא יעלה על גמול הניהול ל - 6 כיתות. מנהלי בית-ספר המאכלס בין כותלי בית-הספר גם מרכז טיפולי ומשמש בנוסף לתפקידו כמנהל בית-הספר גם כמנהל המרכז הטיפולי, יצורפו הכיתות שלו כמנהל המרכז לכיתות בית-הספר וגמול הניהול יחושב לפיו סך כל הכיתות ב- 2 המרכזים."
title = "A principal who also runs the treatment centre: are the centre's classes added in full, or capped at 6 first?"
body = """
§4.13.3 caps the management allowance in a treatment centre at the allowance for 6 classes, and in the next sentence has a school principal who also manages a treatment centre housed in the school add "his classes as manager of the centre" to the school's classes, the allowance being reckoned on the total of both.

It does not say whether the classes added are the centre's classes by the 25-hour key, or those classes as the cap leaves them. For a principal of a 10-class school who also runs a centre granted 200 weekly hours (8 classes by the key), the first reading reckons the allowance on 18 classes and the second on 16.
"""
reading = "The cap is the treatment centre's own allowance's; a principal who also runs the centre adds the centre's classes in full, as the sentence on the combined post names no cap."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/4.13.l4"
evidence = "`the cap's two readings differ for a principal who also runs the centre`"
depends_on = ["F-4.13-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
