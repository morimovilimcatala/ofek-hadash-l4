title = "Does the school's choice of the 50-minute lessons need the district manager's approval?"
body = """
§1.22.1ב empowers the principal and the pedagogical council to decide which of the first four lessons are of 50 minutes. §1.22.2 makes "every change in the length of a lesson and in the time of the breaks" subject to the district manager's approval.

Choosing which lessons are of 50 minutes changes the length of a lesson: the two timetables §1.22.1ג itself recommends give the first lesson 45 minutes in one and 50 in the other, and the breaks move with it. Read literally, §1.22.2 takes back the power §1.22.1ב gives; read as covering only departures from §1.22.1's scheme, it does not. The two readings differ on whether a school's own choice between the recommended timetables is valid without the district manager.
"""
reading = "§1.22.2 governs departures from §1.22.1's scheme (lessons other than two of 50 and two of 45 minutes, or a day shorter than the minimum); the choice §1.22.1ב leaves to the principal and the pedagogical council is not a change that needs the district manager."
