§1.22.1ב מסמיך את מנהל בית־הספר ואת המועצה הפדגוגית להחליט אילו מבין ארבעת השיעורים הראשונים יהיו בני 50 דקה. §1.22.2 קובע ש"כל שינוי באורך שעת הלימודים ובמועד ההפסקות" טעון אישורו של מנהל המחוז.

הבחירה אילו שיעורים יהיו בני 50 דקה משנה את אורכו של שיעור: בשתי מערכות השעות ש־§1.22.1ג עצמו ממליץ עליהן, השיעור הראשון הוא בן 45 דקות באחת ובן 50 באחרת, וההפסקות זזות איתו. לפי פשוטו, §1.22.2 לוקח בחזרה את הסמכות ש־§1.22.1ב מעניק; אם הוא נקרא כחל רק על סטיות מהמתכונת של §1.22.1, הוא אינו לוקח אותה. שתי הקריאות נפרדות בשאלה אם בחירה של בית ספר בין מערכות השעות המומלצות תקפה בלי מנהל המחוז.
"""
