# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-3.3-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_3__sec_3_3__hc_2__para_16__subpara_b"]
quote = "פטור מחובה זו מורה המלמד בבית-הספר פחות מעשרה שיעורים בשבוע, פרט למורה המלמד בכיתה שהוא צריך לחנך לפחות 6 עד 8 שיעורים."
title = "The class-educator exemption's exception: \"at least 6 to 8 lessons\" is two thresholds"
body = """
§3.3.16ב obliges every teacher to accept the post of class educator if asked, exempts a teacher who teaches fewer than ten lessons a week in the school, and takes back the exemption from a teacher who teaches the class she would educate "at least 6 to 8 lessons".

"At least 6 to 8" names two minimums. A teacher with nine lessons a week, seven of them in that class, is bound to educate it if the threshold is 6 and exempt if it is 8. The same words recur in §3.7.3.2.
"""
reading = "The lower figure: 6 lessons in the class end the exemption."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.3.l4"
evidence = "`\"at least 6 to 8 lessons\" decides a teacher of 7 lessons both ways`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-3.3-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_3__sec_3_3__hc_2__para_16__subpara_a"]
quote = "מורה העובד בבית-הספר למעלה מחצי משרה, לפחות, חייב להשתתף"
title = "\"More than half a position, at least\": is a half-time teacher bound to join pupils' activities?"
body = """
§3.3.16א binds a teacher working in the school "למעלה מחצי משרה, לפחות" — more than half a position, at least — to take part, as part of her work, in the activities the school organises for its pupils (trips, theatre, exhibitions).

"More than half" excludes a teacher on exactly half a position; "at least" (half) includes her. Half-time is a common position, and the two readings give her opposite duties. (§3.3.10 draws its own line at "less than half a position" for council meetings, which fits the "at least half" reading but does not decide this clause.)
"""
reading = "At least half a position, matching §3.3.10's line."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.3.l4"
evidence = "`\"more than half, at least\" reads two ways at half a position`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
