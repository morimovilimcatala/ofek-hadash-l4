quote = "החליט מנהל המחוז לאשר את הבקשה - יודיע על כך למורה, עם העתק למפקח הכולל והעתק לאגף כוח-אדם בהוראה · לא קיבל מנהל המחוז את המלצת המפקח - יעביר את הבקשה וחוות דעתו של המפקח הכולל, בצירוף נימוקיו, לאגף כוח-אדם בהוראה, שידאג להביא את העניין להכרעה."
title = "A teacher's request to return to the elementary school: ז.2 turns on approval, ז.3 on the supervisor's recommendation, and the two do not divide the cases"
body = """
§3.5ז.1 sends a teacher's request to return from the junior high school to the elementary school through the general supervisor, whose opinion goes to the district manager. §3.5ז.2 then says what follows where the district manager decides to APPROVE the request: he notifies the teacher, with copies. §3.5ז.3 says what follows where he DID NOT ACCEPT THE SUPERVISOR'S RECOMMENDATION: the request goes, with the supervisor's opinion and his reasons, to the personnel division, which sees it decided.

The two clauses are keyed on different facts. Where the supervisor recommended refusal and the district manager approves, both apply: ז.2 has him notify the approval, ז.3 sends the matter on to the division to be decided. Where the supervisor recommended refusal and the district manager refuses, neither applies, and the section does not say that the refusal is final or that the teacher is told of it.
"""
reading = "ז.2 is read as an approval the supervisor recommended. A district manager who departs from the recommendation, either way, refers the request under ז.3; a refusal the supervisor recommended is left where the section leaves it, with no step after it."
