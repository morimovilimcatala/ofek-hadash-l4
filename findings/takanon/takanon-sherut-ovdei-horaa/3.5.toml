quote = "למרות האמור לעיל (סעיף 1), לא יפוטרו עובדי הוראה כנ\"ל בתום תקופת הניסיון במקרים אלה: (א) מורה כולל, החייב בחינות בשני מקצועות לכל היותר, להוציא לשון עברית, וחוות דעת הפיקוח עליו היא בינונית ומעלה · עובדי הוראה לא-מוסמכים בעלי 4 או 5 שנות ותק, שקיבלו בשנה הקודמת אזהרת מְנהל מחוז, ושלא הגיעו להסמכה ועדיין חייבים שתי בחינות או יותר (לא כולל קורס קיץ) יוצעו לפיטורין מִנהליים."
title = "An uncertified teacher owing exactly two exams is both protected from administrative dismissal (ה.2) and proposed for it (ה.3)"
body = """
§3.5ה.2 says that, notwithstanding ה.1, uncertified teachers "will not be dismissed" at the end of probation where they owe exams in two subjects AT MOST (not Hebrew, or for a professional teacher not his own subject) and the supervision's opinion of them is medium or better. §3.5ה.3 says uncertified teachers with 4 or 5 years' seniority, warned by the district manager the year before, not certified and still owing two exams OR MORE, "will be proposed for administrative dismissal".

Probation of an uncertified teacher is four years (§3.4.3), so ה.3's teachers are at or past the end of probation. A general teacher with four years' seniority and last year's warning, owing exactly two exams, neither Hebrew, with a medium opinion, meets both clauses: one says she is not dismissed, the other that she is proposed for dismissal. Neither clause says it yields to the other.
"""
reading = "ה.3, the narrower rule (seniority of 4-5 years and a prior warning), governs its own case; ה.2 protects every other teacher it describes."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.5.l4"
evidence = "`ה.2 protects and ה.3 proposes the same teacher`"
