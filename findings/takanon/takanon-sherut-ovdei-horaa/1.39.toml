title = "An elected head who keeps the post but has no written approval is both on unpaid leave and deemed to have resigned"
body = """
§1.39.4: a teaching employee elected head or deputy head of a local authority who does not wish to resign has the term in office "considered unpaid leave, with all that implies" — with no condition. §1.39.5 then sets the procedure for requesting that unpaid leave, and §1.39.5(c) deems an employee who stops working without prior written approval to have resigned voluntarily.

For an elected head who does not resign and stops teaching without written approval, §1.39.4 gives unpaid leave and §1.39.5(c) gives a voluntary resignation, with the loss of rights the clause attaches to it.
"""
