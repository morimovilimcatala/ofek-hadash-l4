title = "A principal and a deputy principal who are relatives: section 2 forbids it, and 4.1 lets neither be transferred"
body = """
Clause 2.1 forbids two relatives working in one institution, and 2.2 requires one of them to be transferred. Where no exceptional permit is given, 4.1 has the district manager decide which relative is transferred, "except a principal or a deputy principal", and its second paragraph settles a principal–teacher or deputy–teacher pair by moving the teacher.

Where the two relatives are the principal and the deputy principal of the same school (one subordinate to the other, so only a 3.2 permit could cover it), 4.1 excludes both from transfer and the text names no other way to end the prohibited situation.
"""
reading = "The case is left undecided: the encoding returns no relative who may be transferred and does not choose one."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.37.l4"
evidence = "`a principal and a deputy who are relatives leave no one to transfer`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.37-c"
kind = "contradiction"
stage = "writing"
keys = ["chp_1ב__sec_1_37__ssec_2_2", "chp_1ב__sec_1_37__ssec_2_1"]
quote = "2.2 לאשר העברת עובד הוראה למוסד שיש בו קרוב משפחה."
title = "Under \"the prohibitions\", 2.2 says to approve a transfer into an institution where a relative works"
body = """
Section 2 is headed "the prohibitions concerning family relation". Its 2.1 forbids employing a person in an institution where a relative works, and the second sentence of 2.2 has one of two relatives in one institution transferred out so that they do not work together.

The first sentence of 2.2 is printed "לאשר העברת עובד הוראה למוסד שיש בו קרוב משפחה" — "to approve the transfer of a teaching employee to an institution where a relative is", with no "אין" (do not). Read as printed, the infinitive is an instruction to approve such a transfer, and the transfer it directs is the employment 2.1 forbids and the separation 2.2's second sentence requires undoing.
"""
reading = "The sentence is read as \"אין לאשר\": such a transfer is not approved. It is the only reading under which the sentence belongs under its heading and agrees with 2.1 and with its own second sentence; it is the opposite of the printed words, so it awaits a lawyer's confirmation."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.37.l4"
evidence = "`2.2 as printed directs a transfer that 2.1 forbids`"
