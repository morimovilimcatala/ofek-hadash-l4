# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.37-a"
kind = "contradiction"
stage = "writing"
keys = ["chp_1ב__sec_1_37__ssec_2_2", "chp_1ב__sec_1_37__ssec_2_1"]
quote = "2.2 לאשר העברת עובד הוראה למוסד שיש בו קרוב משפחה."
title = "Clause 2.2, as printed, directs approving the transfer that clause 2.1 forbids"
body = """
Clause 2.2 stands under the heading "the prohibitions concerning kinship" and opens with the words "to approve the transfer of a teaching employee to an institution where there is a relative" — an infinitive with no negation, which in a list of directions reads as an instruction to approve. Clause 2.1 forbids employing a person in an institution where a relative works, and 2.2's own second sentence orders relatives working in one institution to be separated by transfer.

Read as printed, the first sentence of 2.2 directs exactly the employment 2.1 forbids and 2.2's second sentence undoes. The negation ("אין לאשר") is evidently missing, but the text as it stands says the opposite, and a transfer approved on its words would be lawful under it.
"""
reading = "The first sentence of 2.2 is read as \"אין לאשר\": a transfer into an institution where a relative works is not approved, as 2.1 and 2.2's second sentence require."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.37.l4"
evidence = "`the printed first sentence of 2.2 reads as approving what 2.1 forbids`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.37-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_37__ssec_3_1__para_c", "chp_1ב__sec_1_37__ssec_3_1"]
quote = "ההיתר יינתן כל פעם לשנה אחת בלבד וכל עוד התנאים המפורטים לעיל יתקיימו"
title = "Does the one-year limit bind every permit under 3.1, or only one on ground (ג)?"
body = """
Clause 3.1 lets the district manager permit the employment of relatives, where neither is subordinate to the other, on any one of three grounds: (א) the institution is the only one of its kind in the locality; (ב) only one relative is employed there and they teach different subjects; (ג) the person is essential and there is no other suitable candidate. The sentence "the permit is given each time for one year only, and as long as the conditions detailed above hold" is printed as the end of (ג).

It can be read as the closing words of 3.1, binding every permit, or as part of ground (ג) alone ("the conditions detailed above" being (ג)'s own). The readings differ for a permit on ground (א) or (ב): one year at a time, or with no stated term.
"""
reading = "The one-year limit governs every permit under 3.1: \"the conditions detailed above\" are all of 3.1's conditions, and 3.2's exceptional permit is likewise given a year at a time."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.37.l4"
evidence = "`the one-year limit's two readings differ for a permit under (א)`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.37-c"
kind = "gap"
stage = "writing"
keys = ["chp_1ב__sec_1_37__ssec_4_1", "chp_1ב__sec_1_37__ssec_2_1"]
quote = "הוא יידרש להחליט מי מבין קרובי המשפחה יועבר, למעט מנהל או סגן מנהל"
title = "A principal and a deputy principal who are relatives: section 2 forbids it, and 4.1 lets neither be transferred"
body = """
Clause 2.1 forbids two relatives working in one institution, and 2.2 requires one of them to be transferred. Where no exceptional permit is given, 4.1 has the district manager decide which relative is transferred, "except a principal or a deputy principal", and its second paragraph settles a principal–teacher or deputy–teacher pair by moving the teacher.

Where the two relatives are the principal and the deputy principal of the same school (one subordinate to the other, so only a 3.2 permit could cover it), 4.1 excludes both from transfer and the text names no other way to end the prohibited situation.
"""
reading = "The case is left undecided: the encoding returns no relative who may be transferred and does not choose one."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.37.l4"
evidence = "`a principal and a deputy who are relatives leave no one to transfer`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
