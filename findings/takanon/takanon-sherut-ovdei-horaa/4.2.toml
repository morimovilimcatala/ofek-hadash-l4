# Errors in the LAW that encoding it in L4 exposed — MMS-415's model (see 1.7.toml for the field legend).

[[finding]]
id = "F-4.2-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_4__sec_4_2__hc_2__para_f"]
quote = "ו. עובד הוראה לא-מוסמך, שסיים חוג אחד ... - לאחר הסמכתו להוראה. · מורה לא-מוסמך, שלפני הסמכתו להוראה סיים בהצלחה קורס הכשרה מוכר לחינוך מיוחד."
title = "An uncertified teacher with a recognised special-education course: certified for special education at once, or only once certified to teach?"
body = """
§4.2 lists who is "certified for special education" for the special-education supplement. Sub-clause (ו) names an uncertified employee who completed the special-education course toward a degree, and says when: "after being certified to teach". Its second paragraph names an uncertified teacher who completed a recognised special-education training course before being certified to teach, and stops there: it gives no time.

Read alone, the second paragraph makes that teacher certified for special education while still uncertified to teach; read with the first paragraph of (ו), only after certification. For an uncertified teacher with a recognised course the two readings decide the supplement differently (§4.6.2 against §4.6.3), and the first reading would put such a teacher ahead of the certified teacher of (ה), who needs the same course and a certification.
"""
reading = "(ו)'s \"after being certified to teach\" governs its second paragraph too: the uncertified teacher with a recognised course is certified for special education from the day of certification to teach, consistently with (ה)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/4.2.l4"
evidence = "`the two readings of (f)'s second paragraph differ for an uncertified teacher`"
depends_on = []
