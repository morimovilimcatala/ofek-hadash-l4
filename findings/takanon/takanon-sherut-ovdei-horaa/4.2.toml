title = "מורה לא־מוסמך שסיים קורס מוכר לחינוך מיוחד: מוסמך לחינוך מיוחד מיד, או רק לאחר הסמכתו להוראה?"
body = """
§4.2 מונה מי הוא "בעל הסמכה לחינוך המיוחד" לעניין תוספת חינוך מיוחד. פסקת־משנה (ו) נוקבת בעובד לא־מוסמך שסיים את החוג לחינוך מיוחד לקראת תואר, ואומרת מתי: "לאחר הסמכתו להוראה". הפסקה השנייה שלה נוקבת במורה לא־מוסמך שסיים קורס הכשרה מוכר לחינוך מיוחד לפני הסמכתו להוראה, ונעצרת שם: היא אינה נותנת מועד.

בקריאה לעצמה, הפסקה השנייה עושה את המורה הזה למוסמך לחינוך מיוחד בעודו לא־מוסמך להוראה; בקריאה יחד עם הפסקה הראשונה של (ו), רק לאחר ההסמכה. לגבי מורה לא־מוסמך שסיים קורס מוכר, שתי הקריאות מכריעות את התוספת באופן שונה (§4.6.2 לעומת §4.6.3), והקריאה הראשונה הייתה מקדימה מורה כזה לפני המורה המוסמך של (ה), הזקוק לאותו קורס ולהסמכה.
"""
