body = """
§2.3.11 dates the start of a kindergarten teacher's seniority in coordination, for the management seniority supplement, in two cases: entitled in 5743 or before, from 1.9.82; entitlement that "began from the school year 5744" (התחילה משנת הלימודים תשמ"ד), from 1.9.83.

"From 5744" reads two ways. Read as "from 5744 onward", every later starter counts from 1.9.83 — a teacher first entitled in 5750 would count six years of coordination seniority before she held the post. Read as "in 5744", the clause is silent on everyone who began later, and the section gives no date for them at all.
"""
