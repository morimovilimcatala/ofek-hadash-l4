# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2.4-a"
kind = "contradiction"
stage = "writing"
keys = ["chp_2__sec_2_4__ssec_2_4_6__para_2", "chp_2__sec_2_4__ssec_2_4_6__para_2/p3"]
quote = "גננת מרכזת שכיהנה שמונה שנים בתפקיד זה וקיבלה גמול ניהול, זכאית לגרירת גמול הניהול לאחר שהועברה מתפקידה · גננת משלימה זכאית לגרירת גמול ניהול, אם עבדה ברציפות כמנהלת גן והועברה מתפקידה ביוזמת המעסיק"
title = "Keeping the management allowance: eight years (2.4.6.2), or any continuous service if the employer moved her (the 2009 note)?"
body = """
§2.4.6.2 lets a coordinating teacher who served eight years in the post with the management allowance keep ("drag") it after she is moved from the post. The note beneath it records the parity committee's decision of 14.10.2009: a teacher who "worked continuously as a kindergarten manager" and was moved at the employer's initiative, for its needs, to a complementing post or any post without a management allowance, keeps the allowance — with no number of years.

For a coordinating teacher moved by her employer after three years, the clause says she does not keep it and the note says she does. The note does not say whether it replaces the eight-year rule for employer-initiated moves, adds a case beside it, or (since it speaks of "continuous" service) silently assumes the eight years.
"""
reading = "The 2009 decision adds a case: a manager moved at the employer's initiative keeps the allowance after continuous service of any length; otherwise the eight years of 2.4.6.2 are required."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/2.4.l4"
evidence = "`2 and the 2009 decision disagree on a manager of under eight years`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2.4-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_2__sec_2_4__ssec_2_4_6__para_2/p3", "chp_2__sec_2_4__ssec_2_4_6__para_2/p4"]
quote = "גננת משלימה זכאית לגרירת גמול ניהול, אם עבדה ברציפות כמנהלת גן והועברה מתפקידה ביוזמת המעסיק · תחולה: 14/10/2009."
title = "The 2009 decision \"applies from 14/10/2009\": to moves made from that day, or to payments from that day?"
body = """
The parity committee's decision of 14.10.2009, noted under §2.4.6.2, lets a teacher who worked continuously as a kindergarten manager, and was moved by her employer to a complementing post or any post without a management allowance, keep the allowance. Its applicability line says only "תחולה: 14/10/2009".

The decision is about an event — being moved — and a payment that follows it. The date can fix which moves it covers (only those on or after 14.10.2009), or from when it is paid (from 14.10.2009, to every teacher who meets its conditions, including one moved earlier). A manager moved by her employer in 2008 keeps the allowance from 2010 on under the second reading and never under the first.
"""
reading = "The date fixes the move: the decision covers a teacher moved on or after 14.10.2009."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/2.4.l4"
evidence = "`the 2009 decision's date decides a manager moved before it`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
