title = "Keeping the management allowance: eight years (2.4.6.2), or any continuous service if the employer moved her (the 2009 note)?"
body = """
§2.4.6.2 lets a coordinating teacher who served eight years in the post with the management allowance keep ("drag") it after she is moved from the post. The note beneath it records the parity committee's decision of 14.10.2009: a teacher who "worked continuously as a kindergarten manager" and was moved at the employer's initiative, for its needs, to a complementing post or any post without a management allowance, keeps the allowance — with no number of years.

For a coordinating teacher moved by her employer after three years, the clause says she does not keep it and the note says she does. The note does not say whether it replaces the eight-year rule for employer-initiated moves, adds a case beside it, or (since it speaks of "continuous" service) silently assumes the eight years.
"""
reading = "The 2009 decision adds a case: a manager moved at the employer's initiative keeps the allowance after continuous service of any length; otherwise the eight years of 2.4.6.2 are required."
