body = """
§3.18 קובע שתוספת הביגוד של מורים למלאכה וטכנולוגיה, לציור ולכלכלת בית, המלמדים בכיתות ז'-ח' בבית־ספר יסודי, תושווה ל"תוספת המשולמת למורים במקצועות אלו בחטיבת-הביניים", ומפנה לשם כך ל־§5.11.6.

§5.11.6 מעניק מכסת ביגוד וקצובת ביגוד נוספת ל"מורים הטכנולוגיים" בחטיבת־הביניים (§5.11.6.1–2) ולמורים המדריכים בסדנות כעמיתיהם המדריכים המקצועיים (§5.11.6.3). הוא אינו נוקב לא בציור ולא בכלכלת בית. אם שני המקצועות האלה הם "מקצועות טכנולוגיים" — לא נאמר, ולכן הסעיף נקרא בשתי דרכים: המורים לציור ולכלכלת בית בכיתות ז'-ח' מקבלים את התוספת של §5.11.6, או שאין תוספת בחטיבת־הביניים שאליה הם יושוו, והם אינם מקבלים דבר.
