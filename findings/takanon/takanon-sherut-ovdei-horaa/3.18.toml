keys = ["chp_3__sec_3_18__hc_2/p2"]
quote = "לציור, לכלכלת בית, המלמדים בכיתות ז'-ח' בבית-ספר יסודי, תושווה לתוספת המשולמת למורים במקצועות אלו בחטיבת-הביניים (ראה סעיף 5.11.6)"
title = "§3.18 equates art and home-economics teachers to a middle-school clothing supplement §5.11.6 does not name"
body = """
§3.18 sets the clothing supplement of crafts-and-technology, art and home-economics teachers in grades 7-8 of a primary school equal to "the supplement paid to teachers of these subjects in the middle school", and points to §5.11.6 for it.

§5.11.6 grants a clothing quota and an additional clothing allowance to "the technological teachers" of the middle school (§5.11.6.1-2) and to teachers who instruct in workshops like vocational instructors (§5.11.6.3). It names neither art nor home economics. Whether those two subjects are "technological subjects" is not said, so the clause reads two ways: art and home-economics teachers in grades 7-8 get the §5.11.6 supplement, or there is no middle-school supplement for them to be equated to and they get nothing.
"""
reading = "The supplement is §5.11.6's, for all three subjects: §3.18 itself asserts that middle-school teachers of these subjects are paid one, and the clause would be empty for two of its three subjects otherwise. Its amount is an input."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.18.l4"
evidence = "`section 5.11.6 names neither art nor home economics`"
