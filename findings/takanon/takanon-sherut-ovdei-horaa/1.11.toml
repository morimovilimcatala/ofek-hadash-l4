quote = "הקבצה נחשבת ככיתה לצורך חישוב גמול פיצול. · לגבי מורים לחינוך גופני המלמדים קבוצות בכיתות ה' ומעלה תיספרנה גם הקבוצות שנוצרו מצירוף תלמידים מכיתות שונות ככיתות לצורך חישוב גמול פיצול. תחולת תת-סעיף 2ב: ו' באלול התשנ\"ה (1.9.95)."
