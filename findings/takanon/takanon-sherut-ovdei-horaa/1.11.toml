[[finding]]
id = "F-1.11-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_11__hc_2__para_1__subpara_a"]
quote = "או ב - 3 מוסדות חינוך אצל אותו מעסיק, או ב - 3 מוסדות חינוך אצל אותו מעסיק בגבולות משרת הוראה אחת"
title = "Three institutions qualify — on any position, or only within one teaching position?"
body = """
§1.11.1א lists, among the alternatives that earn the allowance, "3 educational institutions with the same employer" and, at once, "3 educational institutions with the same employer within one teaching position". The second adds a limit the first does not have, and the first makes it idle.

Read as written, a teacher in three institutions qualifies on any position; read with the limit, one whose work there passes one teaching position does not. The two readings part for every such teacher.
"""
reading = "As written: the unlimited alternative stands, so three institutions with the same employer qualify whatever the position."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.11.l4"
evidence = "`the two institution alternatives part on more than one position`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"


