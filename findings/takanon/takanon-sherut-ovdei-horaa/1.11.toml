title = "A six-year school split between two owners with equal hours: neither pays"
body = """
§1.11.5ו treats a six-year school as one school, so a teacher in its middle and upper divisions whose salary is split between two owners receives one split allowance, paid "by the owner where the subject is taught most of the hours"; the paying owner tells the other, which pays nothing.

Where the hours are equal, no owner is the one where most of them are taught, and the clause names no payer.
"""
reading = "The clause decides nothing between owners with equal hours; the L4 returns both and adopts no tie-break of its own."
