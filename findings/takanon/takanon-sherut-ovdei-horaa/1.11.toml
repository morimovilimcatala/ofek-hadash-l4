title = "מניין הכיתות: כיתה שעובד ההוראה מלמד בה שני מקצועות — נספרת פעם אחת או פעמיים?"
body = """
§1.11.1א מזכה בגמול עובד הוראה "המלמד מ - 6 עד 7 כיתות", ובשיעור גבוה יותר את מי שמלמד 8 עד 10 כיתות או 11 ומעלה. הסעיף אינו אומר מה נספר. "כיתות" במובנן הפשוט הן כיתות שונות, אבל §1.11.2 סופר "ככיתה" גם הקבצה של תלמידים משתי כיתות, קבוצת עבודה בחינוך הטכנולוגי וכל קבוצה של מורה למלאכה — חלקים של כיתות, שכל אחד מהם נספר בנפרד — כך שהמניין הוא של קבוצות שהעובד מלמד ולא של כיתות שונות. על כיתה שלמה שהעובד מלמד בה שני מקצועות הטקסט אינו אומר אם היא קבוצה אחת או שתיים.

