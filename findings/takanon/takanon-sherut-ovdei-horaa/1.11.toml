title = "The split allowance: a percent of the combined salary alone, or of the combined salary with its supplements?"
body = """
§1.11.1א ¶2 sets the split allowance at 5% (6%, 7%) "מהשכר המשולב" — of the combined salary — and §1.11.3ה repeats the words for the language teachers. §1.1ו lists "גמול פיצול (ראה סעיף 1.11)" among the percentage allowances (ו.1), and computes every percentage allowance on the combined salary together with the 3%, 2008, 2011 and "הסכם הוראה 1994" supplements.

Wherever any of those supplements is paid, the two sections give the allowance different bases.
"""
reading = "§1.1ו's base governs: it names this allowance among those it computes, and the supplements it adds post-date §1.11's wording; §1.11 gives the rate. (The base includes the 1994 supplement by F-1.1-b's reading.)"
