body = """
§1.11.2א ("הקבצה נחשבת ככיתה לצורך חישוב גמול פיצול…") סופר כל הקבצה — צירוף תלמידים משתי כיתות ומעלה — ככיתה, בלי מועד תחולה. §1.11.2ב, בפסקה "לגבי מורים לחינוך גופני המלמדים קבוצות בכיתות ה' ומעלה…", קובע שבחינוך גופני "תיספרנה גם" הקבוצות שנוצרו מצירוף תלמידים מכיתות שונות — שהן הקבצות לפי הגדרת 2א — ומחיל זאת רק מ־1.9.95.

בדיקה ממצה של כל סוג קבוצה, בכל שכבה מ־א' עד י"ב, בחינוך גופני ובלעדיו, ביום 31.8.95 וביום 1.9.95, מצאה ש־2א לבדו ומניין הכיתות של הסעיף נבדלים בדיוק בקבוצות בחינוך גופני שאינן כיתה שלמה: בכל שכבה לפני 1.9.95, ובשכבות א'–ד' ממנו. מ־1.9.95 זה החריג ש־2ב עצמו קובע לשכבות א'–ד'; לפני כן 2ב אינו בתוקף, ו־2א סופר הקבצה כזו — בעוד שמועד התחולה של 2ב, "תיספרנה גם" ממנו, מלמד שעד אז לא נספרה (`a grade-6 PE grouping before 1.9.1995 counts under 2א and not under 2ב's date`).
"""
reading = "2ב, הכלל המיוחד לחינוך גופני, גובר גם על העבר: לפני 1.9.95 נספרת בחינוך גופני כיתה שלמה בלבד, ומ־1.9.95 נספרות גם הקבצות בשכבות ה' ומעלה."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.11.l4"
