"""
reading = "The allowance's basic rate, 5% (§1.11.1א ¶2), as 3ה also restates it for its own case."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.11.l4"
evidence = "`section 1.11.4 states no rate`"
