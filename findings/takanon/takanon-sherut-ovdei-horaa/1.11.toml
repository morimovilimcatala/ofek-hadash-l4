[[finding]]
id = "F-1.11-a"
kind = "overlap"
stage = "writing"
keys = ["chp_1א___sec_1_11__hc_2__para_1__subpara_a/p2", "chp_1א___sec_1_11__hc_2__para_1__subpara_b", "chp_1א___sec_1_11__hc_2__para_3__subpara_e", "chp_1א___sec_1_11__hc_2__para_5__subpara_a"]
quote = "עובד הוראה כנ\"ל המלמד מ - 8 עד 10 כיתות יקבל גמול פיצול בשיעור % 6 · בשיעור משרה שבין % 79 ל - % 95 והמלמד ב - 5 כיתות או יותר אצל אותו מעסיק, זכאי לגמול פיצול בגובה % 3 · עובד הוראה זכאי בכל מקרה לגמול פיצול אחד בלבד"
title = "Several clauses give one teacher split-position allowances at different rates, and only one is paid"
body = """
§1.11.1א pays 5% for 6–7 classes, 6% for 8–10 and 7% for 11 or more; §1.11.1ב pays 3% to a teacher on a position of 79% to 95% who teaches 5 classes or more; §1.11.3 pays 5% (3ה) for a language taught in 4 classes or more, or a share of it for part of the mother tongue. §1.11.5א: a teacher is entitled to ONE split-position allowance only.

A teacher on 85% of a position teaching 8 classes meets 1א (6%) and 1ב (3%); a language teacher of 9 classes meets 1א (6%) and 3 (5%). The text allows one allowance and does not say which. If 1ב were read as the particular rule for 79–95% positions, an 85% teacher of 11 classes would get 3% while a half-time teacher of the same 11 classes gets 7% (5ב pays the full allowance on a part-time position).
"""
reading = "The highest rate any clause gives the teacher is the one allowance paid; 1ב is read as reaching only those 1א does not."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.11.l4"
evidence = "`two clauses give the 85% teacher of 8 classes different rates`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

