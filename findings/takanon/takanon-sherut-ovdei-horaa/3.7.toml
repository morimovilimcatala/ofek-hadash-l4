title = "The class-educator exemption's exception: \"at least 6 to 8 lessons\" is two thresholds"
body = """
§3.7.3.2 obliges every teacher to accept the post of class educator if asked, exempts a teacher who teaches fewer than ten lessons a week in the school, and takes back the exemption from a teacher who teaches the class she would educate "at least 6 to 8 lessons".

"At least 6 to 8" names two minimums. A teacher with nine lessons a week, seven of them in that class, must educate it if the threshold is 6 and is exempt if it is 8. The clause repeats §3.3.16ב word for word, so the two sections share the flaw (F-3.3-a) and must be read alike.
"""
