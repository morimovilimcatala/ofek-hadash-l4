[[finding]]
id = "F-3.19-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_3__sec_3_19__ssec_3_19_7__para_2/p2"]
quote = "שעות תקן + מספר הכיתות המבקרות בבית-הספר * 5.1"
title = "The 3-hour class-count formula multiplies by \"5.1\" — read as 1.5?"
body = """
§3.19.7 counts a maritime or agricultural school's classes for the management allowance. Where visiting classes are taught 2 weekly hours, the numerator is the standard hours plus the number of visiting classes; where they are taught 3, it is the standard hours plus the number of visiting classes "* 5.1" (the source page prints the same).

Against the 2-hour formula's weight of 1 per class, 3 weekly hours give 1.5, and "5.1" is "1.5" with its digits reversed — a common accident of right-to-left typesetting. Read as printed, a class taught 3 hours would weigh more than five times a class taught 2. The two readings give different class counts, and so different management allowances.
"""
reading = "The multiplier is 1.5 (three weekly hours against two), the printed \"5.1\" being the digits of 1.5 reversed."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.19.l4"
evidence = "`the printed and the read multiplier give different class counts`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

