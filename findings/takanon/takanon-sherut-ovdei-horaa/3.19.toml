quote = "אם אוכלוסיית בית-הספר מעורבת ראה גם סעיף 3.19.6.3."
title = "The subject-coordination allowance of an agricultural farm with a mixed population is not decided"
body = """
§3.19.6.2 decides the subject-coordination allowance on an agricultural farm by its population: grades 1-6 only, as in primary education (§3.14); grades 7-12, as in post-primary education (§6.10). For a mixed population it says only "see also §3.19.6.3".

§3.19.6.3 governs the LAYER coordinator — who may be appointed, on a mixed farm only, "in addition to the subject coordinators", at 6% — and says nothing of the subject coordinators themselves. So for a farm whose pupils are in both grades 1-6 and grades 7-12, the text names neither §3.14 nor §6.10 as the rule of its subject coordinators.
"""
reading = "None is adopted: the encoding returns \"not decided by the text\" for a mixed farm's subject-coordination rules. Choosing §3.14 or §6.10 (or each for its own grades) is for the reader of this finding."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.19.l4"
evidence = "`a mixed farm's subject-coordination rules are not decided`"
