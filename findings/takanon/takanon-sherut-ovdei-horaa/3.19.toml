לעומת משקל של 1 לכיתה בנוסחת 2 השעות, 3 ש"ש נותנות 1.5, ו־"5.1" הוא "1.5" שספרותיו התהפכו — תקלה שכיחה בסדר מימין לשמאל. בקריאה כפי שהוא מודפס, כיתה הלומדת 3 שעות הייתה שוקלת יותר מפי חמישה מכיתה הלומדת 2. שתי הקריאות נותנות מספר כיתות שונה, ולכן גמולי ניהול שונים.
"""
