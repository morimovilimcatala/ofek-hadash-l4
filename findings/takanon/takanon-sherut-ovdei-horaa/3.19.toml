body = """
§3.19.6.2 מכריע את גמול ריכוז המקצוע בחווה חקלאית לפי אוכלוסייתה: כיתות א'-ו' בלבד — כנהוג בחינוך היסודי (§3.14); כיתות ז'-י"ב — כנהוג בחינוך העל־יסודי (§6.10). לגבי אוכלוסייה מעורבת הוא אומר רק "ראה גם סעיף 3.19.6.3".

§3.19.6.3 עוסק במרכז השכבה — שאפשר למנותו, בחווה מעורבת בלבד, "בנוסף למרכזי מקצוע", בשיעור 6% — ואינו אומר דבר על מרכזי המקצוע עצמם. לכן לגבי חווה שתלמידיה הם גם בכיתות א'-ו' וגם בכיתות ז'-י"ב, הטקסט אינו נוקב לא ב־§3.14 ולא ב־§6.10 ככלל החל על מרכזי המקצוע שלה.
"""
reading = "לא מאומצת אף קריאה: הקידוד מחזיר \"לא הוכרע בטקסט\" לגבי כללי ריכוז המקצוע בחווה מעורבת. הבחירה ב־§3.14 או ב־§6.10 (או בכל אחד לגבי הכיתות שלו) נתונה לקורא ממצא זה."
