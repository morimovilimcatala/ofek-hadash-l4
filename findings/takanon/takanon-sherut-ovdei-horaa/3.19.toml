quote = "24 או 30 ש\"ש בהתאם לרובד החינוכי א'-ו' או ז'+"
title = "The class-count formula's divisor for a school serving both grades 1-6 and grades 7 and up is not set"
body = """
Both class-count formulas of §3.19.7 divide by "24 or 30 weekly hours according to the educational layer, grades 1-6 or 7 and up". A maritime or agricultural school may serve both layers — §3.19.6.3 provides a layer coordinator for exactly such a farm — and for it the text gives no divisor, no split of the hours between the layers, and no rule of priority. The two divisors give different class counts (in the encoding's example, 3 classes at 24 and 2 at 30).
"""
reading = "None is adopted: the divisor is an input of the formula (`weekly hours of the layer's position`), to be set per school until the text decides it."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.19.l4"
evidence = "`the two layer divisors give different class counts for a school of both layers`"
