quote = "בעבור פעולות ההכנה המפורטות בפרק 6.17.3 בסעיפים א(4) ו- ב(4) לפי העניין"
title = "The payment for preparation cites paragraphs that are not about preparation"
body = """
Item 1.4 of §6.17.7 pays one work hour "for the preparation activities detailed in 6.17.3 paragraphs א(4) and ב(4)". §6.17.3א(4) is the full-time guide's duty to take part in the IDF march with the school team, and ב(4) is the part-time guide's duty to go to the national service enterprise. The preparation activities — preparing each field day outside working hours — are א(2) and ב(2).

As cited, 1.4 pays an hour for the march and for national service and nothing for preparation.
"""
reading = "The citation is read as א(2) and ב(2), the paragraphs that detail preparation activities, which is what 1.4's own words describe; one work hour is paid for preparing a field day."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.17.l4"
evidence = "`1.4 cites no preparation activity`"
