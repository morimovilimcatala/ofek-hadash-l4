quote = "על מדריכי של\"ח המועסקים ביום חתימת ההסכם ועל תקופת עבודתם בתקופת תוקפו"
title = "The agreement whose signing day decides who is covered is not identified"
body = """
§6.17.1.3 makes the provisions apply to guides employed "on the day the agreement was signed" and to those who worked during its term and retired "by the day it was signed", and excludes guides dismissed for a disciplinary or criminal offence "before the day it was signed". §6.17.1.1 speaks of "the agreement applying to Shelach guides" and gives only the day it takes effect (1.9.77).

The section names neither the agreement nor the day it was signed, so none of §6.17.1.3's three tests can be applied from the text; the source list points to a director-general's circular, not to the agreement.
"""
reading = "The signing day is an input; the rule is encoded over whether the guide was employed on it, retired before it, or was dismissed before it for an offence."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.17.l4"
evidence = "`the section names no signing day`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-6.17-b"
kind = "contradiction"
stage = "writing"
keys = ["chp_6__sec_6_17__ssec_6_17_2__para_1__subpara_b", "chp_6__sec_6_17__ssec_6_17_2__para_2__subpara_b"]
quote = "18 ש\"ש בגין 3 ימי שדה; · 6 ש\"ש בגין הוראה פרונטלית (שעות מערכת). · ובתנאי ש - 3 / ¹ מהיקף שעות משרתם יהיה בהוראה פרונטלית"
title = "The surplus-hours arrangement asks for a frontal third the prescribed position does not have"
body = """
§6.17.2.1ב composes the post-primary Shelach position: 18 weekly hours for 3 field days and 6 hours of frontal teaching — a quarter of the 24-hour unit of §6.17.2.1א. §6.17.2.2ב recognises field-day preparation hours as surplus hours (for the Dafna provident fund) for Shelach teachers "working at least a full position", provided a third of their position's hours are frontal teaching.

A guide in exactly the position §6.17.2.1ב prescribes never meets that condition (6 of 24 hours is a quarter), so the arrangement made for full-position Shelach teachers reaches only a guide who has at least three frontal hours beyond the composed position. The two clauses, read together, take back most of what the second one grants.
"""
reading = "Both clauses are applied as written: the third is measured on all the guide's weekly hours, so the standard full-position guide does not qualify and one with enough added frontal hours does."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.17.l4"
evidence = "`the composed full position never meets the frontal third`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

