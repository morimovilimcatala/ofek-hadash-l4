quote = "תשלום בעבור השעות שבהן עבד בפועל, אך לא יותר מ - 10 שעות ביום · תשלום של 20 שעות, בהפחתת שעות המשרה · גמול השווה לשעת עבודה אחת"
title = "Items 1.2 to 1.6 count hours but give no rate for an hour"
body = """
Item 1.1 of §6.17.7 prices an overnight special activity: the monthly salary over 120 per hour, plus 24% for social rights (with the outside worker's salary fixed separately). Items 1.2 (day activities), 1.3 (a sortie: 20 hours less position hours), 1.4 (one work hour for preparation), 1.5 (12 hours on a national-service Sabbath) and 1.6 (10 hours a day for instructing at seminars) state only a number of hours.

None of them says what an hour is paid: whether 1.1's hourly value (a 120th of the monthly salary), with or without its 24% for social rights, or another rate. The payments cannot be computed from the text.
"""
reading = "The hours are encoded as each item counts them; the rate of an hour is an input, not borrowed from item 1.1."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.17.l4"
evidence = "`items 1.2 to 1.6 state no rate`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

