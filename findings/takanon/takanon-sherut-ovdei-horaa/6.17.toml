[[finding]]
id = "F-6.17-f"
kind = "ambiguity"
stage = "writing"
keys = ["chp_6__sec_6_17__ssec_6_17_5__hc_1__para_3", "chp_6__sec_6_17__ssec_6_17_5__hc_1__para_3__subpara_b", "chp_6__sec_6_17__ssec_6_17_5__hc_1__para_4"]
quote = "כמדריך של\"ח מוסמך ייחשב: ... ב. בעל השכלה של 11-10 שנות לימוד חייב בבחינות למורים בהתאם לחוברת \"בחינות מילואים למורים לא-מוסמכים\" תשכ\"ב, פחות 2 בחינות שאינן פסיכולוגיה ולשון עברית."
title = "The second way to be a certified Shelach guide is written as an exam duty, not as a definition"
body = """
§6.17.5(3) opens "considered a certified Shelach guide:" and lists (א) and (ב). (א) is a definition: matriculation or 12 years' schooling, the Gadna guides' seminar, three exams and a year's positive assessment. (ב) is not: it says a guide of 10–11 years' schooling "owes" the exams of the 1962 booklet for non-certified teachers, less two that are not psychology or Hebrew. It does not say that passing them makes him certified, nor whether he also needs (א)'s seminar and assessment.

§6.17.5(4) then makes "stage AA" the guide who has finished all his exams "under ב" but one, which suggests that finishing all of them is the step above, certification. The readings differ for a guide of 10–11 years who has passed every booklet exam but has no seminar or assessment: certified on one, not on the other.
"""
reading = "(ב) is a second way to certification: a guide of 10–11 years' schooling who has passed every exam the booklet asks of him is a certified Shelach guide, with nothing further from (א)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.17.l4"
evidence = "`(3)ב certifies a guide (3)א does not`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
