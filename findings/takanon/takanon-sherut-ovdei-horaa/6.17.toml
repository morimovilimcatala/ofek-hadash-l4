title = "הדרך השנייה להיות מדריך של\"ח מוסמך כתובה כחובת בחינות, לא כהגדרה"
body = """
§6.17.5(3) פותח ב"כמדריך של"ח מוסמך ייחשב:" ומונה את (א) ואת (ב). (א) הוא הגדרה: תעודת בגרות או 12 שנות לימוד, סמינר למדריכי גדנ"ע, שלוש בחינות והערכה חיובית במשך שנה. (ב) אינו הגדרה: הוא אומר שמדריך בעל השכלה של 10–11 שנות לימוד "חייב" בבחינות של החוברת לשנת תשכ"ב למורים לא־מוסמכים, פחות שתיים שאינן פסיכולוגיה ולשון עברית. הוא אינו אומר שעמידה בהן הופכת אותו למוסמך, וגם לא אם הוא זקוק גם לסמינר ולהערכה של (א).

§6.17.5(4) קובע אחר כך ש"שלב א"א" הוא המדריך שסיים את כל בחינותיו "בהתאם לסעיף ב" פרט לאחת, ומכאן משתמע שסיום כולן הוא השלב שמעליו, ההסמכה. הקריאות נבדלות לגבי מדריך בעל 10–11 שנות לימוד שעמד בכל בחינות החוברת אך אין לו סמינר או הערכה: לפי האחת הוא מוסמך, לפי האחרת אינו מוסמך.
"""
