title = "מרכז מעבדה \"המועסק ב־1/3 משרה\": שליש בדיוק, או שליש לפחות?"
body = """
§6.9.2.2 ("כמרכז מעבדה יתמנה מורה…") נוקב בשליש משרה במקצועות המעבדה, בלי "לפחות" ובלי "עד". הסעיף המקביל לרכזי מקצוע, §6.10.2ב.4, אומר "לפחות"; כאן המילה חסרה. קריאה מילולית ("שליש") פוסלת מורה בחצי משרה או במשרה מלאה, וקריאה של סף ("שליש לפחות") מכשירה אותם.

בדיקה ממצה על כל חלק משרה בשנים־עשר, מאפס ועד משרה מלאה, מראה ששתי הקריאות נפרדות בכל חלק משרה שמעל לשליש — כלומר בכל מורה שמלמד יותר משליש משרה במקצועות המעבדה.
"""
