body = """
§6.9.2.1 מתיר להנהלת המוסד למנות מרכז מעבדה "באישור המפקח ובאישור הנהלת המוסד" — אישורו של הגוף הממנה עצמו — ואינו מזכיר את הבעלות. §6.9.2.3, העוסק באותו מינוי הנעשה בתחילת כל שנת לימודים, דורש אישור "המפקח והבעלות".

מינוי שאושר בידי המפקח והבעלות מקיים את §6.9.2.3 ואינו מקיים את §6.9.2.1; מינוי שאושר בידי המפקח וההנהלה מקיים את §6.9.2.1 ואינו מקיים את §6.9.2.3. השאלה אם אישור הבעלות הוא תנאי למינוי נענית בשני הכיוונים.
"""
reading = "האישורים הנדרשים הם של המפקח ושל הבעלות (§6.9.2.3): ההנהלה היא הגוף הממנה, ולכן אישורה שלה אינו מוסיף תנאי, והאישור השני ב־§6.9.2.1 נקרא כאישור הבעלות."
