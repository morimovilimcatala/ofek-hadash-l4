quote = "העובדת במשרה של 79% לפחות · \"עובדת הוראה אם\" העובדת מעל 79% משרה לפי דרישת המעסיק, תקבל תוספת בשיעור 10%"
title = "A mother-teacher at exactly 79%: \"at least 79%\" and \"above 79%\""
body = """
§1.13.1 opens with the mother-teacher "working at a position of at least 79%", and §§1.13.3–5 speak of "79% and above" and "at least 79%". The clause that actually grants the 10% supplement from 1.9.93 grants it to a mother-teacher working "above 79%" ("מעל 79% משרה").

A mother-teacher on exactly 79% is within every other clause and outside the one that pays.
"""
reading = "At least 79%: the threshold of every other clause, and of the clause that defines the mother-teacher's salary."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.13.l4"
evidence = "`a 79% mother qualifies by the other clauses and not by the clause of 1.9.93`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.13-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_13__ssec_1_13/p4"]
quote = "ולרבות עובד נשוי אשר ילדיו נמסרו לחזקתו על פי חוזה גירושין מאושר ותקף או פסק דין תקף"
title = "\"A married employee\" whose children were given to him by a divorce"
body = """
§1.13.1 extends the "mother-teacher" to "a married employee whose children were given into his custody under an approved divorce agreement or a judgment". A divorce ends the marriage in which the custody is given, so "married" either describes that marriage — any father with custody under a divorce instrument — or requires that he has married again.

Read by the letter, a divorced father who has the children and has not remarried is not a mother-teacher; read the other way, he is. (§1.14.4 extends "mother" to "a widower or divorcé whose children are with him", with no such word.)
"""
reading = "Custody under the divorce instrument is the condition; \"נשוי\" is read as naming the marriage the divorce ended, so a father with custody qualifies whether or not he has remarried."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.13.l4"
evidence = '`"עובד נשוי" read by the letter excludes a father who has not remarried`'
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.13-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_13__ssec_1_13/p10", "chp_1א___sec_1_13__ssec_1_13/p12"]
quote = "וזאת בתנאי שסך הכול שכרה, כולל התוספת בשיעור של 10%, לא יעלה על 150% משרה · בתנאי שהיקף העסקה בהוראה + הדרכה + תוספת מורה-אם לא יעלה על 100% משרה"
title = "Past 150% (or 100%), is the supplement lost or cut down?"
body = """
The 10% supplement is granted "on condition that" her salary with it does not pass 150% of a position, and, for teaching with guidance, "on condition that" teaching, guidance and the supplement do not pass 100%. Read as a condition, a mother-teacher whose salary with the supplement would pass the cap loses the supplement entirely; read as a ceiling, she is paid the supplement up to the cap.

A mother-teacher on 140% of a position is paid nothing under the first reading and 10% of a position under the second.
"""
reading = "As printed, a condition (\"בתנאי ש\"): past the cap there is no supplement."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.13.l4"
evidence = "`the 150% clause read as a condition and as a ceiling give different supplements`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
