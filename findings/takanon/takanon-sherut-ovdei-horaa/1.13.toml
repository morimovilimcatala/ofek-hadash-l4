quote = "תקבל תוספת בשיעור 10% לשכרה המשולב · מורה כנ\"ל העובדת גם בבעלויות נוספות אינה זכאית לתוספת זו בגין עבודתה בבעלויות הנוספות האלה."
title = "תוספת מורה־אם: משרה גדולה יותר מזכה בתוספת קטנה יותר כשבעלות אחת חוצה את 79%"
body = """
§1.13.1, בפסקה "החל מה-1.9.93…", נותן למורה־אם תוספת של 10% "לשכרה המשולב" — לכל שכרה. §1.13.4 ("מורה - אם העובדת בהיקף משרה של 79% משרה לפחות בבעלות אחת…") משלם אותה רק מן הבעלות שבה היא מגיעה ל־79%, ושולל אותה "בגין עבודתה בבעלויות הנוספות"; §1.13.5 ("מורה - אם העובדת בכמה בעלויות…") משלם אותה על כל המשרה כשאף בעלות אינה מגיעה ל־79% לבדה.

בדיקה ממצה של כל שני זוגות של היקפי משרה בשתי בעלויות, מ־0 עד 100% משני צדי 79%, מצאה שבכל מקרה שבו משרה כוללת גדולה יותר מזכה בתוספת קטנה יותר, יש במשרה הגדולה בעלות המגיעה ל־79%. מורה ב־78% וב־22% מקבלת 10% ממשרה מלאה; מורה ב־80% וב־22% — עם יותר משרה — מקבלת 10% מ־80% בלבד (`a mother at 80% and 22% earns less than one at 78% and 22%`). §1.13.4 סותר את "לשכרה המשולב" שבסעיף 1.13.1 בדיוק במורה שבעלות אחת שלה חוצה את 79%.
"""
reading = "§1.13.4 מקודד כפי שהוא מודפס: בעלות שבה המורה מגיעה ל־79% משלמת את התוספת על חלקה בלבד, ושאר הבעלויות אינן משלמות דבר."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.13.l4"
evidence = "`a mother at 80% and 22% earns less than one at 78% and 22%`"
