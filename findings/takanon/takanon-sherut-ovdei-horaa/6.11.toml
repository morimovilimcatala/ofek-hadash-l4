quote = "דין מחנך בשתי כיתות כדין מחנך בכל אחת משתי הכיתות בנפרד · הערה: מורה יועסק כמחנך בכיתה אחת בלבד"
title = "One clause prices the educator of two classes; another forbids it"
body = """
§6.11.1.2 provides that an educator of two classes is treated as the educator of each class separately, so such a teacher receives the educator's hours of §6.11.1.1 twice. The note to §6.11.3(1) provides that a teacher shall be employed as educator in one class only.

Whether a teacher may be the educator of two classes is answered both ways: the first clause regulates the case as a lawful one, the second forbids it. Written as rules, the hours function gives 6 educator hours for two classes, while the number of classes the note allows is one.
"""
reading = "Both rules stand: the note is a prohibition on whoever assigns educators (read as the principal), and if a teacher is nonetheless the educator of two classes, §6.11.1.2 governs the hours — each class carries its own educator hours."
