body = """
סעיף 4.3א מקבע את המעסיק המשאיל משנקבע, "ובלבד" ששעות עבודתו של המורה בכיתות של המעסיק המשאיל לא יפחתו משליש משרה (כאשר צד א' הוא המשאיל) או ממחצית מסך כל שעות עבודתו בבית־הספר (כאשר צד ב' הוא המשאיל). סעיף 4.3ג משאיר את צד ב' כמעסיק המשאיל של מורה קבוע ששעותיו בחטיבה העליונה ירדו אל מתחת למחצית "כתוצאה מצורכי בית-הספר".

לגבי כל מקרה אחר שבו התנאי אינו מתקיים — שעות אצל צד א' שפחתו משליש משרה מכל סיבה שהיא, או שעות אצל צד ב' שפחתו ממחצית מסיבה שאינה צורכי בית־הספר — ההסכם אינו אומר אם הקביעה פוקעת, אם היא נעשית מחדש לפי סעיף 4, או אם המעסיק האחר הופך למשאיל.
"""
reading = "הקידוד קובע רק את מה שהסעיף קובע: הקביעה עומדת כל עוד התנאי מתקיים, וכן במקרה של 4.3ג; בשאר המקרים הוא אינו מחזיר תשובה, במקום לבחור בין קביעה חדשה לבין החלפת המשאיל."
