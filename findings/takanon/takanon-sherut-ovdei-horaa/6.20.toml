#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-6.20-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_6__sec_6_20/p38"]
quote = "בהיקף משרה זהה, או שונה (ובלבד שההפרש בין היקפי המשרה אינו עולה על 10 אחוז)"
title = "\"A difference of no more than 10 percent\" between the two positions: of what?"
body = """
Clause 4.2ג of the agreement lets a teacher hired by both employers at once choose the lending employer where the examination of the last four years finds the two positions equal, or different provided "the difference between the positions does not exceed 10 percent".

The 10 percent can be read as ten points of a full position (an absolute difference of 0.10 position) or as ten percent of the larger of the two positions. The readings decide differently: positions of 0.50 and 0.44 differ by 0.06 of a position — within ten points — but by 12% of the larger. Under the first reading the teacher chooses; under the second, clause 4.2ב gives the employer with the majority of hours.
"""
reading = "Ten points of a full position: the clause compares \"היקפי המשרה\", which are themselves fractions of a position, so the difference is read in the same unit."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.20.l4"
evidence = "`the two measures of 10 percent decide differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-6.20-b"
kind = "gap"
stage = "writing"
keys = ["chp_6__sec_6_20/p38"]
quote = "ובלבד ששעות עבודתו בכיתות של המעסיק המשאיל לא יפחתו מהיקף של שליש משרה, במקרה שהמעסיק המשאיל הוא צד א' - או מחצית מסך כל שעות עבודתו בבית-הספר, במקרה שהמעסיק המשאיל הוא צד ב'"
title = "The text does not say what happens when the lending employer's hours fall below the proviso"
body = """
Clause 4.3א fixes the lending employer once determined, "provided" the teacher's hours in its classes do not fall below a third of a position (where party A lends) or below half of all the teacher's hours in the school (where party B lends). Clause 4.3ג keeps party B as lender of a permanent teacher whose upper-division hours fell below half "as a result of the school's needs".

For every other case in which the proviso fails — party A's hours below a third of a position for any reason, or party B's below half for a reason other than the school's needs — the agreement does not say whether the determination lapses, is made anew under clause 4, or the other employer becomes the lender.
"""
reading = "The encoding states only what the clause states: the determination stands while the proviso holds, and in 4.3ג's case; for the rest it returns no answer, rather than choosing between a new determination and a change of lender."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.20.l4"
evidence = "`a lender A teacher down to a quarter of a position`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
