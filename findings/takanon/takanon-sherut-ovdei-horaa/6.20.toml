body = """
סעיף 4.2ג להסכם מאפשר למורה שהתקבל לעבודה בו בזמן אצל שני המעסיקים לבחור את המעסיק המשאיל, כאשר בדיקת ארבע השנים האחרונות מעלה שהיקפי המשרה אצל שניהם זהים, או שונים ובלבד "שההפרש בין היקפי המשרה אינו עולה על 10 אחוז".

את 10 האחוזים אפשר לקרוא כעשר נקודות של משרה מלאה (הפרש מוחלט של 0.10 משרה) או כעשרה אחוזים מהגדול מבין שני היקפי המשרה. הקריאות מכריעות אחרת: היקפי משרה של 0.50 ו־0.44 נבדלים ב־0.06 משרה — בתוך עשר נקודות — אך ב־12% מהגדול שבהם. לפי הקריאה הראשונה המורה בוחר; לפי השנייה, סעיף 4.2ב קובע את המעסיק שאצלו רוב השעות.
"""
reading = "עשר נקודות של משרה מלאה: הסעיף משווה בין \"היקפי המשרה\", שהם עצמם שברים של משרה, ולכן ההפרש נקרא באותה יחידה."
