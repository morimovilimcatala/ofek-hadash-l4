# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.31-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_31__hc_2__para_1/p3"]
quote = "עובד הוראה קבוע, עובד הוראה על-פי חוזה מיוחד ועובד הוראה ארעי, המועסק מעל 151 ימים במשך שנת לימודים"
title = "Does \"employed more than 151 days\" qualify every kind of appointment, or only the temporary one?"
body = """
§1.31.1 defines the teaching employee the Ministry's participation is counted on as a permanent employee, an employee under a special contract and a temporary employee, "employed more than 151 days during a school year". The qualifier stands after the last item and can be read as limiting all three or only the temporary employee it follows.

The readings differ for a permanent employee who works 151 days or fewer in a school year (one who joined in the spring, for example): under the first reading the employee is not counted, under the second the employee is.
"""
reading = "The 151 days qualify all three kinds of appointment: the comma sets the qualifier apart from the list as a whole."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.31.l4"
evidence = "`the two readings of the 151 days differ for a permanent teacher`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.31-b"
kind = "broken-reference"
stage = "writing"
keys = ["chp_1ב__sec_1_31__hc_2__para_3__subpara_c", "chp_1ב__sec_1_31__hc_2__para_2"]
quote = "הסכומים המוקצבים למטרות השונות, כמפורט בסעיף 2 לעיל, הם קבועים ואינם ניתנים להעברה ממטרה למטרה"
title = "The fixed sums are \"for the different purposes as detailed in section 2\", and section 2 details none"
body = """
§1.31.3(c) makes the sums allotted "to the different purposes, as detailed in section 2 above" fixed and not transferable from one purpose to another. §1.31.2 names no purposes and no sums: it says only that the Ministry participates in the expenses of "activities of society and culture" for each teaching employee, as set from time to time.

The prohibition on moving money between purposes therefore has nothing in the text to apply to: which purposes exist, and how much is allotted to each, is not stated anywhere in the section.
"""
reading = "The purposes and their sums are whatever the Ministry sets from time to time under §1.31.2; the prohibition is encoded as a prohibition on the two organisations moving money between them, with the purposes left as an input."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.31.l4"
evidence = "`section 1.31.3(c) points at purposes section 1.31.2 does not list`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.31-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_31__hc_2__para_3__subpara_d"]
quote = "יהיו המשתתפים העיקריים, באמצעים משלהם, למימון הפעולות הנ\"ל"
title = "\"The main participants\" in funding: more than half, or more than anyone else?"
body = """
§1.31.3(d) conditions the allocation on the two teachers' organisations being "the main participants, with their own means, in funding" the activities. The text gives no measure. "Main" reads as funding more than half of the cost, or as funding more than any other single participant (the Ministry included).

The readings differ whenever the organisations fund the largest share but not a majority: at 40% from the organisations, 35% from the Ministry and 25% from others, the allocation is barred under the first reading and allowed under the second.
"""
reading = "The organisations must fund more than half of the activities' cost from their own means."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.31.l4"
evidence = "`the two readings of \"main participants\" differ at 40 against 35`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.31-d"
kind = "gap"
stage = "writing"
keys = ["chp_1ב__sec_1_31__hc_2__para_3__subpara_b", "chp_1ב__sec_1_31__hc_2__para_3__subpara_f"]
quote = "בתחילת כל שנת לימודים יגישו … תכנית עבודה · בסוף כל שנת לימודים יגישו … דו\"ח ביצוע"
title = "The work plan is due \"at the start\" and the report \"at the end\" of the school year, and no day is set for either"
body = """
§1.31.3(ב) has the Teachers' Union and the Secondary School Teachers' Association submit a work plan to the management "at the start of each school year", and §1.31.3(ו) has them submit a report on execution "at the end of each school year". Neither names a day, a month or a period.

Written as obligations, each needs a time by which it is breached, and the text gives none: a plan submitted in October is on time if "the start" is the first term and late if it is the first month; a report submitted in September after the year has closed is late or on time by the same choice.
"""
reading = "\"The start\" is the first school month (by the end of September) and \"the end\" the last (by the end of August)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.31.l4"
evidence = "`1.31.3(b) and (f) name no deadline`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
