§6.10.2א.2's arrangement (a 4% coordinator in small schools) is capped at 280 teachers in 5754 and 500 in all over 5754 and 5755. The text states no cap, and no end of the arrangement, for any later school year, while the arrangement itself is stated in the present tense and §6.10.6.1א's second paragraph keeps its 4% rate without a time limit.

Whether the arrangement continues after 5755, and under what cap, is not decided.
"""
reading = "The arrangement is encoded as continuing; the cap is returned only for the two years the text names, and for later years the encoding states no cap (it does not extend 500 or treat the arrangement as ended)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.10.l4"
evidence = "`the cap is stated for no year after 5755`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-6.10-e"
kind = "gap"
stage = "writing"
keys = ["chp_6__sec_6_10__ssec_6_10_6__para_3"]
quote = "הגמול ישולם לו על-ידי הבעלות שבה המקצוע נלמד מרבית השעות"
title = "With equal hours in both divisions, no owner pays the coordination reward"
body = """
§6.10.6.3 treats a six-year school as one institution for the coordination reward and, where two owners pay the coordinator's salary, has the reward paid by "the owner in which the subject is taught most of the hours".

If the subject's hours are split equally between the middle division and the upper division, neither owner has most of the hours, and the clause names no payer — while the next paragraph's duty to notify the other owner presupposes exactly one.
"""
reading = "No payer is chosen: the encoding returns no paying owner for equal hours and leaves the case to be decided, rather than preferring either division."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.10.l4"
evidence = "`equal hours name no paying owner`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
