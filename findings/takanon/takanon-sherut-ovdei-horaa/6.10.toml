#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-6.10-a"
kind = "gap"
stage = "writing"
keys = ["chp_6__sec_6_10__ssec_6_10_2/p1", "chp_6__sec_6_10__ssec_6_10_2__para_a__subpara_1", "chp_6__sec_6_10__ssec_6_10_6__para_2__subpara_a", "chp_6__sec_6_10__ssec_6_10_6__para_1__subpara_b/p2"]
quote = "ימונו מרכזי מקצוע לפי הקריטריונים המפורטים להלן, אך לא פחות ממרכז מקצוע אחד לכל מוסד"
title = "The coordinator every institution must have may have no reward rate"
body = """
§6.10.2's opening paragraph requires subject coordinators in every post-primary institution "by the criteria below, but not fewer than one subject coordinator per institution". The criteria for appointment (§6.10.2א.1: 8 classes, 48 weekly hours, a minimum staff) and the reward rates (§6.10.6.2א–ג: 5%, 6%, 7%; §6.10.6.1א second paragraph: 4% for a coordinator under §6.10.2א.2) all assume a subject of some size.

An institution whose subjects meet none of those conditions — say six classes, a subject taught 20 hours a week by two teachers at a third of a position each, not a "small school" in §6.10.2א.2's sense — must still have one coordinator, and no clause gives that coordinator a rate. Nor does §6.10.2א.1, which permits appointment only in a school of 8 classes or more, say who appoints the coordinator the floor requires.
"""
reading = "The floor is encoded as stated (at least one coordinator); the reward rate is left undecided for a coordinator who meets none of the rate clauses (the encoding returns no rate) rather than borrowing the 4% or 5% rate."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.10.l4"
evidence = "`the floor's coordinator has no rate`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-6.10-b"
kind = "gap"
stage = "writing"
keys = ["chp_6__sec_6_10__ssec_6_10_2__para_a__subpara_1", "chp_6__sec_6_10__ssec_6_10_6__para_2__subpara_a", "chp_6__sec_6_10__ssec_6_10_6__para_2__subpara_b", "chp_6__sec_6_10__ssec_6_10_6__para_2__subpara_c"]
quote = "ומועסקים בהוראתו שני מורים נוספים ב - ½ משרה, או 3 מורים נוספים בפחות מ - ½ משרה"
title = "The staffing condition does not decide a mixed staff"
body = """
The appointment condition (§6.10.2א.1) and each reward tier (§6.10.6.2א–ג) require, besides the hours, either N additional teachers of the subject at half a position or more, or N+1 additional teachers at less than half a position (2 or 3; 4 or 5; 5 or 6).

Neither alternative covers a staff that mixes the two: 48 hours taught by the coordinator and three others, one at half a position and two at less, meets neither "two at half" nor "three at less than half" — although the same school with all three at less than half meets the condition. Read literally, more teaching disqualifies.
"""
reading = "A teacher at half a position or more also counts towards the larger number of teachers the second alternative asks for (N+1 additional teachers of any fraction), so that more teaching never disqualifies."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.10.l4"
evidence = "`a mixed staff meets neither alternative as printed`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-6.10-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_6__sec_6_10__ssec_6_10_2__para_a__subpara_2", "chp_6__sec_6_10__ssec_6_10_6__para_1__subpara_a", "chp_6__sec_6_10__ssec_6_10_6__para_1__subpara_b/p2"]
quote = "וזה יקבל גמול בגובה % 4 משכרו המשולם · יחושב גמול ריכוז מקצוע כאחוז מהמשכורת המשולבת של עובד ההוראה הזכאי לגמול, לפי דרגתו וויתקו"
title = "The 4% reward: of the salary paid, or of the combined salary?"
body = """
§6.10.2א.2 gives the coordinator it creates a reward of 4% "of the salary paid to him" (משכרו המשולם). §6.10.6.1א says the subject coordination reward is computed as a percentage of the combined salary (המשכורת המשולבת) by grade and seniority, and §6.10.6.1א's second paragraph repeats the 4% for the same coordinator without naming a base.

The two bases differ whenever the salary paid is not the combined salary for the grade and seniority — for a part-time coordinator, or one paid other components — and the 4% reward differs with them.
"""
reading = "The base is the combined salary by grade and seniority (§6.10.6.1א), the section that governs how every coordination reward is computed; \"המשולם\" is read as a slip for \"המשולב\"."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.10.l4"
evidence = "`§6.10.2א.2 and §6.10.6.1א price the 4% on different salaries`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

