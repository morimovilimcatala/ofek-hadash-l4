review = "unreviewed"

[[finding]]
id = "F-6.10-g"
kind = "overlap"
stage = "writing"
keys = ["chp_6__sec_6_10__ssec_6_10_6__para_1__subpara_b/p2", "chp_6__sec_6_10__ssec_6_10_6__para_2__subpara_a"]
quote = "עובד הוראה שְמוּנה כמרכז מקצוע כמפורט בסעיף 6.10.2, סעיף קטן א2, זכאי לגמול ריכוז בשיעור של 4% · אשר מספר שעות ההוראה בשבוע בו הוא לפחות 48 שעות, ומועסקים בו לפחות 2 מורים נוספים ב - 1/2 משרה לפחות ... זכאי לגמול ריכוז מקצוע בשיעור של 5%"
title = "A coordinator appointed under §6.10.2א.2 in a subject of §6.10.6.2's size has two rates"
body = """
§6.10.6.1א's second paragraph gives a coordinator appointed under §6.10.2א.2 (the small-school arrangement) a reward of 4%. §6.10.6.2א–ג give "a teaching employee serving as subject coordinator" 5%, 6% or 7% by the subject's weekly hours and staff, without regard to how the coordinator was appointed.

A small school in §6.10.2א.2's sense (no more than two parallel classes on average) can teach a subject 48 hours a week or more with the staff §6.10.6.2א asks for. Its coordinator, appointed under §6.10.2א.2, is then entitled to 4% by one clause and to 5% (or more) by another, and the text does not say which governs.
"""
reading = "The size rate of §6.10.6.2 governs where the subject meets one; 4% is the rate of a §6.10.2א.2 coordinator whose subject meets none."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.10.l4"
evidence = "`a §6.10.2א.2 coordinator of a 48-hour subject has 4% and 5%`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
