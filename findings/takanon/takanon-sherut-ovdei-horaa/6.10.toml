kind = "ambiguity"
stage = "writing"
keys = ["chp_6__sec_6_10__ssec_6_10_2__para_a__subpara_2"]
quote = "במספר בתי-ספר עם מספר כיתות קטן או בתי-ספר שבהם מלמדים שני מורים לפחות את אותו מקצוע, והיקף השעות של כל המורים המלמדים מקצוע זה אינו נופל ממשרה אחת"
title = "Does the one-position floor of §6.10.2א.2 bind the small school too?"
body = """
§6.10.2א.2 lets the district manager recommend a coordinator in "schools with a small number of classes, or schools in which at least two teachers teach the same subject, and the hours of all the teachers of the subject come to no less than one position".

The last condition can be read as part of the second kind of school only (two or more teachers whose hours fill a position), or as a condition on both kinds. The readings differ for a small school whose subject's hours fill less than one position: a coordinator may be recommended on the first reading and not on the second.
"""
reading = "The floor belongs to the second kind of school only, as the order of the words gives: a small school qualifies whatever the subject's hours."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/6.10.l4"
evidence = "`the two readings of §6.10.2א.2 decide a small school differently`"
depends_on = []
