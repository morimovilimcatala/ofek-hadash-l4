# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-1.43-a"
kind = "broken-reference"
stage = "writing"
keys = ["chp_1ב__sec_1_43__hc_2__para_a__subpara_2__cls_f"]
quote = "אין המשרד אחראי לכל נזק למכונית העובד או לגנבתה. לגבי סעיף זה ראה גם ב-ב' להלן."
title = "The car exclusion points to a clause ב that the section does not have"
body = """
§1.43 א.2(ו) says the Ministry is not liable for any damage to, or theft of, the employee's car, and adds "regarding this clause see also ב below". The section has a single lettered clause, א; nothing below it is lettered ב, and nothing else in the section speaks of cars. (The takanon's own page, as mirrored on 2026-06-01, prints the same: no ב.)

Whatever ב was meant to add to the car exclusion — an exception, a procedure, a different source of compensation — is not in the text, so whether the exclusion is absolute cannot be read off it.
"""
reading = "The exclusion of א.2(ו) is applied as written, with no exception: the pointer adds nothing that can be encoded."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.43.l4"
evidence = "`the section has no clause ב for א.2ו to point at`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.43-b"
kind = "overlap"
stage = "writing"
keys = ["chp_1ב__sec_1_43__hc_2__para_a__subpara_2__cls_c", "chp_1ב__sec_1_43__hc_2__para_a__subpara_2__cls_e"]
quote = "אין המשרד אחראי לנזק או לגנבה של חפצים או מכשירים של העובד שהובאו למקום העבודה, אף אם העובד השתמש בהם לצורך מילוי תפקידו · פיצוי בעבור נזק למשקפיים, לעדשות מגע או לאמצעי ראייה אחרים יינתן"
title = "Glasses are both excluded (the employee's own object brought to work) and compensated"
body = """
§1.43 א.2(ג) excludes damage to or theft of the employee's own objects or devices brought to the workplace, "even if he used them for his role". א.2(ה) grants compensation for damage to glasses, contact lenses or other visual aids, on condition that the employee took the necessary precautions.

Glasses worn at work are an object of the employee's that was brought to the workplace, so a pair broken on duty, with every precaution taken, is excluded by (ג) and compensated by (ה). The text does not say which governs.
"""
reading = "(ה) is the specific rule and an exception to (ג): visual aids are compensated when the precautions were taken."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.43.l4"
evidence = "`eyewear brought to work falls under both א.2ג and א.2ה`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.43-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_43__hc_2__para_a__subpara_2__cls_g", "chp_1ב__sec_1_43__hc_2__para_a__subpara_4__cls_f"]
quote = "בגין חפצים, מכשירים וציוד אישי המבוטחים על-ידי העובד בחברת ביטוח לא יאושר כל פיצוי על-ידי המשרד · העתק מפוליסת הביטוח, תוך הפניה לסעיף הכיסוי הביטוחי לנזק שנגרם וכן לסעיף המפרט את סכום ההשתתפות העצמית הכלול בה"
title = "Insured property gets no compensation, yet the claim must show the policy's deductible"
body = """
§1.43 א.2(ז): for objects, devices and personal equipment the employee has insured, "no compensation whatsoever" will be approved. א.4(ו) requires every claim to attach the insurance policy, pointing to the clause covering the damage AND to the clause stating the deductible (השתתפות עצמית).

The deductible matters only if the Ministry might pay it: if insured property gets nothing, the amount of the deductible is irrelevant to any decision the committee can make. Read with א.4(ו), א.2(ז) may mean that the Ministry pays nothing beyond what the insurer pays — that is, it may compensate the uninsured deductible — and the two readings give an employee with an insured object either nothing or the deductible.
"""
reading = "א.2(ז) as written: an insured object is not compensated, deductible included; the policy and its deductible clause are read as information the committee asks for."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.43.l4"
evidence = "`the deductible is asked for although an insured object gets nothing`"
depends_on = ["F-1.43-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
