title = "אחרי תקופת המעבר (31.8.2004) אין ליועץ חדש דרך לרשיון: כל רשיון דורש עבודה קודמת כיועץ, ואיש אינו רשאי לעבוד כיועץ בלי רשיון"
body = """
§3.12.2.1(א) ו־§3.12.7(1) אוסרים על כל אדם לשמש יועץ בלי רשיון לייעוץ, קבוע או זמני. הרשיון הקבוע (§3.12.2.2) דורש, בין תנאיו המצטברים, העסקה כיועץ בפיקוח שפ"י לפחות שנתיים (ג). הרשיון הזמני (§3.12.2.3) דורש להיות תלמיד מן המניין בשנה ב' לתואר שני בייעוץ (א) וגם להיות מועסק כיועץ בפיקוח שפ"י (ג).

כך ששני הרשיונות מניחים עבודה כיועץ, שהרשיון נדרש לשם ביצועה. מסלולי המעבר של §3.12.2.4 שברו את המעגל — רשיון זמני על פי המלצת היועץ הבכיר, רשיון קבוע על פי תואר ראשון יחד עם תעודת הוראה — אבל הם הסתיימו ב־31.8.2004. אחרי אותו יום, מועמד שמעולם לא שימש יועץ, כשיר ככל שיהיה (תואר שני בייעוץ שהושלם ותעודת הוראה ישראלית), אינו עומד באף מסלול; ומי שסיים את התואר השני אינו גם "תלמיד בשנה ב'", כך שאפילו תנאי (א) של הרשיון הזמני מוציא את הכשירים ביותר.
"""
reading = "הכללים מקודדים כפי שהם מודפסים, והקידוד מחזיר \"אין רשיון לייעוץ\" למועמד כזה אחרי תקופת המעבר. כיצד מאוישת כדין משרת ייעוץ ראשונה אחרי 2004 (אם בסעיף הקשיים באיוש של §3.12.2.1(ג), או בקריאה של \"מועסקים כיועצים\" הכוללת שיבוץ במסגרת בקשה לרשיון) — נשאר לקורא ממצא זה."
