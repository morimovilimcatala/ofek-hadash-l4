quote = "כל עובד הוראה המשמש יועץ ... חייב ברשיון · ג. מועסקים כיועצים בארץ בפיקוח שפ\"י לפחות שנתיים · ג. מועסקים כיועצים בפיקוח שפ\"י לשביעות רצון הפיקוח · כמורה-יועץ ... יועסק רק מורה-יועץ בעל רישיון לייעוץ, קבוע או זמני"
title = "After the transition (31.8.2004) a new counsellor has no route to a licence: every licence requires prior work as a counsellor, and no one may work as one unlicensed"
body = """
§3.12.2.1(א) and §3.12.7(1) forbid anyone to serve as a counsellor without a counselling licence, permanent or temporary. The permanent licence (§3.12.2.2) requires, among its cumulative conditions, at least two years' employment as a counsellor under שפ"י's supervision (ג). The temporary licence (§3.12.2.3) requires being a regular student in the second year of a counselling master's (א) AND being employed as a counsellor under שפ"י's supervision (ג).

So both licences presuppose work as a counsellor, which the licence is required for. The transitional routes of §3.12.2.4 broke the circle — a temporary licence on the senior counsellor's recommendation, a permanent one on a bachelor's degree with a teaching certificate — but they ended on 31.8.2004. After that day a candidate who has never served as a counsellor, however qualified (a completed counselling master's and an Israeli teaching certificate), meets no route; and one who has finished the master's is not "a student in the second year" either, so even the temporary licence's (א) excludes the best qualified.
"""
reading = "The rules are encoded as printed, and the encoding returns \"no counselling licence\" for such a candidate after the transition. How a first counselling post is lawfully filled after 2004 (whether §3.12.2.1(ג)'s hard-to-fill clause, or a reading of \"employed as counsellors\" that includes a placement under a licence application) is left to the reader of this finding."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.12.l4"
evidence = "`after the transition a newcomer can neither be licensed nor work unlicensed`"
