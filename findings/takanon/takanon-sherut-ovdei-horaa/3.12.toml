quote = "כל עובד הוראה המשמש יועץ ... חייב ברשיון · ג. מועסקים כיועצים בארץ בפיקוח שפ\"י לפחות שנתיים · ג. מועסקים כיועצים בפיקוח שפ\"י לשביעות רצון הפיקוח · כמורה-יועץ ... יועסק רק מורה-יועץ בעל רישיון לייעוץ, קבוע או זמני"
title = "After the transition (31.8.2004) a new counsellor has no route to a licence: every licence requires prior work as a counsellor, and no one may work as one unlicensed"
body = """
§3.12.2.1(א) and §3.12.7(1) forbid anyone to serve as a counsellor without a counselling licence, permanent or temporary. The permanent licence (§3.12.2.2) requires, among its cumulative conditions, at least two years' employment as a counsellor under שפ"י's supervision (ג). The temporary licence (§3.12.2.3) requires being a regular student in the second year of a counselling master's (א) AND being employed as a counsellor under שפ"י's supervision (ג).

So both licences presuppose work as a counsellor, which the licence is required for. The transitional routes of §3.12.2.4 broke the circle — a temporary licence on the senior counsellor's recommendation, a permanent one on a bachelor's degree with a teaching certificate — but they ended on 31.8.2004. After that day a candidate who has never served as a counsellor, however qualified (a completed counselling master's and an Israeli teaching certificate), meets no route; and one who has finished the master's is not "a student in the second year" either, so even the temporary licence's (א) excludes the best qualified.
"""
reading = "The rules are encoded as printed, and the encoding returns \"no counselling licence\" for such a candidate after the transition. How a first counselling post is lawfully filled after 2004 (whether §3.12.2.1(ג)'s hard-to-fill clause, or a reading of \"employed as counsellors\" that includes a placement under a licence application) is left to the reader of this finding."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.12.l4"
evidence = "`after the transition a newcomer can neither be licensed nor work unlicensed`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-3.12-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_3__sec_3_12__ssec_3_12_2__para_2__subpara_b/p4", "chp_3__sec_3_12__ssec_3_12_2__para_3__subpara_b", "chp_3__sec_3_12__ssec_3_12_2__para_4__subpara_a__cls_1", "chp_3__sec_3_12__ssec_3_12_2__para_4__subpara_a__cls_3"]
quote = "או: בעלי תעודת הוראה או רשיון הוראה מחו\"ל שהוכרו על ידי משרד החינוך בישראל · ב. בעלי תעודת הסמכה להוראה מהארץ, כמצויין בסעיף 2 ב' לעיל. · שהם בעלי תעודת הסמכה להוראה מהארץ או רשיון הוראה קבוע"
title = "Does \"a teaching certification from Israel, as in 2(b)\" include 2(b)'s certificate from abroad and its permanent licence?"
body = """
§3.12.2.2(ב) lists four alternative teaching qualifications for a permanent counselling licence: a teaching certificate from a recognised Israeli training institution, a Ministry certified-teacher certificate, a permanent teaching licence, or a teaching certificate or licence FROM ABROAD recognised by the Ministry (its holder having completed Hebrew education in Israel).

The temporary licence (§3.12.2.3(ב)) and the transitional permanent licence (§3.12.2.4(א)(1)) then require "a teaching certification FROM ISRAEL (מהארץ), as stated in 2(ב)". Read by its pointer, that is all four alternatives; read by its words, the foreign alternative is excluded. §3.12.2.4(א)(3) points the other way again: it asks for "a teaching certification from Israel OR a permanent teaching licence", which would be redundant if the phrase already included 2(ב)'s permanent licence. A candidate qualified only by a recognised foreign certificate meets the conditions on the first reading and not on the second.
"""
reading = "The phrase means all of 2(ב), the four alternatives: the pointer \"as stated in 2(ב)\" is the more specific, and the foreign alternative itself requires completing Hebrew education and certification in Israel. §3.12.2.4(א)(3)'s separate mention of a permanent licence is then redundant."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.12.l4"
evidence = "`a certificate from abroad counts as a teaching certification \"from Israel, as in 2(b)\"`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
