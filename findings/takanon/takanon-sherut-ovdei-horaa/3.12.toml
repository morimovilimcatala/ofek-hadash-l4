keys = ["chp_3__sec_3_12__ssec_3_12_2__para_2__subpara_b/p4", "chp_3__sec_3_12__ssec_3_12_2__para_3__subpara_b", "chp_3__sec_3_12__ssec_3_12_2__para_4__subpara_a__cls_1", "chp_3__sec_3_12__ssec_3_12_2__para_4__subpara_a__cls_3"]
quote = "או: בעלי תעודת הוראה או רשיון הוראה מחו\"ל שהוכרו על ידי משרד החינוך בישראל · ב. בעלי תעודת הסמכה להוראה מהארץ, כמצויין בסעיף 2 ב' לעיל. · שהם בעלי תעודת הסמכה להוראה מהארץ או רשיון הוראה קבוע"
title = "האם \"תעודת הסמכה להוראה מהארץ, כמצויין בסעיף 2 ב'\" כוללת את התעודה מחו\"ל ואת רשיון ההוראה הקבוע של 2(ב)?"
body = """
§3.12.2.2(ב) מונה ארבע חלופות של כשירות להוראה לצורך רשיון קבוע לייעוץ: תעודת הוראה ממוסד מוכר להכשרת עובדי הוראה בארץ, תעודת מורה מוסמך מטעם המשרד, רשיון הוראה קבוע, או תעודת הוראה או רשיון הוראה מחו"ל שהוכרו על ידי המשרד (כאשר בעליהם השלים את השכלתו העברית בארץ).

הרשיון הזמני (§3.12.2.3(ב)) והרשיון הקבוע של תקופת המעבר (§3.12.2.4(א)(1)) דורשים אחר כך "תעודת הסמכה להוראה מהארץ, כמצויין בסעיף 2 ב'". בקריאה לפי ההפניה, אלה כל ארבע החלופות; בקריאה לפי המילים, החלופה מחו"ל מוצאת. §3.12.2.4(א)(3) מצביע שוב לכיוון ההפוך: הוא דורש "תעודת הסמכה להוראה מהארץ או רשיון הוראה קבוע", דבר שהיה מיותר אילו הביטוי כבר כלל את רשיון ההוראה הקבוע של 2(ב). מועמד שכשירותו היא רק תעודה מחו"ל שהוכרה עומד בתנאים לפי הקריאה הראשונה ואינו עומד בהם לפי השנייה.
"""
reading = "הביטוי פירושו כל 2(ב), ארבע החלופות: ההפניה \"כמצויין בסעיף 2 ב'\" היא הספציפית יותר, והחלופה מחו\"ל עצמה דורשת השלמת השכלה עברית והסמכה בארץ. האזכור הנפרד של רשיון קבוע ב־§3.12.2.4(א)(3) הוא אז מיותר."
