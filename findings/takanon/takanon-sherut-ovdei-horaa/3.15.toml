title = "A rhythmics teacher's supervised work of under 10 weekly hours is counted by neither seniority rule"
body = """
§3.15.3(3) counts a rhythmics teacher's past work for seniority in two sub-clauses: (a) work in schools and kindergartens under the Ministry's supervision, of at least 10 weekly hours, counts in full; (b) work in institutions that were not under supervision counts for half.

Work in SUPERVISED institutions of fewer than 10 weekly hours falls under neither: not (a), which needs 10 hours, and not (b), which is about unsupervised institutions. Read strictly it counts for nothing — less than the same hours in an unsupervised institution, which earn half — and the text does not say whether that is meant.
"""
reading = "Such work counts for no seniority under §3.15.3(3), the strict reading of the two sub-clauses; the encoding marks it as governed by neither."
