# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.21-a"
kind = "contradiction"
stage = "writing"
keys = ["chp_1א___sec_1_21__ssec_1_21_3_1/p3"]
quote = "תחולת תקנות זה מיום ו' באלול התשנ\"ה (1 בינואר 1996)"
title = "The technological regulations' start date is given as two different days"
body = """
§1.21.3.1(3) dates the technological licensing regulations "from ו' באלול התשנ\"ה (1 January 1996)". By the Hebrew calendar 6 Elul 5755 is 1 September 1995; 1 January 1996 is 9 Tevet 5756. The parenthesis does not restate the Hebrew date, it names another day four months later.

The same sentence keeps the 1982 regulations for one who began training "before the end of the school year", which the two dates place in different school years (5755 ends on 31.8.1995, 5756 on 31.8.1996). Which regulations govern a licence turns on the day chosen.
"""
reading = "The civil date, 1.1.1996, is taken as the start, since the clause spells it out as the date; the 1982 regulations govern one who began training before it."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.21.l4"
evidence = "`the effective date is printed as two different days`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.21-b"
kind = "broken-reference"
stage = "writing"
keys = ["chp_1א___sec_1_21__ssec_1_21_2_3/p58"]
quote = "רשיון הוראה קבוע לחטיבת הביניים יונפק על פי ההוראות בסעיף ב' לעיל, פרט לסעיף קטן (ג)."
title = "The Bible's junior-high licence points at a \"section ב'\" that holds no junior-high rule"
body = """
For the junior high school, the Bible licence is issued "by the instructions of section ב' above, except subsection (ג)". §1.21.2.2 numbers its paragraphs 1 to 4; it has no section ב'. Read as its second paragraph, that paragraph licenses grades 7–12, not the junior high, and its (ג) is an Israeli second-degree route — not the foreign-diploma route the exception is evidently meant to leave out.

Every other special subject (Jewish thought, Middle East studies, the Oral Law, Hebrew, computer science, and others) sends its junior-high licence to "section 4 above, except subsection (ג)" — §1.21.2.2(4), whose (ג) is the junior-high route for foreign certificates.
"""
reading = "\"Section ב'\" is read as §1.21.2.2(4), the junior-high paragraph, without its (ג), as for every other subject."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.21.l4"
evidence = "`\"section ב', except (ג)\" does not name the junior-high rules`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.21-c"
kind = "contradiction"
stage = "writing"
keys = ["chp_1א___sec_1_21__ssec_1_21_2_7/p46"]
quote = "עובד הוראה שלימד בבית ספר עברי בא\"י לפני קום המדינה פטור מבחינות במקצועות הפדגוגיים. אם הוא לימד בבית ספר על-יסודי, הוא פטור מכל הבחינות, ואם הוא לימד ביסודי, הוא חייב להשלים בחינה בפסיכולוגיה של גיל הנעורים."
title = "A pre-State primary teacher is both exempt from and required to sit adolescent psychology"
body = """
§1.21.2.7, chapter ה' 3(יא), first exempts every teacher who taught in a Hebrew school in the Land of Israel before the State "from the exams in the pedagogical subjects", then says that one who taught in a primary school "must complete an exam in the psychology of adolescence". The chapter's own list of pedagogical exams (chapter ד', 1) has adolescent psychology first.

The first sentence exempts the primary teacher from that exam and the last requires it.
"""
reading = "The last sentence is the proviso: a pre-State post-primary teacher is exempt from every exam; a pre-State primary teacher is exempt from the pedagogical exams except adolescent psychology."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.21.l4"
evidence = "`the pre-State primary teacher is exempt from and required to sit adolescent psychology`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.21-d"
kind = "gap"
stage = "writing"
keys = ["chp_1א___sec_1_21__ssec_1_21_2_5/p2"]
quote = "בעל תואר אקדמי במקצוע מסוים, שקיבל תעודת הוראה במקצוע אחר ממוסד מוכר להשכלה גבוהה או ממוסד מוכר להכשרת עובדי הוראה (המכשירה לחט\"ב או לעל-יסודי), זכאי לרשיון הוראה קבוע במקצוע האחר."
title = "The exceptional licence for a certificate in another subject names no grades"
body = """
§1.21.2.5(א) entitles a graduate in one subject who holds a teaching certificate in another to "a permanent licence in the other subject". Every other permanent route of §1.21.2 names the grades it licenses (7–12, 7–10 or the junior high), and the grades turn on the degree's level or the certificate's; (א) names none.

For a first-degree holder with a post-primary certificate, the general rule of §1.21.2.2 (a first degree for grades 7–10) and the certificate's own level (post-primary) give different licences.
"""
reading = "The general rule of §1.21.2.2 by the degree's level: a first degree licenses grades 7–10, a second or third degree 7–12."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.21.l4"
evidence = "`1.21.2.5(א) states no grades of its own`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
