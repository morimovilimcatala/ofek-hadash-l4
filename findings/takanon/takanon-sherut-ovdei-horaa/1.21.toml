body = """
§1.21.2.6, בפסקה "רשיון הוראה זמני מוענק לשתי שנות העבודה הראשונות…", נותן רישיון זמני לשנתיים, ובמקרים חריגים לשנה אחת בלבד. הפסקה שאחריה ("הרשיון ניתן להארכה לשנה השלישית…") מאריכה את הרישיון "לשנה השלישית", ובמקרים חריגים ביותר לרביעית.

בדיקה ממצה של כל שנה מ־0 עד 6 ושל כל צירוף של שנה חריגה, הארכה ואישור מיוחד, בתנאי שכל שנה מכוסה רק אם כל השנים שלפניה מכוסות, מצאה שהקידוד הקודם כיסה את השנה השלישית ברישיון לשנה אחת שהוארך, בלי לכסות את השנייה. ההארכה "לשנה השלישית" באה בדיוק אחרי רישיון לשנתיים; לרישיון לשנה אחת הטקסט אינו אומר אם הוא ניתן להארכה, ואם כן — לשנה השנייה או לשלישית (`the extension to the third year follows only the two-year licence`).
"""
