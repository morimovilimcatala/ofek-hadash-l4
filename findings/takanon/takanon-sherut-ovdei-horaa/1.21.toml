§1.21.2.5(א) מזכה בעל תואר אקדמי במקצוע אחד שקיבל תעודת הוראה במקצוע אחר ב"רשיון הוראה קבוע במקצוע האחר". כל מסלול קבוע אחר של §1.21.2 נוקב בכיתות שהוא מעניק להן רישיון (ז'–י"ב, ז'–י' או חטיבת הביניים), והכיתות תלויות ברמת התואר או ברמת התעודה; (א) אינו נוקב באף אחת.

לבעל תואר ראשון עם תעודה לעל־יסודי, הכלל הכללי של §1.21.2.2 (תואר ראשון לכיתות ז'–י') והרמה של התעודה עצמה (על־יסודי) נותנים רישיונות שונים.
"""
