quote = "המתמחה רשאי לחלק את עבודתו בין ההוראה להדרכת הנוער באותה שנה, בתנאי שסך שעות העבודה בהוראה יגיע יחד לכדי שליש משרה לפחות."
title = "A social-community intern splitting the year: must the TEACHING reach a third of a position, or teaching and guidance together?"
body = """
§3.20.1.9.3 lets an intern in the social-community field divide the year's work between teaching and youth guidance, "provided that the total of the hours of work in teaching reaches together at least a third of a position".

"In teaching" names one of the two kinds of work; "together" and "total" join them. Read the first way, the teaching alone must reach a third of a position and the guidance is extra; read the second, teaching and guidance together must reach it. For an intern with a fifth of a position in each, the year is recognised under the second reading and not under the first.
"""
reading = "Teaching and guidance together must reach a third of a position: the clause is about dividing the year's work between the two, \"together\" and \"total\" join them, and §3.20.1.8.3 sets the same kind of joint threshold (\"the total hours of employment in both roles\")."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.20.l4"
evidence = "`the two readings of 1.9.3 differ for a fifth and a fifth`"
