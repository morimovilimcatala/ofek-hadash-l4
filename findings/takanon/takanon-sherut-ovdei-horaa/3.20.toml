title = "A PE intern's work in the school sports club: are the \"at least 4 weekly hours\" the PE teaching's or the club's?"
body = """
§3.20.1.8.3 recognises an intern's employment in a school sports club "alongside his work teaching physical education in the same school, at a scope of at least 4 weekly hours", provided the two roles together reach a third of a position.

The scope "at least 4 weekly hours" stands next to the PE teaching, but the sentence is about the club employment it recognises, and either can be what is measured. An intern who teaches 3 weekly hours of PE and works 5 in the club, a third of a position in all, is recognised on the second reading and not on the first.
"""
reading = "The 4 weekly hours are the PE teaching's: the phrase follows \"his work teaching physical education in the same school\" directly, and the club work is recognised as an addition to that teaching."
