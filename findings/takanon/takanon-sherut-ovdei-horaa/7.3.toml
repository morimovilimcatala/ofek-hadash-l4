# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-7.3-a"
kind = "gap"
stage = "writing"
keys = ["chp_7__sec_7_3/p20", "chp_7__sec_7_3/p25", "chp_7__sec_7_3/p29", "chp_7__sec_7_3/p33"]
quote = "שבו 30 כיתות ומעלה - ניתן למנות סגן שלישי וכן הלאה"
title = "\"And so on\": no number of classes is given for a fourth deputy"
body = """
§7.3.2(1) gives, for each kind of institution, the number of classes from which a first, a second and a third deputy may be appointed (primary 12/21/30; post-primary and special education 10/19/28; teacher training 7/14/21), and ends each row with "a third deputy may be appointed, and so on" (וכן הלאה).

The text does not say at what number of classes a fourth or later deputy is justified. Read only as printed, a primary school of 39 classes and one of 60 are both allowed three; "and so on" implies more without saying how many classes each further deputy needs.
"""
reading = "\"And so on\" continues each row's own step — 9 classes per further deputy for primary, post-primary and special education schools, 7 for teacher training institutions — so a primary school reaches a fourth deputy at 39 classes. The reading agrees with every printed row."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/7.3.l4"
evidence = "`the table gives no fourth deputy's threshold`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"


[[finding]]
id = "F-7.3-b"
kind = "gap"
stage = "writing"
keys = ["chp_7__sec_7_3__ssec_3_5"]
quote = "מועמד שלא הוזמן לריאיון בפני ועדת הבחירה יקבל על כך הודעה מנומקת בכתב"
title = "A candidate not invited to interview \"shall receive\" a reasoned written notice, from no one named"
body = """
Line 3.5 of what the corpus keeps of §7.3.2's selection procedure gives a candidate who was not invited to an interview before the selection committee a reasoned written notice. It is written in the passive of the receiver ("יקבל"): it says who receives the notice and not who must give it, so the duty it creates has no one it binds.

The lines the corpus keeps name the district manager (who appoints the committee) and the selection committee (which recommends); either could be the sender, and nothing in the text chooses.
"""
reading = "The notice is a duty of the body that runs the selection, named in the L4 as `the appointing body` without deciding whether that is the committee or the district manager."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/7.3.l4"
evidence = "`section 3.5 names no one to give the notice`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
