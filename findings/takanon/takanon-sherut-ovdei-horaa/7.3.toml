בדיקה על כל חודש מרס בשנים 2020 עד 2030 מראה ששתי הקריאות מסכימות רק בשנים שבהן 1 במרס חל ביום ראשון (2020 ו־2026), ונפרדות בתשע השנים האחרות. ב־2025, למשל, השבוע הקלנדרי השלישי מסתיים ב־15 במרס, שישה ימים לפני 21 במרס.
"""
