title = "\"תחולה 1.9.69\" של §7.3.1(2)ב: רפורמה שבוצעה מיום זה, או השעות מיום זה?"
body = """
§7.3.1(2)ב ("על אף האמור לעיל, מנהלי בתי ספר יסודיים וסגניהם…") מגן על מנהל או סגן בן 50 ומעלה ביום ביצוע הרפורמה, ומסתיים ב"תחולה 1.9.69" בלי לומר במה התחולה נמדדת. אם היא נמדדת ביום ביצוע הרפורמה, מי שבית ספרו עבר רפורמה לפני 1.9.69 אינו מוגן לעולם. אם היא נמדדת בחודש שעליו משולמות השעות, הוא מוגן מ־1.9.69 ואילך.

בדיקה על כל מנהל (כיתות שהופחתו או לא, בני 49 עד 51, רפורמה ב־1.9.68, ב־31.8.69 וב־1.9.69) ועל החודשים 31.8.69, 1.9.69 ו־1.9.70 מראה ששתי הקריאות נפרדות בדיוק אצל בן 50 ומעלה שכיתותיו הופחתו ברפורמה שבוצעה לפני 1.9.69, בחודש מ־1.9.69 ואילך. ס"ק ג' שאחריו, שתחולתו 1.9.92, נקרא בקידוד לפי החודש.
"""
reading = "התחולה נמדדת ביום ביצוע הרפורמה (`(2)ב protects his management and teaching hours`): רפורמה שבוצעה לפני 1.9.69 אינה מוגנת."
