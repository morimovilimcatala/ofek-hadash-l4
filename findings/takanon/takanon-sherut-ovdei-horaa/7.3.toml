body = """
§7.3.2(1) gives, for each kind of institution, the number of classes from which a first, a second and a third deputy may be appointed (primary 12/21/30; post-primary and special education 10/19/28; teacher training 7/14/21), and ends each row with "a third deputy may be appointed, and so on" (וכן הלאה).

The text does not say at what number of classes a fourth or later deputy is justified. Read only as printed, a primary school of 39 classes and one of 60 are both allowed three; "and so on" implies more without saying how many classes each further deputy needs.
"""
