quote = "במספר בתי-ספר עם מספר כיתות קטן, או בתי-ספר שבהם מלמדים שני מורים לפחות אותו המקצוע, והיקף השעות של כל המורים המלמדים מקצוע זה אינו נופל ממשרה אחת, יוכל מנהל המחוז להמליץ על מינוי מרכז"
title = "Does the one-position hours condition for a district-recommended coordinator govern small schools too?"
body = """
§3.14.3 lets the district manager recommend a coordinator (at 4% of the combined salary) in two kinds of school — "schools with a small number of classes, or schools in which at least two teachers teach the same subject" — followed by ", and the hours of all teachers of the subject are not less than one position".

The hours condition can be read as governing both kinds of school or only the second. For a small school whose teachers of the subject hold less than one position between them, the first reading refuses the recommendation and the second allows it.
"""
reading = "The hours condition governs both kinds of school: the coordination allowance presupposes a subject taught to the extent of a position, and nothing in the clause sets small schools free of it."
