quote = "גננת שילוב (לשעבר גננת שי\"ח) זכאית לגמול חינוך. ראה סעיף 1.12 · (§1.12:) לגמול חינוך כיתה יהיו זכאים החל מ - 1.11.83 גם גננות, למעט … גננות מסייעות, גננות שילוב"
title = "§2.7.6.5 grants the integration teacher the education allowance and sends to §1.12, which excepts her"
body = """
§2.7.6.5 says an integration kindergarten teacher is entitled to the education allowance and refers to §1.12 for it. §1.12, in the very paragraph that extends the class-education allowance to kindergarten teachers from 1.11.83, excepts "גננות שילוב" — integration kindergarten teachers — by name, together with assisting kindergarten teachers and those entitled to the coordination allowance.

The cross-reference sends the reader to a rule that denies what the referring clause grants. Neither clause carries a date that would make one the later; §2.7.6.5 cites no source at all.
"""
reading = "§2.7.6.5's own words are encoded: the integration teacher is entitled; the amount is §1.12's, a named input. Which governs is for the lawyer."
