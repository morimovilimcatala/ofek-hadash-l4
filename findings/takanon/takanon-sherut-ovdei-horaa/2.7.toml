quote = "גננת המועסקת עד 1/3 המשרה (ועד בכלל), תועסק שני ימים בשבוע. גננת המועסקת מעל ל - 1/2 ועד ל - 3/4 המשרה (ועד בכלל), תועסק 4 ימים בשבוע. גננת המועסקת מעל ל - 3/4 המשרה, תועסק 5 ימים בשבוע."
title = "The days-a-week table skips positions above a third and up to a half"
body = """
§2.7.1.2 sets the most days a week an integration teacher's position may be split across, in three bands: up to 1/3 of a position (inclusive), two days; above 1/2 and up to 3/4 (inclusive), four days; above 3/4, five days.

Nothing is said for a position above 1/3 and up to 1/2 — 0.4 or exactly half a position, both common — so for those teachers the text sets no maximum at all, and the protection the table gives the others against being split across many days does not reach them. (The takanon's own page, as mirrored on 2026-06-01, prints the same three bands.)
"""
reading = "No maximum is encoded for that band: the encoding returns no number for it rather than inventing one (three days would be the obvious guess)."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/2.7.l4"
evidence = "`a position between a third and a half has no maximum`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

