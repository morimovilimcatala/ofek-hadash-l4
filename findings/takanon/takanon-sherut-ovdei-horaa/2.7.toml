quote = "יחידת העבודה במשרה מלאה היא: 28 + 2 ש\"ש (סה\"כ 30 ש\"ש - 28 ש\"ש עבודה עם תלמידים + 2 ש\"ש הדרכה) · 2.7.6.3 תוספות בעבור שעות ייעוץ · בנוסף לעבודתה השוטפת בגן, זכאית גננת שילוב לתוספת בעבור שעות הכנה · ל - 26 ש\"ש (+ 2 ש\"ש הכנה)"
title = "The full position's \"2 guidance hours\" and the \"preparation hours\" supplement: one pair of hours or two?"
body = """
§2.7.1.1 defines a full position as 28 + 2 weekly hours: 28 with pupils and 2 "guidance" (הדרכה) hours, 30 in all. §2.7.6.3, headed "supplements for counselling (ייעוץ) hours", grants "in addition to her regular work" a supplement of "preparation" (הכנה) hours: two for 20-28 weekly hours. §2.7.7 writes the age-reduced positions as 26 or 24 hours "(+ 2 preparation hours)" — the same shape as the unit's 28 + 2.

Three names are given to two hours. If the unit's guidance hours ARE the preparation supplement, a full position is paid 30 hours; if the supplement is "in addition", it is paid 32. The text does not say which.
"""
reading = "They are the same two hours (2.7.7's \"28 + 2 preparation\" mirrors the unit's \"28 + 2\"): a full position is the unit's 30 hours."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/2.7.l4"
evidence = "`the unit's guidance hours and the preparation hours read as one or two`"
depends_on = []
