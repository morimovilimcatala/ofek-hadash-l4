§3.1.3: עובד הוראה שעבד לפחות עשר מתוך שבע־עשרה השנים האחרונות בכיתות ז'-ח', אחת מהן בתוך שבע השנים האחרונות, ועבר לכיתות א'-ו', שומר על בסיס משרתו; שעות הזכאות שלו הן הממוצע של עשר השנים האחרונות שבהן לימד בכיתות ז'-ח'. §3.1.4ב.2: מורה בבית־ספר שכיתות ז'-ח' שלו הועברו עקב הרפורמה לחטיבת הביניים, ושלא שובץ בכיתות ז'-ח' במקום אחר, מקבל שכר בעד הוראה בכיתות א'-ו' כך שממוצע שעותיו בכיתות ז'-ח' בשלוש השנים האחרונות משולם לפי בסיס של 24 ש"ש ושאר השעות לפי בסיס של 30 ש"ש.

מורה שהרפורמה העבירה ושיש לו גם עשר שנים בכיתות ז'-ח' מתוך שבע־עשרה האחרונות עומד בשני הסעיפים, והם נותנים מספרים שונים: בממוצע של 24 שעות בעשר שנים וממוצע של 12 בשלוש שנים, כשהוא מלמד 30 שעות בכיתות א'-ו', §3.1.3 נותן 1.2 משרות ו־§3.1.4ב.2 נותן 1.1. הטקסט אינו אומר איזה מהם גובר. (§3.1.4 נשען על מסמכים מהשנים 1979–1981, §3.1.3 על ההסכם מהשנים 1993–1994.)
