[[finding]]
id = "F-3.1-a"
kind = "overlap"
stage = "writing"
keys = ["chp_3__sec_3_1__hc_2__para_3", "chp_3__sec_3_1__hc_2__para_4__subpara_b__cls_2"]
quote = "בסיס משרתו לא ישתנה. חישוב שעות הזכאות יהיה לפי ממוצע של 10 השנים האחרונות, שבהן לימד בכיתות ז'- ח' · ממוצע שעות שהורו בשלוש השנים האחרונות בכיתות ז'-ח' לפי 24 ש\"ש, ושאר השעות - לפי 30 ש\"ש"
title = "A reform-moved teacher with ten years of grades 7-8 meets 3.1.3 and 3.1.4ב.2, which protect different averages"
body = """
§3.1.3: a teacher who worked at least ten of the last seventeen years in grades 7-8, one of them within the last seven, and moved to grades 1-6, keeps the base of her position; her hours of entitlement are the average of her last ten years in 7-8. §3.1.4ב.2: a teacher of a school whose grades 7-8 the reform moved to a junior high school, not placed in 7-8 elsewhere, is paid for teaching grades 1-6 with the average of her 7-8 hours over the last THREE years on the 24-hour base and the rest on the 30-hour base.

A teacher the reform moved who also has ten years of 7-8 in the last seventeen meets both clauses, and they give different numbers: with a ten-year average of 24 hours and a three-year average of 12, teaching 30 hours in grades 1-6, §3.1.3 gives 1.2 positions and §3.1.4ב.2 gives 1.1. The text does not say which governs. (§3.1.4 rests on 1979-81 instruments, §3.1.3 on the 1993-94 agreement.)
"""
reading = "§3.1.3, the later rule, which says outright that the base does not change, governs wherever its conditions are met; §3.1.4ב.2 applies to the reform-moved teacher who does not meet them."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.1.l4"
evidence = "`3 and 4ב.2 price the same teacher differently`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-3.1-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_3__sec_3_1__hc_2__para_4__subpara_a", "chp_3__sec_3_1__hc_2__para_4__subpara_b"]
quote = "שעבדו בשלוש השנים האחרונות בכיתות ז'-ח' באותם בתי ספר, חייב המשרד להעביר מורים אלה · מורים כנ\"ל , שאין המשרד חייב להעבירם לחטיבת ביניים"
title = "§3.1.4ב's teachers are those §3.1.4א does not bind the Ministry for, and whether that set is empty turns on how \"in the last three years\" is read"
body = """
§3.1.4א binds the Ministry to transfer to the junior high school the teachers of a school whose grades the reform moved "who worked in grades 7-8 in the last three years in those schools". §3.1.4ב then speaks of "such teachers, whom the Ministry is not bound to transfer", and gives them an effort to be placed elsewhere and, failing it, the 4ב.2 pay key.

The text does not say who those teachers are. Read as "in (some of) the last three years", §3.1.4א binds the Ministry for every teacher of the school who taught 7-8 at all in that time, and §3.1.4ב is left with nobody it can describe as "such teachers". Read as "in each of the last three years", a teacher with two of the three years in 7-8 is not bound for, and is a §3.1.4ב teacher. The two readings sort the same teacher differently.
"""
reading = "\"In the last three years\" is read as all three: §3.1.4א binds the Ministry for the teachers who taught 7-8 in that school in each of the last three years, and §3.1.4ב's teachers are those who taught 7-8 there in only some of them."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/3.1.l4"
evidence = "`the two readings of 4א sort a two-year teacher differently`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
