title = "המורים של §3.1.4ב הם אלה שלגביהם §3.1.4א אינו מחייב את המשרד, והשאלה אם קבוצה זו ריקה תלויה בקריאת \"בשלוש השנים האחרונות\""
body = """
§3.1.4א מחייב את המשרד להעביר לחטיבת הביניים את המורים בבית־ספר שכיתותיו הועברו עקב הרפורמה "שעבדו בשלוש השנים האחרונות בכיתות ז'-ח' באותם בתי ספר". §3.1.4ב מדבר אחר כך על "מורים כנ"ל, שאין המשרד חייב להעבירם", ונותן להם מאמץ לשבצם במקום אחר ובהיעדרו את מפתח השכר של 4ב.2.

הטקסט אינו אומר מי הם המורים האלה. בקריאה "ב(חלק מ)שלוש השנים האחרונות", §3.1.4א מחייב את המשרד לגבי כל מורה בבית־הספר שלימד בכיתות ז'-ח' בכלל באותה תקופה, ול־§3.1.4ב לא נותר איש שאפשר לתארו כ"מורים כנ"ל". בקריאה "בכל אחת משלוש השנים האחרונות", מורה ששתיים משלוש השנים שלו היו בכיתות ז'-ח' אינו מחייב את המשרד, והוא מורה של §3.1.4ב. שתי הקריאות ממיינות את אותו מורה באופן שונה.
"""
