keys = ["chp_1א___sec_1_23__ssec_1_23/p9"]
quote = "והיא מועסקת במשרה חלקית בת 24 שעות לפחות, לחישוב משכורתה בהתאם להנחות של שעות גיל, אם תעבוד % 79 משרה"
title = "The mothers' exception sets two measures of one part-time job: \"at least 24 hours\" and \"79% of a position\""
body = """
§1.23.6 lets a mother of a child under 14, employed part-time "for at least 24 hours", have her salary computed with the age-hours reductions "if she works 79% of a position". The clause does not say whether 79% is a floor or an exact figure, nor of which position — the full base, or the full position for her age after the age hours are taken off it.

The readings give different results. Read as an exact figure, "works 79%" cannot be met together with "at least 24 hours" on any base of up to 30 weekly hours, since 79% of 30 is 23.7 hours; the clause would then never apply. Read as a floor of the base, it adds nothing to the 24 hours on those bases. Read against the age-reduced position, it is a separate test.
"""
reading = "79% is a floor, measured against the full position for her age (the base less her age hours, the measure §1.23.4 uses for salary); both conditions must hold."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.23.l4"
evidence = "`exactly 79% of a base of up to 30 hours is fewer than 24 hours`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
