quote = "רמת קצובת הביגוד תיקבע לפי שנת ותק בהוראה · רמה 1: 1-25 שנות ותק"
title = "A teacher in the first year has no clothing level if seniority counts completed years"
body = """
§1.6.1 entitles every teaching employee in a teaching role to the clothing allowance, and §1.6.2 sets its level by "year of seniority in teaching", the first level covering "1-25 years". The section does not say whether the year being served counts or only completed years.

If seniority is the number of COMPLETED years, a teacher in the first year has seniority 0, which neither level covers, and §1.6.1's entitlement has no level and so no amount. The same words raise the same question in §1.7 (F-1.7-b).
"""
reading = "The year being served counts: the first year of teaching is year 1, as F-1.7-b reads §1.7. It is the reading under which §1.6.1 and the levels agree."
