# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.15-a"
kind = "contradiction"
stage = "writing"
keys = ["chp_1א___sec_1_15/p8"]
quote = '''בשנת הלימודים התשס"ג (החל מיום ד' באלול התשס"ב 1.9.2003)'''
title = "The incentives system starts in התשס\"ג by its name, but on the date that opens התשס\"ד"
body = """
The opening paragraph of §1.15.1 says the incentives system operates "in the school year התשס"ג (from ד' באלול התשס"ב, 1.9.2003)". A school year opens on 1 September, and 1.9.2003 opens the year that the section's own rules call התשס"ד: §1.2 cancels incentives "from 1.09.03" and continues them for veterans "בשנה"ל התשס"ד", requests are for "שנת הלימודים התשס"ד", the rent rate is stated for התשס"ד, and the fund joining dates are of התשס"ד. The Hebrew year name (and the Hebrew year of the date) points one school year earlier, 1.9.2002.

The two give different start dates for the whole system — a year apart — and so different answers for any claim for 2002/03.
"""
reading = "The system operates from 1.9.2003, the Gregorian date the paragraph prints and §1.2 repeats; the year names are read as the year before."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.15.l4"
evidence = '''`the school year ¶8's date opens differs from the year ¶8 names`'''
read_by = "Claude (L4 encoder)"
review = "unreviewed"

