quote = "הענקת התמריצים אינה נובעת מהסכמים קיבוציים החלים בדירוג עובדי הוראה, אלא היא פרי החלטת ממשלה. · במסגרת הסכמי השכר בשנים התשנ\"ד – התשנ\"ה (1995-1994) מורים צפוניים המלמדים ביישובי הבדואים בדרום זכאים להטבות"
title = "The incentives are \"not from collective agreements\", yet part 5's are granted under the wage agreements"
body = """
Note 6 says the granting of the incentives does not stem from the collective agreements of the teaching grading but from a government decision. Part 5, printed among the incentives of part 4, grants northern teachers in the Bedouin localities rent participation and the employee's fund part "within the wage agreements of התשנ"ד–התשנ"ה", at an amount set "subject to the wage agreements signed".

The source decides what kind of right the benefit is — one the government may withdraw by decision, or one held under a collective agreement — and the two clauses answer differently for part 5's benefits.
"""
reading = "Note 6 is read as speaking of the government-decision incentives of parts 1–4; part 5's benefits are encoded as coming from the wage agreements, as part 5 says."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.15.l4"
evidence = "`a benefit listed among the incentives comes from a collective agreement`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.15-n"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_15__ssec_4_5/p7"]
quote = "החזר הוצאות הנסיעה יהיה לפי תחשיב של 6 שעות שבועיות של לימודים באותו יום ולא יותר מפעמיים בשבוע."
title = "Travel reimbursement: six hours on the day, or six hours a week?"
body = """
Note 2 to §4.5 computes travel "by a reckoning of 6 weekly hours of study on the same day and not more than twice a week". "Weekly" and "on the same day" pull apart: it reads as a day counting when it holds six hours of study (at most two such days a week), or as six hours of study a week, however spread, buying up to two trips.

A teacher studying three hours on each of two days is reimbursed for no trip on the first reading and for two on the second.
"""
reading = "A day counts when it holds six hours of study, and at most two days a week are reimbursed."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.15.l4"
evidence = "`note 2's readings differ on two three-hour days`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
