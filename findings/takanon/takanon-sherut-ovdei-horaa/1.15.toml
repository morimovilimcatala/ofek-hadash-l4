kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_15__ssec_1_2/p12", "chp_1א___sec_1_15__ssec_1_2/p26"]
quote = "בתנאי שיעבוד במחצית המשרה לפחות במהלך כל שנת הלימודים.(50% של משרה שנתית)."
title = "Half a position \"throughout the school year\", or 50% of an annual position?"
body = """
Note 4 makes a part-timer eligible pro rata "provided they work at least half a position throughout the whole school year", and adds in brackets "(50% of an annual position)". The words "throughout the whole year" ask for half a position at every point of the year; "50% of an annual position" is an annual measure, which an uneven year can meet on average.

A claimant at 80% for half the year and 20% for the other half holds 50% of an annual position but not half a position throughout: eligible on one reading, not on the other.
"""
reading = "At least half a position at every point of the school year; the annual fraction then sets the pro-rata share."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.15.l4"
evidence = '''`the half-position condition's readings differ`'''
read_by = "Claude (L4 encoder)"
review = "unreviewed"

