kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_15__ssec_4_3/p1"]
quote = "יעמוד על % 80 מגובה שכר הדירה בדירות עמידר ועמיגור וכן בדירות השייכות לרשויות מקומיות ועוד … והשתתפות הגף מתבססת אפוא על מחירי שכר דירה של עמידר ביישוב"
title = "Rent participation: 80% of the rent paid, or of Amidar's rents in the locality?"
body = """
§4.3 sets the participation at 80% "of the rent in Amidar and Amigor flats and in flats of local authorities and others", computed on the year's total rent; a few lines later it says the participation "is therefore based on Amidar's rent prices in the locality". For an Amidar flat the two coincide; for a local authority's (or another public) flat whose rent differs from Amidar's, the first gives 80% of the rent the claimant pays and the second 80% of what Amidar charges.

The same sentence's "אפוא" also ties the Amidar basis to the exclusion of free-market flats, which leaves unclear whether that basis applies to every flat or only explains the exclusion.
"""
reading = "80% of the rent the claimant actually pays for a public flat, capped by the year's maximum; free-market flats get nothing."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.15.l4"
evidence = "`the rent bases differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
