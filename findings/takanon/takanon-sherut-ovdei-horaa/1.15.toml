keys = ["chp_1א___sec_1_15__ssec_4_4__para_e", "chp_1א___sec_1_15__ssec_4_4__para_e/p2"]
quote = '''עזב העובד את מקום מגוריו או את מקום עבודתו ביישוב לפני תום 5 שנים … יפסיק הגף … ויגבה מן הקרן · או שאעבוד פחות מ- 50% משרה שנתית, יפסיק משה"ח להפריש כספים עבור חלקי בחיסכון ויגבה מן הקרן את התשלומים עבור כל התקופה'''
title = "The fund declaration adds a clawback for working under 50% that 4.4ה does not have"
body = """
4.4ה stops the fund arrangement and recovers every payment from the fund in one case: the employee leaves the locality's residence or work before five years from the first saving. The declaration 4.4ה requires the employee to sign states a second case: working less than 50% of an annual position, after which the Ministry stops and recovers payments "for the whole period".

For an employee who stays in the locality but drops to 40% of a position, the rule recovers nothing and the declaration recovers everything paid.
"""
reading = "The rule in 4.4ה governs; the declaration's extra ground is encoded beside it and not applied."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.15.l4"
evidence = "`4.4ה and its declaration differ on a member below half a position`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

