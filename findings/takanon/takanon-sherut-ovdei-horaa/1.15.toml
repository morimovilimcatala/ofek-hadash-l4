[[finding]]
id = "F-1.15-d"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_15__ssec_1_2/p18", "chp_1א___sec_1_15__ssec_1_2/p19"]
quote = '''א. אם הם מוסמכים לרובד החינוך בו הם מלמדים, בעלי תעודת הוראה או בעלי תואר אקדמי (מורה "מוסמך" הוא מי שיש בידו תעודת הוראה בחינוך היסודי או רישיון הוראה קבוע בחינוך העל - יסודי).'''
title = "Condition א: three alternatives, or one qualification restated?"
body = """
Condition א of eligibility reads "if they are qualified for the level of education they teach, holders of a teaching certificate or holders of an academic degree", and then defines "qualified" as holding a primary teaching certificate or a permanent post-primary licence. The list reads two ways: as three alternatives (qualified, OR a certificate, OR a degree), or as one requirement — being qualified — with the certificate and degree describing it.

The readings part for the educational psychologists of the academic grading, whom the paragraph above expressly makes eligible: they teach at no level and hold no teaching licence, so under the second reading none of them can ever meet condition א.
"""
reading = "Three alternatives: qualified for the level taught, or a teaching certificate, or an academic degree — the reading under which every group the paragraph names can be eligible."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.15.l4"
evidence = '''`condition א's readings differ for a psychologist`'''
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
