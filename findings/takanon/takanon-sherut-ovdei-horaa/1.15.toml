stage = "writing"
keys = ["chp_1א___sec_1_15__ssec_4_2/p1", "chp_1א___sec_1_15__ssec_4_2__para_3"]
quote = "בתנאי שהוא לומד מערכת של שעות 6 שעות שבועיות לפחות · זכאים להחזר שכר לימוד, בתנאי שילמדו שני קורסים אקדמיים לקראת תואר במהלך שנת הלימודים"
title = "Open University students: two courses instead of six weekly hours, or both?"
body = """
§4.2 conditions tuition participation on studying at least six weekly hours. Note 3 entitles Open University students "provided they take two academic courses toward a degree during the school year". The note may set the Open University's own study-load test in place of the weekly hours (which its courses are not counted in), or add a condition to the six hours.

An Open University student taking two courses with four weekly hours of study is entitled on the first reading and not on the second.
"""
reading = "For the Open University, two academic courses toward a degree stand in for the six weekly hours."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.15.l4"
evidence = "`the study-load readings differ for an Open University student`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
