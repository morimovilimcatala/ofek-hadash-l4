# Errors in the LAW that encoding it in L4 exposed — MMS-415's model (see 1.7.toml for the field legend).

[[finding]]
id = "F-5.11-a"
kind = "ambiguity"
stage = "verification"
severity = "medium"
severity_why = "הקצובה \"הנוספת\" אינה מותנית בעבודה בסדנה, וכך הסעיף כפשוטו קובע."
keys = ["chp_5__sec_5_11__ssec_5_11_6__para_1", "chp_5__sec_5_11__ssec_5_11_6__para_2"]
quote = "החל ב - 1 בספטמבר 1981 זכאים המורים הטכנולוגיים בחטיבות-הביניים למכסת ביגוד בגין עבודתם בסדנה ובמעבדה. · החל ב - 1 בספטמבר 1982 משולמת למורים למקצועות הטכנולוגיים בחטיבת-הביניים קצובת ביגוד נוספת"
title = "קצובת הביגוד \"הנוספת\" של המורים הטכנולוגיים: נוספת על מכסת הביגוד, או משולמת גם למי שאינו עובד בסדנה?"
body = """
§5.11.6.1 נותן למורים הטכנולוגיים בחטיבות־הביניים מכסת ביגוד "בגין עבודתם בסדנה ובמעבדה". §5.11.6.2 משלם להם מ־1.9.82 "קצובת ביגוד נוספת" — ואינו אומר נוספת על מה, ואינו מתנה אותה בעבודה בסדנה או במעבדה.

אם "נוספת" פירושה תוספת על המכסה של פסקה 1, הקצובה משולמת רק למי שזכאי למכסה; אם היא קצובה נוספת בפני עצמה, היא משולמת לכל מורה טכנולוגי. בדיקה ממצה על כל צירוף של נתוני המורה, ביום שלפני כל אחד משני המועדים, ביום עצמו ומאוחר יותר (`the additional allowance is owed without the quota exactly outside the workshop`), מראה שהקריאות נבדלות בדיוק במורה טכנולוגי (או במדריך שבפסקה 3) שאינו עובד בסדנה או במעבדה, מ־1.9.82: לפי הנוסח כפי שהוא מודפס הוא מקבל את הקצובה ה"נוספת" בלי המכסה שהיא נוספת עליה.
"""
reading = "הנוסח כפי שהוא מודפס: פסקה 2 אינה מתנה את הקצובה הנוספת בעבודה בסדנה או במעבדה, ולכן מ־1.9.82 כל מורה טכנולוגי בחטיבת־הביניים זכאי לה."
convention = "reading.as-printed"
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/5.11.l4"
evidence = "`the additional allowance is owed to a technological teacher without the quota it adds to`"
depends_on = []
