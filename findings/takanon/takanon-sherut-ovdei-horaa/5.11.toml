[[finding]]
id = "F-5.11-b"
kind = "ambiguity"
stage = "writing"
severity = "medium"
severity_why = "§5.11.6 לתקנון מפנה לקצובת הביגוד של המורים הטכנולוגיים בלי לומר איזו, ואין מסמך שמתעד יישום אחר, כך שזו הכרעה שקולה בסכומים קטנים."
keys = ["chp_5__sec_5_11__ssec_5_11_6__para_3", "chp_5__sec_5_11__ssec_5_11_6__para_1", "chp_5__sec_5_11__ssec_5_11_6__para_2"]
quote = "זכאים לקצובת ביגוד כמו המורים במקצועות הטכנולוגיים בחטיבות-הביניים"
title = "מדריך בסדנה שאינו בעל דרגת \"מדריך מקצועי\": \"קצובת ביגוד\" אחת, או שתי ההטבות של המורים הטכנולוגיים?"
body = """
§5.11.6 (פסקה 3) מזכה מורים שאינם בעלי דרגה של "מדריך מקצועי" ומדריכים בסדנות כעמיתיהם "לקצובת ביגוד כמו המורים במקצועות הטכנולוגיים בחטיבות-הביניים". אלא שלמורים הטכנולוגיים יש שתי הטבות ביגוד נפרדות: מכסת ביגוד בגין עבודתם בסדנה ובמעבדה, מ־1.9.81 (פסקה 1), ו"קצובת ביגוד נוספת", מ־1.9.82 (פסקה 2).

פסקה 3 נוקבת ב"קצובת ביגוד" אחת, בלשון יחיד, ואינה אומרת אם הכוונה למכסה של פסקה 1, לקצובה הנוספת של פסקה 2 או לשתיהן. היא גם אינה אומרת ממתי, ואילו שתי ההטבות שהיא מפנה אליהן חלות כל אחת ממועד אחר.
"""
reading = "המדריך זכאי לשתי ההטבות, כל אחת מהמועד שלה, כמו המורה הטכנולוגי באותה עבודה (`entitled to clothing like the middle-school technological teachers`)."
