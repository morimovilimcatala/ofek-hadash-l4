quote = "גן ילדים רגיל יוגדר כגן משולב אם שולבו בו 10-8 ילדים … סך כל התלמידים בגן משולב לא יפחת מ - 22 תלמידים. אם התלמידים המשולבים הם לקויי חושים, יהיה מספרם 8-6, וסך כל התלמידים בגן לא יפחת מ - 18."
title = "An integrated group only partly sensory-impaired falls between the two definitions"
body = """
§2.10.6.1 defines an integrated kindergarten by two rules: 8-10 integrated children and at least 22 pupils in all; or, "if the integrated pupils are sensory-impaired", 6-8 of them and at least 18 in all.

The text does not say what happens when only some of the integrated children are sensory-impaired. Seven integrated children, five of them sensory-impaired, among 20 pupils: read "the integrated pupils are sensory-impaired" as "all of them", the general rule applies and the kindergarten is not integrated (fewer than 8, fewer than 22); read it as "any of them", the sensory rule applies and it is. The definition decides who staffs the kindergarten and on what terms (§2.10.6.2).
"""
reading = "The sensory rule applies only when every integrated child is sensory-impaired; a mixed group is judged by the general rule."
