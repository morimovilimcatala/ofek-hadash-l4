quote = "מכתב הפיטורין יישלח אל המורה על-ידי הבעלות, ותוקפו יחול על אותו מוסד בלבד. · בהצעת הפיטורין תהיה הבחנה בין מורה שהוא עובד מדינה לבין מורה העובד בבעלות אחרת. כשהמורה הוא עובד מדינה יוצע לפטרו מכלל מערכת החינוך, וכשהוא עובד בבעלוּת אחרת יוצע לפטרו מן המוסד שבו עבד בלבד."
title = "פיטורי מורה חדש שהוא עובד מדינה בסוף שנתו הראשונה: מן המוסד בלבד (2א) או מכלל מערכת החינוך (2ג)?"
body = """
בפיטורין מטעמים פדגוגיים, §5.5.2א ("מורה בעל זכות לרישיון הוראה קבוע, הנכנס לעבודה בחטיבת-הביניים…") מתיר למנהל בית־הספר ליזום את פיטורי המורה בסוף שנת עבודתו הראשונה, וקובע שמכתב הפיטורין "תוקפו יחול על אותו מוסד בלבד" — בלי להבחין בין מעסיקים. §5.5.2ג ("בהצעת הפיטורין תהיה הבחנה…") קובע שכאשר המורה הוא עובד מדינה "יוצע לפטרו מכלל מערכת החינוך", וכשהוא עובד בבעלות אחרת — מן המוסד בלבד.

2ג אינו אומר אם הוא חל על כל פסקה 2 או רק על ההצעה של 2ב ("יבקש להביא לפיטוריו…"), שהיא היחידה בפסקה המכונה הצעה. בדיקה ממצה על כל מקרה — שנה 0 עד 5, כל צירוף של הנתונים, כל מעסיק (`2(a) and 2(c) part on the scope exactly for a State employee`) — מראה שבכל מקרה ש־2א חל בו, שתי ההוראות נותנות היקף שונה בדיוק כאשר המורה הוא עובד מדינה: לפי 2א המוסד בלבד, לפי 2ג כלל המערכת, ועמה ועדה פריטטית בהשתתפות הארגון היציג שקובעת את נוסח המכתב (2ג, פסקה שנייה). לעובד בעלות אחרת שתיהן אומרות "המוסד בלבד".
"""
reading = "2א, ההוראה המיוחדת לפיטורין ביוזמת המנהל בסוף השנה הראשונה, גוברת: מכתבו חל על המוסד בלבד גם לעובד מדינה, ו־2ג חל על הצעת הפיטורין של 2ב בלבד."
