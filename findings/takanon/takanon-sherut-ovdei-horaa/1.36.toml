הסעיף כותרתו "הבחירות לכנסת העשירית - הוראות שעה", והוא נפתח בקביעה שהבחירות האלה נערכו ב־30 ביוני 1981. כל כלל שבא אחריו (אין הפגנות מדיניות, אין התרמות, אין ביקורת מעליבה, אין תעמולת בחירות או חוגי בית לעובדים בעלי סמכות מִנהלית או מגע עם קהל) מנוסח לאותה מערכת בחירות, ובכל זאת התקנון מפרסם את הסעיף כתקף, בלי מועד סיום ובלי קביעה שתוקפו הוארך.

בקריאה לפי הכותרת, הכללים חלו על הבחירות לכנסת העשירית בלבד ואינם מחייבים היום אף עובד הוראה; בקריאה כפי שהתקנון מציג אותם, הם הכללים הקבועים לכל בחירות לכנסת. התשובה מכריעה, למשל, אם מורה שיש לו מגע עם קהל רשאי לארח חוג בית במערכת בחירות מאוחרת יותר.
"""
