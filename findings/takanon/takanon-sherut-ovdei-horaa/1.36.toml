# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.36-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_36__hc_2", "chp_1ב__sec_1_36__hc_2__para_1__subpara_a"]
quote = "הבחירות לכנסת העשירית - הוראות שעה · הבחירות לכנסת העשירית נערכו ביום שלישי, כ\"ח בסיוון התשמ\"א (30 ביוני 1981)"
title = "Temporary provisions for the 1981 elections, still published as the takanon's rule"
body = """
The section is headed "elections to the tenth Knesset — temporary provisions" and opens by stating that those elections were held on 30 June 1981. Every rule that follows (no political demonstrations, no fundraising, no insulting criticism, no election propaganda or house circles for employees with administrative authority or contact with the public) is framed for that campaign, yet the takanon publishes the section as current, with no end date and no statement that it was extended.

Read as headed, the rules bound the tenth Knesset elections only and bind no teaching employee today; read as the takanon presents them, they are the standing rules for every Knesset election. The answer decides whether, for example, a teacher in contact with the public may host a house circle in a later campaign.
"""
reading = "The rules are read as the takanon's standing rules for Knesset elections, the tenth and every later one; the heading is kept as the record of their origin."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.36.l4"
evidence = "`the heading and the standing reading differ for a later Knesset`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.36-b"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_36__hc_2__para_1__subpara_b", "chp_1ב__sec_1_36__hc_2__para_2__subpara_a/p2", "chp_1ב__sec_1_36__hc_2__para_2__subpara_b__cls_4"]
quote = "אנו מפנים את תשומת לבם של עובדי ההוראה שהם עובדי מדינה · הוראה זו חלה על כלל עובדי ההוראה בכל הדרגות · הוראות סעיף זה חלות על כל עובדי ההוראה בשירות המדינה"
title = "Does the demonstrations ban reach teaching employees who are not state employees?"
body = """
§1.36.1(b) addresses the provisions to "teaching employees who are state employees". The demonstrations ban of §1.36.2(a) then says it "applies to all teaching employees, of every grade, seniority and post", while the fundraising ban's own scope clause, §1.36.2(b)(4), says "all teaching employees in the state service".

The contrast can be read as deliberate — the demonstrations ban reaches every teaching employee, the fundraising ban only state employees — or as the same audience stated loosely. The readings differ for a teaching employee employed by a local authority or an owning body.
"""
reading = "The section binds the audience its introduction names, teaching employees who are state employees; \"all teaching employees\" in §1.36.2(a) is read as \"of every grade, seniority and post\" within that audience."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.36.l4"
evidence = "`the two scopes of the demonstrations rule differ for a non-state teacher`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.36-c"
kind = "broken-reference"
stage = "writing"
keys = ["chp_1ב__sec_1_36__hc_2__para_2__subpara_b__cls_2", "chp_1ב__sec_1_36__hc_2__para_2__subpara_b__cls_3"]
quote = "שום דבר האמור בס\"ק (א) אינו בא למנוע ניכויים · פעולה האסורה לפי ס\"ק (א) רשאית הממשלה להתיר למטרה ציבורית"
title = "The fundraising exceptions point at \"sub-clause (א)\", which is the demonstrations ban"
body = """
§1.36.2(b)(2) and (b)(3) qualify a prohibition they call "ס\"ק (א)": nothing in it prevents deductions permitted by section 25 of the Wage Protection Law, and the Government may permit an act it prohibits for a public purpose. The fundraising prohibition they evidently qualify is (b)(1); the sub-clause labelled (א) in §1.36.2 is the ban on organising political demonstrations.

Read as written, the Government may permit a political demonstration and the fundraising ban has no Government exception; read as (b)(1), the reverse.
"""
reading = "\"(א)\" is read as (b)(1), the fundraising prohibition — the only prohibition that a wage deduction or a public-purpose permission bears on."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.36.l4"
evidence = "`the two readings of \"(א)\" differ on permitting a demonstration`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
