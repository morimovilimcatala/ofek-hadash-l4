§1.36.1(ב) מפנה את ההוראות אל "עובדי ההוראה שהם עובדי מדינה". איסור ההפגנות של §1.36.2(א) אומר אחר כך ש"הוראה זו חלה על כלל עובדי ההוראה בכל הדרגות", שנות הוותק והתפקידים, ואילו סעיף התחולה של איסור ההתרמה עצמו, §1.36.2(ב)(4), אומר "כל עובדי ההוראה בשירות המדינה".

את הניגוד אפשר לקרוא כמכוון — איסור ההפגנות חל על כל עובד הוראה, איסור ההתרמה רק על עובדי מדינה — או כאותו ציבור שנוסח ברישול. הקריאות נבדלות לגבי עובד הוראה המועסק על ידי רשות מקומית או על ידי בעלות.
"""
