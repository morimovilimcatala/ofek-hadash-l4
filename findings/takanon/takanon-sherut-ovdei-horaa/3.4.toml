quote = "תקופת הניסיון של עובד הוראה, שהוסמך תוך תקופת הניסיון, היא כלהלן: א. אם הוסמך בשנה השנייה לעבודתו, תהיה תקופת הניסיון 3 שנים. ב. אם הוסמך בשנה השלישית, או הרביעית לעבודתו, תהיה תקופת הניסיון 4 שנים."
title = "A teacher certified during her first year of probation has no probation period"
body = """
§3.4.4 sets the probation of a teacher certified during probation by the year of certification: in the second year of work, 3 years; in the third or fourth, 4 years. It says nothing of certification in the FIRST year.

Such a teacher was hired uncertified (§3.4.3: 4 years) and is certified before her first evaluation. She may be read as certified (§3.4.2: 2 years), as uncertified (4 years), or by the scale of §3.4.4, which shortens probation the earlier certification comes (suggesting 2 or 3). The text gives no answer, and the length of probation decides when tenure may be granted and when administrative dismissal (§3.5ה) may come.
"""
reading = "Certification within the first year is read as certification at hire: 2 years, as §3.4.2 gives a certified teacher."
