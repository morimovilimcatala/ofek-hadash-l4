title = "עובד הוראה שהוסמך בשנה השנייה עד הרביעית: האם הודעת הארכה מאריכה את תקופת הניסיון שלו?"
body = """
§3.4.2 ו־§3.4.3 קובעים את תקופת הניסיון של עובד מוסמך (שנתיים) ושל עובד לא־מוסמך (ארבע שנים), "אלא אם כן נשלחה לעובד הודעה על הארכתה". §3.4.4 ("תקופת הניסיון של עובד הוראה, שהוסמך תוך תקופת הניסיון…") קובע לעובד שהוסמך בשנה השנייה 3 שנים, ולמי שהוסמך בשנה השלישית או הרביעית 4 שנים — בלי הסייג של הודעת הארכה.

ההארכה עצמה פתוחה גם לו: §3.4.10ב מונה את "הארכת תקופת הניסיון" בין ההמלצות שהמפקח הכולל רשאי להמליץ לכל עובד, §3.4.11 ("לא תוארך תקופת הניסיון של עובד מוסמך…") קובע את תנאיה לכל עובד מוסמך, ו־§3.4.19 קובע את המועד למשלוח הודעות ההארכה. בדיקה ממצה על כל סוג של עובד בניסיון ועל 0 עד 2 שנות הארכה (`an extension adds its years exactly outside 4`) מראה שהודעת הארכה מוסיפה את שנותיה לכל עובד, מלבד מי שהוסמך בשנה השנייה, השלישית או הרביעית, שתקופתו לפי §3.4.4 אינה משתנה: עובד מוסמך עם שנת הארכה עובר שלוש שנות ניסיון, ומי שהוסמך בשנה השנייה עם אותה הארכה — גם הוא שלוש, כאילו לא הוארכה.
"""
reading = "§3.4.4 כפי שהוא מודפס: 3 או 4 שנים, שהודעת הארכה אינה משנה. (מי שהוסמך בשנה הראשונה נקרא כעובד מוסמך, F-3.4-a, ומי שהוסמך אחרי השנה הרביעית — כלא־מוסמך; לשניהם ההארכה של §3.4.2 ו־§3.4.3 חלה.)"
