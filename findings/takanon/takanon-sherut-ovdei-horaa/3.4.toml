§3.4.4 קובע את תקופת הניסיון של עובד הוראה שהוסמך תוך תקופת הניסיון לפי שנת ההסמכה: בשנה השנייה לעבודתו — 3 שנים; בשלישית או ברביעית — 4 שנים. הוא אינו אומר דבר על הסמכה בשנה הראשונה.

עובדת הוראה כזו נקלטה כלא־מוסמכת (§3.4.3: 4 שנים) והוסמכה לפני ההערכה הראשונה שלה. אפשר לקרוא אותה כמוסמכת (§3.4.2: 2 שנים), כלא־מוסמכת (4 שנים), או לפי הסולם של §3.4.4, המקצר את תקופת הניסיון ככל שההסמכה מוקדמת יותר (דבר המרמז על 2 או 3). הטקסט אינו נותן תשובה, ומשך תקופת הניסיון קובע מתי אפשר להעניק קביעות ומתי עשויים לבוא פיטורים מינהליים (§3.5ה).
