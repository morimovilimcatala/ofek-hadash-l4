title = "The jubilee grant's seniority is taken in September of the year before (¶4) and on 1 June of the year itself (ב)"
body = """
§1.46 1 ¶4 says the grant is given by the seniority set for the employee in September of the year BEFORE the grant. Clarification ב says an employee who completed 30 years of work in Israel (25 for state-employed teachers on the teachers' scale) by 1 June of the year in question wins the grant THAT year.

The two dates are nine months apart, and they answer differently for every teacher who completes the required years between them. A teacher with 29½ years in September — recorded as 29 — completes 30 in March: by ב she gets the grant in June of that year; by ¶4 she does not, and gets it only the following June. Since the grant is paid once a year, the clauses disagree about the year of payment for a whole cohort, and (for a teacher who retires or leaves in between) about whether it is paid at all.
"""
reading = "ב governs: eligibility is the required number of years completed by 1 June of the grant year. It is the clause that says in terms in which year the grant is won; ¶4's September seniority is kept in the encoding as the rule's other reading, and the worked example shows them apart."
