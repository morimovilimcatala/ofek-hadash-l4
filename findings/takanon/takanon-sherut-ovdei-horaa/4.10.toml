§4.10(ג)(2) מעניק למורה המחנכת המשלבת תלמידי חינוך מיוחד בודדים בכיתתה הרגילה גמול חינוך מיוחד של 5.5%, בלי מילה על הסמכה. §4.6.2(ב) מעניק לעובד הוראה המוסמך לחינוך מיוחד המלמד במסגרת של חינוך רגיל "כמורה משלב" 9% מהשכר המשולב; 5.5% הוא השיעור של §4.6.3(ב) לבלתי מוסמכים.

לגבי מורה מחנכת המוסמכת לחינוך מיוחד, שני הסעיפים נותנים שיעורים שונים. §4.10(ג)(3), בשורה הבאה, קובע את שיעור המורה הניידת "% 5.5 או % 9 בהתאם לכישוריה", כך שהתקנון עצמו מכיר בהבחנה שאינו עורך ב־(ג)(2).
"""
