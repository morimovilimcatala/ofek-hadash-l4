keys = ["chp_4__sec_4_10__hc_2__para_c__subpara_2"]
quote = "המורה המחנכת המשלבת תקבל % 5.5 גמול חינוך מיוחד."
title = "A certified integrating homeroom teacher: 5.5% under §4.10(c)(2), 9% under §4.6.2(b)"
body = """
§4.10(c)(2) gives the homeroom teacher who integrates single special-education pupils in her regular class a special-education allowance of 5.5%, with no word on certification. §4.6.2(b) gives a teaching employee certified for special education who teaches in a regular-education framework "as an integration teacher" 9% of the combined salary; 5.5% is §4.6.3(b)'s rate for the UNCERTIFIED.

For a homeroom teacher certified for special education the two clauses give different rates. §4.10(c)(3), on the next line, makes the mobile teacher's rate "5.5% or 9% according to her qualifications", so the takanon itself knows the distinction it does not draw in (c)(2).
"""
reading = "§4.10(c)(2) is applied as printed — 5.5% for every integrating homeroom teacher — as the clause written for this case; §4.6.2(b) is read as not reaching a homeroom teacher who integrates single pupils in her own class."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/4.10.l4"
evidence = "`a certified integrating homeroom teacher gets 5.5% where section 4.6.2(b) gives 9%`"
depends_on = ["F-4.6-a"]
