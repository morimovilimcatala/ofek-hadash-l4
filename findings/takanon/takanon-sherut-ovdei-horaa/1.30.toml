[[finding]]
id = "F-1.30-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_30__hc_3__para_8", "chp_1ב__sec_1_30__hc_3__para_9", "chp_1ב__sec_1_30__hc_3__para_5"]
quote = "עובד הוראה כאמור, אשר קיבל בתקופת ההעסקה (עד 51 ימי עבודה רצופים) סכומים גבוהים משהגיעו לו על-פי השכלתו וויתקו, ינוכו הסכומים והעודפים ממשכורתו"
title = "Clauses 8 and 9 of the pay part could undo clause 5's fixed rate for a short outside engagement"
body = """
Clause 5 of the pay part pays a substitute from outside the staff, engaged for up to 51 consecutive working days, a fixed hourly rate taken from a third-year senior teacher's salary — not the substitute's own education and seniority. Clauses 8 and 9 say that "a teaching employee as aforesaid" who received, in the engagement "(up to 51 consecutive working days)", more or less than his education and seniority entitled him to, has the excess deducted or the shortfall paid.

If clauses 8 and 9 apply to every engagement of up to 51 days, every outside substitute is squared to his own grade and seniority and clause 5's fixed rate is never what he keeps. If they apply only where the engagement passed 51 days — clause 6 then pays by grade and seniority retroactively from the first day — they are the mechanics of that retroactive pay. The two readings give different pay for any outside substitute whose engagement ended within 51 days.
"""
reading = "Clauses 8 and 9 apply only where the engagement passed 51 consecutive working days, as the reconciliation of clause 6's retroactive pay with what was paid in the first 51 days."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.30.l4"
evidence = "`the two readings of clauses 8 and 9 differ for a short outside engagement`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.30-d"
kind = "contradiction"
stage = "writing"
keys = ["chp_1ב__sec_1_30__hc_4__para_1", "chp_1ב__sec_1_30__hc_3__para_5"]
quote = "אין להעסיק מורה בשכר לפי שעות יותר מחודשיים רצופים במשך שנת הלימודים · שאינם מצוות המורים המועסקים עד 51 ימי עבודה רצופים"
title = "Hourly pay is capped at two calendar months, but allowed for up to 51 working days"
body = """
Clause 1 of the conditions of service forbids employing a teacher on hourly pay for more than two consecutive months in a school year. Clause 5 of the pay part pays a substitute from outside the staff by the hour (a monthly figure divided by 120, 96 or 84) for an engagement of up to 51 consecutive working days, and only past 51 days by grade and seniority.

The two limits are counted in different units. In a school that teaches five days a week, 51 working days span ten weeks and a day — 71 calendar days — while two consecutive months hold at most 62. An outside substitute in his 50th working day is lawfully paid by the hour under the pay part and unlawfully employed on hourly pay under the conditions of service.
"""
reading = "The pay part's 51-day line decides how a substitute is paid; the two-month cap is encoded as a separate prohibition on the employer, whose breach does not change the pay."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.30.l4"
evidence = "`hourly pay for 51 working days in a five-day school runs past two months`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
