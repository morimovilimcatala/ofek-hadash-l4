quote = "המורה ייענה לפניית המנהל למלא את מקומם של מורים חסרים ... בבית הספר מורה שיתפנה מעבודתו ביום מסוים לרגל יציאת תלמידים לטיול וכיו\"ב, יימצא באותן השעות בבית הספר, יעמוד לרשות המנהל, וימלא, לפי הצורך, את מקומם של מורים חסרים ללא תשלום"
title = "\"Without pay\": the teacher freed by a trip, or every teacher who answers the principal's call?"
body = """
Clause 2 of the general part runs two sentences together with no stop between them: every teacher must answer the principal's call to fill in for missing teachers, and a teacher freed on a given day because the pupils are on a trip stays at school and fills in as needed "without pay".

"Without pay" can close the second sentence only, or govern the whole clause. The readings differ for a teacher called on an ordinary day to fill in a missing colleague's hours: unpaid under the second reading; paid under the first, by clause 3 (overtime in substitution, as section 1.24 provides) and the pay part's rules for substitutes from the school's staff.
"""
reading = "\"Without pay\" qualifies the teacher freed by the pupils' trip only; the pay of a teacher answering the general call follows clause 3 and the pay part."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.30.l4"
evidence = "`the two readings of \"without pay\" differ for a teacher called in on an ordinary day`"
depends_on = []
