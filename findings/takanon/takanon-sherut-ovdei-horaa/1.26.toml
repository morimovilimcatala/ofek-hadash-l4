[[finding]]
id = "F-1.26-f"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_26__ssec_5_2_1", "chp_1ב__sec_1_26__ssec_6_3/p1"]
quote = "המועד האחרון להגשת הבקשה מתפרסם מבעוד מועד באתר האינטרנט הנ\"ל (בדרך כלל באמצע חודש מאי). · בקשות למענק שעות שתגענה למשרדנו לאחר סוף שבוע הלימודים השני במוסדות להשכלה גבוהה תוחזרנה לשולח ללא טיפול."
title = "Two deadlines for an hours-grant request: the published one (mid-May) and the end of the second week of studies"
body = """
1.26.2, 5.2.1 sets "the last date for submitting the request" as the one published on the ministry's site, usually mid-May. 5.2.4, in the same paragraph, says that requests reaching the ministry after the end of the second week of studies at the institutions of higher education — in the autumn — are returned unhandled.

A request arriving between the two is late by the first and not to be returned by the second; the text does not say whether it is handled. The note to 6.3 adds that a further round may be announced where budget is left, without tying it to either date.
"""
reading = "The published date is the deadline. A later request is handled only in a further round announced for spare budget (the note to 6.3), and no request is handled after the end of the second week of studies."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.26.l4"
evidence = "`a late request before the cut-off is neither in time nor returned`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
