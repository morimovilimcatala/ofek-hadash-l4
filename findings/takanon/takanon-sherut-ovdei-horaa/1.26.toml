[[finding]]
id = "F-1.26-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_26__ssec_1_26_1_2/p66", "chp_1ב__sec_1_26__ssec_2_1_4_5/p3"]
quote = "כל יחידת לימוד אקדמית המקנה נקודת זכות אקדמית מלאה באוניברסיטה הפתוחה תְזכה את עובד ההוראה המשתלם ביחידת גמול אחת · קורס אקדמי המקנה 6 נקודות זכות באוניברסיטה הפתוחה בישראל הוא שווה ערך ל-4 שעות לימוד שבועיות"
title = "What an Open University credit point is worth: one allowance unit each, or six to a 4-hour course?"
body = """
1.26.1.2, 4יד(1): every Open University study unit giving "a full academic credit point" earns one allowance unit, and a half point counts 2 weekly hours (56 single hours). An allowance unit is 4 weekly yearly hours (5א(2)), so one credit point is worth 4 weekly hours.

1.26.2, the note to 2.1.4.5: an Open University course giving 6 credit points equals 4 weekly hours — so one credit point is worth two-thirds of a weekly hour.

The section uses "credit point" of the same institution at two values six times apart. A course of 6 credit points earns 6 allowance units by the first clause and one unit's worth of hours by the second. Which scale the first clause's "credit point" is on is not said.
"""
reading = "Each clause is applied in its own context and on its own words: for the allowance, every credit point the Open University awards is one unit (a half point 56 hours), as 4יד(1) says; for grants, 6 points are 4 weekly hours. The difference is left standing for a reader who can say which scale 4יד(1) was written on."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.26.l4"
evidence = "`the two clauses value an Open University credit point differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.26-d"
kind = "broken-reference"
stage = "writing"
keys = ["chp_1ב__sec_1_26__ssec_1_26_1_1__para_3__subpara_c", "chp_1ב__sec_1_26__ssec_1_26_1_4/p23", "chp_1ב__sec_1_26__ssec_1_26_1_4/p41", "chp_1ב__sec_1_26__ssec_1_26_1_4/p56"]
quote = "בהתאם לסעיף 4, תת-סעיף יא, ולהערות לסעיף 7 · (ראה בקשר לכך סעיף 1.26.1.2 תת סעיף 4י\"ב). · כמפורט בסעיף 4 יב · ראה סעיף 4יא לעיל."
title = "Four references into section 4 each name the sub-clause before the one they mean"
body = """
Section 4 of 1.26.1.2 letters its sub-clauses: יא is studies towards an additional certification, יב studies earning an additional double degree, יג the principals' course. The references into it from outside are each one letter short:

- 3ג grants regular units "for an additional double degree (under section 4, sub-clause יא)" — that is 4יב.
- 7, note 2, on the same additional double degree, says "see section 4יא above" — 4יב.
- 7יב, the principals' course, says "see section 1.26.1.2, sub-clause 4יב" — the principals' course is 4יג.
- 7כד requires full certification before the principals' course "as detailed in section 4 יב" — the certification for that course is detailed in 4יג.

The references inside section 4 itself (to טו, יב, ה(3), 2ד) are right, which points to a sub-clause added to section 4 after the outside references were written.
"""
reading = "Each is read as the next letter: the additional double degree is 4יב, the principals' course and its certification condition are 4יג."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.26.l4"
evidence = "`every citation into section 4 is one letter short`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

