title = "Grants: the academic-track rule excepts a priority 3.15 that does not exist"
body = """
1.26.2, 3 says that everything below, "except priorities 3.7 and 3.15", refers to academic tracks at institutions approved and supervised by the Council for Higher Education. The list of priorities runs from 3.1 to 3.14; there is no 3.15.

The exception decides which studies may be outside the Council's supervision and still earn a grant. Besides 3.7 (studies the ministry builds for its needs), the one priority that cannot be such a track is 3.14, studies towards rabbinical ordination at the approved yeshivas — and as written it is not excepted.
"""
reading = "\"3.15\" is read as 3.14, the yeshivas: the only other priority whose studies are not, by their nature, in a track the Council supervises."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.26.l4"
