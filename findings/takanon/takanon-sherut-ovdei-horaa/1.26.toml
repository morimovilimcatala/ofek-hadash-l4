quote = "ניתן להאריך את תקופת החיסכון ל - 7 ול - 8 שנים. · בתקופת ההשתלמות יקבל עובד ההוראה מענק השתלמות בשיעור % 66.66 ממשכורתו. מי שחסך 7 שנים יקבל % 77.77"
title = "The training fund's regular saving period is never given a length"
body = """
1.26.3, regular track: a teacher may go on training leave "for every saving period" (4א), may join another plan "at the end of a saving period" (3ב), and the period "may be extended to 7 and 8 years" (3ג). The grant is 66.66% of the salary, 77.77% after 7 years' saving and 88.88% after 8 (4ב).

How long a saving period is, before any extension, is not stated anywhere in the section — yet it decides when the right to the leave and its 66.66% grant arises, and when a member has "completed a saving period" for the withdrawals of 10ג. The rates rise by 11.11 points a year, which would put the base at 6 years; the text never says so.
"""
reading = "The length of a regular saving period is taken as an input, not fixed in the encoding; the 66.66% rate applies to a period not extended to 7 or 8 years."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.26.l4"
evidence = "`the base saving period is not stated`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

