[[finding]]
id = "F-1.26-a"
kind = "contradiction"
stage = "writing"
keys = ["chp_1ב__sec_1_26__ssec_1_26_1_1__para_3__subpara_c", "chp_1ב__sec_1_26__ssec_1_26_1_0__para_j"]
quote = "ובכל מקרה לא יותר מ - 21.75 גמולים. · ומהתשנ\"ח היא תועלה ל - 16 יחידות גמול"
title = "\"In any case not more than 21.75 units\" — and in the same paragraph the regular ceiling rises to 16, making 24.75"
body = """
1.26.1.1(3)ג caps regular units at 13 and states the maximum of all the allowances: 4 + 13 = 17, or 13 + 8.75 = 21.75, "and in any case not more than 21.75". The next sentence raises the regular ceiling to 14 from 5756, 15 from 5757 and 16 from 5758.

With 16 regular units and the double-degree allowance of 8.75 a teacher holds 24.75 units — the figure 1.26.1.0י itself gives for the maximum from 1.9.97. The paragraph's "in any case" ceiling and its own raised ceilings cannot both hold; read literally, the raises above 13 give nothing to a teacher with the double-degree allowance.
"""
reading = "The 21.75 is the maximum of the year the sentence was written in (13 regular units) and moves with the regular ceiling, as 1.26.1.0ח-י state: 22.75, 23.75 and 24.75 from 5756, 5757 and 5758."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.26.l4"
evidence = "`the raised ceilings pass \"in any case not more than 21.75\"`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

