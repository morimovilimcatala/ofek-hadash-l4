§1.26.2 2.2.1 קובע ש"רשאים להגיש בקשה עובדי הוראה אלו" להחזר שכר לימוד ומונה שלושה: העובדים במוסדות חינוך רשמיים, על-יסודיים או להכשרת עובדי הוראה שיש להם קשרי התחשבנות עם המשרד; הקבועים במשרתם, או שזו שנת עבודתם הרביעית, העובדים באותה שנה בהיקף של חצי משרה לפחות; ועובדי הוראה בפועל הנמצאים בחצי שנת שבתון, שההחזר להם מוגבל ל־50%.

הרשימה אינה אומרת לא "וגם" ולא "או". הפריט השלישי אינו יכול להיות תנאי לכל מבקש, ולכן הוא או קבוצה הרשאית להגיש בקשה בפני עצמה, או המקרה של חצי שנת שבתון של מבקש העומד בשני הפריטים הראשונים. הקריאות נבדלות לגבי מורה קבועה בחצי שנת שבתון המלמדת באותה שנה שליש משרה: כקבוצה בפני עצמה היא רשאית להגיש בקשה; אם היא נדרשת לחצי המשרה של הפריט השני — אינה רשאית. §1.42 2.1 מדפיס את אותה רשימה (`F-1.42-a`).
"""
reading = "שני הפריטים הראשונים הם תנאים שכל מבקש עומד בהם, והשלישי הוא המקרה של חצי שנת שבתון של מבקש כזה, המוסיף את תקרת ה־50% שלו — הקריאה ש־`F-1.42-a` מאמץ לגבי אותה רשימה."
