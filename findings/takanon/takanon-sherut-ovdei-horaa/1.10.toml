body = """
§1.10.0.1ט pays a teacher who accompanies a class on a rest day or a day he does not teach 4 hours on top of the accompanying pay. For a day of partial teaching it gives a table: 1 hour taught → 1 hour as a substitute; 2 → 2; 3 → 1; 4 or more → nothing.

