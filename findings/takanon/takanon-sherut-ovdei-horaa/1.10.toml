body = """
An outing is out-of-school activity only if it is "one (only)" of six kinds: four that start in the morning and end in a band up to 24:00, a "detached" activity held between 16:00 and 24:00, and an activity with lodging. Two kinds of outing fall outside all six: one that starts after the morning but before 16:00 (say 15:00 to 20:00), which is neither a morning outing nor held between 16:00 and 24:00; and one that starts in the morning and ends after midnight without lodging (say 08:00 to 01:00), which is past every band.

The text does not say what such outings earn. Read by the letter they earn no units at all — though the second is longer than any outing the table pays 5 units for.
"""
reading = "By the letter (\"אחת (בלבד) מאלה\"): an outing that fits none of the six kinds is not out-of-school activity under this section and earns no units."
