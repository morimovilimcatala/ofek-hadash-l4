The sixth kind of activity is one "lasting from the morning, including lodging, and ending the next day", at 7 units. ד says units are never added up for one outing, except that more than one night is paid by the number of nights, and then that "for the last day of the trip, which includes no lodging", the teacher is paid by the hour the trip ended.

