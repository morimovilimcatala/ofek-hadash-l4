Read with ¶8 only, the road-safety allowance has no stated date and the abolition takes effect on 1.9.94; read with ¶7 only, the abolition has none; read with both, each takes effect on 1.9.94. Whether a road-safety coordinator could be paid before 1.9.94, and a further-training coordinator after it, turns on the reading.
"""
