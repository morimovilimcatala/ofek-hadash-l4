[[finding]]
id = "F-1.12-g"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1א___sec_1_12__ssec_1_12/p16", "chp_1א___sec_1_12__ssec_1_12/p15"]
quote = "סגן מנהל יוכל להתמנות, נוסף לתפקידו כסגן מנהל, גם לתפקיד מחנך כיתה או לתפקיד האחראי לביטחון."
title = "A vice-principal's further roles: class education and security only, or those as well as any other?"
body = """
§1.12.1ה bars a principal from any role beyond management "למעט תפקיד של מחנך כיתה אחת". The sentence after it says a vice-principal "may be appointed, in addition to his role as vice-principal, also" to class education or to security.

Read as the counterpart of the principal's rule, it limits a vice-principal to those two roles; read as a permission, it adds nothing to the general rules of appointment (§1.12.1ג–ד), under which a vice-principal may already hold up to two roles of any kind. A vice-principal asked to coordinate a laboratory is barred under the first reading and may be appointed under the second.
"""
reading = "The sentence is the principal's rule's counterpart: a vice-principal's further roles are class education and security; subject and qualifications, which is not a role for these limits (§1.12.1ו), is not touched."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.12.l4"
evidence = "`only ¶16 read as a limit bars a vice-principal from coordinating a laboratory`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"


