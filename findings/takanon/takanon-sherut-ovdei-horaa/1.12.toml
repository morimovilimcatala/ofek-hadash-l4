body = """
§1.12, סעיף־משנה 1 ("לכל מוסד חינוכי שיש בו כיתות…"): בכל מוסד חינוכי שיש בו כיתות מכיתות א'–י"ד ימונה מרכז אחד בלבד לריכוז מעבדה (או מרכזייה פדגוגית מוסדית, או אמצעי הוראה). סעיף־משנה 3 ("סעיף 2 לעיל קובע קריטריונים חדשים…") מגביל את הקריטריונים החדשים של "סעיף 2" — השיעורים של סעיף־משנה 2 ("במוסד חינוכי שיש בו עד 12 כיתות…" ו"במוסד חינוכי שיש בו 13 כיתות או יותר…") — למוסדות שאינם בחינוך העל־יסודי, והפסקה "במוסדות החינוך העל-יסודיים ימוּנוּ מרַכזי מעבדה…" קובעת שבמוסדות החינוך העל־יסודיים ימונו מרכזי מעבדה "לפי הקריטריונים הקיימים (סעיף 6.9.2), אך לא פחות מאחד".

