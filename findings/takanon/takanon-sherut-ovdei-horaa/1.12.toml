"""
reading = "הפסקה \"במוסדות החינוך העל-יסודיים ימוּנוּ מרַכזי מעבדה…\" שב־§1.12 חלה על המוסדות העל־יסודיים: כמה שסעיף 6.9.2 מתיר, ולפחות אחד; \"אחד בלבד\" של סעיף־משנה 1 (\"לכל מוסד חינוכי…\") נקרא ככלל לשאר המוסדות."
