#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-1.27-a"
kind = "broken-reference"
stage = "writing"
keys = ["chp_1ב__sec_1_27__ssec_1_27_1__para_5/p1", "chp_1ב__sec_1_27__ssec_1_27_1__para_6/p2", "chp_1ב__sec_1_27__ssec_1_27_1__para_6/p7", "chp_1ב__sec_1_27__ssec_1_27_1__para_6/p8", "chp_1ב__sec_1_27__ssec_1_27_1__para_8/p1"]
quote = "ו/או לאחר עיון והתיעצות כאמור בסעיף 3 לעיל · יפעל בכפיפות לאמור בסעיף 3 לעיל · היתה ההחלטה שלילית - יפעל מנהל המחוז כאמור בסעיף 4 לעיל · כמפורט בסעיף 6 לעיל"
title = "Five clause references in 1.27.1 each point one clause too early"
body = """
1.27.1 numbers its clauses 1-11. Five references inside it name a clause whose subject is not the one the sentence needs, and in every case the needed subject is in the NEXT clause:

- 1.27.1.5 rejects a request "after the reading and consultation of section 3" — section 3 is the grounds for a request; the reading of the supervisors' opinions and the consultation are section 4.
- 1.27.1.6: a manager who accepts an appeal acts "subject to section 3", and a positive decision of the division is carried out "as in section 3" — the approval and its notice are section 4.
- 1.27.1.6: a NEGATIVE decision of the division is carried out "as in section 4" — section 4 is the approval; the rejection and its notice are section 5.
- 1.27.1.8 refers to the notice of the wish to stay "as detailed in section 6" — section 6 is appeals; that notice is section 7.

The pattern is that of a clause inserted or removed before the references were renumbered. As written, a negative appeal decision is to be carried out under the approval clause. The two references to "section 3" on accepting an appeal could also be read as they stand (approval stays subject to the grounds of section 3), which is why the reading below is stated rather than silent.
"""
reading = "Each reference is read as the clause one later: the consultation is 1.27.1.4; an accepted appeal or a positive decision is carried out under the approval clause (1.27.1.4), a negative one under the rejection clause (1.27.1.5); the notice of the wish to stay is 1.27.1.7."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.27.l4"
evidence = "`every clause citation of 1.27.1 is one clause short`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.27-b"
kind = "gap"
stage = "writing"
keys = ["chp_1ב__sec_1_27__ssec_1_27_1__para_7/p1", "chp_1ב__sec_1_27__ssec_1_27_1__para_7/p4"]
quote = "ולא הוצעה לו עבודה במחוז הקולט עד 1באוגוסט, רשאי להשאר במקום עבודתו הקבוע · שובץ העובד במחוז הקולט עד 1 באוגוסט, לא נשמרה לו יותר משרתו במחוז הפולט"
title = "A conditional transferee OFFERED work by 1 August but not placed: may he stay, and is his post kept?"
body = """
1.27.1.7 ¶1 lets a conditional transferee stay in the permanent post if no work was OFFERED to him in the receiving district by 1 August (and he gives notice by 5 August). ¶4 takes the post away if he was PLACED in the receiving district by 1 August.

"Offered" and "placed" are different events. An employee who was offered work by 1 August but not placed — he declined it, or the placement had not been made — meets neither clause: he has no right to stay under ¶1, and his post is not lost under ¶4. The text does not say what becomes of his post or of his transfer.
"""
reading = "Each clause is applied as written: such an employee has no right to stay under ¶1, keeps the post under ¶4 until placed, and the sending district may fill the post only under ¶3, if he gave no notice by 5 August."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.27.l4"
evidence = "`an employee offered work but not placed may neither stay nor loses the post`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.27-c"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_27__ssec_1_27_2/p3", "chp_1ב__sec_1_27__ssec_1_27_2/p4"]
quote = "במקרים האלה: נסגרה כיתה או מגמה או צומצם התקן של מוסד חינוכי. ההעברה תביא לחיסכון בנסיעות ובהוצאות דמי נסיעה. העובד מונה לתפקיד מנהל, סגן מנהל או מרכז."
title = "Towards a new year, is a saving in travel a ground for an initiated transfer, or a condition of one?"
body = """
1.27.2.1ב lets the district manager initiate a transfer within the district and within 30 km "in these cases:", followed by three sentences with no numbering: a class or stream was closed or the standard reduced; "the transfer will bring a saving in travel and travel expenses"; the employee was appointed principal, deputy principal or coordinator. The source page prints them the same way.

Read as a flattened list, these are three alternative cases, and a transfer whose only ground is a saving in travel is allowed. Read as prose, the second sentence states a condition (or an expected result) of the closure case, and such a transfer is not allowed. The readings differ on exactly that transfer. The third sentence carries the same doubt: whether an appointee may be moved with no closure at all.
"""
reading = "Three alternative cases: a closure or reduced standard; a saving in travel; an appointment as principal, deputy or coordinator. Each opens with a fresh subject, as list items do, and the appointment sentence cannot be a condition of the closure case."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.27.l4"
evidence = "`the readings of the new-year cases differ on a travel-only transfer`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.27-d"
kind = "gap"
stage = "writing"
keys = ["chp_1ב__sec_1_27__ssec_1_27_3/p7", "chp_1ב__sec_1_27__ssec_1_27_3/p8"]
quote = "לא אושרה הבקשה: ישובץ במגמה הממלכתית."
title = "A refused request to move INTO the state stream places the teacher in the state stream"
body = """
1.27.3 governs requests in both directions: from state-religious to state education (decided by the district manager, 1.27.3.4) and from state to state-religious (decided by the council for religious education, 1.27.3.5-6). 1.27.3.7 then states one consequence of a refusal for both: "the request was not approved: he will be placed in the state stream".

For a refused request to move from the state stream into state-religious education, that is staying where he was. For a refused request to move from state-religious into the state stream, it places the teacher in the very stream the refusal denied him. The text gives no consequence of a refusal that fits that direction.
"""
reading = "A refused request leaves the teacher in the stream he asked to leave; the sentence is read as written for the state-to-religious direction it fits."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.27.l4"
evidence = "`a refused move into the state stream lands the employee in it`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-1.27-e"
kind = "contradiction"
stage = "writing"
keys = ["chp_1ב__sec_1_27__ssec_1_27_1__para_1/p1", "chp_1ב__sec_1_27__ssec_1_27_1__para_2__subpara_a"]
quote = "עובד הוראה מוסמך (להלן: עובד) המבקש העברה · א. עובד הוראה בלתי מוסמך ובלתי קבוע."
title = "May an uncertified but permanent teacher be transferred between districts?"
body = """
1.27.1.1 opens the inter-district procedure to "a certified teaching employee (hereafter: employee)". 1.27.1.2 then forbids approving the transfer of, among others, "a teaching employee who is uncertified AND not permanent".

The bar would be empty if only certified employees could apply, so it implies that an uncertified employee who IS permanent may be approved. The opening clause excludes the same employee from the procedure altogether. The two clauses answer differently for an uncertified permanent teacher.
"""
reading = "1.27.1.2א decides who may not be approved, as written: an uncertified permanent teacher is not barred. Reading 1.27.1.1 strictly would leave the words \"and not permanent\" with no case to apply to."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.27.l4"
evidence = "`an uncertified permanent employee is outside 1.27.1.1 yet not barred by 1.27.1.2`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
