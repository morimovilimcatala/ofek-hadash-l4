[[finding]]
id = "F-1.8-a"
kind = "gap"
stage = "writing"
keys = ["chp_1א___sec_1_8__hc_2__para_1"]
quote = "מה 1.4.2000 חל שינוי בשיטת ההתחשבנות, מתשלום לפי מכסת שיחות לתשלום ע\"פ זמן שיחה: במקום 50 שיחות 12.15 ש\"ח."
title = "The telephone allowance has an amount but no beneficiary and no period"
body = """
§1.8.1 records that from 1.4.2000 the telephone allowance is reckoned by talk time rather than by a quota of calls: 12.15 shekels in place of 50 calls. It does not say who is entitled to the allowance, nor for what period — a month, a school year — the 50 calls or the 12.15 shekels are counted.

The section's other two clauses send principals and vice-principals to chapter 7 and supervisors and instructors to chapter 8; no clause of §1.8 names an ordinary teaching employee, although §1.1ו.3ז lists "טלפון (ראה סעיף 1.8)" among the components of every teacher's pay. The amount cannot be applied to anyone from this section alone.
"""
reading = "The L4 encodes only what the clause decides — which measure applies on which date (50 calls before 1.4.2000, 12.15 shekels from it) — and leaves who is entitled, and for what period, to the reader; it adopts no beneficiary or period."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.8.l4"
evidence = "`the only amount in section 1.8 names neither who gets it nor for what period`"
