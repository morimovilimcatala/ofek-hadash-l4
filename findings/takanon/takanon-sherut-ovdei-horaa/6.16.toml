title = "The start date 1.9.1982 may date §6.16.6ד as a whole or only its second item"
body = """
§6.16.6ד gives two entitlements: (1) women teachers in the nursing track who must wear high white shoes in hospitals get one pair a year; (2) teachers in the dental-technician and dental-assistant tracks get two coats a year. The line "התחולה: 1 בספטמבר 1982" follows (2) and is printed as part of it.

Nothing says whether that date is when (2) took effect or when the whole of ד did. The readings differ for any year before 1.9.1982: on the first, a nursing-track teacher gets no shoes; on the second, ד.1 has no start date and she does.
"""
