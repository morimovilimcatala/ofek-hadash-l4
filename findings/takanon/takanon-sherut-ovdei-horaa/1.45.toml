title = "Section 17 extends \"sections 15 to 17 above\" to signs: it cites itself and leaves out 14"
body = """
§1.45 section 17 says the restrictions on notices "under sections 15 to 17 above" apply to signs as well. Section 17 is that very sentence and restricts nothing; and the range leaves out section 14 — the one clause that forbids posting election notices on buildings, fences, roads and pavements at all. Sections 15 and 16 (defacing another's property; removing a lawful notice) are the only restrictions the range actually catches.

Read as written, signs are covered by the rules on defacing and removing but not by the basic prohibition on putting election propaganda on public places — although 14 itself already speaks of "signs" (שלטים) — and "17" points at nothing. The range looks shifted by one from 14-16.
"""
reading = "The range is read as sections 14 to 16: every restriction on notices above applies to signs too."
