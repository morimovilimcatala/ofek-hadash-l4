body = """
§1.44 ד.2 עושה את תקופת הכהונה במועצה של מפקח, מנהל מוסד חינוך, סגן מנהל מוסד חינוך או מנהל חטיבת־ביניים לחופשה ללא שכר — אך רק כשתחום שיפוטה של הרשות המקומית כלול בתחום סמכויותיו כעובד הוראה. ד.4 מאפשר ל"עובד הוראה שאינו מוזכר לעיל" שנבחר למועצה להוסיף לעבוד בשכר.

מנהל שנבחר למועצה של רשות שמחוץ לתחום סמכויותיו נקוב ב־ד.2 בשם תפקידו, אבל התנאי של ד.2 אינו תופס אותו. אם "מוזכר לעיל" פירושו נקוב בשם תפקידו, ד.4 מוציא אותו ואין סעיף שמכריע את תקופת כהונתו; אם פירושו נתפס במקרה של ד.1–3, ד.4 מאפשר לו להוסיף לעבוד. אותה שאלה עולה לגבי המורה של ד.3 שנבחר למועצה אחרת מזו שבתחומה הוא עובד, ובפתיחה של ד.3 עצמו, "עובד הוראה שאינו מוזכר ב - 1 או ב - 2 לעיל": אותו מנהל, המחזיק בתיק החינוך במועצת הרשות שבתחומה הוא עובד אך מחוץ לתחום סמכויותיו, נקוב ב־ד.2 ואינו נתפס בו.
"""
reading = "\"מוזכר לעיל\" פירושו נתפס במקרה של ד.1–3: מי שאף אחד מהם אינו עושה את כהונתו לחופשה ללא שכר נופל תחת ד.4 ורשאי להוסיף לעבוד בשכר. \"שאינו מוזכר ב - 1 או ב - 2\" של ד.3 נקרא באותו אופן: שאינו נתפס ב־ד.1 או ב־ד.2."
