[[finding]]
id = "F-1.44-a"
kind = "ambiguity"
stage = "writing"
keys = ["chp_1ב__sec_1_44__hc_2__para_d__subpara_2", "chp_1ב__sec_1_44__hc_2__para_d__subpara_3", "chp_1ב__sec_1_44__hc_2__para_d__subpara_4"]
quote = "נבחר עובד הוראה שאינו מוזכר לעיל כחבר מועצת רשות מקומית - יוכל להוסיף לעבוד בשכר"
title = "\"A teacher not mentioned above\": named by role, or caught by a case of ד.1-3?"
body = """
§1.44 ד.2 makes the council term of a supervisor, principal, deputy principal or junior-high principal unpaid leave — but only where the local authority lies within his remit as a teaching employee. ד.4 lets "a teaching employee not mentioned above" who is elected to a council keep working for pay.

A principal elected to the council of an authority OUTSIDE his remit is named in ד.2 by his role, yet ד.2's condition does not catch him. If "mentioned above" means named by role, ד.4 excludes him and no clause decides his term; if it means caught by a case of ד.1-3, ד.4 lets him keep working. The same question arises for the teacher of ד.3 elected to a council other than the one where he works, and in ד.3's own opening, "a teacher not mentioned in 1 or 2": the same principal, holding the education portfolio on the council of the authority he works in but outside his remit, is named in ד.2 and not caught by it.
"""
reading = "\"Mentioned above\" means caught by a case of ד.1-3: whoever none of them makes unpaid leave falls under ד.4 and may keep working for pay. ד.3's \"not mentioned in 1 or 2\" is read the same way: not caught by ד.1 or ד.2."
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.44.l4"
evidence = "`the two readings of \"not mentioned above\" differ for a principal outside his remit`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

