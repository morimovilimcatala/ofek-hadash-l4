title = "\"A post involving contact with the public\" is not defined, and decides whom ב.5-6 bind"
body = """
§1.44 ב.5 forbids any part in local-election propaganda, public or not, anywhere in the country, and ב.6 forbids hosting or speaking at a local-election house circle, to a teacher who holds administrative authority "or holds a post involving contact with the public". ב.5 ¶2 defines administrative authority; contact with the public is not defined.

Every teacher's post involves contact with pupils and their parents. If that is "contact with the public", ב.5 and ב.6 bind every teaching employee and the qualifier excludes no one; if the public means members of the public dealing with the state, an ordinary class teacher is outside both prohibitions. The difference is whether a class teacher may campaign in local elections at all.
"""
reading = "An input of each case: the encoding does not decide whether teaching itself is contact with the public. The worked example shows both answers."
