severity = "high"
severity_why = "סעיף 6(ב)(4) להסכם ספטמבר 2016, כנוסחו בהסכם מיום 19.3.2017, נותן מ־1.9.2019 את סכום הדרגה במפורש \"למורים (אקדמאים או לא אקדמאים)\", והחוזר משלם למורה לא אקדמאי בדרגות 1–4.5 את הסכום הנמוך של \"כל היתר\" עד שחוזר תש\"ף/4 תיקן את הנוסח מ־1.1.2020, בלי הפרשים לספטמבר–דצמבר 2019; חוזר אינו גובר על ההסכם, ובית משפט צפוי לפסוק את ההפרש."
keys = ["art_c", "art_c/p2", "art_c/p10"]
quote = "החל מיום 1.9.2019 סכום תוספת שקלית 2016 לעובד הוראה במשרה מלאה יהיה כדלקמן: · לעובד הוראה המשובץ בדרגה 1 בטבלאות השכר למורים אקדמאיים לפי הסכם אופק חדש 738.15 ₪. · לכל יתר עובדי ההוראה עליהם חל חוזר זה ושאינם מצוינים לעיל, המועסקים על פי תנאי אופק חדש ושאינם מועסקים על פי תנאי אופק חדש –506.99 ₪."
title = "מ־1.9.2019 החוזר נותן את סכומי הדרגות 1–4.5 רק למורים אקדמאיים, וההסכם נותן אותם גם למורים לא אקדמאיים"
body = """
סעיף ג של החוזר קובע את תוספת שקלית 2016 מיום 1.9.2019 לכל דרגה מ־1 עד 4.5 "בטבלאות השכר למורים אקדמאיים לפי הסכם אופק חדש", ולכל היתר 506.99 ₪. מורה לא אקדמאי באופק חדש המשובץ בדרגה 1–4.5 אינו בטבלאות השכר למורים אקדמאיים, ולכן לפי החוזר הוא מקבל את סכום "כל היתר".

סעיף 6(ב) להסכם מיום 30.9.2016, כנוסחו בסעיף 2(ה) להסכם מיום 19.3.2017 שהחוזר מונה בין מקורותיו, קובע לתקופה שמיום 1.9.2019 את סכום הדרגה "בטבלאות השכר המשולב למורים (אקדמאים או לא אקדמאים)". עד 31.8.2019 ההסכם עצמו נותן את סכומי הדרגות לאקדמאים בלבד, ולכן הסטייה מתחילה בדיוק ב־1.9.2019.

ההסכם נותן לדרגה 1 730.83 ₪, והחוזר מצמיד אותו ל־738.15 ₪. מורה לא אקדמאי בדרגה 1 במשרה מלאה זכאי לפי ההסכם לאותו סכום, והחוזר משלם לו 506.99 ₪: 231.16 ₪ פחות בחודש. בדרגה 4.5 ההפרש 37.37 ₪. חוזר תש"ף/4 מדפיס "אקדמאיים ולא אקדמאיים" מ־1.1.2020, ואינו משלם הפרשים לספטמבר–דצמבר 2019.
"""
reading = "ההסכם גובר: מורה לא אקדמאי באופק חדש המשובץ בדרגה 1–4.5 זכאי מ־1.9.2019 לסכום הדרגה שלו, צמוד כפי שהחוזר מצמיד את סכומי הדרגות (738.15 ₪ לדרגה 1 במשרה מלאה). ה־L4 של החוזר מקודד אותו כלשונו, וההסכם מיובא כדי לחשב את הצד שלו."
