body = """
החוזר בא בהמשך לחוזרים תשע"ו/4 ותשע"ו/5 כאחד, וחל על עובדי הוראה בגני הילדים, בבתי הספר היסודיים, בחטיבות הביניים, בחטיבה העליונה ובמכללות. פסקת התשלום שלו משלמת את החלק השני "לעובדים אשר היו זכאים לחלק הראשון של המענק לפי חוזרנו לבעלויות תשע"ו/5", בסכום השווה לחלק הראשון ששולם לפי אותו חוזר. סעיף 2 קובע אחר כך תנאים משלו למענק — העסקה ברצף מיום 1.9.2015 עד יום 1.1.2016, ו־1,000 ש"ח יחסית לחלקיות המשרה הממוצעת — לכל עובד שהחוזר חל עליו.

עובד שפסקת התחולה חלה עליו ועומד בתנאי סעיף 2, אך לא היה זכאי לחלק הראשון לפי תשע"ו/5 — גננת, שהחלק הראשון שלה בא לפי תשע"ו/4 — מקבל תשלום לפי סעיף 2 ואינו נמנה עם מי שפסקת התשלום משלמת להם; גם אין פסקת התשלום נותנת לה סכום, שכן לא שולם לה חלק ראשון לפי תשע"ו/5. שתי הפסקאות גם קובעות מבחנים שונים לאותם אנשים, והן נפרדות גם בכיוון ההפוך: התקופה הקובעת של חוזר תשע"ו/5 הייתה מיום 1.9.2015 עד יום 1.12.2015, וזו של סעיף 2 נמשכת עד 1.1.2016. מורה בחטיבה העליונה שהועסקה מיום 1.9.2015 ועזבה ביום 15.12.2015 הייתה זכאית לחלק הראשון לפי תשע"ו/5, ולכן פסקת התשלום משלמת לה את החלק השני; בתקופה של סעיף 2 היא אינה עומדת.
"""
reading = "תנאי סעיף 2 קובעים למי משולם, לכל עובד שהחוזר חל עליו; ההפניה של פסקת התשלום לחוזר תשע\"ו/5 נקראת כמונה את מקבלי החלק הראשון לפי שני החוזרים שהמבוא בא בהמשך להם, והסכום שבה נקרא כסכום שסעיף 2 מחשב. לפי קריאה זו מורה שעזבה בין 1.12.2015 ל־1.1.2016 אינה מקבלת את החלק השני."
