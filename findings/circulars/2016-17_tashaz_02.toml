# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2016-17_tashaz_02-a"
kind = "contradiction"
stage = "writing"
keys = ["preamble/p20", "preamble/p22", "preamble/p23", "art_2__para_a"]
quote = "לעובדים אשר היו זכאים לחלק הראשון של המענק לפי חוזרנו לבעלויות תשע\"ו/5 · אשר היה מועסק ברצף מיום 1.9.2015 ועד ליום 1.1.2016 · בגני הילדים, בבתי הספר היסודיים, בחטיבות הביניים, בחטיבה העליונה ( כולל כיתות י\"ג-י\"ד) ובמכללות להכשרת עובדי הוראה"
title = "Who is paid the second part: circular 2015-16/5's first-part recipients, or every covered employee who meets section 2?"
body = """
The circular follows both circulars 2015-16/4 and 2015-16/5 and applies to teaching staff in kindergartens, elementary schools, junior high schools, the high schools and the colleges. Its payment paragraph pays the second part "to the employees who were entitled to the first part of the grant under our circular 2015-16/5", in an amount equal to the first part paid under that circular. Section 2 then sets its own conditions for the grant — continuous employment from 1.9.2015 to 1.1.2016, 1,000 NIS pro rata to the average position — for every employee the circular covers.

An employee covered by the application paragraph who meets section 2's conditions but was not entitled to the first part under 2015-16/5 — a kindergarten teacher, whose first part came under 2015-16/4 — is paid by section 2 and is not among those the payment paragraph pays; nor does the payment paragraph give her an amount, since no first part was paid to her under 2015-16/5. The two paragraphs also state different tests for the same people, and they part the other way too: circular 2015-16/5's determining period ran from 1.9.2015 to 1.12.2015, section 2's runs to 1.1.2016. A high-school teacher employed from 1.9.2015 who left on 15.12.2015 was entitled to the first part under 2015-16/5, so the payment paragraph pays her the second part; section 2's period she does not meet.
"""
reading = "Section 2's conditions decide who is paid, for every covered employee; the payment paragraph's reference to circular 2015-16/5 is read as naming the first-part recipients of both circulars the recital follows, and its amount as the one section 2 computes. On that reading a teacher who left between 1.12.2015 and 1.1.2016 is not paid the second part."
l4 = "l4/circulars/2016-17_tashaz_02.l4"
evidence = "`the payment paragraph and section 2 state two tests`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2016-17_tashaz_02-b"
kind = "broken-reference"
stage = "writing"
keys = ["art_2__para_b", "art_2__para_e"]
quote = "לצורך חישוב הסכום לו זכאי כל עובד הוראה שזכאי למענק כאמור בסעיף קטן 1(א) לעיל · לעניין סעיף קטן 1(א) לעיל, מובהר כדלקמן"
title = "\"Subsection 1(א)\" does not exist in this circular"
body = """
§2ב computes the amount for "every employee entitled to the grant under subsection 1(א) above", and §2ה's clarifications are "for the purpose of subsection 1(א) above". In this circular §1 has no paragraph (א): it is the clause on special payment dates for sick leave without pay and maternity leave. The entitlement and the determining period the two references mean are in §2א.
"""
reading = "\"Subsection 1(א)\" is read as §2א, the paragraph that grants the grant and defines the determining period."
l4 = "l4/circulars/2016-17_tashaz_02.l4"
evidence = "`§2's \"subsection 1(א)\" is not in this circular`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2016-17_tashaz_02-c"
kind = "broken-reference"
stage = "writing"
keys = ["art_2__para_e__subpara_8__cls_1"]
quote = "יהיה זכאי למענק החד פעמי, לפי הוראות שבפסקה (2) להלן"
title = "ה.8.1 sends the unpaid-leave grant to a \"paragraph (2) below\" that is not below it"
body = """
ה.8.1 makes an employee on unpaid leave entitled to the grant "according to the provisions of paragraph (2) below". What follows it is ה.8.2 and then §2ו; none is "(2)". The only paragraph (2) in §2ה, ה(2), stands above ה.8.1 and is about unpaid leave after maternity leave — it sends the reader to ה(8), so read as the target the reference loops back on itself.
"""
reading = "\"Paragraph (2) below\" is ה.8.2, the next clause, which sets how the average position of an employee on unpaid leave is computed."
l4 = "l4/circulars/2016-17_tashaz_02.l4"
evidence = "`no paragraph (2) is below ה.8.1`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
