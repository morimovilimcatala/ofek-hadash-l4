# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2018-19_tashat_08-a"
kind = "overlap"
stage = "writing"
keys = ["art_2/t1"]
quote = "עד 0.3 משרה | 0 ‖ מ- 0.3 משרה עד 0.5 משרה כולל | 686 ‖ מ- 0.5 משרה ומעלה | 1,369"
title = "The physical-education table gives a 0.3 and a 0.5 position two amounts each"
body = """
Section 2 sets the additional clothing allowance of a physical-education teacher in three bands of position: "up to 0.3" (0), "from 0.3 to 0.5 inclusive" (686 shekels) and "from 0.5 and above" (1,369 shekels).

Each band's bound is also the next band's. A position of exactly 0.3 is "up to 0.3" and "from 0.3", so the table gives it 0 and 686. A position of exactly 0.5 is "to 0.5 inclusive" and "from 0.5", so it gives 686 and 1,369: the word "כולל" added to the middle band (it is not in the table of circular תשע"ח/7) places 0.5 in that band, but the top band still opens "from 0.5" and was not changed to match.
"""
reading = "The middle band's \"כולל\" governs 0.5 (686), and its \"from\" governs 0.3 (686); the top band is read as above 0.5, so each position has one answer and every band still applies to some position."
l4 = "l4/circulars/2018-19_tashat_08.l4"
evidence = "`the physical-education table overlaps at its bounds`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2018-19_tashat_08-b"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_d", "art_1__para_e"]
quote = "קצובת הביגוד תשולם יחסית להיקף המשרה של העובד ולא יותר ממשרה אחת מלאה (100%) · זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "Above a full position: no more than one allowance (§1d), or a proportional allowance from each employer (§1e)?"
body = """
§1d: the clothing allowance is paid in proportion to the employee's position "and no more than one full position (100%)". §1e: an employee with more than one employer whose total position is above 100% is entitled to receive from each employer separately the allowance proportional to the position with that employer.

For 80% with one employer and 60% with another, §1d caps the allowance at one full allowance (2,150 shekels); §1e has the employers pay 80% and 60% of it, 140% (3,010 shekels) in all. §1d does not limit itself to one employer, and §1e does not say it is an exception to §1d.
"""
reading = "§1e is the specific rule for several employers and governs them; §1d's cap applies to an employee with one employer."
l4 = "l4/circulars/2018-19_tashat_08.l4"
evidence = "`the two employers pay more than one full allowance`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2018-19_tashat_08-c"
kind = "gap"
stage = "writing"
keys = ["art_3__para_a", "art_3__para_b"]
quote = "יהיה זכאי לקבל מדי שנה זוג נעליים ושני חלוקים · יהיה זכאי לקבל שני חלוקים לשנה"
title = "A technological teacher in subjects of both lists: shoes and two coats, or that and two more coats?"
body = """
§3(a) gives a technological teacher or professional instructor in one of thirteen subjects a pair of shoes and two coats a year (566 shekels); §3(b) gives one in another thirteen subjects two coats a year (352 shekels).

A teacher who teaches subjects from both lists — mechatronics and electronic systems, say — meets both clauses. The circular does not say whether the entitlements add up (566 + 352) or whether the larger, which already includes two coats, is the whole entitlement.
"""
reading = "The entitlements do not add up: the teacher gets shoes and two coats (566), which already include the two coats of §3(b)."
l4 = "l4/circulars/2018-19_tashat_08.l4"
evidence = "`both technological lists reach one teacher`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
