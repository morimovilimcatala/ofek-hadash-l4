"""
reading = "ה\"כולל\" של המדרגה האמצעית קובע לגבי 0.5 (686), וה\"מ־\" שלה קובע לגבי 0.3 (686); המדרגה העליונה נקראת כמעל 0.5, כך שלכל משרה יש תשובה אחת וכל מדרגה עדיין חלה על משרה כלשהי."
