body = """
§1ד: קצובת הביגוד תשולם יחסית להיקף המשרה של העובד "ולא יותר ממשרה אחת מלאה (100%)". §1ה: עובד הוראה המועסק אצל יותר ממעסיק אחד והיקף משרתו הכוללת מעבר ל־100% זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו.

לעובד במשרה של 80% אצל מעסיק אחד ו־60% אצל מעסיק אחר, §1ד מגביל את הקצובה לקצובה מלאה אחת (2,150 ש"ח); §1ה מחייב את המעסיקים לשלם 80% ו־60% ממנה, 140% (3,010 ש"ח) בסך הכול. §1ד אינו מגביל את עצמו למעסיק אחד, ו־§1ה אינו אומר שהוא חריג ל־§1ד.
"""
reading = "§1ה הוא הכלל המיוחד לכמה מעסיקים והוא חל עליהם; התקרה של §1ד חלה על עובד שיש לו מעסיק אחד."
