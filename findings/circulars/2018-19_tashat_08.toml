body = """
סעיף 2 קובע את קצובת הביגוד הנוספת של מורה לחינוך גופני בשלוש מדרגות של משרה: "עד 0.3" (0), "מ־0.3 עד 0.5 כולל" (686 ש"ח) ו"מ־0.5 ומעלה" (1,369 ש"ח).

