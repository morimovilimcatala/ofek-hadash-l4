"""
reading = "שני הסוגים נקראים כמחלקים את כל עובדי ההוראה של סעיף 1 לפי תנאי הרפורמה בלבד — הקריאה שבה \"בין אם מועסקים על פי תנאי הרפורמה ובין אם לאו\" של סעיף 1 אינו משאיר איש בחוץ."
