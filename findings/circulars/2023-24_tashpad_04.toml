סעיף 4ב קובע כימי חופשה את "הימים החלים בין יום כיפור (י"א בתשרי תשפ"ד) לערב סוכות (י"ד בתשרי תשפ"ד)", במקום שלושת ימי הלימודים שנוספו ב־4א(1)–(3). יום כיפור חל בי' בתשרי, לא בי"א, ו"בין" אינו אומר אם התאריכים שבקצותיו נכללים.

בין התאריכים המודפסים, בלעדיהם, ימי החופשה הם י"ב וי"ג בתשרי (שני ימים); בהכללת שני התאריכים המודפסים, י"א עד י"ד בתשרי (ארבעה); בין יום כיפור בתאריכו האמיתי לבין ערב סוכות, בלעדיהם, י"א עד י"ג בתשרי (שלושה). שלוש הקריאות נותנות לוחות שנה שונים לחטיבות העליונות.
"""
