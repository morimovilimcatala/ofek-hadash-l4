# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2023-24_tashpad_04-a"
kind = "gap"
stage = "writing"
keys = ["art_1/p1", "art_2/p1", "art_2/p2", "art_3/p1", "art_3/p3"]
quote = "הסכם זה יחול על עובדי ההוראה … בין אם מועסקים על פי תנאי הרפורמה ובין אם לאו · \"עובדי הוראה ברפורמה\" – מורים ומנהלים המועסקים לפי תנאי רפורמת עוז לתמורה"
title = "The two classes of section 2 cover only teachers and principals, not every teaching employee of section 1"
body = """
Section 1 applies the agreement to every teaching employee covered by the Oz LaTmura agreement of 14.8.2011, "whether employed under the reform's terms or not". Section 2 then defines the two classes the advance of section 3 is paid to — "teaching employees in the reform" and "not in the reform" — as "מורים ומנהלים" (teachers and principals) employed, or not employed, under the reform's terms.

A teaching employee to whom section 1 applies but who is neither a teacher nor a principal falls in neither class, so section 3 pays such an employee no advance although the agreement applies to him. The text does not say whether that is intended.
"""
reading = "The two classes are read as dividing all of section 1's teaching employees by the reform's terms alone, the reading under which section 1's \"whether under the reform's terms or not\" leaves no one out."
l4 = "l4/circulars/2023-24_tashpad_04.l4"
evidence = "`a covered teaching employee who is neither teacher nor principal is in neither class`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-24_tashpad_04-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_4__para_b/p2"]
quote = "הימים החלים בין יום כיפור ) י\"א בתשרי תשפ\"ד( לערב סוכות ) י\"ד בתשרי תשפ\"ד( –זאת במקום הימים המפורטים בסעיפים א ) (1 עד א )(3"
title = "Which Tishrei days become holidays: Yom Kippur is dated 11 Tishrei and \"between\" leaves its ends open"
body = """
Section 4ב makes holidays of "the days falling between Yom Kippur (11 Tishrei 5784) and the eve of Sukkot (14 Tishrei 5784)", in place of the three days of study added by 4א(1)–(3). Yom Kippur falls on 10 Tishrei, not 11, and "between" does not say whether the dates at its ends are included.

Strictly between the printed dates, the holidays are 12 and 13 Tishrei (two days); with both printed dates included, 11 to 14 Tishrei (four); strictly between Yom Kippur on its true date and the eve of Sukkot, 11 to 13 Tishrei (three). The three readings give different calendars for the upper-secondary schools.
"""
reading = "The holidays are 11, 12 and 13 Tishrei: the days after Yom Kippur up to the eve of Sukkot, the printed 11 Tishrei read as the first of them. It is the reading under which the section's two dates are both respected as named days and three holidays replace the three days of study."
l4 = "l4/circulars/2023-24_tashpad_04.l4"
evidence = "`section 4ב's holidays read three ways give different day counts`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-24_tashpad_04-c"
kind = "gap"
stage = "writing"
keys = ["art_5"]
quote = "שיפוי יינתן במערכת התשלומים בתשלומי חודש ספטמבר המשולמים בראשית חודש אוקטובר."
title = "Section 5's reimbursement names neither what is reimbursed nor to whom"
body = """
Section 5 says only that "a reimbursement will be given in the payment system, in September's payments paid at the start of October". It does not say what is reimbursed (the advance of section 3, or something else), to whom (the owners, the employees) or by whom, and so it cannot be written as a duty without supplying all three.
"""
reading = "The Ministry of Education reimburses the owners for the advance of section 3, in September's payments made at the start of October 2023."
l4 = "l4/circulars/2023-24_tashpad_04.l4"
evidence = "`section 5's reimbursement has no object and no recipient`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
