ניכוי עודף שבוצע באוקטובר או בנובמבר 2009 מפוצה לפי ההנחיה ואינו מפוצה לפי פסק הדין כפי שאותו חוזר עצמו מדווח עליו. חוזר אינו גובר על פסק הדין שהוא מבצע, וחוזר זה קובע שתי תקופות.
