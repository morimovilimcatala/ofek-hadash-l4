[[finding]]
id = "F-2010-11_tashaa_01-a"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_a", "art_3__para_a__subpara_1", "art_3__para_b__subpara_1"]
quote = "אשר בתקופה שמיום 01/01/04 ועד יום, 30/09/09 או בחלקה,נוכה משכרם מעבר ל 4% · אשר בתקופה שמיום 01/01/04 ועד יום, 30/11/09 או בחלקה, בוצע ניכוי משכרו לקרן הפנסיה, מעבר ל4%"
title = "The compensation period ends on 30/09/09 in the ruling as reported and on 30/11/09 in the instruction"
body = """
Section 2(א) reports the National Labour Court's ruling: teachers insured in veteran funds from whose salary more than 4% plus the section 78יא rates was deducted in the period 01/01/04 – 30/09/09 are entitled to compensation for the excess. Sections 3(א)(1) and 3(ב)(1), the instructions that carry the ruling out for current and former employees, set the period as 01/01/04 – 30/11/09.

An excess deduction made in October or November 2009 is compensated under the instruction and not under the ruling as the same circular reports it. A circular does not outrank the ruling it implements, and this one states two periods.
"""
reading = "The instruction's period (to 30/11/09) is applied, as the operative text the owners are told to act on; it is the same period circular תש\"ע/1 used for the new funds. The ruling's text, not in the corpus, would settle it."
l4 = "l4/circulars/2010-11_tashaa_01.l4"
evidence = "`October 2009 is compensated by the instruction and not by the ruling`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
