title = "The physical-education table gives a 0.3 and a 0.5 position two amounts each"
body = """
§ב's additional clothing allowance for physical-education teachers is set by the share of a position in three rows: "0 to 0.3 of a position" (no amount), "from 0.3 to 0.5 of a position" (229) and "from 0.5 of a position and up" (454). Each row's upper bound is the next row's lower bound, and every bound is inclusive ("עד", "מ-").

So a teacher on exactly 0.3 of a position is in the first row and the second (nothing or 229), and one on exactly half a position — a common share — is in the second and the third (229 or 454). Every other share has one row.
"""
