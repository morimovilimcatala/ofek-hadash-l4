keys = ["att_5__hc_1"]
quote = "30.8גננת עמיתה שעובדת 5ימים בשבוע6.08 , 90 33.8 5 .4גננת עמיתה · בכל יום, היקף משרתה יהיה עד ל90%- משרה בלבד כי בפועל היא עובדת 30.8ש\"ש"
title = "Annex ה's worked examples do not all follow from the 6.08-hour day they state"
body = """
Annex ה works examples of positions by base, on a day of 7:55–14:00, which section 4.1.4 puts at 6.08 hours: five such days are 30.4 weekly hours, and the annex's own examples 1, 7, 8, 9 and 11 compute from 30.4 (e.g. 30.4/26.4 = 115.15%, less 3.04 hours for a day off every two weeks = 103.63%).

Example 4 — a colleague teacher working five days of 6.08 hours, "up to 90%" — prints 30.8 hours actually worked; five days of 6.08 are 30.4, and it is 30.4/33.8 that is 90% (30.8/33.8 is 91.1%). Examples 5 and 6 build on the 30.8. Examples 10 and 12 print 86.2% for a day off every two weeks on a base of 31.8, where the method of the other examples gives (30.4 − 3.04)/31.8 = 86.0%.
"""
reading = "The rule of 4.1.4–4.1.5 governs: the hours worked are the days times 6.08 and the scope is those hours over the base; the annex's figures are read as illustrations where they differ."
l4 = "l4/circulars/2023-24_tashpad_03.l4"
evidence = "`annex ה's examples do not all follow from the 6.08-hour day`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

