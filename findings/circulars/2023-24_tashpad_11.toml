quote = "וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150% משרה · או היתר להעסקה מעבר להיקפי משרה אלו (140% משרה- ללא רפורמה"
title = "מנהל מחוץ לרפורמות: מוגבל ל־150% (1ו.1) או ל־140% (החזרה בסוף הסעיף)?"
body = """
סעיף 1ו.1 מגביל עובד הוראה בתנאי טרום רפורמות ל־140% משרה אצל כלל מעסיקיו, ומנהל המועסק שלא לפי תנאי הרפורמה ל־150%. הפסקה החותמת את סעיף 1 חוזרת על ההיקפים — "140% משרה ללא רפורמה, 117% באופק חדש ו־125% משרה בעוז לתמורה" — ואומרת שאין לראות באמור משום היתר להעסקה מעבר להם.

החזרה נותנת מגבלה אחת, 140%, לכל מי שמחוץ לרפורמות. למנהל מחוץ לרפורמות המועסק, למשל, ב־145%, סעיף 1ו.1 מתיר את ההיקף והחזרה שוללת את ההיתר לו.

אותה שאלה, באותה לשון של מגבלת 150% ושל החזרה החותמת, עולה ב־`F-2023-24_tashpad_10-b`, והקריאה בשניהם אחת. החוזרים שונים בשני דברים: בחוזר הזה סעיפים 1ו.2 ו־1ו.3 קובעים למנהל מגבלה של 100% בעוז לתמורה ובאופק חדש, ובתשפ"ד/10 אין מגבלה כזו; והחזרה בתשפ"ד/10 מוסיפה "ולא יותר מ־42 שעות", שאינה כאן. לכן אותה קריאה נותנת למנהל ברפורמה 100% כאן, ו־125% או 117% שם.

חוזרי קצובת הביגוד של שאר השנים מתשע"ה עד תשפ"ו מדפיסים את ההגבלה בנוסח אחד ("חלה הגבלה על עובד הוראה לעבוד בהיקף משרה העולה על 140% משרה"), והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2014-15_tashae_07-f (תשע"ה/7), F-2015-16_tashav_08-f (תשע"ו/8), F-2016-17_tashaz_06-f (תשע"ז/6), F-2017-18_tashach_07-f (תשע"ח/7), F-2018-19_tashat_08-f (תשע"ט/8), F-2019-20_tashaf_11-a (תש"פ/11), F-2020-21_tashpa_08-b (תשפ"א/8), F-2021-22_tashpab_07-a (תשפ"ב/7), F-2022-23_tashpag_09-c (תשפ"ג/9), F-2024-25_tashpah_12-b (תשפ"ה/12) ו־F-2025-26_tashpo_08-c (תשפ"ו/8).
"""
reading = "קריאה אחת לשני החוזרים: מגבלה שהחוזר קובע במפורש למנהל עומדת, והחזרה החותמת חלה על כל מי שהחוזר אינו קובע לו מגבלה משלו. לכן מנהל מחוץ לרפורמות מוגבל ל־150%, ומורה מחוץ לרפורמות ל־140%. בחוזר הזה סעיפים 1ו.2 ו־1ו.3 קובעים למנהל (ובאופק חדש גם לסגן מנהל ראשון) מגבלה של 100% בעוז לתמורה ובאופק חדש, ולכן החזרה חלה רק על המורים."
l4 = "l4/circulars/2023-24_tashpad_11.l4"
evidence = "`the restated caps differ from 1ו.1 for a principal outside the reforms`"
