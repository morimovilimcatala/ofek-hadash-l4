הקריאות נבדלות למורה שמלמד חינוך גופני רק בחלק ממשרתו: מורה במשרה מלאה עם 40% בחינוך גופני מקבל 1,530 ₪ לפי המשרה כולה ו־767 ₪ לפי החלק שבחינוך הגופני. סעיף 3.3, לקצובה בחינוך הטכנולוגי, אומר במפורש שזו המשרה בחינוך הטכנולוגי; סעיף 2 אינו אומר זאת.

