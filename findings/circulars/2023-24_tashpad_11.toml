# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2023-24_tashpad_11-a"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_f__subpara_1", "art_1/p5"]
quote = "וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150% משרה · או היתר להעסקה מעבר להיקפי משרה אלו (140% משרה- ללא רפורמה"
title = "מנהל מחוץ לרפורמות: מוגבל ל־150% (1ו.1) או ל־140% (החזרה בסוף הסעיף)?"
body = """
סעיף 1ו.1 מגביל עובד הוראה בתנאי טרום רפורמות ל־140% משרה אצל כלל מעסיקיו, ומנהל המועסק שלא לפי תנאי הרפורמה ל־150%. הפסקה החותמת את סעיף 1 חוזרת על ההיקפים — "140% משרה ללא רפורמה, 117% באופק חדש ו־125% משרה בעוז לתמורה" — ואומרת שאין לראות באמור משום היתר להעסקה מעבר להם.

החזרה נותנת מגבלה אחת, 140%, לכל מי שמחוץ לרפורמות. למנהל מחוץ לרפורמות המועסק, למשל, ב־145%, סעיף 1ו.1 מתיר את ההיקף והחזרה שוללת את ההיתר לו.

אותה שאלה, באותה לשון של מגבלת 150% ושל החזרה החותמת, עולה ב־`F-2023-24_tashpad_10-b`, והקריאה בשניהם אחת. החוזרים שונים בשני דברים: בחוזר הזה סעיפים 1ו.2 ו־1ו.3 קובעים למנהל מגבלה של 100% בעוז לתמורה ובאופק חדש, ובתשפ"ד/10 אין מגבלה כזו; והחזרה בתשפ"ד/10 מוסיפה "ולא יותר מ־42 שעות", שאינה כאן. לכן אותה קריאה נותנת למנהל ברפורמה 100% כאן, ו־125% או 117% שם.
"""
reading = "קריאה אחת לשני החוזרים: מגבלה שהחוזר קובע במפורש למנהל עומדת, והחזרה החותמת חלה על כל מי שהחוזר אינו קובע לו מגבלה משלו. לכן מנהל מחוץ לרפורמות מוגבל ל־150%, ומורה מחוץ לרפורמות ל־140%. בחוזר הזה סעיפים 1ו.2 ו־1ו.3 קובעים למנהל (ובאופק חדש גם לסגן מנהל ראשון) מגבלה של 100% בעוז לתמורה ובאופק חדש, ולכן החזרה חלה רק על המורים."
l4 = "l4/circulars/2023-24_tashpad_11.l4"
evidence = "`the restated caps differ from 1ו.1 for a principal outside the reforms`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-24_tashpad_11-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_2/t1"]
quote = "שיעור העסקה | הסכום לתשלום ‖ מתחת לשליש משרה (33.333%) | 0 ‖ משליש משרה עד חצי משרה כולל ( 50%) | 767 ₪."
title = "קצובת החינוך הגופני לפי \"שיעור העסקה\": המשרה כולה, או החלק שבחינוך הגופני?"
body = """
סעיף 2 נותן למורה לחינוך גופני קצובת ביגוד נוספת לפי "שיעור העסקה": כלום מתחת לשליש משרה, 767 ₪ משליש משרה עד חצי משרה כולל, 1,530 ₪ מעל לחצי משרה. הוא אינו אומר אם השיעור הוא העסקתו של המורה כולה או החלק ממנה שבו הוא מלמד חינוך גופני.

הקריאות נבדלות למורה שמלמד חינוך גופני רק בחלק ממשרתו: מורה במשרה מלאה עם 40% בחינוך גופני מקבל 1,530 ₪ לפי המשרה כולה ו־767 ₪ לפי החלק שבחינוך הגופני. סעיף 3.3, לקצובה בחינוך הטכנולוגי, אומר במפורש שזו המשרה בחינוך הטכנולוגי; סעיף 2 אינו אומר זאת.
"""
reading = "השיעור הוא החלק מהמשרה שבו המורה מלמד חינוך גופני, כפי שסעיף 3.3 מודד את הקצובה בחינוך הטכנולוגי לפי המשרה בחינוך הטכנולוגי."
l4 = "l4/circulars/2023-24_tashpad_11.l4"
evidence = "`the employment rate read two ways gives two PE rows`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

