# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2023-24_tashpad_11-a"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_f__subpara_1", "art_1/p5"]
quote = "וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150% משרה · או היתר להעסקה מעבר להיקפי משרה אלו (140% משרה- ללא רפורמה"
title = "A principal outside the reforms: capped at 150% (1ו.1) or at 140% (the closing restatement)?"
body = """
Section 1ו.1 caps a teaching employee under pre-reform terms at 140% of a position across all employers, and a principal employed outside the reform's terms at 150%. The paragraph closing section 1 restates the scopes — "140% without a reform, 117% in Ofek Hadash and 125% in Oz LaTmura" — and says the above is no permission to employ beyond them.

The restatement gives one cap, 140%, for everyone outside the reforms. For a principal outside the reforms employed at, say, 145%, section 1ו.1 allows the scope and the restatement denies permission for it.
"""
reading = "Section 1ו.1's specific cap for a principal (150%) stands; the closing restatement is read as the teachers' caps, as are its 125% and 117% beside 1ו.2's and 1ו.3's 100% for principals."
l4 = "l4/circulars/2023-24_tashpad_11.l4"
evidence = "`the restated caps differ from 1ו.1 for a principal outside the reforms`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-24_tashpad_11-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_2/t1"]
quote = "שיעור העסקה | הסכום לתשלום ‖ מתחת לשליש משרה (33.333%) | 0 ‖ משליש משרה עד חצי משרה כולל ( 50%) | 767 ₪."
title = "The physical-education allowance by \"employment rate\": the whole position, or the part in physical education?"
body = """
Section 2 gives a physical-education teacher an additional clothing allowance by "שיעור העסקה" (employment rate): nothing below a third of a position, ₪767 from a third to a half inclusive, ₪1,530 above a half. It does not say whether the rate is the teacher's whole employment or the part of it spent teaching physical education.

The readings differ for a teacher who teaches physical education in only part of the position: a full-position teacher with 40% in physical education takes ₪1,530 by the whole position and ₪767 by the physical-education part. Section 3.3, for the technological allowance, says expressly that it is the position in technological education; section 2 does not.
"""
reading = "The rate is the part of the position spent teaching physical education, as section 3.3 measures the technological allowance by the position in technological education."
l4 = "l4/circulars/2023-24_tashpad_11.l4"
evidence = "`the employment rate read two ways gives two PE rows`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-24_tashpad_11-c"
kind = "gap"
stage = "writing"
keys = ["art_1__para_a", "art_2/p2", "art_3/p1"]
quote = "א. יש לשלמה במלואה במשכורת חודש יולי 2024. · יש לשלם לעובד הוראה בחינוך הטכנולוגי/ מדריך מקצועי, קצובת ביגוד לשנת הלימודים תשפ\"ד"
title = "No payment month for the physical-education and technological allowances"
body = """
Section 1א dates the payment of the general clothing allowance: in full, in July 2024's salary — but 1א sits under section 1, which governs the general allowance alone. Sections 2 (physical education) and 3 (technological education) each describe an allowance "in addition to" the general one and say only that it is to be paid; neither names a month, nor refers to 1א.

The owners are told what to pay and not when, so the time by which the duty is breached is not stated.
"""
reading = "The two additional allowances are paid with the general allowance, in July 2024's salary."
l4 = "l4/circulars/2023-24_tashpad_11.l4"
evidence = "`sections 2 and 3 name no payment month`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
