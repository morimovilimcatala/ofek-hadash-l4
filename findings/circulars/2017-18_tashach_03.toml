# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2017-18_tashach_03-a"
kind = "broken-reference"
stage = "writing"
keys = ["art_18__para_a", "art_18__para_b"]
quote = "אשר בו ייקבע אופן הקצאת העלות לפי האמור בסעיפים קטנים )א() (1ו)-א() (2 לעיל, כי אז ביום 1.9.2018 תוקצה העלות לפי סעיף קטן )א() (1 לעיל"
title = "§18b allocates \"the cost under subsections (a)(1) and (a)(2)\", which §18a does not have"
body = """
§18a is one sentence: the parties will go on negotiating how to allocate the budget agreed for raising principals' pay. It has no subsections.

§18b provides that if no agreement on "the allocation of the cost under subsections (a)(1) and (a)(2) above" is signed by 1.4.2018, the cost "under subsection (a)(1)" is allocated on 1.9.2018 and the cost "under subsection (a)(2)" from 1.9.2019 to raising the "87 transition-to-reform" supplement. Neither subsection exists in the circular, so the cost being allocated — its amount and which part falls on which date — is not stated; only the resulting supplement amounts (460 shekels each step, to 548.52 and 1,008.52) are.
"""
reading = "(a)(1) and (a)(2) are read as the two tranches §18b(1) and §18b(2) themselves describe: the supplement rises by 460 shekels on 1.9.2018 and by another 460 on 1.9.2019. Nothing is encoded for the cost beyond those amounts."
l4 = "l4/circulars/2017-18_tashach_03.l4"
evidence = "`section 18b cites subparagraphs section 18a does not have`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2017-18_tashach_03-b"
kind = "broken-reference"
stage = "writing"
keys = ["art_11__para_11-1", "art_11__para_11-1/p2", "art_11__para_11-2", "art_5__para_b__subpara_b"]
quote = "מובהר כי ביצוע סעיפים 4.3ו) 4.5-טבלאות השכר המשולב למורים שאינם ברפורמה ומנהלים( 5.2, ו- ) 5.3 הגדלת תוספת שקלית 2016 למורים שאינם ברפורמה ומנהלים("
title = "§11 binds \"sections 5.2 and 5.3\" into one arrangement; section 5 has no 5.2 or 5.3"
body = """
§11.1 and §11.2 declare that sections 4.3, 4.5, 5.2, 5.3, 6, 7, 10.1 and 10.2 are one complete arrangement for teachers outside the reform and principals, carried out together and at the same time, none without the others.

Section 4 is numbered 4.1–4.5 and section 10 10.1–10.3, but section 5 is lettered: (a) for teachers in the reform, (b) clarifying that the supplement's other rules are unchanged, then a second (b) for teachers outside the reform and principals with its own (b) and (c). There is no 5.2 or 5.3. §11.1's gloss ("raising the 2016 shekel supplement for teachers outside the reform and principals") points at the second (b) and its (c) — the new schedule and the retroactive cancellation — but which provisions of section 5 the all-or-nothing rule binds is not stated in the circular's own numbering.
"""
reading = "\"5.2 and 5.3\" are read as section 5's provisions for teachers outside the reform and principals: the new shekel schedule and the retroactive cancellation of the former one."
l4 = "l4/circulars/2017-18_tashach_03.l4"
evidence = "`section 11 names provisions section 5 does not have`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2017-18_tashach_03-c"
kind = "broken-reference"
stage = "writing"
keys = ["art_8__para_8-1", "art_3/p1"]
quote = "תחושב למנהלים ברפורמה, החל מיום 1.9.2017 על בסיס השכר המשולב )לפי סעיף 3 לעיל("
title = "§8.1 computes on \"the combined salary (under section 3 above)\"; section 3 is the definitions"
body = """
§8.1 computes the transition-to-reform supplement of principals in the reform "on the combined salary (under section 3 above)", the '94 supplement and "the merger supplement (under section 6 above)". Section 6 is indeed the merger supplement; but section 3 is the definitions section, which says nothing of the combined salary. The combined-salary tables are section 4 (4.1 for teachers in the reform, 4.3–4.5 for those outside it and principals).

A principal in the reform is a "principal", and §4.3 puts principals with the teachers outside the reform, but §4.1 speaks of "teachers in the reform" only; which of section 4's tables §8.1 means is therefore not settled by a reference to section 3.
"""
reading = "\"Section 3\" is read as section 4, the combined-salary tables, applied to a principal in the reform under §4.3 (principals of both kinds), which is how the encoding places every principal."
l4 = "l4/circulars/2017-18_tashach_03.l4"
evidence = "`section 8.1 cites the definitions for the combined salary`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2017-18_tashach_03-d"
kind = "gap"
stage = "writing"
keys = ["art_15/p1", "art_15/p2", "art_15__para_1", "art_15__para_2"]
quote = "מורה הממלא תפקיד של \"מורה חונך\" יהיה זכאי · לגבי מורה שאינו ברפורמה )למען הסר ספק –אינו מנהל( -השכר המשולב, תוספת '94 ותוספת מיזוג רכיבים"
title = "The mentor stipend has no base for a principal"
body = """
§15 gives "a teacher who fills the role of mentor teacher" 2.4% per intern, up to three, computed on a base §15(1)–(2) set: for a teacher in the reform, the combined salary and the Oz LeTmura supplement; for a teacher outside the reform — "for the avoidance of doubt, not a principal" — the combined salary, the '94 supplement and the merger supplement.

§3 defines teachers in and outside the reform apart from principals. The words "not a principal" contemplate a principal who mentors and take him out of the second base, but no base is given for him, in or outside the reform. Whether a principal who mentors an intern is paid the stipend at all, and on what, is not decided.
"""
reading = "A principal has no mentor stipend under this section: no base is given, and the encoding returns none for either kind of principal."
l4 = "l4/circulars/2017-18_tashach_03.l4"
evidence = "`a principal mentor has no stipend base`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
