§8.1 מחשב את "תוספת מעבר לרפורמה" של מנהלים ברפורמה על בסיס השכר המשולב (לפי סעיף 3 לעיל), תוספת 94' ותוספת מיזוג רכיבים (לפי סעיף 6 לעיל). סעיף 6 אכן הוא תוספת מיזוג רכיבים; אך סעיף 3 הוא סעיף ההגדרות, שאינו אומר דבר על השכר המשולב. טבלאות השכר המשולב הן סעיף 4 (4.1 למורים ברפורמה, 4.3–4.5 לאלה שאינם ברפורמה ולמנהלים).

