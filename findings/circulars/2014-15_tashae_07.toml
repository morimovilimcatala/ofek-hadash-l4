kind = "gap"
stage = "writing"
keys = ["art_1__para_a", "art_2/p1", "art_3/p1"]
quote = "יש לשלמה במלואה במשכורת חודש יולי 2015 · יש לשלם לעובד הוראה בחינוך הטכנולוגי/ מדריך מקצועי, קצובת ביגוד לשנת הלימודים תשע\"ה"
title = "אין מועד תשלום לקצובות החינוך הגופני והחינוך הטכנולוגי"
body = """
§1א קובע מועד לקצובת הביגוד הכללית: היא משולמת במלואה במשכורת חודש יולי 2015. §2 (חינוך גופני) ו־§3 (חינוך טכנולוגי) מעניקים כל אחד קצובה "בנוסף" לקצובה הכללית ואינם מציינים חודש לתשלומה.

§1א נמצא תחת הכותרת של סעיף 1 עצמו ("קצובת ביגוד לשנת הלימודים תשע"ה", הקצובה הכללית), ולכן לפי מקומו אינו חל על §§2–3; החוזר אינו אומר מתי הקצובות הנוספות מגיעות לתשלום.

אותה שאלה עולה ב־13 חוזרי קצובת ביגוד מתשס"ז עד תשע"ח, והיא נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-f (תשס"ז/7), F-2007-08_tashsach_06-e (תשס"ח/6), F-2008-09_tashsat_10-f (תשס"ט/10), F-2009-10_tasha_05-f (תש"ע/5), F-2010-11_tashaa_03-e (תשע"א/3), F-2011-12_tashab_13-d (תשע"ב/13), F-2012-13_tashag_08-e (תשע"ג/8), F-2012-13_tashag_09-e (תשע"ג/9), F-2013-14_tashad_08-f (תשע"ד/8), F-2014-15_tashae_07-c (תשע"ה/7), F-2015-16_tashav_08-c (תשע"ו/8), F-2016-17_tashaz_06-c (תשע"ז/6) ו־F-2017-18_tashach_07-e (תשע"ח/7).
"""
reading = "הקצובות הנוספות משולמות עם הקצובה הכללית, במשכורת חודש יולי 2015, כקצובות שהחוזר מעניק בנוסף לה."
l4 = "l4/circulars/2014-15_tashae_07.l4"
evidence = "`sections 2 and 3 name no payment month`"
