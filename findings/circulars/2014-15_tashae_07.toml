מורה במשרה מלאה עם חמישית משרה בחינוך גופני מקבל 0 לפי הקריאה הראשונה ו־1,342 ₪ לפי השנייה.

אותן מילים מודפסות ב־14 חוזרים מתשס"ז עד תשע"ח, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-d (תשס"ז/7), F-2007-08_tashsach_06-c (תשס"ח/6), F-2008-09_tashsat_10-c (תשס"ט/10), F-2009-10_tasha_05-c (תש"ע/5), F-2010-11_tashaa_03-c (תשע"א/3), F-2011-12_tashab_08-c (תשע"ב/8), F-2011-12_tashab_13-e (תשע"ב/13), F-2012-13_tashag_08-d (תשע"ג/8), F-2012-13_tashag_09-d (תשע"ג/9), F-2013-14_tashad_08-e (תשע"ד/8), F-2014-15_tashae_07-e (תשע"ה/7), F-2015-16_tashav_08-e (תשע"ו/8), F-2016-17_tashaz_06-e (תשע"ז/6) ו־F-2017-18_tashach_07-d (תשע"ח/7).
"""
