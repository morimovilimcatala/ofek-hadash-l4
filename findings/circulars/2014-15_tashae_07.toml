kind = "overlap"
stage = "verification"
keys = ["art_3__para_1__subpara_a", "art_3__para_1__subpara_b"]
quote = "באחד המקצועות המפורטים להלן, יהיה זכאי לקבל מדי שנה זוג נעליים ושני חלוקים · באחד המקצועות המפורטים להלן יהיה זכאי לקבל שני חלוקים לשנה"
title = "עובד הוראה המלמד מקצועות משתי הרשימות זכאי לשני הענקים, והחוזר אינו אומר אם הם מצטברים"
body = """
עובד הוראה בחינוך הטכנולוגי באחד ממקצועות §3.1א זכאי לזוג נעליים ושני חלוקים; באחד ממקצועות §3.1ב — לשני חלוקים. אין מקצוע המופיע בשתי הרשימות, אך עובד הוראה יכול ללמד יותר ממקצוע אחד, למשל מכטרוניקה ומערכות אלקטרוניות, ואז שני הסעיפים חלים עליו.

אם הענקים מצטברים, הוא מקבל נעליים וארבעה חלוקים (554 + 344 ₪); אם הגדול מביניהם, הכולל את שני החלוקים, מספיק — 554 ₪. החוזר אינו אומר איזו מהן.

אותן הוראות מודפסות ב־13 חוזרי קצובת ביגוד מתשס"ז עד תשע"ח, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-e (תשס"ז/7), F-2007-08_tashsach_06-d (תשס"ח/6), F-2008-09_tashsat_10-e (תשס"ט/10), F-2009-10_tasha_05-e (תש"ע/5), F-2010-11_tashaa_03-f (תשע"א/3), F-2011-12_tashab_13-c (תשע"ב/13), F-2012-13_tashag_08-c (תשע"ג/8), F-2012-13_tashag_09-c (תשע"ג/9), F-2013-14_tashad_08-d (תשע"ד/8), F-2014-15_tashae_07-d (תשע"ה/7), F-2015-16_tashav_08-d (תשע"ו/8), F-2016-17_tashaz_06-d (תשע"ז/6) ו־F-2017-18_tashach_07-c (תשע"ח/7).
"""
reading = "עובד כזה מקבל את הענק הגדול, זוג נעליים ושני חלוקים: שני החלוקים של §3.1ב כלולים בו."
