§2א מחליף את נספחים א', ב' ו־ג' האמורים בסעיף קטן 4.1 להסכם הקיבוצי מיום 14.3.2018, המופיעים בחוזר תשע"ח/3, והמבוא מתאר את התיקון כהוספת טבלאות לשתי דרגות. סעיף 4.1 של אותו הסכם, כפי שחוזר תשע"ח/3 מפרסם אותו, מעלה את טבלאות הרפורמה ב־18.212% החל מ־1.9.2017 (נספח א') ומעדכן אותן החל מ־1.9.2018 לוותק 1 עד 7 (נספח ב').

