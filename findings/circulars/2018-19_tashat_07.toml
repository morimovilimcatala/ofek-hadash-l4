[[finding]]
id = "F-2018-19_tashat_07-a"
kind = "contradiction"
stage = "examples"
keys = ["art_2__para_a", "preamble/p13", "att_1__hc_1/t1", "att_2__hc_1/t1"]
quote = "במקום נספחים א', ב' ו-ג' האמורים בסעיף קטן 4.1 להסכם הקיבוצי מיום ) 14.3.2018 המופיעים בחוזר לבעלויות תשע\"ח (3 /יבואו נספחים א', ב' ו-ג' המצורפים להלן · בנספחים המתוקנים נוספו טבלאות השכר עבור דרגות השכר מדריך מקצועי מוסמך בפועל ודרגת ביניים"
title = "The new annex B changes the salary at seniority 8 and above, which the agreement does not update on 1.9.2018"
body = """
§2a replaces annexes A, B and C "referred to in subsection 4.1 of the agreement of 14.3.2018 (in circular תשע\"ח/3)", and the recital describes the amendment as adding tables for two grades. Section 4.1 of that agreement, as circular תשע\"ח/3 publishes it, raises the reform tables by 18.212% from 1.9.2017 (annex A) and updates them from 1.9.2018 "for seniority 1 to 7" (annex B).

The new annex A reproduces the earlier 1.9.2017 table in the five existing grades. But the new annex B — the table from 1.9.2018 — differs from annex A at seniority 8 to 36 in 107 of those rows' 203 cells, each by one or two agorot (doctor, year 8: 5,438.28 in A, 5,438.29 in B). Under section 4.1 nothing above year 7 changes on 1.9.2018, so for those years the annex and the rule it implements give different salaries.
"""
reading = "The annexed tables govern as printed: from 1.9.2018 the salary is annex B's cell at every year of seniority."
l4 = "l4/circulars/2018-19_tashat_07.l4"
evidence = "`annex B changes years section 4.1(2) does not update`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

