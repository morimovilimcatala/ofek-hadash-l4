kind = "contradiction"
stage = "examples"
keys = ["art_2__para_a", "art_3__para_3", "att_2__hc_1/t1", "att_3__hc_1/t1"]
quote = "במקום נספחים א', ב' ו-ג' האמורים בסעיף קטן 4.1 להסכם הקיבוצי מיום ) 14.3.2018 המופיעים בחוזר לבעלויות תשע\"ח (3 /יבואו נספחים א', ב' ו-ג' המצורפים להלן · נספח ג' -טבלאות השכר המשולב למורים ברפורמה, החל מיום 1.12.2018"
title = "The new annex C is not annex B raised by 1.2%, in 51 of its 252 cells"
body = """
Section 4.1(3) of the agreement of 14.3.2018, whose annexes §2a replaces, raises the reform tables "by a further 1.2%" from 1.12.2018, as set out in annex C.

Raising each cell of the new annex B (from 1.9.2018) by 1.2% and rounding to the agora gives the new annex C's cell in 201 of its 252 cells; in the other 51 the printed figure differs by an agora. As with the earlier tables, annex C appears to have been computed from unrounded figures the circular does not print, so the rule and the annex give different salaries and the circular does not say on what base, or with what rounding, the 1.2% is applied.
"""
reading = "The annexed table governs: the salary from 1.12.2018 is the printed cell of annex C."
l4 = "l4/circulars/2018-19_tashat_07.l4"
evidence = "`annex C is not 1.2% on annex B`"
