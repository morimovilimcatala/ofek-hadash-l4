severity_why = "זכות וכסף תלויים בזה — המסלול שבו פורש מורה בן 55 עד 57 — אבל המשרד מפעיל את המסלולים כך בחוזר שנתי מאז הסכמי 1993–1995, הגילים נגזרים מגיל הפרישה שבחוק, וסעיף 3(ב) לחוק שוויון ההזדמנויות שומר זכות יתר לעובדת; השאלה שקולה: בינוני."
keys = ["hc_1/p3", "hc_1/p4", "hc_1/p6", "hc_1/p7"]
depends_on = ["F-2020-21_tashpa_06-a"]
quote = "עובדות הוראה מגיל 55 עד גיל 62"
title = "מסלולי הפרישה המוקדמת לפי מין: עובדת הוראה בת 55 עד 57 — מסלול ב' (קפ\"מ), עובד הוראה באותו גיל — מסלול א'; חוק שכר שווה — גמול אחר שווה לאותה עבודה"
body = """
החוזר קובע את מסלולי הפרישה המוקדמת של עובדי ההוראה בבעלויות העל־יסודיות לפי מין וגיל: מסלול א' (המסלול הנוסף) לעובדות הוראה מגיל 50 עד 55 ולעובדי הוראה מגיל 50 עד 58; מסלול ב' (קפ"מ, קרן פנסיה מוקדמת) לעובדות הוראה מגיל 55 עד 62 ולעובדי הוראה מגיל 58 עד 67. מגיל 50 עד 54 ומגיל 58 עד 62 שני המינים באותו מסלול; בגיל 55, 56 ו־57 העובדת פורשת למסלול ב' והעובד למסלול א' (בגיל 55 לפי קריאת הגבול של ממצא a).

פנסיה מוקדמת היא "גמול אחר" לפי סעיף 2 לחוק שכר שווה לעובדת ולעובד — טובת הנאה ו"כל תגמול אחר בכסף או בשווה כסף" שהמעסיק נותן בקשר לעבודה — ואין היא הטבה בקשר להולדה או להורות (סעיף 13). עובדת ועובד שפורשים מאותה משרה, באותה בעלות ובאותו גיל, עשו אותה עבודה, והחוזר מבחין ביניהם במין בלבד, לא בטעם שסעיף 6 מונה. סעיף 3(ב) לחוק שוויון ההזדמנויות שומר זכות יתר לעובדת לפי הסכם קיבוצי מלהיות הפליה — לעניין אותו חוק; לחוק שכר שווה אין סייג כזה.

מגיל 63 עד 67 לעובד יש מסלול ב' ולעובדת אין מסלול, משום שהיא כבר בגיל הפרישה שלה (62); אם הפנסיה שלה אז היא אותו גמול, החוזר אינו אומר, והשורה הזאת אינה שוקלת את זה.
"""
reading = "החוק גובר (`what section 2 of the Equal Pay Law owes each of them`; המוסכמות instruments.statute-floor ו־instruments.equal-pay-teaching): עובד הוראה בן 55 עד 57 זכאי לפרוש למסלול ב' כפי שעובדת הוראה בגילו זכאית; החוזר עומד כפי שהודפס בשאר הגילים."
