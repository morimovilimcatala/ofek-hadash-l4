# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2017-18_tashach_01-a"
kind = "broken-reference"
stage = "writing"
keys = ["art_3__para_d", "art_4__para_c", "art_4__para_c/p2"]
quote = "בשים לב לעדכון טבלאות השכר המשולב לפי סעיף 3 לעיל · על בסיס השכר המשולב (לפי סעיף 3 לעיל) בלבד"
title = "\"Section 3 above\" is cited for the combined-salary update, which this circular sets in section 1"
body = """
The circular sets out the agreement of 5.9.2017 in its own numbering: section 1 updates the combined-salary tables, section 2 the 2016 shekel supplement, section 3 the promotion-grade rate, section 4 the merged supplements, and §4a and §5a–b refer to them by those numbers and titles.

§3d explains that the cut in the promotion-grade rate is offset by "the update of the combined-salary tables under section 3 above", and §4c computes the transition-to-reform supplement "on the combined salary (under section 3 above)". In this circular section 3 is the promotion-grade change itself; the table update is section 1. The number appears to be the agreement's own, carried over without renumbering, but the circular does not say so, and read on its face the reference points at the wrong section.
"""
reading = "Both references are read as pointing at section 1 (the combined-salary tables), the only section that updates the combined salary."
l4 = "l4/circulars/2017-18_tashach_01.l4"
evidence = "`section 3 above is not the table update`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2017-18_tashach_01-b"
kind = "contradiction"
stage = "examples"
keys = ["art_3__para_a", "art_3__para_b/t1"]
quote = "והחל מיום ,1.12.2018 בשיעור של 1.67%מהשכר המשולב · שנייה | זכאות | 3.38% |  | 3.35%"
title = "From 1.12.2018 the cumulative promotion-grade rates are not multiples of the 1.67% per grade"
body = """
§3a makes each promotion grade 1.67% of the combined salary from 1.12.2018 (1.69% from 1.9.2017), and §3b replaces the table of section 20(11) of the Oz LeTmura agreement with a table of CUMULATIVE rates.

For 1.9.2017 the table's column is exactly 1, 2, 3 and 4 times 1.69% (1.69, 3.38, 5.07, 6.76). For 1.12.2018 it prints 1.67, 3.35, 5.02 and 6.69, where 2, 3 and 4 grades at 1.67% each are 3.34, 5.01 and 6.68. A teacher with two to four grades is given two different rates, 0.01 percentage point apart, by the two clauses.
"""
reading = "The printed table governs the cumulative rate (it is the text that replaces section 20(11)); §3a's per-grade figure is read as the rate of a single grade."
l4 = "l4/circulars/2017-18_tashach_01.l4"
evidence = "`the promotion table departs from the per-grade rate from 1.12.2018`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2017-18_tashach_01-c"
kind = "contradiction"
stage = "examples"
keys = ["art_1__para_a", "att_1__hc_1/t1", "att_1__hc_1/t2"]
quote = "והחל מיום 1.12.18 יעודכנו בשיעור נוסף של 1.2% · טבלאות השכר המשולב החדשות הכוללות את העדכון האמור מצורפות כנספח א'"
title = "The 1.12.2018 table is not the 1.9.2017 table raised by 1.2%, in 36 of its 180 cells"
body = """
§1a raises the combined-salary tables by 18.212% from 1.9.2017 and by a further 1.2% from 1.12.2018, and says the new tables including that update are annexed. Annex A prints both tables.

Raising each printed cell of the 1.9.2017 table by 1.2% and rounding to the agora gives the printed 1.12.2018 cell in 144 of the 180 cells; in the other 36 the printed figure differs by one agora either way (for a first-degree teacher in year 1, 3,507.99 × 1.012 = 3,550.09, printed 3,550.08). The 1.12.2018 table appears to have been computed from unrounded figures the circular does not print, so the rule and the annex give different salaries, and the circular does not say on what base, or with what rounding, the 1.2% is applied.
"""
reading = "The annexed table governs: the salary from 1.12.2018 is the printed cell, not 1.2% on the printed 1.9.2017 cell."
l4 = "l4/circulars/2017-18_tashach_01.l4"
evidence = "`the 1.12.2018 table is not 1.2% on the printed 1.9.2017 table`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
