Section 1 ¶4 divides the preparation allowance for a subject, "in hours and in percent", 70% to the year of the external examination and 30% to the year of the school assessment, where the two fall in different years. The only exception the circular names is a subject that had an alternative assessment before the reform (1 ¶5, and the table's last note: Chinese, German, the Arab world and Islam, social sciences).

