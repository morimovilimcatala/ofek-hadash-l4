§1 (הפסקה "באופן דומה, גם גמולי הבגרות…") מחלק את גמול ההכנה לבגרות למקצוע, "הן בש"ש והן באחוזים", 70% לשנה של בחינת הבגרות החיצונית ו־30% לשנה של ההערכה הבית ספרית, כאשר השתיים מתקיימות בשנים שונות. החריג היחיד שהחוזר מציין הוא מקצוע שהייתה בו הערכה חלופית לפני הרפורמה (§1, הפסקה "יש לציין כי בתחומי דעת בהם כבר היתה נהוגה הערכה חלופית…", וההערה האחרונה של הטבלה: סינית, גרמנית, העולם הערבי והאסלאם, מדעי החברה).

