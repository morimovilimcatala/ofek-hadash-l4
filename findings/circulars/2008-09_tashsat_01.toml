quote = "התוספת של 4.5%בחודשים אלו תוכפל בחלקיות תקופת ההעסקה בה ביצעו את השעה הפרטנית מתוך סך תקופת ההעסקה בשנת הלימודים"
title = "The summer supplement's share: which months are \"the period in which the hour was done\", out of which \"school year\"?"
body = """
§2 multiplies the July–August supplement by "the part of the period of employment in which they did the individual hour out of the whole period of employment in the school year". The individual hour began in January 2008, in the middle of the 2007-08 school year, and no hour is done in the summer.

Neither term of the fraction is fixed. The denominator may be the school year's employment month by month (September to August, twelve months for a full year) or its teaching months (September to June, ten). The numerator may be the months the hour was actually done (January to June) or the period from its start to the end of the year, summer included. For a teacher employed all year who did every hour, the share is 6/12, 6/10 or 8/12 — a supplement of a half, three fifths or two thirds.
"""
reading = "Months in which the hour was actually done over all months employed in the school year (September 2007 to August 2008): for a full-year teacher who did the hour from January, one half."
