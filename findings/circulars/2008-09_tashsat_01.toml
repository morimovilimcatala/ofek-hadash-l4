body = """
§2 מכפיל את התוספת של יולי–אוגוסט "בחלקיות תקופת ההעסקה בה ביצעו את השעה הפרטנית מתוך סך תקופת ההעסקה בשנת הלימודים". השעה הפרטנית החלה בינואר 2008, באמצע שנת הלימודים 2007–08, ובקיץ אין מבצעים שעה.

אף אחד משני האיברים של השבר אינו קבוע. המכנה יכול להיות ההעסקה בשנת הלימודים חודש אחר חודש (ספטמבר עד אוגוסט, שנים־עשר חודשים לשנה מלאה) או חודשי ההוראה שלה (ספטמבר עד יוני, עשרה). המונה יכול להיות החודשים שבהם השעה בוצעה בפועל (ינואר עד יוני) או התקופה מתחילתה ועד סוף השנה, כולל הקיץ. לעובד הוראה שהועסק כל השנה וביצע כל שעה, החלק הוא 6/12, 6/10 או 8/12 — תוספת של מחצית, שלוש חמישיות או שני שלישים.
"""
