title = "החוזר דוחה לאוקטובר 2011 גם את עדכון התוספות השקליות, וההסכם מיום 17.6.2009 דוחה את תוספת השכר בלבד"
body = """
סעיף 6 מזכיר את ההסכם מיום 17.6.2009 בין הסתדרות המורים למדינה, ש"הוסכם [בו] כי המועד לעדכון 'תוספת 2008' שלב ג' יידחה ממשכורת חודש דצמבר 2009 למשכורת חודש אוקטובר 2011", ומוסיף: "בהתאם לכך, תוספת 2008 שלב ג', וכן עדכון התוספות השקליות: הסכם תגבור הוראה '94 והסכם מסגרת '87 ידחו" לעובדי ההוראה שההסכם חל עליהם.

ההסכם מיום 17.6.2009 מתקן בהסכם מיום 21.2.2008 את סעיף 4(א)(3) בלבד — "במקום משכורת חודש דצמבר 2009 יבוא משכורת חודש אוקטובר 2011". השלמת התוספות השקליות ל־5% קבועה בסעיף נפרד, 4(ז)(3), ברשימת מועדים משלה, וההסכם אינו נוגע בה. לפי קריאת ההסכם כלשונו (הממצא F-hh-2009-b), התוספות השקליות מושלמות בדצמבר 2009, והחוזר דוחה מה שההסכם אינו דוחה.
"""
