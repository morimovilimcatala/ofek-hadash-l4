severity_why = "ההבדל בין 4.81% המודפס ל־5% חלקי 1.04 הוא אגורות בודדות בחודש, ושום תוצאה של ממש אינה תלויה בו."
keys = ["art_1/p2", "art_2/p2", "art_2/p3"]
quote = "תוספת השכר האחוזית 5% לחלק ל-1.04 =4.81%. · 4.81% הינו שיעור התוספת שיחושב על השכר המשולב ותוספת 2001 נכון לערכם הנוכחי"
title = "השיעור של שלב ג': 5% לחלק ל־1.04 הם 4.8077%, והחוזר מחיל 4.81%"
body = """
סעיף 1 חוזר על ההסכם: התוספת מושלמת ל־5% המחושבים על רכיבי השכר בערכם נכון לחודש דצמבר 2007, לפני תוספת השחיקה של 4% מינואר 2008. סעיף 2 ממיר זאת לשיעור על הערכים של היום בחילוק המודפס, 5% לחלק ל־1.04 שווה 4.81%, ונוקב ב־4.81% כשיעור התוספת על השכר המשולב ותוספת 2001.

החילוק נותן 4.8077%, לא 4.81%. אלה שני כללים שונים: על 10,000 ₪ של שכר משולב ותוספת 2001 השיעור המודפס משלם 481.00 ₪, ו־5% של ההסכם מערך דצמבר 2007 משלמים 480.77 ₪. הטקסט אינו אומר אם המספר המעוגל הוא הכלל או קירוב שלו.
"""
reading = "השיעור המודפס, 4.81%, חל: הוא גבוה מהחילוק (4.8077%, שהוא 5% של ההסכם מערכי דצמבר 2007), ולפי סעיף 22 לחוק הסכמים קיבוציים תנאי שהמעסיק משלם לפיו והוא לטובת העובד עומד בפני ההסכם, שאינו אוסר אותו. על 10,000 ₪ התוספת היא 481.00 ₪, ולא 480.77 ₪ של כלל ההסכם."
convention = "instruments.favourable-circular"
l4 = "l4/circulars/2009-10_tasha_02.l4"
evidence = "`section 2's division does not give the rate it prints`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

