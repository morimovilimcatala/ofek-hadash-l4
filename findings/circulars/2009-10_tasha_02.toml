quote = "תוספת השכר האחוזית 5%לחלק ל.4.81%= 1.04- · 4.81%הינו שיעור התוספת שיחושב על השכר המשולב ותוספת 2001 נכון לערכם הנוכחי"
title = "השיעור של שלב ג': 5% לחלק ל־1.04 הם 4.8077%, והחוזר מחיל 4.81%"
body = """
סעיף 1 חוזר על ההסכם: התוספת מושלמת ל־5% המחושבים על רכיבי השכר בערכם נכון לחודש דצמבר 2007, לפני תוספת השחיקה של 4% מינואר 2008. סעיף 2 ממיר זאת לשיעור על הערכים של היום בחילוק המודפס, 5% לחלק ל־1.04 שווה 4.81%, ונוקב ב־4.81% כשיעור התוספת על השכר המשולב ותוספת 2001.

החילוק נותן 4.8077%, לא 4.81%. אלה שני כללים שונים: על 10,000 ₪ של שכר משולב ותוספת 2001 השיעור המודפס משלם 481.00 ₪, ו־5% של ההסכם מערך דצמבר 2007 משלמים 480.77 ₪. הטקסט אינו אומר אם המספר המעוגל הוא הכלל או קירוב שלו.
"""
reading = "הכלל של ההסכם גובר על השיעור שהחוזר גוזר ממנו: מוחל החילוק עצמו, 5% לחלק ל־1.04 (4.8077%), שהוא 5% של ההסכם מערכי דצמבר 2007, ולא ה־4.81% המעוגל. על 10,000 ₪ התוספת היא 480.77 ₪."
