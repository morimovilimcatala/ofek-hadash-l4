severity_why = "כסף תלוי בכך, מעט: עדכון של 2% לשתי התוספות השקליות (כ־150 ₪ כל אחת) בכל אחד מ־22 החודשים שבין דצמבר 2009 לספטמבר 2011. החוזר הוא המצב הקיים; ההסכם שהוא מבצע נוקב בסעיף 4(א)(3) בלבד, ולשונו תומכת בעובד, אבל מבואו מדבר על דחיית העדכון כולו — שתי הקריאות אפשריות, ולכן בינונית."
