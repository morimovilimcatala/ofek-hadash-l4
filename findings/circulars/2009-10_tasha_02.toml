164.07 ₪ בתוספת 2.25%, מעוגל לאגורה, הם 167.76 ₪; 167.75 ₪ מתקבלים רק מערך של 164.06 ₪. אף חוזר בקורפוס אינו משנה את התוספת בין דצמבר 2009 לסוף 2010, ולכן שני החוזרים מדפיסים סכומים שונים לאותה תוספת. הממצא נרשם גם בחוזר תשע"ב/2, כ־F-2011-12_tashab_02-b.
"""
