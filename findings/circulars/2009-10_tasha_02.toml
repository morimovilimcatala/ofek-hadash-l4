[[finding]]
id = "F-2009-10_tasha_02-a"
kind = "ambiguity"
stage = "examples"
keys = ["art_1/p2", "art_2/p2", "art_2/p3"]
quote = "תוספת השכר האחוזית 5%לחלק ל.4.81%= 1.04- · 4.81%הינו שיעור התוספת שיחושב על השכר המשולב ותוספת 2001 נכון לערכם הנוכחי"
title = "Phase C's rate: 5% ÷ 1.04 is 4.8077%, and the circular applies 4.81%"
body = """
Section 1 restates the agreement: the raise is completed to 5% computed on the salary components as they stood in December 2007, before the 4% erosion addition of January 2008. Section 2 converts this to a rate on today's values by the printed division "5% ÷ 1.04 = 4.81%" and names 4.81% as the rate of the addition on the combined salary and tosefet 2001.

The division gives 4.8077%, not 4.81%. The two are different rules: on 10,000 ₪ of combined salary and tosefet 2001 the printed rate pays 481.00 ₪ and the agreement's 5% of the December 2007 value pays 480.77 ₪. The text does not say whether the rounded figure is the rule or an approximation of it.
"""
reading = "The printed 4.81% is applied, as the figure section 2 names \"the rate of the addition\" and the one the owners are told to compute with."
l4 = "l4/circulars/2009-10_tasha_02.l4"
evidence = "`section 2's division does not give the rate it prints`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
