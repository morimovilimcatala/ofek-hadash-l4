[[finding]]
id = "F-2015-16_tashav_02-a"
kind = "ambiguity"
stage = "writing"
keys = ["hc_1/p18", "hc_1/p19"]
quote = "יובהר כי ככלל, משרד החינוך אוסר העסקה של עובדי הוראה שאינם מועסקים על-ידי הבעלות אשר לה רישיון על ביה\"ס במסגרת תכנית הלימודים הרגילה · עם זאת, במוסד בו מועסקים עובדי הוראה על ידי גורם אחר"
title = "Is \"shoulder to shoulder\" employment forbidden, or allowed where the other body pays by the agreements?"
body = """
¶18: "as a rule" the ministry forbids employing, in the regular curriculum, teaching staff not employed by the owner that holds the school's licence. ¶19 opens "however": in an institution where another body employs teaching staff doing the same work as State or owner teachers in the regular hours, that body must pay them by every law and the collective agreements.

"As a rule" implies exceptions, and ¶19 is the only candidate the circular offers. Read as that exception, ¶19 permits another body's teachers in the regular hours provided they are paid by the agreements; read as a pay duty only, it leaves the employment forbidden and says who pays when it happens anyway. For an owner whose school has another body's teachers in the regular hours, paid by the agreements, the first reading finds no breach and the second does.
"""
reading = "¶18's prohibition stands; ¶19 is read as a duty to pay that applies where the prohibition has been breached, since it nowhere says the employment is allowed."
l4 = "l4/circulars/2015-16_tashav_02.l4"
evidence = "`¶18 and ¶19 give two answers for another body's teachers paid by the agreements`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
