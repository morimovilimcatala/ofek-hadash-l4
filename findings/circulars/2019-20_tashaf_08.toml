[[finding]]
id = "F-2019-20_tashaf_08-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_c__para_a__subpara_3/p6", "art_c__para_a__subpara_3/p7", "art_c__para_a__subpara_3/p8", "art_c__para_a__subpara_3/p9"]
quote = "54ו 11-חודשים 50 · 59ו 11-חודשים 55 · 63ו 11-חודשים 60 · 65 64"
title = "The grant table's last age band, \"64 – 65\", ends either at 65 or at the end of age 65"
body = """
§ג(א)'s table sets the special grant by age at the end of employment. The first three bands run from an age to "N and 11 months" — 50 to 54 and 11 months, 55 to 59 and 11 months, 60 to 63 and 11 months — so each covers whole years of age up to the last month of the last one. The fourth band is printed "64 – 65" (35,000 ₪), without the months.

Read on the pattern of the bands above it, "to 65" covers age 65 to its last month; read as written, it ends on reaching 65. An employee whose employment ends at 65 and 6 months receives 35,000 ₪ under the first reading and no grant under the second.
"""
reading = "The band ends on reaching 65: the only band printed without \"and 11 months\" is read as meaning what it prints, and 65 is the age at which the agreement's grant ceases."
l4 = "l4/circulars/2019-20_tashaf_08.l4"
evidence = "`an employee leaving at 65 and 6 months has a grant under one reading of the last row only`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2019-20_tashaf_08-b"
kind = "contradiction"
stage = "writing"
keys = ["art_g__para_f", "art_g__para_f/p3", "art_g__para_f/p7", "art_g__para_f/p8"]
quote = "מיד עם פרישת העובד ולא יאוחר מ 2 -חודשים מיום פרישת העובד · כי השיפוי שקבלה בגין יישום הסכם המכללות, הועבר לעובד ההוראה תוך 45 ימים מיום פרישתו"
title = "The request may be filed two months after retirement; the reimbursement it brings must reach the teacher within 45 days"
body = """
§ו.1 lets the owning body file the reimbursement request "immediately on the employee's retirement and no later than 2 months" after it. §ו.4 requires it to declare that "the reimbursement it received" was passed to the teacher "within 45 days" of the retirement, and §ד.2 adds that the Ministry will not handle a request before the retirement date.

The reimbursement can only be received after the request is filed and handled. An owner that files on day 50 — within §ו.1's two months — cannot have received the reimbursement, let alone passed it on, by day 45, so it can comply with §ו.1 and still be unable to make §ו.4's declaration truthfully, with §ו.5's offset as the consequence. The two time limits do not fit together.
"""
reading = "The 45 days are read as the period within which the owner pays the GRANT to the teacher (which §ג(ד) puts at the end of employment), and the declaration attests that payment; the request's two months then run independently."
l4 = "l4/circulars/2019-20_tashaf_08.l4"
evidence = "`a request filed on time can bring the reimbursement after it was due to the teacher`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2019-20_tashaf_08-c"
kind = "ambiguity"
stage = "writing"
keys = ["art_g__para_d", "art_g__para_d/p2", "art_g__para_d/p3", "art_g__para_d/p5", "art_g__para_d/p6"]
quote = "השיפוי בגין המענק המיוחד יינתן במקרים הבאים: · בפרישה מוקדמת לגמלאות של עובד הוראה באישור משרד החינוך · השיפוי יינתן לבעלות בגין עובד הוראה שפרש ואשר מקבל גמלה"
title = "The reimbursement \"cases\": early retirement with approval and drawing a pension — alternatives or both required?"
body = """
§ד says the reimbursement is given "in the following cases" and lists four items: (1) early retirement on pension approved by the Ministry's official letter; (2) a teacher who retired and receives a pension, with the pension fund's confirmation; (3) a ceiling of one full position across all owners; (4) the staff report as the basis.

"Cases" makes the items alternatives, but items 3 and 4 are plainly conditions that apply to every reimbursement, so the list mixes the two. For items 1 and 2 the difference matters: a teacher whose early retirement was approved but who does not yet draw a pension is reimbursed if they are alternative cases and is not if both are required.
"""
reading = "All four items are joint conditions: approved early retirement AND a pension in payment, within one full position, by the staff report — the reading consistent with items 3 and 4 and with §ד.2's refusal to handle a request before the retirement date."
l4 = "l4/circulars/2019-20_tashaf_08.l4"
evidence = "`an approved early retiree not yet drawing a pension is reimbursed under one reading of §ד only`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
