# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2013-14_tashad_08-a"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_a__subpara_4", "art_1__para_a__subpara_5", "art_2__para_a__subpara_4", "art_2__para_a__subpara_5"]
quote = "קצובת הביגוד תשולם יחסית להיקף המשרה של העובד ולא יותר ממשרה אחת מלאה (100%) · זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "1.א.4 and 2.א.4 cap the allowance at one full position; 1.א.5 and 2.א.5 let two employers pay more"
body = """
Section 1.א.4 pays the clothing allowance in proportion to the position and "no more than one full position (100%)". Section 1.א.5: an employee with more than one employer whose total position with both is above 100% receives from each employer the allowance proportional to the position held with it.

Sections 2.א.4 and 2.א.5 repeat the same two clauses, word for word, for the stages outside the upper division. An employee with two employers and more than a full position in total falls under both clauses of either pair. At 70% with one and 60% with the other, 1.א.4 gives one position's allowance, 1.א.5 gives 130% of it. The text does not say which governs.
"""
reading = "1.א.5 and 2.א.5 are the rule for an employee with more than one employer, 1.א.4 and 2.א.4 for an employee whose positions are all with one employer: 1.א.5 is the narrower case and names it expressly."
l4 = "l4/circulars/2013-14_tashad_08.l4"
evidence = "`one position and each its own share give different allowances for two employers above a full position`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2013-14_tashad_08-b"
kind = "overlap"
stage = "writing"
keys = ["art_3/t1"]
quote = "עד 0.3 משרה | 0 ‖ מ- 0.3 משרה עד 0.5 משרה | 676 ‖ מ-0.5 משרה ומעלה | 1347"
title = "The physical-education table gives positions of 0.3 and 0.5 two amounts each"
body = """
The additional clothing allowance for physical-education teachers is set by a table of three rows: "up to 0.3 position" (0), "from 0.3 position to 0.5 position" (676) and "from 0.5 position and above" (1347). Each boundary is printed in two rows: a teacher at exactly 0.3 of a position is "up to 0.3" and "from 0.3", and one at exactly 0.5 is "to 0.5" and "from 0.5".

Written as a function from the position to an amount, the table cannot be transcribed as printed; at 0.3 it gives 0 and 676, at 0.5 it gives 676 and 1347.
"""
reading = "A row governs from the position it opens at (\"מ-\"): 0.3 takes 676 and 0.5 takes 1347, reading \"עד\" as up to but not including the boundary. Every other position has exactly one row."
l4 = "l4/circulars/2013-14_tashad_08.l4"
evidence = "`the table gives 0.3 and 0.5 two amounts each`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2013-14_tashad_08-c"
kind = "gap"
stage = "examples"
keys = ["art_2__para_a__subpara_3/p2", "art_2__para_a__subpara_3/p3", "art_2__para_a__subpara_3/t1"]
quote = "שויתקם מגיע עד 25 שנים ( ועד בכלל) … שויתקם עולה על 25 שנים … 1-25 שנים | 1,273 ‖ 26 שנים ומעלה"
title = "The summary table leaves out seniorities the clause prices: under one year, and between 25 and 26"
body = """
Section 2.א.3 sets the reduced allowance outside the upper division by seniority: "up to 25 years (inclusive)" 84% of level 3, "above 25 years" 84% of level 4. The table that follows "for convenience" prints the same two rows as "1-25 years" (1,273) and "26 years and above" (1,777).

The two do not cover the same seniorities. A teacher with 25.5 years is "above 25" under the clause (1,777) and in neither row of the table; a teacher in the first year, with less than one year, is "up to 25" under the clause (1,273) and before the table's first row. The table cannot be read as a function of seniority for those cases.
"""
reading = "The clause governs and the table illustrates it: up to 25 years inclusive 1,273, above 25 years 1,777. Where the table has a row it agrees with the clause."
l4 = "l4/circulars/2013-14_tashad_08.l4"
evidence = "`the table has no row where the clause has an amount`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
