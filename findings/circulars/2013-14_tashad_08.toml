body = """
סעיף 1.א.4 משלם את קצובת הביגוד יחסית להיקף המשרה "ולא יותר ממשרה אחת מלאה (100%)". סעיף 1.א.5: עובד הוראה המועסק אצל יותר ממעסיק אחד, שהיקף משרתו הכוללת אצל שני המעסיקים מעבר ל־100%, מקבל אצל כל מעסיק את הקצובה היחסית להיקף משרתו אצלו.

סעיפים 2.א.4 ו־2.א.5 חוזרים על אותם שני סעיפים, מילה במילה, לשלבי החינוך שמחוץ לחטיבה העליונה. עובד הוראה שיש לו שני מעסיקים ויותר ממשרה מלאה בסך הכול נכלל בשני הסעיפים של כל אחד מהזוגות. ב־70% אצל מעסיק אחד וב־60% אצל השני, 1.א.4 נותן את הקצובה של משרה אחת, ו־1.א.5 נותן 130% ממנה. הטקסט אינו אומר איזה מהם גובר.
"""
reading = "1.א.5 ו־2.א.5 הם הכלל לעובד הוראה המועסק אצל יותר ממעסיק אחד, ו־1.א.4 ו־2.א.4 לעובד הוראה שכל משרותיו אצל מעסיק אחד: 1.א.5 הוא המקרה הצר יותר והוא מציין אותו במפורש."
