body = """
קצובת הביגוד הנוספת למורה לחינוך גופני נקבעת בטבלה של שלוש שורות: "עד 0.3 משרה" (0), "מ- 0.3 משרה עד 0.5 משרה" (676) ו"מ-0.5 משרה ומעלה" (1347). כל גבול מודפס בשתי שורות: מורה במשרה של 0.3 בדיוק הוא "עד 0.3" וגם "מ- 0.3", ומורה במשרה של 0.5 בדיוק הוא "עד 0.5" וגם "מ-0.5".

כשכותבים את הטבלה כפונקציה מהיקף המשרה לסכום, אי אפשר להעתיק אותה כפי שהיא מודפסת; ב־0.3 היא נותנת 0 וגם 676, ב־0.5 היא נותנת 676 וגם 1347.
"""
reading = "שורה חלה מהיקף המשרה שבו היא נפתחת (\"מ-\"): 0.3 מקבל 676 ו־0.5 מקבל 1347, ו\"עד\" נקרא כעד הגבול ולא כולל אותו. לכל היקף משרה אחר יש שורה אחת בדיוק."
