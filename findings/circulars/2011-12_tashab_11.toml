severity_why = "ההיתר להמיר שעות מוגבל ליישום מלא ומורחב ליישום חלקי באותו משפט, ותחולת החוזר והתקרות מכריעות."
keys = ["art_2/p3", "art_2/p4", "art_1"]
quote = "לאפשר למורה המועסק ביישום מלא של רפורמת עוז לתמורה, בהיקף העסקה של 100% (או יותר, …) הן ביישום מלא והן ביישום חלקי"
title = "ההיתר ניתן למורה \"ביישום מלא\" ובאותו משפט \"הן ביישום מלא והן ביישום חלקי\""
body = """
ההחלטה שבסעיף 2 מאפשרת "למורה המועסק ביישום מלא של רפורמת עוז לתמורה, בהיקף העסקה של 100% (או יותר …) הן ביישום מלא והן ביישום חלקי" לבצע שעה פרונטאלית במקום שעה תומכת הוראה. המשפט מגביל תחילה את ההיתר ליישום מלא, ואחר כך מרחיב אותו ליישום חלקי.

סעיף 1 מחיל את החוזר על מורים בשניהם, וסעיף 2 ממשיך וקובע תקרת שעות ליישום חלקי (2 בתשע"ג, 3 בתשע"ד), דבר שיש בו טעם רק אם יישום חלקי מזכה. מורה ביישום חלקי ב־100% מוצא מן ההיתר לפי נושא המשפט ונכלל בו לפי התיאור שאחריו.
"""
reading = "ההיתר חל הן על יישום מלא והן על יישום חלקי, כפי שתחולת סעיף 1 והתקרות ליישום חלקי מחייבות; \"המועסק ביישום מלא\" נקרא כטעות סופר במקום \"המועסק לפי הרפורמה\"."
l4 = "l4/circulars/2011-12_tashab_11.l4"
evidence = "`the sentence admits partial implementation and also confines it to full`"
