[[finding]]
id = "F-2011-12_tashab_11-a"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p3", "art_2/p4", "art_1"]
quote = "לאפשר למורה המועסק ביישום מלא של רפורמת עוז לתמורה, בהיקף העסקה של 100% (או יותר, …) הן ביישום מלא והן ביישום חלקי"
title = "The permission is given to a teacher \"in full implementation\" and, in the same sentence, \"in both full and partial implementation\""
body = """
Section 2's decision allows "a teacher employed in FULL implementation of the Oz LaTmura reform, at 100% (or more …), in BOTH full and partial implementation" to teach a frontal hour in place of a teaching-support hour. The sentence first confines the permission to full implementation and then extends it to partial implementation.

Section 1 applies the circular to teachers in both, and section 2 goes on to cap the hours for partial implementation (2 in תשע"ג, 3 in תשע"ד), which only makes sense if partial implementation qualifies. A teacher in partial implementation at 100% is excluded by the sentence's subject and included by its qualifier.
"""
reading = "The permission covers both full and partial implementation, as section 1's scope and the caps for partial implementation require; \"employed in full implementation\" is read as a slip for \"employed under the reform\"."
l4 = "l4/circulars/2011-12_tashab_11.l4"
evidence = "`the sentence admits partial implementation and also confines it to full`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_11-b"
kind = "gap"
stage = "writing"
keys = ["art_2/p7", "art_2/p8", "art_2/p9"]
quote = "ביישום חלקי של הרפורמה בשנה\"ל תשע\"ג -מורה יהיה רשאי לבצע עד 2ש\"ש … וביישום חלקי של הרפורמה בשנה\"ל תשע\"ד … עד 3ש\"ש"
title = "No cap — and no weekly quota — is set for partial implementation in תשע\"ב, the year the circular is issued in"
body = """
Section 2 caps the frontal hours a teacher may teach in place of support hours: up to 5 a week in full implementation, and in partial implementation up to 2 in school year תשע"ג and 3 in תשע"ד, "and not beyond". The weekly quotas it restates are likewise given for full implementation and for partial implementation in תשע"ג and תשע"ד only.

The circular is dated 30.5.2012, within school year תשע"ב, and the decision it carries out was taken on 10.5.2012. For a teacher in partial implementation in the rest of תשע"ב the text sets no cap and no quota, so it does not say whether such a teacher may substitute any hours, or how many.
"""
reading = "No hours may be substituted in partial implementation in תשע\"ב: the permission is granted only together with a cap, and none is given for that year."
l4 = "l4/circulars/2011-12_tashab_11.l4"
evidence = "`no cap is set for partial implementation in תשע\"ב`"
depends_on = ["F-2011-12_tashab_11-a"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
