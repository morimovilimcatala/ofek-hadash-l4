title = "לא נקבעת תקרה — וגם לא מכסה שבועית — ליישום חלקי בתשע\"ב, השנה שבה החוזר יוצא"
body = """
סעיף 2 קובע תקרה לשעות הפרונטאליות שמורה רשאי לבצע במקום שעות תומכות: עד 5 ש"ש ביישום מלא, וביישום חלקי עד 2 בשנה"ל תשע"ג ו־3 בתשע"ד, "ולא מעבר לכך". מכסות השעות השבועיות שהוא חוזר עליהן ניתנות אף הן רק ליישום מלא וליישום חלקי בתשע"ג ובתשע"ד.

החוזר נושא את התאריך 30.5.2012, בתוך שנת הלימודים תשע"ב, וההחלטה שהוא מבצע התקבלה ב־10.5.2012. למורה ביישום חלקי ביתרת תשע"ב הטקסט אינו קובע תקרה ואינו קובע מכסה, ולכן אינו אומר אם מורה כזה רשאי להמיר שעות כלשהן, או כמה.
"""
reading = "ביישום חלקי בתשע\"ב אין להמיר שעות כלל: ההיתר ניתן רק יחד עם תקרה, ולשנה זו לא ניתנה תקרה."
