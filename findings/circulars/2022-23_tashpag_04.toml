quote = "הוראות סעיף 10 זה  לא חלות לגבי עובד הוראה המועסק שלא בתנאי אופק חדש"
title = "6.5 speaks of \"this section 10\" from inside section 6"
body = """
6.5 closes section 6 (minimum shekel amounts for role allowances) by saying that "the provisions of this section 10" do not apply to a teaching employee not employed under Ofek Hadash. Section 10 of this circular is the preparation day, a different section; "this section" can only be section 6. The clause names a section it is not in.

Both sections are in chapter 1, which applies to Ofek Hadash employees only, so either reading excludes pre-reform employees; but as written the clause's exclusion attaches to the wrong section.
"""
reading = "\"This section 10\" is read as section 6, the section 6.5 closes."
l4 = "l4/circulars/2022-23_tashpag_04.l4"
evidence = "`6.5 names \"this section 10\" from inside section 6`"
