[[finding]]
id = "F-2022-23_tashpag_04-d"
kind = "contradiction"
stage = "writing"
keys = ["art_20__para_20-2", "att_1__hc_1__para_2"]
quote = "או במשכורת חודש דצמבר 2022 , לפי המוקדם · או במשכורת חודש _________ 2023 , לפי המוקדם"
title = "Annex A dates advance A's deduction in 2023; 20.2 deducts it by December 2022"
body = """
20.2: advance A is deducted with the salary carrying the first payment under the collective agreement "or with December 2022's salary, whichever is earlier" — never later than December 2022. Annex A, the notice the employee must sign before any advance is paid (20.5), states in its item 2 that the deduction will be at the first agreement payment "or with the salary of the month _____ 2023, whichever is earlier".

No month of 2023 is at or before December 2022: the form gives a later deduction date for advance A than the clause that governs it. (The payslip notice of 20.6 prints this blank in 2022, consistent with 20.2.)
"""
reading = "20.2 governs advance A's deduction (December 2022 at the latest); the annex's printed year is read as the form's error."
l4 = "l4/circulars/2022-23_tashpag_04.l4"
evidence = "`annex A dates advance A's deduction in a year 20.2 excludes`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2022-23_tashpag_04-e"
kind = "contradiction"
stage = "writing"
keys = ["art_20__para_20-1__subpara_b", "art_20__para_20-6/p2", "att_1__hc_1__para_3"]
quote = "במשכורת חודש דצמבר 2022 ולכל המאוחר במשכורת חודש ינואר 2023 · במשכורת חודש ________ 2022 שולמה בשכרך מקדמה"
title = "Advance B may be paid in January 2023, but both notices print its payment month in 2022"
body = """
20.1ב allows advance B to be paid with December 2022's salary "and at the latest with January 2023's". 20.6 requires every payslip carrying an advance to carry a notice beginning "in the salary of the month ____ 2022 an advance was paid", and annex A's item 3, the form the employee signs for advance B, reads "in the salary of the month ____ 2022 an advance will be paid".

An advance B paid with January 2023's salary — which 20.1ב permits — cannot be stated truly in either notice as printed.
"""
reading = "20.1ב governs the payment date; the notices' printed year is read as covering a January 2023 payment of advance B."
l4 = "l4/circulars/2022-23_tashpag_04.l4"
evidence = "`the notices cannot state advance B paid in January 2023`"
