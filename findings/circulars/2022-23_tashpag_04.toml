# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2022-23_tashpag_04-a"
kind = "contradiction"
stage = "examples"
keys = ["art_3__para_1"]
quote = "15% מתוך שכר משולב בסכום של 16,664.9 ₪ … מכאן הסכום השקלי של התוספת האישית למנהלים עמד על 2,499.6 ₪"
title = "The principals' personal-supplement example: 15% of ₪16,664.9 is not ₪2,499.6"
body = """
Section 3 updates the rate of a principal's personal percentage supplement so that its shekel amount is kept: C = A / B, where A is the shekel amount paid on the eve of the table update. Its worked example gives a rate of 15% on a combined salary of ₪16,664.9 and states that "hence" A was ₪2,499.6.

15% of ₪16,664.9 is ₪2,499.735 (₪2,499.7 to the tenth the example uses); ₪2,499.6 is 15% of ₪16,664.0. The formula reproduces the example's printed result (2,499.6 / 20,436.7 = 12.23%), and with ₪2,499.735 the rate is also 12.23% to two decimals — but the example's own derivation of A from the rate and the salary does not hold.
"""
reading = "The formula C = A / B governs; A is the shekel amount actually paid on the eve of the update (an input), not the example's figure. The example is used only for its result, which both values of A give."
l4 = "l4/circulars/2022-23_tashpag_04.l4"
evidence = "`the example's shekel amount is not 15% of its salary`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
