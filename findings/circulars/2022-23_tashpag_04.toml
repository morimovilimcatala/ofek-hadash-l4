quote = "על אף האמור בסעיף 117(ב) להסכם אופק חדש (כפי שתוקן בסעיף 8 בפרק זה ויתוקן מזמן לזמן)"
title = "6.3.1 says section 117(ב) is amended \"in section 8 of this chapter\"; it is amended in section 5"
body = """
6.3.1 sets a ₪1,100 minimum for the deputy allowance "notwithstanding section 117(ב) of the Ofek Hadash agreement (as amended in section 8 of this chapter …)". In chapter 1 of this circular, section 8 raises the pedagogical coordinator's allowance (section 39ג); the amendment of section 117(ב) — the deputy allowance from 13% to 20% — is section 5. The cited section does not amend the clause it is cited for.
"""
reading = "\"Section 8 of this chapter\" is read as section 5, the section of chapter 1 that amends 117(ב); 6.3.1.1's \"13%/20% by the date of the increase\" is then 20% from 1.9.2023."
l4 = "l4/circulars/2022-23_tashpag_04.l4"
evidence = "`6.3.1 cites as amending 117(ב) a section that does not`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
