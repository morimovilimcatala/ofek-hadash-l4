# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2021-22_tashpab_07-a"
kind = "overlap"
stage = "writing"
keys = ["art_1__para_f", "art_1/p5"]
quote = "יובהר כי חלה הגבלה על עובד הוראה לעבוד בהיקף משרה העולה על 140% משרה אצל כלל מעסיקיו, וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150% משרה · (140% משרה - ללא רפורמה, 117% באופק חדש ו- 125% משרה בעוז לתמורה)"
title = "מנהל שאינו ברפורמות מוגבל גם ל־140% וגם ל־150%"
body = """
§1ו מגביל כל עובד הוראה ("עובד הוראה") ל־140% משרה אצל כלל מעסיקיו, ומנהל המועסק שלא לפי תנאי הרפורמה ל־150%. מנהל הוא עובד הוראה, ולכן אותה העסקה מוגבלת פעמיים, בשני שיעורים. פסקה 5 חוזרת אחר כך על "היקפי משרה אלו": 140% ללא רפורמה, 117% באופק חדש ו־125% בעוז לתמורה, בלי שיעור למנהלים.

לגבי מנהל שאינו ברפורמות המועסק בין 140% ל־150% בסך הכל, המגבלה הראשונה ופסקה 5 אוסרות את ההעסקה בלי הליך ההעסקה החריגה, והשנייה מתירה אותה. (המגבלות הנמוכות יותר למורים בעוז לתמורה ובאופק חדש נמצאות בתוך ה־140% הכללי ואינן מעוררות סתירה.)

אותן מילים מודפסות בחוזרי קצובת הביגוד מתשע"ה עד תשפ"ו, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2014-15_tashae_07-f (תשע"ה/7), F-2015-16_tashav_08-f (תשע"ו/8), F-2016-17_tashaz_06-f (תשע"ז/6), F-2017-18_tashach_07-f (תשע"ח/7), F-2018-19_tashat_08-f (תשע"ט/8), F-2019-20_tashaf_11-a (תש"פ/11), F-2020-21_tashpa_08-b (תשפ"א/8), F-2021-22_tashpab_07-a (תשפ"ב/7), F-2022-23_tashpag_09-c (תשפ"ג/9), F-2024-25_tashpah_12-b (תשפ"ה/12) ו־F-2025-26_tashpo_08-c (תשפ"ו/8). בחוזר תשפ"ד/11 הנוסח שונה ("בתנאי טרום רפורמות עד 140% משרה"), והשאלה נרשמה שם כ־F-2023-24_tashpad_11-a, עם אותה קריאה למנהל.
"""
reading = "המגבלה הנוקבת במסלול גוברת לגביו: מנהל שאינו ברפורמות מוגבל ל־150%, ו־140% היא המגבלה של עובד הוראה שאף מגבלה אחרת אינה נוקבת בו."
l4 = "l4/circulars/2021-22_tashpab_07.l4"
evidence = "`a principal outside the reforms is given two limits`"
depends_on = ["F-2019-20_tashaf_11-a"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2021-22_tashpab_07-b"
kind = "gap"
stage = "writing"
keys = ["art_2/t1", "art_1__para_e"]
quote = "שיעור העסקה | סכום נכון ל- 1/9/21 ‖ פחות משליש משרה (33.333%) | 0 ‖ משליש משרה עד חצי משרה כולל (50%) | 714 ש\"ח ‖ מעל לחצי משרה (מעל ל- 50%) | 1,423 ש\"ח"
title = "קצובת הביגוד למורה לחינוך גופני אינה אומרת משרתו של מי נמדדת במדרגותיה"
body = """
קצובת הביגוד הנוספת למורה לחינוך גופני שב־§2 מדורגת לפי "שיעור העסקה" ואינה יחסית: כלום מתחת לשליש משרה, 714 ₪ משליש משרה עד חצי משרה, 1,423 ₪ מעל לחצי משרה. החוזר אומר כיצד הקצובה הכללית מתחלקת בין המעסיקים (§§1ד–1ה: כל מעסיק משלם באופן יחסי למשרה שאצלו), אך אינו אומר דבר על קצובת החינוך הגופני של מורה שיש לו יותר ממעסיק אחד.

אם נמדד לפי מעסיק, מורה המועסק ב־40% אצל כל אחד משני מעסיקים מקבל 714 ₪ פעמיים, 1,428 ₪ בסך הכל — יותר ממורה המועסק ב־80% אצל מעסיק אחד (1,423 ₪); אם נמדד על פני כלל המעסיקים, ה־80% נופלים במדרגה העליונה, והחוזר אינו אומר איזה מעסיק משלם אותה. מורה המועסק ב־20% אצל כל אחד משני מעסיקים אינו מקבל דבר לפי מעסיק, ומקבל 714 ₪ בסך הכל.
"""
reading = "כל מעסיק מחיל את הטבלה על המשרה שאצלו, כפי ש־§1ה עושה לגבי הקצובה הכללית."
l4 = "l4/circulars/2021-22_tashpab_07.l4"
evidence = "`two employers at 40% each pay more than one employer at 80%`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2021-22_tashpab_07-c"
kind = "contradiction"
stage = "verification"
keys = ["art_1__para_d", "art_1__para_e"]
quote = "קצובת הביגוד תשולם יחסית להיקף המשרה של העובד ולא יותר ממשרה אחת מלאה (100%) · עובד הוראה המועסק אצל יותר ממעסיק אחד והיקף משרתו הכוללת אצל שני המעסיקים הינו מעבר ל-100% משרה, זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "מעל משרה מלאה: לא יותר מקצובה אחת (§1ד), או קצובה יחסית מכל מעסיק (§1ה)?"
body = """
§1ד: קצובת הביגוד תשולם יחסית להיקף המשרה של העובד "ולא יותר ממשרה אחת מלאה (100%)". §1ה: עובד הוראה המועסק אצל יותר ממעסיק אחד, שהיקף משרתו הכוללת מעבר ל־100%, זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו.

לעובד במשרה של 80% אצל מעסיק אחד ו־60% אצל מעסיק אחר, §1ד מגביל את הקצובה לקצובה מלאה אחת; §1ה מחייב את המעסיקים לשלם 80% ו־60% ממנה, 140% בסך הכול. §1ד אינו מגביל את עצמו למעסיק אחד, ו־§1ה אינו אומר שהוא חריג ל־§1ד.

אותן שתי הוראות — תקרה של משרה מלאה אחת והכלל למי שמועסק אצל כמה מעסיקים — מודפסות בחוזרי קצובת הביגוד מתשע"א עד תשפ"ו, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2010-11_tashaa_03-g (תשע"א/3), F-2011-12_tashab_13-b (תשע"ב/13), F-2012-13_tashag_08-a (תשע"ג/8), F-2012-13_tashag_09-a (תשע"ג/9), F-2013-14_tashad_08-a (תשע"ד/8), F-2014-15_tashae_07-a (תשע"ה/7), F-2015-16_tashav_08-a (תשע"ו/8), F-2016-17_tashaz_06-a (תשע"ז/6), F-2017-18_tashach_07-b (תשע"ח/7), F-2018-19_tashat_08-b (תשע"ט/8), F-2019-20_tashaf_11-e (תש"פ/11), F-2020-21_tashpa_08-a (תשפ"א/8), F-2021-22_tashpab_07-c (תשפ"ב/7), F-2022-23_tashpag_09-d (תשפ"ג/9), F-2023-24_tashpad_11-d (תשפ"ד/11), F-2024-25_tashpah_12-c (תשפ"ה/12) ו־F-2025-26_tashpo_08-d (תשפ"ו/8).
"""
reading = "§1ה הוא הכלל המיוחד לכמה מעסיקים והוא חל עליהם: כל מעסיק משלם את חלקו, והתקרה של §1ד חלה אצל כל מעסיק — הקריאה של F-2018-19_tashat_08-b."
l4 = "l4/circulars/2021-22_tashpab_07.l4"
