# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2021-22_tashpab_07-a"
kind = "overlap"
stage = "writing"
keys = ["art_1__para_f", "art_1/p5"]
quote = "יובהר כי חלה הגבלה על עובד הוראה לעבוד בהיקף משרה העולה על 140% משרה אצל כלל מעסיקיו, וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150% משרה · (140% משרה - ללא רפורמה, 117% באופק חדש ו- 125% משרה בעוז לתמורה)"
title = "A principal outside the reforms is limited both to 140% and to 150%"
body = """
§1ו limits every teaching employee ("עובד הוראה") to 140% of a position with all employers, and a principal employed outside the reforms to 150%. A principal is a teaching employee, so the same employment is limited twice, at two figures. ¶5 then restates "these scopes" as 140% without a reform, 117% in Ofek Hadash and 125% in Oz LaTmura, with no figure for principals.

For a principal outside the reforms employed between 140% and 150% in all, the first limit and ¶5 forbid the employment without the exceptional-employment procedure and the second permits it. (The lower limits for Oz LaTmura and Ofek Hadash teachers sit inside the general 140% and raise no conflict.)
"""
reading = "The limit that names the track governs it: a principal outside the reforms is limited to 150%, and 140% is the limit of a teaching employee no other limit names."
l4 = "l4/circulars/2021-22_tashpab_07.l4"
evidence = "`a principal outside the reforms is given two limits`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2021-22_tashpab_07-b"
kind = "gap"
stage = "writing"
keys = ["art_2/t1", "art_1__para_e"]
quote = "שיעור העסקה | סכום נכון ל- 1/9/21 ‖ פחות משליש משרה (33.333%) | 0 ‖ משליש משרה עד חצי משרה כולל (50%) | 714 ש\"ח ‖ מעל לחצי משרה (מעל ל- 50%) | 1,423 ש\"ח"
title = "The physical-education allowance does not say whose position its bands measure"
body = """
§2's additional clothing allowance for physical-education teachers is banded by "שיעור העסקה" — the extent of employment — and not pro-rated: nothing below a third of a position, ₪714 from a third to a half, ₪1,423 above a half. The circular says how the general allowance is split between employers (§§1ד-1ה: each pays in proportion to the position it holds), but says nothing about the physical-education allowance of a teacher with more than one employer.

Measured per employer, a teacher at 40% with each of two employers is paid ₪714 twice, ₪1,428 in all, more than a teacher at 80% with one employer (₪1,423); measured over all employers, the 80% falls in the top band and the circular does not say which employer pays it. A teacher at 20% with each of two employers is paid nothing per employer and ₪714 in all.
"""
reading = "Each employer applies the table to the position held with it, as §1ה does for the general allowance."
l4 = "l4/circulars/2021-22_tashpab_07.l4"
evidence = "`two employers at 40% each pay more than one employer at 80%`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
