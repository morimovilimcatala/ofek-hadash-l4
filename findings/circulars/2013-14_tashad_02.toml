title = "The new credit-points table has no column for a counsellor, a deputy principal or any other role-holder"
body = """
Section 11 replaces the table of the agreement's section 20(ב), which awards credit points for the assessment rank (the highest 15% and the next 15%). The new table has three columns: the homeroom teacher; six named coordinators (grade, subject, assessment, adjustments, social education, trips); and "a teacher who is not a role-holder".

The same circular, in section 9's table of minimum frontal hours, counts as role-holders also the counsellor, the deputy principal and "any role-holder not listed above". Those employees are role-holders, so they are not in the third column, and they are not homeroom teachers or one of the six coordinators. A counsellor ranked in the highest 15% falls in no column, and the table gives no number of points for that employee, neither the coordinator's 2.5 nor the 5.5 of a teacher who is not a role-holder.
"""
reading = "The table is applied as printed: a role-holder outside its columns earns no credit points under it. Whether such an employee takes a column by analogy (the coordinators', or the non-role-holder's) is for the reviewer."
