המדדים נבדלים: שנות עבודה בישראל מחוץ להוראה נמנות לפי השני ולא לפי הראשון, והשירות הצבאי הנמנה הוא "שירות צבאי" באחד ו"שירות חובה בצה"ל" באחר. מורה עם עשרים שנות הוראה ועשר שנות עבודה אחרת בישראל זכאי לפי הבהרה ב ואינו זכאי לפי סעיף 5.

