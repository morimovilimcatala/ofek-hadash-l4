# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
# See findings/takanon/takanon-sherut-ovdei-horaa/1.7.toml for the fields.

[[finding]]
id = "F-2009-10_tasha_03-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_3__para_f", "art_3__para_f/p3"]
quote = "עבור שנת 2011 במקום עבור שנת [ .2010 … הכוונה לשנת לימודים המתחילה בתאריך 1/9/09 ומסתיימת בתאריך, ]31/8/10"
title = "Retirees: the quoted rule is moved to 2011, but its definition of the recuperation year still names 1/9/09–31/8/10"
body = """
Section 3ו applies sections ו and ז of circular תשס"ט/9 to a teacher who retired or died "for 2011 instead of 2010", and quotes them. The quoted definition of "שנת הבראה" carries the Ministry's bracket fixing it as the school year that begins on 1/9/09 and ends on 31/8/10 — the year 2010 as section 3א defines it, which this circular pays in full.

The substitution is worded for "the year 2010", not for the dates. Read with the dates as printed, the retiree's reduction falls on 2009/10, the year in which section 3א forbids any reduction; read with the dates moved, it falls on 1.9.2010–31.8.2011, the year 2011 as section 3ב defines it.
"""
reading = "The substitution moves the bracketed dates too: for this circular the recuperation year of the quoted rule is 1.9.2010–31.8.2011. It is the only reading under which section 3ו does not reduce the 2010 allowance that section 3א says is not reduced."
l4 = "l4/circulars/2009-10_tasha_03.l4"
evidence = "`the quoted havraa year is 2010 while section 3ו applies it to 2011`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2009-10_tasha_03-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_4__para_c"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה)"
title = "Part-time pro-rating at \"1/10 for each month of work\" gives more than the position over a twelve-month year"
body = """
Section 4ג pro-rates the allowance of a part-time teacher to the part-time position held that year, and explains the measure in brackets as one tenth for each month of work. The text does not say which months count or that the tenths stop at ten.

A teacher employed in all twelve months of the year at half a position takes 0.5 of the allowance by the position and 0.6 by twelve tenths of it; one employed for the ten months September–June takes 0.5 either way. The two halves of the sentence give different shares.
"""
reading = "The share is the position fraction (at most one, section 4ד) counted over at most ten months: ten months of work make the full year, and fewer make tenths of it."
l4 = "l4/circulars/2009-10_tasha_03.l4"
evidence = "`the literal tenths give more than the position`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2009-10_tasha_03-c"
kind = "contradiction"
stage = "writing"
keys = ["art_5/p4", "art_5__para_b"]
quote = "מענק היובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק היובל · עובד הוראה שהשלים 30 שנות עבודה בישראל ב 1 -ביוני של שנה נדונה … יזכה באותה שנה במענק יובל"
title = "The jubilee grant: seniority as set in the September before, or 30 years completed by 1 June?"
body = """
Section 5 grants the jubilee grant by the seniority set for the teacher in September of the year before the grant. Clarification ב grants it in a given year to a teacher who completed 30 years by 1 June of that year.

A teacher whose seniority set in September is 29 and who completes the thirtieth year between September and 1 June is refused the grant that June by the first clause and granted it by the second.
"""
reading = "Clarification ב decides: 30 years completed by 1 June of the grant year. It is the later and more specific clause, headed as a clarification of the rule above it."
l4 = "l4/circulars/2009-10_tasha_03.l4"
evidence = "`section 5 and clarification ב date the seniority differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2009-10_tasha_03-d"
kind = "contradiction"
stage = "writing"
keys = ["art_5/p2", "art_5__para_b"]
quote = "בעל ותק מצטבר בהוראה של 30 שנה ומעלה כולל ותק שירות צבאי · שהשלים 30 שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה\"ל)"
title = "The jubilee grant counts 30 years of teaching in one clause and 30 years of work in Israel in another"
body = """
Section 5 grants the jubilee grant to a teacher with 30 years of accumulated seniority IN TEACHING, military service included, at the employers, the owners and formal-education institutions. Clarification ב grants it to a teacher who completed 30 years of WORK IN ISRAEL, compulsory IDF service included.

The measures differ: years of work in Israel outside teaching count under the second and not the first, and the military service counted is "military service" in one and "compulsory IDF service" in the other. A teacher with twenty years of teaching and ten of other work in Israel is entitled under clarification ב and not under section 5.
"""
reading = "Clarification ב's measure is applied, consistently with F-2009-10_tasha_03-c's reading; the seniority is an input, so section 5's measure can be run instead."
l4 = "l4/circulars/2009-10_tasha_03.l4"
evidence = "`section 5 and clarification ב count different years`"
depends_on = ["F-2009-10_tasha_03-c"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
