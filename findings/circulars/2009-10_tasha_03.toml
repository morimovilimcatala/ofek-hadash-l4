title = "פורשים: הכלל המצוטט מועבר ל־2011, אך ההגדרה שלו לשנת ההבראה עדיין נוקבת ב־1/9/09–31/8/10"
body = """
סעיף 3ו מחיל את סעיפים ו ו־ז לחוזר תשס"ט/9 על מורה שפרש או נפטר "עבור שנת 2011 במקום עבור שנת 2010", ומצטט אותם. ההגדרה המצוטטת של "שנת הבראה" נושאת את הסוגריים המרובעים של משרד החינוך, הקובעים אותה כשנת הלימודים המתחילה בתאריך 1/9/09 ומסתיימת בתאריך 31/8/10 — שנת 2010 כפי שסעיף 3א מגדיר אותה, שחוזר זה משלם בעדה במלואה.

ההחלפה מנוסחת לגבי "שנת 2010", לא לגבי התאריכים. בקריאה עם התאריכים כפי שהם מודפסים, ההפחתה לפורש חלה על תש"ע, השנה שבה סעיף 3א אוסר כל הפחתה; בקריאה עם התאריכים מוזזים, היא חלה על 1.9.2010–31.8.2011, שנת 2011 כפי שסעיף 3ב מגדיר אותה.
"""
reading = "ההחלפה מזיזה גם את התאריכים שבסוגריים המרובעים: לעניין חוזר זה, שנת ההבראה של הכלל המצוטט היא 1.9.2010–31.8.2011. זו הקריאה היחידה שבה סעיף 3ו אינו מפחית את דמי ההבראה של 2010 שסעיף 3א אומר שאינם מופחתים."
l4 = "l4/circulars/2009-10_tasha_03.l4"
evidence = "`the quoted havraa year is 2010 while section 3ו applies it to 2011`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

