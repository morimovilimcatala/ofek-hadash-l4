מורה המועסק בכל שנים־עשר חודשי השנה בחצי משרה מקבל 0.5 מהקצובה לפי המשרה, ו־0.6 לפי שתים־עשרה עשיריות שלה; מורה המועסק בעשרת החודשים ספטמבר–יוני מקבל 0.5 בכל מקרה. שני חלקי המשפט נותנים חלקים שונים.
"""
reading = "החלק הוא שבר המשרה (לכל היותר אחת, סעיף 4ד) הנמנה על פני עשרה חודשים לכל היותר: עשרה חודשי עבודה הם השנה המלאה, ופחות מהם הם עשיריות שלה."
