אותה שאלה, שנות הוראה מול שנות עבודה בישראל, עולה בחוזרי מענק היובל שמדפיסים את שתי המילים, והיא נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_06-c (תשס"ז/6), F-2009-10_tasha_03-d (תש"ע/3), F-2010-11_tashaa_02-c (תשע"א/2), F-2011-12_tashab_12-c (תשע"ב/12), F-2012-13_tashag_07-e (תשע"ג/7), F-2013-14_tashad_07-e (תשע"ד/7), F-2014-15_tashae_04-e (תשע"ה/4), F-2015-16_tashav_07-e (תשע"ו/7), F-2016-17_tashaz_05-e (תשע"ז/5), F-2017-18_tashach_04-d (תשע"ח/4), F-2018-19_tashat_06-d (תשע"ט/6), F-2019-20_tashaf_09-d (תש"פ/9), F-2020-21_tashpa_07-e (תשפ"א/7), F-2021-22_tashpab_06-f (תשפ"ב/6), F-2022-23_tashpag_08-d (תשפ"ג/8), F-2023-24_tashpad_10-g (תשפ"ד/10), F-2024-25_tashpah_11-f (תשפ"ה/11) ו־F-2025-26_tashpo_07-d (תשפ"ו/7).
"""
