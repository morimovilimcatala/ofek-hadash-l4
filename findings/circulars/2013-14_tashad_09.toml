[[finding]]
id = "F-2013-14_tashad_09-a"
kind = "undefined-term"
stage = "writing"
keys = ["art_b__para_5__subpara_b__cls_a", "art_b__para_5__subpara_b__cls_b", "art_d", "art_ja", "art_jc"]
quote = "בסיס המשרה של מורה המועסק בהיקף משרה של 100%יהיה 40 שעות שבועיות (ש\"ש). · בימים א' עד ה' 8:00: עד ( 15:30 · בפחות מ 8 -ש\"ש (שעות שבועיות) ביום העבודה, משך שעה שבועית (ש\"ש) בבית הספר ייקבע על פי משכה של שעת הוראה במערכת החינוך · המילים '(שעות של 60 דקות)' יימחקו"
title = "A full-time teacher's weekly hour has no stated length, and 40 hours of 60 minutes do not fit the working day"
body = """
The amended section 9 sets a full position at 40 weekly hours (ש"ש) and fixes the working day by the clock: Sunday-Thursday 8:00-15:30 and the short day 8:00-12:45, counted from a clock-in no earlier than 7:45 (ב1), with make-up windows of 15:30-16:15 and 13:00-13:45 for a teacher whose day off is not the short day (ד). Clause (יג) strikes the words "(hours of 60 minutes)" from the work-week tables, and clause (יא) gives a weekly hour a length — that of a lesson by the bell schedule — only for a teacher with FEWER than 8 weekly hours on a working day.

A full-time teacher has 8 weekly hours a day or more, so (יא) does not reach them, and the 60-minute length has been struck. Nor can the hour be read as 60 minutes: the windows hold at most 38.75 clock hours a week with the short day off, and 39.75 with a long day off — under 40 either way, since an earlier start under (ב2) or (ג) ends the day earlier "accordingly". The text gives no length for the unit in which a full-time teacher's 40 hours are counted.
"""
reading = "The full-time teacher's week is the clock windows of (ב) and (ד): presence through them is read as the 40 weekly hours. The windows are encoded as printed, and the weekly hour's length is left undefined outside (יא)."
l4 = "l4/circulars/2013-14_tashad_09.l4"
evidence = "`a full-time teacher's weekly hour has no stated length`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2013-14_tashad_09-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_jc__para_ja__subpara_2", "art_jc__para_ja__subpara_3"]
quote = "בימים א' עד ה' 8:00: עד; 16:15 / 15:30 · ביום ו' (או יום שבת /יום א' במגזר שאינו יהודי) 8:00: עד 13:45 / 12:45"
title = "A principal's working day is printed with two end times and no rule for choosing"
body = """
The amended section 22 sets a principal's hours as Sunday-Thursday 8:00 to "16:15 / 15:30" and the short day 8:00 to "13:45 / 12:45". Each day has two end times, and the clause does not say which applies when. Clause ג.3 then has a principal whose day off is not the short day make up the 40 hours on Sunday-Thursday 15:30-16:15 and/or the short day 13:00-13:45 — hours that the later end times of ג.2 would already include.

Read as "always until 16:15", a principal works 41.25 clock hours over five long days; read as "until 15:30", 37.5. The clause decides neither.
"""
reading = "The earlier end (15:30, 12:45) is the principal's day, as it is the teacher's; the later end applies on the days a principal makes hours up under ג.3, which is the reading under which ג.3 has work to do."
l4 = "l4/circulars/2013-14_tashad_09.l4"
evidence = "`ג.2 gives a principal two end times`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2013-14_tashad_09-c"
kind = "contradiction"
stage = "writing"
keys = ["art_a__para_2", "art_jc__para_ja__subpara_7__cls_8__pnt_b"]
quote = "תקופת ההסכם ותחילתו הינה מיום חתימת ההסכם ועד ליום .31.8.2017 · החל משנת הלימודים תשע\"ד, סעיפים (24ד)(24, ה) (24ו)( 31, א) להסכם עוז לתמורה שעניינם תוספת עוז לתמורה למנהלים בשיעור של, 30%בטלים ומשכך אין לשלם תוספת עוז לתמורה – מנהלים החל מתחילת שנת הלימודים תשע\"ד"
title = "The agreement starts on its signature (15.7.2014), but voids the principals' supplement from September 2013"
body = """
Section א.2 states that the agreement's period AND its commencement run from the day it was signed — 15.7.2014 by the preamble — to 31.8.2017. Section 8(ב) voids the Oz LeTmura supplement for principals (30%) "from the school year תשע"ד" and says it is not to be paid "from the start of school year תשע"ד", that is from September 2013, ten months before the agreement commenced. (6(ב), voiding section 35, and 8(א) run from תשע"ד too.)

For the months September 2013 to June 2014 the commencement clause says the agreement did not yet apply, and 8(ב) says the supplement was not payable. The circular does not say whether a supplement already paid for those months is to be recovered.
"""
reading = "The specific clause governs its own date: the supplement is void from the start of תשע\"ד as 8(ב) says. The encoding states no duty to recover amounts already paid for September 2013 to July 2014, which the text does not decide."
l4 = "l4/circulars/2013-14_tashad_09.l4"
evidence = "`8(ב) reaches back before the agreement's commencement`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
