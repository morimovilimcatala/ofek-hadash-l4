title = "Annex ה, row 4: five days of 6.08 hours are 30.4, not the 30.8 the row prints"
body = """
Section 4.1.4 makes the working day of a kindergarten teacher whose kindergarten closes at 14:00 6.08 hours, and 4.1.5 computes the position as the weekly hours worked over the position base. Row 4 of annex ה, a fellow teacher on a base of 33.8, says she "works 5 days a week, 6.08 each day", that her position "will be up to 90% only, because in fact she works 30.8 weekly hours", and prints 30.8 in the hours column.

