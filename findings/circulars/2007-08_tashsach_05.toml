quote = "יובל ישולם לעובד הוראה בעל ותק מצטבר בהוראה של 30 שנה ומעלה · יזכה באותה שנה במענק יובל"
title = "האם מענק היובל משולם פעם אחת, או בכל שנה מהשנה ה־30?"
body = """
החוזר מורה לשלם את מענק היובל במשכורת יוני 2008 "לזכאים", ומגדיר אותם כעובדי הוראה בעלי ותק "של 30 שנה ומעלה". §2ב אומר שעובד הוראה שהשלים 30 שנה עד 1 ביוני "יזכה באותה שנה".

כלשונה, הפסקה "יובל ישולם לעובד הוראה…" כוללת עובד הוראה בשנתו ה־35 ב־2008 כפי שכללה אותו בכל שנה מאז השנה ה־30; "באותה שנה" שב־§2ב קושר את המענק לשנה שבה הושלמו 30 השנים. הטקסט אינו אומר אם עובד הוראה שכבר קיבל את המענק מקבל אותו שוב. הבדיקה על פני קריירה שלמה (ותק עד 1 ביוני מ־0 עד 45 שנה, ברבעי שנה) מראה ששתי הקריאות נבדלות בדיוק בכל שנה מהשנה ה־31 ואילך.

אותה שאלה עולה מאותן מילים ("30 שנה ומעלה", ומתשע"ב "25 או 30 שנה ומעלה") בחוזרי מענק היובל מתשס"ז ואילך, והיא נרשמה עם אותה קריאה בכל אחד מהם שנבדק עד תשפ"ב: F-2006-07_tashsaz_06-d (תשס"ז/6), F-2007-08_tashsach_05-c (תשס"ח/5), F-2008-09_tashsat_09-e (תשס"ט/9), F-2009-10_tasha_03-e (תש"ע/3), F-2010-11_tashaa_02-d (תשע"א/2), F-2011-12_tashab_12-e (תשע"ב/12), F-2012-13_tashag_07-d (תשע"ג/7), F-2013-14_tashad_07-d (תשע"ד/7), F-2014-15_tashae_04-d (תשע"ה/4), F-2015-16_tashav_07-d (תשע"ו/7), F-2016-17_tashaz_05-d (תשע"ז/5), F-2017-18_tashach_04-e (תשע"ח/4), F-2018-19_tashat_06-e (תשע"ט/6), F-2019-20_tashaf_09-e (תש"פ/9), F-2020-21_tashpa_07-g (תשפ"א/7) ו־F-2021-22_tashpab_06-d (תשפ"ב/6).
"""
reading = "המענק משולם פעם אחת, בשנה שבה עובד ההוראה משלים 30 שנה עד 1 ביוני (ותק בתוך שנה מ־30); \"30 שנה ומעלה\" נקרא כסף, לא כזכאות שנתית. זו הקריאה של F-2006-07_tashsaz_06-d ושל F-2008-09_tashsat_09-e לאותן מילים."
