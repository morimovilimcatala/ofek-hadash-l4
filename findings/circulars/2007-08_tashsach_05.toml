quote = "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה)"
title = "הבראה במשרה חלקית מחושבת \"באופן יחסי לחלקיות משרתו\" ובאותה נשימה \"1/10 לכל חודש עבודה\""
body = """
§1ד נותן לעובד הוראה במשרה חלקית את הקצובה "באופן יחסי לחלקיות משרתו באותה שנה", ומוסיף בסוגריים "1/10 לכל חודש עבודה". המילים שלפני הסוגריים מחשבות באופן יחסי לפי היקף המשרה; הסוגריים מחשבים באופן יחסי לפי מספר חודשי העבודה, שהוא מידה אחרת.

השתיים נותנות תשובות שונות לרוב העובדים: עובד הוראה בחצי משרה שעובד את כל השנה מקבל מחצית לפי הראשונה ואת הקצובה המלאה לפי השנייה. ובקריאה כלשונו, 1/10 לכל חודש נותן 11/10 או 12/10 מהקצובה לכל מי שעובד אחד־עשר או שנים־עשר חודשים.

אותו סעיף — "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה (1/10 לכל חודש עבודה)", ומתשע"ב "לקצובת הבראה בשיעור יחסי" — מופיע בכל חוזרי ההבראה של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-a`, `F-2008-09_tashsat_09-a`, `F-2009-10_tasha_03-b`, `F-2010-11_tashaa_02-a`, `F-2011-12_tashab_12-a`, `F-2012-13_tashag_07-b`, `F-2013-14_tashad_07-b`, `F-2014-15_tashae_04-a`, `F-2015-16_tashav_07-a`, `F-2016-17_tashaz_05-a`, `F-2017-18_tashach_04-a`, `F-2018-19_tashat_06-a`, `F-2019-20_tashaf_09-a`, `F-2020-21_tashpa_07-a`, `F-2021-22_tashpab_06-a`, `F-2022-23_tashpag_08-a`, `F-2023-24_tashpad_10-a`, `F-2024-25_tashpah_11-a`, `F-2025-26_tashpo_07-a`. ההבדל בניסוח בין "באופן יחסי" ל"בשיעור יחסי" אינו נוגע לשאלה, ולכן כולם מאמצים קריאה אחת.
"""
reading = "שני המדדים חלים יחד: החלק הוא חלקיות המשרה (לכל היותר משרה אחת, כפי שהחוזר קובע) כפול עשירית לכל חודש עבודה, ולכל היותר עשרה חודשים, כך ששנת לימודים מלאה נותנת את החלק המלא ולא יותר. הסוגריים אומרים כיצד נמנית \"חלקיות משרתו באותה שנה\": בעשיריות, על פני שנה בת עשרה חודשים; הם אינם מקדם עצמאי שעולה על השנה, ואינם המחשה בלבד. כשהמשרה משתנה במהלך השנה, כל חודש שוקל עשירית מהמשרה שהוחזקה בו (ובשנה של יותר מעשרה חודשים, הממוצע שלהן). זו הקריאה בכל חוזרי ההבראה, שבכולם הסעיף זהה."
l4 = "l4/circulars/2007-08_tashsach_05.l4"
evidence = "`§1ד's two measures differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2007-08_tashsach_05-b"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p2", "art_2/p4", "art_2__para_b"]
quote = "בעל ותק מצטבר בהוראה של 30 שנה ומעלה כולל ותק שירות צבאי · מענק היובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק היובל · עובד הוראה שהשלים 30 שנות עבודה בישראל ב 1 -ביוני של שנה נדונה"
title = "30 השנים של מענק היובל נבחנות בסעיף אחד לפי הוותק של ספטמבר ובאחר לפי 1 ביוני, ונמנות באופן שונה"
body = """
סעיף 2 קובע את סף 30 השנים פעמיים. הפסקאות "יובל ישולם לעובד הוראה בעל ותק מצטבר…" ו"מענק היובל ניתן…" שב־§2: 30 שנה ומעלה של ותק מצטבר בהוראה, כולל שירות צבאי, אצל המעסיקים, הבעלויות ומוסדות החינוך הפורמאלי, "עפ"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני" המענק. §2ב: עובד הוראה שהשלים 30 שנות עבודה בישראל, כולל שירות חובה בצה"ל, ב־1 ביוני של השנה, זכאי באותה שנה.

הם נבדלים ביום — ספטמבר 2007 לעומת 1 ביוני 2008, תשעה חודשים זה מזה — ובמה שנספר: ותק בהוראה אצל מעסיקים הנקובים בשמם לעומת כל עבודה בישראל. עובד הוראה שמגיע ל־30 שנה במרץ 2008 צבר 29.5 שנים בספטמבר 2007 ולכן נמצא מחוץ לפסקה "מענק היובל ניתן…", והשלים 30 שנה עד 1 ביוני ולכן נמצא בגדר §2ב.

אותה לשון — "ותק מצטבר בהוראה … כולל ותק שירות צבאי" בכלל, ו"שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה"ל)" בהבהרה — מופיעה בחוזרי מענק היובל של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-c`, `F-2008-09_tashsat_09-d`, `F-2009-10_tasha_03-d`, `F-2010-11_tashaa_02-c`, `F-2011-12_tashab_12-c`, `F-2012-13_tashag_07-e`, `F-2013-14_tashad_07-e`, `F-2014-15_tashae_04-e`, `F-2015-16_tashav_07-e`, `F-2016-17_tashaz_05-e`, `F-2017-18_tashach_04-d`, `F-2018-19_tashat_06-d`, `F-2019-20_tashaf_09-d`, `F-2020-21_tashpa_07-e`, `F-2021-22_tashpab_06-f`, `F-2022-23_tashpag_08-d`, `F-2023-24_tashpad_10-g`, `F-2024-25_tashpah_11-f`, `F-2025-26_tashpo_07-d`; כולם מאמצים קריאה אחת. ההבדל בין החוזרים: מ־`F-2011-12_tashab_12-c` ואילך ההבהרה מוסיפה "על־פי האמור להלן", וההבהרות שאחריה נוקבות בשנים המזכות כ"ותק מצטבר, כהגדרתו לעיל"; בחוזר הזה אין המילים האלה. הן מחזקות את הקריאה שם, אך אינן נדרשות לה: גם בלעדיהן ההבהרה באה תחת הכותרת "הבהרות" של הכלל ונוקבת ביום שעד אליו הוא מושלם.
"""
reading = "§2ב, ההבהרה הנוקבת ביום, מכריעה מי זכאי: 30 שנה שהושלמו עד 1 ביוני של השנה. הוותק של ספטמבר שבפסקה \"מענק היובל ניתן…\" (§2) נקרא כוותק שלפיו מחושב המענק, לא כמבחן של 30 השנים. ומה שנספר הוא המדד של הפסקה \"יובל ישולם לעובד הוראה בעל ותק מצטבר…\" עצמה: ותק מצטבר בהוראה אצל המעסיקים, הבעלויות ובמוסדות החינוך הפורמאלי, כולל שירות צבאי, ועם שנות החופשה ללא תשלום שנרכשו לפי הבהרה א, הנמנה עד 1 ביוני של שנת המענק. §2ב בא תחת הכותרת \"הבהרות\" של הכלל שמעליו ונוקב ביום שעד אליו הוותק מושלם; הוא מבהיר את הכלל ואינו קובע זכאות אחרת, ולכן \"שנות עבודה בישראל\" שבו נקראות כאותו ותק. זו הקריאה בכל חוזרי מענק היובל. שני המדדים הם קלטים בקידוד, כך שאפשר להריץ במקומו את מדד ההבהרה."
