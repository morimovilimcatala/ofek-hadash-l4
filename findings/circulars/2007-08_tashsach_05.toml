# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2007-08_tashsach_05-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה)"
title = "Part-time recuperation is pro-rated \"by the position fraction\" and, in the same breath, \"1/10 for each month of work\""
body = """
§1ד gives a part-time employee the allowance "in proportion to the part-time fraction of the position that year", and adds in brackets "(1/10 for each month of work)". The words before the bracket pro-rate by the size of the position; the bracket pro-rates by the number of months worked, which is a different measure.

The two give different answers for most employees: a teacher on a half position who works the whole year gets one half under the first and the full allowance under the second. And read as written, 1/10 for each month gives 11/10 or 12/10 of the allowance to anyone who works eleven or twelve months.
"""
reading = "Both apply: the position fraction pro-rates the allowance, and the bracket pro-rates a part of the year by months worked on a ten-month school year, capped at the whole allowance."
l4 = "l4/circulars/2007-08_tashsach_05.l4"
evidence = "`§1ד's two measures differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2007-08_tashsach_05-b"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p2", "art_2/p4", "art_2__para_b"]
quote = "בעל ותק מצטבר בהוראה של 30 שנה ומעלה כולל ותק שירות צבאי · מענק היובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק היובל · עובד הוראה שהשלים 30 שנות עבודה בישראל ב 1 -ביוני של שנה נדונה"
title = "The jubilee grant's 30 years are tested on September's seniority in one clause and on 1 June in another, and counted differently"
body = """
Section 2 sets the 30-year threshold twice. ¶2 and ¶4: 30 years or more of accumulated TEACHING seniority, with military service, at the employers, the owning bodies and formal-education institutions, "according to the seniority set for the teacher in September of the year before" the grant. §2ב: a teacher who has completed 30 years of WORK IN ISRAEL, compulsory IDF service included, on 1 June of the year is entitled that year.

They differ in the day — September 2007 against 1 June 2008, nine months apart — and in what is counted: teaching seniority at named employers against any work in Israel. A teacher who reaches 30 years in March 2008 has 29.5 in September 2007 and is outside ¶4, and has completed 30 by 1 June and is inside §2ב.
"""
reading = "§2ב, the clarification that names the day, decides who is entitled: 30 years completed by 1 June of the year. ¶4's September seniority is read as the seniority on which the grant is figured, not the test of the 30 years."
l4 = "l4/circulars/2007-08_tashsach_05.l4"
evidence = "`¶4 and §2ב decide the March teacher differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2007-08_tashsach_05-c"
kind = "gap"
stage = "writing"
keys = ["art_2/p1", "art_2/p2", "art_2__para_b"]
quote = "יובל ישולם לעובד הוראה בעל ותק מצטבר בהוראה של 30 שנה ומעלה"
title = "Nothing says the jubilee grant is paid once"
body = """
The circular orders the jubilee grant paid with June 2008's salary "to those entitled", and defines them as teachers with "30 years and more" of seniority. §2ב says a teacher who has completed 30 years by 1 June "will be entitled in that year".

Neither clause limits the grant to the year the 30 years are reached, or to one payment in a career. As written, a teacher in the 35th year meets ¶2's test in 2008 as in every year since the 30th; whether a teacher who has already received it is paid again is not decided by the text.
"""
reading = "The circular is encoded as written — entitlement is 30 years or more by 1 June 2008 — and the question whether an earlier jubilee grant excludes this one is left open, as an input the circular does not supply."
l4 = "l4/circulars/2007-08_tashsach_05.l4"
evidence = "`a 35-year teacher qualifies again`"
depends_on = ["F-2007-08_tashsach_05-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
