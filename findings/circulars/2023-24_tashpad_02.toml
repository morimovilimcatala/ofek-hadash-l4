body = """
החוזר נשלח לבעלויות על בתי ספר לחינוך מיוחד. סעיף 5.2 שלו: מורה חדש שאינו מתמחה — 70% משרה לפחות בשנת תשפ"ד, ו־80% מתשפ"ה. סעיף 5.1 שלו עצמו קובע שמורה בבית ספר לחינוך מיוחד יועסק בתנאי הרפורמה בהיקף של שליש משרה לפחות.

הרצפה של 5.2 היא של סעיף 27(ג) להסכם אופק חדש, כפי שתוקן בסעיף 26.1 להסכם השכר מיום 19.10.2022 (50%, אחר כך 70%, אחר כך 80%). אבל סעיף 27(ג) פותח במילים "למעט מורה חדש בחינוך מיוחד בבית ספר לחינוך מיוחד או בכיתות חינוך מיוחד בבית ספר רגיל". לו סעיף 27(ד) קובע שליש משרה. התיקון של 2022 החליף רק את המספר, וסעיף 26.2 אומר שיתר הכללים ממשיכים לחול. אותו סעיף 5.2 מודפס בחוזר תשפ"ו/1 (F-2025-26_tashpo_01-v).

דוגמה: מורה חדש בבית ספר לחינוך מיוחד, משרה מלאה 36 שעות בשבוע. לפי ההסכם מותר להעסיק אותו בתנאי הרפורמה מ־12 שעות (שליש). לפי חוזר תשפ"ד/2 רק מ־25.2 שעות (70%). חצי משרה, 18 שעות, מותרת לפי ההסכם ואסורה לפי החוזר.
"""
