title = "The 3.4% erosion supplement is in the conversion examples but not in the formulas nor in the personal-supplement example"
body = """
Annex ד gives the conversion formula A = X × (100 + Y) / 100 and defines the principal's personal supplement through B = T × (100 + Y) / 100. Neither, nor section 15, mentions any other factor.

The first deputy's and the principal's worked conversions first multiply X by a 3.4% erosion supplement (\"תוספת שחיקה\", × 1.034): the deputy's A is 10,938.38 where the formula gives 10,578.71. The same principal's personal-supplement example then multiplies T by the coefficient alone (20,735.13 × 1.15 = 23,845.4, C = 3,758.72). So the annex applies the supplement to A and not to B, and its formulas to neither; with the supplement on B as on A, C would be 4,569.46.
"""
reading = "The conversion of A follows the examples (× 1.034, then the coefficient); the personal supplement follows B as defined and as its own example computes it, without the supplement."
l4 = "l4/circulars/2023-24_tashpad_02.l4"
evidence = "`the formula and the deputy example give different As`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

