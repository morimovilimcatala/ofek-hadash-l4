[[finding]]
id = "F-2022-23_tashpag_03-a"
kind = "gap"
stage = "writing"
keys = ["art_1__para_d/p3", "art_1__para_d/t1", "art_1__para_d/p5", "art_1__para_d/p7"]
quote = "תשלום גמול ההכנה לבגרות למקצוע יחולק בהתאם למשקל שיקבע אגף הבחינות למשימות הערכה מתוקשבות בציון הסופי · ציון שנתי … 40%"
title = "When assessments span years, no year is given the annual grade's 40% of the allowance"
body = """
1(2) divides the matriculation-preparation allowance between school years "according to the weight the exams department sets for the computerized assessment tasks in the final grade", where those tasks are not all performed in one year. Its example table for a 1.5-unit subject has four rows: an individual task (15%), a group task (15%), a controlled exam (30%) — and an annual grade (40%, 0.6 weekly hours, 0.8%).

The annual grade is not an assessment event: it is not a task or an exam checked externally by the exams department, and the 2022-23 rule allows only "one assessment event of the controlled-exam kind or two of the task kind". The events carry 60% of the weights. The text says the whole allowance is paid in one year when all the events are performed in that year, but where they are spread over years it does not say in which year the annual grade's 40% is paid — and in 2022-23, when at most 30% of the events can be performed, every split case is such a case.
"""
reading = "The annual grade's share is paid in the school year in which the last of the assessment events is performed, the year that completes the final grade — the reading under which the one-year case of the \"למען הסר ספק\" sentence pays 100%."
l4 = "l4/circulars/2022-23_tashpag_03.l4"
evidence = "`the events carry only part of the weights`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2022-23_tashpag_03-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d/p8", "art_1__para_d/t2", "art_1__para_d/p12", "art_1__para_d/p13"]
quote = "יוקטן היקף השעות השבועיות שיינתנו למורה המלווה בהתאם לטבלה להלן · והגמול יישאר בהיקף של 0.4ש\"ש"
title = "A civics summary work with fewer than ten students: 1(3)'s table or 1(4)'s 0.4 hours?"
body = """
1(3) gives a teacher accompanying the multidisciplinary summary work 0.4 weekly hours for a group of at least ten students and reduces it by a table below ten (0.2 for 6-9, 0.1 for 1-5). 1(4) replaces the civics performance-task allowance of the 22.4.2009 agreement with "the allowance for the multidisciplinary summary work in civics as set out in this arrangement, and the allowance will remain at 0.4 weekly hours".

Read as a fixed amount, 1(4) gives a civics class of eight students 0.4 hours where 1(3)'s table gives 0.2. Read as a reference to 1(3) ("as set out in this arrangement"), "0.4" is only the full rate and the table applies. The two readings pay a small civics class differently.
"""
reading = "1(4) sends civics to 1(3)'s allowance \"as set out in this arrangement\", table included; \"remains at 0.4\" is read as the full rate for a group of ten or more, unchanged from the performance-task allowance."
l4 = "l4/circulars/2022-23_tashpag_03.l4"
evidence = "`1(3) and 1(4) give a small civics class different hours`"
depends_on = []
