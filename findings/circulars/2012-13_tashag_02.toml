[[finding]]
id = "F-2012-13_tashag_02-c"
kind = "contradiction"
stage = "writing"
severity = "medium"
severity_why = "תחולת החוזר צרה מהכללים שבו, וכל כלל קובע לגבי המקרה שהוא נוקב בו."
keys = ["art_1/p1", "art_2__para_h", "art_2__para_i", "art_2__para_j", "art_2__para_j/p4"]
quote = "הוראות חוזר זה יחולו על כל העובדים … ואשר מועסקים בשנה\"ל תשע\"ג על-פי רפורמת עוז לתמורה ביישום חלקי · מנהלים חדשים כאמור ביישום מלא יהיו זכאים ל\"תוספת מעבר רפורמה\" בשיעור של 50% וכן ל\"תוספת עוז לתמורה-מנהלים\" בשיעור של .30%"
title = "החוזר חל רק על עובדים ביישום חלקי, ונותן כללים לעובדים שמחוץ לו"
body = """
סעיף 1 מחיל את הוראות החוזר על עובדי ההוראה בחטיבה העליונה "אשר מועסקים בשנה"ל תשע"ג על-פי רפורמת עוז לתמורה ביישום חלקי". אחר כך סעיף 2 נותן כללים לעובדים שמחוץ לתחולה זו: (ט) קובע שמורים חדשים בחטיבות עליונות שלא צורפו לרפורמה יועסקו לפי התנאים החלים ביישום מלא, (י) נותן למנהלים חדשים ביישום מלא "תוספת מעבר רפורמה" בשיעור של 50% ו"תוספת עוז לתמורה-מנהלים" בשיעור של 30%, ו־(ח) קובע את התוספות השקליות של עובדי הוראה שאינם מועסקים לפי הרפורמה כלל.

למנהל שמונה לראשונה בתשע"ג בבית ספר ביישום מלא, סעיף 1 אומר שהחוזר אינו חל, וסעיף 2(י) נותן את שתי התוספות.
"""
reading = "כל סעיף־משנה של סעיף 2 קובע לגבי המקרה שהוא נוקב בו, ותחולת סעיף 1 נקראת כנושא העיקרי של החוזר ולא כהגבלה עליהם."
l4 = "l4/circulars/2012-13_tashag_02.l4"
evidence = "`section 2(י) gives additions to an employee outside section 1`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2012-13_tashag_02-d"
kind = "ambiguity"
stage = "writing"
severity = "medium"
severity_why = "חוזר תשע\"ג/2 עצמו נותן רמז לנקודות (תקרה של 139.3%) ואין הסכם בקורפוס שסותר את יישומו, כך שזו הכרעה שקולה ולא סטטוס קוו שבית משפט צפוי להפוך."
keys = ["art_2__para_b", "art_2__para_d"]
quote = "אזי משכורתה תחושב לפי היקף משרה הגדול ב- 8.3% משיעורו בפועל"
title = "שכר של מורה אם לפי היקף משרה \"הגדול ב־8.3%\": 8.3 נקודות, או 8.3% ממשרתה?"
body = """
סעיף 2(ב) משלם למורה אם ביישום חלקי, הממשיכה לפי מבנה שבוע העבודה הרגיל, לפי "היקף משרה הגדול ב־8.3% משיעורו בפועל". המילים נקראות כ־8.3 נקודות אחוז המתווספות למשרה, או כמשרה המוגדלת ב־8.3% מעצמה.

הקריאות מתיישבות רק במשרה מלאה. ב־80% האחת נותנת 88.3% והאחרת 86.64%; בתקרה שבסעיף 2(ד) האחת מביאה את 131% ל־139.3%, תקרת המורה האם שאותו סעיף־משנה קובע, והאחרת ל־141.87%.
"""
reading = "המשרה מוגדלת ב־8.3% מעצמה (מוכפלת ב־1.083), גם שהיא עצמה אחוז: ב־80% משרה השכר מחושב לפי 86.64%. תקרת המורה האם שבסעיף 2(ד), 139.3%, היא תקרת המורה (131%) ועוד 8.3 נקודות, כך שהטקסט נותן בה רמז לקריאה האחרת; הפער נשאר רשום בממצא זה."
convention = "amounts.increase"
l4 = "l4/circulars/2012-13_tashag_02.l4"
evidence = "`the two readings of the mother's addition differ at 80%`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
