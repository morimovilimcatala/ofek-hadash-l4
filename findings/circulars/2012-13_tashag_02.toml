quote = "37 שעות שבועיות למנהל שהינו מגיל 50 ועד 36, 55 שעות שבועיות למנהל שהינו מגיל 55 ומעלה"
title = "למנהל בן 55 יש שבוע של 37 שעות וגם של 36"
body = """
סעיף 2(ו) קובע את שבוע העבודה של מנהל ביישום חלקי בתשע"ג על 38 שעות, 37 למנהל "מגיל 50 ועד 55" ו־36 למנהל "מגיל 55 ומעלה". שתי המדרגות כוללות את 55. (הקורפוס מדפיס משפט זה כשספרותיו מסודרות מחדש ביחס לעברית — "מגיל 50 ועד 36, 55 שעות"; בדף כתוב "מגיל 50 ועד 55, 36 שעות", והמדרגות נקראות מהדף.)

למנהל בן 55 ניתן שבוע של 37 שעות לפי מדרגה אחת ושבוע של 36 שעות לפי האחרת.
"""
reading = "המדרגה הנפתחת ב־55 היא הקובעת לגבי גיל 55 (36 שעות); \"מגיל 50 ועד 55\" נקרא כמ־50 ועד 55 ולא עד בכלל."
l4 = "l4/circulars/2012-13_tashag_02.l4"
evidence = "`a principal of 55 has two weeks`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

