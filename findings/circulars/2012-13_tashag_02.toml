body = """
סעיף 2(ז) קובע את בסיס המשרה שלפיו יחושב ערך שעה ביישום חלקי בתשע"ג: למורה 32 שעות, 30 "בגיל 50-55" ו־28 "בגיל 55 ומעלה"; למנהל (לעניין שעת היעדרות) 38, 37 "בגיל 50-55" ו־36 "בגיל 55 ומעלה". בשתי הרשימות 55 נמצא בשתי מדרגות. (הקורפוס מדפיס את הסעיף כשספרותיו מסודרות מחדש — "בגיל 30: 50-55ש"ש"; בדף כתוב "בגיל 50-55: 30 ש"ש", והמדרגות נקראות מהדף.)

למורה בן 55 יש בסיס של 30 שעות וגם של 28; למנהל בן 55 בסיס של 37 וגם של 36. הבסיס מחלק את השכר לערך שעה, ולכן שתי התשובות נותנות ערכי שעה שונים.
"""
reading = "המדרגה הנפתחת ב־55 היא הקובעת לגבי גיל 55: למורה בן 55 בסיס של 28 שעות ולמנהל 36, ומדרגות \"50-55\" נקראות כמ־50 ועד 55 ולא עד בכלל."
