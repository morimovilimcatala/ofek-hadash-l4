[[finding]]
id = "F-2012-13_tashag_02-a"
kind = "overlap"
stage = "writing"
keys = ["art_1__para_f"]
quote = "37 שעות שבועיות למנהל שהינו מגיל 50 ועד 36, 55 שעות שבועיות למנהל שהינו מגיל 55 ומעלה"
title = "A principal aged 55 has a week of 37 hours and of 36"
body = """
Section 2(ו) sets the week of a principal in partial implementation in 2012/13 at 38 hours, 37 for a principal "from age 50 to 55" and 36 for one "from age 55 and above". Both bands include 55. (The corpus prints this sentence with its digits reordered against the Hebrew — "מגיל 50 ועד 36, 55 שעות"; the page reads "מגיל 50 ועד 55, 36 שעות", and the bands are read from the page.)

A principal aged 55 is given a 37-hour week by one band and a 36-hour week by the other.
"""
reading = "The band that opens at 55 governs age 55 (36 hours); \"from 50 to 55\" is read as 50 up to 55."
l4 = "l4/circulars/2012-13_tashag_02.l4"
evidence = "`a principal of 55 has two weeks`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2012-13_tashag_02-b"
kind = "overlap"
stage = "writing"
keys = ["art_1__para_g", "art_1__para_g/p2"]
quote = "למורה בגיל 30: 50-55ש\"ש ולמורה בגיל 55 ומעלה 28 -ש\"ש · למנהל בגיל 37: 50-55 שעות ולמנהל בגיל 55 ומעלה 36 -שעות"
title = "The job base for the hourly value gives age 55 two bases, for teachers and for principals"
body = """
Section 2(ז) sets the job base by which the hourly value is computed in partial implementation in 2012/13: for a teacher 32 hours, 30 "at age 50-55" and 28 "at 55 and above"; for a principal (for an hour of absence) 38, 37 "at age 50-55" and 36 "at 55 and above". In both lists 55 is in two bands. (The corpus prints the clause with its digits reordered — "בגיל 30: 50-55ש\"ש"; the page reads "בגיל 50-55: 30 ש\"ש", and the bands are read from the page.)

A teacher aged 55 has a base of 30 hours and of 28; a principal aged 55 one of 37 and of 36. The base divides the salary into the hourly value, so the two answers give different hourly values.
"""
reading = "The band that opens at 55 governs age 55: a teacher of 55 has a base of 28 hours and a principal 36, the \"50-55\" bands being read as 50 up to 55."
l4 = "l4/circulars/2012-13_tashag_02.l4"
evidence = "`the job bases give age 55 two answers`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2012-13_tashag_02-c"
kind = "contradiction"
stage = "writing"
keys = ["art_1/p1", "art_1__para_h", "art_1__para_i", "art_1__para_j", "art_1__para_j/p4"]
quote = "הוראות חוזר זה יחולו על כל העובדים … ואשר מועסקים בשנה\"ל תשע\"ג על-פי רפורמת עוז לתמורה ביישום חלקי · מנהלים חדשים כאמור ביישום מלא יהיו זכאים ל\"תוספת מעבר רפורמה\" בשיעור של 50%וכן ל\"תוספת עוז לתמורה-מנהלים\" בשיעור של .30%"
title = "The circular applies only to staff in partial implementation, and gives rules to staff outside it"
body = """
Section 1 applies the circular's provisions to teaching staff of the upper division "who are employed in 2012/13 under the Oz LaTmura reform in PARTIAL implementation". Section 2 then gives rules to staff outside that scope: (ט) has new teachers in upper divisions that have not joined the reform employed on the terms of FULL implementation, (י) gives new principals in FULL implementation a reform-transition addition of 50% and an Oz LaTmura principals' addition of 30%, and (ח) sets the shekel additions of staff not employed under the reform at all.

For a principal newly appointed in 2012/13 in a school in full implementation, section 1 says the circular does not apply, and section 2(י) gives the two additions.
"""
reading = "Each clause of section 2 governs the case it names, and section 1's scope is read as the circular's main subject rather than a limit on them."
l4 = "l4/circulars/2012-13_tashag_02.l4"
evidence = "`section 2(י) gives additions to an employee outside section 1`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2012-13_tashag_02-d"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_b", "art_1__para_d"]
quote = "אזי משכורתה תחושב לפי היקף משרה הגדול ב 8.3% -משיעורו בפועל"
title = "A mother's salary on a position \"larger by 8.3%\": 8.3 points, or 8.3% of her position?"
body = """
Section 2(ב) pays a mother in partial implementation who keeps the regular work week by "a position larger by 8.3% than its actual rate". The words read as 8.3 percentage points added to the position, or as the position increased by 8.3% of itself.

The readings agree only at a full position. At 80% one gives 88.3% and the other 86.64%; at the ceiling of 2(ד) one carries 131% to 139.3%, the mother's ceiling the same clause states, and the other to 141.87%.
"""
reading = "8.3 percentage points are added, the reading under which section 2(ד)'s mother's ceiling (139.3%) is the teacher's (131%) plus the addition."
l4 = "l4/circulars/2012-13_tashag_02.l4"
evidence = "`the two readings of the mother's addition differ at 80%`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
