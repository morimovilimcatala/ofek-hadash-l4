keys = ["art_9__para_b", "art_9__para_b/p5", "art_9__para_b/p6", "art_9__para_b/p7", "art_9__para_b/p8"]
quote = "200,000 … 54ו 11-חודשים 50 · 120,000 … 59ו 11-חודשים 55 · 80,000 … 63ו 11-חודשים 60 · 35,000 … 65 64"
title = "מדרגת הגיל האחרונה של מענק יישום רפורמה במכללות מסתיימת ב\"65\", ואילו כל מדרגה אחרת מסתיימת ב\"ו־11 חודשים\""
body = """
§9(ב) נותן לעובד הוראה שהעסקתו במכללה הסתיימה בעקבות הרפורמה מענק יישום רפורמה במכללות לפי גילו במועד סיום ההעסקה: מ־50 עד 54 ו־11 חודשים, 200,000 ש"ח; מ־55 עד 59 ו־11 חודשים, 120,000; מ־60 עד 63 ו־11 חודשים, 80,000; ומ־64 עד 65, 35,000.

כל אחת משלוש המדרגות הראשונות נמשכת עד החודש האחרון של שנתה האחרונה, כך ש"עד 54 ו־11 חודשים" מכסה את כל גיל 54. ה"עד 65" של המדרגה האחרונה או שהוא הולך לפי אותו דפוס (כל גיל 65, עד 65 ו־11 חודשים) או שהוא נעצר ביום ההולדת ה־65. מורה שעוזב בגיל 65 וחצי שנה מקבל 35,000 ש"ח לפי הקריאה הראשונה ודבר לפי השנייה.

אותה טבלה, עם אותה רצועה אחרונה "65 64", מודפסת בחוזרי השיפוי של המכללות, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2018-19_tashat_02-a (תשע"ט/2), F-2019-20_tashaf_08-a (תש"פ/8) ו־F-2020-21_tashpa_03-b (תשפ"א/3).
"""
reading = "\"עד 65\" נקרא כפי שהוא כתוב — עד יום ההולדת ה־65 — שכן המדרגה אינה אומרת \"ו־11 חודשים\" כמו האחרות; מורה מבוגר מכך נמצא מחוץ לטבלה."
convention = "thresholds.until"
l4 = "l4/circulars/2018-19_tashat_02.l4"
evidence = "`the two readings of \"up to 65\" differ at 65 and a half`"
