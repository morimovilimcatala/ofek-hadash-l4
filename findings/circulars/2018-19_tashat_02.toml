quote = "200,000 … 54ו 11-חודשים 50 · 120,000 … 59ו 11-חודשים 55 · 80,000 … 63ו 11-חודשים 60 · 35,000 … 65 64"
title = "The special grant's last age band ends at \"65\", where every other band ends at \"and 11 months\""
body = """
§9(b) gives a teacher whose college employment ended through the reform a special grant by age at the end of employment: from 50 to 54 and 11 months, 200,000 shekels; from 55 to 59 and 11 months, 120,000; from 60 to 63 and 11 months, 80,000; and from 64 to 65, 35,000.

Each of the first three bands runs to the last month of its final year, so that "to 54 and 11 months" covers the whole of age 54. The last band's "to 65" either follows that pattern (the whole of age 65, to 65 and 11 months) or stops at the 65th birthday. A teacher who leaves at 65 and 6 months gets 35,000 shekels under the first reading and nothing under the second.
"""
reading = "\"To 65\" is read as written — up to the 65th birthday — since the band does not say \"and 11 months\" as the others do; a teacher older than that is outside the table."
