body = "נספח ד' לחוזר מדפיס טבלת מקדמי המרה עם עמודה אחת, של בית ספר יסודי (17, 24, 20, 27), ומתחתיה: למורים בכיתות ז'-ט' על בסיס 24 ש\"ש (חט\"ב) \"מקדם ההמרה יגדל ב-12.5%\". החוזר אינו אומר לאיזה מקדם מוסיפים את ה־12.5, ואינו נותן דוגמה של מורה כזה.\n\nאותו משפט בדיוק הופיע בחוזרים לבעלויות על בתי ספר לחינוך מיוחד מתש\"ף/1 עד תשפ\"ג/2, מתחת לטבלה עם שתי עמודות — יסודי וחטיבת ביניים (27, 34, 30, 37) — והדוגמה שם הייתה מורה בחטיבת הביניים (Y = 34). מתשפ\"ד עמודת חטיבת הביניים נעלמה, והמשפט נשאר.\n\nסעיף 49(א) להסכם אופק חדש קובע שהמרת השכר של מורה כזה \"תחושב לפי המרת השכר למורה בחטיבת הביניים, אולם מקדם ההמרה Y יהיה גדול ב-12.5% מהתוספת הקבועה בסעיף 44\", והדוגמה בסעיף 49(ג) מחשבת 27 + 12.5. לפי ההסכם מורה אם מקבלת 46.5. מי שיוסיף את ה־12.5 לעמודה היחידה שבחוזר יקבל 36.5 — 10 נקודות פחות בכל אחד מארבעת המעמדות. החוזר משמיט גם את סעיף 49(ב): מורה בכיתות א'-ו' שבסיס משרתו נשמר על 24 ש\"ש מקבל את אותה תוספת.\n\nהחוזר מיועד לבתי הספר היסודיים של רשת מעיין החינוך התורני ושל רשת החינוך העצמאי, שהצטרפו לאופק חדש מתשפ\"ד; סעיף 4.1 שלו מונה בתי ספר \"הכוללים כיתות א'-ו', א'-ח' או א'-ט'\". ההסכם חל על הבעלויות דרך כתב ההתחייבות (נספח א'), וסעיף 18 של החוזר אומר שבסתירה חל ההסכם.\n\nבחוזרים לחינוך המיוחד מאז תשפ\"ד/2 חסרה אותה עמודה, ושם היא נוגעת גם למורים בבתי ספר רב־שלביים שהועסקו על בסיס 24 ש\"ש (F-2025-26_tashpo_01-x)."
