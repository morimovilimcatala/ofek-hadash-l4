§2ד מעניק את מענק היובל לפי הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן המענק (ספטמבר 2014 למענק המשולם ביוני 2015). §2ה.2 מעניק אותו לעובד הוראה שהשלים 25 או 30 שנות עבודה עד 1 ביוני של השנה הנדונה.

עובד הוראה שהשנה ה־25 שלו מושלמת בין ספטמבר ל־1 ביוני — ותק 24 כפי שנקבע בספטמבר 2014, 25 שנים שלמות עד 1 ביוני 2015 — נדחה לפי §2ד וזוכה לפי §2ה.2.
"""
reading = "התאריך של §2ה.2 גובר: המענק נצמח בשנה שבה הוותק המזכה מושלם עד 1 ביוני; §2ד נקרא כמציין את רשומת הוותק שממנה נעשית הספירה."
