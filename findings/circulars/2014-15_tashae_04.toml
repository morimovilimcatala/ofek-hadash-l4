title = "משרה מלאה אחת לכל היותר, או החלק של כל מעסיק מעבר ל־100%?"
body = """
§1ה: עובד הוראה ביותר ממשרה מלאה זכאי לקצובה של משרה שלמה אחת בלבד. §1ו: עובד הוראה של יותר ממעסיק אחד שהיקף משרתו הכוללת מעבר ל־100% זכאי לקבל מכל מעסיק ומעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו.

ב־70% אצל מעסיק אחד וב־60% אצל אחר, §1ו משלם 0.7 ועוד 0.6, שהם 1.3 קצובות, ו־§1ה מתיר 1. מענק היובל חוזר על ההתנגשות: §2ה.4 משלם "עד למשרה אחת בלבד", ו־§2ה.5 מחיל את §§1ו–1ח על עובד של כמה מעסיקים.
"""
reading = "§1ה (ו־§2ה.4) מגבילים את הקצובה אצל מעסיק אחד; §1ו (ו־§2ה.5) חלים על כמה מעסיקים, כשכל אחד משלם בעד המשרה המוחזקת אצלו — הכלל המיוחד למקרה שהוא מציין."
