§1ה: עובד הוראה ביותר ממשרה מלאה זכאי לקצובה של משרה שלמה אחת בלבד. §1ו: עובד הוראה של יותר ממעסיק אחד שהיקף משרתו הכוללת מעבר ל־100% זכאי לקבל מכל מעסיק ומעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו.

ב־70% אצל מעסיק אחד וב־60% אצל אחר, §1ו משלם 0.7 ועוד 0.6, שהם 1.3 קצובות, ו־§1ה מתיר 1. מענק היובל חוזר על ההתנגשות: §2ה.4 משלם "עד למשרה אחת בלבד", ו־§2ה.5 מחיל את §§1ו–1ח על עובד של כמה מעסיקים.

אותן שתי הוראות על מענק היובל — עד משרה אחת בלבד, והחלת סעיפים 1ו–1ח על מי שמועסק אצל כמה מעסיקים — מודפסות בחוזרי דמי ההבראה ומענק היובל מתשע"ה, והשאלה נרשמה עם אותה קריאה בכל חוזר שבו סעיפים 1ו–1ח כוללים את הכלל לכמה מעסיקים (בתשפ"ד/10 ובתשפ"ה/11 ההפניה אינה מגיעה אליו, וזו שאלה אחרת: F-2023-24_tashpad_10-e ו־F-2024-25_tashpah_11-b): F-2014-15_tashae_04-b (תשע"ה/4), F-2015-16_tashav_07-b (תשע"ו/7), F-2016-17_tashaz_05-b (תשע"ז/5), F-2017-18_tashach_04-g (תשע"ח/4), F-2018-19_tashat_06-g (תשע"ט/6), F-2019-20_tashaf_09-g (תש"פ/9), F-2020-21_tashpa_07-d (תשפ"א/7), F-2021-22_tashpab_06-g (תשפ"ב/6), F-2022-23_tashpag_08-f (תשפ"ג/8) ו־F-2025-26_tashpo_07-f (תשפ"ו/7).
"""
