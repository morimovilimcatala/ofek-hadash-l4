אותו סעיף — "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה (1/10 לכל חודש עבודה)", ומתשע"ב "לקצובת הבראה בשיעור יחסי" — מופיע בכל חוזרי ההבראה של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-a`, `F-2007-08_tashsach_05-a`, `F-2008-09_tashsat_09-a`, `F-2009-10_tasha_03-b`, `F-2010-11_tashaa_02-a`, `F-2011-12_tashab_12-a`, `F-2012-13_tashag_07-b`, `F-2013-14_tashad_07-b`, `F-2015-16_tashav_07-a`, `F-2016-17_tashaz_05-a`, `F-2017-18_tashach_04-a`, `F-2018-19_tashat_06-a`, `F-2019-20_tashaf_09-a`, `F-2020-21_tashpa_07-a`, `F-2021-22_tashpab_06-a`, `F-2022-23_tashpag_08-a`, `F-2023-24_tashpad_10-a`, `F-2024-25_tashpah_11-a`, `F-2025-26_tashpo_07-a`. ההבדל בניסוח בין "באופן יחסי" ל"בשיעור יחסי" אינו נוגע לשאלה, ולכן כולם מאמצים קריאה אחת.
