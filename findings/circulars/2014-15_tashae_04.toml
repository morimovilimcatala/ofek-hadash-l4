title = "האם מענק היובל משולם פעם אחת, בשנת ההשלמה, או לכל מי שבעל 25/30 שנים ומעלה?"
body = """
§2ב משלם את מענק היובל לעובד הוראה בעל ותק מצטבר "של 25 או 30 שנה ומעלה". §2ה.2 משלם אותו לעובד הוראה שהשלים 25 או 30 שנים עד 1 ביוני "באותה שנה".

