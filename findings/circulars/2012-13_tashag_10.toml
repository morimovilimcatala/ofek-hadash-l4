# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2012-13_tashag_10-a"
kind = "broken-reference"
stage = "writing"
keys = ["art_c__para_3__subpara_b"]
quote = "המשכורת הקובעת לצורך חישוב תשלומי עובדים בפנסיה תקציבית (2%) – רחל, אנא הפני לחוזר הרלוונטי שלכם או שלנו, מספר החוזר שלנו הוא: 8-1-2004 מיום 2.2.2004."
title = "ג.3.ב carries a drafting note to a colleague instead of its reference"
body = """
Section ג.3 lists the payments for which the 0.9324% reduction is not taken into account. Item ב is "the determining salary for computing the payments of employees on budgetary pension (2%)", followed not by a reference but by a note addressed to a colleague: "Rachel, please refer to your relevant circular or ours; our circular's number is 8-1-2004 of 2.2.2004."

The note was published as part of the circular. It leaves open which instrument defines the "determining salary" and the "(2%)" the item speaks of — the Ministry's own circular or the Treasury's 8-1-2004 — and it does not say what the 2% is. An owner reading the item cannot tell which definition the circular adopts.
"""
reading = "The item is encoded by its words: the determining salary for budgetary-pension payments is computed without the reduction. Which instrument defines that salary, and the 2%, is left as an input."
l4 = "l4/circulars/2012-13_tashag_10.l4"
evidence = "`ג.3.ב names no instrument`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
