Section א prints the 2016 shekel supplement for two groups: "teachers under עוז לתמורה" (1,363.98 shekels a month from 1.1.2021, 1,404.62 from 1.9.2021) and "teachers not under עוז לתמורה and principals" (1,147.12 and 1,187.76).

The second group's words parse two ways. Read as "(teachers not under the reform) and (principals)", every principal takes the second amount. Read as "teachers and principals not under the reform", a principal employed under עוז לתמורה is in neither group — or in the first, if "teachers" there covers him. The circular applies expressly to employees under the reform and not under it alike, so the case arises; the two amounts differ by 216.86 shekels a month.
"""
