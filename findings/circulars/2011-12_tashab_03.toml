quote = "עובד הוראה אשר היה מועסק ברצף אצל המעסיקים · יהיה זכאי למענק חד פעמי בסכום של 2,000₪בהתאם למפורט להלן · הסכום האמור בסעיף-קטן (א) הינו לעובד הוראה המועסק במשרה מלאה (100%) אצל המעסיק"
title = "מענק של 2,000 ₪ לעובד, או לכל מעסיק? מורה בשני מעסיקים מקבל יותר ממשרה מלאה"
body = """
סעיף 2(א) מזכה עובד הוראה שהועסק ברצף "אצל המעסיקים" במענק חד־פעמי של 2,000 ₪. סעיף 2(ב) מחשב את הסכום לפי היקף המשרה "אצל המעסיק": משרה מלאה אצלו או יותר מקבלת 2,000 ₪, ומשרה חלקית — באופן יחסי לה. אין בחוזר תקרה לסך המענקים של עובד אצל כמה מעסיקים.

הבדיקה על פני כל זוג היקפי משרה בעשיריות אצל שני מעסיקים מראה שסך המענקים עולה על 2,000 ₪ בדיוק כשסך המשרות עולה על משרה אחת: מורה במשרה מלאה אצל כל אחד משני מעסיקים מקבל 4,000 ₪, ומורה ב־120% אצל מעסיק אחד — 2,000 ₪. הטקסט אינו אומר אם 2,000 ₪ הם המענק של העובד או של כל מעסיק.
"""
reading = "כל מעסיק משלם לפי היקף המשרה אצלו, עד משרה מלאה אחת אצלו, כפי שסעיף 2(ב) מחשב; אין תקרה משותפת לכמה מעסיקים."
