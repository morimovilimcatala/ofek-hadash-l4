title = "האם הקטנת הגמול לפי גודל הכיתה חלה גם על השעות השבועיות, או רק על ה־2% של \"סעיף-קטן (א)\"?"
body = """
§1ג.1 מחשב את גמול הכנה לבגרות בשני סעיפים: א) החל מ־1.9.2008, 2% מהבסיס של משרה מלאה לכל כיתה המוכנה לשאלון; ב) "בנוסף", החל מ־1.9.2009, שעות שבועיות מעבר להיקף המשרה לפי המספר הסידורי של השאלון (0.5 עד 1.25). §1ג.2 משלם לאחר מכן את ה"גמול כאמור בסעיף-קטן (א)" במלואו לכיתה המונה לפחות 10 תלמידים, 50% ממנו לכיתה של 6–9 תלמידים ו־25% לכיתה של 1–5.

ב־§1ג אין סעיף־קטן (א) — חלקיו ממוספרים 1), 2), 3) — ולכן ההפניה היא או לסעיף א) של §1ג.1, ה־2% בלבד, או ל־§1ג.1 כולו, הגמול של שני הסעיפים. הקריאות נבדלות לגבי כל כיתה קטנה החל מ־1.9.2009: כיתה של 8 תלמידים המתכוננת לשאלון 6 מזכה ב־1.25 שעות שבועיות לפי הראשונה וב־0.625 לפי השנייה.
"""
reading = "ההפניה היא לסעיף א), כפי שהודפס: הקטנת הגמול לפי גודל הכיתה חלה על תוספת ה־2%, והשעות השבועיות של §1ג.1ב ניתנות במלואן בלא קשר לגודל הכיתה."
