[[finding]]
id = "F-2008-09_tashsat_04-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_c__subpara_2", "art_1__para_c__subpara_2/p2", "art_1__para_c__subpara_1__cls_a", "art_1__para_c__subpara_1__cls_b"]
quote = "גמול כאמור בסעיף-קטן (א) ישולם לעובד הוראה המכין לבגרות כיתה המונה לפחות 10 תלמידים · יהיה זכאי ל – 50%מהגמול האמור"
title = "Does the class-size reduction reach the weekly hours, or only \"sub-section (א)\"'s 2%?"
body = """
§1ג.1 computes the matriculation-preparation reward in two clauses: א) from 1.9.2008, 2% of the full-position base for each class prepared for a questionnaire; ב) "in addition", from 1.9.2009, weekly hours beyond the position by the questionnaire's serial number (0.5 to 1.25). §1ג.2 then pays "the reward referred to in sub-section (א)" in full for a class of at least 10 pupils, 50% of it for 6–9 pupils and 25% for 1–5.

§1ג has no sub-section (א) — its parts are numbered 1), 2), 3) — so the reference is either to clause א) of §1ג.1, the 2% alone, or to §1ג.1 as a whole, the reward of both clauses. The readings differ for every small class from 1.9.2009: a class of 8 preparing for questionnaire 6 earns 1.25 weekly hours on the first and 0.625 on the second.
"""
reading = "The reference is to clause א), as printed: the class-size reduction applies to the 2% supplement, and §1ג.1ב's weekly hours are given in full whatever the class size."
l4 = "l4/circulars/2008-09_tashsat_04.l4"
evidence = "`§1ג.2's reach changes the hours`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_04-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_2__para_a__subpara_1", "art_2__para_a__subpara_1/p2", "art_2__para_a__subpara_1/p12"]
quote = "מספר יחידות גמול מספר התלמידים סוג הפעולה · 1 תלמיד בודד בחינה בעל-פה · יחידת גמול תהיה שווה ל – 0.5%מבסיס שכר"
title = "Reward units are given per kind of accommodation, without saying per what — an exam, a session or an hour"
body = """
§2א.1 rewards accommodations given to learning-disabled pupils "in hours beyond the working hours of the position", and its table gives each kind a number of reward units: 1 for extra time, reading the questionnaire or an oral exam, 1.25 for taking down dictated answers or transcribing them. A unit is 0.5% of the salary base.

The table does not say what one unit is earned for: one exam, one session with the pupil or group, or one hour of the work — and the clause measures the work in hours. A three-hour oral exam earns one unit on the first reading and three on the last; the yearly quotas of §2א.7א (52 and 130 units a class) do not settle it either.
"""
reading = "The units are earned once for each accommodation given in one exam, whatever its length — the reading the table's per-action layout and per-class yearly quotas fit best."
l4 = "l4/circulars/2008-09_tashsat_04.l4"
evidence = "`units per exam and per hour differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
