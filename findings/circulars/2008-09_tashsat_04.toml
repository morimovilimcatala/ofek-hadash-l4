title = "יחידות גמול ניתנות לכל סוג פעולה, בלי לומר בעד מה — בחינה, מפגש או שעה"
body = """
§2א.1 מתגמל פעולות עם תלמידים לקויי למידה "בשעות שהן מעבר לשעות העבודה הכלולות במסגרת המשרה", והטבלה שלו נותנת לכל סוג פעולה מספר יחידות גמול: 1 לתוספת זמן לבחינה, להקראת שאלון בחינה או לבחינה בעל־פה, 1.25 להכתבת תשובות בחינה על־ידי התלמיד או לשעתוקן. יחידת גמול שווה ל־0.5% מבסיס השכר.

הטבלה אינה אומרת בעד מה ניתנת יחידה אחת: בחינה אחת, מפגש אחד עם התלמיד או הקבוצה, או שעה אחת של העבודה — והסעיף מודד את העבודה בשעות. בחינה בעל־פה בת שלוש שעות מזכה ביחידה אחת לפי הקריאה הראשונה ובשלוש לפי האחרונה; גם המכסות השנתיות של §2א.7א (52 ו־130 יחידות לכיתה) אינן מכריעות בכך.
"""
reading = "היחידות ניתנות פעם אחת לכל פעולה שניתנה בבחינה אחת, בלא קשר לאורכה — הקריאה שהמבנה של הטבלה, לפי פעולה, והמכסות השנתיות לפי כיתה מתאימים לה ביותר."
