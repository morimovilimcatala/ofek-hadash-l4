title = "מכללות להכשרת עובדי הוראה צריכות גם 25 וגם 30 שנים למענק היובל"
body = """
סעיף־משנה 2ה.3 מחלק את שלבי החינוך בין שני ותקים מזכים למענק היובל. רשימת 25 השנים מסתיימת ב"מכללות האקדמאיות להכשרת עו"ה"; רשימת 30 השנים, הנפתחת כ"יתר שלבי החינוך", מזכירה בסוגריים "מכללות להכשרת עו"ה".

לכן עובד הוראה במכללה להכשרת עובדי הוראה נמצא בשתי הרשימות, וסעיף־המשנה נותן שני ותקים מזכים, 25 ו־30 שנים: לעובד בעל ותק של 27 שנים המענק מגיע לפי האחת ואינו מגיע לפי האחרת. כל שלב אחר שסעיף־המשנה מזכיר נמצא ברשימה אחת בדיוק.

שתי הרשימות, ובשתיהן המכללות להכשרת עובדי הוראה, מודפסות בחוזרי מענק היובל מתש"פ עד תשפ"ו, והשאלה נרשמה בכל אחד מהם עם אותה קריאה (25 שנה): F-2019-20_tashaf_09-c (תש"פ/9), F-2020-21_tashpa_07-b (תשפ"א/7), F-2021-22_tashpab_06-e (תשפ"ב/6), F-2022-23_tashpag_08-c (תשפ"ג/8), F-2023-24_tashpad_10-c (תשפ"ד/10), F-2024-25_tashpah_11-e (תשפ"ה/11) ו־F-2025-26_tashpo_07-c (תשפ"ו/7).
"""
reading = "המכללות צריכות 25 שנים: רשימת 25 השנים מזכירה אותן במפורש, ורשימת 30 השנים נפתחת כשלבים שאינם אלה שכבר נזכרו."
