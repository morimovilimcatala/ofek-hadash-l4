# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2020-21_tashpa_07-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובת הבראה בשיעור יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה(."
title = "A part-time allowance pro-rated by the position fraction, and at \"1/10 for each month of work\""
body = """
Clause 1ד pro-rates the recuperation allowance of a part-time teaching employee "relative to the fraction of his position that year", and adds in a parenthesis "1/10 for each month of work". The parenthesis is a measure of MONTHS, not of the position fraction, and the clause does not say how the two combine: whether the months rate replaces the position fraction, explains it, or applies on top of it.

Read literally, the months rate is not bounded: a year of employment runs twelve months, and at 1/10 a month twelve months give 12/10 of the allowance, more than the full-position amount the clause pro-rates down from.
"""
reading = "The position fraction and the months rate combine (multiplied), and ten months of work count as a whole year's work, so the months share never exceeds one."
l4 = "l4/circulars/2020-21_tashpa_07.l4"
evidence = "`twelve months at 1/10 a month is more than a whole allowance`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2020-21_tashpa_07-b"
kind = "overlap"
stage = "writing"
keys = ["art_2__para_e__subpara_3"]
quote = "ובמכללות האקדמאיות להכשרת עו\"ה -הוותק המזכה במענק יובל הינו וותק מצטבר כהגדרתו לעיל, של 25 שנה. לגבי חלקיות ההעסקה אצל הבעלויות ביתר שלבי החינוך (גני ילדים, יסודי, מכללות להכשרת עו\"ה) הוותק המזכה במענק יובל הינו וותק מצטבר, כהגדרתו לעיל, של 30 שנה."
title = "Teacher-training colleges need both 25 and 30 years for the jubilee grant"
body = """
Clause 2ה.3 divides the stages of education between two qualifying seniorities for the jubilee grant. The 25-year list ends with "the academic colleges for training teaching employees"; the 30-year list, introduced as "the other stages of education", names in its parenthesis "colleges for training teaching employees".

A teaching employee at a teacher-training college is therefore in both lists, and the clause gives two qualifying seniorities, 25 and 30 years: for an employee with 27 years the grant is due under one and not under the other. Every other stage the clause names is in exactly one list.
"""
reading = "The colleges need 25 years: the 25-year list names them expressly, and the 30-year list is introduced as the stages OTHER than those already named."
l4 = "l4/circulars/2020-21_tashpa_07.l4"
evidence = "`teacher-training colleges are given both 25 and 30 years`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2020-21_tashpa_07-c"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_d", "art_2__para_e__subpara_2"]
quote = "מענ ק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני תשלום מענק יובל. · עובד הוראה שהשלים 25 או 30 שנות עבודה בישראל על-פי האמור להלן, ב 1 -ביוני של אותה שנה נדונה (ובכלל זה ותק בגין שירות חובה בצה\"ל) יזכה באותה שנה במענק יובל."
title = "The jubilee seniority is tested in September of the year before, and again on 1 June"
body = """
Clause 2ד gives the jubilee grant "according to the seniority set for the teaching employee in September of the year before the grant is paid" — September 2020 for the June 2021 payment. Clause 2ה.2 gives it to an employee who "completed 25 or 30 years of work in Israel … by 1 June of that year".

The two tests are taken nine months apart. An employee whose seniority set in September 2020 is 29 years, and who completes 30 years of work before 1 June 2021, qualifies under 2ה.2 and not under 2ד.
"""
reading = "2ה.2 governs: it is the clarification that names the day on which the years are counted; 2ד is read as naming the seniority record that is counted, not the day."
l4 = "l4/circulars/2020-21_tashpa_07.l4"
evidence = "`2ד and 2ה.2 disagree on the qualifying seniority`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2020-21_tashpa_07-d"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_e__subpara_4", "art_2__para_e__subpara_5", "art_1__para_f"]
quote = "מענק יובל ישולם לעובד הוראה בהתאם לחלקיות משרתו באותה שנה עד למשרה אחת בלבד · לגבי עובד הוראה המועסק אצל יותר ממעסיק אחד יחולו הכללים האמורים בסעיפים 1ו' עד 1ח' לעיל, בשינויים המחויבים."
title = "The jubilee grant is capped at one position, and paid by each employer for its own share"
body = """
Clause 2ה.4 pays the jubilee grant by the position fraction "up to one position only". Clause 2ה.5 applies to an employee of several employers the rules of clauses 1ו-1ח, and 1ו says that where the total position at several employers is above 100%, each employer pays separately the share of the position held with it.

For an employee at 80% with one employer and 60% with another, 1ו (through 2ה.5) gives two grants totalling 140% of one, and 2ה.4 caps the grant at one position.
"""
reading = "2ה.5 governs an employee of several employers: each employer pays its own share, and 2ה.4's cap of one position applies at each employer."
l4 = "l4/circulars/2020-21_tashpa_07.l4"
evidence = "`2ה.4 and 2ה.5 disagree on the total for two employers`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
