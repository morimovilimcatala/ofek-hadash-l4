quote = "עובד הוראה במשרה חלקית זכאי לקצובת הבראה בשיעור יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה(."
title = "קצובה במשרה חלקית מחושבת באופן יחסי לחלקיות המשרה, וגם לפי \"1/10 לכל חודש עבודה\""
body = """
סעיף־משנה 1ד מחשב את קצובת ההבראה של עובד הוראה במשרה חלקית "בשיעור יחסי לחלקיות משרתו באותה שנה", ומוסיף בסוגריים "1/10 לכל חודש עבודה". הסוגריים הם מדד של חודשים, לא של חלקיות המשרה, וסעיף־המשנה אינו אומר כיצד השניים משתלבים: אם שיעור החודשים מחליף את חלקיות המשרה, מסביר אותה, או חל בנוסף לה.

בקריאה מילולית, שיעור החודשים אינו חסום: שנת העסקה נמשכת שנים־עשר חודשים, ובעשירית לחודש שנים־עשר חודשים נותנים 12/10 מהקצובה, יותר מהסכום של משרה מלאה שממנו סעיף־המשנה מחשב באופן יחסי.

אותו סעיף — "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה (1/10 לכל חודש עבודה)", ומתשע"ב "לקצובת הבראה בשיעור יחסי" — מופיע בכל חוזרי ההבראה של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-a`, `F-2007-08_tashsach_05-a`, `F-2008-09_tashsat_09-a`, `F-2009-10_tasha_03-b`, `F-2010-11_tashaa_02-a`, `F-2011-12_tashab_12-a`, `F-2012-13_tashag_07-b`, `F-2013-14_tashad_07-b`, `F-2014-15_tashae_04-a`, `F-2015-16_tashav_07-a`, `F-2016-17_tashaz_05-a`, `F-2017-18_tashach_04-a`, `F-2018-19_tashat_06-a`, `F-2019-20_tashaf_09-a`, `F-2021-22_tashpab_06-a`, `F-2022-23_tashpag_08-a`, `F-2023-24_tashpad_10-a`, `F-2024-25_tashpah_11-a`, `F-2025-26_tashpo_07-a`. ההבדל בניסוח בין "באופן יחסי" ל"בשיעור יחסי" אינו נוגע לשאלה, ולכן כולם מאמצים קריאה אחת.
"""
reading = "שני המדדים חלים יחד: החלק הוא חלקיות המשרה (לכל היותר משרה אחת, כפי שהחוזר קובע) כפול עשירית לכל חודש עבודה, ולכל היותר עשרה חודשים, כך ששנת לימודים מלאה נותנת את החלק המלא ולא יותר. הסוגריים אומרים כיצד נמנית \"חלקיות משרתו באותה שנה\": בעשיריות, על פני שנה בת עשרה חודשים; הם אינם מקדם עצמאי שעולה על השנה, ואינם המחשה בלבד. כשהמשרה משתנה במהלך השנה, כל חודש שוקל עשירית מהמשרה שהוחזקה בו (ובשנה של יותר מעשרה חודשים, הממוצע שלהן). זו הקריאה בכל חוזרי ההבראה, שבכולם הסעיף זהה."
l4 = "l4/circulars/2020-21_tashpa_07.l4"
evidence = "`twelve months at 1/10 a month is more than a whole allowance`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

