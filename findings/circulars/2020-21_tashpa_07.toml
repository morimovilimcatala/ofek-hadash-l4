שתי הבדיקות נעשות בהפרש של תשעה חודשים. עובד שהוותק שנקבע לו בספטמבר 2020 הוא 29 שנים, ושמשלים 30 שנות עבודה לפני 1 ביוני 2021, זכאי לפי 2ה.2 ואינו זכאי לפי 2ד.

