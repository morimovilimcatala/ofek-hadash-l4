# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2017-18_tashach_04-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובת הבראה בשיעור יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה("
title = "\"1/10 for each month of work\" reads as a months share, and gives more than the whole allowance for a twelve-month year"
body = """
§1d pro-rates the recuperation allowance of a part-time employee "in proportion to the position held that year", and glosses it in parentheses: "1/10 for each month of work".

The gloss does not measure a position at all: it counts months of work. Read as written it pro-rates by period, so a part-time employee who worked all year would be paid in full whatever the position, contrary to the sentence it glosses; and a year of eleven or twelve months of work would earn 11/10 or 12/10 of the allowance, more than the full amount. Read as a measure of the position, it has no meaning. The two readings give different allowances for any part-time employee.
"""
reading = "Both rules apply: the allowance is pro-rated by the position (capped at one, §1e) and, separately, by months of work at 1/10 a month, capped at the full allowance after ten months."
l4 = "l4/circulars/2017-18_tashach_04.l4"
evidence = "`one tenth a month passes the full allowance in a twelve-month year`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2017-18_tashach_04-b"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_e", "art_1__para_f"]
quote = "עובד הוראה המועסק ביותר ממשרה שלמה זכאי לקצובת הבראה הניתנת למועסק במשרה שלמה אחת בלבד · זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "Above a full position: one allowance only (§1e), or a proportional allowance from each employer (§1f)?"
body = """
§1e: an employee employed in more than a full position is entitled to the allowance of one full position only. §1f: an employee with more than one employer, whose total position with both is above 100%, is entitled to receive from each employer separately the allowance proportional to the position with that employer.

An employee at 80% with one employer and 60% with another is employed in more than a full position, so §1e gives one allowance; §1f gives 80% of it from the first and 60% from the second, 140% in all. §1e does not limit itself to one employer, and §1f does not say it is an exception to §1e.
"""
reading = "§1f is the specific rule for several employers and governs them, so the employee above is paid 140% in all; §1e governs an employee with one employer."
l4 = "l4/circulars/2017-18_tashach_04.l4"
evidence = "`the two employers pay more than one full allowance`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2017-18_tashach_04-c"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_d", "art_2__para_e__subpara_2"]
quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק יובל · עובד הוראה שהשלים 25 או 30 שנות עבודה בישראל על-פי האמור להלן, ב 1 -ביוני של אותה שנה נדונה"
title = "Jubilee seniority: as set in the previous September (§2d), or years completed by 1 June (§2e(2))?"
body = """
§2d grants the jubilee grant by "the seniority set for the employee in September of the year before the grant is given" — for a grant paid in June 2018, the seniority set in September 2017. §2e(2) grants it to an employee "who completed 25 or 30 years of work in Israel by 1 June of that year".

An employee whose seniority set in September 2017 was 24 years, and who completed 25 years of work between then and 1 June 2018, is not entitled under §2d and is entitled under §2e(2).
"""
reading = "§2e(2), the clause headed as a clarification and the one that names the date, governs: the years completed by 1 June 2018 (with §2e(1)'s bought unpaid-leave years) decide."
l4 = "l4/circulars/2017-18_tashach_04.l4"
evidence = "`section 2d and section 2e(2) decide the spring case differently`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
