title = "Does \"not in Oz LaTmura\" qualify the principals too?"
body = """
Section א prints two amounts of the 2016 shekel supplement from 1.1.2023: ₪1,509.98 for "teachers in the Oz LaTmura reform" and ₪1,276.85 for "teachers who are not in the Oz LaTmura reform and principals".

The second group reads two ways. Either it is (teachers not in the reform) + (all principals), and a principal employed under Oz LaTmura gets ₪1,276.85; or "not in the reform" qualifies both nouns, and a principal under Oz LaTmura is in neither group as printed — in the first only if a principal counts as a "teacher" (₪1,509.98), otherwise in none. Section ב deals expressly with principals under Oz LaTmura, so they are a case the circular has in view; the amount it gives them depends on the reading.
"""
