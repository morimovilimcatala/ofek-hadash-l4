# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2013-14_tashad_01-a"
kind = "overlap"
stage = "writing"
keys = ["art_4__para_4-4__subpara_4-4-2", "art_4__para_4-4__subpara_4-4-3"]
quote = "מורים קיימים וחדשים … בגילאי, 55 – 50 זכאים להפחתה של 2 שעות פרונטאליות … מורים המוגדרים עובדי הוראה קיימים … בגילאי 55 ומעלה, זכאים להפחתה של 3 שעות הוראה פרונטאליות ושעה פרטנית אחת"
title = "An existing teacher aged 55 falls in two age bands: 2 hours off, or 4"
body = """
Section 4.4.2 gives existing and new teachers "aged 50-55" a reduction of 2 frontal hours (the job base falls to 34 hours). Section 4.4.3 gives existing teachers "aged 55 and above" a reduction of 3 frontal hours and one individual hour (the base falls to 32). Both bands include age 55.

For a new teacher the overlap is harmless — 4.4.4 gives a new teacher of 55 and above the same 2 hours. For an existing teacher aged 55 the two clauses give different work weeks: 34 hours or 32.
"""
reading = "The band that opens at 55 governs age 55: an existing teacher of 55 has the 4.4.3 reduction, and 4.4.2's band is read as 50 up to 55."
l4 = "l4/circulars/2013-14_tashad_01.l4"
evidence = "`an existing teacher of 55 gets two age bands`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2013-14_tashad_01-b"
kind = "contradiction"
stage = "writing"
keys = ["art_3__para_3-2__subpara_3-2-1", "art_3__para_3-3__subpara_3-3-1", "art_3__para_3-3__subpara_3-3-2"]
quote = "כל עו\"ה בחטיבת הביניים יועסקו עפ\"י תנאי הרפורמה (ללא קשר להשתייכות הארגונית), למעט עו\"ה שאינם אקדמאים · עו\"ה בעל ותק של 28 שנים ומעלה שאינו אקדמאי אינו מחויב לחתום על כתב ההתחייבות ויועסק בכל מקרה עפ\"י תנאי הרפורמה"
title = "3.2.1 excepts non-academics from the reform; 3.3 brings them into it"
body = """
Section 3.2.1: in a junior high where the reform is applied, every teaching employee is employed under it "except teaching employees who are not academics, and except substitutes in certain conditions". Section 3.3, headed "teaching employees who are not academics", then joins them: under 3.3.1 a non-academic with up to 27 years signs an undertaking and joins, and under 3.3.2 a non-academic with 28 years and more "is employed in any case under the reform's terms".

For a non-academic with 30 years in a school in the reform, 3.2.1 says not under the reform, 3.3.2 says under it in any case.
"""
reading = "3.3 is the specific rule for non-academics and governs them; 3.2.1's exception is read as \"not automatically — on the terms of 3.3\"."
l4 = "l4/circulars/2013-14_tashad_01.l4"
evidence = "`3.2.1 and 3.3.2 disagree on a non-academic of 28 years and more`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
