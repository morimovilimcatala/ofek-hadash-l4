quote = "גובה המקדמה לעו\"ה שאינם מנהלים או סגנים ראשונים.27% - · גובה המקדמה למורים מתמחים. 22% -"
title = "An intern is priced by two advance rows: 27% and 22%"
body = """
The salary advance is set in four rows: teaching employees "who are not principals or first deputies" 27%, interns 22%, first deputies 20%, principals 15%. An intern is a teaching employee who is neither a principal nor a first deputy, so the first row covers interns too, and the table gives an intern 27% and 22%.

Read as rows of a table, the advance for an intern is not determined; the difference is five percentage points of the advance base.
"""
reading = "The row that names interns governs them (22%); the first row is read as covering teaching employees who are not interns, principals or first deputies."
l4 = "l4/circulars/2013-14_tashad_01.l4"
evidence = "`an intern has two advance rates`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

