[[finding]]
id = "F-2013-14_tashad_01-e"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_c/p6", "art_4/p15", "art_4/p16"]
quote = "בקשות להעסקת עובדי הוראה המועסקים בבעלות, בהיקף משרה העולה על 106%משרה … יופנו ע\"י מנהל בית הספר או הבעלות למחלקת תנאי שירות במטה אגף בכיר לכא\"ב, לאישור הבקשה · .4.2.3 האישור להעסקה כנ\"ל יינתן בהתאם לצורכי המערכת ובאישור מנהלי/ות תחומי כא\"ב במחוזות"
title = "Employment above a full position is approved at headquarters (2ג) and in the districts (4.2.3)"
body = """
Section 2ג (¶6) sends every request to employ an owner's teaching employee above 106% of a position to the conditions-of-service department at the headquarters of the senior personnel division, for approval. Section 4.2.3 gives the approval of employment above 100% under the reform to the district personnel managers, and 4.2.4 sends to the head of the senior division only the exceptional cases above 42 hours.

A request to employ an owner's employee at 110% of a position, within 42 weekly hours, is for headquarters under 2ג and for the district under 4.2.3. The circular names two different approvers for the same request.
"""
reading = "2ג governs owners' employees above 106% (it is the clause written for them, in the section on the owners' and principals' duties); 4.2.3 is read as covering 100% to 106%, and 4.2.4 the cases above 42 hours."
l4 = "l4/circulars/2013-14_tashad_01.l4"
evidence = "`2ג and 4.2.3 name different approvers for 110%`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2013-14_tashad_01-f"
kind = "ambiguity"
stage = "writing"
keys = ["art_4/p9", "art_4/p10", "art_4/p11", "art_4/p12"]
quote = "אישור העסקה מעבר ל 100% -משרה יכול להינתן במקרים חריגים לעו\"ה (לא למנהלים ולסגנים ראשונים), בהתאם לצרכי המערכת, ובכפוף לקריטריונים הבאים : · עבודה במקצועות נדרשים: מדעים, אנגלית, מתמטיקה, חינוך מיוחד, וחינוך גופני. · מחסור בעו\"ה באזור המבוקש. · מוסד ביישוב מרוחק וקושי בקליטת עו\"ה במוסד."
title = "Employment above 100% is \"subject to the following criteria\": all five, or any of the first three?"
body = """
4.2.2 allows employment above a full position in exceptional cases "subject to the following criteria" and lists five: a subject in demand (science, English, mathematics, special education, physical education), a shortage of teachers in the area, a school in a remote locality that has difficulty absorbing teachers, the extra hours being frontal only, and no more than 8.5 hours a day and 42 a week.

The last two are limits on any approval. The first three describe different situations, and the text does not say whether one of them is enough or all three are needed. Read cumulatively, only a teacher of a subject in demand in a remote school in an area short of teachers can be approved; read as alternatives, a mathematics teacher in an ordinary school can be.
"""
reading = "4.2.2.1-4.2.2.3 are alternatives (any one is enough) and 4.2.2.4-4.2.2.5 are cumulative limits every approval keeps."
l4 = "l4/circulars/2013-14_tashad_01.l4"
evidence = "`the readings of 4.2.2 part on a mathematics teacher in an ordinary school`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
