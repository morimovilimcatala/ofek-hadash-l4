ההערה לתנאי הסף הראשון מאפשרת להגיש מועמדות למי שיש לו שלוש שנות הוראה מלאות (במקום חמש), אם יש לו ניסיון ניהולי מוכח של 5 שנים לפחות במערכת החינוך או במערכת שבה ניהל צוות המונה לא פחות מ־30 עובדים, במשרה מלאה ובכלל זה הדרכה, הנחיה או הוראה של עובדים.

פסוקית 30 העובדים נקראת בשתי דרכים: כמסייגת רק "מערכת" שמחוץ לחינוך, או כמסייגת את שתיהן. סגן מנהל שניהל עשרה מורים במשך חמש שנים עומד בחלופה לפי הקריאה הראשונה ואינו עומד בה לפי השנייה.

אותן מילים מודפסות בחוזר תשע"ט/5, והשאלה נרשמה שם עם אותה קריאה: F-2018-19_tashat_05-a.
