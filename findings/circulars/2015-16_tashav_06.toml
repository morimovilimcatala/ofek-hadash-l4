בחוזר שלושה גופים שיכולים לעשות זאת: הבעלות, האחראית לבדיקת תנאי הסף; ועדת הבחירה; ומשרד החינוך, שבלי הסכמתו אין למנות מנהל. דבר אינו אומר מי מהם מבטל, או אם הביטול חל מאליו עם סיום התכנית.

