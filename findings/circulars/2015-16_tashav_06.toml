quote = "אין למנות מנהל על בית הספר, שלא על דעת משרד החינוך ובוודאי שלא בניגוד לעמדתו · בחירה במועמד המתאים ביותר תעשה ע\"י נציגי הגופים השונים בועדה, ע\"פ כללי הבחירה החלים באותה בעלות. עם זאת, אין לבחור במועמד, אשר נציג/י משרד החינוך מצאו כי אינו מתאים לתפקיד"
title = "הסכמת משרד החינוך למינוי, או רק וטו על מועמד שאינו מתאים?"
body = """
המבוא מסכם שעל הבעלות למנות את המנהל "בתיאום מלא עם משרד החינוך" ו"אין למנות מנהל על בית הספר, שלא על דעת משרד החינוך ובוודאי שלא בניגוד לעמדתו". נוהל הבחירה נותן לאחר מכן את הבחירה במועמד המתאים ביותר לנציגי הגופים השונים בוועדה, לפי כללי הבחירה של הבעלות עצמה, עם מגבלה אחת: אין לבחור במועמד שנציגי משרד החינוך מצאו שאינו מתאים.

כשהוועדה בוחרת במועמד שנציגי משרד החינוך מצאו מתאים אך לא העדיפו — ברוב קולות נגדם — הנוהל מתיר את המינוי, והמבוא אוסר אותו, שכן המינוי נעשה שלא על דעת משרד החינוך ובניגוד לעמדתו.

חוזר תשע"ט/5 מדפיס את אותן שתי הוראות, ובנוסף את המבחן החיובי "לא ימונה מנהל שלא נמצא ראוי ומתאים לתפקיד ע"י משרד החינוך"; שם השאלה נרשמה כ־F-2018-19_tashat_05-b, ובשל המשפט הנוסף נקראה כמבחן חיובי.
"""
reading = "הנוהל חל על הבחירה: נציגי משרד החינוך בוחנים את ההתאמה ורשאים לחסום מועמד שאינו מתאים; ההסכמה שבמבוא נקראת כאותו וטו, ולא כאישור נוסף לבחירת הוועדה בין מועמדים מתאימים."
l4 = "l4/circulars/2015-16_tashav_06.l4"
evidence = "`¶26 and ¶10 part on a suitable candidate the ministry does not prefer`"
