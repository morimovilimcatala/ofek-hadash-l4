# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2013-14_tashad_07-a"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_e", "art_1__para_f"]
quote = "עובד הוראה המועסק ביותר ממשרה שלמה זכאי לקצובת הבראה הניתנת למועסק במשרה שלמה אחת בלבד · זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "1ה caps the allowance at one full position; 1ו lets two employers pay more"
body = """
Section 1ה: an employee employed in more than one full position is entitled to the allowance of one full position only. Section 1ו: an employee with more than one employer whose total position with both is above 100% receives from each employer the allowance proportional to the position held with it.

An employee with two employers and more than a full position in total falls under both. At 70% with one employer and 60% with the other, 1ה gives the allowance of one position (100%), while 1ו gives 70% from the first and 60% from the second — 130% in all. The text does not say which governs.
"""
reading = "1ו is the rule for an employee with more than one employer, and 1ה for an employee whose positions are all with one employer: 1ו is the narrower case and names it expressly."
l4 = "l4/circulars/2013-14_tashad_07.l4"
evidence = "`1ה and 1ו give different allowances for two employers above a full position`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2013-14_tashad_07-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d"]
quote = "בשיעור יחסי לחלקיות משרתו באותה שנה ) 1/10 לכל חודש עבודה("
title = "\"1/10 for each month of work\" gives more than the full allowance for 11 or 12 months"
body = """
Section 1ד pro-rates a part-time employee's allowance to the position fraction "that year", and explains it in brackets as "1/10 for each month of work". The two measures are different things — a share of a position and a count of months — and the bracket's measure has no ceiling: an employee who worked 11 or 12 months would, read literally, receive 11/10 or 12/10 of the allowance.

The clause can be read as pro-rating by position only (the bracket being an illustration), by months only, or by both; and on the months measure it does not say whether the ten tenths are a ceiling.
"""
reading = "Both measures apply — the position fraction and the months worked — and the months share is capped at 10/10, so a full year never pays more than the full allowance."
l4 = "l4/circulars/2013-14_tashad_07.l4"
evidence = "`one tenth per month gives more than the whole allowance for twelve months`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2013-14_tashad_07-c"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_d", "art_2__para_e__subpara_2"]
quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק יובל · עובד הוראה שהשלים 25 או 30 שנות עבודה בישראל … ב 1 -ביוני של שנה נדונה … יזכה באותה שנה במענק יובל"
title = "The jubilee grant follows the seniority of the September before, and of 1 June"
body = """
Section 2ד gives the jubilee grant according to the seniority determined for the employee "in September of the year before the grant". Section 2ה(2) gives it, in that year, to an employee who completed 25 or 30 years "on 1 June of the year in question".

The two dates are nine months apart. An employee who reaches 25 years between them — 24.7 years as set in September, 25.4 years on 1 June — is not entitled by 2ד and is entitled by 2ה(2).
"""
reading = "2ה(2)'s test, seniority completed on 1 June of the grant year, governs: it is the clause written to decide entitlement, under the heading \"הבהרות\", and it is the one that names the year in which the grant is paid."
l4 = "l4/circulars/2013-14_tashad_07.l4"
evidence = "`2ד and 2ה(2) disagree for an employee who crosses the threshold between September and June`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2013-14_tashad_07-d"
kind = "ambiguity"
stage = "writing"
keys = ["art_2__para_b", "art_2__para_e__subpara_2"]
quote = "מענק יובל ישולם לעובד הוראה בעל ותק מצטבר בהוראה של 25 או 30 שנה ומעלה"
title = "Is the jubilee grant paid once, or every year from 25 or 30 years on?"
body = """
Section 2ב pays the grant to an employee with accumulated seniority "of 25 or 30 years and more", and 2ה(2) to one who "completed" 25 or 30 years on 1 June of the year. Neither clause says the grant is paid once. Read by its words, 2ב entitles an employee with 31 years of seniority in the upper division to a grant this year as much as one who has just reached 25 — and every year after.

Read as a one-time grant on reaching the threshold, the same employee receives nothing this year. The difference is 60% of the determining salary a year for every employee past the threshold.
"""
reading = "The grant is paid once, in the year the threshold is completed — the reading the name \"jubilee\" carries and the one 2ה(2)'s \"יזכה באותה שנה\" points at."
l4 = "l4/circulars/2013-14_tashad_07.l4"
evidence = "`2ב reaches an employee years past the threshold, the once-only reading does not`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
