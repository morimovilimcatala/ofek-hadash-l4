§6(יב) דוחה את תשלום המענק החד פעמי, לעובד שבמועד התשלום מתקיימות לגביו הנסיבות המפורטות "באחד מן הסעיפים (1) עד (3) להלן", אל המשכורת הראשונה שתשולם עם החזרה לעבודה. הרשימה שמתחתיו מדפיסה ארבע נסיבות: (1) חופשה ללא תשלום, (2) חופשת מחלה ללא משכורת, (3) תקופת לידה והורות, ו־(4) היעדרות בגין פגיעה בעבודה שאינה נזקפת על חשבון חופשת המחלה.

