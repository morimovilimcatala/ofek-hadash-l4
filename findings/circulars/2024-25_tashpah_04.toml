quote = "בסכום שיחושב באופן יחסי לחלקיות משרתו בהשוואה לעובד הוראה במכללה במשרה מלאה · בסכום שיחושב באופן יחסי לחלקיות המשרה בהשוואה לעובדים במשרה מלאה"
title = "תוספות 2024 מחושבות באופן יחסי למשרה, ואין דבר על משרה שמעל 100%"
body = """
§4(א) משלם את התוספת השקלית של 2024, ו־§5א(ה) את התוספת האחוזית 2024, "באופן יחסי לחלקיות המשרה בהשוואה" למשרה מלאה. אף אחד מהם אינו אומר מה דינה של משרה שמעל 100%.

בקריאה כיחס פשוט, משרה של 110% מקבלת 110% מן התוספת (626.88 במקום 569.89 בתוספת השקלית). בקריאה של "חלקיות" — חלק ממשרה מלאה, לכל היותר אחד — היא מקבלת את הסכום של משרה מלאה. אותו הסכם מגביל במפורש את המענק החד פעמי ל־100% (§6(ב), (ג), (ו)), וזה תומך בכל אחת מהקריאות: שהמנסחים מגבילים היכן שהם מתכוונים לכך, או שתקרה היא מה שחלק ממשרה פירושו.
"""
reading = "היחס מוחל כפי שהוא, בלי תקרה: הסעיפים משווים את המשרה למשרה מלאה ואינם קובעים גבול, ואילו §6 מראה שהיכן שההסכם מתכוון לתקרה הוא כותב אותה."
