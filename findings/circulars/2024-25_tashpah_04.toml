# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2024-25_tashpah_04-a"
kind = "contradiction"
stage = "writing"
keys = ["art_6__para_jb", "art_6__para_jb/p7", "art_6__para_jb/p8"]
quote = "מתקיימות לגביו הנסיבות המפורטות באחד מן הסעיפים ( )1 עד ( )3 להלן · נעדר מעבודה בגין פגיעה בעבודה שאינה נזקפת על חשבון חופשת המחלה שלו לפי כל ()4 דין."
title = "The grant's deferral names situations (1) to (3) and lists four"
body = """
§6(יב) defers the one-time grant, for an employee who at the payment date is in "one of the subsections (1) to (3) below", to the first salary paid on the return to work. The list below it prints four situations: (1) unpaid leave, (2) sick leave without pay, (3) the birth-and-parenting period, and (4) an absence through a work injury not charged to sick leave.

For an employee absent through a work injury at the payment date the two give different answers: by the lead-in the grant is paid in November-December 2024 as for everyone else; by the list its payment waits for the return to work.
"""
reading = "All four listed situations defer the payment: the list is the more specific statement, and the fourth item would otherwise have no effect at all."
l4 = "l4/circulars/2024-25_tashpah_04.l4"
evidence = "`6(יב)'s lead-in and its list disagree on a work-injury absence`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_04-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_4__para_a", "art_5a__para_e"]
quote = "בסכום שיחושב באופן יחסי לחלקיות משרתו בהשוואה לעובד הוראה במכללה במשרה מלאה · בסכום שיחושב באופן יחסי לחלקיות המשרה בהשוואה לעובדים במשרה מלאה"
title = "The 2024 supplements are pro-rated to the position with nothing said of a position above 100%"
body = """
§4(א) pays the 2024 shekel supplement, and §5א(ה) the 2024 percentage supplement, "in proportion to the partiality of the position against a full position". Neither says what happens to a position above 100%.

Read as a plain ratio, a 110% position receives 110% of the supplement (626.88 instead of 569.89 for the shekel supplement). Read as "partiality" — a share of a full position, at most one — it receives the full-position amount. The same agreement caps the one-time grant at 100% expressly (§6(ב), (ג), (ו)), which supports either reading: that the drafters cap where they mean to, or that a cap is what a position share means.
"""
reading = "The ratio is applied as it stands, without a ceiling: the clauses compare the position to a full one and state no limit, while §6 shows that where the agreement means a ceiling it writes one."
l4 = "l4/circulars/2024-25_tashpah_04.l4"
evidence = "`a position above 100% is paid differently with and without a ceiling`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
