[[finding]]
id = "F-2011-12_tashab_05-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_3__para_a", "art_3__para_b", "art_3__para_e"]
quote = "האמור בסעיף 3(א) הנ\"ל לא יחול במקרה בו קיים הסדר כללי · במקרה כאמור י משיך לחול ההסדר הכללי, בהתאם להוראותיו ולכללי הזכאות בעניינו"
title = "כשממשיך לחול הסדר מעונות כללי טוב יותר, האם תוספת המעונות משולמת לצדו?"
body = """
סעיף 3(א) קובע שתוספת המעונות מחליפה ומבטלת כל הסדר מעונות אחר החל ממשכורת חודש ספטמבר 2011. סעיף 3(ב) מוציא את סעיף 3(א) מתחולה במקרה שבו הסדר כללי משלם הטבה העולה על 300 ₪ לילד אחד ועל 500 ₪ לשני ילדים או יותר, וסעיף 3(ה) אומר שאותו הסדר ממשיך לחול לפי כלליו.

מה שסעיף 3(ב) מוציא מתחולה הוא ההחלפה והביטול; הזכאות לתוספת לפי סעיף 2 אינה מוזכרת. בקריאה צרה, העובדת שומרת על ההסדר הכללי ומקבלת גם את התוספת; בקריאה לפי כותרת הסעיף ("החלפה/ביטול הסדר מעונות אחר") ותכליתו, ההסדר הטוב יותר נשמר במקום התוספת. לאם לשניים במשרה מלאה הקריאות נבדלות ב־500 ₪ לחודש.

אותה שאלה עולה מחוזר הממונה על השכר 2011-1-48, המיישם את אותה תוספת, ונרשמה שם כ־F-2011-08-07_sachar_2011-1-48_maonot-base-a, עם אותה קריאה.
"""
reading = "ההסדר הכללי הטוב יותר נשמר במקום התוספת: התוספת משולמת היכן שהיא מחליפה את ההסדרים האחרים, ולא היכן שסעיף 3(ב) שומר על אחד מהם."
convention = "amounts.no-cumulate"
