title = "תוספת המעונות נקבעת למשרה מלאה ומחושבת באופן יחסי מתחתיה; מעל משרה מלאה הטקסט שותק"
body = """
סעיף 2(ב) קובע את הסכומים (300 ₪ ו־200 ₪) לעובדת הוראה המועסקת במשרה מלאה, ומחשב אותם באופן יחסי לעובדת במשרה חלקית. עובדי הוראה מועסקים לעתים קרובות מעל משרה מלאה, והחוזר אינו אומר עליהם דבר: לא "ולא יותר ממשרה אחת מלאה", כפי שאומרים חוזרי קצובת הביגוד ודמי ההבראה, ולא חישוב יחסי כלפי מעלה.

אם לילד אחד ב־120% משרה מקבלת 300 ₪ אם הסכום למשרה מלאה הוא תקרה, ו־360 ₪ אם החישוב היחסי פועל בשני הכיוונים.

אותה שאלה עולה מחוזר הממונה על השכר 2011-1-48, המיישם את אותה תוספת, ונרשמה שם כ־F-2011-08-07_sachar_2011-1-48_maonot-base-b, עם אותה קריאה.
"""
