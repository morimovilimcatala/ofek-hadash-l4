[[finding]]
id = "F-2011-12_tashab_05-a"
kind = "gap"
stage = "writing"
keys = ["art_2__para_b"]
quote = "הסכום האמור לעיל הינו לעובדת הוראה המועסקת במשרה מלאה, לגבי עובדת המועסקת במשרה חלקית הסכום יחושב בהתאם לחלקיות המשרה"
title = "The daycare addition is set for a full position and pro-rated below it; above a full position the text is silent"
body = """
Section 2(ב) states the amounts (300 ₪ and 200 ₪) for a teacher employed in a full position, and pro-rates them for a part-time one. Teaching staff are commonly employed above a full position, and the circular says nothing of them: neither "not more than one full position", as the clothing and recuperation circulars say, nor pro-rating upward.

A mother of one child at 120% of a position is paid 300 ₪ if the full-position amount is a ceiling, and 360 ₪ if the pro-rating runs both ways.
"""
reading = "The full-position amount is the most paid: the addition is a partial reimbursement of a daycare expense (section 2(א)(1), 2(ו)), which does not grow with hours above a full position."
l4 = "l4/circulars/2011-12_tashab_05.l4"
evidence = "`section 2(ב) leaves a position above full undecided`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_05-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_3__para_a", "art_3__para_b", "art_3__para_e"]
quote = "האמור בסעיף ( 3א) הנ\"ל לא יחול במקרה בו קיים הסדר כללי · במקרה כאמור י משיך לחול ההסדר הכללי, בהתאם להוראותיו ולכללי הזכאות בעניינו"
title = "Where a better general daycare arrangement continues, is the daycare addition paid besides it?"
body = """
Section 3(א) makes the daycare addition replace and cancel every other daycare arrangement from the September 2011 salary. Section 3(ב) disapplies section 3(א) where a general arrangement pays a benefit above 300 ₪ for one child and 500 ₪ for two or more, and section 3(ה) says that arrangement continues on its own rules.

What section 3(ב) disapplies is the replacement and cancellation; section 2's entitlement to the addition is not mentioned. Read narrowly, the employee keeps the general arrangement and is also paid the addition; read by the section's heading ("replacing/cancelling another daycare arrangement") and its purpose, the better arrangement is kept instead of the addition. For a mother of two in full position the readings differ by 500 ₪ a month.
"""
reading = "The better general arrangement is kept instead of the addition: the addition is paid where it replaces the other arrangements, and not where section 3(ב) keeps one."
l4 = "l4/circulars/2011-12_tashab_05.l4"
evidence = "`section 3(ב) does not say the addition stops`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
