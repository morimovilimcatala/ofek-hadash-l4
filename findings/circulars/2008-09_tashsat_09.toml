[[finding]]
id = "F-2008-09_tashsat_09-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_i"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה (1/10 לכל חודש עבודה)"
title = "דמי הבראה במשרה חלקית: באופן יחסי לחלקיות המשרה, או 1/10 לכל חודש עבודה?"
body = """
סעיף 1ט מזכה עובד הוראה במשרה חלקית בקצובה "באופן יחסי לחלקיות משרתו באותה שנה", והסוגריים שאחריו נותנים את היחס כ"1/10 לכל חודש עבודה". המשפט מודד את המשרה; הסוגריים מודדים חודשים.

השניים נותנים חלקים שונים. מורה בחצי משרה שעבד את כל עשרת חודשי שנת הלימודים מקבל מחצית הקצובה לפי המשפט ואת כולה לפי הסוגריים. לסוגריים גם אין תקרה: עובד שעובד שנים־עשר חודשים, ב־1/10 לחודש, מקבל 12/10 מהקצובה.

אותו סעיף — "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה (1/10 לכל חודש עבודה)", ומתשע"ב "לקצובת הבראה בשיעור יחסי" — מופיע בכל חוזרי ההבראה של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-a`, `F-2007-08_tashsach_05-a`, `F-2009-10_tasha_03-b`, `F-2010-11_tashaa_02-a`, `F-2011-12_tashab_12-a`, `F-2012-13_tashag_07-b`, `F-2013-14_tashad_07-b`, `F-2014-15_tashae_04-a`, `F-2015-16_tashav_07-a`, `F-2016-17_tashaz_05-a`, `F-2017-18_tashach_04-a`, `F-2018-19_tashat_06-a`, `F-2019-20_tashaf_09-a`, `F-2020-21_tashpa_07-a`, `F-2021-22_tashpab_06-a`, `F-2022-23_tashpag_08-a`, `F-2023-24_tashpad_10-a`, `F-2024-25_tashpah_11-a`, `F-2025-26_tashpo_07-a`. ההבדל בניסוח בין "באופן יחסי" ל"בשיעור יחסי" אינו נוגע לשאלה, ולכן כולם מאמצים קריאה אחת.
"""
reading = "שני המדדים חלים יחד: החלק הוא חלקיות המשרה (לכל היותר משרה אחת, כפי שהחוזר קובע) כפול עשירית לכל חודש עבודה, ולכל היותר עשרה חודשים, כך ששנת לימודים מלאה נותנת את החלק המלא ולא יותר. הסוגריים אומרים כיצד נמנית \"חלקיות משרתו באותה שנה\": בעשיריות, על פני שנה בת עשרה חודשים; הם אינם מקדם עצמאי שעולה על השנה, ואינם המחשה בלבד. כשהמשרה משתנה במהלך השנה, כל חודש שוקל עשירית מהמשרה שהוחזקה בו (ובשנה של יותר מעשרה חודשים, הממוצע שלהן). זו הקריאה בכל חוזרי ההבראה, שבכולם הסעיף זהה."
l4 = "l4/circulars/2008-09_tashsat_09.l4"
evidence = "`the position and the months give different shares`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_09-b"
kind = "gap"
stage = "writing"
keys = ["art_1__para_f__subpara_1/p2", "art_1__para_a"]
quote = "\"שנת הבראה\" – תקופה של שנה (הכוונה לשנת לימודים המתחילה בתאריך 1/9/08 ומסתיימת בתאריך 31/8/09), שבעד כולה או בעד חלק ממנה משולמים דמי הבראה אשר מועד תשלומם חל בתקופה הקובעת"
title = "\"שנת הבראה\" מוגדרת כתשס\"ט בלבד, אף שהתקופה הקובעת נמשכת עד 2010"
body = """
סעיף 1א קובע את התקופה הקובעת כשנים 2009 ו־2010. סעיף 1ו, לגבי עובד שפרש או נפטר במהלך שנת הבראה, מגדיר "שנת הבראה" כתקופה של שנה שבעד כולה או בעד חלק ממנה משולמים דמי הבראה אשר מועד תשלומם חל בתקופה הקובעת — ואחר כך, בסוגריים, כ"שנת לימודים המתחילה בתאריך 1/9/08 ומסתיימת בתאריך 31/8/09".

התשלום של יוני 2010 הוא בעד שנת הלימודים תש"ע וחל בתקופה הקובעת, ולכן הלשון הכללית עושה את תש"ע לשנת הבראה והסוגריים אינם עושים זאת. לגבי עובד שפרש או נפטר במהלך תש"ע, הכלל של סעיף 1ו — ההפחתה חלה רק על חלק השנה שקדם לפרישה או לפטירה, והחלק שהופחת בעד התקופה שלאחריה מוחזר בתוך 60 ימים — חל לפי האחת ואינו חל לפי האחרת.
"""
reading = "הלשון הכללית של ההגדרה גוברת: שנת הבראה היא כל שנת לימודים שבעדה משולם תשלום בתקופה הקובעת, ובכלל זה תש\"ע; הסוגריים נוקבים בשנה שחוזר זה משלם בעדה."
l4 = "l4/circulars/2008-09_tashsat_09.l4"
evidence = "`the June 2010 payment is in the determining period but its school year is outside the definition`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_09-c"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p4", "art_2__para_b"]
quote = "מענק היובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק היובל · עובד הוראה שהשלים 30 שנות עבודה בישראל ב- 1 ביוני של שנה נדונה … יזכה באותה שנה במענק יובל"
title = "30 השנים של מענק היובל: כפי שנקבעו בספטמבר שלפני כן, או כפי שהושלמו עד 1 ביוני?"
body = """
סעיף 2 מעניק את מענק היובל "עפ"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק היובל", והמענק משולם במשכורת חודש יוני 2009 — כלומר לפי הוותק שנקבע בספטמבר 2008. ההבהרה שלו, 2ב, מעניקה אותו לעובד הוראה "שהשלים 30 שנות עבודה בישראל ב 1 -ביוני של שנה נדונה", באותה שנה.

בין שני המועדים תשעה חודשים. מורה שהוותק שנקבע לו בספטמבר 2008 היה 29 שנים ושמשלים 30 במרץ 2009 אינו זכאי לפי הראשון וזכאי לפי השני.
"""
reading = "30 השנים נמנות כפי שהושלמו עד 1 ביוני של שנת המענק (סעיף 2ב), שכן ההבהרה נוקבת ביום; הוותק של ספטמבר שבסעיף 2 נקרא כרישום שממנו הן נמנות."
l4 = "l4/circulars/2008-09_tashsat_09.l4"
evidence = "`the September and the June dates give different answers`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_09-d"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p2", "art_2__para_b"]
quote = "בעל ותק מצטבר בהוראה של 30 שנה ומעלה כולל ותק שירות צבאי · שהשלים 30 שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה\"ל)"
title = "30 השנים של מענק היובל: בהוראה, או של עבודה בישראל?"
body = """
סעיף 2 מזכה "עובד הוראה בעל ותק מצטבר בהוראה של 30 שנה ומעלה כולל ותק שירות צבאי", אצל המעסיקים, הבעלויות ובמוסדות החינוך הפורמאלי. ההבהרה שלו, 2ב, מזכה עובד הוראה "שהשלים 30 שנות עבודה בישראל", ובכלל זה שירות חובה בצה"ל.

ותק בהוראה ושנות עבודה בישראל הם מדדים שונים: שנים שבהן עבד העובד מחוץ להוראה נמנות לפי השני ולא לפי הראשון. למורה עם 25 שנות הוראה אחרי שש שנות עבודה אחרת בישראל יש 31 שנים לפי ההבהרה ו־25 לפי הכלל. שני הסעיפים־המשנה גם מונים שירות שונה: "שירות צבאי" מול "שירות חובה בצה"ל".

אותה לשון — "ותק מצטבר בהוראה … כולל ותק שירות צבאי" בכלל, ו"שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה"ל)" בהבהרה — מופיעה בחוזרי מענק היובל של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-c`, `F-2007-08_tashsach_05-b`, `F-2009-10_tasha_03-d`, `F-2010-11_tashaa_02-c`, `F-2011-12_tashab_12-c`, `F-2012-13_tashag_07-e`, `F-2013-14_tashad_07-e`, `F-2014-15_tashae_04-e`, `F-2015-16_tashav_07-e`, `F-2016-17_tashaz_05-e`, `F-2017-18_tashach_04-d`, `F-2018-19_tashat_06-d`, `F-2019-20_tashaf_09-d`, `F-2020-21_tashpa_07-e`, `F-2021-22_tashpab_06-f`, `F-2022-23_tashpag_08-d`, `F-2023-24_tashpad_10-g`, `F-2024-25_tashpah_11-f`, `F-2025-26_tashpo_07-d`; כולם מאמצים קריאה אחת. ההבדל בין החוזרים: מ־`F-2011-12_tashab_12-c` ואילך ההבהרה מוסיפה "על־פי האמור להלן", וההבהרות שאחריה נוקבות בשנים המזכות כ"ותק מצטבר, כהגדרתו לעיל"; בחוזר הזה אין המילים האלה. הן מחזקות את הקריאה שם, אך אינן נדרשות לה: גם בלעדיהן ההבהרה באה תחת הכותרת "הבהרות" של הכלל ונוקבת ביום שעד אליו הוא מושלם.
"""
reading = "המדד של סעיף 2 עצמו קובע את מה שנספר: ותק מצטבר בהוראה אצל המעסיקים, הבעלויות ובמוסדות החינוך הפורמאלי, כולל שירות צבאי, ועם שנות החופשה ללא תשלום שנרכשו לפי הבהרה א, הנמנה עד 1 ביוני של שנת המענק (`F-2008-09_tashsat_09-c`). סעיף 2ב בא תחת הכותרת \"הבהרות\" של הכלל שמעליו ונוקב ביום שעד אליו הוותק מושלם; הוא מבהיר את הכלל ואינו קובע זכאות אחרת, ולכן \"שנות עבודה בישראל\" שבו נקראות כאותו ותק. זו הקריאה בכל חוזרי מענק היובל. שני המדדים הם קלטים בקידוד, כך שאפשר להריץ במקומו את מדד ההבהרה."
l4 = "l4/circulars/2008-09_tashsat_09.l4"
evidence = "`teaching seniority and work in Israel give different answers`"
depends_on = ["F-2008-09_tashsat_09-c"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_09-e"
kind = "ambiguity"
stage = "verification"
keys = ["art_2/p2", "art_2__para_b"]
quote = "מענק יובל ישולם לעובד הוראה בעל ותק מצטבר בהוראה של 30 שנה ומעלה · יזכה באותה שנה במענק יובל"
title = "האם מענק היובל משולם פעם אחת, או בכל שנה מהשנה ה־30?"
body = """
הפסקה השנייה של §2 משלמת את המענק לעובד הוראה בעל ותק "של 30 שנה ומעלה"; הבהרה ב אומרת שעובד הוראה שהשלים 30 שנה עד 1 ביוני "יזכה באותה שנה". החוזר אינו אומר אם עובד הוראה שכבר קיבל את המענק מקבל אותו שוב.

הבדיקה על פני קריירה שלמה (ותק עד 1 ביוני מ־0 עד 45 שנה, ברבעי שנה) מראה ש"30 שנה ומעלה" כולל כל שנה מהשנה ה־30 ואילך, ו"באותה שנה" רק את השנה שבה הושלמו 30 השנים: שתי הקריאות נבדלות בדיוק בכל שנה מהשנה ה־31 — למשל עובד הוראה בשנתו ה־35.

אותה שאלה עולה מאותן מילים ("30 שנה ומעלה", ומתשע"ב "25 או 30 שנה ומעלה") ב־12 חוזרי מענק היובל מתשס"ז עד תשע"ח, והיא נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_06-d (תשס"ז/6), F-2007-08_tashsach_05-c (תשס"ח/5), F-2008-09_tashsat_09-e (תשס"ט/9), F-2009-10_tasha_03-e (תש"ע/3), F-2010-11_tashaa_02-d (תשע"א/2), F-2011-12_tashab_12-e (תשע"ב/12), F-2012-13_tashag_07-d (תשע"ג/7), F-2013-14_tashad_07-d (תשע"ד/7), F-2014-15_tashae_04-d (תשע"ה/4), F-2015-16_tashav_07-d (תשע"ו/7), F-2016-17_tashaz_05-d (תשע"ז/5) ו־F-2017-18_tashach_04-e (תשע"ח/4).
"""
reading = "המענק משולם פעם אחת, בשנה שבה עובד ההוראה משלים 30 שנה עד 1 ביוני (ותק בתוך שנה מ־30); \"30 שנה ומעלה\" נקרא כסף, לא כזכאות שנתית. זו הקריאה של F-2006-07_tashsaz_06-d ושל F-2007-08_tashsach_05-c לאותן מילים."
l4 = "l4/circulars/2008-09_tashsat_09.l4"
evidence = "`\"30 years and more\" reaches a 35-year teacher, the once-only reading does not`"
depends_on = ["F-2008-09_tashsat_09-c", "F-2008-09_tashsat_09-d"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
