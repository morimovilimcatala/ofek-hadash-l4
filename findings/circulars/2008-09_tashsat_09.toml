# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
# See findings/takanon/takanon-sherut-ovdei-horaa/1.7.toml for the fields.

[[finding]]
id = "F-2008-09_tashsat_09-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_i"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה (1/10 לכל חודש עבודה)"
title = "Part-time recuperation pay: in proportion to the position, or 1/10 for each month of work?"
body = """
Section 1ט entitles a part-time teaching employee to the allowance "in proportion to the part of his position that year", and the parenthesis that follows gives the proportion as "1/10 for each month of work". The sentence measures the position; the parenthesis measures months.

The two give different shares. A half-position teacher who worked all ten months of the school year takes half the allowance by the sentence and the whole of it by the parenthesis. The parenthesis also has no ceiling: an employee who works twelve months, at 1/10 a month, takes 12/10 of the allowance.
"""
reading = "Both measures apply: the share is the position fraction (no more than one position, section 1י) times the months of work at 1/10 each, the months share no more than a whole year."
l4 = "l4/circulars/2008-09_tashsat_09.l4"
evidence = "`the position and the months give different shares`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_09-b"
kind = "gap"
stage = "writing"
keys = ["art_1__para_f__subpara_1/p2", "art_1__para_a"]
quote = "\"שנת הבראה\" – תקופה של שנה (הכוונה לשנת לימודים המתחילה בתאריך 1/9/08 ומסתיימת בתאריך 31/8/09), שבעד כולה או בעד חלק ממנה משולמים דמי הבראה אשר מועד תשלומם חל בתקופה הקובעת"
title = "\"Recuperation year\" is defined as 2008/09 alone, though the determining period runs through 2010"
body = """
Section 1א makes the determining period 2009 and 2010. Section 1ו, for an employee who retires or dies during a recuperation year, defines "recuperation year" as a year for all or part of which recuperation pay falls due in the determining period — and then, in a parenthesis, as "the school year from 1.9.08 to 31.8.09".

The June 2010 payment is for school year 2009/10 and falls in the determining period, so the general words make 2009/10 a recuperation year and the parenthesis does not. For an employee who retires or dies during 2009/10, section 1ו's rule — the cut falls only on the part of the year before the retirement or death, and the part cut for the time after it is refunded within 60 days — applies by the one and not by the other.
"""
reading = "The definition's general words govern: a recuperation year is any school year for which a payment in the determining period is made, 2009/10 included; the parenthesis names the year this circular pays."
l4 = "l4/circulars/2008-09_tashsat_09.l4"
evidence = "`the June 2010 payment is in the determining period but its school year is outside the definition`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_09-c"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p4", "art_2__para_b"]
quote = "מענק היובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק היובל · עובד הוראה שהשלים 30 שנות עבודה בישראל ב- 1 ביוני של שנה נדונה … יזכה באותה שנה במענק יובל"
title = "The jubilee grant's 30 years: as set in the September before, or as completed by 1 June?"
body = """
Section 2 grants the jubilee grant "by the seniority set for the teaching employee in September of the year before the grant", the grant being paid with the June 2009 salary — so by the seniority set in September 2008. Its clarification 2ב grants it to an employee "who completed 30 years of work in Israel by 1 June of the year in question", that year.

The two dates are nine months apart. A teacher whose seniority set in September 2008 was 29 years and who completes 30 in March 2009 is not entitled under the first and is entitled under the second.
"""
reading = "The 30 years are counted as completed by 1 June of the year of the grant (section 2ב), the clarification naming the day; section 2's September seniority is read as the record they are counted from."
l4 = "l4/circulars/2008-09_tashsat_09.l4"
evidence = "`the September and the June dates give different answers`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_09-d"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p2", "art_2__para_b"]
quote = "בעל ותק מצטבר בהוראה של 30 שנה ומעלה כולל ותק שירות צבאי · שהשלים 30 שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה\"ל)"
title = "The jubilee grant's 30 years: of teaching, or of work in Israel?"
body = """
Section 2 entitles "a teaching employee with accumulated seniority in teaching of 30 years or more, military service included", at the employers, the owners and formal education. Its clarification 2ב entitles "a teaching employee who completed 30 years of work in Israel", compulsory IDF service included.

Seniority in teaching and years of work in Israel are different measures: years worked outside teaching count in the second and not in the first. A teacher with 25 years of teaching after six years of other work in Israel has 31 years by the clarification and 25 by the rule. The two clauses also count different service: "military service" against "compulsory service in the IDF".
"""
reading = "Section 2's own measure — accumulated teaching seniority, military service included, with section 2א's bought unpaid-leave years — read through 2ב only for the day by which it is completed."
l4 = "l4/circulars/2008-09_tashsat_09.l4"
evidence = "`teaching seniority and work in Israel give different answers`"
depends_on = ["F-2008-09_tashsat_09-c"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
