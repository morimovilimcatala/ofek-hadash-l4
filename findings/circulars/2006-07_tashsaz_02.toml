quote = "פרטים אלה יועברו ע\"י הבעלות לח\"מ."
title = "The yearly list goes to \"the undersigned\", and the circular is not signed"
body = """
Owning bodies that meet the criteria must transfer a yearly list of their principals employed above 150%, and the circular says it goes "to the undersigned" (לח"מ). The circular ends on that sentence: it carries no sign-off and no signature, so the recipient of the list it requires is not named anywhere in it. (The source PDF ends the same way; this is the text, not a lost line.)
"""
reading = "The list goes to the circular's issuer, the senior division for teaching personnel of the Ministry of Education, whose letterhead the circular carries."
l4 = "l4/circulars/2006-07_tashsaz_02.l4"
evidence = "`the list's recipient is a signatory the circular does not print`"
