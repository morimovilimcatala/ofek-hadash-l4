[[finding]]
id = "F-2006-07_tashsaz_02-a"
kind = "ambiguity"
stage = "writing"
keys = ["hc_1/p12"]
quote = "מנהלים שעבדו בהיקף משרה העולה על 150%משרה ב 3-השנים האחרונות שלפני חתימת הסכם היקפי משרה למנהלים מיום ( 5/12/2002 כלומר: הועסקו בהיקף חריג מעבר ל 150%-משרה מתאריך 1/9/1999 או קודם לכן)"
title = "\"The 3 years before 5.12.2002\" and its gloss \"from 1.9.1999 or earlier\" are different periods"
body = """
The first criterion for employing a secondary-school principal above 150% is having worked above 150% "in the last 3 years before the signing" of the principals' agreement of 5.12.2002. The circular glosses this ("כלומר") as employment above 150% "from 1.9.1999 or earlier".

Three years before 5.12.2002 is 5.12.1999, not 1.9.1999. A principal employed above 150% from a date between the two — 1.10.1999, say — worked above 150% throughout the three years before the signing and still did not start "on 1.9.1999 or earlier". The words and the gloss give that principal different answers; they agree only if "3 years" means three school years, which the text does not say.
"""
reading = "The gloss governs: employment above 150% must have begun on or before 1.9.1999, the date the circular itself writes down (three full school years before the school year of the signing)."
l4 = "l4/circulars/2006-07_tashsaz_02.l4"
evidence = "`the three-year words and their gloss disagree`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2006-07_tashsaz_02-b"
kind = "broken-reference"
stage = "writing"
