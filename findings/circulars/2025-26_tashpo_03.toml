[[finding]]
id = "F-2025-26_tashpo_03-a"
kind = "gap"
stage = "writing"
keys = ["art_1__para_a", "art_1__para_b", "art_2"]
quote = "ורק כאשר היקף השעות הפרונטאליות בהן הוא מלמד לא יפחת מ- 50% … ובכל מקרה לא פחות מ- 8 שעות · לא ניתן יהיה למנות עו\"ה לתפקיד רכז מקצוע שש שנתי"
title = "A teacher coordinating the subject in both divisions below the frontal-hours threshold: one, two or no allowances?"
body = """
§1 governs a six-year school whose subject justifies a coordinator in each division separately. §1א: where the principal appoints a coordinator in each division, "each coordinator" is entitled to the full allowance of his division. §1ב: where the same teacher teaches and coordinates in both divisions, "and only when" his frontal hours in both divisions together are at least 50% of the frontal hours in his position and at least 8, he is entitled to two allowances. §2 forbids a six-year coordinator in such a school.

For a teacher appointed coordinator in both divisions who teaches, say, 6 frontal hours in all, the text gives no answer. If §1א covers an appointment of the same teacher in each division, it pays him two full allowances with no condition, and §1ב's "only when" is empty; if §1א is about two different teachers, §1ב withholds both allowances and nothing in the circular says what he is paid — and §2 shuts the six-year alternative.
"""
reading = "§1א is read as the case of two different teachers; §1ב governs the same teacher, and below the threshold he is paid no coordination allowance under this circular."
l4 = "l4/circulars/2025-26_tashpo_03.l4"
evidence = "`1א read for the same teacher gives two full allowances where 1ב gives none`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2025-26_tashpo_03-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_4__para_b"]
quote = "בכל יתר המקצועות- 8%, בהתאם למספר המורים והשעות של המקצוע אשר תחת אחריותו."
title = "The six-year coordinator's 8% is tied to a count of teachers and hours that the circular never scales"
body = """
§4ב sets the six-year coordinator's allowance in every subject other than mathematics and English at 8%, "in accordance with the number of teachers and hours of the subject in his charge". The circular gives no table or threshold of teachers or hours, so the qualifier reads two ways: as a description of why the rate is 8% (a flat rate), or as a scale by which the 8% varies with the number of teachers and hours, which the circular does not supply.
"""
reading = "A flat 8% for every subject other than mathematics and English; the qualifier is read as a description."
l4 = "l4/circulars/2025-26_tashpo_03.l4"
evidence = "`4ב's rate depends on counts the circular does not scale`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
