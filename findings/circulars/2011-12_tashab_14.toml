quote = "יהיה זכאי למענק חד פעמי בגובה של ₪ 2,000 למשרה מלאה · במשרה חלקית ו/או רק בחלק משנת הלימודים … יהיה זכאי לחלק היחסי של הסכום האמור בהתאם לחלקיות משרתו"
title = "מענק 2,000 ₪ למורה המועסק מעל משרה מלאה: תעריף למשרה, או תקרה?"
body = """
סעיף 2(א) נותן לעובד הוראה שהועסק בחטיבה העליונה בתשע"ב מענק חד פעמי "בגובה של 2,000 ₪ למשרה מלאה", והפסקה השנייה שלו מחשבת את הסכום באופן יחסי למשרה חלקית ולחלק משנת הלימודים. הוא אינו אומר דבר על משרה מעל 100%, שעובד הוראה יכול להחזיק בה (חוזר תשע"ב/12 מתיר עד 140% אצל כלל המעסיקים מחוץ לרפורמה).

"2,000 ₪ למשרה מלאה" נקרא כתעריף למשרה — מורה ב־130% מקבל 2,600 ₪ — או כמענק של משרה מלאה, המרב שמישהו מקבל — 2,000 ₪. חוזרים אחרים מאותה שנה מגבילים במפורש את הקצובות שלהם למשרה מלאה אחת; חוזר זה אינו עושה כן.
"""
reading = "2,000 ₪ הם תעריף למשרה מלאה, המוחל על המשרה בחטיבה העליונה כפי שהיא, גם מעל 100%: החוזר מחשב באופן יחסי למשרה בלי לקבוע תקרה. הקריאה עם התקרה מקודדת לצדה."
