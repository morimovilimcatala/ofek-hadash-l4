quote = "יהיה זכאי למענק חד פעמי בגובה של ₪ 2,000 למשרה מלאה · במשרה חלקית ו/או רק בחלק משנת הלימודים … יהיה זכאי לחלק היחסי של הסכום האמור בהתאם לחלקיות משרתו"
title = "The 2,000 ₪ grant for a teacher employed above a full position: a rate per position, or a ceiling?"
body = """
Section 2(א) gives a teaching employee employed in the upper division in 2011/12 a one-time grant "of 2,000 ₪ for a full position", and its second paragraph pro-rates the amount for a PART position and part of the year. It says nothing of a position above 100%, which a teaching employee may hold (circular תשע"ב/12 allows up to 140% at all employers outside the reform).

"2,000 ₪ for a full position" reads as a rate per position — a teacher at 130% takes 2,600 ₪ — or as the grant of a full position, the most anyone takes — 2,000 ₪. Other circulars of the same year cap their allowances expressly at one full position; this one does not.
"""
reading = "2,000 ₪ is a rate per full position, applied to the upper-division position as it is, above 100% too: the circular pro-rates by the position without stating a cap. The capped reading is encoded beside it."
l4 = "l4/circulars/2011-12_tashab_14.l4"
evidence = "`the grant above a full position is read two ways`"
