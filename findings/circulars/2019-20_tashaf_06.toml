title = "מתי מותר לבצע הפחתה מהתמורה לאחר ערעור: \"תוך יומיים\" כמועד אחרון או כתקופת המתנה"
body = """
§6(ג) קובע מתי המכללה רשאית להפחית מהתמורה של עובד הוראה שהמנהל קבע לגביו שלא עמד בתנאי סעיף 3. כשאין ערעור, ההפחתה נעשית "לא פחות מחלוף 8 ימים" מהחלטת המנהל — יום מוקדם ביותר, המגן על חלון הערעור בן 7 הימים שב־§6(ב). לאחר ערעור, היא נעשית "תוך יומיים" מהחלטת הגורם המוסמך על הערעור.

"תוך יומיים" קובע בדרך כלל יום אחרון: ההפחתה חייבת להיעשות עד היום השני שלאחר ההחלטה בערעור, והפחתה שנעשתה מאוחר יותר נעשתה באיחור. בקריאה מקבילה למגבלה הראשונה, הוא קובע יום מוקדם ביותר: לא לפני שחלפו יומיים. שתי הקריאות נותנות תשובות הפוכות להפחתה שנעשתה, למשל, שלושה ימים לאחר ההחלטה בערעור — מותרת לפי האחת, באיחור לפי האחרת — והמשפט משתמש במבנה אחד לשתי מגבלות מסוג שונה.
"""
reading = "שתי המגבלות הן תקופות המתנה: אין הפחתה לפני היום ה־8 כשאין ערעור, או לפני שחלפו יומיים מהחלטת הגורם המוסמך על הערעור. זו הקריאה שבה סעיף־המשנה הוא כלל אחד המגן על העובד בשני הענפים; קריאת המועד האחרון נשמרת לצדה ב־L4 לשם השוואה."
