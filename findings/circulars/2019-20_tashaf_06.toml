# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2019-20_tashaf_06-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_6__para_c"]
quote = "תעשה לא פחות מחלוף 8 ימים מהחלטת המנהל, אם עובד ההוראה לא ערער, או תוך יומיים מהחלטת הגורם המוסמך על הערעור"
title = "When a pay reduction may follow an appeal: \"within two days\" as a deadline or a waiting period"
body = """
§6(ג) sets when the college may reduce the consideration of a teacher the director found did not meet §3. With no appeal, the reduction is made "not less than 8 days" after the director's decision — an earliest day, which protects the 7-day appeal window of §6(ב). After an appeal, it is made "within two days" (תוך יומיים) of the appeals body's decision.

"Within two days" ordinarily sets a LATEST day: the reduction must be made by the second day after the appeal decision, and one made later is out of time. Read in parallel with the first limit, it sets an EARLIEST day: not before two days have passed. The two readings give opposite answers for a reduction made, say, three days after the appeal decision — permitted under one, out of time under the other — and the sentence uses one construction for two limits of different kind.
"""
reading = "Both limits are waiting periods: no reduction before day 8 without an appeal, or before two days after the appeals body's decision. It is the reading under which the clause is one rule protecting the employee in both branches; the deadline reading is kept beside it in the L4 for comparison."
l4 = "l4/circulars/2019-20_tashaf_06.l4"
evidence = "`§6(ג)'s two limits read two ways for an appeal`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2019-20_tashaf_06-b"
kind = "undefined-term"
stage = "writing"
keys = ["art_5/p1", "art_6__para_a", "art_6__para_b", "art_6__para_c"]
quote = "ידווח למנהל · אשר המנהל יקבע לגביו · החלטת המנהל"
title = "\"The director\" who receives reports and decides on pay reductions is never identified"
body = """
§5 requires each teacher to report every prevented duty "to the director" (למנהל); §6(א) lets "the director" determine that a teacher did not meet §3, which costs the teacher pay; §6(ב)–(ג) run the appeal and the reduction from "the director's decision". The circular reproduces these clauses of the agreement of 31.3.2020 without its definitions, and nowhere says who "the director" is — the head of the college, an academic head of the teacher's unit, or another officer.

The identity matters because the decision is the one that reduces pay, and §6(ב) names other college officers (the rector, the vice-president for human resources) only as examples of the appeals body — so the director is not one of them by default.
"""
reading = "\"The director\" is the head of the college (the institution's director), the officer the institution acts through in §6(א). The agreement itself, enclosed with the circular but not part of its text, may define the term."
l4 = "l4/circulars/2019-20_tashaf_06.l4"
evidence = "`\"the director\" is used in sections 5 and 6 and defined nowhere`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
