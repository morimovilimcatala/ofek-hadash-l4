title = "\"המנהל\", שאליו מדווחים ושמחליט על הפחתות מהתמורה, אינו מזוהה בשום מקום"
body = """
§5 מחייב כל עובד הוראה לדווח "למנהל" על כל חובה שנמנע ממנו לבצע; §6(א) מאפשר ל"מנהל" לקבוע שעובד הוראה לא עמד בתנאי סעיף 3, דבר שעולה לעובד בשכרו; §6(ב)–(ג) מפעילים את הערעור ואת ההפחתה מכוח "החלטת המנהל". החוזר משחזר את סעיפי־המשנה האלה מההסכם מיום 31.3.2020 בלי ההגדרות שלו, ואינו אומר בשום מקום מי הוא "המנהל" — ראש המכללה, ראש אקדמי של היחידה של עובד ההוראה, או בעל תפקיד אחר.

הזהות חשובה, כי זו ההחלטה שמפחיתה את השכר, ו־§6(ב) מזכיר בעלי תפקידים אחרים במכללה (רקטור, סמנכ"ל משאבי אנוש) רק כדוגמאות לגורם שדן בערעור — כך שהמנהל אינו אחד מהם כברירת מחדל.
"""
