quote = "חלקיות העסקה האמורה בסעיף זה הינה חלקיות ההעסקה המזכה במענק ההתמדה · ישולם לעובד על-פי חלקיות משרתו (המשוקללת)"
title = "האם המענק יחסי לכל המשרה, או לחלק שבו מלמדים מקצוע נדרש?"
body = """
§3א.1 דורש שעובד ההוראה ילמד בפועל אחד מהמקצועות הנדרשים שבנספח א'. §4ו מחשב את המענק של 4,000 ש"ח יחסית לחלקיות משרתו (המשוקללת) של העובד, ו־§4ד אומר שהחלקיות שהכוונה אליה היא "חלקיות ההעסקה המזכה במענק" בכלל בתי הספר של העובד.

"ההעסקה המזכה במענק" נקראת בשתי דרכים: כל משרתו של העובד (העובד זכאי, ולכן כל ההעסקה מזכה), או רק השעות שבהן הוא מלמד מקצוע נדרש (רק הן מזכות). התוצאות שונות לכל עובד המלמד גם מקצועות אחרים: במשרה מלאה שרבע ממנה במתמטיקה, 4,000 ש"ח לפי הקריאה הראשונה ו־1,000 לפי השנייה.
"""
reading = "כל המשרה נמנית (\"חלקיות משרתו\" של §4ו): §3א.1 עושה את הוראת מקצוע נדרש לתנאי לזכאות, לא למידה של הסכום. ההעסקה \"המזכה\" של §4ד נקראת כהעסקה בבתי הספר שבהם העובד עומד בתנאים (`F-2016-17_tashaz_08-a`)."
