severity_why = "מענק ההתמדה יחסי לכל המשרה או רק לשעות המקצוע הנדרש, והקריאות נבדלות לכל מורה שמלמד גם מקצועות אחרים; המוסכמה `reading.condition` מכריעה בקריאה."
