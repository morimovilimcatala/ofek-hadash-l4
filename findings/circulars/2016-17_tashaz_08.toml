# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2016-17_tashaz_08-a"
kind = "gap"
stage = "writing"
keys = ["art_3__para_a__subpara_2__cls_a", "art_3__para_a__subpara_2__cls_b", "art_4__para_4__subpara_d"]
quote = "עובד הוראה המועסק בבית ספר רשמי או בחטיבה העליונה 25: שנות ותק · עובד הוראה המועסק בבית ספר מוכר שאינו רשמי, יסודי או חטיבת ביניים 30: שנות ותק"
title = "The seniority threshold for an employee in both an official and a recognised unofficial school is not decided"
body = """
§3a.2 sets the seniority the grant requires by the school the employee is employed in: 25 years in an official school or an upper division, 30 in a recognised unofficial primary school or middle division. §4d then counts the employment "in all the schools the employee is employed in", so the circular expects employees in more than one school.

For an employee in an official school AND a recognised unofficial primary school, with 26 to 29 years, the first clause is met and the second is not, and the circular does not say which governs: whether the employee is entitled at all, and if so on which part of the position.
"""
reading = "Each employment is tested against its own school's threshold, and only the qualifying employment counts towards the grant (§4d's \"employment entitling to the grant\"): the employee above is entitled on the official school's part of the position only."
l4 = "l4/circulars/2016-17_tashaz_08.l4"
evidence = "`section 3a.2 gives an employee in both kinds of school two thresholds`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2016-17_tashaz_08-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_3__para_a__subpara_1", "art_4__para_4__subpara_d", "art_4__para_4__subpara_f"]
quote = "חלקיות העסקה האמורה בסעיף זה הינה חלקיות ההעסקה המזכה במענק ההתמדה · ישולם לעובד על-פי חלקיות משרתו )המשוקללת("
title = "Is the grant pro-rated by the whole position, or by the part teaching a required subject?"
body = """
§3a.1 requires that the employee teach one of annex A's required subjects in practice. §4f pro-rates the 4,000 shekel grant by the employee's (weighted) position fraction, and §4d says the fraction meant is "the employment that entitles to the grant" in all the employee's schools.

"The employment that entitles to the grant" reads two ways: the employee's whole position (the employee is entitled, so all of the employment is entitling), or only the hours teaching a required subject (only those entitle). The results differ for any employee who teaches other subjects too: on a full position with a quarter of it in mathematics, 4,000 shekels under the first reading and 1,000 under the second.
"""
reading = "The whole position counts (§4f's \"חלקיות משרתו\"): §3a.1 makes teaching a required subject a condition of entitlement, not a measure of the amount. §4d's \"entitling\" employment is read as the employment in the schools where the employee qualifies (F-2016-17_tashaz_08-a)."
l4 = "l4/circulars/2016-17_tashaz_08.l4"
evidence = "`the two readings of the position give different grants`"
depends_on = ["F-2016-17_tashaz_08-a"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
