[[finding]]
id = "F-2012-13_tashag_01-a"
kind = "overlap"
stage = "writing"
keys = ["art_3/p6", "art_3/p7"]
quote = "פרישה/עזיבה מתאריך 10.10.2011 עד – 20.12.2011 יקוזזו 3 ימים. · פרישה/עזיבה מתאריך 20.12.2011 עד – 29.03.2012 יקוזזו 4 ימים."
title = "A teacher who left on 20.12.2011 is offset 3 vacation days and 4"
body = """
Section 3 sets the number of extra vacation days to offset from a teacher who left or retired, by the date of leaving, in four rows. The second row runs "from 10.10.2011 to 20.12.2011" (3 days) and the third "from 20.12.2011 to 29.03.2012" (4 days), so 20.12.2011 is in both. The other rows meet without overlap (9.10 and 10.10; 29.03 and 30.03).

A teacher who left on 20.12.2011 is offset 3 days by one row and 4 by the next: one day's salary at the August rate apart.
"""
reading = "The row that opens on a day governs it: a teacher who left on 20.12.2011 is offset 4 days, the second row being read as ending on 19.12.2011, as the other rows end the day before the next begins."
l4 = "l4/circulars/2012-13_tashag_01.l4"
evidence = "`leaving on 20.12.2011 is given 3 days and 4`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2012-13_tashag_01-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_3", "art_3/p2", "art_3/p4", "art_3/p5", "art_3/p6", "art_3/p7", "art_3/p8"]
quote = "מורים שעזבו/פרשו בסוף שנה\"ל תשע\"ב · פרישה/עזיבה מתאריך 01.09.2011 עד – 9.10.2011 … פרישה/עזיבה מתאריך 10.10.2011 עד – 20.12.2011 יקוזזו 3 ימים"
title = "The vacation offset is headed for teachers who left at the end of 2011/12, and its table prices leaving in mid-year"
body = """
Section 3 is headed "teachers who left/retired at the END of school year 2011/12": their August salary is paid in full and the extra vacation days they received in 2011/12 are offset at the August rate. Its table then sets the days to offset by the date of leaving from 1.9.2011 onwards, and three of its four rows end in October, December and March — dates no end-of-year leaver has.

Read by its heading, the section reaches only teachers who left at the end of the year, all of whom fall in the last row (5 days), and a teacher who left in November 2011 is not offset under it at all. Read by its table, that teacher is offset 3 days.
"""
reading = "The table governs: the offset applies to every teacher who left or retired from 2011/12, by the date of leaving, and the heading is read as naming the case the circular was written for."
l4 = "l4/circulars/2012-13_tashag_01.l4"
evidence = "`three of the four rows end before the year does`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
