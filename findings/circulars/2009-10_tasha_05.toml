kind = "gap"
stage = "writing"
keys = ["art_a__para_2", "art_a__para_4"]
quote = "עובד בדירוג עובדי הוראה, זכאי לקצובת ביגוד · 1,406 1-25 שנים"
title = "למורה בשנת ההוראה הראשונה אין שורה אם הוותק מונה שנים שהושלמו"
body = """
סעיף א.2 מזכה כל עובד בדירוג עובדי הוראה בקצובת ביגוד, וסעיף א.3 קובע שהסכום תלוי בוותק. הטבלה שבסעיף א.4 נפתחת ב"1-25 שנים" ואינה אומרת כיצד נמנה הוותק בהוראה.

אם הוותק הוא מספר השנים שהושלמו, למורה בשנה הראשונה יש ותק 0, ששום שורה אינה מכסה: זכאות לפי א.2 בלי סכום לפי א.4.
"""
reading = "השנה שבה העובד משרת נמנית, ולכן מורה בשנה הראשונה נמצא בשנה 1 ומקבל את שורת \"1-25 שנים\" (1,406 ₪). זו הקריאה שבה הזכאות שבסעיף א.2 והטבלה מתיישבות."
l4 = "l4/circulars/2009-10_tasha_05.l4"
evidence = "`a first-year employee has no row if seniority counts completed years`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2009-10_tasha_05-b"
kind = "overlap"
stage = "writing"
keys = ["art_b/p2", "art_b/p3", "art_b/p4"]
quote = "0 עד 0.3 משרה · 242 מ 0.3 -משרה עד 0.5 משרה · 481 מ 0.5-משרה ומעלה"
title = "טבלת החינוך הגופני נותנת ל־0.3 ול־0.5 משרה שני סכומים כל אחד"
body = """
סעיף ב מתמחר את קצובת הביגוד הנוספת למורה לחינוך גופני בשלוש מדרגות של שיעור העסקה: עד 0.3 (0), מ־0.3 עד 0.5 (242 ₪), ומ־0.5 ומעלה (481 ₪). כל גבול כתוב כך שהוא כלול משני צדדיו: 0.3 הוא גם "עד 0.3" וגם "מ-0.3", ו־0.5 הוא גם "עד 0.5" וגם "מ-0.5".

מורה המועסק בדיוק ב־0.3 מקבל 0 וגם 242; מורה בדיוק ב־0.5, משרה נפוצה, מקבל 242 וגם 481. כל שיעור אחר מקבל שורה אחת.
"""
reading = "המדרגה הנפתחת בגבול היא הקובעת לגביו (\"מ-X\" כולל את X): 0.3 מקבל 242 ₪ ו־0.5 מקבל 481 ₪, וכל \"עד\" נקרא כעד פתיחת המדרגה הבאה ולא עד בכלל."
l4 = "l4/circulars/2009-10_tasha_05.l4"
evidence = "`the physical-education table gives 0.3 and 0.5 two amounts each`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2009-10_tasha_05-c"
kind = "ambiguity"
stage = "writing"
keys = ["art_b", "art_b/p1"]
quote = "קצובת ביגוד נוספת למורה לחינוך גופני · שיעור העסקה"
title = "\"שיעור העסקה\" שבטבלת החינוך הגופני: של המשרה בחינוך גופני, או של המשרה כולה?"
body = """
סעיף ב מעניק קצובת ביגוד נוספת "למורה לחינוך גופני" לפי "שיעור העסקה", בלי לומר של מה: חלק המשרה המוקדש להוראת חינוך גופני, או המשרה כולה של העובד.

הקריאות נבדלות לגבי כל מורה המלמד חינוך גופני בחלק ממשרה גדולה יותר: מורה במשרה מלאה עם חמישית משרה בחינוך גופני מקבל 0 לפי הראשונה ו־481 ₪ לפי השנייה.
"""
reading = "שיעור ההעסקה הוא חלק המשרה בחינוך גופני, העבודה שבעדה ניתנת הקצובה הנוספת. הוא קלט של הקידוד, כך שאפשר להריץ כל אחת מהקריאות."
l4 = "l4/circulars/2009-10_tasha_05.l4"
evidence = "`the two readings of the employment rate differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

