# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
# See findings/takanon/takanon-sherut-ovdei-horaa/1.7.toml for the fields.

[[finding]]
id = "F-2009-10_tasha_05-a"
kind = "gap"
stage = "writing"
keys = ["art_a__para_2", "art_a__para_4"]
quote = "עובד בדירוג עובדי הוראה, זכאי לקצובת ביגוד · 1,406 1-25 שנים"
title = "A teacher in the first year of teaching has no row if seniority counts completed years"
body = """
Section א.2 entitles every employee in the teaching-staff grade to the clothing allowance, and section א.3 makes the amount depend on seniority. Section א.4's table opens at "1-25 שנים" and does not say how seniority in teaching is counted.

If seniority is the number of COMPLETED years, a teacher in the first year has seniority 0, which no row covers: an entitlement under א.2 with no amount under א.4.
"""
reading = "The year being served counts, so a teacher in the first year is in year 1 and takes the 1-25 row (1,406 ₪). It is the reading under which section א.2's entitlement and the table agree."
l4 = "l4/circulars/2009-10_tasha_05.l4"
evidence = "`a first-year employee has no row if seniority counts completed years`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2009-10_tasha_05-b"
kind = "overlap"
stage = "writing"
keys = ["art_b/p2", "art_b/p3", "art_b/p4"]
quote = "0 עד 0.3 משרה · 242 מ 0.3 -משרה עד 0.5 משרה · 481 מ 0.5-משרה ומעלה"
title = "The physical-education table gives 0.3 and 0.5 of a position two amounts each"
body = """
Section ב prices the extra clothing allowance for a physical-education teacher in three bands of employment rate: up to 0.3 (0), from 0.3 to 0.5 (242 ₪), and from 0.5 up (481 ₪). Every bound is written inclusively on both sides: 0.3 is both "עד 0.3" and "מ-0.3", and 0.5 is both "עד 0.5" and "מ-0.5".

A teacher employed at exactly 0.3 is given 0 and 242; one at exactly 0.5, a common position, is given 242 and 481. Every other rate gets one row.
"""
reading = "The band that opens at a bound governs it (\"מ-X\" includes X): 0.3 takes 242 ₪ and 0.5 takes 481 ₪, reading each \"עד\" as up to but not including the next band's opening."
l4 = "l4/circulars/2009-10_tasha_05.l4"
evidence = "`the physical-education table gives 0.3 and 0.5 two amounts each`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2009-10_tasha_05-c"
kind = "ambiguity"
stage = "writing"
keys = ["art_b", "art_b/p1"]
quote = "קצובת ביגוד נוספת למורה לחינוך גופני · שיעור העסקה"
title = "The physical-education table's \"employment rate\": of the position in physical education, or of the whole position?"
body = """
Section ב grants an extra clothing allowance "to a physical-education teacher" by "שיעור העסקה", the employment rate, without saying whose: the share of the position spent teaching physical education, or the employee's whole position.

The readings differ for any teacher who teaches physical education in part of a larger position: a full-position teacher with a fifth of a position in physical education takes 0 under the first and 481 ₪ under the second.
"""
reading = "The employment rate is the share of the position in physical education, the work the extra allowance is for. It is an input of the encoding, so either reading can be run."
l4 = "l4/circulars/2009-10_tasha_05.l4"
evidence = "`the two readings of the employment rate differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2009-10_tasha_05-d"
kind = "gap"
stage = "writing"
keys = ["art_c__para_1__subpara_a", "art_c__para_1__subpara_b"]
quote = "יהיה זכאי לקבל שני חלוקים לשנה · ערך זוג נעליים ושני חלוקים: 514 ₪"
title = "Two robes are granted to the second technological list, and no value is given for them"
body = """
Section ג.1א grants a pair of shoes and two robes a year to the teachers of its thirteen professions and prints their value, 514 ₪. Section ג.1ב grants two robes a year to the teachers of its thirteen professions and prints no value at all: the list ends and section ג.2 follows.

Section ג.3 pro-rates "the clothing allowance" by position, so the grant is paid as money, and the circular does not say how much it is for a teacher on the second list. The omission is on the page, not only in the corpus.
"""
reading = "The value of two robes is an input of the encoding, set by whoever prices it (the Treasury's instructions the preamble cites); it is pro-rated by position like the rest of section ג."
l4 = "l4/circulars/2009-10_tasha_05.l4"
evidence = "`section ג.1ב's grant has no printed value`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
