[[finding]]
id = "F-2009-10_tasha_05-d"
kind = "gap"
stage = "writing"
keys = ["art_c__para_1__subpara_a", "art_c__para_1__subpara_b"]
quote = "יהיה זכאי לקבל שני חלוקים לשנה · ערך זוג נעליים ושני חלוקים: 514 ₪"
title = "לרשימה הטכנולוגית השנייה מוענקים שני חלוקים, ולא ניתן להם ערך"
body = """
סעיף ג.1א מעניק זוג נעליים ושני חלוקים לשנה למורי שלושה־עשר המקצועות שבו, ומדפיס את ערכם, 514 ₪. סעיף ג.1ב מעניק שני חלוקים לשנה למורי שלושה־עשר המקצועות שבו, ואינו מדפיס ערך כלל: הרשימה מסתיימת ואחריה בא סעיף ג.2.

סעיף ג.3 מחשב את "קצובת הביגוד" באופן יחסי להיקף המשרה, כך שהמענק משולם בכסף, והחוזר אינו אומר כמה הוא למורה ברשימה השנייה. ההשמטה היא בדף עצמו, לא רק בקורפוס.
"""
reading = "ערכם של שני חלוקים הוא קלט של הקידוד, שנקבע על ידי מי שמתמחר אותו (הוראות משרד האוצר שהפתיח מפנה אליהן); הוא מחושב באופן יחסי להיקף המשרה כמו שאר סעיף ג."
l4 = "l4/circulars/2009-10_tasha_05.l4"
evidence = "`section ג.1ב's grant has no printed value`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2009-10_tasha_05-e"
kind = "overlap"
stage = "verification"
keys = ["art_c__para_1__subpara_a", "art_c__para_1__subpara_b"]
quote = "באחד המקצועות המפורטים להלן, יהיה זכאי לקבל מדי שנה זוג נעליים ושני חלוקים · באחד המקצועות המפורטים להלן יהיה זכאי לקבל שני חלוקים לשנה"
title = "עובד הוראה המלמד מקצועות משתי הרשימות זכאי לשני הענקים, והחוזר אינו אומר אם הם מצטברים"
body = """
עובד הוראה בחינוך הטכנולוגי באחד ממקצועות ג.1א זכאי לזוג נעליים ושני חלוקים; באחד ממקצועות ג.1ב — לשני חלוקים. אין מקצוע המופיע בשתי הרשימות, אך עובד הוראה יכול ללמד יותר ממקצוע אחד, למשל מכטרוניקה ומערכות אלקטרוניות, ואז שני הסעיפים חלים עליו.

הבדיקה על פני כל מקצוע בכל רשימה, ללא מקצוע, ומקצוע אחד מכל רשימה, מראה שהקריאות נבדלות בדיוק לגבי עובד הוראה בשתי הרשימות: אם הענקים מצטברים, הוא מקבל נעליים וארבעה חלוקים (514 ₪ ועוד ערכם של שני חלוקים, שהחוזר אינו מדפיס); אם הגדול מביניהם, הכולל את שני החלוקים, מספיק — 514 ₪. החוזר אינו אומר איזו מהן.

אותן הוראות מודפסות בתשעה חוזרי קצובת ביגוד מתשס"ז עד תשע"ד, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-e (תשס"ז/7), F-2007-08_tashsach_06-d (תשס"ח/6), F-2008-09_tashsat_10-e (תשס"ט/10), F-2009-10_tasha_05-e (תש"ע/5), F-2010-11_tashaa_03-f (תשע"א/3), F-2011-12_tashab_13-c (תשע"ב/13), F-2012-13_tashag_08-c (תשע"ג/8), F-2012-13_tashag_09-c (תשע"ג/9) ו־F-2013-14_tashad_08-d (תשע"ד/8).
"""
reading = "עובד כזה מקבל את הענק הגדול, זוג נעליים ושני חלוקים: שני החלוקים של ג.1ב כלולים בו."
l4 = "l4/circulars/2009-10_tasha_05.l4"
evidence = "`a teacher on both technological lists meets two grants`"
depends_on = ["F-2009-10_tasha_05-d"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2009-10_tasha_05-f"
kind = "gap"
stage = "verification"
keys = ["art_a__para_1", "art_b", "art_c/p1"]
quote = "א. קצובת ביגוד – כללי · 1. יש לשלמה במלואה במשכורת חודש יולי .2010"
title = "רק סעיף א, שכותרתו \"כללי\", אומר מתי משולמת הקצובה; לתוספות של החינוך הגופני והחינוך הטכנולוגי אין חודש"
body = """
סעיף א, שכותרתו "קצובת ביגוד – כללי", אומר שהקצובה משולמת במלואה במשכורת חודש יולי 2010. סעיפים ב (קצובת הביגוד הנוספת למורה לחינוך גופני) ו־ג (קצובת הביגוד בחינוך הטכנולוגי) אינם נוקבים בחודש תשלום.

"כללי" נקרא בשתי דרכים: כהוראות הכלליות של החוזר כולו, כך שיולי חל גם על התוספות; או כקצובה הכללית, להבדיל מהקצובות הנוספות — הקריאה שסעיף ג.3 תומך בה, שכן הוא חוזר לגבי הקצובה שלו על החישוב היחסי שסעיף א.5 כבר קובע. לפי הקריאה השנייה, לתוספות אין מועד תשלום כלל.

אותה שאלה עולה בתשעה חוזרי קצובת ביגוד מתשס"ז עד תשע"ד, והיא נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-f (תשס"ז/7), F-2007-08_tashsach_06-e (תשס"ח/6), F-2008-09_tashsat_10-f (תשס"ט/10), F-2009-10_tasha_05-f (תש"ע/5), F-2010-11_tashaa_03-e (תשע"א/3), F-2011-12_tashab_13-d (תשע"ב/13), F-2012-13_tashag_08-e (תשע"ג/8), F-2012-13_tashag_09-e (תשע"ג/9) ו־F-2013-14_tashad_08-f (תשע"ד/8).
"""
reading = "התשלום ביולי שבסעיף א.1 חל על כל הקצובה שמעסיק אחד חב, ובכלל זה התוספות לפי סעיפים ב ו־ג."
l4 = "l4/circulars/2009-10_tasha_05.l4"
evidence = "`sections ב and ג name no month of payment`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
