[[finding]]
id = "F-2019-20_tashaf_10-a"
kind = "gap"
stage = "writing"
keys = ["hc_1/p144", "hc_1/p134", "hc_1/p140"]
quote = "קיימים תחומי דעת אשר החלוקה בין הבחינה החיצונית לבחינה הבית ספרית שונה מ( 30% -70% -בהתאמה). במקצועות אלו, גם גמול הבגרות יתחלק … בהתאמה לחלוקה באותו תחום דעת(. לדוגמה: סינית, גרמנית, עולם הערבים והאסלאם, מדעי החברה)"
title = "Electives that split otherwise than 70/30 are named only by example, and their split is not printed"
body = """
The last table gives "all other elective subjects" (כל יתר מקצועות הבחירה) one row: 2.45 weekly hours and 1.4% to the external examination and 1.05 hours and 0.6% to the school-based assessment — a 70/30 division. The closing note then says that in some fields the examination divides otherwise, that in those the reward divides "in accordance with the division in that field", and names them only "for example": Chinese, German, the Arab world and Islam, social sciences.

Those subjects are electives, so the table's row reaches them and gives them 70/30, while the note says they divide otherwise. The circular prints neither their divisions nor a closed list of the fields concerned, so for any elective a reader cannot tell from the circular whether the 70/30 row or an unprinted field-specific division applies, nor what that division is.
"""
reading = "The field's own division governs for the subjects the note names and for any other field whose examination is divided otherwise (an input of the encoding); the 70/30 row applies to every other elective."
l4 = "l4/circulars/2019-20_tashaf_10.l4"
evidence = "`a field p144 names as dividing otherwise falls in the table's 70% row`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

