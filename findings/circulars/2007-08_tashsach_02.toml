כותרת החוזר ושורת הנדון שלו מכנות אותו תשלום בגין שחיקה לשנים 1999–2001, ודברי הפתיחה שלו מתארים את המחלוקת שהועברה לבוררות כנוגעת לתקופה שמ־1.1.1999. הכלל שהוא קובע לאחר מכן, §1.1, משלם את המענק בעד חודשים שבהם עבדו בפועל במהלך "התקופה" 1.1.2000–31.12.2002, וההערה שלו אומרת במפורש שזו התקופה, ומתקנת את חוזר תשס"ז/4, שהדפיס 1.1.1999–31.12.2001.

