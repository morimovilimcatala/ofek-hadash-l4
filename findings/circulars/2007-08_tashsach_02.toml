severity_why = "ההצמדה לפני או אחרי ניכוי המקדמה נבדלת בשקלים בודדים לחודש, והמונח המוגדר מכריע."
keys = ["art_1__para_1-1__subpara_1", "art_1__para_1-2"]
quote = "בשיעור של 3.5% מהמשכורת הקובעת לכל חודש בניכוי המקדמה בשיעור של 0.5% ששולמה בגין חודשים אלו · בתוספת הפרשי הצמדה"
title = "האם הפרשי ההצמדה מתווספים לפני ניכוי המקדמה או אחריו?"
body = """
§1.1 קובע את המענק לכל חודש כ־3.5% מהמשכורת הקובעת בניכוי המקדמה של 0.5% ששולמה כבר בגין אותו חודש. §1.2 מוסיף "הפרשי הצמדה", והטבלה המצורפת נותנת מקדם לכל חודש (מדד ספטמבר 2007 חלקי מדד החודש). החוזר אינו אומר מה המקדם מכפיל: את מענק החודש לאחר ניכוי המקדמה, או את ה־3.5% לפני המקדמה — שכן המקדמה שולמה בכסף של מועד מאוחר מהחודש שבגינו שולמה.

השניים נותנים סכומים שונים לכל חודש: לחודש ינואר 2000, במשכורת קובעת של 10,000 ומקדמה של 50, האחד נותן (350 − 50) × 1.127 = 338.10 והשני 350 × 1.127 − 50 = 344.45.
"""
