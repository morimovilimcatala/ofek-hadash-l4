# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2007-08_tashsach_02-a"
kind = "contradiction"
stage = "writing"
keys = ["preamble/p5", "preamble/p10", "preamble/p11", "art_1__para_1-1", "art_1__para_1-6/p4"]
quote = "תשלום בגין שחיקה לעובדי הוראה לשנים 2001- 1999 · לתקופה שתחילתה ב, 1.1.99 · עבדו בפועל במהלך התקופה 1.1.00 -31.12.2002"
title = "The grant is \"for the years 1999–2001\" and its period is 1.1.2000–31.12.2002"
body = """
The circular's title and subject line call it the payment for erosion "for the years 1999–2001", and its recital describes the arbitrated dispute as concerning the period from 1.1.1999. The rule it then sets, §1.1, pays the grant for months worked in "the period" 1.1.2000–31.12.2002, and its note says expressly that this is the period, correcting circular תשס"ז/4, which had printed 1.1.1999–31.12.2001.

The two periods share only 2000 and 2001. A month of 1999 is inside the period the title names and outside the one the rule sets; a month of 2002 is the other way round. The instrument says in its heading that it pays for one span of years and in its body that it pays for another.
"""
reading = "§1.1's period governs — 1.1.2000 to 31.12.2002 — as the circular's own note says; the title and recital are read as naming the award, not the period paid."
l4 = "l4/circulars/2007-08_tashsach_02.l4"
evidence = "`the title's years and the period's years differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2007-08_tashsach_02-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_1-1__subpara_1", "art_1__para_1-2"]
quote = "בשיעור של 3.5%מהמשכורת הקובעת לכל חודש בניכוי המקדמה בשיעור של 0.5%ששולמה בגין חודשים אלו · בתוספת הפרשי הצמדה"
title = "Are the linkage differences added before or after the advance is deducted?"
body = """
§1.1 sets the grant for each month at 3.5% of the determining salary less the 0.5% advance already paid for that month. §1.2 adds "linkage differences", and the attached table gives a coefficient for each month (the September 2007 index over the month's index). The circular does not say what the coefficient multiplies: the month's grant net of the advance, or the 3.5% before the advance — the advance having been paid in money of a later date than the month it was paid for.

The two give different amounts for every month: for a month of January 2000 at a determining salary of 10,000 and an advance of 50, one gives (350 − 50) × 1.127 = 338.10 and the other 350 × 1.127 − 50 = 344.45.
"""
reading = "The coefficient links the month's grant as §1.1 defines it, that is net of the advance: §1.2 adds the linkage to \"the one-time grant\", which §1.1 has already defined after deducting the advance."
l4 = "l4/circulars/2007-08_tashsach_02.l4"
evidence = "`linking before or after the advance differs`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
