[[finding]]
id = "F-2011-12_tashab_02-a"
kind = "broken-reference"
stage = "writing"
keys = ["art_5__para_c__subpara_3", "art_5__para_b", "art_5__para_c"]
quote = "ככל ששולם לעובד הוראה כאמור בסעיף (2ב) לעיל תוספת שקלית אישית במשכורת חודש דצמבר 2010"
title = "The personal shekel addition is raised for \"a teaching employee as said in section 2ב\", which describes no employee"
body = """
Section 2ג(3) raises by 2.25% the personal shekel addition paid in December 2010 "to a teaching employee as said in section 2ב above". Section 2ב describes no employee: it says that tosefet Oz LaTmura, the 2011 erosion addition and the promotion-grade addition are new additions paid under the agreement of 14.8.2011.

The employees this circular describes are in section 2א (the upper division, and middle schools not yet under Ofek Hadash) and section 2ג (middle schools under Ofek Hadash). Read by its words, section 2ג(3) raises no one's addition; read by where it stands, it raises the addition of section 2ג's employee; read as a slip for 2א, it raises the addition of the other population.
"""
reading = "The reference is to the employee of section 2ג, the paragraph section 2ג(3) belongs to, whose agreement of 25.12.2008 it names: an Ofek Hadash middle-school employee's personal shekel addition rises 2.25% from 1.1.2011."
l4 = "l4/circulars/2011-12_tashab_02.l4"
evidence = "`section 2ג(3) cites a section that describes no employee`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
