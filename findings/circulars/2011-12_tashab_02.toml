title = "תוספת הסכם '87: 167.75 ₪ הם 2.25% מעל 164.06 ₪, וחוזר תש\"ע/2 קבע 164.07 ₪"
body = """
סעיף 2א(5) מעדכן את תוספת הסכם '87 ב־2.25% ביחס לערכה ביום 31.12.2010, ומדפיס את התוצאה: 167.75 ₪. חוזר תש"ע/2 קבע את אותה תוספת, ממשכורת דצמבר 2009, על 164.07 ₪.

164.07 ₪ בתוספת 2.25%, מעוגל לאגורה, הם 167.76 ₪; הסכום המודפס מתקבל רק מערך של 164.06 ₪. אף חוזר בקורפוס אינו משנה את התוספת בין דצמבר 2009 לסוף 2010, ולכן שני החוזרים מדפיסים סכומים שונים לאותה תוספת. הממצא נרשם גם בחוזר תש"ע/2, כ־F-2009-10_tasha_02-b.
"""
reading = "כל חוזר נקרא במילותיו: כאן התוספת היא 167.75 ₪, הסכום שהסעיף מדפיס."
