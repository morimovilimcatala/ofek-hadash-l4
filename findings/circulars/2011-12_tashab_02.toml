title = "התוספת השקלית האישית מועלית ל\"עובד הוראה כאמור בסעיף 2ב\", שאינו מתאר שום עובד"
body = """
סעיף 2ג(3) מעלה ב־2.25% את התוספת השקלית האישית ששולמה במשכורת חודש דצמבר 2010 "לעובד הוראה כאמור בסעיף (2ב) לעיל". סעיף 2ב אינו מתאר שום עובד: הוא אומר שתוספת עוז לתמורה, תוספת שחיקה 2011 ותוספת דרגת קידום הן תוספות שכר חדשות המשולמות לפי ההסכם מיום 14.8.2011.

העובדים שחוזר זה מתאר נמצאים בסעיף 2א (החטיבה העליונה, וחטיבות ביניים שטרם עברו לאופק חדש) ובסעיף 2ג (חטיבות ביניים שעברו לאופק חדש). בקריאה כלשונו, סעיף 2ג(3) אינו מעלה את התוספת של איש; בקריאה לפי מקומו, הוא מעלה את התוספת של העובד שבסעיף 2ג; בקריאה כטעות סופר במקום 2א, הוא מעלה את התוספת של האוכלוסייה האחרת.
"""
reading = "ההפניה היא לעובד שבסעיף 2ג, הסעיף שסעיף 2ג(3) שייך לו, שאת ההסכם שלו מיום 25.12.2008 הוא נוקב: התוספת השקלית האישית של עובד בחטיבת ביניים באופק חדש עולה ב־2.25% מ־1.1.2011."
