העובדים שחוזר זה מתאר נמצאים בסעיף 2א (החטיבה העליונה, וחטיבות ביניים שטרם עברו לאופק חדש) ובסעיף 2ג (חטיבות ביניים שעברו לאופק חדש). בקריאה כלשונו, סעיף 2ג(3) אינו מעלה את התוספת של איש; בקריאה לפי מקומו, הוא מעלה את התוספת של העובד שבסעיף 2ג; בקריאה כטעות סופר במקום 2א, הוא מעלה את התוספת של האוכלוסייה האחרת.
"""
