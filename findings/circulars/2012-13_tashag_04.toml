quote = "החל ביום 1.1.2013 ועד ל 30.6.2013-יגדל השיעור של תוספת 2011 לשיעור אחיד של .6.25%"
title = "The raise is set for 1.1.2013–30.6.2013 only; nothing says what applies from 1.7.2013"
body = """
Section ב.1(א) raises the 2011 supplement to a uniform 6.25% "from 1.1.2013 until 30.6.2013", and ב.1(ב) raises the '94 and '87 shekel supplements to the printed amounts for the same window. The circular is about the upper division's "third instalment"; it does not say whether the rate and the amounts stay at their new level after 30.6.2013, fall back to the earlier ones, or are to be set by a later instrument.

Written as a function of the date, the circular has no answer for any day after 30 June 2013: an employer paying the July 2013 salary cannot tell from this text which rate to apply.
"""
reading = "The encoding gives the 6.25% rate and the printed amounts for the window only, and NOTHING outside it; the rate after 30.6.2013 is left to another instrument."
