kind = "contradiction"
stage = "examples"
keys = ["art_1__para_a", "art_1__para_b/p15", "art_1__para_b/p23", "art_1__para_b/p39"]
quote = "27 ימים, המהווים חלק מהשעות שהוחסרו, יוחזרו בימי החופשה שתוכננו לשנה\"ל תשס\"ח, כולל דחיית סיום שנה\"ל. ימים אלו מפורטים בטבלה שבהמשך"
title = "Three of the four sector tables do not list the 27 days §1א says they set out"
body = """
§1א returns 27 of the 49 strike days in the planned holidays and says that "these days are set out in the table below". The Jewish sector's table does list 27 school days, with Saturday as the weekly rest.

The other three do not, under any weekly rest of one or two days among Friday, Saturday and Sunday: as printed, the Arab and Bedouin Muslim table lists between 24 and 28 days, the mixed localities' table between 21 and 29, and the Druze table between 25 and 32 (Friday–Saturday rest: 26, 26 and 28). The count §1א states and the days the table names cannot both be right for those sectors, and they decide how many holiday days a teacher there must work.
"""
reading = "The tables decide which days are worked. With the summer runs ending on §2ב's last school day (the reading of F-2007-08_tashsach_03-a), the Arab and Bedouin table lists 27 days under a Friday–Saturday rest and the mixed localities' table 27 under a Friday–Sunday rest, so §1א's count holds there. The Druze table, which prints Friday 4.1.2008 as a working day, is taken as printed and does not reach 27; the count of 27 is not used to add or drop a Druze day."
l4 = "l4/circulars/2007-08_tashsach_03.l4"
evidence = "`three sector tables never list 27 days`"
depends_on = ["F-2007-08_tashsach_03-a"]
