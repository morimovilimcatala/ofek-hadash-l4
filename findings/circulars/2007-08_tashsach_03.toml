[[finding]]
id = "F-2007-08_tashsach_03-a"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_b/p19", "art_1__para_b/p21", "art_1__para_b/p37", "art_2__para_b__subpara_2", "art_2__para_b__subpara_3"]
quote = "13.3.08 ראשון · 22.6.08 עד( 7.7.08 כולל), על חשבון ראשון עד שלישי · 21.6.08 עד( 9.7.08 כולל), על חשבון שבת עד חמישי · ביום שלישי ה' בתמוז תשס\"ח 8, ביולי .2008 · ביום החמישי ז' בתמוז תשס\"ח 10, ביולי 2008"
title = "Three holiday-table lines print a weekday their date does not fall on, two of them against §2ב's last school day"
body = """
The holiday tables of §1 print beside each date the weekday it falls on. Three do not fit. In the Arab and Bedouin Muslim table, 13.3.2008 is printed as a Sunday; it is a Thursday. The same table's summer run is printed "22.6.08 to 7.7.08 inclusive, Sunday to Tuesday"; 7.7.2008 is a Monday. The mixed localities' summer run is printed "21.6.08 to 9.7.08 inclusive, Saturday to Thursday"; 9.7.2008 is a Wednesday.

For the two summer runs, §2ב sets the last school day of a school that struck in those sectors as Tuesday 8.7.2008 and Thursday 10.7.2008 — the weekdays the tables print, one day after the dates they print. So the table and §2ב give the sector's last working day one day apart, and for 13.3.2008 the text does not say whether the day to work is that Thursday or a Sunday.

The Jewish and Druze tables, whose summer runs end on §2ב's own dates, print every weekday correctly.
"""
reading = "The summer runs end on §2ב's last school day (8.7.2008 and 10.7.2008), the date whose weekday the table prints; with that, the Arab and mixed tables list exactly 27 days (F-2007-08_tashsach_03-b). 13.3.2008 is taken as the printed date, one day either way."
l4 = "l4/circulars/2007-08_tashsach_03.l4"
evidence = "`three holiday lines print a weekday their date does not fall on`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
