[[finding]]
id = "F-2007-08_tashsach_03-c"
kind = "broken-reference"
stage = "writing"
keys = ["art_1__para_a", "art_2"]
quote = "ישלימו את השעות והימים הללו במהלך שנה\"ל, כמפורט בסעיף, 2 ובנוסף למס' הימים המצוין שם"
title = "§1א sends 12th-grade teachers to a \"section 2\" that states no number of days"
body = """
§1א: teachers of 12th grades whose pupils cannot be at school on the holiday days because of the matriculation exams make up those hours and days during the school year "as set out in section 2, and in addition to the number of days stated there".

§2 (the implementation instructions) sets the end of the year by school and sector and the principals' reports. It says nothing about 12th grades or making up days during the year, and states no number of days for "in addition to" to add to. The clause that does both — returning days during the year, with a number (22) and a separate deadline for grades 11–12 (31.5.2008) — is §1ב.
"""
reading = "\"Section 2\" is read as §1ב: a 12th-grade teacher returns the holiday days during the year, by §1ב's arrangements and deadline, on top of §1ב's 22 days."
l4 = "l4/circulars/2007-08_tashsach_03.l4"
evidence = "`§1א cites a number of days §2 does not state`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2007-08_tashsach_03-d"
kind = "ambiguity"
stage = "writing"
keys = ["art_3__para_c/p3", "art_1__para_b"]
quote = "ניתן לשלם את מקדמת חודש דצמבר לפני ה 1/1/2008-לעובד הוראה -כל עוד יחתום בפני מנהל ביה\"ס על מחוייבותו להחזר כל השעות עד ליום .10/1/2008"
title = "\"By 10.1.2008\": the deadline for signing the commitment, or for returning all the hours?"
body = """
§3ג ¶3 lets the December advance be paid before 1.1.2008 to a teacher who "signs before the principal his commitment to return all the hours by 10/1/2008". The date can attach to the signature (sign by 10.1.2008) or to the return (a commitment to have returned all the hours by 10.1.2008).

The second reading contradicts §1: the holiday days run to July 2008 and §1ב's other 22 days to 20.6.2008 (31.5.2008 for grades 11–12), so no teacher could return all the hours by 10.1.2008. The first reading lets the advance be paid before a commitment that may be signed only afterwards, against §3א's condition of a commitment "in advance" — which the paragraph's "notwithstanding the above" may be meant to lift.
"""
reading = "10.1.2008 is the deadline for signing the commitment; the advance may be paid before 1.1.2008 to a teacher who has committed to the whole plan."
l4 = "l4/circulars/2007-08_tashsach_03.l4"
evidence = "`returning all the hours by 10.1.2008 contradicts §1ב`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2007-08_tashsach_03-e"
kind = "gap"
stage = "writing"
keys = ["art_3__para_d", "art_3__para_e"]
quote = "מחציתו במשכורת חודש דצמבר 2007 ומחציתו במשכורת חודש יוני .2008 עו\"ה אשר יבצע החזר חלקי של ימי השביתה, יקבל שכר בגין חופשת חנוכה, בהתאם לחלקיות החזר ימי השביתה"
title = "A partial returner may have been paid more Hanukkah pay in December than the share he is owed, and nothing recovers it"
body = """
§3ד pays a teacher who committed to the whole plan the full Hanukkah-holiday pay, half with December 2007's salary and half with June 2008's, and a teacher who returns only part of the strike days Hanukkah pay in proportion to the part returned.

The December half is paid on the commitment, before any day is returned. A teacher who then returns less than half (40 of 147 hours, say) is owed less than he was paid in December, and the June half cannot make up the difference. §3ה's July deduction reaches only "the hours and days not carried out, for which he received an advance" — the advance of §3ב, not the Hanukkah pay. The circular sets no deduction or set-off for the excess; the June payment itself also falls before the summer-holiday days of §1's tables are returned, so the proportion is not yet known when it is paid.
"""
reading = "The June balance is the proportional Hanukkah pay less the December half; where that is negative the encoding reports it as owed back and applies no deduction, since the circular sets none."
l4 = "l4/circulars/2007-08_tashsach_03.l4"
evidence = "`a partial return under half leaves the Hanukkah balance negative`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
