title = "עד 10.1.2008: המועד האחרון לחתימה על ההתחייבות, או להחזרת כל השעות?"
body = """
§3ג (הפסקה "למרות הכתוב לעיל, ניתן לשלם את מקדמת חודש דצמבר…") מתיר לשלם את מקדמת חודש דצמבר לפני 1.1.2008 לעובד הוראה ש"יחתום בפני מנהל ביה"ס על מחוייבותו להחזר כל השעות עד ליום" 10.1.2008. המועד יכול להתייחס לחתימה (לחתום עד 10.1.2008) או להחזרה (התחייבות להשלים את החזרת כל השעות עד 10.1.2008).

הקריאה השנייה סותרת את §1: ימי החופשה נמשכים עד יולי 2008, ו־22 הימים האחרים של §1ב עד 20.6.2008 (31.5.2008 לכיתות י"א–י"ב), כך שאף עובד הוראה אינו יכול להחזיר את כל השעות עד 10.1.2008. הקריאה הראשונה מאפשרת לשלם את המקדמה לפני התחייבות שאפשר שתיחתם רק לאחר מכן, בניגוד לתנאי של §3א בדבר התחייבות "מראש" — שייתכן שה"למרות הכתוב לעיל" שבפסקה נועד להסיר.
"""
reading = "המועד 10.1.2008 הוא המועד האחרון לחתימה על ההתחייבות; את המקדמה ניתן לשלם לפני 1.1.2008 לעובד הוראה שהתחייב לכל התוכנית."
