body = """
§3ד משלם לעובד הוראה שהתחייב לכל התוכנית את מלוא השכר בגין חופשת חנוכה, מחציתו במשכורת דצמבר 2007 ומחציתו במשכורת יוני 2008, ולעובד הוראה המבצע החזר חלקי של ימי השביתה — שכר בגין חופשת חנוכה בהתאם לחלק שהוחזר.

המחצית של דצמבר משולמת על סמך ההתחייבות, לפני שהוחזר יום כלשהו. עובד הוראה שמחזיר לאחר מכן פחות ממחצית (40 מתוך 147 שעות, למשל) זכאי לפחות ממה ששולם לו בדצמבר, והמחצית של יוני אינה יכולה לאזן את ההפרש. ההפחתה של יולי לפי §3ה מגיעה רק ל"שעות והימים שלא בוצעו, ואשר בגינם קיבל מקדמה" — המקדמה של §3ב, לא שכר החנוכה. החוזר אינו קובע ניכוי או קיזוז לעודף; גם התשלום של יוני עצמו חל לפני שמוחזרים ימי חופשת הקיץ שבטבלאות של §1, כך שהשיעור עדיין אינו ידוע בעת תשלומו.
"""
