הטבלאות של המגזר היהודי ושל המגזר הדרוזי, שרצפי הקיץ שלהן מסתיימים בתאריכים של §2ב עצמו, מדפיסות כל יום בשבוע נכון.
"""
reading = "רצפי הקיץ מסתיימים ביום הלימודים האחרון של §2ב (8.7.2008 ו־10.7.2008), התאריך שאת היום בשבוע שלו הטבלה מדפיסה; כך, טבלת המגזר הערבי וטבלת הישובים המעורבים מונות 27 ימים בדיוק (`F-2007-08_tashsach_03-b`). התאריך 13.3.2008 נלקח כפי שהודפס, יום אחד לכאן או לכאן."
