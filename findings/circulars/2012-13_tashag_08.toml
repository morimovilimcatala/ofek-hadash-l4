title = "א.4 caps the allowance at one full position; א.5 lets two employers pay more"
body = """
Section א.4 pays the clothing allowance in proportion to the position and "no more than one full position (100%)". Section א.5: an employee with more than one employer whose total position with both is above 100% receives from each employer the allowance proportional to the position held with it.

An employee with two employers and more than a full position in total falls under both. At 70% with one and 60% with the other, א.4 gives one position's allowance, א.5 gives 130% of it. The text does not say which governs.
"""
reading = "א.5 is the rule for an employee with more than one employer, א.4 for an employee whose positions are all with one employer: א.5 is the narrower case and names it expressly."
l4 = "l4/circulars/2012-13_tashag_08.l4"
evidence = "`א.4 and א.5 give different allowances for two employers above a full position`"
