קצובת הביגוד הנוספת למורה לחינוך גופני מדורגת לפי "שיעור העסקה" ואינה יחסית: כלום במדרגה התחתונה, 669 ₪ באמצעית ו־1,334 ₪ בעליונה. החוזר אומר כיצד הקצובה הכללית מתחלקת בין המעסיקים (§א(5): כל מעסיק משלם את הקצובה היחסית למשרה שאצלו), אך אינו אומר דבר על קצובת החינוך הגופני של מורה שיש לו יותר ממעסיק אחד.

אם נמדד לפי מעסיק, מורה המועסק ב־40% אצל כל אחד משני מעסיקים מקבל 669 ₪ פעמיים, 1,338 ₪ בסך הכל — יותר ממורה המועסק ב־80% אצל מעסיק אחד (1,334 ₪); אם נמדד על פני כלל המעסיקים, ה־80% נופלים במדרגה העליונה, והחוזר אינו אומר איזה מעסיק משלם אותה.

אותה שאלה, משרתו של מי נמדדת במדרגות קצובת החינוך הגופני, עולה מאותן מילים בכל חוזרי קצובת הביגוד, והיא נרשמה בכל אחד מהם: F-2007-08_tashsach_06-f (תשס"ח/6), F-2008-09_tashsat_10-g (תשס"ט/10), F-2009-10_tasha_05-g (תש"ע/5), F-2010-11_tashaa_03-h (תשע"א/3), F-2011-12_tashab_08-d (תשע"ב/8), F-2011-12_tashab_13-f (תשע"ב/13), F-2012-13_tashag_08-f (תשע"ג/8), F-2012-13_tashag_09-f (תשע"ג/9), F-2013-14_tashad_08-g (תשע"ד/8), F-2014-15_tashae_07-g (תשע"ה/7), F-2015-16_tashav_08-g (תשע"ו/8), F-2016-17_tashaz_06-g (תשע"ז/6), F-2017-18_tashach_07-g (תשע"ח/7), F-2018-19_tashat_08-g (תשע"ט/8), F-2019-20_tashaf_11-f (תש"פ/11), F-2020-21_tashpa_08-f (תשפ"א/8), F-2021-22_tashpab_07-b (תשפ"ב/7), F-2022-23_tashpag_09-e (תשפ"ג/9), F-2022-23_tashpag_09_clarif-b (ההבהרה לחוזר תשפ"ג/9), F-2023-24_tashpad_11-e (תשפ"ד/11), F-2024-25_tashpah_12-d (תשפ"ה/12) ו־F-2025-26_tashpo_08-e (תשפ"ו/8).
