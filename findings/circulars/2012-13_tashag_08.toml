title = "The physical-education table gives positions of 0.3 and 0.5 two amounts each"
body = """
The additional clothing allowance for physical-education teachers is set by a table of three rows: "up to 0.3 position" (0), "from 0.3 position to 0.5 position" (669) and "from 0.5 position and above" (1334). Each boundary is printed in two rows: a teacher at exactly 0.3 of a position is "up to 0.3" and "from 0.3", and one at exactly 0.5 is "to 0.5" and "from 0.5".

Written as a function from the position to an amount, the table cannot be transcribed as printed; at 0.3 it gives 0 and 669, at 0.5 it gives 669 and 1334.
"""
reading = "A row governs from the position it opens at (\"מ-\"): 0.3 takes 669 and 0.5 takes 1334, reading \"עד\" as up to but not including the boundary. Every other position has exactly one row."
