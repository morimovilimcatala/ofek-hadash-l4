עובד הוראה שיש לו שני מעסיקים ויותר ממשרה מלאה בסך הכול נכלל בשני הסעיפים. ב־70% אצל מעסיק אחד וב־60% אצל השני, א.4 נותן את הקצובה של משרה אחת, ו־א.5 נותן 130% ממנה. הטקסט אינו אומר איזה מהם גובר.
"""
reading = "א.5 הוא הכלל לעובד הוראה המועסק אצל יותר ממעסיק אחד, ו־א.4 לעובד הוראה שכל משרותיו אצל מעסיק אחד: א.5 הוא המקרה הצר יותר והוא מציין אותו במפורש."
