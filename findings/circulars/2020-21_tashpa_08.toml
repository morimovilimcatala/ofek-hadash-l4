# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2020-21_tashpa_08-a"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_d", "art_1__para_e"]
quote = "קצובת הביגוד תשולם יחסית להיקף המשרה של העובד ולא יותר ממשרה אחת מלאה (100%). · עובד הוראה המועסק אצל יותר ממעסיק אחד והיקף משרתו הכוללת אצל שני המעסיקים הינו מעבר ל-100% משרה, זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו."
title = "The clothing allowance is capped at one full position, and paid by each employer for its own share above it"
body = """
Clause 1ד pays the clothing allowance in proportion to "the employee's position and not more than one full position (100%)", with no mention of the employer. Clause 1ה gives an employee of several employers, whose total position is above 100%, the share of the position held with each employer, from each employer separately.

For an employee at 80% with one employer and 60% with another, 1ה gives 140% of the allowance in all, and 1ד caps the allowance at one full position.
"""
reading = "1ה, the rule for an employee of several employers, governs them: each employer pays its own share, and 1ד's cap of one full position applies at each employer."
l4 = "l4/circulars/2020-21_tashpa_08.l4"
evidence = "`1ד's cap and 1ה disagree for two employers`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2020-21_tashpa_08-b"
kind = "overlap"
stage = "writing"
keys = ["art_1__para_f", "art_1/p5"]
quote = "יובהר כי חלה הגבלה על עובד הוראה לעבוד בהיקף משרה העולה על 140% משרה אצל כלל מעסיקיו, וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150% משרה."
title = "A principal not under a reform has two employment ceilings, 140% and 150%"
body = """
Clause 1ו lays a ceiling of 140% of a position at all employers on "a teaching employee", and "also" a ceiling of 150% on "a principal employed not under the terms of the reform". A principal is a teaching employee, so a principal not under a reform is under both ceilings, and a principal employed at 145% is within one and above the other.

The same clause in circular תשפ"א/7 lays the 140% ceiling on "a teacher employed not under the terms of the reform", where the two groups do not meet; and ¶5 here restates the ceilings as "140% without a reform", 117% and 125%, without the principals' 150%.
"""
reading = "Each group's own ceiling governs it: 150% for a principal not under a reform, 125% and 117% for teachers under עוז לתמורה and אופק חדש, and 140% for a teaching employee not under a reform, as ¶5 puts it."
l4 = "l4/circulars/2020-21_tashpa_08.l4"
evidence = "`a principal not under the reform has two ceilings`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
