title = "השכר מותנה בפרק שאינו דורש דבר מעובד ההוראה"
body = """
§ד משאיר את שכר עובדי ההוראה ללא שינוי עד תום תקופת התחולה "בהתקיים האמור בפרקים ב' ו-ג'". פרק ב' הוא חובה של עובד ההוראה: לקיים לימודים בימי החג המפורטים ובימי הלימודים הרגילים. פרק ג', שכותרתו "הודעת המדינה לגבי הארכת שנת הלימודים", אומר רק שהודעה על המועד המעודכן לסיום שנת הלימודים תימסר בהמשך.

פרק ג' אינו מטיל על איש חובה שעובד הוראה יכול לקיים או להפר, ואינו קובע מועד, ולכן אי אפשר לבדוק את התנאי ש־§ד שואב ממנו: לפי המילים, אף עובד הוראה אינו יכול לקיים אותו, או שכל עובד הוראה מקיים אותו מאליו. הכוונה הסבירה — שהשכר תלוי גם בעבודה בשנה המוארכת לאחר שתוכרז — היא נושאו של §ה, לא של ג'.
"""
reading = "התנאי הוא פרק ב', ופרק ג' נקרא כחובתו של עובד ההוראה לעבוד בשנת הלימודים המוארכת לאחר שמועד סיומה יוכרז (כמפורט ב־§ה); שכרו של עובד הוראה המקיים אותם אינו משתנה."
l4 = "l4/circulars/2019-20_tashaf_07.l4"
evidence = "`§ד conditions salary on a chapter that requires nothing of the teacher`"
