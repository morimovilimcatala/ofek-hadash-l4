# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2019-20_tashaf_07-a"
kind = "gap"
stage = "writing"
keys = ["art_d/p1", "art_c/p1"]
quote = "בהתקיים האמור בפרקים ב' ו-ג' לעיל, לא יחול שינוי בשכר עובדי ההוראה עד לתום תקופת התחולה · הודעה על המועד המעודכן לסיום שנת הלימודים תמסר בהמשך"
title = "Salary is conditioned on a chapter that asks nothing of the teacher"
body = """
§ד keeps teachers' salary unchanged to the end of the application period "provided what is said in chapters ב and ג" is met. Chapter ב is a duty of the teacher: to hold studies through the listed holiday days and the ordinary study days. Chapter ג, headed "the State's notice on extending the school year", says only that the new end of the school year will be notified later.

Chapter ג puts no duty on anyone that a teacher could meet or fail, and sets no date, so the condition §ד draws from it cannot be tested: on the words, no teacher can satisfy it, or every teacher satisfies it trivially. The likely intent — that salary depends also on working the extended year once it is announced — is §ה's subject, not ג's.
"""
reading = "The condition is chapter ב, with chapter ג read as the teacher's duty to work the extended school year once its end is announced (as §ה details); salary is unchanged for a teacher who meets them."
l4 = "l4/circulars/2019-20_tashaf_07.l4"
evidence = "`§ד conditions salary on a chapter that requires nothing of the teacher`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2019-20_tashaf_07-b"
kind = "contradiction"
stage = "writing"
keys = ["preamble/p21", "preamble/p22", "art_a/p1"]
quote = "בנוגע לתנאי עבודתם של עובדי ההוראה המדורגים בדירוג עובדי הוראה המועסקים בשירות המדינה · חוזר זה יחול על כל העובדים המדורגים בדירוג עובדי הוראה בבעלויות"
title = "The circular reaches owners' employees; the agreement it implements covers only state employees"
body = """
¶21 describes the special agreement of 1.4.2020 as governing teaching employees "employed in the state service" whose study and holiday days the Director-General's circulars set, and ¶22 makes it an "other agreement" under the leave regulations — the instrument that takes them out of the extended leave agreement — "for the teaching employees to whom it applies".

§א then applies the circular to every employee on the teaching scale "in the owning bodies" (בבעלויות) of kindergartens, primary and junior-high schools and the listed special-education institutions, and the circular is addressed to those owners, including the owners of recognised-unofficial special-education schools, whose teachers are not state employees. For such a teacher the circular imposes the agreement's terms — studies through the holidays, salary unchanged, the extension worked in proportion — while the agreement as described does not cover him or her, so whether the agreement is an "other agreement" for that employment, and so whether the leave agreement still applies to it, is left contradictory.
"""
reading = "The circular's own instructions (§§ב–ה) bind every employee §א names; whether the agreement of 1.4.2020 displaces the leave agreement for an owner's employee outside the state service is left open and kept as a separate question in the L4."
l4 = "l4/circulars/2019-20_tashaf_07.l4"
evidence = "`a teacher of an owning body outside the state service is covered by the circular and not by the agreement it implements`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
