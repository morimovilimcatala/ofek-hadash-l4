title = "החוזר חל על עובדי הבעלויות; ההסכם שהוא מיישם חל רק על עובדי המדינה"
body = """
הפתיח (הפסקה "בתאריך 01.04.2020 נחתם הסכם קיבוצי מיוחד…") מתאר את ההסכם הקיבוצי המיוחד מיום 1.4.2020 כחל על עובדי הוראה "המועסקים בשירות המדינה" שימי הלימודים והחופשה שלהם נקבעים בחוזרי המנכ"ל, והפסקה "הסכם זה מהווה…" שאחריה עושה אותו "הסכם אחר" לפי תקנות היציאה לחופשה — המכשיר המוציא אותם מתחולת הסכם החופשה המורחב — "לגבי עובדי ההוראה עליהם הוא חל".

לאחר מכן §א מחיל את החוזר על כל העובדים המדורגים בדירוג עובדי הוראה "בבעלויות" של גני ילדים, בתי ספר יסודיים וחטיבות ביניים ומוסדות החינוך המיוחד המפורטים, והחוזר מופנה לבעלויות אלה, ובהן הבעלויות של בתי ספר לחינוך מיוחד מוכרים שאינם רשמיים, שעובדי ההוראה בהם אינם עובדי מדינה. על עובד הוראה כזה החוזר מטיל את תנאי ההסכם — לימודים בימי החג, שכר ללא שינוי, עבודה בהארכה באופן יחסי — בעוד שההסכם, כפי שהוא מתואר, אינו חל עליו או עליה. לכן השאלה אם ההסכם הוא "הסכם אחר" לגבי העסקה זו, ומכאן אם הסכם החופשה עדיין חל עליה, נותרת סותרת.
"""
reading = "ההוראות של החוזר עצמו (§§ב–ה) מחייבות כל עובד ש־§א מונה; השאלה אם ההסכם מיום 1.4.2020 דוחק את הסכם החופשה לגבי עובד של בעלות שאינו בשירות המדינה נותרת פתוחה ונשמרת ב־L4 כשאלה נפרדת."
