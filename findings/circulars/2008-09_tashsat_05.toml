[[finding]]
id = "F-2008-09_tashsat_05-a"
kind = "contradiction"
stage = "examples"
keys = ["hc_1/p14", "hc_1/p15", "hc_1/p22", "hc_1/p19"]
quote = "תובא התוספת של 4.74%וכן 0.8%לכל שנה או חלק יחסי לחלק נשנה לתקופה שבה היו פעילים בשנים .2006 – 2003 · מורים שסיימו עבודתם בשנת 8.95%: 2006 -"
title = "The award's computation gives 2006 leavers 8.95%; its own rule gives 7.95%"
body = """
Chapter ה of the award, as the circular quotes it, sets the rule and then "the computation". The rule (¶14–15): those active in 2000–2002 get part of the 4.75% addition, 1.8% a year; those active in 2003–2006 get the base addition and 0.8% for each year active in 2003–2006. The computation lists the addition by the year the work ended.

On the 4.75% base the rule reproduces every row for 2000 to 2005 (1.8%, 3.6%, 4.75%, 5.55%, 6.35%, 7.15%) and gives 4.75% + 4 × 0.8% = 7.95% for a teacher who worked through 2006. The computation prints 8.95% — one point more. And ¶15 prints the base itself as 4.74%, not the 4.75% ¶14 and ¶23 name; on 4.74% the rule matches none of the rows for 2003–2006.

The severance of a 2006 leaver is recomputed on a determining salary 7.95% or 8.95% higher according to which of the award's two statements is applied.
"""
reading = "The computation's rows, which the owning bodies are told to pay by, are encoded as printed (8.95% for 2006); ¶15's base is read as 4.75%, as ¶14 and ¶23 name it."
l4 = "l4/circulars/2008-09_tashsat_05.l4"
evidence = "`2006's row is not the rule's`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_05-b"
kind = "contradiction"
stage = "writing"
keys = ["hc_1/p14", "hc_1/p15", "hc_1/p20"]
quote = "שעור התוספת לצורך חישוב פיצויי פיטורים יתבסס על אורך תקופת עבודתו של כל מורה ( 1.8%לכל שנה) · 0.8%לכל שנה או חלק יחסי לחלק נשנה לתקופה שבה היו פעילים"
title = "The rule pro-rates the addition by the part of a year worked; the computation gives one rate per year of leaving"
body = """
The award's rule measures the addition by the length of each teacher's work: 1.8% for each year in 2000–2002, and 0.8% "for each year, or the proportional part for part of a year" in 2003–2006. The computation then gives a single rate for everyone who ended work in a given year, which equals the rule only for a teacher who worked to the end of that year.

A teacher who left in March 2004 was active for 1 2/12 years in 2003–2006: the rule gives 4.75% + 0.8% × 14/12 ≈ 5.68%, the computation 6.35%. Every leaver who did not finish the calendar year is given two different additions.
"""
reading = "The computation's row for the year the work ended governs, whatever part of that year was worked: it is the table the circular tells the owning bodies to pay by."
l4 = "l4/circulars/2008-09_tashsat_05.l4"
evidence = "`the rule pro-rates a part year and the computation does not`"
depends_on = ["F-2008-09_tashsat_05-a"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
