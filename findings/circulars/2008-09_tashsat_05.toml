title = "החישוב שבפסק הבוררות נותן לעוזבי 2006 8.95%; הכלל שבו עצמו נותן 7.95%"
body = """
פרק ה של פסק הבוררות, כפי שהחוזר מצטט אותו, קובע את הכלל ואחריו את "החישוב". הכלל (הפסקאות "מורים אלו, אשר סיימו את עבודתם…" ו"מורים שהיו פעילים בשנים 2006 – 2003…"): מורים שהיו פעילים בשנים 2000–2002 זכאים לחלק מתוך התוספת של 4.75%, 1.8% לכל שנה; מורים שהיו פעילים בשנים 2003–2006 זכאים לתוספת הבסיס וכן 0.8% לכל שנה שבה היו פעילים בשנים 2003–2006. החישוב מפרט את התוספת לפי השנה שבה הסתיימה העבודה.

על בסיס 4.75% הכלל משחזר כל שורה לשנים 2000 עד 2005 (1.8%, 3.6%, 4.75%, 5.55%, 6.35%, 7.15%), ולמורה שעבד עד סוף 2006 הוא נותן 4.75% ועוד 4 פעמים 0.8%, כלומר 7.95%. החישוב מדפיס 8.95% — נקודה אחת יותר. ועוד: הפסקה "מורים שהיו פעילים בשנים 2006 – 2003…" מדפיסה את הבסיס עצמו כ־4.74%, ולא כ־4.75% שהפסקאות "מורים אלו, אשר סיימו את עבודתם…" ו"למורים שסיימו עבודתם בשנת 2007…" נוקבות בו; על בסיס 4.74% הכלל אינו תואם אף אחת מהשורות לשנים 2003–2006.

פיצויי הפיטורים של מי שסיים עבודתו ב־2006 מחושבים מחדש על שכר קובע גבוה ב־7.95% או ב־8.95%, לפי איזו משתי הקביעות של פסק הבוררות מוחלת.
"""
reading = "שורות החישוב, שלפיהן הבעלויות מתבקשות לשלם, מקודדות כפי שהן מודפסות (8.95% ל־2006); הבסיס שבפסקה \"מורים שהיו פעילים בשנים 2006 – 2003…\" נקרא כ־4.75%, כפי שהפסקאות \"מורים אלו, אשר סיימו את עבודתם…\" ו\"למורים שסיימו עבודתם בשנת 2007…\" נוקבות בו."
