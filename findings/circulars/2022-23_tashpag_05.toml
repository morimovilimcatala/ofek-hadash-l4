[[finding]]
id = "F-2022-23_tashpag_05-a"
kind = "broken-reference"
stage = "writing"
keys = ["art_2__para_2-4"]
quote = "מקדמה בהתאם לאמור בסעיף 20.1 א' וסעיף 20.1 ב' … כאמור בסעיף 20.2 או בסעיף 20.3 לעיל"
title = "2.4 cites clauses 20.1-20.3 \"above\"; the circular has no section 20"
body = """
2.4 deals with an employee paid an advance "under section 20.1א and section 20.1ב" who leaves before the deduction date "under section 20.2 or section 20.3 above". The circular has three sections; its advances are paid under 2.1א-ב and deducted under 2.2-2.3. No section 20 is above 2.4, and the clause does not say it cites the collective agreement instead.
"""
reading = "20.1א, 20.1ב, 20.2 and 20.3 are read as this circular's 2.1א, 2.1ב, 2.2 and 2.3, the clauses whose content 2.4 describes."
l4 = "l4/circulars/2022-23_tashpag_05.l4"
evidence = "`2.4 cites clauses the circular does not have`"
depends_on = []
