# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
# See findings/takanon/takanon-sherut-ovdei-horaa/1.7.toml for the fields.

[[finding]]
id = "F-2010-11_tashaa_03-a"
kind = "gap"
stage = "writing"
keys = ["art_a__para_2", "art_a__para_4"]
quote = "עובד בדירוג עובדי הוראה, זכאי לקצובת ביגוד · 1,464 1-25 שנים"
title = "A teacher in the first year of teaching has no row if seniority counts completed years"
body = """
Section א.2 entitles every employee in the teaching-staff grade to the clothing allowance, and section א.3 makes the amount depend on seniority. Section א.4's table opens at "1-25 שנים" and does not say how seniority in teaching is counted.

If seniority is the number of COMPLETED years, a teacher in the first year has seniority 0, which no row covers: an entitlement under א.2 with no amount under א.4.
"""
reading = "The year being served counts, so a teacher in the first year is in year 1 and takes the 1-25 row (1,464 ₪). It is the reading under which section א.2's entitlement and the table agree."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`a first-year employee has no row if seniority counts completed years`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2010-11_tashaa_03-b"
kind = "overlap"
stage = "writing"
keys = ["art_b/p2", "art_b/p3", "art_b/p4"]
quote = "0 עד 0.3 משרה · 252 מ 0.3 -משרה עד 0.5 משרה · 501 מ 0.5-משרה ומעלה"
title = "The physical-education table gives 0.3 and 0.5 of a position two amounts each"
body = """
Section ב prices the extra clothing allowance for a physical-education teacher in three bands of employment rate: up to 0.3 (0), from 0.3 to 0.5 (252 ₪), and from 0.5 up (501 ₪). Every bound is written inclusively on both sides: 0.3 is both "עד 0.3" and "מ-0.3", and 0.5 is both "עד 0.5" and "מ-0.5".

A teacher employed at exactly 0.3 is given 0 and 252; one at exactly 0.5, a common position, is given 252 and 501. Every other rate gets one row.
"""
reading = "The band that opens at a bound governs it (\"מ-X\" includes X): 0.3 takes 252 ₪ and 0.5 takes 501 ₪, reading each \"עד\" as up to but not including the next band's opening."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`the physical-education table gives 0.3 and 0.5 two amounts each`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2010-11_tashaa_03-c"
kind = "ambiguity"
stage = "writing"
keys = ["art_b", "art_b/p1"]
quote = "קצובת ביגוד נוספת למורה לחינוך גופני · שיעור העסקה"
title = "The physical-education table's \"employment rate\": of the position in physical education, or of the whole position?"
body = """
Section ב grants an extra clothing allowance "to a physical-education teacher" by "שיעור העסקה", the employment rate, without saying whose: the share of the position spent teaching physical education, or the employee's whole position.

The readings differ for any teacher who teaches physical education in part of a larger position: a full-position teacher with a fifth of a position in physical education takes 0 under the first and 501 ₪ under the second.
"""
reading = "The employment rate is the share of the position in physical education, the work the extra allowance is for. It is an input of the encoding, so either reading can be run."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`the two readings of the employment rate differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"


[[finding]]
id = "F-2010-11_tashaa_03-d"
kind = "contradiction"
stage = "writing"
keys = ["art_c/p1"]
quote = "קצובת ביגוד לשנת הלימודים תש\"ע, לפי רשימת המקצועות המפורטת להלן"
title = "The technological-education allowance is for school year תש\"ע in a circular for תשע\"א"
body = """
The circular's title, subject line and section א.2 set the clothing allowance for school year תשע"א (09/10 – 08/11). Section ג's lead-in tells the owners to pay a teaching employee in technological education or a professional instructor a clothing allowance "for school year תש\"ע" — the year before — by the professions it lists.

Read as written, section ג pays the previous year's allowance, or a second allowance for a year this circular does not otherwise price; read by the title, it is this year's. The text gives both years.
"""
reading = "The allowance under section ג is this circular's year, תשע\"א, the year the title and section א.2 name; the amounts are paid once, with the rest of the allowance."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`section ג names another school year`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2010-11_tashaa_03-e"
kind = "gap"
stage = "writing"
keys = ["art_a__para_1", "art_b", "art_c/p1"]
quote = "א. קצובת ביגוד -כללי · 1. יש לשלמה במלואה במשכורת חודש יולי .2011"
title = "Only section א, headed \"general\", says when the allowance is paid; the physical-education and technological additions have no month"
body = """
Section א, headed "קצובת ביגוד – כללי", says the allowance is paid in full with the July 2011 salary. Sections ב (the additional allowance for physical-education teachers) and ג (the allowance in technological education) name no month of payment.

"כללי" reads two ways: as the general provisions of the whole circular, so that July governs the additions too; or as the general allowance, as opposed to the additional ones — the reading section ג.4 supports, since it repeats for its own allowance the pro-rating section א.5 already states. On the second reading the additions have no payment date at all.
"""
reading = "Section א.1's July payment covers the whole allowance one employer owes, the additions under sections ב and ג included."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`sections ב and ג name no month of payment`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
