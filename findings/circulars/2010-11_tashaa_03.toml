kind = "gap"
stage = "writing"
keys = ["art_a__para_2", "art_a__para_4"]
quote = "עובד בדירוג עובדי הוראה, זכאי לקצובת ביגוד · 1,464 1-25 שנים"
title = "למורה בשנת ההוראה הראשונה אין שורה אם הוותק מונה שנים שהושלמו"
body = """
סעיף א.2 מזכה כל עובד בדירוג עובדי הוראה בקצובת ביגוד, וסעיף א.3 קובע שהסכום תלוי בוותק. הטבלה שבסעיף א.4 נפתחת ב"1-25 שנים" ואינה אומרת כיצד נמנה הוותק בהוראה.

אם הוותק הוא מספר השנים שהושלמו, למורה בשנה הראשונה יש ותק 0, ששום שורה אינה מכסה: זכאות לפי א.2 בלי סכום לפי א.4.
"""
reading = "השנה שבה העובד משרת נמנית, ולכן מורה בשנה הראשונה נמצא בשנה 1 ומקבל את שורת \"1-25 שנים\" (1,464 ₪). זו הקריאה שבה הזכאות שבסעיף א.2 והטבלה מתיישבות."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`a first-year employee has no row if seniority counts completed years`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2010-11_tashaa_03-b"
kind = "overlap"
stage = "writing"
keys = ["art_b/p2", "art_b/p3", "art_b/p4"]
quote = "0 עד 0.3 משרה · 252 מ 0.3 -משרה עד 0.5 משרה · 501 מ 0.5-משרה ומעלה"
title = "טבלת החינוך הגופני נותנת ל־0.3 ול־0.5 משרה שני סכומים כל אחד"
body = """
סעיף ב מתמחר את קצובת הביגוד הנוספת למורה לחינוך גופני בשלוש מדרגות של שיעור העסקה: עד 0.3 (0), מ־0.3 עד 0.5 (252 ₪), ומ־0.5 ומעלה (501 ₪). כל גבול כתוב כך שהוא כלול משני צדדיו: 0.3 הוא גם "עד 0.3" וגם "מ-0.3", ו־0.5 הוא גם "עד 0.5" וגם "מ-0.5".

מורה המועסק בדיוק ב־0.3 מקבל 0 וגם 252; מורה בדיוק ב־0.5, משרה נפוצה, מקבל 252 וגם 501. כל שיעור אחר מקבל שורה אחת.
"""
reading = "המדרגה הנפתחת בגבול היא הקובעת לגביו (\"מ-X\" כולל את X): 0.3 מקבל 252 ₪ ו־0.5 מקבל 501 ₪, וכל \"עד\" נקרא כעד פתיחת המדרגה הבאה ולא עד בכלל."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`the physical-education table gives 0.3 and 0.5 two amounts each`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2010-11_tashaa_03-c"
kind = "ambiguity"
stage = "writing"
keys = ["art_b", "art_b/p1"]
quote = "קצובת ביגוד נוספת למורה לחינוך גופני · שיעור העסקה"
title = "\"שיעור העסקה\" שבטבלת החינוך הגופני: של המשרה בחינוך גופני, או של המשרה כולה?"
body = """
סעיף ב מעניק קצובת ביגוד נוספת "למורה לחינוך גופני" לפי "שיעור העסקה", בלי לומר של מה: חלק המשרה המוקדש להוראת חינוך גופני, או המשרה כולה של העובד.

הקריאות נבדלות לגבי כל מורה המלמד חינוך גופני בחלק ממשרה גדולה יותר: מורה במשרה מלאה עם חמישית משרה בחינוך גופני מקבל 0 לפי הראשונה ו־501 ₪ לפי השנייה.

אותן מילים מודפסות בעשרה חוזרים מתשס"ז עד תשע"ד, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-d (תשס"ז/7), F-2007-08_tashsach_06-c (תשס"ח/6), F-2008-09_tashsat_10-c (תשס"ט/10), F-2009-10_tasha_05-c (תש"ע/5), F-2010-11_tashaa_03-c (תשע"א/3), F-2011-12_tashab_08-c (תשע"ב/8), F-2011-12_tashab_13-e (תשע"ב/13), F-2012-13_tashag_08-d (תשע"ג/8), F-2012-13_tashag_09-d (תשע"ג/9) ו־F-2013-14_tashad_08-e (תשע"ד/8).
"""
reading = "שיעור ההעסקה הוא חלק המשרה בחינוך גופני, העבודה שבעדה ניתנת הקצובה הנוספת. הוא קלט של הקידוד, כך שאפשר להריץ כל אחת מהקריאות."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`the two readings of the employment rate differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"


[[finding]]
id = "F-2010-11_tashaa_03-d"
kind = "contradiction"
stage = "writing"
keys = ["art_c/p1"]
quote = "קצובת ביגוד לשנת הלימודים תש\"ע, לפי רשימת המקצועות המפורטת להלן"
title = "קצובת הביגוד בחינוך הטכנולוגי היא לשנת הלימודים תש\"ע, בחוזר לשנת תשע\"א"
body = """
הכותרת של החוזר, שורת הנדון וסעיף א.2 קובעים את קצובת הביגוד לשנת הלימודים תשע"א (09/10 – 08/11). הפתיח של סעיף ג מורה לבעלויות לשלם לעובד הוראה בחינוך הטכנולוגי או למדריך מקצועי קצובת ביגוד "לשנת הלימודים תש"ע" — השנה הקודמת — לפי רשימת המקצועות שהוא מפרט.

בקריאה כלשונו, סעיף ג משלם את הקצובה של השנה הקודמת, או קצובה שנייה לשנה שחוזר זה אינו מתמחר בדרך אחרת; בקריאה לפי הכותרת, זו הקצובה של השנה הזאת. הטקסט נותן את שתי השנים.
"""
reading = "הקצובה לפי סעיף ג היא לשנת החוזר הזה, תשע\"א, השנה שהכותרת וסעיף א.2 נוקבים בה; הסכומים משולמים פעם אחת, עם שאר הקצובה."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`section ג names another school year`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2010-11_tashaa_03-e"
kind = "gap"
stage = "writing"
keys = ["art_a__para_1", "art_b", "art_c/p1"]
quote = "א. קצובת ביגוד -כללי · 1. יש לשלמה במלואה במשכורת חודש יולי .2011"
title = "רק סעיף א, שכותרתו \"כללי\", אומר מתי משולמת הקצובה; לתוספות של החינוך הגופני והחינוך הטכנולוגי אין חודש"
body = """
סעיף א, שכותרתו "קצובת ביגוד – כללי", אומר שהקצובה משולמת במלואה במשכורת חודש יולי 2011. סעיפים ב (קצובת הביגוד הנוספת למורה לחינוך גופני) ו־ג (קצובת הביגוד בחינוך הטכנולוגי) אינם נוקבים בחודש תשלום.

"כללי" נקרא בשתי דרכים: כהוראות הכלליות של החוזר כולו, כך שיולי חל גם על התוספות; או כקצובה הכללית, להבדיל מהקצובות הנוספות — הקריאה שסעיף ג.4 תומך בה, שכן הוא חוזר לגבי הקצובה שלו על החישוב היחסי שסעיף א.5 כבר קובע. לפי הקריאה השנייה, לתוספות אין מועד תשלום כלל.

אותה שאלה עולה בתשעה חוזרי קצובת ביגוד מתשס"ז עד תשע"ד, והיא נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-f (תשס"ז/7), F-2007-08_tashsach_06-e (תשס"ח/6), F-2008-09_tashsat_10-f (תשס"ט/10), F-2009-10_tasha_05-f (תש"ע/5), F-2010-11_tashaa_03-e (תשע"א/3), F-2011-12_tashab_13-d (תשע"ב/13), F-2012-13_tashag_08-e (תשע"ג/8), F-2012-13_tashag_09-e (תשע"ג/9) ו־F-2013-14_tashad_08-f (תשע"ד/8).
"""
reading = "התשלום ביולי שבסעיף א.1 חל על כל הקצובה שמעסיק אחד חב, ובכלל זה התוספות לפי סעיפים ב ו־ג."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`sections ב and ג name no month of payment`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2010-11_tashaa_03-f"
kind = "overlap"
stage = "verification"
keys = ["art_c__para_1__subpara_a", "art_c__para_1__subpara_b"]
quote = "המקצועות המפורטים להלן, יהיה זכאי לקבל מדי שנה זוג נעליים ושני חלוקים · באחד המקצועות המפורטים להלן יהיה זכאי לקבל שני חלוקים לשנה"
title = "עובד הוראה המלמד מקצועות משתי הרשימות זכאי לשני הענקים, והחוזר אינו אומר אם הם מצטברים"
body = """
עובד הוראה בחינוך הטכנולוגי במקצועות ג.1א זכאי לזוג נעליים ושני חלוקים; באחד ממקצועות ג.1ב — לשני חלוקים. אין מקצוע המופיע בשתי הרשימות, אך עובד הוראה יכול ללמד יותר ממקצוע אחד, למשל מכטרוניקה ומערכות אלקטרוניות, ואז שני הסעיפים חלים עליו.

הבדיקה על פני כל מקצוע בכל רשימה, ללא מקצוע, ומקצוע אחד מכל רשימה, מראה שהקריאות נבדלות בדיוק לגבי עובד הוראה בשתי הרשימות: אם הענקים מצטברים, הוא מקבל נעליים וארבעה חלוקים (535 + 331 ₪); אם הגדול מביניהם, הכולל את שני החלוקים, מספיק — 535 ₪. החוזר אינו אומר איזו מהן.

אותן הוראות מודפסות בתשעה חוזרי קצובת ביגוד מתשס"ז עד תשע"ד, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-e (תשס"ז/7), F-2007-08_tashsach_06-d (תשס"ח/6), F-2008-09_tashsat_10-e (תשס"ט/10), F-2009-10_tasha_05-e (תש"ע/5), F-2010-11_tashaa_03-f (תשע"א/3), F-2011-12_tashab_13-c (תשע"ב/13), F-2012-13_tashag_08-c (תשע"ג/8), F-2012-13_tashag_09-c (תשע"ג/9) ו־F-2013-14_tashad_08-d (תשע"ד/8).
"""
reading = "עובד כזה מקבל את הענק הגדול, זוג נעליים ושני חלוקים: שני החלוקים של ג.1ב כלולים בו."
l4 = "l4/circulars/2010-11_tashaa_03.l4"
evidence = "`a teacher on both technological lists meets two grants`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
