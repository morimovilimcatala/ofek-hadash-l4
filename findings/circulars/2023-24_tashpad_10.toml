# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2023-24_tashpad_10-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_g", "art_1__para_d"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובת הבראה בשיעור יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה(."
title = "Part-time recuperation: pro-rated by the position, or at a tenth for each month of work?"
body = """
Section 1ז gives a part-time teaching employee the recuperation allowance "in a share proportional to the part of his position in that year", and explains it in brackets as "1/10 for each month of work". The sentence measures the POSITION; its bracket measures MONTHS, which is the measure section 1ד uses for an employee who worked part of the year.

Taken as written, a tenth for each month of work makes ten months the whole allowance and gives eleven or twelve months of work more than the whole. Read as the position fraction only, the months play no part. The readings give different allowances for any employee whose position fraction differs from the months worked divided by ten.
"""
reading = "Both measures apply: the position fraction (capped at one position, 1ח) and a tenth for each month of work up to ten, so a full position through the school year earns the whole allowance."
l4 = "l4/circulars/2023-24_tashpad_10.l4"
evidence = "`twelve months at a tenth a month exceed the whole allowance`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-24_tashpad_10-b"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_j", "art_1__para_ja/p4"]
quote = "וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150%משרה · אין לראות באמור לעיל משום היתר להעסקה מעבר להיקפי משרה אלו (140% משרה -ללא רפורמה"
title = "A principal outside the reforms: capped at 150% (1י) or at 140% (the restatement in 1יא)?"
body = """
Section 1י caps a teacher employed outside the reform's terms at 140% of a position across all employers, and a principal employed outside the reform's terms at 150%. The last paragraph of 1יא then restates the caps — "140% without a reform, 125% in the full implementation of Oz LaTmura and 117% in Ofek Hadash, and no more than 42 hours" — and says the above is no permission to employ beyond them.

The restatement gives one cap, 140%, for everyone outside the reforms. For a principal outside the reforms employed at, say, 145%, section 1י allows the scope and the restatement forbids it.
"""
reading = "Section 1י's specific cap for a principal (150%) stands; the restatement in 1יא is read as the teachers' caps. The 42-hour limit is applied as printed, to every employee."
l4 = "l4/circulars/2023-24_tashpad_10.l4"
evidence = "`the restated caps differ from 1י for a principal outside the reforms`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-24_tashpad_10-c"
kind = "overlap"
stage = "writing"
keys = ["art_2__para_e__subpara_3"]
quote = "ובמכללות האקדמאיות להכשרת עו\"ה -הוותק המזכה במענק יובל הינו וותק מצטבר כהגדרתו לעיל, של 25 שנה … (גני ילדים, יסודי, מכללות להכשרת עו\"ה) הוותק המזכה במענק יובל הינו וותק מצטבר, כהגדרתו לעיל, של 30 שנה."
title = "Teacher-training colleges are in both the 25-year and the 30-year list for the jubilee grant"
body = """
Section 2ה.3 sets the seniority that earns the jubilee grant by the stage of education of the part of the employment: 25 years for middle schools, upper-secondary schools, recognised unofficial special education in Ofek Hadash and "the academic colleges for training teaching employees"; 30 years for the other stages, listed as "kindergartens, primary, colleges for training teaching employees".

An academic college for training teaching employees is a college for training teaching employees, so the part of an employment there falls in both lists and earns the grant at 25 years and at 30. The text gives no college that is in the second list and not in the first, nor says that the second list means non-academic colleges.
"""
reading = "The more specific words govern: employment at an ACADEMIC teacher-training college earns the grant at 25 years, and the 30-year list's colleges are read as the teacher-training colleges that are not academic."
l4 = "l4/circulars/2023-24_tashpad_10.l4"
evidence = "`an academic teacher-training college is in both seniority lists`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-24_tashpad_10-d"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_d", "art_2__para_e__subpara_2", "art_2__para_e__subpara_2/p2"]
quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני תשלום מענק יובל · עובד הוראה שהשלים 25 או 30 שנות עבודה בישראל … ב1 - ביוני של אותה שנה נדונה … יזכה באותה שנה במענק יובל"
title = "Jubilee-grant seniority: as set in the September before the payment (2ד), or completed by 1 June (2ה.2)?"
body = """
Section 2ד grants the jubilee grant "according to the seniority set for the teaching employee in September of the year before the payment". Section 2ה.2 grants it "that year" to an employee who completed 25 or 30 years of work in Israel by 1 June of the year in question.

The grant is paid in June 2024's salary (2א). An employee whose seniority set in September 2023 was 24 years and who completed 25 years in, say, March 2024 has not reached the threshold by section 2ד and has reached it by section 2ה.2. The two clauses decide the same employee differently whenever the years are completed between September and 1 June.
"""
reading = "Section 2ה.2, the clarification that names the date, governs: the years completed by 1 June of the year of payment; section 2ד is read as naming the seniority record they are counted from."
l4 = "l4/circulars/2023-24_tashpad_10.l4"
evidence = "`2ד and 2ה.2 disagree for an employee completing the years between September and June`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-24_tashpad_10-e"
kind = "broken-reference"
stage = "writing"
keys = ["art_2__para_e__subpara_5", "art_1__para_i"]
quote = "לגבי עובד הוראה המועסק אצל יותר ממעסיק אחד יחולו הכללים האמורים בסעיפים 1ו' עד 1ח' לעיל, בשינויים המחויבים."
title = "The several-employers rule for the jubilee grant points at 1ו–1ח, which leave out the several-employers rule (1ט)"
body = """
Section 2ה.5 applies to a teaching employee employed by more than one employer "the rules in sections 1ו' to 1ח' above, with the necessary changes". Section 1ו is the table of recuperation days by seniority, 1ז the part-time rule and 1ח the rule for more than a full position at ONE employer. The rule for an employee of several employers — each employer pays in proportion to the position at it — is section 1ט, outside the range cited.

As cited, the range brings a recuperation-days table into the jubilee grant and leaves out the one rule written for several employers; read as 1ז–1ט, it would bring in exactly the position rules. The text does not say which.
"""
reading = "Section 1ט's rule applies to the jubilee grant: each employer pays the grant in proportion to the position at it, up to one position (2ה.4); the days table of 1ו is not applied."
l4 = "l4/circulars/2023-24_tashpad_10.l4"
evidence = "`2ה.5's range leaves out the several-employers rule`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
