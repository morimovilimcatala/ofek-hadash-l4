החוזר מפרסם את סכומי תוספת שקלית 2016 הצמודים למדד המחירים לצרכן לתקופה שמיום 1.1.2018 עד 31.5.2018 ולתקופה שאחריה (¶15). לתקופה 1.1.2018–31.5.2018 הוא נותן מועד סיום ומונה את הסכומים שהם מחליפים; לתקופה שאחריה הוא נותן 965.04 (ברפורמה) ו־751.18 (שאינם ברפורמה ומנהלים) "החל מיום 1.6.2018", בלי סוף ובלי סכום מוחלף.

ההסכמים שהחוזר נשען עליהם (¶13–¶14) משלמים את התוספת "במספר פעימות", והפעימה הבאה, ב־1.12.2018, קובעת סכומים חדשים. לפי פשוטו, החוזר מקבע את התוספת על נתוני 1.6.2018 ללא הגבלת זמן; בקריאה יחד עם ההסכמים, נתונים אלה תקפים רק עד הפעימה הבאה, והחוזר אינו אומר אם — ולפי איזה מדד — הפעימות המאוחרות צמודות.
