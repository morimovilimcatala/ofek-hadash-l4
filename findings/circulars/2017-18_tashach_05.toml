quote = "החל מיום 1.6.2018 סכום תוספת שקלית 2016 יעודכן ויעמוד על הסכומים כדלהלן"
title = "The linked amounts from 1.6.2018 have no end, though the supplement steps again on 1.12.2018"
body = """
The circular publishes the CPI-linked amounts of the 2016 shekel supplement "for the period 1.1.2018 to 31.5.2018 and for the period after it" (¶15). For 1.1.2018–31.5.2018 it gives an end date and names the amounts it replaces; for the period after, it gives 965.04 (reform) and 751.18 (outside the reform and principals) "from 1.6.2018" with no end and no amount replaced.

The agreements the circular relies on (¶13–¶14) pay the supplement "in several steps", and the next step, on 1.12.2018, sets new amounts. Read on its face, the circular fixes the supplement at the 1.6.2018 figures indefinitely; read with the agreements, those figures last only until the next step, and the circular does not say whether — or by what index — the later steps are linked.
"""
reading = "The 1.6.2018 amounts are encoded as the circular prints them, without an end; the evidence records that they then run past 1.12.2018. Applying the agreements' later steps is left to the circulars that publish them."
