[[finding]]
id = "F-2017-18_tashach_05-a"
kind = "gap"
stage = "writing"
keys = ["hc_1/p3", "hc_1/p11", "hc_1/p12", "hc_1/p13"]
quote = "החל מיום 1.6.2018 סכום תוספת שקלית 2016 יעודכן ויעמוד על הסכומים כדלהלן"
title = "לסכומים הצמודים החל מ־1.6.2018 אין סוף, אף שהתוספת עולה שוב ב־1.12.2018"
body = """
החוזר מפרסם את סכומי תוספת שקלית 2016 הצמודים למדד המחירים לצרכן לתקופה שמיום 1.1.2018 עד 31.5.2018 ולתקופה שאחריה (הפסקה "מטרת חוזר זה הינה לפרסם את ההוראות…"). לתקופה 1.1.2018–31.5.2018 הוא נותן מועד סיום ומונה את הסכומים שהם מחליפים; לתקופה שאחריה הוא נותן 965.04 (ברפורמה) ו־751.18 (שאינם ברפורמה ומנהלים) "החל מיום 1.6.2018", בלי סוף ובלי סכום מוחלף.

ההסכמים שהחוזר נשען עליהם (הפסקאות "בהתאם להסכמי השכר עם ארגון המורים…" ו"סעיף 4 להסכם הקיבוצי מיום, 23.3.2017…") משלמים את התוספת "במספר פעימות", והפעימה הבאה, ב־1.12.2018, קובעת סכומים חדשים. לפי פשוטו, החוזר מקבע את התוספת על נתוני 1.6.2018 ללא הגבלת זמן; בקריאה יחד עם ההסכמים, נתונים אלה תקפים רק עד הפעימה הבאה, והחוזר אינו אומר אם — ולפי איזה מדד — הפעימות המאוחרות צמודות.
"""
reading = "סכומי 1.6.2018 מקודדים כפי שהחוזר מדפיס אותם, בלי סוף; הראיה רושמת שהם נמשכים אז אל מעבר ל־1.12.2018. החלת הפעימות המאוחרות של ההסכמים נותרת לחוזרים שמפרסמים אותן."
l4 = "l4/circulars/2017-18_tashach_05.l4"
evidence = "`the 1.6.2018 amount runs on without an end`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2017-18_tashach_05-b"
kind = "ambiguity"
stage = "verification"
keys = ["hc_1/p10", "hc_1/p13"]
quote = "מורים שאינם ברפורמת עוז לתמורה ומנהלים"
title = "\"מורים שאינם ברפורמת עוז לתמורה ומנהלים\": האם \"שאינם ברפורמה\" מסייג גם את המנהלים?"
body = """
החוזר מדפיס את תוספת שקלית 2016 לשתי קבוצות: "מורים ברפורמת עוז לתמורה" ו"מורים שאינם ברפורמת עוז לתמורה ומנהלים".

את המילים של הקבוצה השנייה אפשר לנתח בשתי דרכים. בקריאה "(מורים שאינם ברפורמה) ו(מנהלים)", כל מנהל מקבל את הסכום השני. בקריאה "מורים ומנהלים שאינם ברפורמה", מנהל המועסק בעוז לתמורה אינו נכלל באף קבוצה — או נכלל בראשונה, אם "מורים" שם כולל אותו.

אותן מילים, "מורים שאינם ברפורמת עוז לתמורה ומנהלים", מודפסות בחוזרי תוספת שקלית 2016 לחטיבה העליונה מתשע"ח ואילך, והשאלה נרשמה עם אותה קריאה בכל אחד מהם עד תשפ"ד: F-2017-18_tashach_05-b (תשע"ח/5), F-2018-19_tashat_03-b (תשע"ט/3), F-2019-20_tashaf_03-a (תש"פ/3), F-2020-21_tashpa_05-a (תשפ"א/5), F-2021-22_tashpab_04-a (תשפ"ב/4), F-2022-23_tashpag_06-a (תשפ"ג/6) ו־F-2023-24_tashpad_05-a (תשפ"ד/5).
"""
reading = "כל מנהל, ברפורמה או שלא ברפורמה, מקבל את הסכום של הקבוצה השנייה: \"מנהלים\" נקרא כקבוצה בפני עצמה — הקריאה של F-2020-21_tashpa_05-a."
convention = "reading.qualifier"
l4 = "l4/circulars/2017-18_tashach_05.l4"
evidence = "`the two parses place a principal under Oz LaTmura differently`"
depends_on = ["F-2020-21_tashpa_05-a"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
