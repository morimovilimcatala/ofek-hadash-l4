[[finding]]
id = "F-2025-26_tashpo_02-j"
kind = "contradiction"
stage = "examples"
keys = ["att_5__hc_1/p15", "att_5__hc_1/p16", "att_5__hc_1/p17", "art_f__para_4-1__subpara_4-1-5", "art_f__para_4-1__subpara_4-1-4/p16"]
quote = "גננת עמיתה שעובדת 5ימים בשבוע6.08 , בכל יום, היקף משרתה יהיה עד ל90%- משרה בלבד כי בפועל היא עובדת 30.8ש\"ש"
title = "Annex E's associate teacher works 30.8 hours from five days of 6.08, and is put at 90% of 33.8"
body = """
Annex E's row 4 is an associate kindergarten teacher who works "5 days a week, 6.08 each day", whose position "will be up to 90% only, because she actually works 30.8 weekly hours", on a base of 33.8. Rows 5 and 6 carry the same 30.8.

Five days of 6.08 hours (4.1.4) are 30.4 hours, not 30.8. By 4.1.5 the position is the weekly hours over the base: 30.4 over 33.8 is 89.9% — the printed 90% — but 30.8 over 33.8 is 91.1%. The worked example therefore contradicts either the day length or the position formula it illustrates; rows 10 and 12 of the same annex count the five days as 30.4.
"""
reading = "The rule governs the example: five days of 6.08 are 30.4 hours, and the position is 30.4/33.8, about 90%."
l4 = "l4/circulars/2025-26_tashpo_02.l4"
evidence = "`row 4's hours are not five days of 6.08`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
