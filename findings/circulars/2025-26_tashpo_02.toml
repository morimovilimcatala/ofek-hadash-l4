quote = "כתב התחייבות להצטרפות לרפורמת אופק חדש בגני הילדים לחינוך מיוחד החל משנה\"ל תשפ\"ו · להחיל משנת הלימודים תשפ\"ה ואילך על עובדי ההוראה בכל גני הילדים לחינוך מיוחד שבבעלותי"
title = "The undertaking binds the owner from תשפ\"ו by its heading and from תשפ\"ה by its item 1"
body = """
The undertaking an owner signs to join Ofek Hadash is headed "undertaking to join the Ofek Hadash reform in special-education kindergartens from school year תשפ\"ו". Its item 1 binds the owner "to apply from school year תשפ\"ה onwards, to the teachers in all the special-education kindergartens I own, all the provisions of the Ofek Hadash agreement". The introduction (section 1) also has the institutions join "from school year תשפ\"ה", while the circular, its letter to the teachers (annex A) and its deadline of 31.8.2025 are all for joining in תשפ\"ו.

For an owner signing now, the document it signs puts the reform's work week and pay on two different first years, a whole school year apart.
"""
reading = "The undertaking binds from תשפ\"ו, the year the circular is for and its heading names; item 1's תשפ\"ה is read as the year the regulations first allowed joining."
l4 = "l4/circulars/2025-26_tashpo_02.l4"
evidence = "`the undertaking's heading and item 1 name different first years`"
