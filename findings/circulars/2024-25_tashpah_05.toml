title = "מענק הפרישה ניתן לכל היותר ל־75 פורשים בשנה, וגם מתחלק בין יותר מ־75"
body = """
§36 מזכה במענק פרישה "עד 75" עובדי הוראה בחטיבה העליונה בכל שנה, הנכללים במכסת הפרישה לפנסיה מוקדמת ועומדים בתנאיה. §37(ה) קובע דין לשנה שבה יותר מ־75 פורשים שבמכסה עומדים בתנאים: סכום המענק מופחת כך שהעלות הכוללת לא תעלה על 120,000 כפול 75, כלומר 9,000,000.

