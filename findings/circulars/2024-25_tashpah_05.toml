"""
reading = "הולכים לפי §37(ה): כל פורש העומד בתנאים מקבל תשלום, והמענק מופחת כדי לעמוד בתקציב השנתי (והיתרה שלא נוצלה מועברת הלאה, §37(ו)); \"עד 75\" שב־§36 נקרא כמספר שעליו נבנה התקציב, שכן אחרת §37(ה) לא היה חל לעולם."
l4 = "l4/circulars/2024-25_tashpah_05.l4"
evidence = "`§36 and §37(ה) disagree on a year of 100 eligible retirees`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

