# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2024-25_tashpah_05-a"
kind = "contradiction"
stage = "writing"
keys = ["art_36", "art_37__para_e"]
quote = "בכל שנה, עד 75 עובדי הוראה המועסקים בחטיבה העליונה … יהיו זכאים למענק פרישה · ככל שבשנת לימודים מסוימת יימצא כי מספר הפורשים … עולה על, 75 יופחת סכום מענק הפרישה המפורט לעיל"
title = "The retirement grant goes to at most 75 retirees a year, and is also spread over more than 75"
body = """
§36 makes "up to 75" upper-division teachers a year, who are in the early-pension quota and meet its conditions, entitled to the retirement grant. §37(ה) provides for the year in which more than 75 retirees in the quota meet the conditions: the grant is reduced so that the total cost does not exceed 120,000 × 75 = 9,000,000.

The two answer the same case differently. In a year with 100 eligible retirees on full positions, §36 pays 75 of them 120,000 and the other 25 nothing — and does not say which 75; §37(ה) pays all 100 a reduced grant of 90,000.
"""
reading = "§37(ה) is followed: every retiree who meets the conditions is paid, with the grant reduced to keep within the yearly budget (and the unused balance carried over, §37(ו)); §36's \"up to 75\" is read as the number the budget is built on, since §37(ה) would otherwise never apply."
l4 = "l4/circulars/2024-25_tashpah_05.l4"
evidence = "`§36 and §37(ה) disagree on a year of 100 eligible retirees`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_05-b"
kind = "contradiction"
stage = "examples"
keys = ["art_30__para_c", "art_30__para_c/p7", "art_30__para_c/p8", "art_30__para_c/p9"]
quote = "יתחלק … ובהתאם למספר יחידות הלימוד המבוצעות בכל אחת מהתוכניות, באופן יחסי למספר הכולל של היחידות במקצוע · ( 0.7 )1ש\"ש ו 0.4% -בעד הגשה לבחינת הסיום בתוכנית האקדמיזציה"
title = "§30(ג)'s second academisation example does not follow its own rule"
body = """
§30(ג) divides the reward for the external exam (about 70% of the material) between the units done in the academisation programme and those outside it, "in proportion to the total number of units in the subject". Its first example follows the rule: 2 units, external part 1.05 hours and 1.4%, one unit in the programme — 0.525 hour and 0.7% each, half of the external part.

The second example does not: 5 units, external part 2.45 hours and 1.4%, one unit in the programme. The rule gives the programme's unit 2.45 × 1/5 = 0.49 hour and 1.4% × 1/5 = 0.28%; the example gives it 0.7 hour and 0.4% — one fifth of the subject's whole reward (3.5 hours, 2%) — and 1.75 hours and 1% to the matriculation exam.
"""
reading = "The rule's words are followed (a share of the external part in proportion to the subject's units), which the first example also follows; the second example's figures are recorded as printed."
l4 = "l4/circulars/2024-25_tashpah_05.l4"
evidence = "`the second academisation example departs from the rule`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_05-c"
kind = "broken-reference"
stage = "writing"
keys = ["art_42__para_3/p2", "art_44__para_2"]
quote = "ובכל מקרה במועד תשלום המענק החד פעמי הקבוע בסעיף 7 להסכם מיום .23.9.2024 · בהתאם להוראות סעיף ( 7 יא) להסכם הקיבוצי, הניכוי של יתרת המקדמה"
title = "The strike deduction and the advance deduction point to \"section 7\" for the one-time grant, which this text sets in section 5"
body = """
§42.3 sets the deduction for the unpaid strike days of 6-8.9.2024 "in any case at the date of payment of the one-time grant fixed in section 7 of the agreement of 23.9.2024", and §44.2 deducts the rest of the advance "under section 7(יא) of the collective agreement", in the month the one-time grant is paid.

In the text this circular publishes as the agreement, the one-time grant is §5 and the deduction of the rest of the advance is §5(יא); §7 is the Oz 2023 shekel supplement, which has no subsection (יא) and no payment date of a grant. A reader of the circular cannot find, at the section named, the date the two deductions are tied to.
"""
reading = "Both references are read as to the one-time grant of §5, paid with October 2024's salary and no later than November 2024's (§5(ז)), and to the advance deduction of §5(יא); the numbering is presumably the signed agreement's, which the circular renumbered."
l4 = "l4/circulars/2024-25_tashpah_05.l4"
evidence = "`§42.3 and §44 cite a section that is not the grant's`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_05-d"
kind = "gap"
stage = "writing"
keys = ["art_40/p3", "art_40/p4", "art_40/p5", "art_40/p6", "art_33/p2", "art_10__para_a__subpara_4"]
quote = "-העסקה בהיקף של 22-25 שעות פרונטליות בשבוע 5 -ימי עבודה בשבוע · -העסקה בהיקף של 18-21 שעות פרונטליות 4 -ימים בשבוע"
title = "The work-days table stops at 25 frontal hours and skips the half-hours between its bands"
body = """
§40 amends takanon §6.3.17: a teacher's work is spread, at the teacher's request, over 5 days for 22-25 frontal hours, 4 for 18-21, 3 for 13-17 and 2 for 12 or fewer. Twenty-five frontal hours is a full position (§8(א)(3)), and §33 lets a teacher work up to 12 weekly hours beyond a full position by increasing it; such a teacher has more than 25 frontal hours and no row. The bands are also written in whole hours, while the agreement itself deals in half frontal hours (§10(א)(4)), so 21.5 or 17.5 frontal hours fall between two rows.
"""
reading = "No reading is imposed: the table is encoded as printed and returns no number of days outside its rows; a teacher above 25 hours is read, if anything, with the 5-day row, the most a week holds."
l4 = "l4/circulars/2024-25_tashpah_05.l4"
evidence = "`§40 has no row above 25 frontal hours`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
