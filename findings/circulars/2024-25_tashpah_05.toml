title = "הדוגמה השנייה של האקדמיזציה ב־§30(ג) אינה הולכת לפי הכלל שלו עצמו"
body = """
§30(ג) מחלק את גמול ההכנה לבחינה החיצונית (כ־70% מהחומר) בין יחידות הלימוד שבוצעו במסגרת תוכנית האקדמיזציה לבין אלה שמחוצה לה, "באופן יחסי למספר הכולל של היחידות במקצוע". הדוגמה הראשונה הולכת לפי הכלל: 2 יחידות, החלק החיצוני 1.05 ש"ש ו־1.4%, יחידה אחת בתוכנית — 0.525 ש"ש ו־0.7% לכל אחת, מחצית החלק החיצוני.

הדוגמה השנייה אינה הולכת לפיו: 5 יחידות, החלק החיצוני 2.45 ש"ש ו־1.4%, יחידה אחת בתוכנית. הכלל נותן ליחידה שבתוכנית 2.45 כפול חמישית, כלומר 0.49 ש"ש, ו־1.4% כפול חמישית, כלומר 0.28%; הדוגמה נותנת לה 0.7 ש"ש ו־0.4% — חמישית מכל הגמול של המקצוע (3.5 ש"ש, 2%) — ו־1.75 ש"ש ו־1% לבחינת הבגרות.

אותו כלל, באותה לשון, ואותה דוגמה של 5 יחידות, מופיעים בחוזר תשפ"ה/10 (`F-2024-25_tashpah_10-a`), והקריאה שם הפוכה משום שהטקסטים שונים במה שסביבם. בחוזר הזה יש דוגמה נוספת, הראשונה, של 2 יחידות שאחת מהן בתוכנית, והיא הולכת לפי לשון הכלל (0.525 ש"ש ו־0.7%, מחצית החלק החיצוני); ואין בו טבלה. בתשפ"ה/10 אין הדוגמה הזו, ובמקומה טבלה החוזרת על מספרי הדוגמה של 5 היחידות ומוסיפה שורה של ספרות (2 יחידות, אחת בתוכנית, 0.75 ש"ש ו־1%) הנוהגת כמוה. כאן המספרים שהחוזר עצמו מדפיס לחלוקה חלוקים ביניהם, ולכן לשון הכלל מכריעה; שם כל מספר שהחוזר מדפיס לחלוקה הולך בדרך האחרת.
"""
reading = "הולכים לפי לשון הכלל (חלק מן החלק החיצוני באופן יחסי ליחידות המקצוע), שגם הדוגמה הראשונה הולכת לפיו; הנתונים של הדוגמה השנייה נרשמים כפי שהם מודפסים. בחוזר תשפ\"ה/10 (`F-2024-25_tashpah_10-a`) הקריאה הפוכה, משום ששם אין דוגמה ההולכת לפי הכלל, וכל המספרים שהחוזר מדפיס הולכים בדרך האחרת."
