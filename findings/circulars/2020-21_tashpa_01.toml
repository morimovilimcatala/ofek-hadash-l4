quote = "להשלמת השכלה אקדמית תוך 4 שנים מהמועד בו חתם על ההתחייבות · תוך 4 שנים ממועד הצטרפותו לתנאי הרפורמה, יהיה זכאי להפרשי שכר (בין השכר שקבל לבין שכר עו\"ה אקדמאי באופק חדש) רטרואקטיבית מיום הצטרפות עו\"ה לרפורמה · למפרע ממועד החתימה על כתב התחייבות זה."
title = "The four years to complete a degree, and the back pay, start on two different days"
body = """
A non-academic teacher with up to 27 years joins on a commitment to complete an academic degree within four years. Section 3.3.1 and annex C ¶9 run the four years from the day he SIGNS the commitment. Section 3.3.4 and annex C ¶10 run them from the day he JOINS the reform. The salary differences owed for completing in time run back to the day of JOINING under 3.3.4, and to the day of SIGNING under annex C ¶10.

Where the teacher signs and joins on different days, the deadline and the back pay each have two answers: a teacher who completes 47 months after joining but 49 after signing is in time under one clause and late under the other.
"""
reading = "One start for both, the day of joining the reform: 3.3.4 is the clause that sets the entitlement, and the form follows the circular."
