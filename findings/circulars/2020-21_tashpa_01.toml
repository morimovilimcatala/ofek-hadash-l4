[[finding]]
id = "F-2020-21_tashpa_01-e"
kind = "contradiction"
stage = "examples"
keys = ["att_5__hc_1__para_1__subpara_a", "att_5__hc_1__para_1__subpara_b/p30", "att_5__hc_1__para_1__subpara_c", "att_5__hc_1__para_2__subpara_c/p23", "att_5__hc_1__para_3__subpara_c/p23"]
quote = "( 1.034 * ₪ 6,783.75 תוספת שחיקה) = ₪ 7,014.39 · A = )34+100(% x 7,014.39 = 9,399.29"
title = "The conversion examples multiply X by 1.034, which the formula does not"
body = """
Annex E gives the conversion formula A = X × (100 + Y) / 100, and defines X, the salary to convert, as the March salary at a full position in listed components. All three worked examples — a teacher, a first deputy, a principal — then multiply X by 1.034 ("תוספת שחיקה", an erosion supplement) before applying the formula, and print the A that results.

Neither the formula nor the definition of X has that factor, and the circular nowhere says what the erosion supplement is or when it applies. By the formula as written, the teacher's A is 9,090.23 shekels; the example prints 9,399.29.
"""
reading = "The examples' factor is applied, as the Ministry computes A, and kept as a named input of the conversion, since the circular gives no rule for it."
l4 = "l4/circulars/2020-21_tashpa_01.l4"
evidence = "`the formula alone does not give example 1's A`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
