kind = "ambiguity"
stage = "writing"
keys = ["att_5__hc_1__para_1__subpara_b/p13"]
quote = "למורים המלמדים בבית ספר יסודי, בכיתות ז' -ט', על בסיס 24ש\"ש (חט\"ב), מקדם ההמרה יגדל ב.12.5% -"
title = "\"The conversion coefficient grows by 12.5%\": by an eighth of itself, or by 12.5 points?"
body = """
Annex E says that for teachers of grades 7-9 in a primary school on a 24-hour base, "the conversion coefficient will grow by 12.5%". The coefficient Y is itself a percentage (17, 24, 27, 34 …), so the rise reads two ways: Y × 1.125, or Y + 12.5 percentage points. For a coefficient of 17 the first gives 19.125 and the second 29.5, and the converted salary, and so the grade, differ accordingly.
"""
reading = "A relative rise: the coefficient times 1.125."
l4 = "l4/circulars/2020-21_tashpa_01.l4"
evidence = "`the two readings of \"יגדל ב-12.5%\" differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
