Section 7.3 gives a teacher back from maternity leave whose position is "90% and above" a nursing hour a day off the stay hours for four months, and excludes 7.2 meanwhile. Section 7.4 gives such a teacher whose position is "79% to 90%" the stay-hour reduction of a part-time mother under 7.2. Section 7.5 forbids the two reductions together.

