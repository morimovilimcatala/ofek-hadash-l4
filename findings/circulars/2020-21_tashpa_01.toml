quote = "בדרגה בה השכר הינו הקרוב ביותר ל( A -שווה לו או גבוה ממנו). · השכר המשולב החדש למשרה מלאה הינו ₪ 17,961.60: בהתאם לרמת מורכבות, 8 והדרגה תהיה ד' לפי השכר לסגנים ראשונים אקדמאים."
title = "The deputy example is placed below A, which the placement rule does not allow"
body = """
Annex E places a converted salary at the grade whose salary is nearest A, "equal to it or above it". In the first deputy's worked example A is 18,136.311 shekels, and the deputy is placed at grade ד' at 17,961.60 — below A.

The rule does not say what happens where A is above every grade of the table; the example settles that case without saying so, by placing below A (ד' being the highest grade the circular's promotion tables give a deputy).
"""
reading = "Where no grade of the table reaches A, the employee is placed at the table's highest grade, as the example does; otherwise at the nearest grade equal to or above A."
l4 = "l4/circulars/2020-21_tashpa_01.l4"
evidence = "`example 2 places the deputy below A`"
read_by = "Claude (L4 encoder)"
