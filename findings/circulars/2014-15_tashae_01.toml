evidence = "`the two readings of \"10% בש\"ש\" differ for a 90% father`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2014-15_tashae_01-b"
kind = "contradiction"
stage = "verification"
severity = "medium"
severity_why = "זכות תלויה בזה — שבוע עבודה מקוצר באותו שכר — והחוזר מוסיף על סעיף 4(א) לחוק שוויון ההזדמנויות תנאי שאין בו: בת זוג שעובדת 80% לפחות. בינוני ולא חמור: החוזר אומר שהזכות ותנאיה הם הודעת המדינה \"כפי שבאה לידי ביטוי בפסק הדין\" של בית הדין הארצי לעבודה מיום 27.2.2013, שאינו בקורפוס; אם פסק הדין אישר את התנאים, בית משפט עשוי להשאיר אותם, ולכן השאלה שקולה."
keys = ["art_1", "art_2", "art_3"]
quote = "היקף משרתה /עבודתה של בת הזוג הוא לפחות .80%"
title = "משרת אם למורה אב: החוזר דורש שבת הזוג תעבוד 80% לפחות, וכל התנאים יחד; סעיף 4(א) לחוק שוויון ההזדמנויות מסתפק בבת זוג שעובדת ואינה משתמשת בזכות, או בילד בהחזקתו הבלעדית"
body = """
חוזר תשע"ה/1 נותן לעובד הוראה אב קיצור בעין של שבוע עבודתו, ובלבד שמתקיימים כל התנאים: בת זוגו עובדת כשכירה או כעצמאית (1), "היקף משרתה /עבודתה של בת הזוג הוא לפחות 80%" (2), היא אינה מקבלת את ההטבה לקיצור יום עבודה (3), יש לו ילד מתחת לגיל 14 (4), והוא עצמו מועסק בהיקף המינימלי, 79% (5).

סעיף 4(א) לחוק שוויון ההזדמנויות בעבודה נותן את הזכות ל"יום עבודה מקוצר בשל היות העובדת אם לילד" (4(ב)(2)) גם לעובד שבת זוגו "היא עובדת או עובדת עצמאית" ולא נעדרה מעבודתה מכוח זכאותה שלה — בלי היקף משרה — או, כחלופה, שהילד "נמצא בהחזקתו הבלעדית". תנאים 4 ו־5 הם תנאי האם עצמה (ילד עד 14, 79%), ובהם החוק מחייב גם את האב. תנאי 2 אינו בחוק: מורה במשרה מלאה, עם ילד בן 5, שאשתו עובדת בחצי משרה ואינה מקצרת את יום עבודתה, זכאי לפי החוק ואינו זכאי לפי החוזר. ומפני שהתנאים מצטברים, אב שהילד בהחזקתו הבלעדית ובת זוגו אינה עובדת אינו זכאי לפי החוזר, אף שסעיף 4(א)(2) הוא דרך בפני עצמה (ההסכם הכולל, §7(ג), מכסה ממנה את הגרוש עם חזקה ואת האלמן).

החוזר נותן לאב את הקיצור בעין בלבד ולא את התשלום שבא במקומו; תשלום כזה אינו ברשימה של סעיף 4(ב), וסעיף 3(ב) לחוק שומר עליו כזכות יתר של האם (המוסכמה instruments.parenthood-right) — שם החוזר אינו נותן פחות מהחוק.
"""
reading = "החוק גובר (`the ruling under the statutes' floor`): אב שבת זוגו עובדת או עצמאית ואינה מקצרת את יום עבודתה, בכל היקף משרה, או שהילד בהחזקתו הבלעדית, זכאי לקיצור באותם תנאים של ילד עד 14 ו־79% (`section 4 gives the father the right`); תנאי 2 נשאר כפי שהודפס."
l4 = "l4/circulars/2014-15_tashae_01.l4"
evidence = "`the circular's conditions take away the shortened day section 4(א) gives`"
