quote = "מורה אב יהיה רשאי לקצר מהיקף משרתו הקבוע, שיעור של עד 10% בש\"ש, כך שהיקף המשרה המקוצר (העבודה בפועל) לא יפחת מ .79%-"
title = "\"Up to 10% in weekly hours\" off the fixed position: 10% of his position, or 10% of a full one?"
body = """
Section 5(א) lets a pre-reform father (or an Ofek Hadash kindergarten teacher) shorten "from his fixed position a rate of up to 10% in weekly hours", so that the shortened position is not below 79%. The 10% reads two ways: as a tenth of HIS fixed position's hours, or as 10% of a full position expressed in weekly hours (2.4 of a full pre-reform position's 24).

The only example, 7(א), is a father at 100%, for whom the two coincide. For a father at 90% (21.6 hours) whose principal can set part hours, the first reading allows 2.16 hours off and the second 2.4 — two different working weeks, both above the 79% floor.
"""
reading = "10% of the father's own fixed position, the reading that keeps the shortening proportional to the position (\"מהיקף משרתו הקבוע\"); capped so the shortened position stays at 79% or more, and in whole hours where the principal cannot set part hours."
l4 = "l4/circulars/2014-15_tashae_01.l4"
evidence = "`the two readings of \"10% בש\"ש\" differ for a 90% father`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
