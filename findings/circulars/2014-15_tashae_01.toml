quote = "מורה אב יהיה רשאי לקצר מהיקף משרתו הקבוע, שיעור של עד 10% בש\"ש, כך שהיקף המשרה המקוצר (העבודה בפועל) לא יפחת מ-79%"
title = "\"עד 10% בש\"ש\" מהיקף המשרה הקבוע: 10% ממשרתו, או 10% ממשרה מלאה?"
body = """
סעיף 5(א) מתיר למורה אב המועסק לפי הסכמי טרום הרפורמה (או לגנן באופק חדש) "לקצר מהיקף משרתו הקבוע, שיעור של עד 10% בש"ש", כך שהיקף המשרה המקוצר לא יפחת מ־79%. את ה־10% אפשר לקרוא בשתי דרכים: כעשירית מהשעות של משרתו הקבועה שלו, או כ־10% ממשרה מלאה המבוטאים בשעות שבועיות (2.4 מתוך 24 של משרה מלאה טרום הרפורמה).

הדוגמה היחידה, 7(א), היא אב ב־100%, שלגביו שתי הקריאות מתלכדות. לגבי אב ב־90% (21.6 שעות) שמנהל בית הספר שלו יכול לקבוע חלקי שעות, הקריאה הראשונה מתירה קיצור של 2.16 שעות והשנייה 2.4 — שני שבועות עבודה שונים, שניהם מעל רצפת 79%.
"""
reading = "10% מהיקף המשרה הקבוע של האב עצמו, הקריאה ששומרת על קיצור יחסי למשרה (\"מהיקף משרתו הקבוע\"); בהגבלה שהיקף המשרה המקוצר יישאר 79% לפחות, ובשעות שלמות כשהמנהל אינו יכול לקבוע חלקי שעות."
convention = "amounts.base"
