keys = ["art_2__para_b", "art_3__para_1", "art_3__para_2"]
quote = "יעודכנו, החל ביום, 1.4.2013 בשיעור של .1.68269% … יעמוד על 5.75%החל ביום. )1.1.2012"
title = "The 5.75% level starts on 1.4.2013 and on 1.1.2012"
body = """
The circular implements the third instalment of the 2011 raise "בהשלמה לשיעור של 5.75%". Section 2ב updates the Ofek Hadash personal shekel supplements "from 1.4.2013" by 1.68269%, and section 3(1) raises the 2011 supplement to 5.75% "from 1.4.2013". But 2ב's own parenthesis says the total update of those supplements "will stand at 5.75% from 1.1.2012", and section 3(2) says the same of the '87 and '94 supplements, whose updated amounts it then prints.

Read by its own words, 3(2) puts the '87 and '94 supplements at their 5.75% amounts fifteen months before 3(1) puts the 2011 supplement there, and makes the April 2013 payment of section 4 owe arrears back to January 2012; read by 3(1) and 2ב's operative clause, nothing is owed before April 2013. The two dates give different amounts for every month from January 2012 to March 2013.
"""
reading = "1.4.2013 governs every part of the update: it is the date of each operative clause (\"יעודכנו … החל ביום\"), and section 4 orders payment in April or May 2013 with no word of arrears. The 1.1.2012 in the parentheses is read as not moving the effective date."
l4 = "l4/circulars/2012-13_tashag_06.l4"
evidence = "`the circular gives the 5.75% level two start dates`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
