kind = "ambiguity"
stage = "verification"
keys = ["art_a/p3", "art_a/p6", "art_a/p9"]
quote = "מורים שאינם ברפורמת עוז לתמורה ומנהלים"
title = "\"מורים שאינם ברפורמת עוז לתמורה ומנהלים\": האם \"שאינם ברפורמה\" מסייג גם את המנהלים?"
body = """
החוזר מדפיס את תוספת שקלית 2016 לשתי קבוצות: "מורים ברפורמת עוז לתמורה" ו"מורים שאינם ברפורמת עוז לתמורה ומנהלים".

את המילים של הקבוצה השנייה אפשר לנתח בשתי דרכים. בקריאה "(מורים שאינם ברפורמה) ו(מנהלים)", כל מנהל מקבל את הסכום השני. בקריאה "מורים ומנהלים שאינם ברפורמה", מנהל המועסק בעוז לתמורה אינו נכלל באף קבוצה — או נכלל בראשונה, אם "מורים" שם כולל אותו.

אותן מילים, "מורים שאינם ברפורמת עוז לתמורה ומנהלים", מודפסות בחוזרי תוספת שקלית 2016 לחטיבה העליונה מתשע"ח ואילך, והשאלה נרשמה עם אותה קריאה בכל אחד מהם עד תשפ"ד: F-2017-18_tashach_05-b (תשע"ח/5), F-2018-19_tashat_03-b (תשע"ט/3), F-2019-20_tashaf_03-a (תש"פ/3), F-2020-21_tashpa_05-a (תשפ"א/5), F-2021-22_tashpab_04-a (תשפ"ב/4), F-2022-23_tashpag_06-a (תשפ"ג/6) ו־F-2023-24_tashpad_05-a (תשפ"ד/5).
"""
reading = "כל מנהל, ברפורמה או שלא ברפורמה, מקבל את הסכום של הקבוצה השנייה: \"מנהלים\" נקרא כקבוצה בפני עצמה — הקריאה של F-2020-21_tashpa_05-a."
