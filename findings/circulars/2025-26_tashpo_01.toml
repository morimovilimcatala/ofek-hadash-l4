severity_why = "סעיף 44(ג) להסכם אופק חדש ברור: למורה בבית ספר לחינוך מיוחד הכולל כמה שלבי חינוך ההמרה נעשית לפי בסיס המשרה שבו הועסק ערב המעבר, והטבלה שלו נותנת למי שהועסק על בסיס 24 ש\"ש (חטיבת ביניים) 10 נקודות יותר מלמי שהועסק על בסיס 30 ש\"ש (יסודי). החוזר עצמו אומר שהדרגה נקבעת לפי שלב החינוך ערב ההצטרפות, ובכל זאת מדפיס רק את עמודת היסודי. ההסכם חל על הבעלויות דרך כתב ההתחייבות (נספח א'), וסעיף 18 של החוזר אומר שבסתירה חל ההסכם. בינוני ולא חמור: החוזר משמיט את העמודה ואינו קובע במפורש מקדם נמוך יותר, ואין בידינו טופס המרה (סעיף 47(ג)) או תלוש שמראים שהמשרד המיר כך. האוכלוסייה כאן ודאית יותר מבמקרה של תשפ\"ד/1: לפי סעיף 1 של החוזר כל בתי הספר לחינוך מיוחד שטרם הצטרפו מצטרפים מתשפ\"ה, ובבית ספר רב־שלבי מורי כיתות ז' ומעלה הועסקו לפי מבנה של חטיבת ביניים (סעיף 22(ב) להסכם). טופס המרה אחד כזה יהפוך את הממצא לחמור."
