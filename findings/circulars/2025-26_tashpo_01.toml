keys = ["art_5__para_5-5", "art_6__para_6-1", "art_6__para_6-3", "art_6__para_6-4"]
quote = "ובלבד שהיקף משרתו המצטבר לא יעלה על 100%בכלל העסקותיו (כלומר, בין אם מועסק בבי\"ס אחד ובין אם מועסק בשני בתי ספר) · עובדי הוראה המועסקים בשני מוסדות, ניתן לשבץ עד 106%מבלי להידרש לאישור במערכת זכאויות"
title = "Two schools: the cumulative position may not pass 100%, and may be placed up to 106% without approval"
body = """
§5.5 lets a teacher work in no more than two schools "provided that his cumulative position does not exceed 100% in all his employments (that is, whether employed in one school or in two)". §6.3 lets teachers employed in two institutions be placed "up to 106% without needing approval in the entitlements system", and §6.4 above 106% on a request.

For a teacher in two schools at 104%, §5.5 forbids the employment and §6.3 allows it without any request. §6.1's "as a rule up to 100%" and its exceptional cases could make §6 an exception to §5.5, but §5.5 names the two-school case expressly and admits no exception but health professions and approved subjects.
"""
reading = "Section 6 is read as the exception to §5.5's ceiling: above 100% is permitted in two institutions up to 106% without a request and beyond it on approval, within 42 hours a week."
l4 = "l4/circulars/2025-26_tashpo_01.l4"
evidence = "`5.5 forbids what 6.3 allows without a request`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

