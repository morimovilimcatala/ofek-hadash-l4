title = "מורה בבית ספר רב־שלבי לחינוך מיוחד שהועסק על בסיס 24 ש\"ש: החוזר מדפיס רק את מקדמי היסודי, ההסכם ממיר לפי בסיס המשרה — 10 נקודות יותר"
body = "נספח ד' לחוזר אומר שדרגת השכר נקבעת, בין השאר, \"בהתאם לשלב החינוך בו הועסק ערב ההצטרפות לרפורמה (יסודי, חטיבת בינים וכד')\", ומדפיס טבלת מקדמי המרה עם עמודה אחת, של בית ספר יסודי (17, 24, 20, 27). עד תשפ\"ג/2 הדפיסו החוזרים לבעלויות על בתי ספר לחינוך מיוחד גם את עמודת חטיבת הביניים (27, 34, 30, 37); מתשפ\"ד/2 (וגם בתשפ\"ה/1 ובחוזר הזה) היא חסרה.\n\nסעיף 44(ג) להסכם אופק חדש קובע: \"למורה בבית-ספר לחינוך מיוחד הכולל מספר שלבי חינוך תבוצע ההמרה על-פי בסיס המשרה בו הועסק ערב המעבר לרפורמה\". בבית ספר כזה מורי כיתות ז' ומעלה הועסקו לפי מבנה של חטיבת ביניים (סעיף 22(ב) להסכם; סעיף 4.3 של החוזר), כלומר על בסיס 24 ש\"ש, והמקדם שלהם הוא מעמודת חטיבת הביניים. מי שימיר אותם לפי העמודה היחידה שבחוזר ייתן להם 10 נקודות פחות. תוספת ה־12.5 שבחוזר אינה חלה עליהם: סעיף 49 מחריג במפורש בית ספר לחינוך מיוחד הכולל כמה שלבי חינוך.\n\nדוגמה: מורה אם עם 18 שנות ותק ושכר להמרה של 8,269.45 ₪ (כמו בדוגמה של תשפ\"ד/1), שלימדה את כיתות ז'-י\"ב בבית ספר רב־שלבי לחינוך מיוחד. לפי העמודה שבחוזר: 8,269.45 × 124% = 10,254.12 ₪, משובצת ב־10,570.86 ₪ (דרגה 5) בשורת הוותק 18. לפי סעיף 44(ג): 8,269.45 × 134% = 11,081.06 ₪, משובצת ב־11,363.67 ₪ (דרגה 6). ההפרש הוא דרגה שלמה, 792.81 ₪ בחודש בשכר הטבלאי (פחות מזה אחרי תוספת אופק 2022, שקטנה ככל שהדרגה עולה), והוא נשמר עד שהמורה מגיעה לדרגה העליונה."
reading = "ההסכם גובר (סעיף 18 של החוזר, וכתב ההתחייבות): מורה בבית ספר רב־שלבי לחינוך מיוחד מומר לפי בסיס המשרה שבו הועסק ערב המעבר, ולמי שהועסק על בסיס 24 ש\"ש — לפי עמודת חטיבת הביניים של סעיף 44(ג)."
