title = "The undertaking binds the owner from תשפ\"ו by its title and from תשפ\"ה by its text"
body = """
Annex A is the undertaking an owner signs to join Ofek Hadash. Its title: "undertaking to join the Ofek Hadash reform from school year תשפ\"ו". Its operative paragraph: "I undertake to apply from school year תשפ\"ה onwards … all the provisions of the Ofek Hadash agreement". Section 1 also has the institutions join "from school year תשפ\"ה", while §2.1.1 sets 31.8.2025 as the deadline "for joining in תשפ\"ו".

For an owner signing now, the document it signs puts its obligations — the work week and the reform's pay — on two different first years, and the difference is a whole school year of pay on reform terms.
"""
reading = "The undertaking binds from תשפ\"ו, the year the circular is for and its title names; the body's תשפ\"ה is read as the year the regulations first allowed joining."
l4 = "l4/circulars/2025-26_tashpo_01.l4"
evidence = "`the undertaking's title and body name different first years`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

