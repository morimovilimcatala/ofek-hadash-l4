[[finding]]
id = "F-2025-26_tashpo_01-k"
kind = "contradiction"
stage = "examples"
keys = ["att_4__hc_1__para_2__subpara_a", "att_4__hc_1__para_2__subpara_c/p22", "att_4__hc_1__para_2__subpara_c/p23", "att_4__hc_1__para_2__subpara_d/p2", "att_4__hc_1__para_3__subpara_a", "att_4__hc_1__para_3__subpara_c/p25", "att_4__hc_1__para_3__subpara_d/p2"]
quote = "שכר להמרה לאחר הכפלה בתוספת שחיקה: ( = 9,115.32₪תוספת שחיקה) 8,815.59 * 1.034 · 9,115.32 * 1.2 = 10,938.38 ₪"
title = "The conversion examples multiply by an \"erosion supplement\" of 1.034 that the conversion formula does not contain"
body = """
Annex D converts a first deputy's and a principal's salary by A = X × (100% + Y) / 100, defining X (the March salary for a full position) and Y (20% for a first deputy, 15% for a principal). The worked examples compute X (8,815.59 and 16,554.84) and then multiply it by 1.034, "תוספת שחיקה", before applying Y: 9,115.32 × 1.2 = 10,938.38 for the deputy and 17,117.71 × 1.15 = 19,685.37 for the principal. Neither the formula nor the definition of X or Y names an erosion supplement.

By the formula the deputy's A is 10,578.71; by the example 10,938.38. Because A decides the grade (the nearest table salary equal to or above it), the two can place the employee at different grades.

The principal's example is also one agora out with itself: 14,630.99 / 1.4 + 6,104.14 is 16,554.85 rounded (printed 16,554.84), and the next line's 17,117.71 is 16,554.85 × 1.034, not 16,554.84 × 1.034.
"""
reading = "The L4 reproduces the examples as printed (with the 1.034 factor, and X rounded half up to the agora) and keeps the formula's A beside them; which one decides is for the reviewer."
l4 = "l4/circulars/2025-26_tashpo_01.l4"
evidence = "`the deputy example converts more than the formula gives`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
