title = "מורה חונך בבית ספר יסודי עם 20 מתמחים: 48% לפי ההסכם, 7.2% לפי החוזר"
body = """
מקרה קצה: מה מקבל מורה באופק חדש שחונך 20 מתמחים בבת אחת?

ההסכם מיום 19.3.2017 (סעיף 39ב(ד) להסכם אופק חדש) משלם 2.4% מהשכר המשולב "עבור כל מתמחה" ואינו קובע תקרה; החוזר מוסיף "עד שלושה מתמחים", אבל חוזר אינו גובר על הסכם (הסתירה F-2025-26_tashpo_01-p). שום מסמך בקורפוס אינו מגביל את מספר המתמחים לחונך באופק חדש; הסכם עוז לתמורה מיום 14.3.2018 (סעיף 15.1) מגביל את שלו לשלושה בהסכם עצמו.

לכן ה־L4 משלם 48% מהשכר המשולב — 5,466.14 ₪ בחודש על שכר משולב של 11,387.80 ₪ — מול 7.2% (819.92 ₪) לפי החוזר.

גם הכלל "לכל היותר שני גמולי תפקיד" אינו מגביל אותו: החניכה היא גמול תפקיד אחד בכל מספר מתמחים, והכלל סופר גמולים ולא יחידות בתוך גמול. חונך של 20 מתמחים שמחנך גם כיתה מקבל 48% ועוד 10% — 58% מהשכר המשולב.
"""
