§2.1.1 sets 31.8.2025 as the last day to send the undertaking for תשפ\"ו. After it, owners who ask to join must add proof of operating by Ofek Hadash and of paying on the circular's terms, "provided that these institutions received a late licence, i.e. after 1.9".

The proviso answers only for an institution licensed after 1.9. An institution licensed in time whose owner misses the deadline is neither on time nor within the late-joining rule, and the circular does not say whether it may join late, must wait a year, or is barred.
"""
reading = "Late joining is open only to institutions licensed after 1.9, as the proviso says; for an institution licensed in time the L4 leaves the question undecided and reports it."
