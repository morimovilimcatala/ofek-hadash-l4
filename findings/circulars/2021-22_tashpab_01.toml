title = "The conversion example multiplies by an \"erosion supplement\" the conversion formula does not contain"
body = """
Annex ז states the conversion formula: A, the salary after conversion, is X, the salary to convert, times (100 + Y)%, Y being the conversion coefficient (16% for an academic kindergarten teacher). Section 1ב defines X as the March salary of the year before joining at a full position, from the listed components.

The worked example computes X = 6,105.38 / 0.9 = 6,783.75 and then, before applying the formula, multiplies it by 1.034, "an erosion supplement", to 7,014.39; A = 7,014.39 × 116% = 8,136.69. Neither the formula nor the definition of X mentions the supplement, its rate or whom it applies to. On the formula as stated, A is 6,783.75 × 116% = 7,869.15, and the placement on the salary table (the grade nearest A, equal or above) starts from a different A.
"""
reading = "The formula is encoded as stated (A = X × (100 + Y)%) and the example is reproduced with the supplement as an input of its own; whether the 3.4% applies to every conversion is not decided here."
