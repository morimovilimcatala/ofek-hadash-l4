[[finding]]
id = "F-2021-22_tashpab_01-e"
kind = "contradiction"
stage = "writing"
keys = ["art_f__para_3-3__subpara_3-3-1", "art_f__para_3-3__subpara_3-3-4", "att_3__hc_1/p10", "att_3__hc_1/p11"]
quote = "תוך 4 שנים מהמועד בו חתם על ההתחייבות · תוך 4 שנים ממועד הצטרפותו לתנאי הרפורמה, יהיה זכאי להפרשי שכר … רטרואקטיבית מיום הצטרפות · בתוך 4 שנים ממועד הצטרפותי לתנאי רפורמת אופק חדש, אהיה זכאי להפרשים … למפרע ממועד החתימה על כתב התחייבות זה"
title = "The four years to complete the degree, and the differences, each run from two different days"
body = """
A non-academic existing teacher with up to 27 years joins by committing to complete a degree within four years. Section 3.3.1 counts the four years from the day she SIGNED the commitment; section 3.3.4 counts them from the day she JOINED the reform, and pays the salary differences back to the day she joined. Annex ג, the commitment she signs, says both: she will complete the degree within four years of signing (¶10), and if she completes it within four years of joining she gets the differences back to the day she signed (¶11).

Signing and joining need not be the same day: the form is filed on its own deadline (31.12.2021) and asks for the date of joining separately. A teacher who joined in September, signed in December and completes the degree 47 months after signing is in time under 3.3.1 and annex ג ¶10 and late under 3.3.4 and annex ג ¶11 (51 months after joining); and the differences she is owed start on a different day depending on which clause is read.
"""
reading = "One start for both, the day of joining the reform (3.3.4, the clause that states the consequence): the four years run from joining and the differences go back to joining."
l4 = "l4/circulars/2021-22_tashpab_01.l4"
evidence = "`section 3.3.4 and annex ג decide the same teacher differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

