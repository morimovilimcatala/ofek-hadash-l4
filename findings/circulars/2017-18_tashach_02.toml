keys = ["hc_1/p14", "hc_1/p15", "hc_1/p16"]
quote = "הוא יוחזק כמי שנטל חלק בשביתה או בצעדים הארגוניים"
title = "An employee presumed to have joined the \"organisational measures\" is given no deduction rule"
body = """
¶14 orders the owners to deduct from the salary of teaching employees who took part in the strike the union announced in תשע"ח, by the hours they were absent, and ¶16 measures the deduction as the hours of absence times the hourly value.

¶15 then presumes that an employee who did not report attendance, and produced neither an approval of absence nor proof of presence, took part "in the strike OR in the organisational measures". Organisational measures appear nowhere else in the circular: it orders no deduction for them and gives no measure for one, and such measures need not involve any absence for ¶16 to count. Whether, and by how much, the presumption reduces the salary of an employee it places in the measures rather than the strike is not decided.
"""
reading = "The presumption is applied to the strike: an employee caught by it is treated as absent for the strike's hours and the ¶16 deduction is made; nothing further is deducted for organisational measures."
l4 = "l4/circulars/2017-18_tashach_02.l4"
evidence = "`organisational measures are presumed but given no deduction`"
