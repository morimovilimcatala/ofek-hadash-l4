severity_why = "המענק משולם פעם אחת או בכל שנה מהסף ואילך, והטקסט אינו אומר; המוסכמה `thresholds.or-more` מכריעה בקריאה."
keys = ["art_2__para_b", "art_2__para_e__subpara_2"]
quote = "בעל ותק מצטבר בהוראה של 25 או 30 שנה ומעלה · שהשלים 25 או 30 שנות עבודה … יזכה באותה שנה במענק יובל"
title = "האם מענק היובל משולם פעם אחת, או בכל שנה מ־25 או 30 שנה ואילך?"
body = """
§2ב משלם את מענק היובל לעובד הוראה בעל ותק מצטבר "של 25 או 30 שנה ומעלה". כשהוא נקרא לבדו, "ומעלה" הופך כל שנה שבה הוותק בסף או מעבר לו לשנת זכאות, כך שעובד בעל 27 שנה מקבל שוב. §2ה.2 מזכה עובד שהשלים 25 או 30 שנה "באותה שנה", כלומר מענק המשולם פעם אחת, עם השלמת הסף.

החוזר אינו אומר בשום מקום שהמענק משולם פעם אחת לכל סף, ושתי הקריאות שונות לגבי כל עובד שעבר את הסף וקיבל את המענק בשנה קודמת.

אותה שאלה עולה מאותן מילים ("30 שנה ומעלה", ומתשע"ב "25 או 30 שנה ומעלה") בחוזרי מענק היובל, והיא נרשמה עם אותה קריאה בכל אחד מהם: F-2006-07_tashsaz_06-d (תשס"ז/6), F-2007-08_tashsach_05-c (תשס"ח/5), F-2008-09_tashsat_09-e (תשס"ט/9), F-2009-10_tasha_03-e (תש"ע/3), F-2010-11_tashaa_02-d (תשע"א/2), F-2011-12_tashab_12-e (תשע"ב/12), F-2012-13_tashag_07-d (תשע"ג/7), F-2013-14_tashad_07-d (תשע"ד/7), F-2014-15_tashae_04-d (תשע"ה/4), F-2015-16_tashav_07-d (תשע"ו/7), F-2016-17_tashaz_05-d (תשע"ז/5), F-2017-18_tashach_04-e (תשע"ח/4), F-2018-19_tashat_06-e (תשע"ט/6), F-2019-20_tashaf_09-e (תש"פ/9), F-2020-21_tashpa_07-g (תשפ"א/7), F-2021-22_tashpab_06-d (תשפ"ב/6) ו־F-2022-23_tashpag_08-g (תשפ"ג/8).
"""
reading = "המענק משולם פעם אחת, בשנה שבה הושלם הסף (§2ה.2); \"ומעלה\" ב־§2ב נקרא ככולל ותק החוצה את הסף במהלך אותה שנה."
