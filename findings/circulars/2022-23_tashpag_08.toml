[[finding]]
id = "F-2022-23_tashpag_08-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובת הבראה בשיעור יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה(."
title = "Part-time recuperation: proportional to the position, or 1/10 per month of work?"
body = """
Section 1ד pro-rates the recuperation allowance of a part-time employee "in proportion to his position fraction that year" and adds, in brackets, "1/10 for each month of work". The clause names one measure (the position fraction) and the bracket another (months of work), without saying how they combine.

Read as written, the bracket gives 1/10 of the allowance per month worked, with no ceiling: a twelve-month year earns 12/10 of the allowance, and a full-position employee who worked five months earns half — although the clause speaks only of part-time employees. Read as a way of counting the year, the bracket only says ten months make a full year. The two readings give a different allowance to anyone whose year is not exactly ten months.
"""
reading = "The share is the position fraction, multiplied by the months worked at 1/10 each up to a ceiling of ten months (so a full school year gives the full share)."
l4 = "l4/circulars/2022-23_tashpag_08.l4"
evidence = "`section 1ד's tenths read two ways give different shares`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2022-23_tashpag_08-b"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_d", "art_2__para_e__subpara_2"]
quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני תשלום מענק יובל. · עובד הוראה שהשלים 25 או 30 שנות עבודה בישראל על-פי האמור להלן, ב1 - ביוני של אותה שנה נדונה (ובכלל זה ותק בגין שירות חובה בצה\"ל) יזכה באותה שנה במענק יובל."
title = "Jubilee seniority is counted in September of the year before (2ד) and on 1 June of the year of payment (2ה.2)"
body = """
Section 2ד grants the jubilee grant by the seniority "determined for the employee in September of the year before the grant is paid". Section 2ה.2 grants it in a given year to an employee who has completed 25 or 30 years of work by 1 June of that year.

The two dates are nine months apart. A junior-high teacher whose seniority in September 2022 was 24.5 years completes 25 years before 1 June 2023: section 2ה.2 grants the grant in June 2023, section 2ד does not (24.5 is under 25).
"""
reading = "Section 2ה.2 governs: the grant is won in the year the employee completes 25 or 30 years by 1 June, the clause that names the year in which it is won. Section 2ד's September seniority is read as the record the count starts from."
l4 = "l4/circulars/2022-23_tashpag_08.l4"
evidence = "`sections 2ד and 2ה.2 disagree on a teacher who completes 25 years in the spring`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2022-23_tashpag_08-c"
kind = "overlap"
stage = "writing"
keys = ["art_2__para_e__subpara_3"]
quote = "ובמכללות האקדמאיות להכשרת עו\"ה -הוותק המזכה במענק יובל הינו וותק מצטבר כהגדרתו לעיל, של 25 שנה. לגבי חלקיות ההעסקה אצל הבעלויות ביתר שלבי החינוך (גני ילדים, יסודי, מכללות להכשרת עו\"ה) הוותק המזכה במענק יובל הינו וותק מצטבר, כהגדרתו לעיל, של 30 שנה."
title = "A teacher-training college is in both the 25-year list and the 30-year list"
body = """
Section 2ה.3 sorts the seniority that earns the jubilee grant by stage: 25 years for the part of employment in junior high, upper division, recognized unofficial special education under Ofek Hadash "and the academic colleges for training teaching employees"; 30 years for the part in "the other stages of education (kindergartens, primary, colleges for training teaching employees)".

An academic teacher-training college is a college for training teaching employees, so the part of employment in it answers both lists, and the section gives it 25 years and 30 years at once. A teacher there with 27 years of seniority wins the grant under the first list and not under the second.
"""
reading = "The specific row governs: academic teacher-training colleges need 25 years, and the 30-year list's colleges are the non-academic ones — the 30-year list is \"the other stages\" (ביתר שלבי החינוך), i.e. those not already named."
l4 = "l4/circulars/2022-23_tashpag_08.l4"
evidence = "`an academic teacher-training college answers both lists`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
