title = "הבראה במשרה חלקית: יחסית למשרה, או 1/10 לכל חודש עבודה?"
body = """
סעיף 1ד קובע לעובד במשרה חלקית קצובת הבראה "בשיעור יחסי לחלקיות משרתו באותה שנה", ומוסיף בסוגריים "1/10 לכל חודש עבודה". הסעיף נוקב במידה אחת (חלקיות המשרה) והסוגריים במידה אחרת (חודשי עבודה), בלי לומר כיצד הן מצטרפות.

כשהם נקראים כפשוטם, הסוגריים נותנים 1/10 מהקצובה לכל חודש עבודה, בלי תקרה: שנה של שנים־עשר חודשים מזכה ב־12/10 מהקצובה, ועובד במשרה מלאה שעבד חמישה חודשים מזכה במחצית — אף שהסעיף מדבר רק על עובדים במשרה חלקית. כשהם נקראים כדרך לספור את השנה, הסוגריים אומרים רק שעשרה חודשים הם שנה מלאה. שתי הקריאות נותנות קצובה שונה לכל מי ששנתו אינה עשרה חודשים בדיוק.

אותו סעיף — "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה (1/10 לכל חודש עבודה)", ומתשע"ב "לקצובת הבראה בשיעור יחסי" — מופיע בכל חוזרי ההבראה של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-a`, `F-2007-08_tashsach_05-a`, `F-2008-09_tashsat_09-a`, `F-2009-10_tasha_03-b`, `F-2010-11_tashaa_02-a`, `F-2011-12_tashab_12-a`, `F-2012-13_tashag_07-b`, `F-2013-14_tashad_07-b`, `F-2014-15_tashae_04-a`, `F-2015-16_tashav_07-a`, `F-2016-17_tashaz_05-a`, `F-2017-18_tashach_04-a`, `F-2018-19_tashat_06-a`, `F-2019-20_tashaf_09-a`, `F-2020-21_tashpa_07-a`, `F-2021-22_tashpab_06-a`, `F-2023-24_tashpad_10-a`, `F-2024-25_tashpah_11-a`, `F-2025-26_tashpo_07-a`. ההבדל בניסוח בין "באופן יחסי" ל"בשיעור יחסי" אינו נוגע לשאלה, ולכן כולם מאמצים קריאה אחת.
"""
reading = "שני המדדים חלים יחד: החלק הוא חלקיות המשרה (לכל היותר משרה אחת, כפי שהחוזר קובע) כפול עשירית לכל חודש עבודה, ולכל היותר עשרה חודשים, כך ששנת לימודים מלאה נותנת את החלק המלא ולא יותר. הסוגריים אומרים כיצד נמנית \"חלקיות משרתו באותה שנה\": בעשיריות, על פני שנה בת עשרה חודשים; הם אינם מקדם עצמאי שעולה על השנה, ואינם המחשה בלבד. כשהמשרה משתנה במהלך השנה, כל חודש שוקל עשירית מהמשרה שהוחזקה בו (ובשנה של יותר מעשרה חודשים, הממוצע שלהן). זו הקריאה בכל חוזרי ההבראה, שבכולם הסעיף זהה."
l4 = "l4/circulars/2022-23_tashpag_08.l4"
