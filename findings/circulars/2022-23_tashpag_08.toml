"""
reading = "המדד של סעיף 2ב עצמו קובע את מה שנספר: ותק מצטבר בהוראה אצל המעסיקים, הבעלויות ובמוסדות החינוך הפורמאלי, כולל שירות צבאי, ועם שנות החופשה ללא תשלום שנרכשו לפי הבהרה 2ה(1), הנמנה עד 1 ביוני של שנת המענק (`F-2022-23_tashpag_08-b`). הבהרה 2ה(2) באה תחת הכותרת \"הבהרות\" של הכלל שמעליה ונוקבת ביום שעד אליו הוותק מושלם; היא מבהירה את הכלל ואינה קובעת זכאות אחרת, ולכן \"שנות עבודה בישראל\" שבה נקראות כאותו ותק. זו הקריאה בכל חוזרי מענק היובל. בחוזר הזה הקריאה נשענת גם על הבהרה 2ה(3), הנוקבת בשנים המזכות כוותק מצטבר \"כהגדרתו לעיל\"."
