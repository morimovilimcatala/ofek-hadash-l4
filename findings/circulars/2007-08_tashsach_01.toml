title = "היעדרות חודשית של 10% בדיוק מהמכסה אינה נכללת באף אחד משני הכללים"
body = """
החוזר קובע שני קיזוזים להיעדרות חודשית בשל שביתה: כאשר היא "פחות מ 10%" ממכסת העבודה הקבועה של עובד ההוראה, הקיזוז הוא רק משעות עבודתו בפועל; כאשר היא "תעלה על 10%", מקוזז גם החלק היחסי משעות החינוך והבגרות ומהתוספות האחוזיות הניתנות בגין תפקידים. היעדרות של 10% בדיוק אינה פחות מ־10% וגם אינה עולה עליהם, ולכן אף אחד מהסעיפים אינו מכריע בה, ושני הקיזוזים נבדלים לגביה בחלק היחסי של אותם תשלומים. כשהמכסות נמנות בשעות שלמות (חודש של 40 שעות, חודש של 30 שעות), 10% בדיוק הם מקרה רגיל.

אותן מילים מודפסות בסעיף 1.25.14 לתקנון, שהחוזרים מפנים אליו, ובחוזרי תשס"ח/1 ותש"ע/4, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-1.25-x, F-2007-08_tashsach_01-a ו־F-2009-10_tasha_04-a.
"""
