title = "A monthly absence of exactly 10% of the quota is in neither rule"
body = """
The circular sets two deductions for a month's strike absence: where it is "less than 10%" of the employee's fixed quota, only the hours actually taught are deducted; where it "exceeds 10%", the proportional part of the education and matriculation hours and of the role percentage supplements is deducted as well. An absence of exactly 10% is neither less than 10% nor more than it, so neither clause decides it, and the two deductions differ for it by the proportional part of those payments. With quotas counted in whole hours (a 40-hour month, a 30-hour one) exactly 10% is an ordinary case.
"""
reading = "The wider deduction needs the absence to EXCEED 10%; at exactly 10% only the hours taught are deducted."
