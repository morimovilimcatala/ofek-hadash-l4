title = "Annex ו, row 4: five days of 6.08 hours are 30.4, not the 30.8 the row prints"
body = """
4.1.4 sets a working day ending at 14:00 at 6.08 hours, and 4.1.5 the position as the weekly hours over the base. Annex ו's row 4 (a complementary kindergarten teacher, base 33.8, position 90%) says she "works 5 days a week, 6.08 each day; her position will be up to 90% only, because she actually works 30.8 weekly hours", and prints 30.8 as her hours.

Five days of 6.08 hours are 30.4 (as row 1 prints for a kindergarten head), and 30.4 / 33.8 is the row's 90%; 30.8 / 33.8 is 91.1%. The row's hours contradict both its own note and its own percentage. Rows 5 and 6 carry the same 30.8 forward (27.8 for a mother, 30.8 at 100%).
"""
reading = "A complementary teacher working five days to 14:00 works 30.4 hours, 90% of a 33.8-hour base; the annex's 30.8 is read as 30.4 (and row 5's 27.8 as 27.4)."
l4 = "l4/circulars/2022-23_tashpag_01.l4"
evidence = "`row 4's hours are not five days of 6.08`"
