body = """
Annex ז states the conversion as A = X × (100 + Y)%, and defines X as the salary for conversion: the listed March components the teacher would have received at 100% for her roles. Its worked example computes X so defined (₪6,783.75) and then multiplies it by 1.034, labelled "תוספת שחיקה" (an erosion supplement), before applying Y = 16%.

Neither the formula, nor the definition of X, nor any section of the circular provides for that factor. Applied as stated, the formula gives A = 6,783.75 × 116% = 7,869.15, not the example's 8,136.69 — a different salary to place in the table, and possibly a different grade.
"""
reading = "The example is read as showing an erosion factor of 1.034 that the conversion includes (the agreement's, not stated here); the encoding keeps the formula as stated with X as an input, and asserts the example with the factor it applies."
