title = "The non-academic's four years: from signing or from joining — and differences back to which?"
body = """
3.3.1: a non-academic with up to 27 years' seniority signs an undertaking to complete an academic degree "within 4 years from the date he signed the undertaking". 3.3.4: one who proves the degree "within 4 years from the date of joining the reform" gets the salary difference "retroactively from the day of joining". Annex ג, the form he signs (due 31.12.2022, after the school year has begun), has him undertake to finish within four years of SIGNING, and promises differences if he finishes within four years of JOINING, "retroactively from the date of signing this undertaking".

The circular states two start dates for the four years and two dates back to which the differences run; a degree completed between the two four-year marks is in time under one clause and late under the other.
"""
reading = "3.3.4 governs the entitlement it creates: four years from joining, differences back to joining; 3.3.1's four years from signing is read as the undertaking's own term, and annex ג's \"from signing\" as the form's error."
l4 = "l4/circulars/2022-23_tashpag_01.l4"
evidence = "`the four-year periods start on different dates`"
