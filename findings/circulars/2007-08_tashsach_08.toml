[[finding]]
id = "F-2007-08_tashsach_08-a"
kind = "gap"
stage = "writing"
keys = ["preamble/p14", "art_1", "art_5", "art_5/p2"]
quote = "לגמלאים שפרשו במהלך 3.7 – 2003 משכורות פנסיוניות ()0.5+ 3.2 · מ 84%מהפיצוי של 3.2 משכורות שניתן לפורשי ,2002"
title = "The accrued-pension list has no row for those who retired in 2002, the first year of the period"
body = """
The award carried out here is for "the second period", 1.1.2002–31.12.2007. Its compensation for accrued-pension retirees is listed by year of retirement, and the list runs from 2003 to 2007: 3.7 pension salaries (printed as 3.2 + 0.5) for 2003, then 4.2, 4.7 and 5.2, and 2.7 for 2007.

There is no row for 2002. Yet every row from 2003 to 2006 is printed as "3.2 +" an addition, and the explanation under the list measures the 2007 figure as 84% "of the compensation of 3.2 salaries given to those who retired in 2002". The circular thus relies on a 2002 entitlement it does not set: a teacher who retired on an accrued pension in 2002 finds nothing to be paid in this circular.
"""
reading = "The circular is encoded as printed: it pays nothing to 2002 retirees, and the 3.2 salaries ¶2 attributes to them are taken as given elsewhere (not by this circular)."
l4 = "l4/circulars/2007-08_tashsach_08.l4"
evidence = "`the list has no row for 2002`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2007-08_tashsach_08-b"
kind = "contradiction"
stage = "examples"
keys = ["art_5", "art_5/p2"]
quote = "לגמלאים שפרשו במהלך 2.7 – 2007 משכורות פנסיוניות · לכן הבוררים העניקו להם רק 84%מהפיצוי של 3.2 משכורות שניתן לפורשי ,2002"
title = "2007 retirees get 2.7 pension salaries, said to be 84% of 3.2 — which is 2.688"
body = """
The list gives those who retired in 2007 2.7 pension salaries. The paragraph under it explains the figure: the arbitrators granted them "only 84% of the compensation of 3.2 salaries given to those who retired in 2002".

84% of 3.2 is 2.688, not 2.7. The two statements of the same entitlement differ by 0.012 of a pension salary for every 2007 retiree, and the text does not say that 2.7 is a rounding of the 84% or which of the two the funds are to pay.
"""
reading = "The list's 2.7 is the operative figure — it is what the instruction to pay states — and the 84% is read as the arbitrators' reasoning, rounded."
l4 = "l4/circulars/2007-08_tashsach_08.l4"
evidence = "`84% of 3.2 is not the 2.7 printed for 2007`"
depends_on = ["F-2007-08_tashsach_08-a"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2007-08_tashsach_08-c"
kind = "broken-reference"
stage = "writing"
keys = ["preamble/p11"]
quote = "פסק בוררות לגבי התקופה 1.1.02 – 31.12.07 (להלן \"התקופה השניה\") (פורסם בחוזרים לבעלויות תשס\"ו 7/ותשס\"ח.)4/"
title = "The second period's award is said to be published in a circular of 2005-06"
body = """
The recital says the award for the second period (1.1.2002–31.12.2007) was published in the circulars to the owning bodies "תשס\"ו/7 and תשס\"ח/4". תשס\"ו is the school year 2005-06. The agreements on the second period were signed on 24.1.2008 and 21.2.2008 and the award itself was given on 14.4.2008, so no circular of 2005-06 can have published it.

The reference names a circular that cannot be the one meant, and the text does not show which circular was.
"""
reading = "Nothing in the operative instructions depends on the reference: the second award's terms are those this circular sets out, and circular תשס\"ח/4 is the only publication it names that could carry them."
l4 = "l4/circulars/2007-08_tashsach_08.l4"
evidence = "`the second award is said to be published in a circular two years older`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
