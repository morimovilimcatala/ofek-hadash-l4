body = """
§2ב משלם את מענק היובל לעובד הוראה בעל ותק מצטבר "של 25 או 30 שנה ומעלה". §2ה(2) משלם אותו לעובד הוראה שהשלים 25 או 30 שנות עבודה עד 1 ביוני "באותה שנה".

לבדו, §2ב מזכה כל עובד שהגיע לסף או עבר אותו, בכל שנה; §2ה(2) מזכה את העובד בשנה שבה הוא מגיע לסף. למורה בחטיבה העליונה בעל 28 שנות ותק, הראשון נותן מענק בשנת הלימודים תש"ף והשני אינו נותן.

