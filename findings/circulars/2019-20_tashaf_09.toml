§2(ה)(3) מחלק את שלבי החינוך לפי הוותק המזכה במענק יובל: 25 שנים לחטיבת הביניים, לחטיבה העליונה, לחינוך המיוחד המוכר שאינו רשמי באופק חדש "ובמכללות האקדמאיות להכשרת עו"ה"; 30 שנים ל"יתר שלבי החינוך" אצל הבעלויות "(גני ילדים, יסודי, מכללות להכשרת עו"ה)".

המכללות להכשרת עובדי הוראה עומדות בשתי הרשימות, כך שעובד הוראה במכללה שהוותק שלו 25–29 שנים זכאי לפי הראשונה ואינו זכאי לפי השנייה. הרשימה הראשונה אומרת מכללות "אקדמאיות" והשנייה אינה אומרת כך, אבל החוזר אינו מבחין בין השתיים ואינו מזכיר שום מכללה שאינה אקדמית.
"""
