body = """
§2(ד) נותן את מענק היובל "עפ"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני תשלום מענק יובל". §2(ה)(2) נותן אותו לעובד הוראה "שהשלים 25 או 30 שנות עבודה בישראל … ב־1 ביוני של אותה שנה". המענק משולם עם משכורת יוני 2020.

בין שני המועדים תשעה חודשים, והם מכריעים לגבי עובדי הוראה שונים. עובד הוראה שמשלים 25 שנים בין ספטמבר 2019 ל־1 ביוני 2020 — למשל במרץ — צבר פחות מ־25 שנים לפי הספירה של §2(ד) בספטמבר ואינו זכאי השנה, ואילו §2(ה)(2) עושה את אותו עובד הוראה זכאי השנה.
"""
