[[finding]]
id = "F-2019-20_tashaf_09-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d"]
quote = "זכאי לקצובת הבראה בשיעור יחסי לחלקיות משרתו באותה שנה ) 1/10 לכל חודש עבודה("
title = "A part position's recuperation allowance: by position fraction, or 1/10 per month worked?"
body = """
§1(ד) gives a part-time teacher the allowance "in proportion to his position fraction in that year", and adds in brackets "(1/10 for each month of work)". The two measures are different quantities: the first is the share of a full position, the second the number of months worked, at a tenth each.

They give different results. A half-position teacher who worked ten months gets one half by the position measure and the whole allowance (10 × 1/10) by the bracket; a full-position teacher who worked twelve months gets 1 by position and 12/10 by the bracket — more than a full allowance, which §1(ה) caps at one position. Nor does the clause say whether the bracket is a second factor to be multiplied with the position share.
"""
reading = "The position fraction governs (capped at one by §1(ה)); the bracket is read as an illustration of pro-rating within the ten-month school year, not as a second, independent factor."
l4 = "l4/circulars/2019-20_tashaf_09.l4"
evidence = "`§1(ד)'s two measures differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2019-20_tashaf_09-b"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_d", "art_2__para_e/p3"]
quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני תשלום מענק יובל · עובד הוראה שהשלים 25 או 30 שנות עבודה בישראל על-פי האמור להלן, ב 1 -ביוני של אותה שנה נדונה"
title = "The jubilee grant's seniority is fixed in the September before payment, and again on 1 June of the payment year"
body = """
§2(ד) grants the jubilee grant "by the seniority set for the teacher in September of the year before the grant is paid". §2(ה)(2) grants it to a teacher who "completed 25 or 30 years of work in Israel … on 1 June of that year". The grant is paid with June 2020's salary.

The two dates are nine months apart and decide different teachers. A teacher who completes 25 years between September 2019 and 1 June 2020 — say in March — has under 25 years by §2(ד)'s September count and is not entitled this year, while §2(ה)(2) makes the same teacher entitled this year.
"""
reading = "§2(ה)(2) governs: seniority completed by 1 June of the payment year, the specific \"in that year\" rule among the clarifications; §2(ד) is read as the general administrative default it refines."
l4 = "l4/circulars/2019-20_tashaf_09.l4"
evidence = "`§2(ד) and §2(ה)(2) disagree on a teacher completing 25 years in March`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2019-20_tashaf_09-c"
kind = "overlap"
stage = "writing"
keys = ["art_2__para_e/p4", "art_2__para_b"]
quote = "ובמכללות האקדמאיות להכשרת עו\"ה -הוותק המזכה במענק יובל הינו וותק מצטבר כהגדרתו לעיל, של 25 שנה · )גני ילדים, יסודי, מכללות להכשרת עו\"ה( הוותק המזכה במענק יובל הינו וותק מצטבר, כהגדרתו לעיל, של 30 שנה"
title = "Teacher-training colleges are given both 25 and 30 years for the jubilee grant"
body = """
§2(ה)(3) divides the stages by the seniority that earns the jubilee grant: 25 years for junior high, upper secondary, recognised-unofficial special education under Ofek Hadash, "and the academic colleges for training teaching employees"; 30 years for the owners' "other stages (kindergartens, primary, colleges for training teaching employees)".

The colleges for teacher training stand in both lists, so a college teacher with 25 to 29 years of seniority is entitled under the first and not under the second. The first list says "academic" colleges and the second does not, but the circular draws no distinction between the two and names no non-academic college.
"""
reading = "The first list governs the colleges — 25 years — because it names the academic colleges for teacher training expressly; the second list's \"colleges\" is read as a repetition the first displaces."
l4 = "l4/circulars/2019-20_tashaf_09.l4"
evidence = "`a college is given both 25 and 30 years`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
