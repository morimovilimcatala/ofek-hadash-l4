[[finding]]
id = "F-2024-25_tashpah_10-a"
kind = "contradiction"
stage = "examples"
keys = ["hc_1__hc_2__para_d/p63", "hc_1__hc_2__para_d/p66", "hc_1__hc_2__para_d/p67", "hc_1__hc_2__para_d/p68", "hc_1__hc_2__para_d/p76"]
quote = "גמול ההכנה לבחינת הבגרות החיצונית במקצוע (כ 70% -מגמול הבגרות הכולל למקצוע) יתחלק … באופן יחסי למספר הכולל של היחידות במקצוע · 0.7ש\"ש ו 0.4% -בעד הגשה לבחינת הסיום בתוכנית האקדמיזציה"
title = "The academisation rule and its own worked example split the reward differently"
body = """
The academisation rule divides the reward for the EXTERNAL exam (about 70% of the subject's reward) between the units done in the programme and those done outside it, "in proportion to the total number of units in the subject". For the circular's example — a 5-unit subject rewarded 3.5 hours and 2%, external part 2.45 hours and 1.4%, one unit in the programme — the rule gives the programme's unit 2.45 × 1/5 = 0.49 hour and 1.4% × 1/5 = 0.28%, leaving 1.96 hours and 1.12% for the matriculation exam.

The example, and the table beside it, give the programme's unit 0.7 hour and 0.4%, and the matriculation exam 1.75 hours and 1%: one fifth of the subject's WHOLE reward (3.5 × 1/5, 2% × 1/5), taken out of the external part. The table's literature row (2 units, one in the programme) does the same: 0.75 hour and 1%, half the whole reward of 1.5 hours and 2%. The rule and its example differ by 0.21 hour and 0.12% for the same teacher.
"""
reading = "The worked example and the table are followed — the programme's units take their share of the subject's whole reward, out of the external part — since they are the figures the payments are made by; the rule's own arithmetic is kept beside it."
l4 = "l4/circulars/2024-25_tashpah_10.l4"
evidence = "`the academisation rule and its example disagree`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_10-b"
kind = "contradiction"
stage = "examples"
keys = ["hc_1__hc_2__para_d/p6", "hc_1__hc_2__para_d/p7", "hc_1__hc_2__para_d/t1"]
quote = "גמול הבגרות למשימות הביצוע המבוקרות **35% · ספרות | 1יח\"ל | 0.7 | 1.4% | 0.3 | 0.6% | 1ש\"ש | 2% | 0.2 | 0.4% | 0.5 | 1% | 0.3 | 0.6% | 1 | 2%"
title = "The flexible programme's one-unit rows do not follow the 35-35-30 split their header states"
body = """
The flexible programme's table heads its columns with the split of the reward: controlled performance tasks "**35%", external exam 35%, alternative assessment 30%. Every row of two or three units follows it (for a 2-unit subject of 1.5 hours: 0.525, 0.525, 0.45).

The three one-unit rows — religious literature, religious Jewish thought, Druze culture and heritage — give the tasks 0.2 of 1 hour (20%), the external exam 0.5 (50%) and the alternative assessment 0.3 (30%). The "**" on the tasks' 35% marks a note that is printed nowhere in the circular, so nothing in the text explains the different split. By the header, a teacher of a one-unit subject would receive 0.35 hour for the tasks and 0.35 for the external exam; by the row, 0.2 and 0.5.
"""
reading = "The rows' figures are taken as stated for the one-unit subjects (which have a single controlled task, as their note says); the header's percentages are read as the split for subjects of two and three units."
l4 = "l4/circulars/2024-25_tashpah_10.l4"
evidence = "`the one-unit flexible rows leave the header's split`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_10-c"
kind = "gap"
stage = "writing"
keys = ["hc_1__hc_1__para_c/p1", "hc_1__hc_1__para_c/p8"]
quote = "גמול גמול גמול גמול גמול גמול · באחוזים בש\"ש באחוזים בש\"ש באחוזים בש\"ש"
title = "Every reward is printed in weekly hours and in percent, and the circular never says who is paid which"
body = """
Each table of the circular gives every part of the reward twice: as weekly hours (גמול בש"ש) and as a percentage (גמול באחוזים) — mathematics 3 units, 035381: 0.5 hour and 2%; language and expression: 2 hours and 4%. The general rules (ג) scale "the reward" by class size, and nothing in the circular says whether a given teacher is paid the hours, the percentage, or both, nor what the percentage is a percentage of.
"""
reading = "Both figures are kept as data and the choice between them is left as an input. The agreement of 23.9.2024, whose updates the circular says it adds (§10(ט) there), speaks of the percentage reward paid to teaching employees in Oz LaTmura, which suggests the percentage for them and the hours for the others; the circular itself does not say so."
l4 = "l4/circulars/2024-25_tashpah_10.l4"
evidence = "`every reward is given in two units`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
