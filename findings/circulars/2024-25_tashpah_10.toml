title = "כלל האקדמיזציה והדוגמה שלו עצמו מחלקים את הגמול באופן שונה"
body = """
כלל האקדמיזציה מחלק את גמול ההכנה לבחינה החיצונית (כ־70% מגמול הבגרות הכולל למקצוע) בין יחידות הלימוד שבוצעו במסגרת התוכנית לבין אלה שבוצעו מחוצה לה, "באופן יחסי למספר הכולל של היחידות במקצוע". לדוגמה של החוזר — מקצוע של 5 יחידות שגמולו 3.5 ש"ש ו־2%, החלק החיצוני 2.45 ש"ש ו־1.4%, יחידה אחת בתוכנית — הכלל נותן ליחידה שבתוכנית 2.45 כפול חמישית, כלומר 0.49 ש"ש, ו־1.4% כפול חמישית, כלומר 0.28%, ומשאיר 1.96 ש"ש ו־1.12% לבחינת הבגרות.

הדוגמה, והטבלה שלצדה, נותנות ליחידה שבתוכנית 0.7 ש"ש ו־0.4%, ולבחינת הבגרות 1.75 ש"ש ו־1%: חמישית מכל הגמול של המקצוע (3.5 כפול חמישית, ו־2% כפול חמישית), שנלקחת מן החלק החיצוני. שורת הספרות בטבלה (2 יחידות, אחת מהן בתוכנית) עושה אותו דבר: 0.75 ש"ש ו־1%, מחצית מכל הגמול של 1.5 ש"ש ו־2%. הכלל והדוגמה שלו נבדלים ב־0.21 ש"ש וב־0.12% לאותו מורה.

אותו כלל, באותה לשון, ואותה דוגמה של 5 יחידות, מופיעים בחוזר תשפ"ה/5, §30(ג) (`F-2024-25_tashpah_05-b`), והקריאה שם הפוכה משום שהטקסטים שונים במה שסביבם. שם יש דוגמה נוספת, של 2 יחידות שאחת מהן בתוכנית, והיא הולכת לפי לשון הכלל (0.525 ש"ש ו־0.7%, מחצית החלק החיצוני); ואין טבלה. בחוזר הזה אין הדוגמה הזו, ובמקומה הטבלה, החוזרת על מספרי הדוגמה של 5 היחידות ומוסיפה את שורת הספרות הנוהגת כמוה. כאן כל מספר שהחוזר מדפיס לחלוקה — הדוגמה, שורת מקצוע הבחירה ושורת הספרות — הולך בדרך אחת; שם המספרים של החוזר חלוקים ביניהם, ולשון הכלל מכריעה.
"""
reading = "הולכים לפי הדוגמה והטבלה — היחידות שבתוכנית מקבלות את חלקן מכל הגמול של המקצוע, מתוך החלק החיצוני — שכן כל המספרים שהחוזר מדפיס לחלוקה הולכים כך, והם מראים כיצד הוא קורא את לשון הכלל; החשבון של הכלל עצמו נשמר לצדם. בחוזר תשפ\"ה/5 (`F-2024-25_tashpah_05-b`) הקריאה הפוכה, משום שיש בו דוגמה ההולכת לפי לשון הכלל."
l4 = "l4/circulars/2024-25_tashpah_10.l4"
evidence = "`the academisation rule and its example disagree`"
