Section א sets the 2016 shekel supplement in two rows: "teachers in the Oz LaTmura reform" (₪1,554.68) and "מורים שאינם ברפורמת עוז לתמורה ומנהלים" (₪1,314.65). The second row reads two ways: "(teachers not in the reform) and principals", so that every principal takes ₪1,314.65; or "teachers and principals not in the reform".

On the second reading a principal employed under the reform's terms is in neither row and has no amount, although the circular says it applies to teaching employees in the reform and out of it alike. The readings differ by the whole supplement for every principal in the reform.
"""
