quote = "שיעור הפרשת המעסיק לרכיב תגמולים יגדל ב 0.5%-ויעמוד על; 6.5% · יגדל ב 0.5%-נוסף ויעמוד על; 7%"
title = "שיעור הפרשת המעסיק לתגמולים \"יגדל ב־0.5% ויעמוד על 6.5%\": שני מספרים המתיישבים רק מ־6%"
body = """
סעיף 3(א)(1) מגדיל את הפרשת המעסיק לרכיב תגמולים, החל ביום 1.1.2011, לכל קופת גמל לקצבה שאינה קרן פנסיה ותיקה (ובכלל זה ביטוח מנהלים, מחוץ לסעיף 3(ב)): היא "יגדל ב־0.5% ויעמוד על 6.5%". סעיף 3(א)(2) חוזר על אותה תבנית ל־1.1.2013: "0.5% נוסף" ו"7%".

שני המספרים אומרים אותו דבר רק לשיעור מעסיק של 6% לפני ההגדלה. מכל שיעור אחר הם נפרדים: מ־5%, הגדלה של 0.5% נותנת 5.5%, והשיעור הנקוב הוא 6.5%. החצי של העובד באותה פסקה מכריע בגרסה שלו לשאלה הזאת ("0.5%, או בשיעור הדרוש להשלמתו ל־5.5%, לפי הנמוך מביניהם"); החצי של המעסיק אינו מכריע.
"""
reading = "השיעורים הנקובים קובעים: 6.5% מ־1.1.2011 ו־7% מ־1.1.2013 (או מתחילת ההעסקה בתנאי עוז לתמורה ביישום מלא). לחצי של המעסיק, בשונה מהחצי של העובד שלצדו, אין \"לפי הנמוך מביניהם\", ולכן השיעור נקרא ככלל וההגדלה כתיאור שלו מה־6% המקובל."
