keys = ["art_3__para_a__subpara_1", "art_3__para_a__subpara_2"]
quote = "שיעור הפרשת המעסיק לרכיב תגמולים יגדל ב 0.5%-ויעמוד על; 6.5% · יגדל ב 0.5%-נוסף ויעמוד על; 7%"
title = "The employer's benefits rate \"rises by 0.5% and will stand at 6.5%\": two figures that agree only from 6%"
body = """
Section 3(א)(1) raises the employer's contribution to benefits, from 1.1.2011, for every provident fund that is not a veteran fund (managers' insurance included, outside section 3(ב)): it "rises by 0.5% and will stand at 6.5%". Section 3(א)(2) repeats the shape for 1.1.2013: "a further 0.5%" and "7%".

The two figures say the same only for an employer rate of 6% before the rise. From any other rate they part: from 5%, a rise of 0.5% gives 5.5% and the stated rate is 6.5%. The employee's half of the same paragraph settles its own version of this ("0.5%, or what completes it to 5.5%, whichever is lower"); the employer's half does not.
"""
reading = "The stated rates govern: 6.5% from 1.1.2011 and 7% from 1.1.2013 (or from full Oz LaTmura terms). The employer half, unlike the employee half beside it, has no \"whichever is lower\", which reads the rate as the rule and the rise as its description from the usual 6%."
l4 = "l4/circulars/2011-12_tashab_06.l4"
evidence = "`the employer's 3(א)(1) rise and its stated rate disagree from 5%`"
