עובד הוראה שיש לו שני מעסיקים ויותר ממשרה שלמה בסך הכול נכלל בשני הסעיפים. ב־70% אצל מעסיק אחד וב־60% אצל השני, 1ה נותן את הקצובה של משרה אחת (100%), ואילו 1ו נותן 70% מהראשון ו־60% מהשני — 130% בסך הכול. הטקסט אינו אומר איזה מהם גובר.
"""
