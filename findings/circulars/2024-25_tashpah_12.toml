quote = "חלה הגבלה על עובד הוראה לעבוד בהיקף משרה העולה על 140% משרה אצל כלל מעסיקיו, וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150% משרה"
title = "Two position limits for one principal: 140% for every teaching employee and 150% for a principal outside the reform"
body = """
§1.ו limits every teaching employee ("עובד הוראה") to 140% of a position across all employers, and in the same sentence limits a principal employed outside the reform to 150%. A principal is a teaching employee, so the paragraph gives that principal two limits; the reform teachers of its second paragraph (131.5% in full Oz LaTmura, 117% in Ofek Hadash) are teaching employees too and fall under the 140% as well.

The closing paragraph of §1 restates the limits as "140% משרה- ללא רפורמה", which narrows the 140% to employment outside the reform but still does not exclude the principal.
"""
reading = "Each named group's own limit governs it: 150% for a principal outside the reform, 131.5% and 117% for the reform teachers, and 140% for the other teaching employees outside the reform, as the closing paragraph states the 140%."
l4 = "l4/circulars/2024-25_tashpah_12.l4"
evidence = "`1.ו gives a principal outside the reform two limits`"
