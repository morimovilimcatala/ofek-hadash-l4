[[finding]]
id = "F-2024-25_tashpah_12-c"
kind = "contradiction"
stage = "verification"
severity = "medium"
severity_why = "תקרת המשרה האחת והכלל לכמה מעסיקים סותרים, אך הכלל המיוחד לכמה מעסיקים מכריע."
