# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2024-25_tashpah_12-a"
kind = "contradiction"
stage = "writing"
keys = ["art_4/p2", "art_4/p3", "art_4/t1"]
quote = "פיזיותרפיסט המועסק במשרה מלאה … יהיה זכאי … ל\"קצובת ביגוד לפיזיותרפיסטים\" בסך של 800 ₪ בלבד · מעל 50% | 824.70 ₪"
title = "A part-time physiotherapist is paid more than a full-time one, and a full position falls in both rules"
body = """
§4's second paragraph gives a physiotherapist employed full-time in Ofek Hadash or Oz LaTmura a physiotherapists' clothing allowance "of 800 ₪ only". Its third paragraph gives a part-time physiotherapist the allowance by the physical-education rules, and the table beside it pays 824.70 ₪ for a position "above 50%".

A physiotherapist on a 60% position is paid 824.70 ₪, more than the 800 ₪ a full-time one receives. And a full position is itself "above 50%", so it is given 800 ₪ by the second paragraph and 824.70 ₪ by the table.
"""
reading = "A full position is paid 800 ₪ by the second paragraph, which names it; the table governs part-time positions only, as the third paragraph says. The inversion for positions above 50% is left as printed."
l4 = "l4/circulars/2024-25_tashpah_12.l4"
evidence = "`the part-time table pays more than the full-time allowance above 50%`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
