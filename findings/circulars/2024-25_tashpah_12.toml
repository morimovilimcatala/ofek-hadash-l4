title = "שתי מגבלות משרה למנהל אחד: 140% לכל עובד הוראה ו־150% למנהל שלא לפי תנאי הרפורמה"
body = """
§1.ו מגביל כל עובד הוראה ("עובד הוראה") ל־140% משרה אצל כלל מעסיקיו, ובאותו משפט מגביל מנהל המועסק שלא עפ"י תנאי הרפורמה ל־150%. מנהל הוא עובד הוראה, ולכן הפסקה נותנת לאותו מנהל שתי מגבלות; גם המורים ברפורמה שבפסקה השנייה שלו (131.5% בעוז לתמורה ביישום מלא, 117% באופק חדש) הם עובדי הוראה ונופלים גם הם תחת ה־140%.

הפסקה המסיימת של §1 חוזרת על המגבלות כ"140% משרה- ללא רפורמה", וזה מצמצם את ה־140% להעסקה שלא ברפורמה, אך עדיין אינו מוציא את המנהל.

אותן מילים מודפסות בחוזרי קצובת הביגוד מתשע"ה עד תשפ"ו, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2014-15_tashae_07-f (תשע"ה/7), F-2015-16_tashav_08-f (תשע"ו/8), F-2016-17_tashaz_06-f (תשע"ז/6), F-2017-18_tashach_07-f (תשע"ח/7), F-2018-19_tashat_08-f (תשע"ט/8), F-2019-20_tashaf_11-a (תש"פ/11), F-2020-21_tashpa_08-b (תשפ"א/8), F-2021-22_tashpab_07-a (תשפ"ב/7), F-2022-23_tashpag_09-c (תשפ"ג/9), F-2024-25_tashpah_12-b (תשפ"ה/12) ו־F-2025-26_tashpo_08-c (תשפ"ו/8). בחוזר תשפ"ד/11 הנוסח שונה ("בתנאי טרום רפורמות עד 140% משרה"), והשאלה נרשמה שם כ־F-2023-24_tashpad_11-a, עם אותה קריאה למנהל.
"""
reading = "על כל קבוצה שנקובה בשמה חלה המגבלה שלה: 150% למנהל שלא לפי תנאי הרפורמה, 131.5% ו־117% למורים ברפורמה, ו־140% לשאר עובדי ההוראה שלא ברפורמה, כפי שהפסקה המסיימת קובעת את ה־140%."
