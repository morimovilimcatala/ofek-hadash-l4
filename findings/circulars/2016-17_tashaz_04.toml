title = "האם 176.70 ש\"ח של 1.4.2017 מועלים בעדכון המדד של ינואר 2017, או משולמים כפי שהם מודפסים?"
body = """
§1ב קובע את התוספת השקלית למשרה מלאה על 108.74 ש"ח מ־1.9.2016 עד 31.3.2017 ועל 176.70 ש"ח החל מ־1.4.2017. §1ד מעדכן את "סכום התוספת השקלית שייקבע כאמור לעיל" בכל ינואר החל מינואר 2017, לפי שיעור עליית מדד דצמבר לעומת המדד הקודם (הראשון נמדד מדצמבר 2015).

העדכון הראשון חל בינואר 2017, לפני שה־176.70 ש"ח נכנסים לתוקף. אם הם נקראים כבסיס שנקבע "לעיל", 176.70 מועלים באותו עדכון עם כניסתם לתוקף ב־1.4.2017; אם הם נקראים כסכום שנקבע מראש לאפריל 2017, הם משולמים כפי שהם מודפסים ומתעדכנים מינואר 2018. בעלייה של 2% שתי הקריאות נותנות 180.23 ו־176.70 ש"ח.

אותן מילים של סעיף העדכון ("סכום התוספת השקלית שייקבע כאמור לעיל") מודפסות גם בחוזר תשע"ז/3 לגני הילדים, לבתי הספר היסודיים ולחטיבות הביניים, והשאלה נרשמה שם עם אותה קריאה: F-2016-17_tashaz_03-a.
"""
reading = "כל עדכון חל על הסכום שבתוקף במועדו: העדכון של ינואר 2017 מעלה את 108.74 ש\"ח המשולמים מינואר עד מרץ 2017, ו־176.70 ש\"ח משולמים כפי שהם מודפסים מ־1.4.2017 ומתעדכנים מינואר 2018."
