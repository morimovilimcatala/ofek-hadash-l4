# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2016-17_tashaz_04-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_b__subpara_2", "art_1__para_d", "art_1__para_d/p2"]
quote = "החל ביום 1.4.2017 - 176.70 ש\"ח · החל מחודש ינואר 2017 יעודכן, אחת לשנה, בחודש ינואר (להלן: · \"מועד עדכון\"), סכום התוספת השקלית שייקבע כאמור לעיל"
title = "Is the 176.70 NIS of 1.4.2017 raised by January 2017's index update, or paid as printed?"
body = """
§1ב sets the full-position shekel supplement at 108.74 NIS from 1.9.2016 to 31.3.2017 and at 176.70 NIS from 1.4.2017. §1ד updates "the amount of the shekel supplement set as above" every January from January 2017, by the rise of the December index over the previous one (the first measured from December 2015).

The first update falls in January 2017, before the 176.70 NIS takes effect. Read as a base set "above", 176.70 is raised by that update when it takes effect on 1.4.2017; read as an amount fixed in advance for April 2017, it is paid as printed and updated from January 2018. With a 2% rise the two give 180.23 and 176.70 NIS.
"""
reading = "Each update applies to the amount in force on its date: January 2017's update raises the 108.74 NIS paid from January to March 2017, and the 176.70 NIS is paid as printed from 1.4.2017 and updated from January 2018."
l4 = "l4/circulars/2016-17_tashaz_04.l4"
evidence = "`§1ב(2)'s amount and §1ד's update give two readings`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2016-17_tashaz_04-b"
kind = "broken-reference"
stage = "writing"
keys = ["preamble/p14", "art_2__para_e__subpara_e"]
quote = "יוגדלו בשיעור של 0.625%ביחס לערכם השקלי ערב חתימת הסכם זה"
title = "\"This agreement\" in a circular that is not one and names two"
body = """
The second §2ה raises supplements '87 and '94 by 0.625% "in relation to their shekel value on the eve of the signing of this agreement". The document is a circular, not an agreement, and its recital names two agreements: the application agreement of 20.3.2016 and the implementation agreement of 23.3.2017. "This agreement" points to neither; the eve of one is a year before the eve of the other.

The amounts the paragraph then prints from 1.4.2017 settle the payment, but the base the rate is applied to — the rule a reader would check them by — has no date.
"""
reading = "The amounts printed are what is paid from 1.4.2017; \"this agreement\" is read as the later of the two, the implementation agreement of 23.3.2017, signed a week before the 1.4.2017 rise."
l4 = "l4/circulars/2016-17_tashaz_04.l4"
evidence = "`\"this agreement\" names none of the circular's agreements`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
