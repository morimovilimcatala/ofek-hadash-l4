התקופה החלופית של §1ה.8.2 אינה יכולה לחול לפי החוזר: רצף שמסתיים עד 31.1.2016 מתחיל לכל המאוחר ב־30.9.2015, ולכן מי שעומד בו היה זכאי למשכורת לפני 30.11.2015. החוזר תשע"ז/2, על החלק השני, חוזר על אותם תאריכים (F-2016-17_tashaz_02-d).
"""
