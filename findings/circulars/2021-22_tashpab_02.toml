kind = "contradiction"
stage = "writing"
keys = ["art_3__para_3-3__subpara_3-3-1", "art_3__para_3-3__subpara_3-3-4", "att_3__hc_1/p9", "att_3__hc_1/p10"]
quote = "להשלמת השכלה אקדמית תוך 4 שנים מהמועד בו חתם על ההתחייבות · תוך 4 שנים ממועד הצטרפותו לתנאי הרפורמה, יהיה זכאי להפרשי שכר … רטרואקטיבית מיום הצטרפות עו\"ה לרפורמה · אהיה זכאי להפרשים … למפרע ממועד החתימה על כתב התחייבות זה"
title = "The non-academic teacher's 4 years: counted from signing or from joining, and arrears from which date?"
body = """
§3.3.1 and annex ג ¶9 require the degree within 4 years of SIGNING the commitment. §3.3.4 and annex ג ¶10 pay the salary difference to a teacher who completes it within 4 years of JOINING the reform. And the arrears run back to the joining date under §3.3.4 but to the date of signing under annex ג ¶10.

The dates differ whenever the commitment is signed after the teacher's employment under the reform begins. A teacher who signs four months after joining and completes the degree 47 months after signing has kept the commitment (within 4 years of signing) but completed it 51 months after joining, so §3.3.4 denies the arrears; and had she completed in time, §3.3.4 and the form would pay arrears from different dates.
"""
reading = "§3.3.4, the clause that states the rule on arrears, governs both: the 4 years run from joining the reform and the arrears are paid from the joining date."
l4 = "l4/circulars/2021-22_tashpab_02.l4"
evidence = "`section 3.3.4 and annex ג decide the same teacher differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
