title = "A first deputy whose converted salary exceeds the top grade: the rule has no answer and the example places her below A"
body = """
Annex ה 2ה places a first deputy at the grade whose salary is nearest A, "equal to it or higher". The deputy example converts to A = ₪18,136.31 and places her at grade ד' with ₪17,961.60 — below A. Grade ד' is the deputies' top grade (§12.3's promotion table runs א' to ד'), so no grade satisfies the rule.

The circular does not say what happens when A exceeds every grade: the example places the deputy at the top grade without any supplement for the difference, while the principals' section (3ה) provides a personal supplement only for the part of the position above 100%.
"""
reading = "Where no grade's salary reaches A, the employee is placed at the top grade, as the example does; any difference is not paid, there being no clause that pays it."
