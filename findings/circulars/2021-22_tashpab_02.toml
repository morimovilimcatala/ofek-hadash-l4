אותה שאלה עולה, באותה לשון של הנוסחה ושל הגדרת `X`, בחוזרי ההמרה של השנים האחרות: `F-2019-20_tashaf_01-g`, `F-2020-21_tashpa_01-e`, `F-2021-22_tashpab_01-h`, `F-2022-23_tashpag_01-h`, `F-2022-23_tashpag_02-g`, `F-2023-24_tashpad_01-m`, `F-2023-24_tashpad_02-j`, `F-2024-25_tashpah_01-i`, `F-2025-26_tashpo_01-k`. בכולם הנוסחה אינה כוללת את המקדם ודוגמאות ההמרה של `A` מחילות אותו, ולכן כולם מאמצים קריאה אחת. ההבדל היחיד בין החוזרים: ב־`F-2023-24_tashpad_01-m` הדוגמה מכריזה על שיעור המקדם ומחילה אותו גם על `T` בשלב 2 של התוספת האישית, ובשאר החוזרים שיש בהם דוגמת תוספת אישית היא מכפילה את `T` במקדם ההמרה בלבד; גם שם המקדם אינו מופיע בשום נוסחה או הגדרה.
"""
