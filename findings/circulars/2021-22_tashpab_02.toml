title = "Are §6.2's criteria for working above 100% all required together, or alternatives?"
body = """
§6.2 allows employment above 100% "subject to the following criteria", listing five: work in a required subject (science, English, mathematics, physical education); a shortage of teachers in the area; an institution in a remote locality that struggles to recruit; the extra hours being frontal only; and no more than 8.5 hours a day and 42 a week.

The last two are conditions on any such employment. The first three are reasons a school may need it, and the list does not say whether they are cumulative. Read together, only a teacher of a required subject, in an area of shortage, in a remote locality qualifies; read as alternatives, any one of them does. A mathematics teacher in a central town without a shortage qualifies on one reading and not on the other.
"""
reading = "The first three criteria are alternatives (any one grounds the request); the frontal-only and hours limits apply to every request."
l4 = "l4/circulars/2021-22_tashpab_02.l4"
evidence = "`the two readings of the criteria decide one request differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

