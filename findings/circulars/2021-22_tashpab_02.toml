quote = "ובלבד שהיקף משרתו המצטבר לא יעלה על 100%בכלל העסקותיו (כלומר, בין אם מועסק בבי\"ס אחד ובין אם מועסק בשני בתי ספר) · אישור העסקה מעבר ל 100% -משרה יכול להינתן במקרים חריגים · מערכת שיבוץ תאפשר שיבוץ חריג עד להיקף משרה של 117%משרה"
title = "§5.4 caps every teacher at 100% in all employments; §6 lets a teacher work up to 117% and beyond"
body = """
§5.4 lets a teaching employee work in no more than two schools "provided that his cumulative position does not exceed 100% in all his employments (that is, whether employed in one school or in two)", excepting only health professionals and subjects the teaching-staff division allows in more schools. §6 then provides for employment above 100%: exceptionally, by approval and criteria (§6.2), up to 117% through the placement system (§6.3), and beyond 117% by the division's head office (§6.4).

For a teacher of a required subject approved to work 110% in one school, §6 permits the employment and §5.4, whose words reach one school as well as two, forbids it. Neither section names the other as its exception.
"""
reading = "§6 is the exception to §5.4's 100% (as §6.1's \"as a rule up to 100%\" signals): §5.4 limits the number of schools and the ordinary total, and an employment approved under §6 may exceed 100%."
l4 = "l4/circulars/2021-22_tashpab_02.l4"
evidence = "`sections 5.4 and 6 decide 110% in one school differently`"
depends_on = ["F-2021-22_tashpab_02-b"]
