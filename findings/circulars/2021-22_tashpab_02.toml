title = "דוגמאות ההמרה מכפילות ב\"תוספת שחיקה\" של 3.4% שהנוסחה אינה כוללת"
body = """
נספח ה' קובע את נוסחת ההמרה: `A` שווה ל־`X` כפול מאה ועוד `Y` אחוזים, כש־`X` הוא השכר להמרה (המוגדר ב־1ב כשכר חודש מרץ במשרה של 100% מן הרכיבים המנויים) ו־`Y` הוא מקדם ההמרה. כל אחת מהדוגמאות — של עובד ההוראה, של הסגן הראשון ושל המנהל — מכפילה את `X` ב־1.034, "תוספת שחיקה", לפני החלת `Y`. אף סעיף בחוזר אינו מזכיר תוספת שחיקה.

