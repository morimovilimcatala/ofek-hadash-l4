keys = ["att_5__hc_1__para_1__subpara_a", "att_5__hc_1__para_1__subpara_b/p30", "att_5__hc_1__para_1__subpara_c/p2"]
quote = "( 1.034 * ₪ 6,783.75 תוספת שחיקה) = ₪ 7,014.39"
title = "The conversion examples multiply by a 3.4% \"erosion supplement\" the formula does not contain"
body = """
Annex ה states the conversion formula as A = X × (100 + Y)%, with X the salary to convert (defined in 1ב as the March salary at 100% from listed components) and Y the conversion coefficient. Every worked example — the teacher's, the first deputy's and the principal's — multiplies X by 1.034, "תוספת שחיקה", before applying Y. No clause of the circular mentions an erosion supplement.

By the formula as stated, the teacher example's A is ₪6,783.75 × 134% = ₪9,090.23; the annex prints ₪9,399.29, which is reproduced only with the 1.034 factor. The grade the teacher is placed in follows from A, so the two give different placements.
"""
reading = "The examples are taken to show the conversion as applied: the encoding reproduces them with the erosion supplement, and records that the formula and the definition of X omit it."
l4 = "l4/circulars/2021-22_tashpab_02.l4"
evidence = "`the conversion examples apply a supplement the formula does not state`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

