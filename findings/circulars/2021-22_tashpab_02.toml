title = "סגנית ראשונה ששכרה המומר עולה על הדרגה העליונה: לכלל אין תשובה, והדוגמה משימה אותה מתחת ל־`A`"
body = """
סעיף 2ה בנספח ה' משים סגן ראשון בדרגה שבה השכר הוא הקרוב ביותר ל־`A`, "שווה לו או גבוה ממנו". דוגמת הסגנית ממירה ל־`A` של 18,136.31 ₪ ומשימה אותה בדרגה ד' עם 17,961.60 ₪ — מתחת ל־`A`. דרגה ד' היא הדרגה העליונה של הסגנים (טבלת הקידום של §12.3 נעה מא' עד ד'), ולכן אין דרגה העומדת בכלל.

