quote = "אין להעסיק עובד הוראה מעבר להיקף המשרה המקסימאלי המותר (-150% /140% מורה/מנהל)"
title = "היקף המשרה המקסימאלי \"150%/140% מורה/מנהל\": איזה מהשיעורים הוא של המורה?"
body = """
סעיף 3 אוסר להעסיק עובד הוראה מעבר להיקף המשרה המקסימאלי, ומציג אותו כשני שיעורים מול שני תפקידים, "150%/140%" ו"מורה/מנהל", המוצמדים זה לזה רק לפי סדרם. השיעורים הם רצף משמאל לימין בתוך שורה מימין לשמאל, ולכן סדרם תלוי בכיוון שבו הם נקראים: בסדר הקריאה של הטקסט 150% בא ראשון, ובדף המודפס, הנקרא מימין לשמאל, 140% בא ראשון.

בהצמדת ראשון לראשון, לפי קריאה אחת היקף המשרה המקסימאלי של מורה הוא 150% ושל מנהל 140%; לפי הקריאה האחרת של מורה 140% ושל מנהל 150%. מורה המועסק ב־145% משרה נמצא בתוך המגבלה לפי הקריאה הראשונה ומעבר לה לפי השנייה. החוזר אינו אומר בדרך אחרת איזה תפקיד נושא איזה שיעור.
"""
reading = "הדף כפי שהוא מודפס, נקרא בכיוונו שלו: היקף המשרה המקסימאלי של מורה הוא 140% משרה ושל מנהל 150%."
l4 = "l4/circulars/2008-09_tashsat_06.l4"
evidence = "`the two orders pair the figures with the posts differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
