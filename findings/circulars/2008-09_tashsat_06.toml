keys = ["art_3/p4"]
quote = "אין להעסיק עובד הוראה מעבר להיקף המשרה המקסימאלי המותר (-150% /140% מורה/מנהל)"
title = "The maximum position \"150%/140% teacher/principal\": which figure is the teacher's?"
body = """
Section 3 forbids employing a teaching employee beyond the maximum position and gives it as two figures against two posts, "150%/140%" and "מורה/מנהל" (teacher/principal), paired only by their order. The figures are a left-to-right run inside a right-to-left line, so their order depends on the direction they are read in: in the text's reading order 150% comes first, and on the printed page, read right to left, 140% comes first.

Paired first with first, the one reading makes a teacher's maximum 150% and a principal's 140%; the other a teacher's 140% and a principal's 150%. A teacher employed at 145% of a position is within the limit under the first and beyond it under the second. The circular does not otherwise say which post carries which figure.
"""
reading = "The page as printed, read in its own direction: a teacher's maximum is 140% of a position and a principal's 150%."
l4 = "l4/circulars/2008-09_tashsat_06.l4"
evidence = "`the two orders pair the figures with the posts differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
