title = "A new kindergarten teacher at 40%: section 3.4 joins her to the reform, section 5.2 does not employ her on it"
body = """
Section 3.4 sets the joining conditions of a new academic teacher in a kindergarten joined to the reform: a teaching certification and employment of a third of a position or more — and she "will be joined". Section 5.2 says a new kindergarten teacher "will not be employed" on the reform below 50% (a third in the internship year) unless the head of the teaching-staff division approved the employment and its work week.

A new certified academic kindergarten teacher at 40% without that approval meets every condition of 3.4 and is joined, and is below 5.2's floor. Section 3.6.1 makes joining a duty for every teacher who meets the conditions, so the text leaves no third way: under 3.4 she must be employed on the reform, under 5.2 she may not be.
"""
reading = "Section 5.2, the specific clause on a new kindergarten teacher's scope, governs her: below 50% (a third for an intern) she is employed on the reform only with the division head's approval; 3.4's third applies to the other new teachers."
l4 = "l4/circulars/2020-21_tashpa_04.l4"
evidence = "`3.4 joins a new teacher at 40% whom 5.2 does not employ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

