[[finding]]
id = "F-2020-21_tashpa_04-a"
kind = "contradiction"
stage = "examples"
keys = ["art_4__para_4-1__subpara_4-1-1/t1", "att_6__hc_1"]
quote = "4.1.1 בסיס המשרה … 30.8 … 33.4 · 30.4גננת משלימה שעובדת 5ימים בשבוע6.08 , 90 33.8 5 .4גננת משלימה"
title = "Annex F's job bases are not the ones section 4.1.1 sets"
body = """
Section 4.1.1 sets the kindergarten teacher's job base in a table: under 50, 30.8 hours for the managing teacher and 33.4 for the complementary teacher; 28.8 and 31.4 at 50-55 (and for a new teacher of 55 and over); 26.8 and 29.4 for an existing teacher of 55 and over. Section 4.1.5 computes the position as the weekly hours over that base.

Annex F, "the work-week table of kindergarten teachers in אופק חדש and the employment options by job base", prints a different base in every row that has a 4.1.1 counterpart, each 0.4 hours off: 30.4 for the managing teacher, 33.8 for the complementary teacher, 28.4 and 31.8 at 50-55 and for the new teacher of 50 and over, 26.4 and 29.8 for the existing teacher of 55 and over. Its own arithmetic runs on its own bases: row 4's complementary teacher works 30.4 hours and is at 90%, which is 30.4/33.8; on 4.1.1's base of 33.4 she would be at 91%. The two parts of the circular therefore give the same teacher in the same kindergarten two positions and two salaries.

Read on the page (pp. 8, 25-26): the figures are as printed.
"""
reading = "Section 4.1.1, the clause that sets the job base, governs, and the position is computed by 4.1.5 on its bases; annex F is read as an illustration of that arithmetic, not as a second table of bases."
l4 = "l4/circulars/2020-21_tashpa_04.l4"
evidence = "`annex F and 4.1.1 give different bases`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

