The circular attaches annex C, the declaration and commitment of a kindergarten teacher without an academic degree to complete one, and annex D, the request of a teacher with a degree and without a teaching certificate to join by exception. The owner's commitment (item 5) names them that way round: the academic-studies commitment in annex C and a teaching-certificate commitment in annex D.

