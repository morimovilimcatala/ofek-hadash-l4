title = "The nursing hour comes off stay hours, which a kindergarten teacher does not have"
body = """
Section 7.4 gives a teaching employee back from maternity leave, at 90% or more, four months of one hour a day "off the stay hours (in all, five stay hours a week)", with no cut in pay or position. The section speaks of every teaching employee of the circular, kindergarten teachers included.

Section 4.1.2 makes the managing and the complementary kindergarten teacher's position "frontal hours only". Only the health professionals and arts therapists have stay hours (section 4.2ג, seven a week). For a kindergarten teacher the reduction has nothing to come off, and the text does not say whether she gets the hour from her frontal hours, gets it some other way, or does not get it.
"""
reading = "The kindergarten teacher gets the nursing hour off her frontal hours (five a week), pay and position uncut — the entitlement 7.4 grants every teaching employee, taken from the only hours she has."
l4 = "l4/circulars/2020-21_tashpa_04.l4"
evidence = "`a kindergarten teacher has no stay hours to take the nursing hour from`"
read_by = "Claude (L4 encoder)"
