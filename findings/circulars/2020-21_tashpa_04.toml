kind = "contradiction"
stage = "writing"
keys = ["art_3__para_3-3__subpara_3-3-1", "art_3__para_3-3__subpara_3-3-4", "att_3__hc_1/p10", "att_3__hc_1/p11"]
quote = "תוך 4 שנים מהמועד בו חתם על ההתחייבות · תוך 4 שנים ממועד הצטרפותו לתנאי הרפורמה, יהיה זכאי להפרשי שכר … רטרואקטיבית מיום הצטרפות · בתוך 4 שנים ממועד הצטרפותי לתנאי רפורמת אופק חדש, אהיה זכאי להפרשים … למפרע ממועד החתימה על כתב התחייבות זה"
title = "The four years to complete the degree, and the differences, each run from two different days"
body = """
A non-academic existing teacher with up to 27 years joins by committing to complete a degree within four years. Section 3.3.1 counts the four years from the day she SIGNED the commitment; section 3.3.4 counts them from the day she JOINED the reform, and pays the salary differences back to the day she joined. Annex C, the commitment she signs, says both: she will complete the degree within four years of signing (¶10), and if she completes it within four years of joining she gets the differences back to the day she signed (¶11).

Nothing makes signing and joining the same day: the circular dates joining by the Ministry's approval, and the commitment is filed on its own deadline (31.1.2021) — the annex's own form asks for both dates separately. A teacher who completes the degree between the fourth anniversary of the earlier day and that of the later one is in time under one clause and late under the other, and the differences she is owed start on a different day depending on which clause is read.
"""
reading = "One start for both, the day of joining the reform (3.3.4, the clause that states the consequence): the four years run from joining and the differences go back to joining."
l4 = "l4/circulars/2020-21_tashpa_04.l4"
evidence = "`the four years and the differences each start on two days`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

