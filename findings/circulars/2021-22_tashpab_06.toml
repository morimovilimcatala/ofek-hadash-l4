body = """
§2ד מעניק את מענק היובל לפי הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני תשלום המענק. §2ה.2 מעניק אותו בשנה שבה העובד משלים 25 או 30 שנה עד 1 ביוני של אותה שנה.

בין שני המועדים תשעה חודשים. עובד שחוצה את הסף בין קביעת הוותק בספטמבר לבין 1 ביוני — למשל, 24 שנים ו־6 חודשים בספטמבר 2021 ו־25 שנים ו־3 חודשים ב־1 ביוני 2022 — זכאי ביוני 2022 לפי §2ה.2 ואינו זכאי לפי §2ד, שלפי לשונו היה משלם את המענק שנה מאוחר יותר. (גם הספטמבר של "השנה שלפני התשלום" נקרא בשתי דרכים — השנה הקלנדרית הקודמת, ספטמבר 2021, או שנת הלימודים הקודמת, ספטמבר 2020 — וזה מרחיב את הפער, אך אינו נחוץ לו.)

אותה שאלה, הוותק של ספטמבר מול הוותק שהושלם עד 1 ביוני, עולה בחוזרי מענק היובל מתשס"ז עד תשפ"ו, והיא נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_06-b (תשס"ז/6), F-2007-08_tashsach_05-b (תשס"ח/5), F-2008-09_tashsat_09-c (תשס"ט/9), F-2009-10_tasha_03-c (תש"ע/3), F-2010-11_tashaa_02-b (תשע"א/2), F-2011-12_tashab_12-b (תשע"ב/12), F-2012-13_tashag_07-c (תשע"ג/7), F-2013-14_tashad_07-c (תשע"ד/7), F-2014-15_tashae_04-c (תשע"ה/4), F-2015-16_tashav_07-c (תשע"ו/7), F-2016-17_tashaz_05-c (תשע"ז/5), F-2017-18_tashach_04-c (תשע"ח/4), F-2018-19_tashat_06-c (תשע"ט/6), F-2019-20_tashaf_09-b (תש"פ/9), F-2020-21_tashpa_07-c (תשפ"א/7), F-2021-22_tashpab_06-c (תשפ"ב/6), F-2022-23_tashpag_08-b (תשפ"ג/8), F-2023-24_tashpad_10-d (תשפ"ד/10), F-2024-25_tashpah_11-c (תשפ"ה/11) ו־F-2025-26_tashpo_07-b (תשפ"ו/7).
"""
