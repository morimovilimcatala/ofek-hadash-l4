§1ז מגביל מורה המועסק שלא לפי תנאי הרפורמה ל־140% משרה אצל כלל מעסיקיו, ומנהל המועסק שלא לפי תנאי הרפורמה ל־150%. §1ח פסקה 4 קובעת אחר כך שאין באמור לעיל כדי להתיר העסקה מעבר ל"היקפי משרה אלו", ומונה אותם בסוגריים: 140% ללא רפורמה, 125% ביישום מלא של עוז לתמורה, 117% באופק חדש — בלי מספר נפרד למנהלים.

לגבי מנהל שאינו ברפורמות המועסק בין 140% ל־150% בסך הכל, §1ז קובע את המגבלה מעל ההעסקה, והחזרה של פסקה 4 על אותן מגבלות קובעת אותה מתחתיה.

