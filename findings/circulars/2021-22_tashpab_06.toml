quote = "וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150%משרה · (140% משרה -ללא רפורמה 125%, משרה ביישום מלא של עוז לתמורה ו 117% -באופק חדש)"
title = "מנהל שאינו ברפורמות: מגבלה של 150% (§1ז) או של 140% (§1ח פסקה 4)?"
body = """
§1ז מגביל מורה המועסק שלא לפי תנאי הרפורמה ל־140% משרה אצל כלל מעסיקיו, ומנהל המועסק שלא לפי תנאי הרפורמה ל־150%. §1ח פסקה 4 קובעת אחר כך שאין באמור לעיל כדי להתיר העסקה מעבר ל"היקפי משרה אלו", ומונה אותם בסוגריים: 140% ללא רפורמה, 125% ביישום מלא של עוז לתמורה, 117% באופק חדש — בלי מספר נפרד למנהלים.

לגבי מנהל שאינו ברפורמות המועסק בין 140% ל־150% בסך הכל, §1ז קובע את המגבלה מעל ההעסקה, והחזרה של פסקה 4 על אותן מגבלות קובעת אותה מתחתיה.
"""
reading = "§1ז, הסעיף הקובע את המגבלות, גובר: 150% למנהל שאינו ברפורמות. הסוגריים של פסקה 4 חוזרים על המגבלות של המורים ואינם מוסיפים מגבלה משלהם."
l4 = "l4/circulars/2021-22_tashpab_06.l4"
evidence = "`section 1ז and its restatement give a principal outside the reforms different limits`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
