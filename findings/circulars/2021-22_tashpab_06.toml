keys = ["art_2__para_e__subpara_4", "art_2__para_e__subpara_5", "art_1__para_f"]
quote = "מענק יובל ישולם לעובד הוראה בהתאם לחלקיות משרתו באותה שנה עד למשרה אחת בלבד · לגבי עובד הוראה המועסק אצל יותר ממעסיק אחד יחולו הכללים האמורים בסעיפים 1ו' עד 1ח' לעיל, בשינויים המחויבים"
title = "מענק היובל מוגבל למשרה אחת, ומשולם על ידי כל מעסיק לפי החלק שאצלו"
body = """
§2ה(4) משלם את מענק היובל "בהתאם לחלקיות משרתו באותה שנה עד למשרה אחת בלבד". §2ה(5) מחיל על עובד הוראה המועסק אצל יותר ממעסיק אחד את הכללים שבסעיפים 1ו עד 1ח, ו־§1ו אומר שכאשר היקף המשרה הכולל אצל כמה מעסיקים עולה על 100%, כל מעסיק משלם בנפרד את החלק של המשרה שאצלו.

לעובד ב־80% משרה אצל מעסיק אחד וב־60% אצל אחר, §1ו (דרך §2ה(5)) נותן שני מענקים שסכומם 140% ממענק אחד, ו־§2ה(4) מגביל את המענק למשרה אחת.

אותן שתי הוראות על מענק היובל — עד משרה אחת בלבד, והחלת סעיפים 1ו–1ח על מי שמועסק אצל כמה מעסיקים — מודפסות בחוזרי דמי ההבראה ומענק היובל מתשע"ה, והשאלה נרשמה עם אותה קריאה בכל חוזר שבו סעיפים 1ו–1ח כוללים את הכלל לכמה מעסיקים (בתשפ"ד/10 ובתשפ"ה/11 ההפניה אינה מגיעה אליו, וזו שאלה אחרת: F-2023-24_tashpad_10-e ו־F-2024-25_tashpah_11-b): F-2014-15_tashae_04-b (תשע"ה/4), F-2015-16_tashav_07-b (תשע"ו/7), F-2016-17_tashaz_05-b (תשע"ז/5), F-2017-18_tashach_04-g (תשע"ח/4), F-2018-19_tashat_06-g (תשע"ט/6), F-2019-20_tashaf_09-g (תש"פ/9), F-2020-21_tashpa_07-d (תשפ"א/7), F-2021-22_tashpab_06-g (תשפ"ב/6), F-2022-23_tashpag_08-f (תשפ"ג/8) ו־F-2025-26_tashpo_07-f (תשפ"ו/7).
"""
reading = "§2ה(5) חל על עובד של כמה מעסיקים: כל מעסיק משלם את חלקו, והתקרה של משרה אחת לפי §2ה(4) חלה אצל כל מעסיק — הקריאה של F-2020-21_tashpa_07-d."
