# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2021-22_tashpab_06-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d"]
quote = "בשיעור יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה("
title = "\"1/10 for each month of work\": which months are months of work?"
body = """
§1ד gives a part-time teaching employee the recuperation allowance in proportion to the position held that year, "(1/10 for each month of work)". The parenthesis weighs each month at a tenth of the year, which is a whole year only if the year has ten months of work.

A teaching employee is paid salary for all twelve months of the school year. If every month for which salary is paid is a "month of work", a full year comes to twelve tenths — 120% of the year's position — and an employee on a steady part-time position is paid more than the proportion §1ד's own first words grant. If only the ten teaching months September–June count, the parenthesis averages the monthly positions over the year. The circular does not say which months count, and the two readings give different allowances for every part-time employee who worked the whole year.
"""
reading = "The months of work are the ten months September–June; the year's position is the sum of each of those months' positions at a tenth, i.e. their average."
l4 = "l4/circulars/2021-22_tashpab_06.l4"
evidence = "`twelve months of work at a tenth each come to more than a year`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2021-22_tashpab_06-b"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_g", "art_1__para_h/p4"]
quote = "וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150%משרה · (140% משרה -ללא רפורמה 125%, משרה ביישום מלא של עוז לתמורה ו 117% -באופק חדש)"
title = "A principal outside the reforms: a limit of 150% (§1ז) or 140% (§1ח ¶4)?"
body = """
§1ז limits a teacher employed outside the reforms to 140% of a position with all employers, and a principal employed outside the reforms to 150%. §1ח ¶4 then says that nothing above permits employment beyond "these scopes" and lists them in brackets: 140% without a reform, 125% in full implementation of Oz LaTmura, 117% in Ofek Hadash — with no separate figure for principals.

For a principal outside the reforms employed between 140% and 150% in all, §1ז sets the limit above the employment and ¶4's restatement of the same limits sets it below.
"""
reading = "§1ז, the clause that sets the limits, governs: 150% for a principal outside the reforms. ¶4's bracket restates the limits for teachers and adds none of its own."
l4 = "l4/circulars/2021-22_tashpab_06.l4"
evidence = "`section 1ז and its restatement give a principal outside the reforms different limits`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2021-22_tashpab_06-c"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_d", "art_2__para_e__subpara_2"]
quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני תשלום מענק יובל · עובד הוראה שהשלים 25 או 30 שנות עבודה בישראל … ב1 - ביוני של אותה שנה נדונה … יזכה באותה שנה במענק יובל"
title = "The jubilee grant's seniority: as determined the September before (§2ד) or as completed by 1 June (§2ה.2)?"
body = """
§2ד gives the jubilee grant by the seniority determined for the employee in September of the year before the grant is paid. §2ה.2 gives it in the year the employee completes 25 or 30 years by 1 June of that year.

The two dates are nine months apart. An employee who passes the threshold between the September determination and 1 June — for example, 24 years and 6 months in September 2021 and 25 years and 3 months on 1 June 2022 — is entitled in June 2022 under §2ה.2 and not under §2ד, which on its own words would pay the grant a year later. (The September of "the year before the payment" itself reads two ways — the calendar year before, September 2021, or the school year before, September 2020 — which widens the gap but is not needed for it.)
"""
reading = "§2ה.2 decides the year: the threshold completed by 1 June of the year of payment. It is the clause that names a date of completion and the year of entitlement; §2ד is read as naming the seniority record the count starts from."
l4 = "l4/circulars/2021-22_tashpab_06.l4"
evidence = "`sections 2ד and 2ה.2 give different years for the same teacher`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2021-22_tashpab_06-d"
kind = "ambiguity"
stage = "writing"
keys = ["art_2__para_b", "art_2__para_e__subpara_2"]
quote = "בעל ותק מצטבר בהוראה של 25 או 30 שנה ומעלה · שהשלים 25 או 30 שנות עבודה … יזכה באותה שנה במענק יובל"
title = "Is the jubilee grant paid once, or every year from 25 or 30 years on?"
body = """
§2ב pays the jubilee grant to a teaching employee with accumulated seniority "of 25 or 30 years and more". Read alone, "and more" makes every year at or past the threshold a year of entitlement, so an employee with 27 years is paid again. §2ה.2 entitles an employee who completed 25 or 30 years "in that year", which is a grant paid once, on completing the threshold.

The circular nowhere says the grant is paid once per threshold, and the two readings differ for every employee past the threshold who was paid in an earlier year.
"""
reading = "The grant is paid once, in the year the threshold is completed (§2ה.2); \"and more\" in §2ב is read as covering seniority that passes the threshold in the course of that year."
l4 = "l4/circulars/2021-22_tashpab_06.l4"
evidence = "`section 2ב read alone pays the grant again in a later year`"
depends_on = ["F-2021-22_tashpab_06-c"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2021-22_tashpab_06-e"
kind = "overlap"
stage = "writing"
keys = ["art_2__para_e__subpara_3"]
quote = "ובמכללות האקדמאיות להכשרת עו\"ה -הוותק המזכה במענק יובל הינו וותק מצטבר כהגדרתו לעיל, של 25 שנה … (גני ילדים, יסודי, מכללות להכשרת עו\"ה) הוותק המזכה במענק יובל הינו וותק מצטבר, כהגדרתו לעיל, של 30 שנה"
title = "The teacher-training colleges are given both a 25-year and a 30-year threshold"
body = """
§2ה.3 sets the seniority that entitles to the jubilee grant by the stage of each part of the employment: 25 years for junior high, upper division, recognised unofficial special education under Ofek Hadash "and the academic colleges for teacher training"; 30 years for the other stages, listed as "kindergartens, primary, colleges for teacher training".

The colleges for teacher training are in both lists, so an employee with 27 years in such a college is entitled under the first and not under the second.
"""
reading = "The first list governs the colleges: 25 years. It names them the more specifically (\"the academic colleges\"), and the second list is introduced as the remaining stages (\"ביתר שלבי החינוך\")."
l4 = "l4/circulars/2021-22_tashpab_06.l4"
evidence = "`the teacher-training colleges are given two thresholds`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
