title = "הוותק למענק יובל: כפי שנקבע בספטמבר שלפני כן (§2ד) או כפי שהושלם עד 1 ביוני (§2ה.2)?"
body = """
§2ד מעניק את מענק היובל לפי הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני תשלום המענק. §2ה.2 מעניק אותו בשנה שבה העובד משלים 25 או 30 שנה עד 1 ביוני של אותה שנה.

בין שני המועדים תשעה חודשים. עובד שחוצה את הסף בין קביעת הוותק בספטמבר לבין 1 ביוני — למשל, 24 שנים ו־6 חודשים בספטמבר 2021 ו־25 שנים ו־3 חודשים ב־1 ביוני 2022 — זכאי ביוני 2022 לפי §2ה.2 ואינו זכאי לפי §2ד, שלפי לשונו היה משלם את המענק שנה מאוחר יותר. (גם הספטמבר של "השנה שלפני התשלום" נקרא בשתי דרכים — השנה הקלנדרית הקודמת, ספטמבר 2021, או שנת הלימודים הקודמת, ספטמבר 2020 — וזה מרחיב את הפער, אך אינו נחוץ לו.)
"""
reading = "§2ה.2 מכריע את השנה: הסף שהושלם עד 1 ביוני של שנת התשלום. זהו הסעיף הנוקב במועד השלמה ובשנת הזכאות; §2ד נקרא כמציין את רישום הוותק שממנו הספירה מתחילה."
l4 = "l4/circulars/2021-22_tashpab_06.l4"
evidence = "`sections 2ד and 2ה.2 give different years for the same teacher`"
