title = "\"1/10 לכל חודש עבודה\": אילו חודשים הם חודשי עבודה?"
body = """
§1ד מעניק לעובד הוראה במשרה חלקית קצובת הבראה בשיעור יחסי לחלקיות משרתו באותה שנה, ובסוגריים: 1/10 לכל חודש עבודה. הסוגריים שוקלים כל חודש כעשירית השנה, וזו שנה שלמה רק אם יש בשנה עשרה חודשי עבודה.

עובד הוראה מקבל שכר עבור כל שנים־עשר חודשי שנת הלימודים. אם כל חודש שבעדו משולם שכר הוא "חודש עבודה", שנה מלאה מסתכמת בשתים־עשרה עשיריות — 120% מהמשרה השנתית — ועובד במשרה חלקית קבועה מקבל יותר מן היחס שמעניקות המילים הראשונות של §1ד עצמו. אם נספרים רק עשרת חודשי ההוראה ספטמבר–יוני, הסוגריים ממצעים את המשרות החודשיות על פני השנה. החוזר אינו אומר אילו חודשים נספרים, ושתי הקריאות נותנות קצובה שונה לכל עובד במשרה חלקית שעבד את כל השנה.

אותו סעיף — "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה (1/10 לכל חודש עבודה)", ומתשע"ב "לקצובת הבראה בשיעור יחסי" — מופיע בכל חוזרי ההבראה של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-a`, `F-2007-08_tashsach_05-a`, `F-2008-09_tashsat_09-a`, `F-2009-10_tasha_03-b`, `F-2010-11_tashaa_02-a`, `F-2011-12_tashab_12-a`, `F-2012-13_tashag_07-b`, `F-2013-14_tashad_07-b`, `F-2014-15_tashae_04-a`, `F-2015-16_tashav_07-a`, `F-2016-17_tashaz_05-a`, `F-2017-18_tashach_04-a`, `F-2018-19_tashat_06-a`, `F-2019-20_tashaf_09-a`, `F-2020-21_tashpa_07-a`, `F-2022-23_tashpag_08-a`, `F-2023-24_tashpad_10-a`, `F-2024-25_tashpah_11-a`, `F-2025-26_tashpo_07-a`. ההבדל בניסוח בין "באופן יחסי" ל"בשיעור יחסי" אינו נוגע לשאלה, ולכן כולם מאמצים קריאה אחת.
"""
