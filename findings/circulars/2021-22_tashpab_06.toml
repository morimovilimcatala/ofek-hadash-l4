§1א קובע שקצובת דמי ההבראה משולמת "במשכורת חודש יוני 2021". החוזר מתוארך 15 ביוני 2022, הקצובה היא לשנת הלימודים תשפ"ב (1.9.2021–31.8.2022), ו־§2א משלם את מענק היובל של אותה שנה "במשכורת חודש יוני 2022".

יוני 2021 קודם לתחילת שנת הלימודים שעבורה הקצובה משולמת ולמועד החוזר עצמו, ולכן אי אפשר לשלם בו את הקצובה; הטקסט אינו אומר אם התכוון ליוני 2022.
