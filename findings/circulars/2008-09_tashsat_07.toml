title = "\"החל משנת הלימודים תשס\"ח\", שפורש כ\"שפרש בסוף שנת הלימודים תשס\"ח ואילך\": האם פרישה במהלך תשס\"ח נכללת?"
body = """
סעיפים 1 ו־2א פותחים שניהם את השינוי "החל משנת הלימודים תשס"ח", והפירוש של משרד החינוך בסוגריים המרובעים, שהפתיח מסמן כהערה שלו על הוראות משרד האוצר, מנסח אותו מחדש כ"כלומר: בגין עובד הוראה שפרש בסוף שנת הלימודים תשס"ח ואילך".

השניים נבדלים לגבי עובד שפרש, או עבר מעסיק, במהלך תשס"ח לפני סופה: לשון הכלל כוללת את שנת הלימודים כולה, והפירוש רק את סופה ואת מה שאחריו. פורש מוקדם כזה המלמד אצל מעסיק אחר זכאי לפיצוי בגין ימי המחלה שצבר שם לפי הקריאה הראשונה, ואינו זכאי לפי השנייה; וכך גם הרציפות שבסעיף 2א לגבי מי שעבר באמצע השנה.
"""
