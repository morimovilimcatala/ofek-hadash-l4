keys = ["art_1/p1", "art_2__para_a"]
quote = "החל משנת הלימודים תשס\"ח [כלומר: בגין עובד הוראה שפרש בסוף שנת הלימודים תשס\"ח ואילך]"
title = "\"From school year 2007/08\", glossed as \"who retired at the end of 2007/08 or later\": is a retirement during 2007/08 in?"
body = """
Sections 1 and 2א both start their change "from school year תשס\"ח" (2007/08), and the Ministry's bracketed gloss, which the lead-in marks as its own remark on the Treasury's instructions, restates it as "that is: a teaching employee who retired at the end of school year תשס\"ח or later".

The two differ for an employee who retired, or moved employer, during 2007/08 before its end: the rule's words take in the whole school year, the gloss only its end and what follows. Such an early retiree teaching for another employer is compensated for the sick days accrued there under the first, and not under the second; likewise section 2א's continuity for one who moved mid-year.
"""
reading = "The Ministry's gloss, which states what the owners are told to apply: the change covers retirements (and moves) at the end of 2007/08 and later."
l4 = "l4/circulars/2008-09_tashsat_07.l4"
evidence = "`the rule and its gloss differ for a retirement during 2007/08`"
