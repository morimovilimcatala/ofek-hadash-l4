[[finding]]
id = "F-2015-16_tashav_04_clarif-a"
kind = "contradiction"
stage = "writing"
keys = ["hc_1/p16", "hc_1/p17"]
quote = "אינם זכאים למענק היות וחסר להם יום אחד להשלמת התקופה המזכה במענק החד-פעמי"
title = "\"A day short\" of a qualifying period that, in the circulars it clarifies, ended a month earlier"
body = """
The clarification addresses circulars 2015-16/4 and 2015-16/5. It says that under the Treasury wage director's circular of 22.2.2016, teaching staff whose retirement fell on 1.1.2016 — employed up to and including 31.12.2015 — are not entitled to the one-time grant, being one day short of the qualifying period; and it then decides that they are entitled.

The circulars it clarifies define the qualifying ("determining") period as continuous employment "from 1.9.2015 to 1.12.2015". An employee who worked to 31.12.2015 was employed throughout that period and is entitled by their words, not a day short. The premise needs a period ending on 1.1.2016, which neither circular prints; the qualifying period is stated differently in the clarification (by implication) and in the circulars it clarifies.
"""
reading = "The decision of ¶17 is applied as written: those who retired on 1.1.2016 are entitled. That outcome agrees with the period circulars 2015-16/4 and /5 print, so it does not depend on which statement of the period is right; the encoding keeps both statements of the period side by side."
l4 = "l4/circulars/2015-16_tashav_04_clarif.l4"
evidence = "`the clarification's premise contradicts the period of the circulars it clarifies`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
