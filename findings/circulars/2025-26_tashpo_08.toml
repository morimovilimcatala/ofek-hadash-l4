title = "פיזיותרפיסט במשרה חלקית מקבל יותר מפיזיותרפיסט במשרה מלאה, ומשרה מלאה נופלת בשני הכללים"
body = """
הפסקה השנייה של §4 נותנת לפיזיותרפיסט המועסק במשרה מלאה באופק חדש או בעוז לתמורה קצובת ביגוד לפיזיותרפיסטים "בסך של 800 ₪ בלבד". הפסקה השלישית שלו נותנת לפיזיותרפיסט במשרה חלקית את הקצובה לפי הכללים של קצובת חינוך גופני, והטבלה שלצדה משלמת 864.12 ₪ למשרה "מעל 50%".

פיזיותרפיסט במשרה של 60% מקבל 864.12 ₪, יותר מן ה־800 ₪ שמקבל פיזיותרפיסט במשרה מלאה. ומשרה מלאה היא עצמה "מעל 50%", ולכן היא מקבלת 800 ₪ לפי הפסקה השנייה ו־864.12 ₪ לפי הטבלה.
"""
reading = "משרה מלאה מקבלת 800 ₪ לפי הפסקה השנייה, הנוקבת בה; הטבלה חלה על משרות חלקיות בלבד, כפי שאומרת הפסקה השלישית. ההיפוך במשרות שמעל 50% נותר כפי שהוא מודפס."
