# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2025-26_tashpo_08-a"
kind = "contradiction"
stage = "writing"
keys = ["art_4/p2", "art_4/p3", "art_4/t1"]
quote = "פיזיותרפיסט המועסק במשרה מלאה … יהיה זכאי … ל\"קצובת ביגוד לפיזיותרפיסטים\" בסך של 800 ₪ בלבד · מעל 50% | 864.12 ₪"
title = "A part-time physiotherapist is paid more than a full-time one, and a full position falls in both rules"
body = """
§4's second paragraph gives a physiotherapist employed full-time in Ofek Hadash or Oz LaTmura a physiotherapists' clothing allowance "of 800 ₪ only". Its third paragraph gives a part-time physiotherapist the allowance by the physical-education rules, and the table beside it pays 864.12 ₪ for a position "above 50%".

A physiotherapist on a 60% position is paid 864.12 ₪, more than the 800 ₪ a full-time one receives. And a full position is itself "above 50%", so it is given 800 ₪ by the second paragraph and 864.12 ₪ by the table.
"""
reading = "A full position is paid 800 ₪ by the second paragraph, which names it; the table governs part-time positions only, as the third paragraph says. The inversion for positions above 50% is left as printed."
l4 = "l4/circulars/2025-26_tashpo_08.l4"
evidence = "`the part-time table pays more than the full-time allowance above 50%`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2025-26_tashpo_08-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_2/t1", "art_4/t1", "art_1__para_b"]
quote = "סכום נכון ל- 1/9/2026 · לשנת הלימודים תשפ\"ו (09/25 -08/26)"
title = "The part-time tables' amounts are dated 1.9.2026, after the school year they are paid for"
body = """
The circular pays the clothing allowances "for school year תשפ\"ו (09/25–08/26)" (§1.ב), the physiotherapists' allowance with July's salary (§4). Both part-time tables — the physical-education allowance (§2) and the physiotherapists' (§4) — head their amounts "correct as at 1/9/2026", the first day of the next school year and two months after the July payment.

Read as printed, the amounts are those in force from September 2026 and say nothing of what is owed for תשפ\"ו; read as a slip for 1/9/2025, they are תשפ\"ו's. The two readings differ whenever the amounts change between the years.
"""
reading = "The printed amounts are paid for תשפ\"ו as they stand: the circular is the instrument for that year and names no other amount for it."
l4 = "l4/circulars/2025-26_tashpo_08.l4"
evidence = "`the tables' amounts are dated after the school year they are paid for`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2025-26_tashpo_08-c"
kind = "overlap"
stage = "writing"
keys = ["art_1__para_f", "art_1__para_f/p2", "art_1/p5"]
quote = "חלה הגבלה על עובד הוראה לעבוד בהיקף משרה העולה על 140% משרה אצל כלל מעסיקיו, וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150% משרה"
title = "Two position limits for one principal: 140% for every teaching employee and 150% for a principal outside the reform"
body = """
§1.ו limits every teaching employee ("עובד הוראה") to 140% of a position across all employers, and in the same sentence limits a principal employed outside the reform to 150%. A principal is a teaching employee, so the paragraph gives that principal two limits; the reform teachers of its second paragraph (131.5% in full Oz LaTmura, 117% in Ofek Hadash) are teaching employees too and fall under the 140% as well.

The closing paragraph of §1 restates the limits as "140% משרה- ללא רפורמה", which narrows the 140% to employment outside the reform but still does not exclude the principal.
"""
reading = "Each named group's own limit governs it: 150% for a principal outside the reform, 131.5% and 117% for the reform teachers, and 140% for the other teaching employees outside the reform, as the closing paragraph states the 140%."
l4 = "l4/circulars/2025-26_tashpo_08.l4"
evidence = "`1.ו gives a principal outside the reform two limits`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
