[[finding]]
id = "F-2025-26_tashpo_08-d"
kind = "contradiction"
stage = "verification"
keys = ["art_1__para_d", "art_1__para_e"]
quote = "קצובת הביגוד תשולם יחסית להיקף המשרה של העובד ולא יותר ממשרה אחת מלאה (100%) · עובד הוראה המועסק אצל יותר ממעסיק אחד והיקף משרתו הכוללת אצל שני המעסיקים הינו מעבר ל-100% משרה, זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "מעל משרה מלאה: לא יותר מקצובה אחת (§1ד), או קצובה יחסית מכל מעסיק (§1ה)?"
body = """
§1ד: קצובת הביגוד תשולם יחסית להיקף המשרה של העובד "ולא יותר ממשרה אחת מלאה (100%)". §1ה: עובד הוראה המועסק אצל יותר ממעסיק אחד, שהיקף משרתו הכוללת מעבר ל־100%, זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו.

לעובד במשרה של 80% אצל מעסיק אחד ו־60% אצל מעסיק אחר, §1ד מגביל את הקצובה לקצובה מלאה אחת; §1ה מחייב את המעסיקים לשלם 80% ו־60% ממנה, 140% בסך הכול. §1ד אינו מגביל את עצמו למעסיק אחד, ו־§1ה אינו אומר שהוא חריג ל־§1ד.

אותן שתי הוראות — תקרה של משרה מלאה אחת והכלל למי שמועסק אצל כמה מעסיקים — מודפסות בחוזרי קצובת הביגוד מתשע"א עד תשפ"ו, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2010-11_tashaa_03-g (תשע"א/3), F-2011-12_tashab_13-b (תשע"ב/13), F-2012-13_tashag_08-a (תשע"ג/8), F-2012-13_tashag_09-a (תשע"ג/9), F-2013-14_tashad_08-a (תשע"ד/8), F-2014-15_tashae_07-a (תשע"ה/7), F-2015-16_tashav_08-a (תשע"ו/8), F-2016-17_tashaz_06-a (תשע"ז/6), F-2017-18_tashach_07-b (תשע"ח/7), F-2018-19_tashat_08-b (תשע"ט/8), F-2019-20_tashaf_11-e (תש"פ/11), F-2020-21_tashpa_08-a (תשפ"א/8), F-2021-22_tashpab_07-c (תשפ"ב/7), F-2022-23_tashpag_09-d (תשפ"ג/9), F-2023-24_tashpad_11-d (תשפ"ד/11), F-2024-25_tashpah_12-c (תשפ"ה/12) ו־F-2025-26_tashpo_08-d (תשפ"ו/8).
"""
reading = "§1ה הוא הכלל המיוחד לכמה מעסיקים והוא חל עליהם: כל מעסיק משלם את חלקו, והתקרה של §1ד חלה אצל כל מעסיק — הקריאה של F-2018-19_tashat_08-b."
l4 = "l4/circulars/2025-26_tashpo_08.l4"
evidence = "`the one-position cap and the multi-employer rule disagree for two employers`"
depends_on = ["F-2018-19_tashat_08-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
