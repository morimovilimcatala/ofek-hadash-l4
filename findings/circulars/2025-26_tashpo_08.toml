title = "The part-time tables' amounts are dated 1.9.2026, after the school year they are paid for"
body = """
The circular pays the clothing allowances "for school year תשפ\"ו (09/25–08/26)" (§1.ב), the physiotherapists' allowance with July's salary (§4). Both part-time tables — the physical-education allowance (§2) and the physiotherapists' (§4) — head their amounts "correct as at 1/9/2026", the first day of the next school year and two months after the July payment.

Read as printed, the amounts are those in force from September 2026 and say nothing of what is owed for תשפ\"ו; read as a slip for 1/9/2025, they are תשפ\"ו's. The two readings differ whenever the amounts change between the years.
"""
reading = "The printed amounts are paid for תשפ\"ו as they stand: the circular is the instrument for that year and names no other amount for it."
