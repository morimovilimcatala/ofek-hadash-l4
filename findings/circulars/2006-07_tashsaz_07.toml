quote = "1,259 שנים 1-25 · 1,754 26 שנים ומעלה"
title = "The general clothing table has no row for an employee with less than one year of seniority"
body = """
The general clothing allowance is paid "according to the employee's seniority", by a table of two rows: 1–25 years and 26 years and more. The circular does not say how seniority is counted. Teaching seniority is counted in completed years, so an employee in the first year has seniority 0 — which no row covers — while the circular gives every employee in the teachers' grading the allowance.
"""
reading = "An employee with less than one year of seniority takes the first row (the 1–25 amount): the table is read as \"up to 25 years\", the reading under which every entitled employee has an amount."
