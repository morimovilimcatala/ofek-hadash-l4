quote = "קצובה זו היא בנוסף לקצובת הביגוד לכלל עובדי ההוראה. · קצובת הביגוד משולמת יחסית להיקף המשרה ולא יותר ממשרה מלאה אחת ( 100%משרה)."
title = "Is the technological clothing allowance pro-rated by the position?"
body = """
The pro-rating sentence — "the clothing allowance is paid in proportion to the position, and for no more than one full position" — is printed twice: once under the general allowance and again at the end of the technological-education part, after the sentence that calls the technological allowance an addition to "the clothing allowance for all teaching employees". Its subject is "the clothing allowance", the name of the general one, but its place is under the technological one.

Read as a repetition of the general rule, it leaves the technological allowance (the value of the shoes and robes) unreduced; read as belonging where it is printed, it pro-rates it. For a technology teacher on half a position the readings differ by half of 459 shekels.
"""
reading = "The sentence governs the part it is printed in: the technological allowance is pro-rated by the position, up to one full position."
