quote = "0 עד 0.3 משרה · 217 מ 0.3 -משרה עד · 0.5 משרה · 430 מ 0.5-משרה ומעלה"
title = "The physical-education table gives a position of 0.3 and of 0.5 two amounts each"
body = """
The additional allowance for a physical-education teacher is set by the share of the position in three rows: "0 up to 0.3" (nothing), "from 0.3 up to 0.5" (217 shekels) and "from 0.5 and up" (430 shekels). A row that runs "up to" a figure and the next row that runs "from" the same figure both include it, so a teacher at exactly 0.3 of a position is in the first two rows and one at exactly 0.5 in the last two. Both are ordinary position shares, and the table gives each of them two amounts.
"""
reading = "The row that opens at a boundary (\"from 0.3\", \"from 0.5\") governs it: 0.3 takes the middle row and 0.5 the last."
l4 = "l4/circulars/2006-07_tashsaz_07.l4"
evidence = "`the PE table gives 0.3 and 0.5 two amounts each`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
