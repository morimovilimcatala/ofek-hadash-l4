# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2016-17_tashaz_03-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_b", "art_1__para_d"]
quote = "החל מחודש ינואר 2017 יעודכן, אחת לשנה, בחודש ינואר (להלן\": מועד עדכון\"), סכום התוספת השקלית שייקבע כאמור לעיל, לפי שיעור עליית מדד החדש לעומת המדד הקודם"
title = "Are the amounts printed for 2017–2020 updated by the index too, or paid as printed?"
body = """
§1ב prints the full-position supplement for five periods running from 1.9.2016 to 1.9.2020 and on. §1ד updates "the amount of the shekel supplement set as above" every January from January 2017, by the rise of the December index over the previous one (the first update measured from December 2015).

The amounts printed for 1.3.2017, 1.6.2019, 1.9.2019 and 1.9.2020 are among the amounts "set above", but they take effect after one or more updates have been made. Read as bases, each is raised by every update since January 2017 when it takes effect; read as amounts fixed in advance, each is paid as printed and updated only from the January after it takes effect. With a 2% rise in the index, the rank-1 amount from 1.9.2020 is 1,095.86 NIS on the first reading and 1,074.37 NIS on the second.
"""
reading = "Each update applies to the amount in force on its date: an amount printed for a later period is paid as printed when its period begins and is updated from the following January on."
l4 = "l4/circulars/2016-17_tashaz_03.l4"
evidence = "`§1ב's later amounts and §1ד's update give two readings`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

