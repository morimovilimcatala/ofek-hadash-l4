[[finding]]
id = "F-2016-17_tashaz_03-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_b", "art_1__para_d"]
quote = "החל מחודש ינואר 2017 יעודכן, אחת לשנה, בחודש ינואר (להלן\": מועד עדכון\"), סכום התוספת השקלית שייקבע כאמור לעיל, לפי שיעור עליית מדד החדש לעומת המדד הקודם"
title = "האם הסכומים המודפסים לשנים 2017–2020 מתעדכנים גם הם לפי המדד, או משולמים כפי שהם מודפסים?"
body = """
§1ב מדפיס את התוספת למשרה מלאה לחמש תקופות, מ־1.9.2016 ועד 1.9.2020 ואילך. §1ד מעדכן את "סכום התוספת השקלית שייקבע כאמור לעיל" בכל ינואר החל מינואר 2017, לפי שיעור עליית מדד דצמבר לעומת המדד הקודם (העדכון הראשון נמדד מדצמבר 2015).

הסכומים המודפסים ל־1.3.2017, ל־1.6.2019, ל־1.9.2019 ול־1.9.2020 נמנים עם הסכומים "שייקבע כאמור לעיל", אך הם נכנסים לתוקף לאחר שכבר נעשו עדכון אחד או יותר. אם הם נקראים כבסיסים, כל אחד מהם מועלה בכל עדכון שנעשה מינואר 2017 עם כניסתו לתוקף; אם הם נקראים כסכומים שנקבעו מראש, כל אחד משולם כפי שהוא מודפס ומתעדכן רק מינואר שלאחר כניסתו לתוקף. בעלייה של 2% במדד, הסכום לדרגה 1 מ־1.9.2020 הוא 1,095.86 ₪ לפי הקריאה הראשונה ו־1,074.37 ₪ לפי השנייה.

אותן מילים של סעיף העדכון ("סכום התוספת השקלית שייקבע כאמור לעיל") מודפסות גם בחוזר תשע"ז/4 לחטיבות העליונות, והשאלה נרשמה שם עם אותה קריאה: F-2016-17_tashaz_04-a.
"""
reading = "כל עדכון חל על הסכום שבתוקף במועדו: סכום המודפס לתקופה מאוחרת יותר משולם כפי שהוא מודפס עם תחילת התקופה שלו, ומתעדכן מינואר שלאחריה ואילך."
convention = "dates.update-in-force"
l4 = "l4/circulars/2016-17_tashaz_03.l4"
evidence = "`§1ב's later amounts and §1ד's update give two readings`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

