# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2019-20_tashaf_11-a"
kind = "overlap"
stage = "writing"
keys = ["art_1__para_f", "art_1/p5"]
quote = "חלה הגבלה על עובד הוראה לעבוד בהיקף משרה העולה על 140% משרה אצל כלל מעסיקיו, וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150% משרה"
title = "A non-reform principal is limited both to 140% and to 150% of a position"
body = """
§1(ו) limits "a teaching employee" — every one — to 140% of a position across all employers, "and" a principal employed not under the reform to 150%. A principal is a teaching employee, so a non-reform principal falls under both limits: employment at 145% is beyond the first and within the second. ¶5's summary of the limits lists 140% for "without reform", 117% for Ofek Hadash and 125% for Oz LeTmura, and does not mention the 150% at all.

The same sentence in circular תש"פ/9 §1(ז) limits "a teacher (מורה) employed not under the reform" to 140%, which does not reach principals; here the subject is widened to every teaching employee and the overlap appears.
"""
reading = "The principal's own limit governs a non-reform principal — 150% — as the specific rule for principals; the 140% is read as the limit for non-reform teachers, as in ¶5's summary."
l4 = "l4/circulars/2019-20_tashaf_11.l4"
evidence = "`a non-reform principal is given both 140% and 150%`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2019-20_tashaf_11-b"
kind = "gap"
stage = "writing"
keys = ["art_3__para_1__subpara_a", "art_3__para_1__subpara_b"]
quote = "יהיה זכאי לקבל מדי שנה זוג נעליים ושני חלוקים · יהיה זכאי לקבל שני חלוקים לשנה"
title = "A technological-education teacher of subjects on both lists: 557 ₪, 346 ₪ or both?"
body = """
§3.1(א) gives a teacher or professional instructor "in one of the subjects listed" a pair of shoes and two coats a year (557 ₪); §3.1(ב) gives one "in one of the subjects listed" in the second list two coats (346 ₪). A teacher may teach subjects from both lists — mechatronics and nursing, say.

The circular does not say whether such a teacher receives both items (903 ₪), the higher one (557 ₪, which already includes two coats), or one by the main subject taught; nor whether §3.3's pro-rating by position applies to each item separately.
"""
reading = "The higher item once (557 ₪), pro-rated to the position: shoes and two coats already include the two coats of the second list."
l4 = "l4/circulars/2019-20_tashaf_11.l4"
evidence = "`a teacher of subjects on both lists is given two items`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
