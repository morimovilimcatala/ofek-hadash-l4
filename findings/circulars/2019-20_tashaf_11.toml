# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2019-20_tashaf_11-a"
kind = "overlap"
stage = "writing"
keys = ["art_1__para_f", "art_1/p5"]
quote = "חלה הגבלה על עובד הוראה לעבוד בהיקף משרה העולה על 140% משרה אצל כלל מעסיקיו, וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150% משרה"
title = "מנהל שאינו ברפורמה מוגבל גם ל־140% וגם ל־150% משרה"
body = """
§1(ו) מגביל "עובד הוראה" — כל עובד הוראה — ל־140% משרה אצל כלל מעסיקיו, "וכן" מנהל המועסק שלא על פי תנאי הרפורמה ל־150%. מנהל הוא עובד הוראה, ולכן מנהל שאינו ברפורמה נופל תחת שתי ההגבלות: העסקה בהיקף של 145% חורגת מהראשונה ונמצאת בתוך השנייה. הסיכום של ההגבלות ב־§1 (הפסקה "אין לראות באמור לעיל…") מונה 140% "ללא רפורמה", 117% באופק חדש ו־125% בעוז לתמורה, ואינו מזכיר את ה־150% כלל.

אותו משפט בחוזר תש"פ/9 §1(ז) מגביל "מורה המועסק שלא עפ"י תנאי הרפורמה" ל־140%, והוא אינו חל על מנהלים; כאן הנושא הורחב לכל עובד הוראה, והחפיפה נוצרת.
"""
reading = "ההגבלה של המנהל עצמו חלה על מנהל שאינו ברפורמה — 150% — ככלל הספציפי למנהלים; ה־140% נקרא כהגבלה למורים שאינם ברפורמה, כבסיכום שב־§1 (הפסקה \"אין לראות באמור לעיל…\")."
l4 = "l4/circulars/2019-20_tashaf_11.l4"
evidence = "`a non-reform principal is given both 140% and 150%`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2019-20_tashaf_11-b"
kind = "gap"
stage = "writing"
keys = ["art_3__para_1__subpara_a", "art_3__para_1__subpara_b"]
quote = "יהיה זכאי לקבל מדי שנה זוג נעליים ושני חלוקים · יהיה זכאי לקבל שני חלוקים לשנה"
title = "עובד הוראה בחינוך הטכנולוגי המלמד מקצועות משתי הרשימות: 557 ₪, 346 ₪ או שניהם?"
body = """
§3.1(א) נותן לעובד הוראה או למדריך מקצועי "באחד המקצועות המפורטים להלן" זוג נעליים ושני חלוקים מדי שנה (557 ₪); §3.1(ב) נותן למי שמלמד "באחד המקצועות המפורטים להלן" ברשימה השנייה שני חלוקים (346 ₪). עובד הוראה עשוי ללמד מקצועות משתי הרשימות — למשל מכטרוניקה וסיעוד.

החוזר אינו אומר אם עובד הוראה כזה מקבל את שני הפריטים (903 ₪), את הגבוה מביניהם (557 ₪, הכולל כבר שני חלוקים), או אחד מהם לפי המקצוע העיקרי שהוא מלמד; וגם אינו אומר אם החישוב היחסי לפי היקף המשרה שב־§3.3 חל על כל פריט בנפרד.

אותן הוראות מודפסות ב־15 חוזרי קצובת ביגוד מתשס"ז עד תש"פ, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-e (תשס"ז/7), F-2007-08_tashsach_06-d (תשס"ח/6), F-2008-09_tashsat_10-e (תשס"ט/10), F-2009-10_tasha_05-e (תש"ע/5), F-2010-11_tashaa_03-f (תשע"א/3), F-2011-12_tashab_13-c (תשע"ב/13), F-2012-13_tashag_08-c (תשע"ג/8), F-2012-13_tashag_09-c (תשע"ג/9), F-2013-14_tashad_08-d (תשע"ד/8), F-2014-15_tashae_07-d (תשע"ה/7), F-2015-16_tashav_08-d (תשע"ו/8), F-2016-17_tashaz_06-d (תשע"ז/6), F-2017-18_tashach_07-c (תשע"ח/7), F-2018-19_tashat_08-c (תשע"ט/8) ו־F-2019-20_tashaf_11-b (תש"פ/11).
"""
reading = "הפריט הגבוה, פעם אחת (557 ₪), באופן יחסי להיקף המשרה: זוג נעליים ושני חלוקים כוללים כבר את שני החלוקים של הרשימה השנייה."
l4 = "l4/circulars/2019-20_tashaf_11.l4"
evidence = "`a teacher of subjects on both lists is given two items`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
