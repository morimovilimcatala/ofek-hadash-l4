keys = ["art_1__para_e", "art_1__para_f"]
quote = "עובד הוראה המועסק ביותר ממשרה שלמה זכאי לקצובת הבראה הניתנת למועסק במשרה שלמה אחת בלבד · זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "מעל משרה מלאה: קצובה אחת בלבד (§1ה), או קצובה יחסית מכל מעסיק (§1ו)?"
body = """
§1ה: עובד הוראה המועסק ביותר ממשרה שלמה זכאי לקצובת ההבראה של משרה שלמה אחת בלבד. §1ו: עובד שיש לו יותר ממעסיק אחד, והיקף משרתו הכוללת אצל שניהם מעבר ל־100%, זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו.

עובד במשרה של 80% אצל מעסיק אחד ו־60% אצל מעסיק אחר מועסק ביותר ממשרה שלמה, ולכן §1ה נותן קצובה אחת; §1ו נותן 80% ממנה מהראשון ו־60% מהשני, 140% בסך הכול. §1ה אינו מגביל את עצמו למעסיק אחד, ו־§1ו אינו אומר שהוא חריג ל־§1ה.
"""
reading = "§1ו הוא הכלל המיוחד לכמה מעסיקים והוא חל עליהם, ולכן העובד שלעיל מקבל 140% בסך הכול; §1ה חל על עובד שיש לו מעסיק אחד."
