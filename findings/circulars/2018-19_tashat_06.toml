title = "האם מענק היובל משולם פעם אחת, בשנת ההשלמה, או לכל מי שבעל 25/30 שנה ומעלה?"
body = """
§2ב משלם את מענק היובל לעובד הוראה בעל ותק מצטבר "של 25 או 30 שנה ומעלה". §2ה.2 משלם אותו לעובד הוראה שהשלים 25 או 30 שנות עבודה עד 1 ביוני "באותה שנה".

לבדו, §2ב מזכה כל עובד שהגיע לסף או עבר אותו, בכל שנה; §2ה.2 מזכה את העובד בשנה שבה הוא מגיע לסף. למורה בחטיבה העליונה בעל 28 שנות ותק, הראשון נותן מענק בשנת הלימודים תשע"ט והשני אינו נותן.

אותה שאלה עולה מאותן מילים ("30 שנה ומעלה", ומתשע"ב "25 או 30 שנה ומעלה") ב־14 חוזרי מענק היובל מתשס"ז עד תש"פ, והיא נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_06-d (תשס"ז/6), F-2007-08_tashsach_05-c (תשס"ח/5), F-2008-09_tashsat_09-e (תשס"ט/9), F-2009-10_tasha_03-e (תש"ע/3), F-2010-11_tashaa_02-d (תשע"א/2), F-2011-12_tashab_12-e (תשע"ב/12), F-2012-13_tashag_07-d (תשע"ג/7), F-2013-14_tashad_07-d (תשע"ד/7), F-2014-15_tashae_04-d (תשע"ה/4), F-2015-16_tashav_07-d (תשע"ו/7), F-2016-17_tashaz_05-d (תשע"ז/5), F-2017-18_tashach_04-e (תשע"ח/4), F-2018-19_tashat_06-e (תשע"ט/6) ו־F-2019-20_tashaf_09-e (תש"פ/9).
"""
reading = "המענק מגיע לעובד בשנה שבה הוותק המזכה מושלם (§2ה.2); \"ומעלה\" נקרא כמתיר ותק שנמנה מעבר לסף באותה שנה, ולא כמענק שנתי."
l4 = "l4/circulars/2018-19_tashat_06.l4"
