Annex ד states no rounding rule. In the principal's example the full-position salary for conversion, 14,630.99 / 1.4 + 6,104.14 = 16,554.847, is printed 16,554.84 (truncated, where rounding gives 16,554.85). The next line prints 16,554.84 × 1.034 = 17,117.71, but 16,554.84 × 1.034 is 17,117.70; 17,117.71 is 1.034 times the unrounded 16,554.847. The example therefore neither rounds nor truncates consistently, and a converted salary near a grade boundary can be placed in a different grade depending on which method is applied.
"""
reading = "No rule is adopted for the agora: the encoding computes the conversion exactly and reproduces each printed figure by the method it shows."
