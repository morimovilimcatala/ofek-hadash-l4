"""
reading = "The formula as stated: the 1.034 is read as a factor the annex does not ground, and A is X × (100% + Y) / 100."
l4 = "l4/circulars/2024-25_tashpah_01.l4"
evidence = "`the examples apply an erosion factor the formula does not have`"
