body = """
§2 משלם את מענק היובל לעובד הוראה בעל ותק מצטבר בהוראה של "25 או 30 שנה ומעלה"; הבהרה 2 אומרת שעובד הוראה שהשלים אותן עד 1 ביוני "יזכה באותה שנה". החוזר אינו אומר אם עובד הוראה שכבר קיבל את המענק מקבל אותו שוב.

