quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק יובל · עובד הוראה שהשלים 25 או 30 שנות עבודה בישראל על-פי האמור להלן, ב 1 -ביוני של שנה נדונה … יזכה באותה שנה במענק יובל"
title = "מענק היובל: הוותק כפי שנקבע בספטמבר שלפני כן, או השנים שהושלמו עד 1 ביוני?"
body = """
