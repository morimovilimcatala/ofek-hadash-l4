"""
reading = "הבהרה 2 מכריעה: 25 או 30 שנים (לפי השלב) שהושלמו עד 1 ביוני של שנת המענק. זה הסעיף המאוחר והספציפי יותר, והוא בא תחת הכותרת \"הבהרות\" של הכלל שמעליו."
