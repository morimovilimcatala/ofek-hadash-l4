title = "החישוב היחסי במשרה חלקית לפי \"1/10 לכל חודש עבודה\" נותן יותר מהמשרה בשנה של שנים־עשר חודשים"
body = """
סעיף 1 מחשב את הקצובה של מורה במשרה חלקית באופן יחסי לחלקיות משרתו באותה שנה, ומסביר את המדד בסוגריים כעשירית לכל חודש עבודה. הטקסט אינו אומר אילו חודשים נמנים, ואינו אומר שהעשיריות נעצרות בעשר.

מורה המועסק בכל שנים־עשר חודשי השנה בחצי משרה מקבל 0.5 מהקצובה לפי המשרה, ו־0.6 לפי שתים־עשרה עשיריות שלה; מורה המועסק בעשרת החודשים ספטמבר–יוני מקבל 0.5 בכל מקרה. שני חלקי המשפט נותנים חלקים שונים.

אותו סעיף — "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה (1/10 לכל חודש עבודה)", ומתשע"ב "לקצובת הבראה בשיעור יחסי" — מופיע בכל חוזרי ההבראה של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-a`, `F-2007-08_tashsach_05-a`, `F-2008-09_tashsat_09-a`, `F-2009-10_tasha_03-b`, `F-2010-11_tashaa_02-a`, `F-2012-13_tashag_07-b`, `F-2013-14_tashad_07-b`, `F-2014-15_tashae_04-a`, `F-2015-16_tashav_07-a`, `F-2016-17_tashaz_05-a`, `F-2017-18_tashach_04-a`, `F-2018-19_tashat_06-a`, `F-2019-20_tashaf_09-a`, `F-2020-21_tashpa_07-a`, `F-2021-22_tashpab_06-a`, `F-2022-23_tashpag_08-a`, `F-2023-24_tashpad_10-a`, `F-2024-25_tashpah_11-a`, `F-2025-26_tashpo_07-a`. ההבדל בניסוח בין "באופן יחסי" ל"בשיעור יחסי" אינו נוגע לשאלה, ולכן כולם מאמצים קריאה אחת.

אותה שאלה, חלקיות המשרה מול "1/10 לכל חודש עבודה", עולה מאותן מילים בחוזרי דמי ההבראה מתשס"ז עד תשפ"ו, והיא נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_06-a (תשס"ז/6), F-2007-08_tashsach_05-a (תשס"ח/5), F-2008-09_tashsat_09-a (תשס"ט/9), F-2009-10_tasha_03-b (תש"ע/3), F-2010-11_tashaa_02-a (תשע"א/2), F-2011-12_tashab_12-a (תשע"ב/12), F-2012-13_tashag_07-b (תשע"ג/7), F-2013-14_tashad_07-b (תשע"ד/7), F-2014-15_tashae_04-a (תשע"ה/4), F-2015-16_tashav_07-a (תשע"ו/7), F-2016-17_tashaz_05-a (תשע"ז/5), F-2017-18_tashach_04-a (תשע"ח/4), F-2018-19_tashat_06-a (תשע"ט/6), F-2019-20_tashaf_09-a (תש"פ/9), F-2020-21_tashpa_07-a (תשפ"א/7), F-2021-22_tashpab_06-a (תשפ"ב/6), F-2022-23_tashpag_08-a (תשפ"ג/8), F-2023-24_tashpad_10-a (תשפ"ד/10), F-2024-25_tashpah_11-a (תשפ"ה/11) ו־F-2025-26_tashpo_07-a (תשפ"ו/7).
"""
