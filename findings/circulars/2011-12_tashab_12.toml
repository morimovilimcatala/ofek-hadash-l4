# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
# See findings/takanon/takanon-sherut-ovdei-horaa/1.7.toml for the fields.

[[finding]]
id = "F-2011-12_tashab_12-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1/p11", "art_1/p12"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובת הבראה בשיעור יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה)"
title = "Part-time pro-rating at \"1/10 for each month of work\" gives more than the position over a twelve-month year"
body = """
Section 1 pro-rates the allowance of a part-time teacher to the part-time position held that year, and explains the measure in brackets as one tenth for each month of work. The text does not say which months count or that the tenths stop at ten.

A teacher employed in all twelve months of the year at half a position takes 0.5 of the allowance by the position and 0.6 by twelve tenths of it; one employed for the ten months September–June takes 0.5 either way. The two halves of the sentence give different shares.
"""
reading = "The share is the position fraction (at most one, as section 1 also says) counted over at most ten months: ten months of work make the full year, and fewer make tenths of it."
l4 = "l4/circulars/2011-12_tashab_12.l4"
evidence = "`the literal tenths give more than the position`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_12-b"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p2", "art_2/p5", "art_2__para_2"]
quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק יובל · עובד הוראה שהשלים 25 או 30 שנות עבודה בישראל על-פי האמור להלן, ב 1 -ביוני של שנה נדונה … יזכה באותה שנה במענק יובל"
title = "The jubilee grant: seniority as set in the September before, or the years completed by 1 June?"
body = """
Section 2 grants the jubilee grant (25 years for the middle and upper divisions, 30 for other stages, by clarifications 3–4) by the seniority set for the teacher in September of the year before the grant. Clarification 2 grants it in a given year to a teacher who completed 25 or 30 years by 1 June of that year.

An upper-division teacher whose seniority set in September is 24 and who completes the twenty-fifth year between September and 1 June is refused the grant that June by the first clause and granted it by the second.
"""
reading = "Clarification 2 decides: 25 or 30 years (by stage) completed by 1 June of the grant year. It is the later and more specific clause, headed as a clarification of the rule above it."
l4 = "l4/circulars/2011-12_tashab_12.l4"
evidence = "`section 2 and clarification 2 date the seniority differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_12-c"
kind = "ambiguity"
stage = "writing"
keys = ["art_2/p2", "art_2/p5", "art_2__para_2"]
quote = "בעל ותק מצטבר בהוראה של 25 או 30 שנה ומעלה כולל ותק שירות צבאי · שהשלים 25 או 30 שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה\"ל)"
title = "The jubilee grant counts years of teaching in one clause and years of work in Israel in another"
body = """
Section 2 grants the jubilee grant to a teacher with 25 or 30 years of accumulated seniority IN TEACHING, military service included, at the employers, the owners and formal-education institutions. Clarification 2 grants it to a teacher who completed 25 or 30 years of WORK IN ISRAEL, compulsory IDF service included.

The measures differ: years of work in Israel outside teaching count under the second and not the first, and the military service counted is "military service" in one and "compulsory IDF service" in the other. A teacher outside the middle and upper divisions with twenty years of teaching and ten of other work in Israel is entitled under clarification 2 and not under section 2.
"""
reading = "Section 2's measure governs — accumulated teaching seniority, military service included — counted on clarification 2's date (F-2011-12_tashab_12-b): clarifications 3 and 4 name the qualifying years as \"ותק מצטבר, כהגדרתו לעיל\", seniority as section 2 defines it, so \"years of work in Israel\" is read as that seniority. Both measures are inputs, so clarification 2's can be run instead."
l4 = "l4/circulars/2011-12_tashab_12.l4"
evidence = "`section 2 and clarification 2 count different years`"
depends_on = ["F-2011-12_tashab_12-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_12-d"
kind = "contradiction"
stage = "writing"
keys = ["art_1/p13", "art_1/p14", "art_1/p15", "art_1/p16"]
quote = "עובד הוראה המועסק ביותר ממשרה שלמה זכאי לקצובת הבראה הניתנת למועסק במשרה שלמה אחת בלבד · עובד הוראה המועסק אצל יותר ממעסיק אחד, והיקף משרתו הכוללת אצל שני המעסיקים הינו מעבר ל- 100%משרה, זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "A teacher at two employers beyond a full position: one position's allowance, or each employer's share?"
body = """
Section 1 gives a teacher employed in more than one full position the allowance of "one full position only". The next sentence gives a teacher at more than one employer whose position at both together exceeds 100% the share proportional to the position held at EACH employer, separately.

A teacher at two employers is employed beyond a full position under both sentences. At 0.8 of a position with one and 0.6 with the other, the first sentence allows one position's allowance in all, and the second has the two employers pay 0.8 and 0.6, together 1.4 positions' allowance.
"""
reading = "The multi-employer sentence governs a teacher at several employers: each employer pays the share of the position held with it, capped at one position per employer; the one-position cap of the sentence before applies to a teacher beyond a full position at one employer."
l4 = "l4/circulars/2011-12_tashab_12.l4"
evidence = "`the employers together pay more than one full position's allowance`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
