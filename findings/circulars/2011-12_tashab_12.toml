[[finding]]
id = "F-2011-12_tashab_12-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1/p11", "art_1/p12"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובת הבראה בשיעור יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה)"
title = "החישוב היחסי במשרה חלקית לפי \"1/10 לכל חודש עבודה\" נותן יותר מהמשרה בשנה של שנים־עשר חודשים"
body = """
סעיף 1 מחשב את הקצובה של מורה במשרה חלקית באופן יחסי לחלקיות משרתו באותה שנה, ומסביר את המדד בסוגריים כעשירית לכל חודש עבודה. הטקסט אינו אומר אילו חודשים נמנים, ואינו אומר שהעשיריות נעצרות בעשר.

מורה המועסק בכל שנים־עשר חודשי השנה בחצי משרה מקבל 0.5 מהקצובה לפי המשרה, ו־0.6 לפי שתים־עשרה עשיריות שלה; מורה המועסק בעשרת החודשים ספטמבר–יוני מקבל 0.5 בכל מקרה. שני חלקי המשפט נותנים חלקים שונים.
"""
reading = "החלק הוא שבר המשרה (לכל היותר אחת, כפי שסעיף 1 אומר גם הוא) הנמנה על פני עשרה חודשים לכל היותר: עשרה חודשי עבודה הם השנה המלאה, ופחות מהם הם עשיריות שלה."
l4 = "l4/circulars/2011-12_tashab_12.l4"
evidence = "`the literal tenths give more than the position`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_12-b"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p2", "art_2/p5", "art_2__para_2"]
quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק יובל · עובד הוראה שהשלים 25 או 30 שנות עבודה בישראל על-פי האמור להלן, ב 1 -ביוני של שנה נדונה … יזכה באותה שנה במענק יובל"
title = "מענק היובל: הוותק כפי שנקבע בספטמבר שלפני כן, או השנים שהושלמו עד 1 ביוני?"
body = """
סעיף 2 מעניק את מענק היובל (25 שנים לחטיבת הביניים ולחטיבה העליונה, 30 לשלבים אחרים, לפי הבהרות 3–4) לפי הוותק שנקבע למורה בספטמבר בשנה שלפני מתן המענק. הבהרה 2 מעניקה אותו בשנה נדונה למורה שהשלים 25 או 30 שנים עד 1 ביוני של אותה שנה.

מורה בחטיבה העליונה שהוותק שנקבע לו בספטמבר הוא 24, ושמשלים את השנה העשרים וחמש בין ספטמבר ל־1 ביוני, אינו מקבל את המענק באותו יוני לפי הסעיף הראשון ומקבל אותו לפי השני.
"""
reading = "הבהרה 2 מכריעה: 25 או 30 שנים (לפי השלב) שהושלמו עד 1 ביוני של שנת המענק. זה הסעיף המאוחר והספציפי יותר, והוא בא תחת הכותרת \"הבהרות\" של הכלל שמעליו."
l4 = "l4/circulars/2011-12_tashab_12.l4"
evidence = "`section 2 and clarification 2 date the seniority differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_12-c"
kind = "ambiguity"
stage = "writing"
keys = ["art_2/p2", "art_2/p5", "art_2__para_2"]
quote = "בעל ותק מצטבר בהוראה של 25 או 30 שנה ומעלה כולל ותק שירות צבאי · שהשלים 25 או 30 שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה\"ל)"
title = "מענק היובל מונה שנות הוראה בסעיף אחד ושנות עבודה בישראל בסעיף אחר"
body = """
סעיף 2 מעניק את מענק היובל למורה בעל ותק מצטבר של 25 או 30 שנה בהוראה, כולל שירות צבאי, אצל המעסיקים, הבעלויות ובמוסדות החינוך הפורמאלי. הבהרה 2 מעניקה אותו למורה שהשלים 25 או 30 שנות עבודה בישראל, ובכלל זה שירות חובה בצה"ל.

המדדים נבדלים: שנות עבודה בישראל מחוץ להוראה נמנות לפי השני ולא לפי הראשון, והשירות הצבאי הנמנה הוא "שירות צבאי" באחד ו"שירות חובה בצה"ל" באחר. מורה שאינו בחטיבת הביניים או בחטיבה העליונה, עם עשרים שנות הוראה ועשר שנות עבודה אחרת בישראל, זכאי לפי הבהרה 2 ואינו זכאי לפי סעיף 2.
"""
reading = "המדד של סעיף 2 קובע — ותק מצטבר בהוראה, כולל שירות צבאי — הנמנה עד המועד שבהבהרה 2 (`F-2011-12_tashab_12-b`): הבהרות 3 ו־4 נוקבות בשנים המזכות כ\"ותק מצטבר, כהגדרתו לעיל\", ותק כפי שסעיף 2 מגדיר אותו, ולכן \"שנות עבודה בישראל\" נקראות כאותו ותק. שני המדדים הם קלטים, כך שאפשר להריץ במקומו את המדד של הבהרה 2."
l4 = "l4/circulars/2011-12_tashab_12.l4"
evidence = "`section 2 and clarification 2 count different years`"
depends_on = ["F-2011-12_tashab_12-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_12-d"
kind = "contradiction"
stage = "writing"
keys = ["art_1/p13", "art_1/p14", "art_1/p15", "art_1/p16"]
quote = "עובד הוראה המועסק ביותר ממשרה שלמה זכאי לקצובת הבראה הניתנת למועסק במשרה שלמה אחת בלבד · עובד הוראה המועסק אצל יותר ממעסיק אחד, והיקף משרתו הכוללת אצל שני המעסיקים הינו מעבר ל- 100%משרה, זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "מורה אצל שני מעסיקים מעבר למשרה מלאה: קצובה של משרה אחת, או החלק של כל מעסיק?"
body = """
סעיף 1 נותן לעובד הוראה המועסק ביותר ממשרה שלמה את הקצובה "הניתנת למועסק במשרה שלמה אחת בלבד". המשפט שאחריו נותן לעובד הוראה המועסק אצל יותר ממעסיק אחד, שהיקף משרתו הכוללת אצל שניהם עולה על 100%, את הקצובה היחסית להיקף משרתו אצל כל מעסיק, בנפרד.

מורה אצל שני מעסיקים מועסק מעבר למשרה מלאה לפי שני המשפטים. ב־0.8 משרה אצל האחד ו־0.6 אצל האחר, המשפט הראשון מתיר קצובה של משרה אחת בסך הכול, והשני מטיל על שני המעסיקים לשלם 0.8 ו־0.6, יחד קצובה של 1.4 משרות.
"""
reading = "המשפט על כמה מעסיקים קובע לגבי מורה אצל כמה מעסיקים: כל מעסיק משלם את החלק של המשרה אצלו, עד משרה אחת לכל מעסיק; תקרת המשרה האחת שבמשפט הקודם חלה על מורה המועסק מעבר למשרה מלאה אצל מעסיק אחד."
l4 = "l4/circulars/2011-12_tashab_12.l4"
evidence = "`the employers together pay more than one full position's allowance`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
