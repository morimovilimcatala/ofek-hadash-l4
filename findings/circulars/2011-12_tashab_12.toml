quote = "בעל ותק מצטבר בהוראה של 25 או 30 שנה ומעלה כולל ותק שירות צבאי · שהשלים 25 או 30 שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה\"ל)"
title = "מענק היובל מונה שנות הוראה בסעיף אחד ושנות עבודה בישראל בסעיף אחר"
body = """
סעיף 2 מעניק את מענק היובל למורה בעל ותק מצטבר של 25 או 30 שנה בהוראה, כולל שירות צבאי, אצל המעסיקים, הבעלויות ובמוסדות החינוך הפורמאלי. הבהרה 2 מעניקה אותו למורה שהשלים 25 או 30 שנות עבודה בישראל, ובכלל זה שירות חובה בצה"ל.

המדדים נבדלים: שנות עבודה בישראל מחוץ להוראה נמנות לפי השני ולא לפי הראשון, והשירות הצבאי הנמנה הוא "שירות צבאי" באחד ו"שירות חובה בצה"ל" באחר. מורה שאינו בחטיבת הביניים או בחטיבה העליונה, עם עשרים שנות הוראה ועשר שנות עבודה אחרת בישראל, זכאי לפי הבהרה 2 ואינו זכאי לפי סעיף 2.

אותה לשון — "ותק מצטבר בהוראה … כולל ותק שירות צבאי" בכלל, ו"שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה"ל)" בהבהרה — מופיעה בחוזרי מענק היובל של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-c`, `F-2007-08_tashsach_05-b`, `F-2008-09_tashsat_09-d`, `F-2009-10_tasha_03-d`, `F-2010-11_tashaa_02-c`, `F-2012-13_tashag_07-e`, `F-2013-14_tashad_07-e`, `F-2014-15_tashae_04-e`, `F-2015-16_tashav_07-e`, `F-2016-17_tashaz_05-e`, `F-2017-18_tashach_04-d`, `F-2018-19_tashat_06-d`, `F-2019-20_tashaf_09-d`, `F-2020-21_tashpa_07-e`, `F-2021-22_tashpab_06-f`, `F-2022-23_tashpag_08-d`, `F-2023-24_tashpad_10-g`, `F-2024-25_tashpah_11-f`, `F-2025-26_tashpo_07-d`; כולם מאמצים קריאה אחת. החוזר הזה שונה מקודמיו: ההבהרה מוסיפה "על־פי האמור להלן", והבהרות 3 ו־4 נוקבות בשנים המזכות כ"ותק מצטבר, כהגדרתו לעיל"; בחוזרי תשס"ז עד תשע"א אין המילים האלה. בחוזרי תשע"ג עד תשפ"ו הן מופיעות כמו כאן. הן מחזקות כאן את הקריאה, אך אינן נדרשות לה.

אותה שאלה, שנות הוראה מול שנות עבודה בישראל, עולה בחוזרי מענק היובל שמדפיסים את שתי המילים, והיא נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_06-c (תשס"ז/6), F-2009-10_tasha_03-d (תש"ע/3), F-2010-11_tashaa_02-c (תשע"א/2), F-2011-12_tashab_12-c (תשע"ב/12), F-2012-13_tashag_07-e (תשע"ג/7), F-2013-14_tashad_07-e (תשע"ד/7), F-2014-15_tashae_04-e (תשע"ה/4), F-2015-16_tashav_07-e (תשע"ו/7), F-2016-17_tashaz_05-e (תשע"ז/5), F-2017-18_tashach_04-d (תשע"ח/4), F-2018-19_tashat_06-d (תשע"ט/6), F-2019-20_tashaf_09-d (תש"פ/9), F-2020-21_tashpa_07-e (תשפ"א/7), F-2021-22_tashpab_06-f (תשפ"ב/6), F-2022-23_tashpag_08-d (תשפ"ג/8), F-2023-24_tashpad_10-g (תשפ"ד/10), F-2024-25_tashpah_11-f (תשפ"ה/11) ו־F-2025-26_tashpo_07-d (תשפ"ו/7).
"""
reading = "המדד של סעיף 2 עצמו קובע את מה שנספר: ותק מצטבר בהוראה אצל המעסיקים, הבעלויות ובמוסדות החינוך הפורמאלי, כולל שירות צבאי, ועם שנות החופשה ללא תשלום שנרכשו לפי הבהרה א, הנמנה עד 1 ביוני של שנת המענק (`F-2011-12_tashab_12-b`). הבהרה 2 באה תחת הכותרת \"הבהרות\" של הכלל שמעליה ונוקבת ביום שעד אליו הוותק מושלם; היא מבהירה את הכלל ואינה קובעת זכאות אחרת, ולכן \"שנות עבודה בישראל\" שבה נקראות כאותו ותק. זו הקריאה בכל חוזרי מענק היובל. שני המדדים הם קלטים בקידוד, כך שאפשר להריץ במקומו את מדד ההבהרה. בחוזר הזה הקריאה נשענת גם על הבהרות 3 ו־4, הנוקבות בשנים המזכות כ\"ותק מצטבר, כהגדרתו לעיל\"."
