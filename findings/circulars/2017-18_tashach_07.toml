לעובד במשרה של 80% אצל מעסיק אחד ו־60% אצל מעסיק אחר, §1ד מגביל את הקצובה לקצובה מלאה אחת (2,118 ש"ח); §1ה מחייב את המעסיקים לשלם 80% ו־60% ממנה, 140% (2,965.20) בסך הכול. §1ד אינו מגביל את עצמו למעסיק אחד, ו־§1ה אינו אומר שהוא חריג ל־§1ד.
