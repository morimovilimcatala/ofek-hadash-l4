title = "מורה בחינוך הטכנולוגי במקצועות משתי הרשימות: נעליים ושני חלוקים, או זאת ועוד שני חלוקים?"
body = """
§3.1(א) נותן לעובד הוראה בחינוך הטכנולוגי או למדריך מקצועי באחד משלושה עשר מקצועות זוג נעליים ושני חלוקים לשנה (557 ש"ח); §3.1(ב) נותן לזה שבאחד משלושה עשר מקצועות אחרים שני חלוקים לשנה (346 ש"ח).

מורה המלמד מקצועות משתי הרשימות — מכטרוניקה ומערכות אלקטרוניות, למשל — עומד בשני הסעיפים־משנה. החוזר אינו אומר אם הזכאויות מצטברות (557 ועוד 346) או שהגדולה מביניהן, שכבר כוללת שני חלוקים, היא הזכאות כולה.

אותן הוראות מודפסות ב־15 חוזרי קצובת ביגוד מתשס"ז עד תש"פ, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-e (תשס"ז/7), F-2007-08_tashsach_06-d (תשס"ח/6), F-2008-09_tashsat_10-e (תשס"ט/10), F-2009-10_tasha_05-e (תש"ע/5), F-2010-11_tashaa_03-f (תשע"א/3), F-2011-12_tashab_13-c (תשע"ב/13), F-2012-13_tashag_08-c (תשע"ג/8), F-2012-13_tashag_09-c (תשע"ג/9), F-2013-14_tashad_08-d (תשע"ד/8), F-2014-15_tashae_07-d (תשע"ה/7), F-2015-16_tashav_08-d (תשע"ו/8), F-2016-17_tashaz_06-d (תשע"ז/6), F-2017-18_tashach_07-c (תשע"ח/7), F-2018-19_tashat_08-c (תשע"ט/8) ו־F-2019-20_tashaf_11-b (תש"פ/11).
"""
reading = "הזכאויות אינן מצטברות: המורה מקבל נעליים ושני חלוקים (557), שכבר כוללים את שני החלוקים של §3.1(ב)."
