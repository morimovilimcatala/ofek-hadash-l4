body = """
§א מעדכן את תוספת שקלית 2016 מ־1.1.2022 בשתי שורות: "מורים ברפורמת עוז לתמורה" (1,433.98 ₪) ו"מורים שאינם ברפורמת עוז לתמורה ומנהלים" (1,212.59 ₪).

השורה השנייה נקראת בשתי דרכים. אם "ומנהלים" עומד לעצמו, כל מנהל מקבל 1,212.59 ₪, לרבות מנהל המועסק בעוז לתמורה. אם "שאינם ברפורמת עוז לתמורה" מסייג גם את המנהלים, מנהל המועסק בעוז לתמורה אינו נמצא באף שורה — הראשונה מונה רק מורים — והחוזר אינו נותן למנהל כזה סכום כלשהו, אף ש־§ב עוסק בדיוק במנהלים אלה (תוספת '87 מעבר רפורמה למנהלים בעוז לתמורה) ופסקה 19 מחילה את החוזר על עובדים בשני המסלולים.

אותן מילים, "מורים שאינם ברפורמת עוז לתמורה ומנהלים", מודפסות בחוזרי תוספת שקלית 2016 לחטיבה העליונה מתשע"ח ואילך, והשאלה נרשמה עם אותה קריאה בכל אחד מהם עד תשפ"ד: F-2017-18_tashach_05-b (תשע"ח/5), F-2018-19_tashat_03-b (תשע"ט/3), F-2019-20_tashaf_03-a (תש"פ/3), F-2020-21_tashpa_05-a (תשפ"א/5), F-2021-22_tashpab_04-a (תשפ"ב/4), F-2022-23_tashpag_06-a (תשפ"ג/6) ו־F-2023-24_tashpad_05-a (תשפ"ד/5).
"""
