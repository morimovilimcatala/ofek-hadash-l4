quote = "מורים ברפורמת עוז לתמורה … מורים שאינם ברפורמת עוז לתמורה ומנהלים"
title = "Does \"and principals\" mean every principal, or only principals outside Oz LaTmura?"
body = """
§א sets the 2016 shekel supplement from 1.1.2022 in two rows: "teachers in the Oz LaTmura reform" (₪1,433.98) and "teachers who are not in the Oz LaTmura reform and principals" (₪1,212.59).

The second row reads two ways. If "and principals" stands alone, every principal takes ₪1,212.59, including a principal employed under Oz LaTmura. If "who are not in the Oz LaTmura reform" qualifies the principals as well, a principal employed under Oz LaTmura is in neither row — the first names only teachers — and the circular gives such a principal no amount, although §ב deals with exactly these principals (the '87 transition supplement of principals under Oz LaTmura) and ¶17 applies the circular to employees on both tracks.
"""
reading = "\"And principals\" is every principal: a principal under Oz LaTmura takes the second row's amount. It is the reading under which every employee the circular applies to has exactly one row."
l4 = "l4/circulars/2021-22_tashpab_04.l4"
evidence = "`a principal under Oz LaTmura has a row only if the principals are not qualified by the reform`"
