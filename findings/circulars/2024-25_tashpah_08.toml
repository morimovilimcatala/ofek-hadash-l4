[[finding]]
id = "F-2024-25_tashpah_08-a"
kind = "overlap"
stage = "writing"
keys = ["art_f"]
quote = "מורה בגיל 50-55 המלמדת 18 שעות ממשיכה להיות זכאית לתוספת אם ומורה בגיל 55 ומעלה המלמדת 16 שעות ממשיכה להיות זכאית לתוספת אם"
title = "A 55-year-old teacher is in two bands of the mother's supplement"
body = """
Part א, ו restates the frontal hours that earn the mother's supplement in Oz LaTmura: 19 under 50, 18 "at age 50-55", and 16 "at age 55 and over". Age 55 is in the second band and in the third.

A 55-year-old mother who teaches 16 frontal hours is entitled by the third band and not by the second, which asks for 18.
"""
reading = "The band that opens at 55 governs age 55 (16 hours), reading the middle band as 50 up to but not including 55; it is the reading under which every age has one answer and every band still applies to some age."
l4 = "l4/circulars/2024-25_tashpah_08.l4"
evidence = "`ו gives a 55-year-old two hour counts`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_08-b"
kind = "undefined-term"
stage = "writing"
keys = ["art_f__para_b__subpara_1__cls_b", "art_f__para_b__subpara_1__cls_b/p3", "art_f__para_b__subpara_1__cls_b/p4"]
quote = "* 3 סה\"כ שעות פרונטאליות לפי סעיף א ( שעות גיל – )25"
title = "The normative key divides an owning body's hours by its \"age hours\", which the circular never defines"
body = """
Part ב, 1.ב gives the individual and teaching-support hours of the normative key as 3 × (the frontal hours of 1.א) / (25 − age hours) and 10 × (the same) / (25 − age hours). The key is computed for an owning body as a whole, from its totals in the payments system; "age hours" (שעות גיל) is a reduction of a single teacher's frontal hours by that teacher's age.

The circular does not say whose age hours enter a body's key — none, an average, a sum — and the answer moves the result: with no age hours the denominator is 25, with four it is 21, and the individual hours of the same body grow by a fifth.
"""
reading = "Age hours are an input of the key, to be supplied by whoever computes it; the examples use none (25 in the denominator), the new work week's full frontal load."
l4 = "l4/circulars/2024-25_tashpah_08.l4"
evidence = "`the key's individual hours turn on the undefined age hours`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

