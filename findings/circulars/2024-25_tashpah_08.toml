quote = "התקצוב בגין מורים המועסקים ב 33% -משרה ועד 75%משרה לא יעלה על 0.5ש\"ש. התקצוב בגין מורים המועסקים 75%משרה ועד 100%משרה (כולל) לא יעלה על 1ש\"ש."
title = "A teacher on exactly 75% of a position is capped at half an hour and at one hour"
body = """
Part ג, ח caps the individual budgeting at 0.5 weekly hour for a teacher employed "from 33% up to 75%" and at one weekly hour for one employed "from 75% up to 100% (inclusive)". A position of exactly 75% is in both bands, and the two caps differ by half an hour.
"""
reading = "The band that opens at 75% governs it (a cap of one hour): the first band's \"up to 75%\" is read as excluding its end, as the second band marks its own end inclusive expressly."
l4 = "l4/circulars/2024-25_tashpah_08.l4"
evidence = "`ח gives a 75% position two caps`"
read_by = "Claude (L4 encoder)"
