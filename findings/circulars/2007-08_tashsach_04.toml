[[finding]]
id = "F-2007-08_tashsach_04-a"
kind = "gap"
stage = "writing"
keys = ["art_2__para_e", "art_2__para_e/p3", "art_2__para_e/p5", "art_2__para_e/p7"]
quote = "האמור בסעיף-קטן א מתייחס לעובד הוראה המועסק בהיקף משרה של 90%לפחות, והוא יחול על עובדי הוראה המועסקים בהיקף משרה נמוך יותר בשינויים הבאים · 89% - 75%משרה · 74% - 50%משרה · 49% - 25%משרה"
title = "The part-time table of individual hours has no row under 25% and none between its bands' printed bounds"
body = """
§2ה extends the stage-A supplement from positions of at least 90% to "employees in a lower position, with the following changes" and gives three bands: 89%–75%, 74%–50% and 49%–25%, each with its individual-hour duty from 1.1.2008 and from 1.1.2009.

Two kinds of position fall in no row. A position under 25% is "lower" and so within the clause, but no band gives its duty. And the bands are printed in whole percent, while a teaching position is a ratio of hours that is rarely a whole percent: 89.5%, 74.5% or 49.5% is below one band's floor and above the next band's ceiling. For those positions the circular sets no duty of individual hours, and the supplement is conditioned on doing them.
"""
reading = "Each band runs up to the next band's lowest percent — [75%, 90%), [50%, 75%), [25%, 50%) — and a position under 25% owes what the lowest row sets (one hour a month in 2008, two from 1.1.2009), since §2ה extends the supplement to every lower position."
l4 = "l4/circulars/2007-08_tashsach_04.l4"
evidence = "`the part-time table leaves positions without a row`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2007-08_tashsach_04-b"
kind = "gap"
stage = "writing"
keys = ["art_2__para_e/p11", "art_2__para_e/p12", "art_2__para_c"]
quote = "עובד הוראה שלא יבצע את האמור לעיל, ינוכה משכרו תשלום בגין מניין השעות הפרטניות אותן לא ביצע ובלבד שהמעסיק איפשר לו לבצען"
title = "Individual hours not made up are docked \"payment for the number of hours\" at no stated rate"
body = """
The Ministry's note to §2ה: individual hours not done in January 2008 are made up in February–March 2008, and a teacher who does not is docked, with April 2008's salary, "a payment for the number of individual hours not done".

The circular sets no payment per individual hour. The hour is not paid by the hour: it earns a percentage supplement of the combined salary and other components (§2א), and §2ג says that supplement is NOT counted in the hour value (ערך שעה). So neither the hour value nor any per-hour share of the supplement is named as the rate, and the two give different deductions.
"""
reading = "The rate docked per hour is an input of the deduction, left to whoever sets it; the encoding fixes only the number of hours and the month (April 2008), and docks nothing where the employer did not let the teacher do the hours."
l4 = "l4/circulars/2007-08_tashsach_04.l4"
evidence = "`the April deduction depends on a rate the circular does not set`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2007-08_tashsach_04-c"
kind = "contradiction"
stage = "writing"
keys = ["att_1__hc_1/p4", "art_2__para_e"]
quote = "יחויבו כל המורים בתוספת של שעה פרטנית אחת לשבוע עם קבוצת תלמידים (מתלמיד אחד ועד חמישה תלמידים), תמורתה יקבלו תוספת של 4.5%לשכרם"
title = "The pedagogical annex tells principals every teacher owes a weekly individual hour; §2ה gives part-timers a monthly duty"
body = """
The pedagogical annex, addressed to school principals, states that with the agreement "all teachers" are obliged to one individual hour a week, for a 4.5% supplement. §2ה, the instruction to the owning bodies, sets that weekly hour only for positions of at least 90%; below it the duty in 2008 is three, two or one hour a month according to the band.

For a teacher on a half position the annex requires one hour every week and §2ה two hours a month — and it is the principal, reading the annex, who sets the hour (§2ו).
"""
reading = "§2ה governs the duty: it is the operative instruction that implements the agreement, and the annex is read as describing the full-position case."
l4 = "l4/circulars/2007-08_tashsach_04.l4"
evidence = "`the annex and §2ה differ for a half position`"
depends_on = ["F-2007-08_tashsach_04-a"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
