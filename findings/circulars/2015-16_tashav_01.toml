# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2015-16_tashav_01-a"
kind = "contradiction"
stage = "writing"
keys = ["art_4__para_a", "art_5__para_d", "art_5__para_f"]
quote = "מועד תשלום המענק : במשכורת חודש אוגוסט, החל משנה\"ל תשע\"ד (8/2014) ועד לשנה\"ל תשע\"ז (8/2017) · נא היערכותכם לתשלום המענק למורים הזכאים במשכורת חודש נובמבר, בגין השנים תשע\"ד – תשע\"ה"
title = "The grant for 2013-14 and 2014-15: due in August 2014 and 2015, or in November 2015?"
body = """
§4א pays the grant in August of each year for the school year just ended, and §5ד sets the payment date as August's salary "from 2013-14 (8/2014) to 2016-17 (8/2017)". The circular is dated 5.11.2015. §5ו tells the owners to prepare to pay the grant for 2013-14 and 2014-15 with November 2015's salary.

For 2013-14 the circular gives two due dates — August 2014 (§5ד) and November 2015 (§5ו) — and for 2014-15 August 2015 and November 2015. An owner who paid in November 2015 is late by §5ד and on time by §5ו.
"""
reading = "§5ו governs the two years that ended before the circular was issued (2013-14 and 2014-15: November 2015's salary); §4א and §5ד govern 2015-16 and 2016-17 (August 2016 and August 2017)."
l4 = "l4/circulars/2015-16_tashav_01.l4"
evidence = "`§5ד and §5ו give 2013-14's grant different months`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2015-16_tashav_01-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_3__para_a__subpara_4", "art_5__para_a"]
quote = "העובד אינו זכאי לתשלום מענק יובל · הזכאות למענק התמדה לעובד הוראה תסתיים בהגיע עובד ההוראה לזכאות לקבלת מענק יובל"
title = "After the jubilee year: is the persistence grant barred only that year, or for good?"
body = """
§3.א.4 makes it a condition, for a given school year, that "the employee is not entitled to payment of the jubilee grant". §5א says the entitlement to the persistence grant "ends when the employee reaches entitlement to the jubilee grant".

Read as a yearly condition, §3.א.4 bars the grant only in a year in which a jubilee grant is payable, and an employee who received the jubilee grant in an earlier year qualifies again the next year. Read with §5א, the persistence grant ends for good once the jubilee entitlement is reached. For such an employee in the following year the two give different answers.
"""
reading = "§5א governs: from the year the employee becomes entitled to the jubilee grant, no persistence grant is paid; §3.א.4 is read as stating the same condition."
l4 = "l4/circulars/2015-16_tashav_01.l4"
evidence = "`§3.א.4 and §5א part for a past jubilee`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
