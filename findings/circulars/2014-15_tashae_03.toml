title = "The coordinator's summer pay is \"by the period served\", with no period to measure it against"
body = """
Section 1(ג) pays the adjustments coordinator's allowance from the appointment (not before 24.2.2015) and says that "in the summer month" a part of the allowance is paid "in proportion to the period in which the teacher served in the role". It names neither the period the service is measured against (the ten months of the school year, September to June, or the twelve of the year), nor which summer months it means ("the summer month", in the singular, where July and August are both summer months).

For a coordinator appointed on 24.2.2015, the service is about four of the school year's ten teaching months, or about six of the twelve months to the end of August; on a monthly allowance of 600 the two measures pay 240 and 300 for each summer month.
"""
reading = "The months served out of the ten months of the school year (September to June), applied to each summer month (July and August)."
