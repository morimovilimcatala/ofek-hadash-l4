quote = "אם העדרות החודשית של עובד ההוראה היא פחות מ 10% -ממכסת עבודתו הקבועה · אם העדרות תעלה על 10%"
title = "A month's absence of exactly 10% falls under neither scale of deduction"
body = """
Section 1 sets the narrow deduction, from actual working hours only, where the month's absence is LESS than 10% of the teacher's fixed work quota. Section 2 sets the wide deduction, also from education and matriculation-preparation hours and from the role additions, where the absence EXCEEDS 10%.

Absence of exactly 10% is neither less than nor more than 10%, so the circular does not say which deduction applies to it. On a month paying 8,000 ₪ for working hours and 2,000 ₪ for the other components, the two scales deduct 800 ₪ and 1,000 ₪.
"""
reading = "The wide deduction needs absence that exceeds 10%, so exactly 10% is deducted under section 1, from actual working hours only."
l4 = "l4/circulars/2009-10_tasha_04.l4"
evidence = "`neither section governs exactly 10%`"
