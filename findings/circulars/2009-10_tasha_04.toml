quote = "אם העדרות החודשית של עובד ההוראה היא פחות מ 10% -ממכסת עבודתו הקבועה · אם העדרות תעלה על 10%"
title = "היעדרות חודשית של 10% בדיוק אינה נופלת תחת אף אחד משני סולמות הקיזוז"
body = """
סעיף 1 קובע את הקיזוז המצומצם, משעות העבודה בפועל בלבד, כשההיעדרות החודשית היא פחות מ־10% ממכסת העבודה הקבועה של המורה. סעיף 2 קובע את הקיזוז הרחב, גם משעות החינוך והבגרות ומהתוספות האחוזיות הניתנות בגין תפקידים, כשההיעדרות עולה על 10%.

היעדרות של 10% בדיוק אינה פחות מ־10% ואינה יותר מ־10%, ולכן החוזר אינו אומר איזה קיזוז חל עליה. בחודש שמשלם 8,000 ₪ בעד שעות העבודה ו־2,000 ₪ בעד הרכיבים האחרים, שני הסולמות מקזזים 800 ₪ ו־1,000 ₪.

אותן מילים מודפסות בסעיף 1.25.14 לתקנון, שהחוזרים מפנים אליו, ובחוזרי תשס"ח/1 ותש"ע/4, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-1.25-x, F-2007-08_tashsach_01-a ו־F-2009-10_tasha_04-a.
"""
reading = "הקיזוז הרחב דורש היעדרות שעולה על 10%, ולכן 10% בדיוק מקוזזים לפי סעיף 1, משעות העבודה בפועל בלבד."
