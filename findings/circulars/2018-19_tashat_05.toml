[[finding]]
id = "F-2018-19_tashat_05-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1/p3"]
quote = "ויש לו ניסיון ניהולי מוכח של 5 שנים לפחות במערכת החינוך או במערכת שבה ניהל צוות המונה לא פחות מ 30-עובדים"
title = "Does the 30-employee team requirement qualify management in the education system too?"
body = """
The note to the first threshold condition lets a candidate with three full years of teaching (instead of five) apply, if he has "proven management experience of at least 5 years in the education system or in a system in which he managed a team of no fewer than 30 employees", full-time and including training, guiding or teaching of employees.

The 30-employee clause reads two ways: as qualifying only "a system" outside education (any management in the education system counts, whatever its size), or as qualifying both ("in the education system or in another system, managing a team of 30 or more"). A deputy principal who managed ten teachers for five years meets the alternative on the first reading and not on the second, so the same candidate is eligible or not.
"""
reading = "The 30-employee test qualifies only management outside the education system: \"in the education system\" stands on its own, and the comparison clause describes the other kind of system."
l4 = "l4/circulars/2018-19_tashat_05.l4"
evidence = "`the management alternative reads two ways for a small education team`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2018-19_tashat_05-b"
kind = "contradiction"
stage = "writing"
keys = ["preamble/p27", "art_12/p6", "art_12/p15"]
quote = "אין למנות מנהל על בית הספר, שלא על דעת משרד החינוך · לא ימונה מנהל שלא נמצא ראוי ומתאים לתפקיד ע\"י משרד החינוך · אין לבחור במועמד, אשר נציג/י משרד החינוך מצאו כי אינו מתאים לתפקיד"
title = "The Ministry's say over the appointment: a required finding of fitness, or only a veto on a finding of unfitness?"
body = """
Three passages state the Ministry's role in choosing the principal. The introduction (¶27): no principal may be appointed "not with the Ministry's agreement (על דעת), and certainly not against its position". The joint circular the owners are bound by (quoted at ¶6): "no principal shall be appointed who was not found worthy and fit for the post by the Ministry". And ¶15: the committee's members select by the owner's rules, "but a candidate whom the Ministry's representative(s) found unfit for the post may not be chosen".

The first two make a positive finding or agreement of the Ministry a condition; the third only bars a candidate the representatives found unfit. Where the representatives made no finding either way — or, with two representatives, where they did not agree — ¶15 lets the committee choose the candidate and ¶6 and ¶27 forbid his appointment.
"""
reading = "The positive test governs: a candidate may be appointed only if he meets the thresholds, the Ministry found him fit, and no Ministry representative found him unfit."
l4 = "l4/circulars/2018-19_tashat_05.l4"
evidence = "`the Ministry tests disagree when the Ministry made no finding`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
