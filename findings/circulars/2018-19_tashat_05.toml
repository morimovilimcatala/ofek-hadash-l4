# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2018-19_tashat_05-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1/p3"]
quote = "ויש לו ניסיון ניהולי מוכח של 5 שנים לפחות במערכת החינוך או במערכת שבה ניהל צוות המונה לא פחות מ 30-עובדים"
title = "האם דרישת הצוות של 30 עובדים מסייגת גם ניהול במערכת החינוך?"
body = """
ההערה לתנאי הסף הראשון מאפשרת להגיש מועמדות למי שיש לו שלוש שנות הוראה מלאות (במקום חמש), אם יש לו ניסיון ניהולי מוכח של 5 שנים לפחות במערכת החינוך או במערכת שבה ניהל צוות המונה לא פחות מ־30 עובדים, במשרה מלאה ובכלל זה הכשרה, הדרכה או הוראה של עובדים.

פסוקית 30 העובדים נקראת בשתי דרכים: כמסייגת רק "מערכת" שמחוץ לחינוך (כל ניהול במערכת החינוך נמנה, יהא היקפו אשר יהא), או כמסייגת את שתיהן ("במערכת החינוך או במערכת אחרת, בניהול צוות של 30 או יותר"). סגן מנהל שניהל עשרה מורים במשך חמש שנים עומד בחלופה לפי הקריאה הראשונה ואינו עומד בה לפי השנייה, כך שאותו מועמד זכאי להגיש מועמדות או אינו זכאי.
"""
reading = "מבחן 30 העובדים מסייג רק ניהול מחוץ למערכת החינוך: \"במערכת החינוך\" עומד בפני עצמו, ופסוקית ההשוואה מתארת את הסוג האחר של מערכת."
l4 = "l4/circulars/2018-19_tashat_05.l4"
evidence = "`the management alternative reads two ways for a small education team`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2018-19_tashat_05-b"
kind = "contradiction"
stage = "writing"
keys = ["preamble/p27", "art_12/p6", "art_12/p15"]
quote = "אין למנות מנהל על בית הספר, שלא על דעת משרד החינוך · לא ימונה מנהל שלא נמצא ראוי ומתאים לתפקיד ע\"י משרד החינוך · אין לבחור במועמד, אשר נציג/י משרד החינוך מצאו כי אינו מתאים לתפקיד"
title = "משקלו של המשרד במינוי: נדרשת קביעה שהמועמד מתאים, או רק וטו על קביעה שאינו מתאים?"
body = """
שלושה קטעים קובעים את תפקיד משרד החינוך בבחירת המנהל. המבוא (¶27): אין למנות מנהל "שלא על דעת משרד החינוך ובוודאי שלא בניגוד לעמדתו". החוזר המשותף שהבעלויות כפופות לו (מצוטט ב־¶6): "לא ימונה מנהל שלא נמצא ראוי ומתאים לתפקיד ע"י משרד החינוך". ו־¶15: חברי הוועדה בוחרים לפי כללי הבחירה החלים באותה בעלות, "עם זאת, אין לבחור במועמד, אשר נציג/י משרד החינוך מצאו כי אינו מתאים לתפקיד".

שני הראשונים עושים קביעה חיובית או הסכמה של המשרד לתנאי; השלישי רק פוסל מועמד שהנציגים מצאו שאינו מתאים. כשהנציגים לא קבעו דבר לכאן או לכאן — או, כשיש שני נציגים, כשהם לא הסכימו ביניהם — ¶15 מתיר לוועדה לבחור במועמד, ו־¶6 ו־¶27 אוסרים את מינויו.
"""
reading = "המבחן החיובי גובר: מועמד יכול להתמנות רק אם הוא עומד בתנאי הסף, המשרד מצא שהוא מתאים, ואף נציג של המשרד לא מצא שאינו מתאים."
l4 = "l4/circulars/2018-19_tashat_05.l4"
evidence = "`the Ministry tests disagree when the Ministry made no finding`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2018-19_tashat_05-c"
kind = "gap"
stage = "writing"
keys = ["art_4/p4"]
quote = "אם לא יסיים את מלוא החובות עד למועד סיום התוכנית, תבוטל בחירתו."
title = "למנהל שאינו מסיים את התוכנית להכשרת מנהלים בזמן \"תבוטל בחירתו\", בידי איש שאינו נקוב בשמו"
body = """
סעיף 4 מאפשר לבחור לתפקיד מנהל עובד הוראה שטרם השלים את התוכנית להכשרת מנהלים, ומחייב אותו להשלים אותה עד לסיום התוכנית. אם לא יעשה כן, "תבוטל בחירתו". המשפט סביל: הוא נוקב בתוצאה ולא במי שמביא אותה לידי ביצוע.

בחוזר שלושה גופים שיכולים לעשות זאת: הבעלות, המנהלת את המכרז ואחראית לבדיקת תנאי הסף; ועדת המכרזים, שחבריה בוחרים במועמד; ומשרד החינוך, שבלי הסכמתו אין למנות מנהל. דבר אינו אומר מי מהם מבטל, באיזו פעולה, או אם הביטול חל מאליו עם סיום התוכנית — כך שמנהל שהחמיץ את המועד יכול להמשיך לכהן בלי שאיש מפר דבר.
"""
reading = "ה־L4 קובע רק מה שהטקסט קובע: השלמת התוכנית היא חובתו של העובד, והביטול הוא התוצאה המוצהרת של כישלונו (הנימוק של ההפרה). הוא אינו נוקב במי שמבטל ואינו יוצר חובה לבטל."
l4 = "l4/circulars/2018-19_tashat_05.l4"
