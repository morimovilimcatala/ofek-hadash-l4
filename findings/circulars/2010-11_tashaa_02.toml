# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
# See findings/takanon/takanon-sherut-ovdei-horaa/1.7.toml for the fields.

[[finding]]
id = "F-2010-11_tashaa_02-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה)"
title = "Part-time pro-rating at \"1/10 for each month of work\" gives more than the position over a twelve-month year"
body = """
Section 1ד pro-rates the allowance of a part-time teacher to the part-time position held that year, and explains the measure in brackets as one tenth for each month of work. The text does not say which months count or that the tenths stop at ten.

A teacher employed in all twelve months of the year at half a position takes 0.5 of the allowance by the position and 0.6 by twelve tenths of it; one employed for the ten months September–June takes 0.5 either way. The two halves of the sentence give different shares.
"""
reading = "The share is the position fraction (at most one, section 1ה) counted over at most ten months: ten months of work make the full year, and fewer make tenths of it."
l4 = "l4/circulars/2010-11_tashaa_02.l4"
evidence = "`the literal tenths give more than the position`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2010-11_tashaa_02-b"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p1", "art_2__para_b"]
quote = "מענק היובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק היובל · עובד הוראה שהשלים 30 שנות עבודה בישראל ב 1 -ביוני של שנה נדונה … יזכה באותה שנה במענק יובל"
title = "The jubilee grant: seniority as set in the September before, or 30 years completed by 1 June?"
body = """
Section 2 grants the jubilee grant by the seniority set for the teacher in September of the year before the grant. Clarification ב grants it in a given year to a teacher who completed 30 years by 1 June of that year.

A teacher whose seniority set in September is 29 and who completes the thirtieth year between September and 1 June is refused the grant that June by the first clause and granted it by the second.
"""
reading = "Clarification ב decides: 30 years completed by 1 June of the grant year. It is the later and more specific clause, headed as a clarification of the rule above it."
l4 = "l4/circulars/2010-11_tashaa_02.l4"
evidence = "`section 2 and clarification ב date the seniority differently`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2010-11_tashaa_02-c"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p1", "art_2__para_b"]
quote = "בעל ותק מצטבר בהוראה של 30 שנה ומעלה כולל ותקשירות צבאי · שהשלים 30 שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה\"ל)"
title = "The jubilee grant counts 30 years of teaching in one clause and 30 years of work in Israel in another"
body = """
Section 2 grants the jubilee grant to a teacher with 30 years of accumulated seniority IN TEACHING, military service included, at the employers, the owners and formal-education institutions. Clarification ב grants it to a teacher who completed 30 years of WORK IN ISRAEL, compulsory IDF service included.

The measures differ: years of work in Israel outside teaching count under the second and not the first, and the military service counted is "military service" in one and "compulsory IDF service" in the other. A teacher with twenty years of teaching and ten of other work in Israel is entitled under clarification ב and not under section 2.
"""
reading = "Clarification ב's measure is applied, consistently with F-2010-11_tashaa_02-b's reading; the seniority is an input, so section 2's measure can be run instead."
l4 = "l4/circulars/2010-11_tashaa_02.l4"
evidence = "`section 2 and clarification ב count different years`"
depends_on = ["F-2010-11_tashaa_02-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
