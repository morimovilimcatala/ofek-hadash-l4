title = "החישוב היחסי במשרה חלקית לפי \"1/10 לכל חודש עבודה\" נותן יותר מהמשרה בשנה של שנים־עשר חודשים"
body = """
סעיף 1ד מחשב את הקצובה של מורה במשרה חלקית באופן יחסי לחלקיות משרתו באותה שנה, ומסביר את המדד בסוגריים כעשירית לכל חודש עבודה. הטקסט אינו אומר אילו חודשים נמנים, ואינו אומר שהעשיריות נעצרות בעשר.

מורה המועסק בכל שנים־עשר חודשי השנה בחצי משרה מקבל 0.5 מהקצובה לפי המשרה, ו־0.6 לפי שתים־עשרה עשיריות שלה; מורה המועסק בעשרת החודשים ספטמבר–יוני מקבל 0.5 בכל מקרה. שני חלקי המשפט נותנים חלקים שונים.
"""
reading = "החלק הוא שבר המשרה (לכל היותר אחת, סעיף 1ה) הנמנה על פני עשרה חודשים לכל היותר: עשרה חודשי עבודה הם השנה המלאה, ופחות מהם הם עשיריות שלה."
