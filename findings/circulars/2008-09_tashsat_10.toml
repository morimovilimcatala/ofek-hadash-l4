[[finding]]
id = "F-2008-09_tashsat_10-a"
kind = "gap"
stage = "writing"
keys = ["art_a__para_2", "art_a__para_4"]
quote = "עובד בדירוג עובדי הוראה, זכאי לקצובת ביגוד · 1,365 1-25 שנים"
title = "A teacher in the first year of teaching has no row if seniority counts completed years"
body = """
Section א.2 entitles every employee in the teaching-staff grade to the clothing allowance, and section א.3 makes the amount depend on seniority. Section א.4's table opens at "1-25 שנים" and does not say how seniority in teaching is counted.

If seniority is the number of COMPLETED years, a teacher in the first year has seniority 0, which no row covers: an entitlement under א.2 with no amount under א.4.
"""
reading = "The year being served counts, so a teacher in the first year is in year 1 and takes the 1-25 row (1,365 ₪). It is the reading under which section א.2's entitlement and the table agree."
l4 = "l4/circulars/2008-09_tashsat_10.l4"
evidence = "`a first-year employee has no row if seniority counts completed years`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_10-b"
kind = "overlap"
stage = "writing"
keys = ["art_b/p2", "art_b/p3", "art_b/p4"]
quote = "0 עד 0.3 משרה · 235 מ 0.3-משרה עד 0.5 משרה · 467 מ 0.5-משרה ומעלה"
title = "The physical-education table gives 0.3 and 0.5 of a position two amounts each"
body = """
Section ב prices the extra clothing allowance for a physical-education teacher in three bands of employment rate: up to 0.3 (0), from 0.3 to 0.5 (235 ₪), and from 0.5 up (467 ₪). Every bound is written inclusively on both sides: 0.3 is both "עד 0.3" and "מ-0.3", and 0.5 is both "עד 0.5" and "מ-0.5".

A teacher employed at exactly 0.3 is given 0 and 235; one at exactly 0.5, a common position, is given 235 and 467. Every other rate gets one row.
"""
reading = "The band that opens at a bound governs it (\"מ-X\" includes X): 0.3 takes 235 ₪ and 0.5 takes 467 ₪, reading each \"עד\" as up to but not including the next band's opening."
l4 = "l4/circulars/2008-09_tashsat_10.l4"
evidence = "`the physical-education table gives 0.3 and 0.5 two amounts each`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_10-c"
kind = "ambiguity"
stage = "writing"
keys = ["art_b", "art_b/p1"]
quote = "קצובת ביגוד נוספת למורה לחינוך גופני · שיעור העסקה"
title = "The physical-education table's \"employment rate\": of the position in physical education, or of the whole position?"
body = """
Section ב grants an extra clothing allowance "to a physical-education teacher" by "שיעור העסקה", the employment rate, without saying whose: the share of the position spent teaching physical education, or the employee's whole position.

The readings differ for any teacher who teaches physical education in part of a larger position: a full-position teacher with a fifth of a position in physical education takes 0 under the first and 467 ₪ under the second.
"""
reading = "The employment rate is the share of the position in physical education, the work the extra allowance is for. It is an input of the encoding, so either reading can be run."
l4 = "l4/circulars/2008-09_tashsat_10.l4"
evidence = "`the two readings of the employment rate differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2008-09_tashsat_10-d"
kind = "contradiction"
stage = "writing"
keys = ["art_c__para_1__subpara_a", "art_c__para_1__subpara_b"]
quote = "יהיה זכאי לקבל מדי שנה זוג נעליים ושני חלוקים … ערך שני חלוקים: 308 ₪ · יהיה זכאי לקבל שני חלוקים לשנה … ערך זוג נעליים ושני חלוקים: 498 ₪"
title = "Each technological-education value line prices the other subparagraph's grant"
body = """
Section ג.1א grants a pair of shoes and two robes a year; the value line printed under it reads "ערך שני חלוקים: 308 ₪", the value of two robes. Section ג.1ב grants two robes a year; the value line printed under it reads "ערך זוג נעליים ושני חלוקים: 498 ₪", the value of shoes and two robes.

Read by position, a ג.1א teacher is paid 308 ₪ for shoes and two robes and a ג.1ב teacher 498 ₪ for two robes alone, more for less. Read by label, the amounts change places. The text gives both answers for each list.
"""
reading = "Each value line's own label names what it prices: shoes and two robes are worth 498 ₪ (ג.1א) and two robes 308 ₪ (ג.1ב). It is the reading under which the greater grant carries the greater value."
l4 = "l4/circulars/2008-09_tashsat_10.l4"
evidence = "`each value line prices the other subparagraph's grant`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
