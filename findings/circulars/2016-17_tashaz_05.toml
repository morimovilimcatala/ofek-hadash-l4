title = "הבראה במשרה חלקית: יחסית לחלקיות המשרה, או לחודשי העבודה?"
body = """
§1ד נותן לעובד במשרה חלקית את קצובת ההבראה "בשיעור יחסי לחלקיות משרתו באותה שנה", ואחר כך, בסוגריים, "1/10 לכל חודש עבודה". המילים מחשבות יחסית לחלק המשרה; הסוגריים מחשבים יחסית לחודשים, עשירית מהקצובה לכל חודש עבודה.

שתי המידות שונות בכל פעם שהעובד לא עבד את כל השנה: למשרה מלאה שהוחזקה חמישה חודשים, חלקיות המשרה היא 1 והחודשים נותנים 5/10. בחוזר אין סעיף אחר על עובד שעבד חלק מהשנה, ולכן המידה הגוברת היא שמכריעה את הסכום.
"""
reading = "המשרה השנתית נמנית חודש בחודשו: כל חודש עבודה שוקל עשירית מהמשרה שהוחזקה בו, הסכום מצטבר על פני השנה ומוגבל למשרה אחת לפי §1ה. זו הקריאה שבה חלים גם המילים וגם הסוגריים."
l4 = "l4/circulars/2016-17_tashaz_05.l4"
