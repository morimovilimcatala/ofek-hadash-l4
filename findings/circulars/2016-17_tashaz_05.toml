[[finding]]
id = "F-2016-17_tashaz_05-e"
kind = "ambiguity"
stage = "writing"
keys = ["art_2__para_b", "art_2__para_e__subpara_2", "art_2__para_e__subpara_2/p2", "art_2__para_e__subpara_3"]
quote = "בעל ותק מצטבר בהוראה של 25 או 30 שנה ומעלה כולל ותק שירות צבאי · שהשלים 25 או 30 שנות עבודה בישראל על-פי האמור להלן · )ובכלל זה ותק בגין שירות חובה בצה\"ל( · הוותק המזכה במענק יובל הינו וותק מצטבר כהגדרתו לעיל"
title = "מענק היובל מונה שנות הוראה בסעיף אחד ושנות עבודה בישראל בסעיף אחר"
body = """
סעיף 2ב מעניק את מענק היובל לעובד הוראה בעל ותק מצטבר של 25 או 30 שנה בהוראה, כולל שירות צבאי, אצל המעסיקים, הבעלויות ובמוסדות החינוך הפורמאלי. הבהרה 2ה(2) מעניקה אותו לעובד הוראה שהשלים 25 או 30 שנות עבודה בישראל "על־פי האמור להלן", ובכלל זה שירות חובה בצה"ל.

המדדים נבדלים: שנות עבודה בישראל מחוץ להוראה נמנות לפי השני ולא לפי הראשון, והשירות הצבאי הנמנה הוא "שירות צבאי" באחד ו"שירות חובה בצה"ל" באחר. מורה בבית ספר יסודי, שהסף שלו 30 שנה, עם עשרים שנות הוראה ועשר שנות עבודה אחרת בישראל, זכאי לפי הבהרה 2ה(2) ואינו זכאי לפי סעיף 2ב.

אותה לשון — "ותק מצטבר בהוראה … כולל ותק שירות צבאי" בכלל, ו"שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה"ל)" בהבהרה — מופיעה בחוזרי מענק היובל של השנים האחרות, והשאלה בהם זהה: `F-2006-07_tashsaz_06-c`, `F-2007-08_tashsach_05-b`, `F-2008-09_tashsat_09-d`, `F-2009-10_tasha_03-d`, `F-2010-11_tashaa_02-c`, `F-2011-12_tashab_12-c`, `F-2012-13_tashag_07-e`, `F-2013-14_tashad_07-e`, `F-2014-15_tashae_04-e`, `F-2015-16_tashav_07-e`, `F-2017-18_tashach_04-d`, `F-2018-19_tashat_06-d`, `F-2019-20_tashaf_09-d`, `F-2020-21_tashpa_07-e`, `F-2021-22_tashpab_06-f`, `F-2022-23_tashpag_08-d`, `F-2023-24_tashpad_10-g`, `F-2024-25_tashpah_11-f`, `F-2025-26_tashpo_07-d`; כולם מאמצים קריאה אחת. כמו ב־`F-2011-12_tashab_12-c`, ההבהרה מוסיפה "על־פי האמור להלן", והבהרה 2ה(3) נוקבת בשנים המזכות כוותק מצטבר "כהגדרתו לעיל". המילים האלה מחזקות את הקריאה, אך אינן מסירות את החלופה: הבהרה 2ה(3) עוסקת בהבחנה בין 25 ל־30 שנה לפי שלב החינוך, והבהרה 2ה(2) עצמה עדיין מונה "שנות עבודה בישראל".
"""
reading = "המדד של סעיף 2ב עצמו קובע את מה שנספר: ותק מצטבר בהוראה אצל המעסיקים, הבעלויות ובמוסדות החינוך הפורמאלי, כולל שירות צבאי, ועם שנות החופשה ללא תשלום שנרכשו לפי הבהרה 2ה(1), הנמנה עד 1 ביוני של שנת המענק (`F-2016-17_tashaz_05-c`). הבהרה 2ה(2) באה תחת הכותרת \"הבהרות\" של הכלל שמעליה ונוקבת ביום שעד אליו הוותק מושלם; היא מבהירה את הכלל ואינה קובעת זכאות אחרת, ולכן \"שנות עבודה בישראל\" שבה נקראות כאותו ותק. זו הקריאה בכל חוזרי מענק היובל. בחוזר הזה הקריאה נשענת גם על הבהרה 2ה(3), הנוקבת בשנים המזכות כוותק מצטבר \"כהגדרתו לעיל\"."
l4 = "l4/circulars/2016-17_tashaz_05.l4"
evidence = "`2ב and 2ה(2) count different years`"
depends_on = ["F-2016-17_tashaz_05-c"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2016-17_tashaz_05-f"
kind = "contradiction"
stage = "verification"
keys = ["art_1__para_g", "art_1__para_h/p5"]
quote = "וכן חלה הגבלה על מנהל המועסק שלא עפ\"י תנאי הרפורמה לעבוד בהיקף שעולה על 150%משרה · )140% משרה -ללא רפורמה"
title = "מנהל שאינו ברפורמות: מגבלה של 150% (§1ז) או של 140% (החזרה בסוגריים)?"
body = """
§1ז מגביל מורה המועסק שלא לפי תנאי הרפורמה ל־140% משרה אצל כלל מעסיקיו, ומנהל המועסק שלא לפי תנאי הרפורמה ל־150%. §1ח קובע אחר כך שאין באמור לעיל היתר להעסקה מעבר ל"היקפי משרה אלו", ומונה אותם בסוגריים: 140% "ללא רפורמה", ושיעורי הרפורמות — בלי שיעור נפרד למנהלים.

לגבי מנהל שאינו ברפורמות המועסק בין 140% ל־150% בסך הכול, §1ז מתיר את ההעסקה, והחזרה שבסוגריים קובעת את המגבלה מתחתיה.

אותה מגבלה למנהל ואותה חזרה בסוגריים מודפסות בחוזרי דמי ההבראה ומענק היובל מתשע"ד עד תשפ"ו, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2013-14_tashad_07-f (תשע"ד/7), F-2014-15_tashae_04-f (תשע"ה/4), F-2015-16_tashav_07-f (תשע"ו/7), F-2016-17_tashaz_05-f (תשע"ז/5), F-2017-18_tashach_04-f (תשע"ח/4), F-2018-19_tashat_06-f (תשע"ט/6), F-2019-20_tashaf_09-f (תש"פ/9), F-2020-21_tashpa_07-f (תשפ"א/7), F-2021-22_tashpab_06-b (תשפ"ב/6), F-2022-23_tashpag_08-e (תשפ"ג/8), F-2023-24_tashpad_10-b (תשפ"ד/10), F-2024-25_tashpah_11-g (תשפ"ה/11) ו־F-2025-26_tashpo_07-e (תשפ"ו/7).
