title = "משרה מלאה אחת לכל היותר, או חלקו של כל מעסיק גם מעבר ל־100%?"
body = """
§1ה: עובד במשרה העולה על משרה מלאה זכאי לקצובת ההבראה של משרה שלמה אחת בלבד. §1ו: עובד המועסק אצל יותר ממעסיק אחד והיקף משרתו הכוללת מעבר ל־100% זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו.

לעובד במשרה של 70% אצל מעסיק אחד ו־60% אצל מעסיק אחר, §1ו משלם 0.7 ועוד 0.6, כלומר 1.3 קצובות, ואילו §1ה מתיר 1. מענק היובל חוזר על ההתנגשות: §2ה.4 משלם "עד למשרה אחת בלבד", ו־§2ה.5 מחיל את §§1ו–1ח על עובד של כמה מעסיקים.
"""
reading = "§1ה (ו־§2ה.4) מגבילים את הקצובה אצל מעסיק אחד; §1ו (ו־§2ה.5) חלים על כמה מעסיקים, שכל אחד מהם משלם לפי המשרה אצלו — הכלל המיוחד למקרה שהוא מונה."
