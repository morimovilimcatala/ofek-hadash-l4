עובד ששנתו ה־25 מושלמת בין ספטמבר ל־1 ביוני — ותק 24 כפי שנקבע בספטמבר 2016, ו־25 שנים שלמות עד 1 ביוני 2017 — נדחה לפי §2ד וזוכה לפי §2ה.2.
