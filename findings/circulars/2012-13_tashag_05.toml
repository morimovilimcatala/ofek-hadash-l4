Section 2ב changes the conversion of sick days to hours: from school year תשע"ב the job base is multiplied by 4.33 instead of 4, and the circular says this applies "to all teaching employees in the upper divisions, even if they have not yet joined the reform".

Each of the three tables attached to the circular opens with the row for the "old world" (not under the reform), base 24, in "חט\"ב וחט\"ע" — the junior high and the upper division — at 96 sick hours a year for a full position: 24 × 4. By 2ב, an upper-division teacher on the old-world base of 24 has 24 × 4.33 = 103.92 hours from תשע"ב. The rule and the table it illustrates give the same teacher two quotas, 7.92 hours apart.
"""
