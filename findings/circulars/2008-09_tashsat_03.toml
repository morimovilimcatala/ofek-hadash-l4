[[finding]]
id = "F-2008-09_tashsat_03-a"
kind = "contradiction"
stage = "examples"
keys = ["art_1", "art_1/p2", "art_2/p2"]
quote = "יבוצעו על בסיס רכיבי השכר בערכם נכון לחודש דצמבר ( .2007 · תוספת השכר האחוזית 3%לחלק ל 2.88% .2.88% = 1.04 -זהו שיעור התוספת שיחושב על השכר המשולב ותוספת 2001 נכון לערכם הנוכחי"
title = "The circular's 2.88% of current values falls short of the agreement's 3% of December 2007 values"
body = """
§1 restates the agreement: from 1.12.2008 "תוספת 2008" is 3%, computed on the salary components at their December 2007 value, so not on the 4% erosion rise of January 2008. §2 then says the supplement "can be computed" as 3% divided by 1.04 — which it prints as 2.88% — of the combined salary and תוספת 2001 at their current value.

3% / 1.04 is 2.8846%, and 2.88% of a value 4% above December 2007's is 2.9952% of December 2007's. On a December 2007 base of 10,000 the agreement gives 300 a month and the circular's method 299.52. The method the circular offers as equivalent to the agreement's rule does not give the same amount; and it equals it only where the current value is December 2007's raised by exactly 4%, which the text assumes and does not state.
"""
reading = "The circular's method is encoded as the circular prints it (2.88% of the current value), and the agreement's rule beside it (3% of the December 2007 value); a circular does not outrank the agreement, so where the two differ the agreement's 3% is the entitlement."
l4 = "l4/circulars/2008-09_tashsat_03.l4"
evidence = "`2.88% of the current value is not 3% of December 2007's`"
