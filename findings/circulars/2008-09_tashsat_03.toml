quote = "יבוצעו על בסיס רכיבי השכר בערכם נכון לחודש דצמבר ( .2007 · תוספת השכר האחוזית 3%לחלק ל 2.88% .2.88% = 1.04 -זהו שיעור התוספת שיחושב על השכר המשולב ותוספת 2001 נכון לערכם הנוכחי"
title = "ה־2.88% מהערך הנוכחי שבחוזר נופלים מה־3% מערכי דצמבר 2007 שבהסכם"
body = """
§1 חוזר על ההסכם: החל מ־1.12.2008 "תוספת 2008" היא 3%, המחושבת על רכיבי השכר בערכם נכון לחודש דצמבר 2007, כלומר לא על עליית השחיקה של 4% מינואר 2008. §2 אומר לאחר מכן ש"ניתן לחשב" את התוספת כ־3% חלקי 1.04 — שהוא מדפיס כ־2.88% — מהשכר המשולב ומתוספת 2001 בערכם הנוכחי.

3% / 1.04 הם 2.8846%, ו־2.88% מערך הגבוה ב־4% מערכו בדצמבר 2007 הם 2.9952% מערכו בדצמבר 2007. על בסיס של 10,000 בדצמבר 2007 ההסכם נותן 300 לחודש, ושיטת החוזר 299.52. השיטה שהחוזר מציג כשקולה לכלל של ההסכם אינה נותנת אותו סכום; והיא שווה לו רק מקום שהערך הנוכחי הוא ערכו בדצמבר 2007 בתוספת 4% בדיוק — דבר שהטקסט מניח ואינו קובע.
"""
