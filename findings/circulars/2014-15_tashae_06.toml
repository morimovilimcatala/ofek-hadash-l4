[[finding]]
id = "F-2014-15_tashae_06-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_2/p1"]
quote = "עובדי הוראה אשר בשנה\"ל תשע\"ד שהו בחל\"ת/שבתון מלא או עובדי הוראה חדשים, אינם מחויבים בהחזר של 4 ימים אלו, מאחר שלא הועסקו בשנה\"ל תשע\"ד ולא נהנו מהתוספת של ימי חופשה בשנה\"ל תשע\"ד"
title = "Released by category, or by the reason given: the employee hired in 2013-14 after the extra vacation days"
body = """
§2 ¶1 releases from the four make-up days two categories — staff on full unpaid leave or full sabbatical in 2013-14, and "new" staff — "since they were not employed in 2013-14 and did not enjoy the extra vacation days of 2013-14". "New" is not defined, and the circular does not say when in 2013-14 the extra vacation days were given.

An employee hired during 2013-14 after the extra vacation days were taken did not enjoy them — the reason the circular gives for the release — but was employed in 2013-14 and was not on a full year's leave, so by the categories (with "new" read by the reason, as not employed in 2013-14) is bound to make the days up and is not paid for working them. Read by its reason, the paragraph releases that employee; read by its categories, it does not.
"""
reading = "The two categories are the rule and the reason explains them: an employee employed at any time in 2013-14 and not on a full year's leave is bound to make up the days."
l4 = "l4/circulars/2014-15_tashae_06.l4"
evidence = "`the reason and the categories part on a teacher hired after the extra days`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
