quote = "בחטיבות עליונות תלת שנתיות וארבע שנתיות · בחטיבה העליונה (כיתות ט'-יד' בבית ספר שש שנתי וכיתות י'-יד' בבית ספר תלת שנתי)"
title = "Grade 9 of a six-year school: upper division by section 1ב's grades, middle division where the school's upper division is three-year"
body = """
Section 1א applies the erosion addition to teachers of three-year AND four-year upper divisions. Section 1ב, for a teacher employed in both divisions, counts only the upper-division portion and fixes it by grades: ט'–י"ד in a six-year school, י'–י"ד in a three-year school.

A six-year school whose upper division is a three-year one (grades 10–12) has grade 9 in its middle division. Section 1ב's grades put that grade-9 portion in the upper division, so it earns the erosion addition; the school's own division puts it in the middle division, which section 1ג leaves to a collective agreement still to be signed. The text gives the same portion to both regimes.
"""
reading = "Section 1ב's grades decide, being the clause written to divide a mixed employment: in a six-year school grades ט'–י\"ד are the upper division's portion, whatever the school's own division."
l4 = "l4/circulars/2011-12_tashab_04.l4"
evidence = "`section 1ב places in the upper division a grade the school places in the middle`"
