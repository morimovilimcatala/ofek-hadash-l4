title = "כיתה ט' בבית ספר שש שנתי: חטיבה עליונה לפי הכיתות שבסעיף 1ב, חטיבת ביניים כשהחטיבה העליונה של בית הספר תלת שנתית"
body = """
סעיף 1א מחיל את תוספת השחיקה על מורי חטיבות עליונות תלת שנתיות וארבע שנתיות. סעיף 1ב, לגבי מורה המועסק בשתי החטיבות, מונה רק את חלקיות ההעסקה בחטיבה העליונה וקובע אותה לפי כיתות: ט'–י"ד בבית ספר שש שנתי, י'–י"ד בבית ספר תלת שנתי.

בבית ספר שש שנתי שהחטיבה העליונה שלו תלת שנתית (כיתות י'–י"ב) כיתה ט' נמצאת בחטיבת הביניים. הכיתות שבסעיף 1ב מציבות את חלקיות ההעסקה בכיתה ט' בחטיבה העליונה, כך שהיא מזכה בתוספת השחיקה; החלוקה של בית הספר עצמו מציבה אותה בחטיבת הביניים, שסעיף 1ג משאיר להסכם קיבוצי שטרם נחתם. הטקסט נותן את אותה חלקיות לשני המשטרים.
"""
