body = """
סעיף 1א מחיל את תוספת השחיקה על מורי חטיבות עליונות תלת שנתיות וארבע שנתיות. סעיף 1ב, לגבי מורה המועסק בשתי החטיבות, מונה רק את חלקיות ההעסקה בחטיבה העליונה וקובע אותה לפי כיתות: ט'–י"ד בבית ספר שש שנתי, י'–י"ד בבית ספר תלת שנתי.

