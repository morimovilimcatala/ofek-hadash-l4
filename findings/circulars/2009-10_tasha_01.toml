[[finding]]
id = "F-2009-10_tasha_01-a"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_b", "art_3__para_b"]
quote = "יהיו זכאים לתוספת של 1%לשכר הברוטו שלהם · יהיה זכאי לתוספת לשכרו בשיעור של 1%משכרו הפנסיוני"
title = "The 1% addition: of the gross salary as the ruling is reported, or of the pensionable salary as instructed?"
body = """
Section 2(ב) reports the National Labour Court's ruling: teachers insured in new funds are entitled to an addition of 1% "to their gross salary" (לשכר הברוטו שלהם), returning the extra 1% now deducted for the pension fund. Section 3(ב), the instruction that carries the ruling out, gives the addition at 1% "of his pensionable salary" (משכרו הפנסיוני).

The gross salary and the pensionable salary differ whenever a teacher is paid components on which no pension contribution is made, so the two clauses give different additions: on a gross salary of 10,000 ₪ with 8,000 ₪ pensionable, 100 ₪ under section 2(ב) and 80 ₪ under section 3(ב). A circular never outranks the instrument it implements, and this one states both.
"""
reading = "Section 3(ב)'s pensionable salary is applied, as the operative instruction and the base on which the extra 1% is in fact deducted; it is also the base under which the ruling's own principle (section 2: the employer's cost unchanged, 13.5% = 12.5% + 1%) holds. The ruling's text, not reproduced in the corpus, would settle it."
l4 = "l4/circulars/2009-10_tasha_01.l4"
evidence = "`the ruling and the instruction take the 1% addition on different salaries`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
