[[finding]]
id = "F-2009-10_tasha_01-a"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_b", "art_3__para_b"]
quote = "יהיו זכאים לתוספת של 1%לשכר הברוטו שלהם · יהיה זכאי לתוספת לשכרו בשיעור של 1%משכרו הפנסיוני"
title = "תוספת 1%: מהשכר הברוטו, כפי שפסק הדין מדווח, או מהשכר הפנסיוני, כפי שההנחיה מורה?"
body = """
סעיף 2(ב) מדווח על פסק הדין של בית הדין הארצי לעבודה: עובדי ההוראה המבוטחים בקרנות החדשות זכאים לתוספת של 1% "לשכר הברוטו שלהם", כ"החזר" ניכוי 1% הנוסף משכרם לקרן הפנסיה. סעיף 3(ב), ההנחיה המבצעת את פסק הדין, נותן את התוספת בשיעור של 1% "משכרו הפנסיוני".

השכר הברוטו והשכר הפנסיוני נבדלים בכל פעם שמשולמים למורה רכיבים שאין מפרישים בגינם לפנסיה, ולכן שני הסעיפים נותנים תוספות שונות: על שכר ברוטו של 10,000 ₪ שמתוכו 8,000 ₪ פנסיוני, 100 ₪ לפי סעיף 2(ב) ו־80 ₪ לפי סעיף 3(ב). חוזר לעולם אינו גובר על המקור שהוא מבצע, וחוזר זה קובע את שניהם.
"""
reading = "מוחל השכר הפנסיוני שבסעיף 3(ב), כהנחיה המבצעת וכבסיס שעליו מנוכה בפועל ה־1% הנוסף; זה גם הבסיס שבו מתקיים העיקרון של פסק הדין עצמו (סעיף 2: העלות למעסיק אינה משתנה, 13.5% הם 12.5% ועוד 1%). לשון פסק הדין, שאינה מובאת בקורפוס, הייתה מכריעה."
l4 = "l4/circulars/2009-10_tasha_01.l4"
evidence = "`the ruling and the instruction take the 1% addition on different salaries`"
