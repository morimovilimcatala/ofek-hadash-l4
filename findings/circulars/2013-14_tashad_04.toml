title = "Two rules for a mother split between an Ofek Hadash junior high and the upper division of the same school"
body = """
Section ג.ג gives two rules for a mother whose position is divided. ¶3 covers a teacher employed "in several schools or in one school in different stages of education", qualifying only all together: in each school or stage the supplement is the employment there times that stage's mother's rate, divided by the whole employment (A·a/G). ¶28-¶29 cover a teacher whose junior-high employment is under Ofek Hadash and upper-division employment pre-reform or under Oz LeTmura: the junior high follows the mother's work week, and in the upper division the percentage supplement "is computed from the position in the upper division" (the example: 7% × 0.6 = 4.2%).

A mother in one six-year school, 30% in an Ofek Hadash junior high and 60% in a full Oz LeTmura upper division, is the case of both — the circular's own example for ¶3 has 30% and 60% neither qualifying alone and 90% qualifying together. ¶3 gives the upper division 60% × 7% / 90% = 4.667%, and gives the junior high a proportional percentage share; ¶29 gives the upper division 7% × 60% = 4.2%, and ¶28 gives the junior high the mother's work week instead of a percentage.
"""
reading = "¶28-¶29 govern a divided position whose junior-high part is under Ofek Hadash, as the clause written for that case; ¶3's formula is read as covering positions where every part carries a percentage mother's coefficient."
l4 = "l4/circulars/2013-14_tashad_04.l4"
evidence = "`¶3 and ¶29 price the same upper division differently`"
