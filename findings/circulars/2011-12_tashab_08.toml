title = "\"שיעור העסקה\" שבטבלת החינוך הגופני: של המשרה בחינוך גופני, או של המשרה כולה?"
body = """
סעיף 2(ב) מתמחר את קצובת הביגוד הנוספת למורים לחינוך גופני לפי "שיעור העסקה", בלי לומר של מה: חלק המשרה המוקדש להוראת חינוך גופני, או המשרה כולה של המורה.

הקריאות נבדלות לגבי כל מורה המלמד חינוך גופני בחלק ממשרה גדולה יותר: מורה במשרה מלאה עם חמישית משרה בחינוך גופני מקבל 0 לפי הראשונה ו־1,301 ₪ לפי השנייה.

אותן מילים — "שיעור העסקה" בטבלת קצובת החינוך הגופני — מודפסות בחוזרי קצובת הביגוד, והשאלה נרשמה עם אותה קריאה בכל אחד מהם: F-2006-07_tashsaz_07-d (תשס"ז/7), F-2007-08_tashsach_06-c (תשס"ח/6), F-2008-09_tashsat_10-c (תשס"ט/10), F-2009-10_tasha_05-c (תש"ע/5), F-2010-11_tashaa_03-c (תשע"א/3), F-2011-12_tashab_08-c (תשע"ב/8), F-2011-12_tashab_13-e (תשע"ב/13), F-2012-13_tashag_08-d (תשע"ג/8), F-2012-13_tashag_09-d (תשע"ג/9), F-2013-14_tashad_08-e (תשע"ד/8), F-2014-15_tashae_07-e (תשע"ה/7), F-2015-16_tashav_08-e (תשע"ו/8), F-2016-17_tashaz_06-e (תשע"ז/6), F-2017-18_tashach_07-d (תשע"ח/7), F-2018-19_tashat_08-d (תשע"ט/8), F-2019-20_tashaf_11-c (תש"פ/11), F-2020-21_tashpa_08-d (תשפ"א/8), F-2021-22_tashpab_07-e (תשפ"ב/7), F-2022-23_tashpag_09-f (תשפ"ג/9), F-2022-23_tashpag_09_clarif-c (ההבהרה לחוזר תשפ"ג/9) ו־F-2023-24_tashpad_11-b (תשפ"ד/11).
"""
reading = "שיעור ההעסקה הוא חלק המשרה בחינוך גופני, העבודה שבעדה ניתנת הקצובה הנוספת. הוא קלט של הקידוד, כך שאפשר להריץ כל אחת מהקריאות."
