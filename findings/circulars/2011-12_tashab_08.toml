quote = "סכום נכון ל1/9/10 - שיעור העסקה"
title = "The physical-education table's \"employment rate\": of the position in physical education, or of the whole position?"
body = """
Section 2(ב) prices the extra clothing allowance for physical-education teachers by "שיעור העסקה", the employment rate, without saying whose: the share of the position spent teaching physical education, or the teacher's whole position.

The readings differ for any teacher who teaches physical education in part of a larger position: a full-position teacher with a fifth of a position in physical education takes 0 under the first and 1,301 ₪ under the second.
"""
reading = "The employment rate is the share of the position in physical education, the work the extra allowance is for. It is an input of the encoding, so either reading can be run."
l4 = "l4/circulars/2011-12_tashab_08.l4"
evidence = "`the two readings of the employment rate differ`"
