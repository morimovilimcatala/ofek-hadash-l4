[[finding]]
id = "F-2011-12_tashab_08-a"
kind = "contradiction"
stage = "examples"
keys = ["art_2__para_a", "art_2__para_b"]
quote = "תעריף קצובת ביגוד נוספת למורה לחינוך גופני יועלה ב –.800₪ · 0 עד 0.3 משרה · 652 מ 0.3 -משרה עד 0.5 משרה · 1301 מ 0.5-משרה ומעלה"
title = "\"Raised by 800 ₪\", and the table it introduces raises only its top band by 800"
body = """
Section 2(א) raises "the rate of the extra clothing allowance for a physical-education teacher" by 800 ₪. Section 2(ב) gives "the amounts by employment rate, after the said rise": 0 up to 0.3 of a position, 652 ₪ from 0.3 to 0.5, and 1,301 ₪ from 0.5 up.

The table cannot be the result of adding 800 ₪ to every band: the first band ends at 0, and the second at 652 ₪, less than the rise itself, so neither had any non-negative amount 800 ₪ below it. Only the top band can have risen by 800 ₪. The two clauses state the rise differently for a teacher below half a position.
"""
reading = "The table governs, as the amounts section 2(ג) says replace the earlier ones; the 800 ₪ of section 2(א) is read as the rise of the top band, the full allowance."
l4 = "l4/circulars/2011-12_tashab_08.l4"
evidence = "`no band but the top one can have risen by 800`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_08-b"
kind = "overlap"
stage = "writing"
keys = ["art_2__para_b"]
quote = "0 עד 0.3 משרה · 652 מ 0.3 -משרה עד 0.5 משרה · 1301 מ 0.5-משרה ומעלה"
title = "The physical-education table gives 0.3 and 0.5 of a position two amounts each"
body = """
Section 2(ב) prices the extra clothing allowance in three bands of employment rate: up to 0.3 (0), from 0.3 to 0.5 (652 ₪), and from 0.5 up (1,301 ₪). Every bound is written inclusively on both sides: 0.3 is both "עד 0.3" and "מ-0.3", and 0.5 is both "עד 0.5" and "מ-0.5".

A teacher employed at exactly 0.3 is given 0 and 652 ₪; one at exactly 0.5, a common position, is given 652 ₪ and 1,301 ₪.
"""
reading = "The band that opens at a bound governs it (\"מ-X\" includes X): 0.3 takes 652 ₪ and 0.5 takes 1,301 ₪."
l4 = "l4/circulars/2011-12_tashab_08.l4"
evidence = "`the PE table gives 0.3 and 0.5 two amounts each`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
