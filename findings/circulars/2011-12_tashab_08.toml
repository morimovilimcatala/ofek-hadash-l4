keys = ["art_2__para_a", "art_2__para_b"]
quote = "תעריף קצובת ביגוד נוספת למורה לחינוך גופני יועלה ב –.800₪ · 0 עד 0.3 משרה · 652 מ 0.3 -משרה עד 0.5 משרה · 1301 מ 0.5-משרה ומעלה"
title = "\"יועלה ב־800 ₪\", והטבלה שהוא מציג מעלה ב־800 רק את המדרגה העליונה שלה"
body = """
סעיף 2(א) מעלה את "תעריף קצובת ביגוד נוספת למורה לחינוך גופני" ב־800 ₪. סעיף 2(ב) נותן את "סכומי קצובת הביגוד הנוספת לפי שיעור ההעסקה, לאחר העלאה האמורה": 0 עד 0.3 משרה, 652 ₪ מ־0.3 עד 0.5, ו־1,301 ₪ מ־0.5 ומעלה.

הטבלה אינה יכולה להיות התוצאה של הוספת 800 ₪ לכל מדרגה: המדרגה הראשונה עומדת על 0, והשנייה על 652 ₪, פחות מההעלאה עצמה, כך שלאף אחת מהן לא היה סכום אי־שלילי הנמוך ממנה ב־800 ₪. רק המדרגה העליונה יכולה הייתה לעלות ב־800 ₪. שני הסעיפים־המשנה קובעים את ההעלאה באופן שונה למורה מתחת לחצי משרה.
"""
reading = "הטבלה קובעת, כסכומים שסעיף 2(ג) אומר שהם מחליפים את הקודמים; ה־800 ₪ שבסעיף 2(א) נקראים כהעלאה של המדרגה העליונה, הקצובה המלאה."
l4 = "l4/circulars/2011-12_tashab_08.l4"
evidence = "`no band but the top one can have risen by 800`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

