quote = "עובד הוראה במכללה אשר המנהל יקבע לגביו כי לא עמד בתנאי סעיף 3 לעיל · מובהר, כי תנאי זה הוא תנאי בסיסי ויסודי העומד בבסיס ההסכמה לשלם לעובדי ההוראה הפעילים את מלוא התמורה."
title = "Section 5 deducts for not meeting \"the conditions of section 3\", which lays no duty on the employee"
body = """
Section 5 lets the institution reduce the consideration of, or set off against any sum due to, an employee whom the director determines "did not meet the conditions of section 3". Section 3 lays no duty on the employee: it says the employee is not entitled to any pay beyond the consideration for deferred duties, and calls "this condition" the basic condition of paying the full consideration.

Read as written, the only "condition" section 3 states is the absence of extra pay, which an employee cannot fail to meet by anything he does or omits; the duties an employee can fail — to go on performing the academic duties, to come and teach on campus on notice, to complete the deferred duties by the end of the period — are section 2's. The reference reads either as reaching section 2's duties through section 3's "basic condition", or as reaching nothing, in which case section 5 never applies.
"""
reading = "\"The conditions of section 3\" are the academic and deferred duties section 2 sets, which section 3 makes the basic condition of the full consideration; the reduction is proportional to the share of the duties fulfilled."
l4 = "l4/circulars/2020-21_tashpa_02.l4"
evidence = "`section 3 lays no duty on the employee that section 5 can find unmet`"
