סעיף 5 מאפשר למוסד להפחית מהתמורה של עובד שהמנהל קבע לגביו כי "לא עמד בתנאי סעיף 3", או לקזז מכל סכום המגיע לו. סעיף 3 אינו מטיל חובה על העובד: הוא אומר שהעובד אינו זכאי לשום תשלום מעבר לתמורה בגין חובות נדחות, וקורא ל"תנאי זה" התנאי הבסיסי לתשלום מלוא התמורה.

בקריאה כפי שנכתב, ה"תנאי" היחיד שסעיף 3 קובע הוא היעדר תשלום נוסף, שעובד אינו יכול שלא לעמוד בו בשום מעשה או מחדל שלו; החובות שעובד יכול להפר — להמשיך למלא את החובות האקדמיות, להגיע וללמד בקמפוס בהודעה מראש, להשלים את החובות הנדחות עד תום התקופה — הן של סעיף 2. ההפניה נקראת או כמגיעה לחובות של סעיף 2 דרך "התנאי הבסיסי" של סעיף 3, או כאינה מגיעה לשום דבר, ואז סעיף 5 לעולם אינו חל.
