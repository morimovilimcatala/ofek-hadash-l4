# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2024-25_tashpah_11-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_h"]
quote = "בשיעור יחסי לחלקיות משרתו באותה שנה (1/10 לכל חודש עבודה)"
title = "Part-time recuperation: a position share, measured in tenths per month of work"
body = """
§1.ח gives a part-time teacher the allowance "in proportion to the part of a position held that year", and its parenthesis measures that proportion as "1/10 for each month of work". The clause names one measure (the position fraction) and the parenthesis another (months of work), and the parenthesis sets no ceiling.

A school year has twelve months. Read literally, eleven or twelve months of work give 11/10 or 12/10 of the allowance, more than the whole that §1.ט caps a full position at; the text does not say whether only ten months of a year count as months of work.
"""
reading = "The months share is 1/10 per month of work, capped at the whole allowance, and it multiplies the position share (capped at one position per employer under §1.ט)."
l4 = "l4/circulars/2024-25_tashpah_11.l4"
evidence = "`1/10 for each month uncapped passes the whole allowance in a twelve-month year`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_11-b"
kind = "broken-reference"
stage = "writing"
keys = ["art_2__para_f__subpara_5", "art_1__para_f", "art_1__para_g", "art_1__para_h", "art_1__para_i", "art_1__para_j"]
quote = "יחולו הכללים האמורים בסעיפים 1ו' עד 1 ח' לעיל"
title = "The jubilee grant's multi-employer rule cites paragraphs that hold no multi-employer rule"
body = """
§2.ו.5 applies to a teacher with more than one employer "the rules stated in sections 1ו' to 1ח' above", with the necessary changes. In this circular 1.ו is the fiscal-stabilisation law's exclusion of the recuperation allowance, 1.ז the recuperation-days table and 1.ח the part-time share. None of them is a rule about more than one employer.

The rules about more than one position and more than one employer are 1.ט (one employer: one position at most) and 1.י (several employers: each pays on its own part).
"""
reading = "The reference is read as pointing at 1.ט–1.י, the only multi-employer rules in §1: each employer pays the grant on the position held with it, one position at most with each."
l4 = "l4/circulars/2024-25_tashpah_11.l4"
evidence = "`2.ו.5 cites paragraphs that state no multi-employer rule`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_11-c"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_d", "art_2__para_f__subpara_2"]
quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני תשלום מענק יובל · שהשלים 25 או 30 שנות עבודה בישראל … ב- 1 ביוני של אותה שנה נדונה"
title = "Two dates for measuring the jubilee seniority: September of the year before, or 1 June of the year itself"
body = """
§2.ד grants the jubilee grant by the seniority fixed for the teacher "in September of the year before the payment" — September 2024 for the grant paid in June 2025. §2.ו.2 grants it, that same year, to a teacher who "completed 25 or 30 years of work … by 1 June of that year".

For a teacher who completes the 25th (or 30th) year between September 2024 and 1 June 2025 — seniority fixed at 24 in September, 25 years complete by June — §2.ו.2 pays the grant in June 2025 and §2.ד does not.
"""
reading = "§2.ו.2, the clarification that names the day, decides: the seniority is the years completed by 1 June 2025."
l4 = "l4/circulars/2024-25_tashpah_11.l4"
evidence = "`2.ד and 2.ו.2 disagree for a teacher completing 25 years after September`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_11-d"
kind = "broken-reference"
stage = "writing"
keys = ["art_2__para_b", "art_2__para_e", "art_2__para_f__subpara_3"]
quote = "לעניין ההבחנה לזכאות בותק של 25 שנה או 30 שנה, ראה בפירוט בסעיף ה.3"
title = "The jubilee grant's 25/30-year distinction is sent to a \"section ה.3\" that does not exist"
body = """
§2.ב sends the reader to "section ה.3" for the distinction between 25 and 30 years of seniority. §2.ה is a single paragraph (the fiscal-stabilisation law's reduction applies to the grant) with no items; the distinction is drawn in §2.ו.3 (25 years for the junior-high, upper-division, Ofek Hadash recognised-unofficial special education and academic-college parts; 30 years for the other stages).
"""
reading = "The reference is read as §2.ו.3."
l4 = "l4/circulars/2024-25_tashpah_11.l4"
evidence = "`2.ב points to an item 3 of 2.ה, which has no items`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2024-25_tashpah_11-e"
kind = "ambiguity"
stage = "writing"
keys = ["art_2__para_f__subpara_3"]
quote = "ובמכללות האקדמאיות להכשרת עו\"ה- הוותק המזכה במענק יובל הינו וותק מצטבר … של 25 שנה · ביתר שלבי החינוך (גני ילדים, יסודי, מכללות להכשרת עו\"ה) … של 30 שנה"
title = "Teacher-training colleges appear in both the 25-year and the 30-year list"
body = """
§2.ו.3 sets the entitling seniority by the stage a part of the employment is in: 25 years for the junior high, the upper division, Ofek Hadash recognised-unofficial special education "and the academic colleges for training teaching staff"; 30 years for "the other stages (kindergartens, primary, colleges for training teaching staff)".

The second list's "colleges for training teaching staff" is not qualified. An academic college for training teaching staff is in words also a college for training teaching staff, so a part of the employment there is given 25 years by the first list and 30 by the second, unless the second is read as the colleges that are not academic — a distinction the circular does not draw.
"""
reading = "The 25-year list's \"academic colleges\" is the specific term and governs them; the 30-year list's colleges are those that are not academic."
l4 = "l4/circulars/2024-25_tashpah_11.l4"
evidence = "`an academic teacher-training college is named by both lists`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
