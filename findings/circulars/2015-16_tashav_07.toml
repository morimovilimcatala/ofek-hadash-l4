# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2015-16_tashav_07-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d"]
quote = "בשיעור יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה("
title = "Part-time recuperation: pro-rated by the position, or by the months of work?"
body = """
§1ד gives a part-time employee the recuperation allowance "in proportion to the position fraction that year", and then, in brackets, "1/10 for each month of work". The words pro-rate by the share of a position; the bracket pro-rates by months, a tenth of the allowance per month worked.

The two measures differ whenever the employee did not work the whole year: for a full position held for five months, the position fraction is 1 and the months give 5/10. The circular has no other clause on an employee who worked part of the year, so which measure governs decides the amount.
"""
reading = "The year's position is counted month by month: each month of work weighs a tenth of the position held in it, summed over the year and capped at one position by §1ה. It is the reading under which both the words and the bracket apply."
l4 = "l4/circulars/2015-16_tashav_07.l4"
evidence = "`§1ד's words and its parenthesis differ for five months at a full position`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2015-16_tashav_07-b"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_e", "art_1__para_f", "art_2__para_e__subpara_4", "art_2__para_e__subpara_5"]
quote = "זכאי לקצובת הבראה הניתנת למועסק במשרה שלמה אחת בלבד · זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "One full position at most, or each employer's own share above 100%?"
body = """
§1ה: an employee in more than a full position is entitled to the allowance of one full position only. §1ו: an employee of more than one employer whose total position is above 100% is entitled to receive from EACH employer the allowance proportional to the position held with it.

For 70% at one employer and 60% at another, §1ו pays 0.7 + 0.6 = 1.3 allowances and §1ה allows 1. The jubilee grant repeats the clash: §2ה.4 pays "up to one position only", and §2ה.5 applies §§1ו–1ח to an employee of several employers.
"""
reading = "§1ה (and §2ה.4) cap the allowance at one employer; §1ו (and §2ה.5) govern several employers, each paying for the position held with it — the specific rule for the case it names."
l4 = "l4/circulars/2015-16_tashav_07.l4"
evidence = "`§1ה and §1ו give a two-employer teacher different totals`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2015-16_tashav_07-c"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_d", "art_2__para_e__subpara_2"]
quote = "מענק יובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק יובל · שהשלים 25 או 30 שנות עבודה בישראל על-פי האמור להלן, ב 1 -ביוני של אותה שנה נדונה"
title = "The jubilee seniority: as set the September before, or as completed by 1 June?"
body = """
§2ד grants the jubilee grant by the seniority set for the employee in September of the year before the grant (September 2015 for a grant paid in June 2016). §2ה.2 grants it to an employee who has completed 25 or 30 years of work by 1 June of the year in question.

An employee whose 25th year is completed between September and 1 June — seniority 24 as set in September 2015, 25 years complete by 1 June 2016 — is refused by §2ד and granted by §2ה.2.
"""
reading = "§2ה.2's date governs: the grant is earned in the year the qualifying seniority is completed by 1 June; §2ד is read as naming the seniority record the count is taken from."
l4 = "l4/circulars/2015-16_tashav_07.l4"
evidence = "`§2ד and §2ה.2 disagree on a teacher completing 25 years after September`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2015-16_tashav_07-d"
kind = "ambiguity"
stage = "writing"
keys = ["art_2__para_b", "art_2__para_e__subpara_2"]
quote = "בעל ותק מצטבר בהוראה של 25 או 30 שנה ומעלה · יזכה באותה שנה במענק יובל"
title = "Is the jubilee grant paid once, in the year of completion, or to everyone at 25/30 years and above?"
body = """
§2ב pays the jubilee grant to an employee with cumulative seniority "of 25 or 30 years and above". §2ה.2 pays it to an employee who completed 25 or 30 years by 1 June "in that year".

Read alone, §2ב entitles every employee at or above the threshold, every year; §2ה.2 entitles the employee in the year the threshold is reached. For a high-school teacher with 28 years the first gives a grant in 2015-16 and the second does not.
"""
reading = "The grant is earned in the year the qualifying seniority is completed (§2ה.2); \"ומעלה\" is read as admitting seniority counted beyond the threshold within that year, not as a yearly grant."
l4 = "l4/circulars/2015-16_tashav_07.l4"
evidence = "`\"and above\" and the year of completion differ for 28 years`"
depends_on = ["F-2015-16_tashav_07-c"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
