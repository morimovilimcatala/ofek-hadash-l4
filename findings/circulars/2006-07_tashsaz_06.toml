שני המועדים רחוקים זה מזה תשעה חודשים, והם מכריעים אחרת לגבי כל מי שמגיע ל־30 שנה ביניהם. עובד הוראה שהוותק שנקבע לו בספטמבר 2006 היה 29 שנים, והשלים 30 שנה במרץ 2007, אינו זכאי למענק לפי הוותק של ספטמבר, וזכאי לו השנה לפי כלל ה־1 ביוני.
