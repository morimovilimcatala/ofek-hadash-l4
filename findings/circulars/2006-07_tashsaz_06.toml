[[finding]]
id = "F-2006-07_tashsaz_06-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_1__para_d"]
quote = "עובד הוראה במשרה חלקית זכאי לקצובה באופן יחסי לחלקיות משרתו באותה שנה ( 1/10 לכל חודש עבודה)"
title = "Part-time recuperation: pro-rated by the position, or at 1/10 a month worked?"
body = """
The clause gives a part-time employee the allowance "in proportion to the part-time share of the position that year", and then, in brackets, "1/10 for each month of work". The sentence pro-rates by the position fraction; the bracket pro-rates by months worked. They are different measures and give different results: a half-position employee who worked all ten months of the school year gets half the allowance by the position and the whole of it by the months. Read alone, the bracket also gives more than the whole allowance to anyone who worked eleven or twelve months.
"""
reading = "Both apply: the allowance is pro-rated by the position fraction (capped at one position) and by the months worked at 1/10 a month, counting at most ten months — so a full position for the full school year is the full allowance."
l4 = "l4/circulars/2006-07_tashsaz_06.l4"
evidence = "`§1ד's two measures differ`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2006-07_tashsaz_06-b"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p4", "art_2__para_b"]
quote = "מענק היובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק היובל · עובד הוראה שהשלים 30 שנות עבודה בישראל ב 1 -ביוני של שנה נדונה (ובכלל זה ותק בגין שירות חובה בצה\"ל) יזכה באותה שנה במענק יובל"
title = "The jubilee grant's seniority is taken in the September before, and again on 1 June"
body = """
The fourth paragraph of §2 gives the jubilee grant "by the seniority set for the employee in September of the year before the grant is given". Clarification ב says that an employee who completed 30 years by 1 June of a given year earns the grant in that year.

The two dates are nine months apart and decide differently for anyone who reaches 30 years between them. An employee whose seniority set in September 2006 was 29 years, and who completes 30 years in March 2007, has no grant by the September seniority and has the grant this year by the 1 June rule.
"""
reading = "1 June governs: the grant is paid in the year in which the 30 years are completed by 1 June. It is the later and more specific of the two statements, and it names the year of payment."
l4 = "l4/circulars/2006-07_tashsaz_06.l4"
evidence = "`September's seniority and 1 June disagree`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2006-07_tashsaz_06-c"
kind = "contradiction"
stage = "writing"
keys = ["art_2/p2", "art_2__para_b"]
quote = "בעל ותק מצטבר בהוראה של 30 שנה ומעלה כולל ותק שירות צבאי · שהשלים 30 שנות עבודה בישראל"
title = "Thirty years of teaching seniority, or thirty years of work in Israel?"
body = """
The second paragraph of §2 gives the grant to an employee with "cumulative seniority in teaching of 30 years or more, including military service", with employers, owning bodies and formal-education institutions. Clarification ב gives it to an employee who completed "30 years of work in Israel", including compulsory army service.

Work in Israel is wider than teaching seniority. An employee with 27 years of teaching and three earlier years of other work in Israel has 30 years by the clarification and 27 by the second paragraph, and the two give opposite answers.
"""
reading = "The measure is the second paragraph's teaching seniority (with military service and the unpaid-leave years of clarification א); clarification ב is read as fixing the date, not as changing what is counted."
l4 = "l4/circulars/2006-07_tashsaz_06.l4"
evidence = "`teaching seniority and work in Israel disagree`"
depends_on = ["F-2006-07_tashsaz_06-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2006-07_tashsaz_06-d"
kind = "ambiguity"
stage = "writing"
keys = ["art_2/p2", "art_2__para_b"]
quote = "מענק יובל ישולם לעובד הוראה בעל ותק מצטבר בהוראה של 30 שנה ומעלה · יזכה באותה שנה במענק יובל"
title = "Is the jubilee grant paid once, or every year from the 30th?"
body = """
The second paragraph of §2 pays the grant to an employee with seniority "of 30 years or more", which, read alone, includes an employee with 31 or 35 years in every year. Clarification ב ties the grant to the year in which 30 years are completed ("in that year"), which makes it a one-time grant. The circular does not say whether an employee with more than 30 years who has already received it is paid again; the two readings differ for every such employee.
"""
reading = "The grant is paid once, in the year the employee completes 30 years; \"30 years or more\" is read as the threshold, not as a yearly entitlement."
l4 = "l4/circulars/2006-07_tashsaz_06.l4"
evidence = "`\"30 years and more\" pays again a grant §2ב paid once`"
depends_on = ["F-2006-07_tashsaz_06-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
