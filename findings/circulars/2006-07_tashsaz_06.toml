quote = "בעל ותק מצטבר בהוראה של 30 שנה ומעלה כולל ותק שירות צבאי · שהשלים 30 שנות עבודה בישראל"
title = "שלושים שנות ותק בהוראה, או שלושים שנות עבודה בישראל?"
body = """
הפסקה השנייה של §2 נותנת את המענק לעובד הוראה "בעל ותק מצטבר בהוראה של 30 שנה ומעלה כולל ותק שירות צבאי", אצל המעסיקים, הבעלויות ומוסדות החינוך הפורמאלי. הבהרה ב נותנת אותו לעובד הוראה שהשלים "30 שנות עבודה בישראל", ובכלל זה שירות חובה בצה"ל.

עבודה בישראל רחבה מוותק בהוראה. לעובד הוראה עם 27 שנות הוראה ושלוש שנים קודמות של עבודה אחרת בישראל יש 30 שנה לפי ההבהרה ו־27 לפי הפסקה השנייה, והשתיים נותנות תשובות הפוכות.

אותה לשון — "ותק מצטבר בהוראה … כולל ותק שירות צבאי" בכלל, ו"שנות עבודה בישראל … (ובכלל זה ותק בגין שירות חובה בצה"ל)" בהבהרה — מופיעה בחוזרי מענק היובל של השנים האחרות, והשאלה בהם זהה: `F-2007-08_tashsach_05-b`, `F-2008-09_tashsat_09-d`, `F-2009-10_tasha_03-d`, `F-2010-11_tashaa_02-c`, `F-2011-12_tashab_12-c`, `F-2012-13_tashag_07-e`, `F-2013-14_tashad_07-e`, `F-2014-15_tashae_04-e`, `F-2015-16_tashav_07-e`, `F-2016-17_tashaz_05-e`, `F-2017-18_tashach_04-d`, `F-2018-19_tashat_06-d`, `F-2019-20_tashaf_09-d`, `F-2020-21_tashpa_07-e`, `F-2021-22_tashpab_06-f`, `F-2022-23_tashpag_08-d`, `F-2023-24_tashpad_10-g`, `F-2024-25_tashpah_11-f`, `F-2025-26_tashpo_07-d`; כולם מאמצים קריאה אחת. ההבדל בין החוזרים: מ־`F-2011-12_tashab_12-c` ואילך ההבהרה מוסיפה "על־פי האמור להלן", וההבהרות שאחריה נוקבות בשנים המזכות כ"ותק מצטבר, כהגדרתו לעיל"; בחוזר הזה אין המילים האלה. הן מחזקות את הקריאה שם, אך אינן נדרשות לה: גם בלעדיהן ההבהרה באה תחת הכותרת "הבהרות" של הכלל ונוקבת ביום שעד אליו הוא מושלם.
"""
reading = "המדד של §2 עצמו קובע את מה שנספר: ותק מצטבר בהוראה אצל המעסיקים, הבעלויות ובמוסדות החינוך הפורמאלי, כולל שירות צבאי, ועם שנות החופשה ללא תשלום שנרכשו לפי הבהרה א, הנמנה עד 1 ביוני של שנת המענק (`F-2006-07_tashsaz_06-b`). הבהרה ב באה תחת הכותרת \"הבהרות\" של הכלל שמעליה ונוקבת ביום שעד אליו הוותק מושלם; היא מבהירה את הכלל ואינה קובעת זכאות אחרת, ולכן \"שנות עבודה בישראל\" שבה נקראות כאותו ותק. זו הקריאה בכל חוזרי מענק היובל. שני המדדים הם קלטים בקידוד, כך שאפשר להריץ במקומו את מדד ההבהרה."
l4 = "l4/circulars/2006-07_tashsaz_06.l4"
evidence = "`teaching seniority and work in Israel disagree`"
