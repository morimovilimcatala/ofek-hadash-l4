kind = "contradiction"
stage = "writing"
keys = ["art_2/p4", "art_2__para_b"]
quote = "מענק היובל ניתן עפ\"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק היובל · עובד הוראה שהשלים 30 שנות עבודה בישראל ב 1 -ביוני של שנה נדונה (ובכלל זה ותק בגין שירות חובה בצה\"ל) יזכה באותה שנה במענק יובל"
title = "הוותק לעניין מענק היובל נקבע בספטמבר של השנה הקודמת, ושוב ב־1 ביוני"
body = """
הפסקה הרביעית של §2 נותנת את מענק היובל "עפ"י הוותק שנקבע לעובד ההוראה בספטמבר בשנה שלפני מתן מענק היובל". הבהרה ב קובעת כי עובד הוראה שהשלים 30 שנות עבודה עד 1 ביוני של שנה נתונה זוכה במענק באותה שנה.

שני המועדים רחוקים זה מזה תשעה חודשים, והם מכריעים אחרת לגבי כל מי שמגיע ל־30 שנה ביניהם. עובד הוראה שהוותק שנקבע לו בספטמבר 2006 היה 29 שנים, והשלים 30 שנה במרץ 2007, אינו זכאי למענק לפי הוותק של ספטמבר, וזכאי לו השנה לפי כלל ה־1 ביוני.
"""
reading = "המועד של 1 ביוני גובר: המענק משולם בשנה שבה הושלמו 30 השנים עד 1 ביוני. זו המאוחרת והספציפית מבין שתי האמירות, והיא נוקבת בשנת התשלום."
