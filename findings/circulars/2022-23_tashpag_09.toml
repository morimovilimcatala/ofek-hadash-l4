id = "F-2022-23_tashpag_09-g"
kind = "gap"
stage = "verification"
keys = ["art_3__para_3-1__subpara_a", "art_3__para_3-1__subpara_b"]
quote = "יהיה זכאי לקבל מדי שנה זוג נעליים ושני חלוקים · יהיה זכאי לקבל שני חלוקים לשנה"
title = "עובד הוראה בחינוך הטכנולוגי המלמד מקצועות משתי הרשימות: 589 ₪, 366 ₪ או שניהם?"
body = """
§3.1(א) נותן לעובד הוראה או למדריך מקצועי "באחד המקצועות המפורטים להלן" זוג נעליים ושני חלוקים מדי שנה (589 ₪); §3.1(ב) נותן למי שמלמד "באחד המקצועות המפורטים להלן" ברשימה השנייה שני חלוקים (366 ₪). עובד הוראה עשוי ללמד מקצועות משתי הרשימות — למשל מכטרוניקה וסיעוד.

החוזר אינו אומר אם עובד הוראה כזה מקבל את שני הפריטים (955 ₪), את הגבוה מביניהם (589 ₪, הכולל כבר שני חלוקים), או אחד מהם לפי המקצוע העיקרי שהוא מלמד; וגם אינו אומר אם החישוב היחסי לפי היקף המשרה שב־§3.3 חל על כל פריט בנפרד.

אותן הוראות — שתי רשימות המקצועות של קצובת הביגוד בחינוך הטכנולוגי — מודפסות בחוזרי קצובת הביגוד, והשאלה נרשמה עם אותה קריאה בכל אחד מהם: F-2006-07_tashsaz_07-e (תשס"ז/7), F-2007-08_tashsach_06-d (תשס"ח/6), F-2008-09_tashsat_10-e (תשס"ט/10), F-2009-10_tasha_05-e (תש"ע/5), F-2010-11_tashaa_03-f (תשע"א/3), F-2011-12_tashab_13-c (תשע"ב/13), F-2012-13_tashag_08-c (תשע"ג/8), F-2012-13_tashag_09-c (תשע"ג/9), F-2013-14_tashad_08-d (תשע"ד/8), F-2014-15_tashae_07-d (תשע"ה/7), F-2015-16_tashav_08-d (תשע"ו/8), F-2016-17_tashaz_06-d (תשע"ז/6), F-2017-18_tashach_07-c (תשע"ח/7), F-2018-19_tashat_08-c (תשע"ט/8), F-2019-20_tashaf_11-b (תש"פ/11), F-2020-21_tashpa_08-c (תשפ"א/8), F-2021-22_tashpab_07-d (תשפ"ב/7), F-2022-23_tashpag_09-g (תשפ"ג/9) ו־F-2022-23_tashpag_09_clarif-d (ההבהרה לחוזר תשפ"ג/9).
