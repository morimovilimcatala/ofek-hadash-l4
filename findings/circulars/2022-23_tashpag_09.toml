title = "מנהל שאינו ברפורמה מוגבל גם ל־140% וגם ל־150% משרה"
body = """
§1ו מגביל "עובד הוראה" — כל עובד הוראה — ל־140% משרה אצל כלל מעסיקיו, "וכן" מנהל המועסק שלא על פי תנאי הרפורמה ל־150%. מנהל הוא עובד הוראה, ולכן מנהל שאינו ברפורמה נופל תחת שתי ההגבלות: העסקה בהיקף של 145% חורגת מהראשונה ונמצאת בתוך השנייה. הסיכום של ההגבלות ב־§1 (הפסקה "אין לראות באמור לעיל…") מונה 140% "ללא רפורמה", 117% באופק חדש ו־125% בעוז לתמורה, ואינו מזכיר את ה־150% כלל.

אותו משפט בחוזר תשפ"ג/8 §1(ז) מגביל "מורה המועסק שלא עפ"י תנאי הרפורמה" ל־140%, והוא אינו חל על מנהלים; כאן הנושא הורחב לכל עובד הוראה, והחפיפה נוצרת.

אותן מילים מודפסות בחוזרי קצובת הביגוד מתשע"ה עד תשפ"ו, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2014-15_tashae_07-f (תשע"ה/7), F-2015-16_tashav_08-f (תשע"ו/8), F-2016-17_tashaz_06-f (תשע"ז/6), F-2017-18_tashach_07-f (תשע"ח/7), F-2018-19_tashat_08-f (תשע"ט/8), F-2019-20_tashaf_11-a (תש"פ/11), F-2020-21_tashpa_08-b (תשפ"א/8), F-2021-22_tashpab_07-a (תשפ"ב/7), F-2022-23_tashpag_09-c (תשפ"ג/9), F-2024-25_tashpah_12-b (תשפ"ה/12) ו־F-2025-26_tashpo_08-c (תשפ"ו/8). בחוזר תשפ"ד/11 הנוסח שונה ("בתנאי טרום רפורמות עד 140% משרה"), והשאלה נרשמה שם כ־F-2023-24_tashpad_11-a, עם אותה קריאה למנהל.
"""
reading = "ההגבלה של המנהל עצמו חלה על מנהל שאינו ברפורמה — 150% — ככלל הספציפי למנהלים; ה־140% נקרא כהגבלה למורים שאינם ברפורמה, כבסיכום שב־§1 (הפסקה \"אין לראות באמור לעיל…\"), כקריאה של F-2019-20_tashaf_11-a."
