quote = "לשנת הלימודים תשפ\"ב (09/22 - 08/23)"
title = "The clothing allowance is for \"תשפ\"ב\", dated 09/22-08/23 — two different school years"
body = """
Section 1ב entitles a teaching employee to the clothing allowance customary for civil servants who serve the public "for the school year תשפ\"ב (09/22 - 08/23)". The school year תשפ"ב ran from September 2021 to August 2022; September 2022 to August 2023 is תשפ"ג.

The year name and the dates beside it are different years, and the entitlement turns on which: an employee who worked in 09/21-08/22 and left before September 2022 is entitled under the name and not under the dates; one who started in September 2022 is entitled under the dates and not under the name. The section's own heading and the circular's subject line say תשפ"ג.
"""
reading = "The year is תשפ\"ג, September 2022 to August 2023: the printed dates, the heading of section 1 and the subject line all say so."
