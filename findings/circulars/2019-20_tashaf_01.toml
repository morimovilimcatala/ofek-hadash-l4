quote = "מורה המועסק בכיתות א'-ו' … יועסק על-פי מבנה שבוע עבודה של מורה בבית ספר יסודי · מורה המועסק בכיתות ז'-י\"ב יועסק על-פי מבנה שבוע עבודה של מורה בחטיבת ביניים"
title = "A teacher in a multi-stage school who teaches in both grades 1–6 and grades 7–12 has no work week"
body = """
§4.3 sets the work week in a special-education school with several stages: a teacher employed in grades 1–6 works the primary week of §4.4 (36 hours, 26 frontal), and one employed in grades 7–12 the post-primary week of §4.6 (36 hours, 23 frontal). Multi-stage schools exist precisely so that one staff serves several stages, and the circular does not say which week — or what split of the two — applies to a teacher whose hours are in both ranges.

The answer changes the frontal, individual and stay hours of the teacher's position, and with them the position fraction that the hours make up.
"""
reading = "Not resolved: the L4 gives no week for a teacher in both ranges. A pro-rata split by the hours taught in each range is a likely practice but is not in the text."
