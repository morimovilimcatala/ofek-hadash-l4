אותן מילים — ארבע השנים להשלמת התואר והפרשי השכר למפרע — מודפסות בחוזרי ההעסקה ברפורמת אופק חדש, בחינוך המיוחד ובגני הילדים, והשאלה נרשמה עם אותה קריאה בכל אחד מהם עד תשפ"ב: F-2019-20_tashaf_01-b (תש"פ/1), F-2020-21_tashpa_01-g (תשפ"א/1), F-2021-22_tashpab_02-f (תשפ"ב/2), F-2020-21_tashpa_04-c (תשפ"א/4) ו־F-2021-22_tashpab_01-e (תשפ"ב/1).
