# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the section the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2019-20_tashaf_01-a"
kind = "gap"
stage = "writing"
keys = ["art_3__para_3-3__subpara_3-3-1", "art_3__para_3-3__subpara_3-3-2", "art_12__para_12-2__subpara_12-2-3/p2", "art_12__para_12-2__subpara_12-2-3/p3"]
quote = "עו\"ה בעל ותק של עד 27 שנים (כולל) שאינו אקדמאי · עו\"ה בעל ותק של 28 שנים ומעלה שאינו אקדמאי"
title = "A non-academic teacher with seniority between 27 and 28 years is in neither joining rule"
body = """
§3.3 sorts existing non-academic teachers by seniority. §3.3.1: one "with up to 27 years (inclusive)" must sign the commitment to complete an academic degree within 4 years, and does not join the reform until signing. §3.3.2: one "with 28 years and more" need not sign and is employed on reform terms in any case. §12.2.3 repeats the same two bands for promotion: up to 27 inclusive must sign and is not promoted until the degree is proven; 28 and more advance by the table.

Teaching seniority is counted in years and months (the annex E example counts "8 years + 21 months of army service"), so a teacher of, say, 27 years and 6 months is above the first band and below the second. For that teacher the circular says neither whether a commitment is required to join nor whether promotion waits for a degree.
"""
reading = "The bands are read by completed years: a teacher who has not completed 28 years is \"up to 27\" and must sign. It is the reading under which every seniority falls in exactly one band; the L4 keeps the two clauses as printed and asserts that 27.5 years is in neither."
l4 = "l4/circulars/2019-20_tashaf_01.l4"
evidence = "`a non-academic teacher of 27 and a half years is in neither rule`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2019-20_tashaf_01-b"
kind = "contradiction"
stage = "writing"
keys = ["art_3__para_3-3__subpara_3-3-4", "att_3__hc_1/p9", "att_3__hc_1/p10"]
quote = "תוך 4 שנים ממועד הצטרפותו לתנאי הרפורמה, יהיה זכאי להפרשי שכר … רטרואקטיבית מיום הצטרפות עו\"ה לרפורמה · בתוך 4 שנים ממועד החתימה על כתב התחייבות זה · למפרע ממועד החתימה על כתב התחייבות זה"
title = "§3.3.4 and the annex C commitment start the four years and the retroactive differences from different days"
body = """
§3.3.4: a non-academic teacher who proves a degree within 4 years of JOINING the reform is owed the salary differences (to the academic Ofek Hadash salary) retroactively from the day of JOINING; one who finishes later moves to the academic table without differences.

Annex C, the commitment the same teacher signs under §3.3.1, says the teacher undertakes to finish within 4 years of SIGNING the commitment, and acknowledges that finishing within 4 years of joining brings the differences retroactively from the day of SIGNING.

§3.3.1 makes signing a condition of joining, so signing comes first and the two days differ whenever a teacher signs before the school year in which the reform applies. The texts then disagree twice: on whether a degree finished after 4 years from signing but within 4 years from joining keeps the commitment, and on the day from which the differences run (joining under §3.3.4, signing under annex C). For a teacher who signs in June, joins in September and proves the degree in July four years on, §3.3.4 grants the differences and the commitment is already broken.
"""
reading = "§3.3.4 governs: the four years and the differences both run from joining the reform. The circular's own clause states the entitlement, and annex C is the form that implements it; the form's \"signing\" is read as the joining it precedes."
l4 = "l4/circulars/2019-20_tashaf_01.l4"
evidence = "`signed in June, joined in September, degree in July four years on`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2019-20_tashaf_01-c"
kind = "overlap"
stage = "writing"
keys = ["art_7__para_7-3", "art_7__para_7-4", "art_7__para_7-5"]
quote = "אשר היקף העסקתה הינו 90%משרה ומעלה · אשר שיעור משרתה הינו 79%עד, 90%תהיה זכאית להפחתת שעות שהיה · לא תינתן במקביל זכאות להפחתת שעות בגין משרת אם והפחתת שעות בגין שעת הנקה"
title = "A mother at exactly 90% after maternity leave is given both reliefs that §7.5 forbids together"
body = """
§7.3: a teacher after maternity leave employed at "90% of a position and more" gets a nursing hour (one stay hour a day, five a week) for four months, and §7.2's mother's reduction does not apply to her for that period. §7.4: such a teacher whose position is "79% to 90%" is entitled to the mother's reduction of §7.2. §7.5: the mother's reduction and the nursing hour are never given together.

A teacher at exactly 90% is in both §7.3 and §7.4: one clause gives her the nursing hour and disapplies §7.2, the other gives her §7.2's reduction, and §7.5 says she cannot have both. The text does not say which.
"""
reading = "At 90% the nursing hour of §7.3 governs (\"90% and more\" includes 90%), and §7.4's \"79% to 90%\" is read as below 90%. It is the reading under which every position fraction gets one relief and §7.5 is never engaged."
l4 = "l4/circulars/2019-20_tashaf_01.l4"
evidence = "`a mother at exactly 90% after maternity leave gets both reliefs §7.5 forbids together`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

