[[finding]]
id = "F-2019-20_tashaf_01-g"
kind = "contradiction"
stage = "examples"
keys = ["att_5__hc_1__para_1__subpara_a", "att_5__hc_1__para_1__subpara_b/p30", "att_5__hc_1__para_1__subpara_c/p2", "att_5__hc_1__para_2__subpara_c/p23", "att_5__hc_1__para_2__subpara_d/p2", "att_5__hc_1__para_3__subpara_c/p23", "att_5__hc_1__para_3__subpara_d/p2"]
quote = "( 1.034 * ₪ 6,783.75 תוספת שחיקה) = ₪ 7,014.39 · A = )34+100(% x 7,014.39 = 9,399.29"
title = "Annex E's worked examples multiply the salary by 1.034 (\"תוספת שחיקה\"), a factor its conversion formula does not contain"
body = """
Annex E states the conversion formula for an existing teacher (§1(א)), a first deputy (§2(א)) and a principal (§3(א)) as A = X × (100 + Y)% — the salary for conversion X raised by the conversion coefficient Y — and defines X in §1(ב), §2(ג) and §3(ג) without any further factor.

Each of the three worked examples computes X as defined and then multiplies it by 1.034, labelled "תוספת שחיקה" (an erosion supplement), before applying Y: 6,783.75 × 1.034 = 7,014.39 and A = 134% × 7,014.39 = 9,399.29 for the teacher; 14,616.628 × 1.034 = 15,113.593 and A = 18,136.311 for the deputy; 17,107 × 1.034 = 17,688.638 and A = 20,341.933 for the principal. By the formula as stated the teacher's A would be 9,090.23. The 1.034 is named nowhere else in the circular, and nothing says where it comes from or to whom it applies.
"""
reading = "The formula as stated is the rule (A = X × (100 + Y)%); the examples' factor is kept beside it in the L4 as `the examples' conversion` and asserted to reproduce their printed figures, so the difference is visible and the lawyer can say which governs."
l4 = "l4/circulars/2019-20_tashaf_01.l4"
evidence = "`the examples' A follows 1.034, not the stated formula`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

