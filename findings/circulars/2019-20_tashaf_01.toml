body = """
§5.4 מתיר לעובד הוראה להיות מועסק בלא יותר משני בתי ספר "ובלבד שהיקף משרתו המצטבר לא יעלה על 100% בכלל העסקותיו (כלומר, בין אם מועסק בבי"ס אחד ובין אם מועסק בשני בתי ספר)", ומחריג רק את עובדי ההוראה ממקצועות הבריאות ומקצועות שאגף כח אדם בהוראה מתיר בבתי ספר נוספים. אחר כך §6 מסדיר העסקה מעבר ל־100%: במקרים חריגים, באישור ולפי קריטריונים (§6.2), עד 117% באמצעות מערכת השיבוץ (§6.3), ומעבר ל־117% באישור מטה האגף (§6.4).

