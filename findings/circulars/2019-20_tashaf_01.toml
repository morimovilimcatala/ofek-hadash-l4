נספח ה' קובע את נוסחת ההמרה לעובד הוראה קיים (§1(א)), לסגן ראשון (§2(א)) ולמנהל (§3(א)) כך: `A` שווה ל־`X` כפול (100 ועוד `Y`) אחוזים — השכר להמרה `X` מועלה במקדם ההמרה `Y` — ומגדיר את `X` ב־§1(ב), ב־§2(ג) וב־§3(ג) בלי שום מקדם נוסף.

