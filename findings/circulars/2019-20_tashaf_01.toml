אותה דוגמה, באותם מספרים ובאותה לשון של הכלל, מופיעה בחוזרי ההמרה האחרים: `F-2020-21_tashpa_01-h`, `F-2021-22_tashpab_02-h`, `F-2022-23_tashpag_02-j`; כולם מאמצים את אותה קריאה. בחוזרי תשפ"ד ואילך הדוגמה של הסגנית אחרת, ושכרה המשובץ גבוה מ־`A` שלה.
"""
