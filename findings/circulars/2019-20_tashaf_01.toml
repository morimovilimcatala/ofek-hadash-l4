§13.1 מחייב יועץ חינוכי לעבוד "לא פחות מ־1/6 ממשרתו (כלומר – 6 מתוך 36 שעות ליועץ חינוכי במשרה מלאה) בהוראה פרונטאלית בבתי ספר יסודיים ובחטיבות הביניים, ולא פחות מ־4 שעות פרונטאליות לכל שיעור משרה". המקום — "בבתי ספר יסודיים ובחטיבות הביניים" — עומד בין שתי הדרישות, והמשפט נקרא בשתי דרכים: כמסייג רק את ה־1/6, כך שרצפת 4 השעות מחייבת כל יועץ; או כמסייג את הדרישה כולה, כך שגם ה־1/6 וגם 4 השעות מחייבים רק שם.

