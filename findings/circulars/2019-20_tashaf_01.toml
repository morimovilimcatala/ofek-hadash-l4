quote = "בגילאי, 55 – 50 זכאים להפחתה של 2 שעות פרונטאליות · בגילאי 55 ומעלה, זכאים להפחתה של 3 שעות הוראה פרונטאליות ושעה פרטנית אחת"
title = "Age 55 is in both age-hours bands, which give an existing teacher different reductions"
body = """
§8.2: teachers "aged 50–55" drop 2 frontal hours and their position base becomes 34 hours. §8.3: EXISTING teachers "aged 55 and over" drop 3 frontal hours and one individual hour, base 32. §8.4: NEW teachers aged 55 and over drop 2 frontal hours only, base 34.

A teacher of 55 is in §8.2's band and in §8.3's or §8.4's. For a new teacher both answers are the same; for an existing teacher of 55 one clause gives 2 hours off and a 34-hour base, the other 4 hours off and a 32-hour base.
"""
reading = "The band that opens at 55 governs age 55: §8.2 is read as 50 to under 55. It is the reading under which every age has one answer and every band still applies to some age."
l4 = "l4/circulars/2019-20_tashaf_01.l4"
