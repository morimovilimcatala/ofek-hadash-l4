§6.2 מתיר העסקה מעבר למשרה מלאה במקרים חריגים "בכפוף לקריטריונים הבאים" ומונה חמישה: עבודה במקצועות נדרשים (מדעים, אנגלית, מתמטיקה וחינוך גופני), מחסור בעו"ה באזור, מוסד ביישוב מרוחק המתקשה בקליטת עו"ה, היות השעות הנוספות שעות הוראה פרונטאליות בלבד, ולא יותר מ־8.5 שעות ביום ומ־42 שעות בשבוע.

