title = "טבלת החינוך הגופני נותנת ל־0.3 ול־0.5 משרה שני סכומים כל אחד"
body = """
סעיף ב מתמחר את קצובת הביגוד הנוספת למורה לחינוך גופני, "נכון ל־1/9/11", בשלוש מדרגות של שיעור העסקה: עד 0.3 (0), מ־0.3 עד 0.5 (663 ₪), ומ־0.5 ומעלה (1,322 ₪). כל גבול כתוב בשתי המדרגות הנפגשות בו: 0.3 הוא "עד 0.3" וגם "מ-0.3", ו־0.5 הוא "עד 0.5" וגם "מ-0.5".

מורה המועסק בדיוק ב־0.3 מקבל 0 וגם 663 ₪; מורה בדיוק בחצי משרה מקבל 663 ₪ וגם 1,322 ₪. כל שיעור אחר נופל במדרגה אחת.
"""
reading = "המדרגה הנפתחת בגבול היא הקובעת לגביו (\"מ-X\" כולל את X): 0.3 מקבל 663 ₪ ו־0.5 מקבל 1,322 ₪."
