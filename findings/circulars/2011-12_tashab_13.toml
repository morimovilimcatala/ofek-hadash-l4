[[finding]]
id = "F-2011-12_tashab_13-a"
kind = "overlap"
stage = "writing"
keys = ["art_b/t1"]
quote = "עד 0.3 משרה | 0 ‖ מ- 0.3 משרה עד 0.5 משרה | 663 ‖ מ-0.5 משרה ומעלה | 1322"
title = "The physical-education table gives 0.3 and 0.5 of a position two amounts each"
body = """
Section ב prices the extra clothing allowance for physical-education teachers, "correct for 1/9/11", in three bands of employment rate: up to 0.3 (0), from 0.3 to 0.5 (663 ₪), and from 0.5 up (1,322 ₪). Each bound is written into both bands that meet at it: 0.3 is "עד 0.3" and "מ-0.3", and 0.5 is "עד 0.5" and "מ-0.5".

A teacher employed at exactly 0.3 is given 0 and 663 ₪; one at exactly half a position is given 663 ₪ and 1,322 ₪. Every other rate falls in one band.
"""
reading = "The band that opens at a bound governs it (\"מ-X\" includes X): 0.3 takes 663 ₪ and 0.5 takes 1,322 ₪."
l4 = "l4/circulars/2011-12_tashab_13.l4"
evidence = "`the PE table gives 0.3 and 0.5 two amounts each`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_13-b"
kind = "contradiction"
stage = "writing"
keys = ["art_a__para_4", "art_a__para_5"]
quote = "קצובת הביגוד תשולם יחסית להיקף המשרה של העובד ולא יותר ממשרה אחת מלאה (100%) · עובד הוראה המועסק אצל יותר ממעסיק אחד והיקף משרתו הכוללת אצל שני המעסיקים הינו מעבר ל-100% משרה, זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "A teacher at two employers beyond a full position: one position's allowance, or each employer's share?"
body = """
Section א.4 pays the clothing allowance in proportion to the employee's position "and for no more than one full position (100%)". Section א.5 gives a teaching employee at more than one employer, whose position at both together exceeds 100%, the allowance proportional to the position held at EACH employer, separately.

A teacher at two employers whose positions total more than 100% is under both sentences. At 0.8 of a position with one employer and 0.6 with the other, א.4 allows one position's allowance in all (2,076 ₪), and א.5 has the employers pay 0.8 and 0.6 of it, together 1.4 positions' worth (2,906.40 ₪).
"""
reading = "Section א.5 governs a teacher at several employers: each employer pays the share of the position held with it, capped at one position per employer; א.4's cap governs a position beyond 100% at one employer."
l4 = "l4/circulars/2011-12_tashab_13.l4"
evidence = "`the two employers together pay more than one full position's allowance`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_13-c"
kind = "overlap"
stage = "writing"
keys = ["art_c__para_1__subpara_a", "art_c__para_1__subpara_b"]
quote = "באחד המקצועות המפורטים להלן, יהיה זכאי לקבל מדי שנה זוג נעליים ושני חלוקים · באחד המקצועות המפורטים להלן יהיה זכאי לקבל שני חלוקים לשנה"
title = "A technology teacher of subjects on both lists: one allowance or two?"
body = """
Section ג.1(א) gives a teaching employee in technological education "in one of the subjects listed" a pair of shoes and two coats a year (545 ₪); ג.1(ב) gives one "in one of the subjects listed" in a second list two coats a year (338 ₪). The lists share no subject, but a teacher may teach subjects from both — mechatronics from the first and electronic systems from the second.

Such a teacher meets the condition of both clauses. The text does not say whether the entitlements add up (883 ₪ for a full position) or whether one allowance is paid (545 ₪).
"""
reading = "One allowance is paid, the list-(א) one: its pair of shoes and two coats already holds the two coats list (ב) gives."
l4 = "l4/circulars/2011-12_tashab_13.l4"
evidence = "`a teacher of both lists is entitled under both clauses`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_13-d"
kind = "gap"
stage = "writing"
keys = ["art_a__para_1", "art_b/p1", "art_c/p1"]
quote = "א. קצובת ביגוד – כללי · א.1 יש לשלמה במלואה במשכורת חודש יולי 2012."
title = "Only section א, headed \"general\", says when the allowance is paid; the physical-education and technological allowances have no month"
body = """
Section א, headed "קצובת ביגוד – כללי", says the allowance is paid in full with the July 2012 salary. Sections ב (the extra allowance for physical-education teachers) and ג (the allowance in technological education) name no month of payment.

"כללי" reads two ways: as the general provisions of the whole circular, so that July governs the other allowances too; or as the general allowance, as opposed to the extra ones — the reading section ג.3 supports, since it repeats for its own allowance the pro-rating section א.4 already states. On the second reading the extra allowances have no payment date at all.
"""
reading = "Section א.1's July payment covers every clothing allowance one employer owes under the circular, those of sections ב and ג included."
l4 = "l4/circulars/2011-12_tashab_13.l4"
evidence = "`sections ב and ג name no month of payment`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
