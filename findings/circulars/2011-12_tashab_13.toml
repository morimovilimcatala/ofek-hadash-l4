quote = "א. קצובת ביגוד – כללי · א.1 יש לשלמה במלואה במשכורת חודש יולי 2012."
title = "רק סעיף א, שכותרתו \"כללי\", אומר מתי משולמת הקצובה; לקצובות של החינוך הגופני והחינוך הטכנולוגי אין חודש"
body = """
סעיף א, שכותרתו "קצובת ביגוד – כללי", אומר שהקצובה משולמת במלואה במשכורת חודש יולי 2012. סעיפים ב (קצובת הביגוד הנוספת למורה לחינוך גופני) ו־ג (קצובת הביגוד בחינוך הטכנולוגי) אינם נוקבים בחודש תשלום.

"כללי" נקרא בשתי דרכים: כהוראות הכלליות של החוזר כולו, כך שיולי חל גם על הקצובות האחרות; או כקצובה הכללית, להבדיל מהקצובות הנוספות — הקריאה שסעיף ג.3 תומך בה, שכן הוא חוזר לגבי הקצובה שלו על החישוב היחסי שסעיף א.4 כבר קובע. לפי הקריאה השנייה, לקצובות הנוספות אין מועד תשלום כלל.
"""
reading = "התשלום ביולי שבסעיף א.1 חל על כל קצובת ביגוד שמעסיק אחד חב לפי החוזר, ובכלל זה אלה שבסעיפים ב ו־ג."
l4 = "l4/circulars/2011-12_tashab_13.l4"
