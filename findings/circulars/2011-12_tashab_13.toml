[[finding]]
id = "F-2011-12_tashab_13-b"
kind = "contradiction"
stage = "writing"
keys = ["art_a__para_4", "art_a__para_5"]
quote = "קצובת הביגוד תשולם יחסית להיקף המשרה של העובד ולא יותר ממשרה אחת מלאה (100%) · עובד הוראה המועסק אצל יותר ממעסיק אחד והיקף משרתו הכוללת אצל שני המעסיקים הינו מעבר ל-100% משרה, זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "מורה אצל שני מעסיקים מעבר למשרה מלאה: קצובה של משרה אחת, או החלק של כל מעסיק?"
body = """
סעיף א.4 משלם את קצובת הביגוד יחסית להיקף המשרה של העובד "ולא יותר ממשרה אחת מלאה (100%)". סעיף א.5 נותן לעובד הוראה המועסק אצל יותר ממעסיק אחד, שהיקף משרתו הכוללת אצל שני המעסיקים עולה על 100%, את הקצובה היחסית להיקף משרתו אצל כל מעסיק, בנפרד.

מורה אצל שני מעסיקים שמשרותיו מסתכמות ביותר מ־100% נמצא תחת שני המשפטים. ב־0.8 משרה אצל מעסיק אחד ו־0.6 אצל האחר, א.4 מתיר קצובה של משרה אחת בסך הכול (2,076 ₪), ו־א.5 מטיל על המעסיקים לשלם 0.8 ו־0.6 ממנה, יחד שווי של 1.4 משרות (2,906.40 ₪).
"""
reading = "סעיף א.5 קובע לגבי מורה אצל כמה מעסיקים: כל מעסיק משלם את החלק של המשרה אצלו, עד משרה אחת לכל מעסיק; התקרה שב־א.4 קובעת לגבי משרה מעבר ל־100% אצל מעסיק אחד."
l4 = "l4/circulars/2011-12_tashab_13.l4"
evidence = "`the two employers together pay more than one full position's allowance`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2011-12_tashab_13-c"
kind = "overlap"
stage = "writing"
keys = ["art_c__para_1__subpara_a", "art_c__para_1__subpara_b"]
quote = "באחד המקצועות המפורטים להלן, יהיה זכאי לקבל מדי שנה זוג נעליים ושני חלוקים · באחד המקצועות המפורטים להלן יהיה זכאי לקבל שני חלוקים לשנה"
title = "מורה בחינוך הטכנולוגי למקצועות משתי הרשימות: קצובה אחת או שתיים?"
body = """
סעיף ג.1(א) נותן לעובד הוראה בחינוך הטכנולוגי "באחד המקצועות המפורטים להלן" זוג נעליים ושני חלוקים לשנה (545 ₪); ג.1(ב) נותן למי שמלמד "באחד המקצועות המפורטים להלן" ברשימה שנייה שני חלוקים לשנה (338 ₪). לרשימות אין מקצוע משותף, אבל מורה יכול ללמד מקצועות משתיהן — מכטרוניקה מהראשונה ומערכות אלקטרוניות מהשנייה.

מורה כזה עומד בתנאי שני הסעיפים־המשנה. הטקסט אינו אומר אם הזכאויות מצטברות (883 ₪ למשרה מלאה) או שמשולמת קצובה אחת (545 ₪).
"""
reading = "משולמת קצובה אחת, זו של רשימה (א): זוג הנעליים ושני החלוקים שבה כבר כוללים את שני החלוקים שרשימה (ב) נותנת."
l4 = "l4/circulars/2011-12_tashab_13.l4"
evidence = "`a teacher of both lists is entitled under both clauses`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
