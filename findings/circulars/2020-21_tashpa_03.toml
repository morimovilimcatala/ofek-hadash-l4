title = "השורה האחרונה בטבלת הגילים מסתיימת ב\"65\", בעוד שכל שורה אחרת מסתיימת ב\"ו־11 חודשים\""
body = """
טבלת המענק המיוחד נותנת לכל שורה "מגיל" ו"עד גיל". שלוש השורות הראשונות מסתיימות בגיל "ו־11 חודשים" (54, 59 ו־63 שנים ו־11 חודשים), כך שכל אחת נמשכת עד ערב יום ההולדת הראשון של השורה הבאה. השורה האחרונה, 35,000 שקלים, נמשכת "מגיל 64" "עד גיל 65" בלי חודשים.

בקריאה כמו השורות שמעליה, השורה האחרונה מכסה את הגילים 64 ו־65 עד 65 שנים ו־11 חודשים; בקריאה כפי שנדפסה, היא מסתיימת ביום ההולדת ה־65. לעובד שהעסקתו מסתיימת בגיל 65 וחצי מגיעים 35,000 שקלים לפי הקריאה הראשונה, ושום דבר לפי השנייה.

אותה טבלה, עם אותה רצועה אחרונה "65 64", מודפסת בחוזרי השיפוי של המכללות, והשאלה נרשמה בכל אחד מהם עם אותה קריאה: F-2018-19_tashat_02-a (תשע"ט/2), F-2019-20_tashaf_08-a (תש"פ/8) ו־F-2020-21_tashpa_03-b (תשפ"א/3).
"""
reading = "כפי שנדפס: השורה האחרונה מסתיימת ביום ההולדת ה־65, ולכן עובד שעוזב אחריו אינו נכלל באף שורה ואינו מקבל מענק מיוחד."
