quote = "המענק המיוחד ישולם לעובדי הוראה הזכאים, עם גמר יחסי עובד מעסיק. · מיד עם סיום עבודתו של העובד ולא יאוחר מ 2 -חודשים מיום סיום העבודה · חובת הבעלות להצהיר באמצעות טופס, כי השיפוי שקבלה בגין יישום הסכם המכללות, הועבר לעובד · ההוראה תוך 45 ימים מיום פרישתו."
title = "המענק המיוחד מגיע עם סיום ההעסקה, תוך 45 ימים, ולאחר בקשה שאפשר להגיש עד חודשיים"
body = """
הנוהל קובע את המועד שבו המענק המיוחד מגיע לעובד בשלוש דרכים. סעיף ג(ד) משלם אותו "עם גמר יחסי עובד מעסיק". סעיף ו.4 מחייב את הבעלות להצהיר שהשיפוי שקיבלה הועבר לעובד "תוך 45 ימים מיום פרישתו". סעיף ו.1 מאפשר לבעלות לבקש את השיפוי הזה "מיד עם סיום עבודתו של העובד ולא יאוחר מ־2 חודשים" ממנו.

שני המועדים הראשונים שונים (היום ה־0 לעומת היום ה־45). השלישי הופך את השני לבלתי ישים כפי שנכתב: חודשיים קלנדריים אינם פחות מ־59 ימים לעולם, ולכן בעלות שמגישה בזמן עשויה שעדיין לא הגישה — ובוודאי שלא קיבלה את השיפוי שעליה "להעביר" — כאשר 45 הימים חולפים.

אותה שאלה — 45 הימים של ההצהרה מול החודשיים להגשת הבקשה — עולה בנוהל השיפוי של שתי השנים, והיא נרשמה בשתיהן עם קריאה אחת: 45 הימים הם המועד לתשלום המענק לעובד: F-2019-20_tashaf_08-b (תש"פ/8) ו־F-2020-21_tashpa_03-a (תשפ"א/3).
"""
reading = "הבעלות משלמת את המענק עצמו עם גמר היחסים, ובכל מקרה תוך 45 ימים ממנו, בין אם השיפוי התבקש או התקבל ובין אם לאו; ההצהרה של ו.4 נקראת כעוסקת בתשלום הזה."
l4 = "l4/circulars/2020-21_tashpa_03.l4"
