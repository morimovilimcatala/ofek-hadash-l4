[[finding]]
id = "F-2020-21_tashpa_03-a"
kind = "contradiction"
stage = "writing"
keys = ["art_d", "art_g__para_f/p3", "art_g__para_f/p8", "art_g__para_f/p9"]
quote = "המענק המיוחד ישולם לעובדי הוראה הזכאים, עם גמר יחסי עובד מעסיק. · מיד עם סיום עבודתו של העובד ולא יאוחר מ 2 -חודשים מיום סיום העבודה · חובת הבעלות להצהיר באמצעות טופס, כי השיפוי שקבלה בגין יישום הסכם המכללות, הועבר לעובד · ההוראה תוך 45 ימים מיום פרישתו."
title = "The special grant is due at the end of employment, within 45 days, and after an application of up to two months"
body = """
The procedure fixes the time the special grant reaches the employee three ways. Section ג(ד) pays it "with the end of the employer-employee relation". Section ו.4 has the owner declare that the indemnity it received was passed to the employee "within 45 days of his retirement". Section ו.1 lets the owner apply for that indemnity "at once on the end of the work and no later than 2 months" from it.

The first two deadlines differ (day 0 against day 45). The third makes the second unworkable as written: two calendar months are never fewer than 59 days, so an owner that applies on time may not even have applied — let alone received the indemnity it is to "pass on" — when the 45 days run out.
"""
reading = "The owner pays the grant itself on the end of the relation, and in any case within 45 days of it, whether or not the indemnity has been applied for or received; ו.4's declaration is read as about that payment."
l4 = "l4/circulars/2020-21_tashpa_03.l4"
evidence = "`the grant's payment day is given three ways`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2020-21_tashpa_03-b"
kind = "ambiguity"
stage = "writing"
keys = ["art_c__para_a__subpara_3/p5", "art_c__para_a__subpara_3/p8", "art_c__para_a__subpara_3/p9"]
quote = "סכום המענק המיוחד בש\"ח עד גיל מגיל · ( 80,000שמונים אלף )₪ 63ו 11-חודשים 60 · ( 35,000שלושים וחמישה אלף )₪ 65 64"
title = "The age table's last row ends at \"65\", where every other row ends at \"and 11 months\""
body = """
The special-grant table gives each row a "from age" and a "to age". The first three rows end at an age "and 11 months" (54, 59 and 63 years and 11 months), so each runs to the eve of the next row's first birthday. The last row, 35,000 shekels, runs "from 64" "to 65" with no months.

Read like the rows above it, the last row covers ages 64 and 65 to 65 years and 11 months; read as printed, it ends at the 65th birthday. An employee whose employment ends at 65 and a half is owed 35,000 shekels under the first reading and nothing under the second.
"""
reading = "As printed: the last row ends on the 65th birthday, so an employee who leaves after it is in no row and gets no special grant."
l4 = "l4/circulars/2020-21_tashpa_03.l4"
evidence = "`the last row's bound decides an employee aged 65 and a half`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
