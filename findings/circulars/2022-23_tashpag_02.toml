title = "הדוגמה של הסגנית משובצת מתחת ל־`A`, וכלל השיבוץ אינו אומר מה קורה כשאף דרגה אינה מגיעה ל־`A`"
body = """
נספח ה' משבץ סגן ראשון בטבלת השכר "בדרגה בה השכר הינו הקרוב ביותר ל־`A` (שווה לו או גבוה ממנו)". דוגמת הסגנית ממירה ל־`A` של 18,136.311 ומשבצת אותה בדרגה ד' בשכר של 17,961.60 — מתחת ל־`A`. דרגה ד' היא הדרגה העליונה של הסגנים (טבלאות הקידום של §12.3 מגיעות עד ד'), ולכן אין דרגה העומדת בכלל, והכלל אינו אומר מה קורה כאשר `A` גבוה מכל דרגות הטבלה.

ה־`A` שהדוגמה משבצת לפיו כולל את מקדם השחיקה (`F-2022-23_tashpag_02-g`); לפי הנוסחה כפי שנוסחה, ה־`A` של הסגנית הוא 14,616.628 כפול 120%, כלומר 17,539.95, ושכר דרגה ד' שווה לו או גבוה ממנו.

אותה דוגמה, באותם מספרים ובאותה לשון של הכלל, מופיעה בחוזרי ההמרה האחרים: `F-2019-20_tashaf_01-h`, `F-2020-21_tashpa_01-h`, `F-2021-22_tashpab_02-h`; כולם מאמצים את אותה קריאה. בחוזרי תשפ"ד ואילך הדוגמה של הסגנית אחרת, ושכרה המשובץ גבוה מ־`A` שלה.
"""
reading = "הכלל כפי שנוסח: הדרגה הקרובה ביותר ל־`A` ששכרה שווה לו או גבוה ממנו. רק כאשר אף דרגה בטבלה אינה מגיעה ל־`A`, המקרה שהכלל אינו מכריע, העובד משובץ בדרגה הגבוהה ביותר בטבלה, כפי שהדוגמה עושה; ההפרש אינו משולם, שכן אין סעיף המשלם אותו. זו הקריאה בכל החוזרים שמדפיסים את הדוגמה."
