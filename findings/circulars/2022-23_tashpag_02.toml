§13.1 מחייב יועץ חינוכי לעבוד לא פחות מ־1/6 ממשרתו (כלומר 6 מתוך 36 שעות ליועץ חינוכי במשרה מלאה) בהוראה פרונטלית בבתי ספר יסודיים ובחטיבות הביניים, ולא פחות מ־4 שעות פרונטליות לכל שיעור משרה. המקום — "בבתי ספר יסודיים ובחטיבות הביניים" — עומד בין שני חלקי המשפט, והמשפט נקרא בשתי דרכים: כמסייג רק את ה־1/6, כך שרצפת 4 השעות מחייבת כל יועץ חינוכי; או כמסייג את הדרישה כולה, כך שגם ה־1/6 וגם 4 השעות מחייבים רק שם.

החוזר חל גם על בתי ספר על־יסודיים ועל בתי ספר רב־שלביים בחינוך המיוחד (§4.3, §4.6), והקטגוריות שלו עצמו הן בתי ספר יסודיים, על־יסודיים ורב־שלביים, לא חטיבות ביניים. יועץ חינוכי בבית ספר על־יסודי חייב ללמד לפחות 4 שעות פרונטליות לפי הקריאה הראשונה, ואין לו מינימום כתוב לפי השנייה.
"""
reading = "המקום מסייג רק את ה־1/6: רצפת 4 השעות, \"לכל שיעור משרה\", מחייבת כל יועץ חינוכי, וה־1/6 (עם רצפת 4 השעות שמתחתיו) חל בבתי ספר יסודיים ובחטיבות הביניים."
