title = "עובדים שלא דווחו חייבים לפתוח את תיקם \"בדחיפות\" — עד מתי?"
body = """
סעיף 2.1(2)(ב) מורה לבעלות להנחות עובדי הוראה שטרם דווחו במערכות המשרד — לרבות עובדים ממקצועות הבריאות ומטפלים באמצעות אומנויות — לפתוח תיק עובד הוראה מקוון "בדחיפות". הוא אינו נוקב ביום או בתקופה, והשלבים שסביבו נוקבים רק במועד הגשת ההתחייבות להצטרף (2.1(1)).

חובה צריכה מועד שבו היא מופרת. אם נקרא "לפני מועד ההתחייבות", לבעלות יש עד אותו מועד; אם נקרא "מיד", הבעלות מפרה בכל עיכוב; הטקסט אינו אומר איזו מהן.

אותן מילים — הנחיית העובדים שלא דווחו לפתוח תיק "בדחיפות" — מודפסות בחוזרי ההעסקה ברפורמת אופק חדש, והשאלה נרשמה עם אותה קריאה בכל אחד מהם: F-2019-20_tashaf_01-p (תש"פ/1), F-2020-21_tashpa_01-q (תשפ"א/1), F-2021-22_tashpab_02-p (תשפ"ב/2), F-2022-23_tashpag_02-p (תשפ"ג/2) ו־F-2024-25_tashpah_01-n (תשפ"ה/1).
"""
