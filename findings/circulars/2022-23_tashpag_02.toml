[[finding]]
id = "F-2022-23_tashpag_02-c"
kind = "contradiction"
stage = "writing"
keys = ["art_3__para_3-3__subpara_3-3-1", "art_3__para_3-3__subpara_3-3-4", "att_3__hc_1"]
quote = "להשלמת השכלה אקדמית תוך 4 שנים מהמועד בו חתם על ההתחייבות · תוך 4 שנים ממועד הצטרפותו לתנאי הרפורמה … רטרואקטיבית מיום הצטרפות · למפרע ממועד החתימה על כתב התחייבות זה"
title = "The non-academic's four years: from signing or from joining — and differences back to which?"
body = """
3.3.1: a non-academic with up to 27 years' seniority signs an undertaking to complete an academic degree "within 4 years from the date he signed the undertaking". 3.3.4: one who proves the degree "within 4 years from the date of joining the reform" gets the salary difference "retroactively from the day of joining". Annex C, the form he signs, has him undertake to finish within four years of SIGNING, and promises differences if he finishes within four years of JOINING, "retroactively from the date of signing this undertaking".

Joining and signing are different dates (the undertaking may be signed after joining, and the employee does not join until he signs). The circular states two start dates for the four years and two dates back to which the differences run; a degree completed between the two four-year marks is in time under one clause and late under the other.
"""
reading = "3.3.4 governs the entitlement it creates: four years from joining, differences back to joining; 3.3.1's four years from signing is read as the undertaking's own term, and annex C's \"from signing\" as the form's error."
l4 = "l4/circulars/2022-23_tashpag_02.l4"
evidence = "`the four-year periods start on different dates`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

