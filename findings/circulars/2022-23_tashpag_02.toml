title = "5.4 caps every teacher at 100%, \"whether in one school or two\"; section 6 allows more by exception"
body = """
5.4 lets a teaching employee work in no more than two schools "provided his cumulative position does not exceed 100% in all his employments (that is, whether employed in one school or in two)", excepting only health professionals and teachers of subjects the Ministry allows in more schools. Section 6 allows employment above 100% "in exceptional cases" (to 117% through the placement system, beyond it with headquarters' approval), subject to its criteria.

A teacher in one school approved at 110% under section 6 is barred by 5.4's proviso, which names the one-school case expressly and gives no exception for section 6.
"""
reading = "Section 6 is the specific exception to 5.4's cap: a position above 100% approved under section 6 is lawful; 5.4 governs the number of schools and every position not so approved."
l4 = "l4/circulars/2022-23_tashpag_02.l4"
evidence = "`5.4 and section 6 disagree on an approved 110% in one school`"
depends_on = []
