[[finding]]
id = "F-2022-23_tashpag_02-g"
kind = "contradiction"
stage = "examples"
keys = ["att_5__hc_1__para_1__subpara_a", "att_5__hc_1__para_1__subpara_b", "att_5__hc_1__para_1__subpara_b/p30", "att_5__hc_1__para_2__subpara_c/p23", "att_5__hc_1__para_3__subpara_c/p22"]
quote = "( 1.034 * ₪ 6,783.75 תוספת שחיקה) = ₪ 7,014.39"
title = "The conversion examples multiply X by an \"erosion supplement\" of 1.034 that the formula does not have"
body = """
Annex E states the conversion as A = X × (100 + Y)%, and defines X as the salary for conversion: the listed March components the employee would have received at 100% for the roles held. Each of its three worked examples (a teacher, a first deputy, a principal) computes X so defined and then multiplies it by 1.034, labelled "תוספת שחיקה" (an erosion supplement), before applying Y.

Neither the formula, nor the definition of X, nor any section of the circular provides for that factor. Applied as stated, the formula gives the teacher of the example A = 6,783.75 × 134% = 9,090.23, not the example's 9,399.29 — a different salary to place in the table, and possibly a different grade.
"""
reading = "The examples are read as showing an erosion factor of 1.034 that the conversion includes (the agreement's, not stated here); the encoding keeps the formula as stated with X as an input, and asserts the examples with the factor they apply."
l4 = "l4/circulars/2022-23_tashpag_02.l4"
evidence = "`the formula as stated does not give the examples' A`"
depends_on = []
