§1א נמצא תחת הכותרת של סעיף 1 עצמו ("קצובת ביגוד לשנת הלימודים תשע"ו", הקצובה הכללית), ולכן לפי מקומו אינו חל על §§2–3; החוזר אינו אומר מתי הקצובות הנוספות משתלמות.

אותה שאלה עולה ב־15 חוזרי קצובת ביגוד מתשס"ז עד תש"פ, והיא נרשמה בכל אחד מהם עם אותה קריאה: F-2006-07_tashsaz_07-f (תשס"ז/7), F-2007-08_tashsach_06-e (תשס"ח/6), F-2008-09_tashsat_10-f (תשס"ט/10), F-2009-10_tasha_05-f (תש"ע/5), F-2010-11_tashaa_03-e (תשע"א/3), F-2011-12_tashab_13-d (תשע"ב/13), F-2012-13_tashag_08-e (תשע"ג/8), F-2012-13_tashag_09-e (תשע"ג/9), F-2013-14_tashad_08-f (תשע"ד/8), F-2014-15_tashae_07-c (תשע"ה/7), F-2015-16_tashav_08-c (תשע"ו/8), F-2016-17_tashaz_06-c (תשע"ז/6), F-2017-18_tashach_07-e (תשע"ח/7), F-2018-19_tashat_08-e (תשע"ט/8) ו־F-2019-20_tashaf_11-d (תש"פ/11).
"""
reading = "הקצובות הנוספות משולמות יחד עם הקצובה הכללית, במשכורת חודש יולי 2016, כקצובות שהחוזר מעניק בנוסף לה."
