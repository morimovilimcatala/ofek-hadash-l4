# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-2015-16_tashav_08-a"
kind = "contradiction"
stage = "writing"
keys = ["art_1__para_d", "art_1__para_e"]
quote = "קצובת הביגוד תשולם יחסית להיקף המשרה של העובד ולא יותר ממשרה אחת מלאה (100%) · זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "One full position at most, or each employer's own share above 100%?"
body = """
§1ד pays the clothing allowance pro rata to the employee's position "and not more than one full position (100%)". §1ה: an employee of more than one employer whose total position is above 100% is entitled to receive from EACH employer the allowance proportional to the position held with it.

For 70% at one employer and 60% at another, §1ה pays 0.7 + 0.6 = 1.3 allowances, and §1ד allows one.
"""
reading = "§1ד's cap applies at one employer; §1ה governs several employers, each paying for the position held with it — the specific rule for the case it names."
l4 = "l4/circulars/2015-16_tashav_08.l4"
evidence = "`§1ד and §1ה give a two-employer teacher different totals`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2015-16_tashav_08-b"
kind = "overlap"
stage = "writing"
keys = ["art_2/t1"]
quote = "עד 0.3 משרה | 0 ‖ מ- 0.3 משרה עד 0.5 משרה | 667 ‖ מ-0.5 משרה ומעלה | 1331"
title = "The physical-education table gives 0.3 and 0.5 of a position two amounts each"
body = """
§2's table sets the additional clothing allowance for a physical-education teacher in three bands of employment rate: "up to 0.3" (0), "from 0.3 to 0.5" (667 NIS) and "from 0.5 and above" (1,331 NIS).

Each bound is printed in two rows: a rate of exactly 0.3 is both "up to 0.3" and "from 0.3", and 0.5 both "to 0.5" and "from 0.5". At those rates the table gives 0 and 667, and 667 and 1,331.
"""
reading = "The row that opens at a bound governs it: 0.3 gets 667 NIS and 0.5 gets 1,331 NIS, reading each \"עד\" as excluding its bound."
l4 = "l4/circulars/2015-16_tashav_08.l4"
evidence = "`the table gives 0.3 and 0.5 two amounts each`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
