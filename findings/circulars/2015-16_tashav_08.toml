title = "No payment date for the physical-education and technological allowances"
body = """
§1א dates the general clothing allowance: it is paid in full with July 2016's salary. §2 (physical education) and §3 (technological education) each grant an allowance "in addition to" the general one and name no month for paying it.

§1א sits under section 1's own heading ("קצובת ביגוד לשנת הלימודים תשע\"ו", the general allowance), so by its place it does not reach §§2–3; the circular does not say when the additional allowances fall due.
"""
reading = "The additional allowances are paid with the general allowance, with July 2016's salary, as allowances the circular grants in addition to it."
l4 = "l4/circulars/2015-16_tashav_08.l4"
