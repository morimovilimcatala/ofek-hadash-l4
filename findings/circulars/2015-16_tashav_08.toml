quote = "קצובת הביגוד תשולם יחסית להיקף המשרה של העובד ולא יותר ממשרה אחת מלאה (100%) · זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו"
title = "משרה מלאה אחת לכל היותר, או חלקו של כל מעסיק גם מעבר ל־100%?"
body = """
§1ד משלם את קצובת הביגוד יחסית להיקף המשרה של העובד "ולא יותר ממשרה אחת מלאה (100%)". §1ה: עובד הוראה המועסק אצל יותר ממעסיק אחד והיקף משרתו הכוללת מעבר ל־100% זכאי לקבל אצל כל מעסיק בנפרד את הקצובה היחסית להיקף משרתו אצלו.

לעובד במשרה של 70% אצל מעסיק אחד ו־60% אצל מעסיק אחר, §1ה משלם 0.7 ועוד 0.6, כלומר 1.3 קצובות, ואילו §1ד מתיר קצובה אחת.
"""
reading = "התקרה של §1ד חלה אצל מעסיק אחד; §1ה חל על כמה מעסיקים, שכל אחד מהם משלם לפי המשרה אצלו — הכלל המיוחד למקרה שהוא מונה."
l4 = "l4/circulars/2015-16_tashav_08.l4"
evidence = "`§1ד and §1ה give a two-employer teacher different totals`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

