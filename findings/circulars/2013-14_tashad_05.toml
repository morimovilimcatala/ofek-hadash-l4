title = "The rate stands from 3/2013, but the reimbursement \"accordingly\" runs only from 9/2013"
body = """
Section 2 says the drinks rate "stands at 10.42 from month 3/2013", and "accordingly" the Ministry reimbursed the owners retroactively "from September 2013". The allowance is given for 10 working months of the school year (¶15), so March to June 2013 are working months of school year תשע"ג at the new rate.

The circular does not say whether the owners were to pay the new rate for March–August 2013, nor how — if at all — that period is reimbursed: the reimbursement it reports begins six months after the rate it reports.
"""
reading = "The rate applies from 3/2013 as printed, and the Ministry's reimbursement at that rate from 9/2013 as printed; the circular is read as silent on reimbursing March–August 2013."
