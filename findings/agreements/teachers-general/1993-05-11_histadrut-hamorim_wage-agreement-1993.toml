# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity | edge-case
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-hh-1993-a"
kind = "broken-reference"
stage = "writing"
severity = "low"
severity_why = "שני המועדים כתובים בסעיף במפורש (ינואר 1996 לבדיקה הראשונית, ינואר 1997 להליך השנתי), וההפניה לסעיף שאינו קיים אינה משנה אף אחד מהם; אין תוצאה שתלויה בה."
keys = ["art_8__para_b__subpara_3/p3", "art_8__para_b__subpara_6/p2"]
quote = "הליך הבדיקה הראשון כמפורט בסעיף 3א להסכם זה יתבצע החל מינואר 1997"
title = "סעיף 8(ב)(3) מפנה ל\"סעיף 3א להסכם זה\", שאינו קיים, וקורא לבדיקה של ינואר 1997 \"הראשונה\" אחרי שקבע את הראשונה לינואר 1996"
body = """
סעיף 8(ב)(3) פותח: "על אף האמור לעיל הבדיקה הראשונה לפי סעיף זה תתבצע ב- ינואר 1996", ובסופו: "הליך הבדיקה הראשון כמפורט בסעיף 3א להסכם זה יתבצע החל מינואר 1997". סעיף 8(ב)(6) חוזר על כך: "לאחר הבדיקה הראשונה כמפורט בהסכם זה (ינואר 1997)".

לסעיף 3 להסכם (מסגרת העלות) אין סעיף-קטן (א), ושום הוראה בהסכם אינה ממוספרת 3א. ההגדרה של השחיקה היא בסעיף 8(א)(3)(א), וייתכן שאליה הכוונה. בנוסף, ההסכם קורא "ראשונה" לשתי בדיקות שונות: זו של ינואר 1996 וזו של ינואר 1997.
"""
reading = "ההפניה נשארת בלי יעד ושאר המשפט חל כלשונו (המוסכמה instruments.missing-clause): הבדיקה של ינואר 1996 היא הבדיקה הראשונית שבסעיף 8(ב)(3), על בסיס שמונת החודשים האחרונים של 1993 מול 1995, והבדיקה השנתית של סעיף 8(ב)(1) מתבצעת מינואר 1997; סעיף 8(ב)(6) מונה ממנה."
convention = "instruments.missing-clause"
l4 = "l4/agreements/teachers-general/1993-05-11_histadrut-hamorim_wage-agreement-1993.l4"
evidence = "`§8(ב)(3) of 1993 names a §3א that does not exist and a second first check`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-hh-1993-b"
kind = "broken-reference"
stage = "writing"
severity = "low"
severity_why = "השיעורים עצמם קבועים בסעיפים 5 ו־6 בלי תלות בהפניה; היא מתארת את מסגרת העלות ואינה קובעת תשלום, ואין תוצאה שתלויה בה."
keys = ["art_3/p1"]
quote = "מסגרת העלות הינה כמפורט בסעיף 4 להלן."
title = "סעיף 3 אומר שמסגרת העלות \"כמפורט בסעיף 4 להלן\", וסעיף 4 הוא התשלום החד־פעמי"
body = """
סעיף 3 קובע מסגרת עלות של 25% "מעבר להסכמי תוספת היוקר והמסגרת", שבתוכה 3.8% של סעיף 5(א), ומוסיף: "מסגרת העלות הינה כמפורט בסעיף 4 להלן".

סעיף 4 הוא "תשלום חד פעמי" של 20% במשכורת מאי 1993; אין בו פירוט של מסגרת העלות. השיעורים השוטפים על השכר המשולב — 3.8% של סעיף 5(א), 10% של "תוספת 1993" בסעיף 5(ב) ו־11.2% של תוספת ההשתלמות הבית ספרית בסעיף 6 — מסתכמים ב־25% בדיוק.
"""
reading = "ההפניה נקראת אל התשלומים מסעיף 4 ואילך, הקריאה ששומרת את ההסכם עקבי (המוסכמה reading.consistent): שלושת השיעורים השוטפים הם 25% מסגרת העלות, והקידוד אינו מחשב עלות מתוך סעיף 4."
convention = "reading.consistent"
l4 = "l4/agreements/teachers-general/1993-05-11_histadrut-hamorim_wage-agreement-1993.l4"
evidence = "`§3 of 1993 points to the one-time payment and the recurring rates make up the frame`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-hh-1993-c"
kind = "ambiguity"
stage = "writing"
severity = "medium"
severity_why = "גמול של 4% תלוי בכך, אבל המצב הקיים הוא סעיף 3.14.3 לתקנון, שמעתיק את אותן מילים ומשאיר את אותה שאלה פתוחה (F-3.14-a), והמכסה מוגבלת ל־500 מורים שוועדה משותפת מחלקת לפי קריטריונים (סעיף 19(ב)); זו שאלה פתוחה לשני הכיוונים, ולכן בינונית."
keys = ["art_19__para_a"]
quote = "במוסדות חינוך עם מספר כיתות קטן או במקצוע אותו מלמדים שני מורים לפחות, והיקף השעות של כל המורים המלמדים מקצוע זה אינו נופל ממשרה אחת"
title = "האם תנאי השעות של משרה אחת, למינוי מרכז מקצוע בגמול 4%, חל גם על מוסד עם מספר כיתות קטן?"
body = """
סעיף 19(א) ממנה מרכז מקצוע בגמול של 4% משכרו המשולב בשני מקרים — "במוסדות חינוך עם מספר כיתות קטן או במקצוע אותו מלמדים שני מורים לפחות" — ואחריהם ", והיקף השעות של כל המורים המלמדים מקצוע זה אינו נופל ממשרה אחת".

את תנאי השעות אפשר לקרוא כחל על שני המקרים או רק על השני. במוסד קטן שמורי המקצוע בו מחזיקים יחד פחות ממשרה, הקריאה הראשונה שוללת את המינוי והשנייה מחייבת אותו. סעיף 3.14.3 לתקנון מעתיק את המילים האלה, ואותה שאלה נרשמה שם (F-3.14-a).
"""
reading = "תנאי השעות חל על שני המקרים, כפי שנקרא בתקנון: הוא מופרד מהרשימה בפסיק ולכן חל על כל פריטיה (המוסכמה reading.qualifier), והגמול מניח מקצוע שנלמד בהיקף של משרה."
convention = "reading.qualifier"
