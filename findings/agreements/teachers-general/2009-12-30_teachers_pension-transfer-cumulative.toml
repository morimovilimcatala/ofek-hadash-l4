ההגדרה "עובד הוראה קבוע" כוללת עובד הוראה שחל עליו אחד הסעיפים הקטנים 107ב(1) עד 107ב(4) לחוק הגמלאות, וההגדרה "עובד הוראה חדש" מוציאה מכללה את אותם ארבעה סעיפים קטנים. ההגדרה "עובד הוראה קיים" מוציאה רק את 107ב(1) ו־107ב(2).

עובד הוראה שהועסק ברציפות מהיום הקובע ועד תחילת ההסכם, היה מבוטח ביום הקובע בקופת גמל לקצבה, ושחל עליו סעיף 107ב(3) או 107ב(4), עונה על שתי ההגדרות: כ"קבוע" הוא נשאר במסלול פנסיה תקציבית (פרק ד') ומופרשים בגינו 13.5% על הרכיבים שמחוץ למשכורת הקובעת; כ"קיים" הוא מבוטח בקופת גמל לקצבה על בסיס סעיף 3 לפרק ה' ומופרשים בגינו 13.724%, ופרק ז' (השלמת פיצויים) חל עליו. ההסכם אינו אומר איזה מן הפרקים גובר.
"""
