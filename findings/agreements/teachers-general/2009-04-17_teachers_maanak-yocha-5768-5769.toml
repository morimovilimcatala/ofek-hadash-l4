body = """
סעיף 4.3 להסכם הקיבוצי מיום 17.5.2009 קובע: "על אף האמור בסעיף זה, עובד הוראה לא יהיה זכאי לחלק היחסי של מענק יוח"א בגין תקופת שירות במילואים או תקופת שהייה בחופשת לידה". היעדרות אחרת — מחלה, חופשה ללא תשלום, שביתה — אינה מוזכרת, והמענק אינו נגרע בעדה. מורה ששובצה לשמונה שעות יוח"א ושהתה שלושה חודשים בחופשת לידה מקבלת פחות מעמיתה ששובצה כמוה ונעדרה אותם שלושה חודשים בשל מחלה; כך גם מורה ששירת במילואים.

סעיף 2(א) לחוק שוויון ההזדמנויות בעבודה אוסר על מעסיק להפלות בין עובדיו מחמת הריון, היותם הורים או שירות במילואים, בין השאר בתנאי עבודה; סעיף 2(ג) מתיר הבחנה רק כשאופי התפקיד מחייב אותה, וסעיף 17 עושה את המדינה מעסיק ככל מעסיק. שירות המילואים הוא אחד הטעמים שסעיף 2(א) עצמו מונה; התגמול בעד ימי המילואים עצמם הוא עניינו של חוק הביטוח הלאומי, ואינו משנה את המענק.

סעיף 3(א) לחוק אומר שהוראה בהסכם קיבוצי "בקשר להריון ... ללידה" אין בה הפליה. הקריאה כאן היא שהסעיף שומר על הוראה שמגינה על העובדת, ולא על הוראה שלוקחת ממנה שכר בשל הלידה (המוסכמה instruments.pregnancy-provision, בחירה לעיון עורך הדין); ולשירות המילואים אין שמירה כזו כלל.
