[[finding]]
id = "F-hh-2009-c"
kind = "contradiction"
stage = "writing"
severity = "medium"
severity_why = "כסף תלוי בכך: שתי נקודות אחוז מערכי דצמבר 2007 בכל חודש מדצמבר 2009 עד אוקטובר 2010 למורה בשירות המדינה בחינוך העל־יסודי שארגון המורים מייצג. המצב הקיים הוא הדחייה: הערת סעיף 1.1ג בתקנון וסעיף 6 בחוזר תש\"ע/2 מונים את המורים בבתי הספר העל־יסודיים הממשלתיים בין הנדחים. בית משפט עשוי לפסוק לטובת המורה — ההסכם של ארגון המורים לא תוקן, וסעיף 4(י) שלו מאמץ רק שיעורים גבוהים או מועדים קרובים — אבל לא ידוע אם יש הסכם מקביל עם ארגון המורים או חקיקה מחוץ לקורפוס, והתביעות על החודשים האלה כנראה התיישנו; לכן בינונית."
keys = ["art_2__para_a", "art_3__para_a__subpara_1"]
quote = "הסכם זה יחול על כל העובדים המועסקים בשירות המדינה, המדורגים בדירוג עובדי הוראה"
title = "הדחייה, שחתומות עליה המדינה והסתדרות המורים בלבד, חלה על כל עובדי ההוראה בשירות המדינה — גם על מורי ארגון המורים, שהסכמם מיום 24.1.2008 נותן 5% מדצמבר 2009 ולא תוקן"
body = """
ההסכם מיום 17.6.2009 נחתם בין המדינה לבין הסתדרות המורים בלבד. סעיף 2(א) שלו קובע: "הסכם זה יחול על כל העובדים המועסקים בשירות המדינה, המדורגים בדירוג עובדי הוראה". הסעיף אינו מסייג לפי הארגון המייצג. סעיף 3(א)(1) מתקן את סעיף 4(א)(3) להסכם מיום 21.2.08 בלבד: "במקום משכורת חודש דצמבר 2009 יבוא משכורת חודש אוקטובר 2011". הוא אינו נוקב בהסכם אחר שמשלם את תוספת 2008.

ההסכם מיום 24.1.2008 נחתם בין המדינה, מרכז השלטון המקומי ושלוש הערים הגדולות לבין ארגון המורים בבתי הספר העל־יסודיים. סעיף 3 שלו חל על "כל העובדים המועסקים בשירות המעסיקים בחינוך העל-יסודי, המדורגים בדירוג עובדי הוראה והמיוצגים על-ידי ארגון המורים", והמדינה היא אחד המעסיקים האלה. סעיף 4 שלו נותן: "החל במשכורת חודש דצמבר 2009 – השלמת תוספת השכר לשיעור של 5%". אין בקורפוס הסכם שמתקן אותו. סעיף 4(י) שלו מאמץ שיעורים ומועדים של הסכם של הסתדרות המורים רק אם הם "גבוהים ו/או המועדים קרובים", ולכן אינו מביא את הדחייה לתוכו.

לפי ההסכם של ארגון המורים, מורה כזה מקבל 5% ממשכורת דצמבר 2009. לפי הדחייה הוא מקבל 3%, עד משכורת אוקטובר 2010: ההקדמה מיום 24.11.2010 מחזירה את השלב למשכורת נובמבר 2010. המשרד נוהג לפי הדחייה. הערת התקנון לסעיף 1.1ג.3 מונה בין הנדחים את "עובדי הוראה המועסקים בביה\"ס העל-יסודיים הממשלתיים". סעיף 6 בחוזר תש\"ע/2 מונה אותם בין העובדים "שההסכם הקיבוצי מיום 17.6.2009 חל עליהם", בלי להבחין לפי הארגון.

מה שאינו ידוע:
- האם יש הסכם מקביל עם ארגון המורים, או חקיקת ההתייעלות הכלכלית של 2009, שדחו גם אצלו את השלב. ההסכם מיום 14.3.2018 מגדיר את תוספת 2008 "מכוח סעיף 4 להסכם הקיבוצי בין הצדדים שמיום 24.1.2008, וכפי שעודכנה מעת לעת", והקורפוס אינו מחזיק עדכון כזה.
- האם "בחינוך העל-יסודי" בסעיף 3 של ההסכם מיום 24.1.2008 כולל חטיבות ביניים של המדינה. הערת התקנון מונה אותן בנפרד, באוכלוסייה 1.
- התביעות על החודשים דצמבר 2009 – אוקטובר 2010 כנראה התיישנו.
"""
reading = "שני ההסכמים חלים על המורה זה לצד זה: צדדיהם שונים, וההסכם המאוחר אינו מתקן את המוקדם. לכן הקידוד שוקל אותם לפי סעיף 23 של חוק הסכמים קיבוציים, וההוראה שלטובת העובד היא 5% לפי ההסכם מיום 24.1.2008. המשרד עצמו מחיל את הדחייה."
