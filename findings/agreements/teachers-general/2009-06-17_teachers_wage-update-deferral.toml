שתי ההוראות שוות במעמדן (אותם צדדים, הסכם ותיקונו), והן נותנות שתי תשובות לחודשים דצמבר 2009 – ספטמבר 2011: 3% לפי התיקון, 5% לפי סעיף 4(יא).
"""
