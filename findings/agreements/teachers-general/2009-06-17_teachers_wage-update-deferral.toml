title = "האם הדחייה חלה גם על השלמת התוספות השקליות ל־5% (סעיף 4(ז)(3) להסכם 21.2.2008), שהתיקון אינו נוקב בה?"
body = """
הסכם 21.2.2008 קובע שני עדכונים מקבילים, כל אחד ברשימת מועדים משלו: תוספת השכר (סעיף 4(א)), ו"תוספות השכר השקליות", שיעודכנו "בשיעורים ובמועדים הבאים" — ובכללם "(3) החל במשכורת חודש דצמבר 2009 – השלמה לשיעור של 5%" (סעיף 4(ז)).

ההסכם הזה דוחה את "המועד לעדכון תוספת השכר הקבוע בהסכם הקיבוצי מיום 21.2.08", ובתיקון עצמו נוקב בסעיף 4(א)(3) בלבד. "תוספת השכר" היא המונח המוגדר של סעיף 4(א); סעיף 4(ז)(3) אינו מוזכר. מנגד, המבוא מדבר על "דחיית מועד לעדכון השכר הקבוע בהסכמים הקיבוציים החלים על עובדי ההוראה" — כלומר על העדכון כולו.

לפי קריאה אחת, רק תוספת השכר נדחית, והתוספות השקליות מושלמות ל־5% בדצמבר 2009 כמודפס. לפי קריאה אחרת, שלב ג' כולו נדחה, והתוספות השקליות איתו — וכך מבצע את ההסכם חוזר לבעלויות תש"ע/2 (סעיף 6), שדוחה לאוקטובר 2011 גם את "עדכון התוספות השקליות: הסכם תגבור הוראה '94 והסכם מסגרת '87".
"""
