title = "הדחייה לאוקטובר 2011 מתקנת את סעיף 4(א)(3) להסכם 21.2.2008 ומשאירה את סעיף 4(יא), שמחזיר אותו לדצמבר 2009"
body = """
סעיף 3(א)(1) מחליף בסעיף 4(א)(3) להסכם מיום 21.2.2008 את "משכורת חודש דצמבר 2009" ב"משכורת חודש אוקטובר 2011": ההשלמה ל־5% נדחית ב־22 חודשי משכורת, והתוספת נשארת 3% בינתיים.

סעיף 4(יא) לאותו הסכם, שההסכם הזה אינו נוגע בו, קובע: "במקרה בו בהסכם תוספת השכר במגזר הציבורי שייחתם על-ידי הסתדרות העובדים הכללית החדשה, יהיו השיעורים גבוהים ו/או המועדים קרובים מהמפורט לעיל, יתוקנו השיעורים והמועדים הקבועים בסעיפים-קטנים (א) ו – (ז), בהתאמה". הסכם המסגרת מיום 17.4.2008, שנחתם על-ידי ההסתדרות, משלים את מסגרת העלות ל־5% ביום 1.12.2009. אחרי התיקון "המפורט לעיל" בסעיף 4(א)(3) הוא אוקטובר 2011, ומועד הסכם המסגרת קרוב ממנו — כך שסעיף 4(יא), כלשונו, מתקן את המועד בחזרה לדצמבר 2009 ומבטל את הדחייה כולה.

שתי ההוראות שוות במעמדן (אותם צדדים, הסכם ותיקונו), והן נותנות שתי תשובות לחודשים דצמבר 2009 – ספטמבר 2011: 3% לפי התיקון, 5% לפי סעיף 4(יא).
"""
reading = "הדחייה גוברת: היא ההוראה המיוחדת — נוקבת בסעיף 4(א)(3) ובמועד, ומבואה אומר שהיא הפחתת שכר — וסעיף 4(יא) אינו מתקן את המועד שהיא דחתה בחודשים שהיא דוחה; בכל חודש אחר סעיף 4(יא) פועל כמקודם. לפי המוסכמה precedence.specific."
