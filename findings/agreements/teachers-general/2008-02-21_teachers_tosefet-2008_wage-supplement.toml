# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity | edge-case
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-hh-2008-a"
kind = "ambiguity"
stage = "writing"
severity = "medium"
severity_why = "כסף תלוי בכך: המענק של הסכם המסגרת הוא כ־16.5% ממשכורת חודשית ממוצעת. אין בקורפוס מסמך של המשרד שמשלם את המענק של 2008 לעובדי ההוראה — המצב הקיים הוא שאינו משולם להם — והוא מתיישב עם הקריאה שהמענק הוא הקצאת אותו 1.5% שהמורים מקבלים כתוספת; שתי הקריאות אפשריות, ולכן בינונית."
keys = ["art_4__para_jb", "art_4__para_a__subpara_1", "art_4__para_ja"]
quote = "אם בהסכם תוספת השכר במגזר הציבורי שייחתם, יהיו תוספות שכר נוספות לכלל העובדים הפעילים, אזי אלו ישולמו גם לעובדי ההוראה. · החל במשכורת חודש ינואר 2008 – תוספת שכר בשיעור של 1.5% (אחד וחצי אחוז)"
title = "האם \"תוספות שכר נוספות לכלל העובדים הפעילים\" שבסעיף 4(יב) כוללות את המענק החד פעמי של הסכם המסגרת מ־17.4.2008?"
body = """
סעיף 4(יב) קובע שאם בהסכם תוספת השכר במגזר הציבורי שייחתם "יהיו תוספות שכר נוספות לכלל העובדים הפעילים, אזי אלו ישולמו גם לעובדי ההוראה". הסכם המסגרת מיום 17.4.2008, הוא ההסכם שנחתם אחרי הסכם זה, משלם לכל עובד פעיל שהוא חל עליו מענק חד פעמי בעד 1.1.2008–30.11.2008 (סעיף 8 שלו): סכום הממוצעים של רכיבי השכר כפול 0.165.

המענק הוא הקצאת מסגרת העלות של 1.5% לשנת 2008 (סעיף 8.1 שלו: "בהמשך לאמור בסעיף 4.1.1"; 0.165 הם אחד־עשר חודשים של 1.5%) — אותו 1.5% שסעיף 4(א)(1) כבר משלם לעובדי ההוראה כתוספת שכר מינואר 2008. לפי קריאה אחת, המענק אינו "תוספת נוספת" אלא דרך אחרת לשלם את אותה מסגרת, והמורים קיבלו אותה בדרך שלהם. לפי קריאה אחרת, הוא תשלום לכלל העובדים הפעילים שאינו מופיע בהסכם של המורים, וסעיף 4(יב) מחייב לשלם אותו גם להם.

אותן מילים בדיוק מודפסות בסעיף 4(יא) להסכם ארגון המורים מיום 24.1.2008 (הממצא F-oz-2008-a), והקריאה כאן היא הקריאה שם.
"""
reading = "המענק החד פעמי של הסכם המסגרת אינו \"תוספת שכר נוספת\" לעניין סעיף 4(יב): הוא הקצאת אותו 1.5% של 2008, שסעיף 4(א)(1) משלם כתוספת שכר. לפי המוסכמה instruments.general-wage-agreement."
convention = "instruments.general-wage-agreement"
l4 = "l4/agreements/teachers-general/2008-02-21_teachers_tosefet-2008_wage-supplement.l4"
evidence = "`the framework pays as a grant the 1.5% that the agreement of 21.2.2008 pays as a rise`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-hh-2008-b"
kind = "broken-reference"
stage = "writing"
severity = "low"
severity_why = "ההפניה מוסיפה \"בכלל זה\" למיצוי שסעיף 6 כבר קובע לכל הנושאים שההסכם הסדיר עד 31.12.09; התביעה שבסעיף 11 — המשא ומתן על העלות הסופית של 1.8.01–31.12.01 — לא נטענה מאז בשום מסמך בקורפוס, ושום תשלום היום אינו תלוי בתאריך המודפס; לכן נמוכה."
keys = ["art_6/p2"]
quote = "מובהר כי בכלל זה מוצה האמור בסעיף 11 להסכם הקיבוצי מיום 11.12.01"
title = "סעיף 6 ממצה את סעיף 11 של \"ההסכם הקיבוצי מיום 11.12.01\", ובקורפוס אין הסכם מאותו יום"
body = """
סעיף 6 קובע שההסכם ממצה את כל תביעות הצדדים בנושאים שהסדיר עד 31.12.09, ומבהיר: "בכלל זה מוצה האמור בסעיף 11 להסכם הקיבוצי מיום 11.12.01".

בקורפוס אין הסכם קיבוצי מיום 11.12.01. הסכם השכר של הצדדים לעובדי ההוראה לתקופה 1.1.99–31.12.01 "נערך ונחתם ביום 18.12.01", וסעיף 11 שלו הוא בדיוק מה שהמיצוי עוסק בו: "הצדדים ינהלו מו"מ לקביעת העלות הסופית אשר תינתן בגין התקופה שמיום 1.8.01 ועד ליום 31.12.01". גם ההסכם של ארגון המורים מיום 24.1.2008, שבסעיף 10 שלו אותן מילים, ממצה "סעיף 11 להסכם הקיבוצי שנחתם ביום 18.12.2001". התאריך המודפס כאן מוקדם בשבוע מיום החתימה.

הדף עצמו מדפיס "11.12.01" (עמוד 3 של הסריקה), כך שאין זו טעות העתקה של הקורפוס.
"""
reading = "\"ההסכם הקיבוצי מיום 11.12.01\" נקרא כהסכם השכר של הצדדים שנחתם ביום 18.12.01, שסעיף 11 שלו הוא המשא ומתן על העלות הסופית. לפי המוסכמה reading.misprint."
convention = "reading.misprint"
l4 = "l4/agreements/teachers-general/2008-02-21_teachers_tosefet-2008_wage-supplement.l4"
evidence = "`§6 dates the agreement whose §11 it exhausts a week before it was signed`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
