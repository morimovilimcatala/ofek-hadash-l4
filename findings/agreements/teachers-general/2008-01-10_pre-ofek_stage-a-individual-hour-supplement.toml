# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity | edge-case
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-hh-stage-a-a"
kind = "gap"
stage = "writing"
severity = "medium"
severity_why = "כסף תלוי בכך: האם עובד הוראה במשרה של פחות מ־25% זכאי לתוספת של 4.5% ושל 8.5%, ותמורת איזו עבודה. אין בקורפוס מסמך של המשרד שמחיל את שלב א' של הסתדרות המורים על משרה כזו, ולכן אין מצב קיים מתועד; השאלה פתוחה לשני הכיוונים — בינונית."
keys = ["art_3__para_b", "art_3__para_b/t1"]
quote = "האמור בסעיף-קטן (א) מתייחס לעובד הוראה המועסק בהיקף משרה של 75% לפחות, והוא יחול על עובדי הוראה המועסקים בהיקף משרה נמוך יותר בשינויים הבאים לעניין היקף העבודה הפרטנית"
title = "טבלת סעיף 3(ב) נעצרת במשרה של 25%, ועל משרה קטנה ממנה ההסכם אינו אומר דבר"
body = """
סעיף 3(א) נותן תוספת שכר של 4.5% (ומ־1.1.09 של 8.5%) לעובד הוראה שמבצע שעת הוראה פרטנית שבועית אחת (ומ־1.1.09 שתיים). סעיף 3(ב) קובע שהאמור בסעיף־קטן (א) "יחול על עובדי הוראה המועסקים בהיקף משרה נמוך יותר בשינויים הבאים", והטבלה שאחריו מדפיסה שתי שורות בלבד: "50% - 74% משרה" ו"25% - 49% משרה".

על עובד הוראה במשרה של פחות מ־25% ההסכם אינו אומר דבר: לא שהוא מחוץ לתוספת, ולא כמה עבודה פרטנית נדרשת ממנו. סעיף 2 אינו מוציא אותו מתחולת ההסכם, וסעיף 3(ג) משלם את התוספת "בהתאם לחלקיות משרתו" בלי רף תחתון.

ההסכם המתקן מיום 24.2.2008 מחליף את סעיף־קטן 3(ב) בטבלה חדשה (רף של 90% ושורה חדשה של 75%–89%), וגם היא נעצרת ב־25%; החסר נשאר אותו חסר.
"""
reading = "הקידוד אינו משלים שורה שהטבלה אינה מדפיסה (המוסכמה thresholds.missing-row): למשרה של פחות מ־25% אין דרישת עבודה פרטנית, ותוספת השכר של מורה במשרה כזו אינה נקבעת — התשובה היא NOTHING, והקובץ מצהיר `the text is silent` עם ממצא זה."
convention = "thresholds.missing-row"
l4 = "l4/agreements/teachers-general/2008-01-10_pre-ofek_stage-a-individual-hour-supplement.l4"
evidence = "`(ב)'s table has no row under a position of 25%`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-hh-stage-a-b"
kind = "ambiguity"
stage = "writing"
severity = "medium"
severity_why = "כסף ועבודה תלויים בכך: האם מנהל וגננת מקבלים מ־1.1.09 את 8.5% תמורת אותה שעה נוספת ואותן עשר דקות, או שנדרשת מהם עבודה כפולה. אין בקורפוס מסמך של המשרד שמחיל את סעיף 3(ט) על השלב השני, ולכן אין מצב קיים מתועד; שתי הקריאות אפשריות — בינונית."
keys = ["art_3__para_i", "art_3__para_i__subpara_1", "art_3__para_i__subpara_2", "art_3__para_a__subpara_2"]
quote = "לגבי מנהלים - במקום ביצוע שעת הוראה פרטנית יידרשו לבצע שעת עבודה נוספת, מעבר לשעות על-פי היקף המשרה"
title = "סעיף 3(ט) נותן למנהלים ולגננות תחליף אחד לשעה הפרטנית, וסעיף 3(א)(2) מכפיל את השעה מ־1.1.09"
body = """
סעיף 3(ט) מחיל את סעיפים קטנים (א) עד (ח) על מנהלים ועל גננות "בכפוף לשינויים הבאים": מנהל — "במקום ביצוע שעת הוראה פרטנית" — מבצע "שעת עבודה נוספת"; גננת — "במקום ביצוע שעה פרטנית" — מוסיפה עשר דקות לשעת סיום הלימודים בכל יום לימודים.

אבל סעיף 3(א)(2) דורש מעובד ההוראה מ־1.1.09 שתי שעות הוראה פרטניות שבועיות תמורת השלמת התוספת ל־8.5%, וסעיף 3(ב) מקטין את העבודה הפרטנית במשרה חלקית. סעיף 3(ט) אינו אומר אם התחליף גדל בשלב השני (שתי שעות נוספות, עשרים דקות), ואינו אומר אם הוא קטן במשרה חלקית. לפי קריאה אחת התחליף קבוע, ולפי קריאה אחרת הוא מחליף כל שעה פרטנית שהטבלה דורשת.
"""
reading = "המילים כפשוטן (המוסכמה reading.as-printed): מנהל מבצע שעת עבודה נוספת אחת וגננת עשר דקות ביום, בשני השלבים ובכל היקף משרה, ותמורתן התוספת של אותו שלב."
convention = "reading.as-printed"
l4 = "l4/agreements/teachers-general/2008-01-10_pre-ofek_stage-a-individual-hour-supplement.l4"
evidence = "`(ט) keeps one substitute while (א)(2) doubles the teacher's hour`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"
