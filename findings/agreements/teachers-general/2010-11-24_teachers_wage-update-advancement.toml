body = """
סעיף 47 להסכם הכולל מיום 25.12.2008 ("חישוב ושיבוץ עתידיים") ממיר את שכרו של מורה שעבר לרפורמה שוב בכל אחד ממועדי סעיף 4 להסכם מיום 21.2.2008 שאחרי מעברו, על השכר כפי שהוא עולה בתוספת השכר — שלושה מועדים, השלישי מהם מועד השלמת התוספת ל־5%.

סעיף 3(ב) קובע שאין צורך לשנות את המועדים שבסעיף 47, כי מעתה הוא חל "רק לגבי המועדים הקבועים בסעיפים קטנים 4(א)(1) ו – 4(א)(2)", ולא לגבי המועד של 4(א)(3) — וזאת "נוכח ההסכמה על מתן תמורה כלכלית אחרת במקום זאת (אשר כבר מיושמת לגבי עובדי הוראה, ובכפוף להמשך יישומה)".

ההסכם אינו אומר מהי התמורה האחרת, כמה היא שווה, למי היא ניתנת ובאיזה מסמך היא קבועה; גם "המשך יישומה", שההסכמה כפופה לו, אינו מוגדר. ההסכם מחזיק את כל מה שהוא מפנה אליו (סעיף 47 וסעיף 4 להסכם 21.2.2008), כך שאין זה חלק חסר של הטקסט אלא שתיקה שלו.
"""
