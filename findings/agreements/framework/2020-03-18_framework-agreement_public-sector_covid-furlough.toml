סעיף 5(א)(4) לחוק חופשה שנתית קובע שלא יובאו במניין ימי החופשה "הימים בהם אין העובד מסוגל לעבוד מחמת תאונה או מחלה", וסעיף 5(ב) — שחלו ימים כאלה בימי החופשה, החופשה נפסקת לאותם ימים ויש להשלימה. סעיף 33 עושה את עובד המדינה ככל עובד.

עובד שחלה ב־25.3.2020 וקיבל תעודת מחלה באותו יום: לפי ההסכם ימי מחלתו הם ימי חופשה ונגרעים ממאזנו; לפי החוק הם אינם ימי חופשה, והמאזן אינו נגרע בעדם.
