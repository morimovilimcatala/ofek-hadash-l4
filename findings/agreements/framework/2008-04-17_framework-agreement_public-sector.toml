quote = "לגבי גמלאי שפרש לגמלאות מיום 1.1.2008 עד יום: 31.12.2008 תוספת בשיעור ההפרש שבין מדד המחירים לצרכן שפורסם לחודש העבודה האחרון של הגמלאי האמור לבין מדד המחירים לצרכן שפורסם לחודש דצמבר .2007 · שיעור השינוי במדד המחירים לצרכן, בין מדד המחירים לצרכן שפורסם לחודש דצמבר 2007 לבין מדד המחירים לצרכן שיפורסם לחודש דצמבר; 2008 · המדד הבסיסי לעדכון הראשון יהיה מדד חודש דצמבר; 2008"
title = "תוספת ב' נותנת לפורש של 1.1.2008 אפס מעליית המדד של 2008, לפורש של 31.12.2007 את כולה פחות 0.25%, ולפורש של דצמבר 2008 — שעבד כל השנה — את כולה"
body = """
מקרה קצה: שלושה גמלאים בפנסיה תקציבית, אחד פרש ב־31.12.2007, השני ב־1.1.2008 (חודש עבודתו האחרון דצמבר 2007) והשלישי ב־31.12.2008. המדד עלה ב־2008 מ־100 ל־104 (מספרים להמחשה).

תוספת ב' (סעיף 11.1(ז)(2)) נותנת למי שפרש עד 31.12.07 את שיעור השינוי במדד מדצמבר 2007 לדצמבר 2008, פחות השיעור שבטבלה (0.25% לפורש של 2007): 3.75%. למי שפרש ב־2008 היא נותנת את ההפרש "בין מדד המחירים לצרכן שפורסם לחודש העבודה האחרון של הגמלאי האמור לבין מדד המחירים לצרכן שפורסם לחודש דצמבר 2007" — כלומר את עליית המדד מדצמבר 2007 ועד פרישתו: לפורש של 1.1.2008 — אפס, ולפורש של דצמבר 2008 — 4%, יותר ממי שפרש שנה קודם.

עדכוני המשכורת הקובעת לפי המדד מתחילים ממדד דצמבר 2008 למי שפרש לפני תחילת התיקון (סעיף 11.1(ה)(1)), ולכן החודשים שבין פרישה ב־2008 לבין דצמבר 2008 אינם נכנסים לא לתוספת ב' ולא לעדכון. הפורש של 1.1.2008 אינו מקבל דבר מעליית המדד של 2008, והפורש שעבד כל 2008 מקבל את כולה על קצבתו. נראה שהחלון של פסקה (ב) הפוך: מן הפרישה ועד דצמבר 2008, כחלון של פסקה (א) ושל סעיף 11.1(ב) לפורש בשנה רגילה.
"""
reading = "פסקה (ב) מוחלת כלשונה: מעליית המדד מדצמבר 2007 ועד חודש העבודה האחרון. התוצאה לפורשי 2008 מוצגת כממצא, וסעיף 11.4 מחיל בכל מקרה את מה שייקבע בתיקון החקיקה. לפי המוסכמה reading.as-printed."
