body = """
סעיף 3 מחיל את ההסכם "בכפוף למפורט בהסכם זה ולהסכמים שייחתמו בהתאם לאמור בסעיף 8 להלן", והפסקה שאחרי סעיף 16.2(ג) קובעת: "בכפוף לאמור לעיל ובסעיף 8 להסכם זה, לא יתנהל כל משא ומתן נוסף על הסכמי שכר". סעיף 8 הוא המענק החד פעמי, ואין בו הסכמים שייחתמו או משא ומתן; ההסכמים שייחתמו והמשא ומתן הם של סעיף 9 ("משא ומתן נוסף"), שסעיפים 4.2 ו־10.1 מפנים אליו במספרו.

סעיף 12.4 קובע שהתשלום הראשון לקרן הרווחה יועבר אחרי שיתקבל תיקון החקיקה הראשון "כאמור בסעיף 10 לעיל". סעיף 10 הוא מועדי התשלום; תיקון החקיקה הוא של סעיף 11, וסעיף 12.7 מפנה אליו נכון ("כאמור בסעיף 11 לעיל").

בשלושת המקומות ההפניה היא לסעיף שמספרו קטן באחד מהסעיף המתאים, כנראה שארית ממספור קודם של ההסכם.
"""
reading = "ההפניות נקראות כפי שההקשר מחייב: \"סעיף 8\" בסעיף 3 ובסעיף 16.2 — סעיף 9 (המשא ומתן וההסכמים שייחתמו לפיו), ו\"סעיף 10\" בסעיף 12.4 — סעיף 11 (תיקון החקיקה). לפי המוסכמה reading.misprint."
