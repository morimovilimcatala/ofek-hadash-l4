quote = "הרי שסכום תוספת המעו\"ף יעמוד לגבי אותו עובד על ההפרש שבין סכום תוספת המעו\"ף לפי סעיף קטן (א) לבין היתרה · עובד המועסק במשרה חלקית יהיה זכאי לתוספת המעו\"ף באופן יחסי לחלקיות משרתו"
title = "סעיף 4 להסכם הרשויות המקומיות מיום 17.5.2012 מקזז את \"היתרה\" מתוספת המעו\"ף ונותן אותה יחסית לחלקיות המשרה, ואינו אומר מה בא קודם"
body = """
סעיף 4(ו) קובע שלעובד שנותרה לו יתרה חיובית, "סכום תוספת המעו\"ף יעמוד לגבי אותו עובד על ההפרש שבין סכום תוספת המעו\"ף לפי סעיף קטן (א) לבין היתרה". הסכום לפי סעיף קטן (א) הוא הסכום של הדרגה, למשרה מלאה. סעיף 4(ט)(3) קובע ש"עובד המועסק במשרה חלקית יהיה זכאי לתוספת המעו\"ף באופן יחסי לחלקיות משרתו".

לעובד במשרה חלקית שיש לו יתרה, שתי ההוראות נותנות שני סכומים. אפשר לקזז את היתרה מסכום הדרגה ולחלק את ההפרש לפי חלקיות המשרה, ואפשר לחלק קודם את סכום הדרגה ולקזז את היתרה מהסכום היחסי. בחצי משרה בדרגה 8 (300 ₪) ויתרה של 100 ₪ התוצאה היא 100 ₪ בדרך הראשונה ו־50 ₪ בדרך השנייה. גם היתרה עצמה נמדדת בנתוני העובד (התוספות הקבועות שהוא מקבל ו־22% משכרו המשולב), וההסכם אינו אומר אם הסכום של 1,400 ₪ בהגדרת היתרה הוא יחסי.
"""
reading = "היתרה מקוזזת מהתוספת שהעובד זכאי לה בפועל, כלומר מהסכום היחסי לחלקיות משרתו: היתרה נמדדת בשכרו שלו, ולכן היא מקוזזת ממה שמשולם לו. לפי המוסכמה amounts.offset-after-share."
