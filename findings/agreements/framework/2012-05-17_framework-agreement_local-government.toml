severity_why = "כסף תלוי בכך: לעובד במשרה חלקית שנותרה לו יתרה, תוספת המעו\"ף שונה לפי סדר החישוב (בחצי משרה בדרגה 8 ויתרה של 100 ₪ — 50 ₪ או 100 ₪ בחודש). הקורפוס אינו מחזיק מסמך של המעסיקים שמראה איך הם מחשבים, ושתי הקריאות סבירות; לכן בינונית."
