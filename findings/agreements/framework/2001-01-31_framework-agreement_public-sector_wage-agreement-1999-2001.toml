kind = "ambiguity"
stage = "writing"
severity = "low"
severity_why = "בשתי הקריאות עובד שעזב לפני החתימה ופנה למעסיק מקבל את המענק של 1,250 ש\"ח; ההבדל הוא רק במועד שבו המעסיק חייב לשלם. המענק שולם ב־2001, ושום תשלום או זכות אינם תלויים היום בקריאה; לכן נמוכה."
keys = ["art_2__para_2-1__subpara_2-1-2"]
quote = "תחול חובה על המעסיק לשלם לו את המענק כאמור בסעיף 2.1.1 רק אם יפנה למעסיק בדרישה לקבלת המענק החד פעמי תוך 30 יום מיום פנייתו למעסיק"
title = "סעיף 2.1.2 להסכם 31.1.2001 מודד את 30 הימים מן הפנייה עצמה שהם אמורים לתחום"
body = """
סעיף 2.1.2 מחייב מעסיק שאינו המדינה לשלם את המענק החד פעמי לעובד שפוטר או התפטר לפני החתימה "רק אם יפנה למעסיק בדרישה לקבלת המענק החד פעמי תוך 30 יום מיום פנייתו למעסיק".

הפנייה היא גם האירוע שהמועד נמדד ממנו וגם האירוע שהמועד תוחם: כל פנייה נעשית "תוך 30 יום" מיום עצמה. כפשוטו, למגבלה אין דבר לתחום, והתנאי מתקיים בכל פנייה. נראה שהכוונה היא אחת משתיים: מועד אחרון לפנייה, הנמדד מאירוע אחר (החתימה, או הפיטורין), או מועד שבו על המעסיק לשלם אחרי הפנייה.

הסכם הסתדרות המורים של אותו סבב (18.12.2001) מדפיס את אותו סעיף, 4.1.2, כך: "תחול חובה על המעסיק לשלם לו את המענק כאמור בסעיף 4.1 וזאת תוך 30 יום מיום פנייתו של עו"ה למעסיק" — שלושים הימים הם של המעסיק, לתשלום.
"""
reading = "החובה קמה עם פניית העובד, והמעסיק משלם בתוך 30 יום ממנה, כפי שהסעיף המקביל בהסכם המורים מיום 18.12.2001 מנוסח; כך יש תפקיד לכל מילה בסעיף. לפי המוסכמה reading.every-word."
convention = "reading.every-word"
l4 = "l4/agreements/framework/2001-01-31_framework-agreement_public-sector_wage-agreement-1999-2001.l4"
evidence = "`the 30 days of 2.1.2 bound nothing, as printed`"
