"""
reading = "ההכללה המפורשת \"לעניין הסכם זה בלבד\" גוברת: מי שמועסק לפי כתב הרשאה הוא עובד קבוע, גם כשהוא מבוטח בפנסיה צוברת — כפי שסעיף 107ב(ד) להצעת החוק שבנספח ה' משאיר אותו תחת חוק הגמלאות. לפי המוסכמה precedence.specific."
