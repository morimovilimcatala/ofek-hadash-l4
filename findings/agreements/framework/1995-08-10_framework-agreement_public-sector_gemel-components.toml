# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity | edge-case
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-framework-1995-a"
kind = "ambiguity"
stage = "writing"
severity = "low"
severity_why = "אילו \"גננים\" היו הגננות, ההסכם היה מגיע אליהן רק אם האיגוד שלהן חתם עליו או הצטרף אליו, והקורפוס אינו מחזיק חתימה או הצטרפות של הסתדרות המורים או של ארגון המורים. הסטטוס קוו הוא ההסדר של עובדי ההוראה עצמם: הפרשה לקופת גמל מ־1.1.98 לפי הסכמי 8.9.98 ו־17.12.98, שמצהירים שהם ממצים את סעיף 14 להסכם 19.9.94; ותקופת 1995–1997 התיישנה מזמן. לכן נמוכה."
keys = ["att_1__hc_1/t1", "art_2__para_a"]
quote = "גננים · הסכם זה יחול על כל עובד המדורג בדירוג מהדירוגים המפורטים בנספח א'"
title = "נספח א' להסכם 10.8.1995 מונה את הדירוג \"גננים\" בלי לומר מי הם, והסכמי עובדי ההוראה של אותן שנים קוראים לגננות \"גננת\" ומדרגים אותן בדירוג עובדי ההוראה"
body = """
ההסכם חל על "כל עובד המדורג בדירוג מהדירוגים המפורטים בנספח א'", בכפוף לכך שהאיגוד המקצועי של הדירוג חתום עליו או הצטרף אליו. נספח א' מונה עשרים וארבעה דירוגים, ואחד מהם הוא "גננים". הנספח אינו מגדיר את המילה, ואין בו שום דירוג של עובדי הוראה.

המילה יכולה לציין דירוג של עובדי גינון, ויכולה לציין את הגננות. בהסכמי עובדי ההוראה של אותן שנים הגננות הן "גננות" או "גננת" — הסכם השכר של 1994 מדרג "מורה וגננת לא מוסמכים" בטבלאות שלו — והן מדורגות בדירוג עובדי ההוראה, שהסתדרות המורים מייצגת. הקורפוס אינו מחזיק דבר שמכריע בין שתי הקריאות. בעמודת החתימות שליד כל דירוג בנספח אין חתימה של איגוד כלשהו.
"""
reading = "\"גננים\" הוא דירוג בשם הזה, ואינו דירוג עובדי ההוראה. גננת שמדורגת בדירוג עובדי ההוראה אינה בנספח א', שהוא רשימה סגורה. גם אילו נכללה, ההסכם היה מגיע אליה רק אם האיגוד שלה חתם או הצטרף, ובקורפוס אין חתימה או הצטרפות כזו. לפי המוסכמה reading.closed-list."
convention = "reading.closed-list"
l4 = "l4/agreements/framework/1995-08-10_framework-agreement_public-sector_gemel-components.l4"
evidence = "`annex א' of 1995 lists the scale it calls ganannim and not the teaching scale`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-framework-1995-b"
kind = "gap"
stage = "writing"
severity = "low"
severity_why = "הבחירה של סעיף 13 נפתחת רק כשהסדר הביניים מסתיים והחקיקה של סעיף 11 מושלמת, והקורפוס אינו מתעד שזה קרה; גם אז הפער נוגע רק למי שנותרו לו בדיוק עשר שנים, והוא קובע את הקופה שאליה מופרש ולא את גובה ההפרשה. לכן נמוכה."
keys = ["art_13__para_a", "art_13__para_b"]
quote = "פחות מעשר שנות עבודה עד היציאה לפנסיה · יותר מעשר שנות עבודה עד היציאה לפנסיה"
title = "סעיף 13 להסכם 10.8.1995 נותן לאיגוד בחירה למי שנותרו לו פחות מעשר שנות עבודה ולמי שנותרו לו יותר מעשר, ולא למי שנותרו לו בדיוק עשר"
body = """
כשהסדר הביניים מסתיים ומתחילה ההפרשה לפנסיה צוברת, כל איגוד חתום יכול להחליט: לפי סעיף קטן (א), לגבי העובדים "שנותרו להם ביום תחילת ההפרשה לפנסיה צוברת פחות מעשר שנות עבודה עד היציאה לפנסיה" — שימשיכו בהסדר הביניים; ולפי סעיף קטן (ב), לגבי העובדים "שנותרו להם ... יותר מעשר שנות עבודה" — שימשיכו בהפרשה לקופת גמל, בהתאמה להסכם השכר של האיגוד.

שני הסעיפים הקטנים אינם נפגשים: מי שנותרו לו בדיוק עשר שנות עבודה אינו "פחות מעשר" ואינו "יותר מעשר", והסעיף אינו אומר מה דינו.
"""
reading = "לסעיף 13 אין בחירה לגבי מי שנותרו לו בדיוק עשר שנים, ולכן חל עליו סעיף 11(ג): ההפרשה לקופת הגמל נפסקת ומתחילה ההפרשה לפנסיה צוברת (אלא אם האיגודים ממשיכים בהסדר לפי סעיף 7). \"יותר מ־\" אינו כולל את המספר עצמו, לפי המוסכמה thresholds.above."
convention = "thresholds.above"
l4 = "l4/agreements/framework/1995-08-10_framework-agreement_public-sector_gemel-components.l4"
evidence = "`§13 of 10.8.1995 leaves exactly ten years out`"
depends_on = []
