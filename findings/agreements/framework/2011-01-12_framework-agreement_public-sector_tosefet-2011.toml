body = """
סעיף 9 לנספח ג' (ההסכם המתקן את הסכם המעבר לפנסיה צוברת) נותן לעובד קבוע שבחר ב"הסדר החליפי" שני שלבים: "(א) החל ביום 1.1.2011: הפרשת מעסיק - 12.5% ... ניכוי משכר העובד – 5.5% לתגמולים", ו"(ב) החל ביום 1.12.2013: הפרשת מעסיק - 13%, מתוכם 7% לתגמולים ו - 6% במקום פיצויים; ניכוי משכר העובד – 6% לתגמולים".

כל הגדלה אחרת של 2013, בנספח ובהסכם המסגרת, חלה מ־1.1.2013: סעיף 11 לנספח (שיעורי הפנסיה הצוברת, "החל ביום 1.1.2013: הפרשת המעסיק – 13%, מתוכם 7% לתגמולים"), סעיף 10 לנספח (ביטוח מנהלים), סעיפים 12.2(א) ו־(ב) להסכם, וסעיף 5.1.3 להקצאת העלות. ייתכן שהיום 1.12.2013 נכתב בכוונה, וייתכן שהוא טעות במקום 1.1.2013; לפי לשונו, בעשרת החודשים הראשונים של 2013 ובנובמבר נשאר ההסדר החליפי בשיעורי 2011.
"""
reading = "השלב השני של ההסדר החליפי חל מ־1.12.2013, כפי שהודפס: עד אז חלים שיעורי 2011 (12.5% מהמעסיק ו־5.5% מהעובד). לפי המוסכמה reading.as-printed."
