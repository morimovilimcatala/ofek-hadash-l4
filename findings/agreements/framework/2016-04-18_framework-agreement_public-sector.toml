quote = "ביום 1.7.2017 לא יחולו הוראות סעיף 10 לעיל (תוספת שקלית 2016)"
title = "סעיף 20.3(ב) מוציא את עובדי האחיד והמח\"ר ברשויות המקומיות מהתוספת השקלית \"ביום 1.7.2017\", שנה אחרי שהיא מתחילה"
body = """
סעיף 20 עוסק בעובדי הדירוג האחיד והמח"ר ברשויות המקומיות. לפי סעיף 20.1 העלות של סעיפים 5.1.1 ו־5.1.2 תוקצה להם בהסכם קיבוצי נפרד שייחתם עד 30.6.16, ולכן סעיף 20.3(ב) קובע ש"ביום 1.7.2017 לא יחולו הוראות סעיף 10 לעיל (תוספת שקלית 2016)".

התוספת השקלית 2016 מתחילה ביום 1.7.2016 (סעיף 10.1), ובשנה שלפני 1.7.2017 היא כבר משולמת. כפשוטו, הסעיף מוציא אותם מהתוספת ביום אחד, שנה אחרי שהחלה, ומשאיר אותם בה מ־1.7.2016 — הפך מהתכלית של סעיף 20.1. וסעיף 20.3(ד) מוסיף שאם לא יושג הסכם עד 31.12.2016, העלות של סעיף 5.1.1 תוקצה להם לפי סעיף 10 "למפרע ליום 1.7.2016" — מה שאין בו טעם אם סעיף 10 כבר חל עליהם מאותו יום.
"""
reading = "התאריך נקרא כ־1.7.2016: סעיף 10 אינו חל על עובדי האחיד והמח\"ר ברשויות המקומיות מיום שהוא מתחיל, אלא אם לא הושג הסכם עד 31.12.2016, ואז הוא חל עליהם למפרע מ־1.7.2016 לפי סעיף 20.3(ד). לפי המוסכמה dates.misprinted-year, שהיא בחירה לעיון עורך הדין (MMS-486)."
convention = "dates.misprinted-year"
