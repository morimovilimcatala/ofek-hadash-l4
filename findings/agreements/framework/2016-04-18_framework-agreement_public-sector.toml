quote = "בחלקה באופן אחוזי אחיד ובחלקה באופן שקלי אחיד · ביום 1.3.2017 - השלמה ל-1.375% מבסיס השכר לעובד ברשות"
title = "שתי טבלאות בנספח ד' מעלות את השכר מ־1.3.2017 ב־1.37%, כשהנספח עצמו נותן לאותה פעימה 1.375%"
body = """
נספח ד' מחלק את מסגרת העלות לדירוגים הייחודיים בשירות המדינה. בכל טבלה שבו, כל עמודה מיום 1.3.2017 ואילך היא העמודה של ערב ההסכם מוגדלת בשיעורי ברירת המחדל של סעיפים 12–15 — 1.375%, 2.125%, 3% ו־3.75% — ובדירוג מעברי הגבול גם בסכום התוספת השקלית 2016 של שאר הדירוגים הייחודיים (70.54, 96.64, 149.90, 211.63, 264.53 ש"ח). כך טבלת הקלדניות, תוספת הקלדנות, טבלת יהלום ותוספת יהלום, תא אחר תא עד כדי אגורה.

שתי טבלאות יוצאות מן הכלל בעמודה אחת: בטבלת שכר היסוד של מעברי הגבול ובטבלת טווחי שכר היסוד של רשות מקרקעי ישראל, העמודה "מיום 1.3.2017" היא ערב ההסכם מוגדל ב־1.37% בלבד (ובמעברי הגבול בתוספת 96.64 ש"ח), בכל אחת מ־12 הדרגות ומ־7 הטווחים. ב־1.375% כל תא בעמודה של מעברי הגבול היה גבוה ב־24 עד 34 אגורות. שאר העמודות של שתי הטבלאות כן בשיעור המלא. ובאותו נספח, סעיף ד.ב(2) מעלה את שכרו של עובד הרשות ב־1.3.2017 "השלמה ל-1.375%".
"""
reading = "הטבלאות המודפסות קובעות את מה שהן מדפיסות — שכר היסוד של מעברי הגבול וגבולות הטווחים של רשות מקרקעי ישראל — והעלאת השכר של עובד הרשות היא 1.375% לפי סעיף ד.ב(2). לפי המוסכמה rounding.printed-figure: הסכום המודפס קובע, והפער נרשם."
convention = "rounding.printed-figure"
