severity_why = "כסף תלוי בכך — התוספת השקלית 2016 של עובדי האחיד והמח\"ר ברשויות המקומיות מיולי 2016 — אבל הקריאה כפשוטה אינה יכולה לפעול, וסעיף 20.3(ד) עצמו מחיל עליהם את התוספת למפרע מ־1.7.2016; בית דין היה כמעט בוודאות קורא את התאריך כ־1.7.2016, כפי שההקשר מחייב, ולכן בינונית לכל היותר."
