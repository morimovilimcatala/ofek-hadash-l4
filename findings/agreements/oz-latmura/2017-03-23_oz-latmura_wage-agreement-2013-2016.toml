#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.


[[finding]]
id = "F-oz-2017-a"
kind = "ambiguity"
stage = "writing"
severity = "medium"
severity_why = "חוזר תשע\"ז/4 משלם את הסכומים המודפסים ומעדכן לפי מדד, ואין מסמך מחייב שקובע אחרת, כך שבית משפט לא צפוי לשנות את היישום."
keys = ["art_4__para_b", "art_4__para_b__subpara_2", "art_4__para_b__subpara_3", "art_4__para_d"]
quote = "החל מחודש ינואר 2017 יעודכן, אחת לשנה, בחודש ינואר (להלן: \"מועד עדכון\"), סכום התוספת השקלית שייקבע כאמור לעיל, לפי שיעור עליית מדד החדש לעומת המדד הקודם."
title = "האם הסכומים שסעיף 4(ב) מדפיס לאפריל 2017 ולינואר 2018 מועלים בעדכון המדד של אותה שנה, או משולמים כפי שהם מודפסים?"
body = """
סעיף 4(ב) קובע את התוספת השקלית למשרה מלאה בחמישה שלבים: 108.74 ש"ח מ־1.9.2016, 176.70 מ־1.4.2017, 244.66 מ־1.1.2018, 312.62 מ־1.6.2018 ו־380.58 מ־1.12.2018. סעיף 4(ד) מעדכן את "סכום התוספת השקלית שייקבע כאמור לעיל" בכל ינואר החל מינואר 2017, לפי שיעור עליית מדד דצמבר לעומת המדד הקודם.

העדכון של ינואר 2017 חל לפני שה־176.70 נכנסים לתוקף, והעדכון של ינואר 2018 חל ביום שבו נכנסים 244.66. אם כל סכום מודפס נקרא כבסיס שנקבע "לעיל", הוא מועלה בעדכון של אותה שנה; אם הוא נקרא כסכום שנקבע מראש לתקופתו, הוא משולם כפי שהוא מודפס ומתעדכן בינואר שאחריו. בעלייה של 2% שתי הקריאות נותנות 180.23 ו־176.70 ש"ח.

אותה שאלה נרשמה בחוזר תשע"ז/4, שמבצע את הסעיף בחטיבות העליונות של הבעלויות (F-2016-17_tashaz_04-a), עם אותה קריאה.
"""
reading = "כל עדכון חל על הסכום שבתוקף במועדו; סכום שהודפס לתקופה מאוחרת משולם כפי שהודפס מתחילתה ומתעדכן בינואר שאחריו."
convention = "dates.update-in-force"
l4 = "l4/agreements/oz-latmura/2017-03-23_oz-latmura_wage-agreement-2013-2016.l4"
evidence = "`§4(ב)'s amounts and §4(ד)'s update give two readings`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

