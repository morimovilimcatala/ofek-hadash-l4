title = "האם \"תוספות שכר נוספות לכלל העובדים הפעילים\" שבסעיף 4(יא) כוללות את המענק החד פעמי של הסכם המסגרת מ־17.4.2008?"
body = """
סעיף 4(יא) קובע שאם בהסכם תוספת השכר במגזר הציבורי שייחתם "יהיו תוספות שכר נוספות לכלל העובדים הפעילים, אזי אלו ישולמו גם לעובדי ההוראה". הסכם המסגרת מיום 17.4.2008, הוא ההסכם שנחתם, משלם לכל עובד פעיל שהוא חל עליו מענק חד פעמי בעד 1.1.2008–30.11.2008 (סעיף 8 שלו): סכום הממוצעים של רכיבי השכר כפול 0.165.

המענק הוא הקצאת מסגרת העלות של 1.5% לשנת 2008 (סעיף 8.1 שלו: "בהמשך לאמור בסעיף 4.1.1"; 0.165 הם אחד־עשר חודשים של 1.5%) — אותו 1.5% שסעיף 4(א)(1) כבר משלם למורי ארגון המורים כתוספת שכר מינואר 2008. לפי קריאה אחת, המענק אינו "תוספת נוספת" אלא דרך אחרת לשלם את אותה מסגרת, והמורים קיבלו אותה בדרך שלהם. לפי קריאה אחרת, הוא תשלום לכלל העובדים הפעילים שאינו מופיע בהסכם של המורים, וסעיף 4(יא) מחייב לשלם אותו גם להם.
"""
