title = "טבלאות המורות האימהות בנספחים א'–א'3 סוטות ב־16 תאים מהכלל של סעיף 11(ב) ומהדפוס של הטבלאות עצמן"
body = """
כל נספח מנספחי א'–א'3 מדפיס לכל קבוצת גיל שתי טבלאות. בטבלה לפי סעיף 11(ב) — מורה אם שממשיכה במבנה השבוע שהיה חל עליה אילולא הייתה אם — "היקף משרה" הוא "היקף משרה אילולא הייתה אם" ועוד צעד קבוע: 7 נקודות בנספח א' (כפי שממצא F-oz-founding-11-a קורא את "הגדול ב – 7%"), ו־8.6, 8.3 ו־7.6 נקודות בנספחים א'1–א'3, השיעורים שסעיף 26(ה) מעמיד במקום 7%. הטבלה לפי 11(א) — מורה שמפחיתה את שעותיה — מדפיסה את עמודות טבלת (ב) בהזזה של עמודה אחת: היא עובדת שעה פרונטאלית אחת פחות, היקף המשרה "אילולא הייתה אם" הוא של העמודה שלה בטבלת (ב), והמשרה לשכר היא של העמודה הבאה.

כל שאר התאים של 24 הטבלאות שומרים על הדפוס הזה, ו־16 אינם:

בטבלאות לפי (ב), המשרה לשכר אינה המשרה אילולא הייתה אם ועוד הצעד: נספח א', מגיל 50 עד 55, העמודה הרביעית — 92.53% במקום 93.84% (86.84% ועוד 7); נספח א'2, מעל 55, השלישית — 96.37% במקום 99.37%; נספח א'3, מגיל 50 עד 55, השלישית — 98.75% במקום 98.78%; ונספח א'3, מעל 55, השלישית — 96.23% במקום 98.23%.

בטבלאות לפי (א), המשרה לשכר אינה זו של העמודה הבאה בטבלת (ב) ועוד הצעד: נספח א', מגיל 50 עד 55, העמודה השלישית — 92.53% במקום 93.84%; נספח א'1, מעל 55, השנייה — 96.98% במקום 98.98%; נספח א'2, מעל 55, השנייה — 96.37% במקום 99.37%; נספח א'3, מגיל 50 עד 55, ארבע העמודות — 102.89%, 96.48%, 92.59% ו־89.65% במקום 103.19%, 98.78%, 92.89% ו־89.95%; ונספח א'3, מעל 55, השנייה — 96.23% במקום 98.23%. באותה טבלה של נספח א' מגיל 50 עד 55, שורת "היקף משרה אילולא הייתה אם" בעמודות השנייה עד הרביעית היא שורת הטבלה של עד גיל 50 (96.25%, 91.25%, 87.50%), ולא 96.05%, 90.79% ו־86.84% של טבלת (ב) שלצידה; ובעמודה הרביעית שלה מודפסות 8.5 שעות תומכות הוראה, כשבטבלת (ב) העמודה המקבילה מדפיסה 8.

הקורפוס עצמו בודק את שני היחסים האלה בתעתיק, ומצמיד חלק מהתאים האלה כקריאות שעמוד הפקס ברזולוציה של 100 ppi עדיין לא הכריע (MMS-571). הקידוד קורא את הטבלאות כפי שהקורפוס מפרסם אותן, והתאים נשארים כפי שהודפסו.
"""
