reading = "סעיף 37(ג), העוסק במענק ההקצאה החליפית לבדו, גובר: מפרישים עליו 5% מהמעסיק לתגמולים ו־5% מהמורה לתגמולים, כמו על המענקים של סעיפים 35 ו־36 שבמקומם הוא בא. לפי המוסכמה precedence.specific."
