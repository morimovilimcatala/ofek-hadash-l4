title = "סעיף 46(א) מחריג מההפרשות בשיעורי הרכיבים הפנסיוניים את המענקים של סעיפים 35 ו־36 ולא את מענק סעיף 37, שסעיף 37(ג) קובע לו 5% ו־5%"
body = """
סעיף 46(א) קובע שמשנת הלימודים תשע"ב יבוצעו הפרשות לקופת גמל לקצבה "בגין כל רכיבי השכר המשולמים לעובד ההוראה", בשיעורים הנהוגים לגבי "רכיבים פנסיוניים", ומונה את החריגים: המענק בגין תוצאות הערכה (סעיף 35), המענק בגין הישגי בית הספר (סעיף 36), החזר הוצאות, קצובת ביגוד, גילום מס וזקיפת הטבה למס. לשני המענקים הראשונים קובעים סעיפיהם הפרשות של 5% ו־5% בלבד (35(ח) ו־36(י)), ולכן הוצאו מהכלל.

המענק של סעיף 37, ההקצאה החליפית בתשע"ב, אינו ברשימה, אף שסעיף 37(ג) קובע לו את אותם 5% ו־5% במילים זהות. לפי לשון 46(א) הוא רכיב שכר שחלים עליו שיעורי הרכיבים הפנסיוניים (לפי 46(ד) ו־(ה): 6.5% או 7% מהמעסיק לתגמולים, ניכוי העובד, ו־8 1/3% במקום פיצויים); לפי 37(ג) — 5% ו־5%. שתי הוראות באותו הסכם קובעות שיעורים שונים לאותו מענק.
