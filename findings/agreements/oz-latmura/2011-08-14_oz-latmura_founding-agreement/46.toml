אותו חסר עולה בתגמול המיוחד של החוזה המיוחד שבנספח ו': סעיף 4(ב) לחוזה קורא לו "תוספת שכר הקרויה 'תגמול מיוחד (תמריצים)'", וסעיף 4(ד) קובע שבגינו "יבוצעו הפרשות לקופת גמל לקצבה בשיעורים של 5%" מהמעסיק ו־5% מהעובד. אפשר לקרוא את סעיף 4(ג) לחוזה ("אינו מהווה שכר לכל דבר ועניין") כמוציא אותו מ"כל רכיבי השכר" של 46(א), אבל גם אז 46(א) אינו מונה אותו בין החריגים, והשיעורים שלו הם של החוזה.
"""
