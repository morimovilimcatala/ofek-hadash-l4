title = "סעיף 24 אומר על תוספת עוז לתמורה למנהלים שיבוצעו בגינה הפרשות לקרן השתלמות, ועל תוספת המעבר לרפורמה שלצידה אינו אומר"
body = """
סעיף 24 נותן למנהל קיים שתי תוספות. על "תוספת עוז לתמורה - מנהלים" (30%) הוא אומר ב־24(ו) שתשולם כרכיב שכר נפרד ותובא בחשבון "לעניין חישוב ערך שעה, לעניין פיצויי פיטורים ... לעניין הפרשות לקופת גמל לקצבה ולקרן השתלמות".

על "תוספת מעבר לרפורמה" (50%) הוא אומר רק ב־24(ב) באיזה בסיס היא נכללת, וב־24(ג) ש"בגינה יבוצעו הפרשות לקופת גמל לקצבה" ושההפרשה במקום פיצויים תבוא במקום מלוא פיצויי הפיטורים בגינה. על קרן השתלמות אין בו מילה. ערך השעה מוכרע בסעיף 15(א)(2), שבסיסו כולל את כל התוספות האחוזיות החודשיות; קרן ההשתלמות אינה מוכרעת בשום הוראה של ההסכם.

ההחלטה מיום 28.5.2013 סוגרת את הפער מכאן ואילך (סעיף 11(ב) שלה); ההסכם כפי שנחתם נשאר כפי שהוא, והממצא חל על התקופה שלפניה.
"""
reading = "תוספת המעבר לרפורמה אינה מובאת בחשבון לעניין הפרשות לקרן השתלמות, כי 24(ו) אומר זאת על התוספת שלצידה ו־24(ג) אינו אומר זאת עליה. לפי המוסכמה reading.contrast. מיום החלטת ועדת ההיגוי, 28.5.2013, סעיף 11(ב) שלה מוסיף לסוף 24(ג) ש\"בגין תוספת מעבר לרפורמה יבוצעו הפרשות לקרן השתלמות\", והקידוד שלה מביא את התוספת בחשבון לקרן ההשתלמות מאותו יום (F-oz-higui-2013-b); הקריאה הזו חלה על התקופה שלפניו."
convention = "reading.contrast"
l4 = "l4/agreements/oz-latmura/2011-08-14_oz-latmura_founding-agreement/oz-founding-24.l4"
evidence = "`section 24 names a training fund for one of its supplements only`"
depends_on = ["F-oz-higui-2013-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

