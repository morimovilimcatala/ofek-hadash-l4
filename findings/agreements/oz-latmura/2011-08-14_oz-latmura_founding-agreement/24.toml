title = "בסיס תוספת המעבר לרפורמה בסעיף 24(א) משמיט את תוספת 2011 ואת תוספת שחיקה 2011, שסעיפים 38(ג) ו־39(ב) מביאים בחשבון בכל תוספת אחוזית"
body = """
סעיף 24(א) נותן למנהל קיים "תוספת מעבר לרפורמה" בשיעור 50%, "המחושבת על בסיס השכר המשולב, תוספת 94', תוספת 2001 ותוספת 2008". תוספת 2011 ותוספת שחיקה 2011 אינן ברשימה.

סעיף 38(ג) קובע שתוספת 2011 "תובא בחשבון לעניין חישוב תוספות אחוזיות המחושבות מהשכר המשולב", למעט תוספת 2001, תוספת 2008, תוספת עוז לתמורה, תוספת שחיקה 2011 ותוספת דרגת קידום; סעיף 39(ב) קובע אותו דבר על תוספת השחיקה, למעט ארבע. תוספת המעבר היא תוספת אחוזית המחושבת מהשכר המשולב, ואינה בין החריגים של אף אחד מהם; לפיהם שתי התוספות נכנסות לבסיסה, ולפי הרשימה שבסעיף 24(א) — לא.

סעיף 11(א) להחלטת ועדת ההיגוי מיום 28.5.2013 כותב את שתי התוספות לתוך רשימת 24(א), מיום ההחלטה; ההסכם כפי שנחתם נשאר כפי שהוא.
"""
reading = "הרשימה שבסעיף 24(א), העוסקת בתוספת המעבר עצמה, גוברת על הכלל הכללי של 38(ג) ו־39(ב): בבסיס תוספת המעבר אין תוספת 2011 ואין תוספת שחיקה 2011, כמו בקריאת שורות 4 ו־6 שבטבלת סעיף 17 (F-oz-founding-17-a). לפי המוסכמה precedence.specific. מיום החלטת ועדת ההיגוי, 28.5.2013, סעיף 11(א) שלה מוסיף את תוספת 2011 ואת תוספת שחיקה 2011 לבסיס, והקידוד שלה מחשב כך מאותו יום (F-oz-higui-2013-b); הקריאה הזו חלה על התקופה שלפניו."
