body = """
סעיף 31(ב) מזכה מנהלי בתי ספר חדשים בבתי ספר ביישום חלקי, בשנות הלימודים תשע"ב–תשע"ד, "לתוספת עוז לתמורה כמפורט בסעיף 31 לעיל". סעיף 31 הוא הסעיף שבו ההפניה עצמה עומדת, ואינו "לעיל" לה; השיעורים היחידים שהוא קובע הם של 31(א), לתוספת עוז לתמורה למנהלים, ו־31(א) מזכה בהם מנהלים קיימים בלבד.

ההפניה אינה יכולה להיות לסעיף 31 כפי שהודפסה. המבנה המקביל בהסכם מצביע על היעד: ביישום מלא, סעיף 24 נותן למנהל קיים את תוספת עוז לתמורה למנהלים, וסעיף 25(ג) נותן למנהל חדש "תוספת עוז לתמורה המשולמת למורים, בהתאם להוראות סעיף 16"; ביישום חלקי, 31(א) מקביל לסעיף 24, והתוספת למורים ביישום חלקי היא של סעיף 28. גם 31(ב) נוקב ב"תוספת עוז לתמורה", בלי "למנהלים" שב־31(א).
"""
