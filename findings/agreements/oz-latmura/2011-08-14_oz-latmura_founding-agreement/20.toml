body = """
הטבלה שבסעיף 20(ב) קובעת את נקודות הזכות בשל הערכה לפי שלושה טורים: "מחנך"; "רכז שכבה, רכז מקצוע, רכז הערכה, רכז התאמות, רכז חינוך חברתי, רכז טיולים"; ו"מורה שאינו בעל תפקיד".

סגן מנהל, יועץ חינוכי, מורה שהמנהל הטיל עליו משימות ובעל תפקיד שהמעסיק הקצה לו שעות לפי 17(ב) הם בעלי תפקידים (סעיף 17 עוסק בהם תחת "מורים בעלי תפקידים", ו־17(ב) ו־(ד) קוראים להם "בעל תפקיד"), ולכן אינם בטור השלישי — אבל גם אינם באחד משני הראשונים. מחנך שהוא גם רכז נמצא בשני טורים, וסעיף 20(א)(2) מכריע מקרה כזה רק לנקודות בשל מילוי תפקיד, לא לנקודות בשל הערכה.

הפתיח של 20(ב) מזכה בנקודות זכות את "המורים אשר תוצאות ההערכה לגביהם הינן הגבוהות ביותר", ו"30% מהמורים בבית הספר" — בלי להבחין לפי תפקיד; הטבלה קובעת רק כמה נקודות. לכן המילים תומכות בכך שבעל תפקיד שמחוץ לטורים זכאי לנקודות, ואינן אומרות באיזה טור. ועדת ההיגוי, בסעיף 10 להחלטתה מיום 28.5.2013, החליפה את הטבלה באותם שלושה טורים (חוזר תשע"ד/2 מפרסם אותה בסעיף 11), ובסעיף 8 להחלטה מנתה בטבלת סעיף 17(ד) את היועץ, את סגן המנהל ו"כל בעל תפקיד שהוא אינו מהמנויים לעיל" כבעלי תפקיד: הפער נשאר כפי שהיה.
"""
reading = "בעל תפקיד שתפקידו אינו בטבלה זכאי לנקודות, כפי שהפתיח מזכה את כל המורים שבראש ההערכה, ונמצא בטור הרכזים, הטור של בעלי התפקידים שאינם מחנכים; ומורה שבשני טורים מקבל את הנקודות הגבוהות מביניהם, כפי ש־20(א)(2) קובע לנקודות בשל תפקיד. אותה קריאה חלה על הטבלה של החלטת ועדת ההיגוי מיום 28.5.2013 ועל חוזר תשע\"ד/2 שמפרסם אותה. לפי המוסכמה reading.role-table-column, בחירה שממתינה לעיון עורך הדין."
