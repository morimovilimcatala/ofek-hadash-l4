title = "האם ההפניה של סעיף 25(ג) ל\"הוראות סעיף 16\" מביאה למנהל חדש גם את הגדלת תוספות 87' ו־94' שבסעיף 16(ג)"
body = """
סעיף 25(ג) מזכה מנהל חדש בבית ספר שבו מיושמת הרפורמה באופן מלא "לתוספת עוז לתמורה המשולמת למורים, בהתאם להוראות סעיף 16 לעיל". סעיף 16 עצמו עושה שני דברים: 16(א)–(ב) קובעים את תוספת עוז לתמורה (42% מהשכר המשולב, תוספת 2001 ותוספת 2008) ולמה היא נחשבת, ו־16(ג) מגדיל ב־42% את תוספת 87' ואת תוספת 94' "המשולמות למורה כאמור בסעיף –קטן (א)".

מנהל אינו "מורה" (סעיף 4(ב) מוציא מן ההגדרה כל מי שמכהן כמנהל בית ספר), ולכן 16(ג) אינו חל עליו מכוח לשונו. לפי לשון 25(ג) מושא הזכאות הוא "תוספת עוז לתמורה", וההפניה ל"הוראות סעיף 16" יכולה להתפרש כמביאה רק את מה שנוגע לתוספת עצמה, או את הסעיף כולו, 16(ג) בכלל.
"""
reading = "ההפניה מביאה את סעיף 16 כולו: מנהל חדש בבית ספר ביישום מלא זכאי גם להגדלה של 42% בתוספות 87' ו־94', ביחס לערכן השקלי ערב חתימת ההסכם. לפי המוסכמה reading.referral. מיום החלטת ועדת ההיגוי, 28.5.2013, סעיף 12 שלה משלם למנהל חדש לפי כללי המנהל הקיים \"על אף האמור בסעיפים 25 ו – 31(ב)\", כל עוד לא הוסכם אחרת (F-oz-higui-2013-b); הקריאה הזו חלה על התקופה שלפניו."
