title = "שעות תפקיד \"בכפוף\" למכסת שעות פרונטליות מינימלית: מקוצצות עד המכסה, או אינן ניתנות כלל"
body = """
סעיף 17א, שסעיף 9(ב) מוסיף להסכם הכולל, נותן לבעלי תפקידים בחטיבת הביניים שעות תפקיד במקום שעות הוראה פרונטליות: לרכז חינוך חברתי, למשל, "0.4 שעות במספר הכיתות שבחטיבת הביניים", בלי תקרה. סעיף־קטן (ד) קובע שכל זה "בכפוף לכך" ששעות ההוראה הפרונטליות בפועל לא יפחתו מ־12 במשרה מלאה (ובמשרה חלקית — מ־50% משעות הטבלאות, ולא פחות מ־6 או 8).

רכז חינוך חברתי במשרה מלאה בחטיבת ביניים של 30 כיתות זכאי לפי (ב) ל־12 שעות תפקיד; אם יקבל את כולן יישארו לו 11 שעות פרונטליות, פחות מהמכסה. הסעיף אינו אומר אם שעות התפקיד מקוצצות כך שתישאר המכסה (11 שעות), או שמי שהקצאתו המלאה הייתה יורדת מתחת למכסה אינו מקבל שעות תפקיד כלל. סעיף 15א(ד) בעותק המלא של ההסכם (לבית ספר יסודי עם כיתות ז'–ט') מנוסח באותן מילים.
"""
reading = "המכסה המינימלית היא גבול ולא תנאי: שעות התפקיד מקוצצות עד שנשארת המכסה, ואינן יורדות מתחת לאפס; בחטיבת ביניים צמודה נספרות גם השעות בחטיבה העליונה, כפי ש־(ה) קובע."
