body = "מקרה קצה: מורה בחצי משרה, ששכרו המשולב למשרה מלאה 11,387.80 ₪, חונך שלושה מתמחים בשנת תשפ\"ו.\n\nסעיף 39ב(ד) נותן לחונך 2.4% מהשכר המשולב לכל מתמחה, 7.2% לשלושה. סעיף 39ב(ה) מחיל עליו את כללי החישוב של רכז מקצוע, וסעיף 39(א)(11) קובע שלעניין גמולי התפקיד \"שכר משולב\" הוא השכר המשולב למשרה מלאה, ובלבד שהמורה מועסק בשליש משרה לפחות. בחצי משרה הגמול הוא אפוא 7.2% מ־11,387.80 ₪: 819.92 ₪ לחודש.\n\nהסימולטור של משרד החינוך מחשב את הגמול על השכר לפי אחוז המשרה, ומשלם 409.96 ₪. כך גם את גמול הרכז הפדגוגי (סעיף 39ג(ב)): 455.51 ₪ במקום 911.02 ₪. החוזרים אינם אומרים לחשב אחרת; הפער מופיע בעמוד מקורות סותרים, בכרטיס של החונך והרכז הפדגוגי במשרה חלקית."
