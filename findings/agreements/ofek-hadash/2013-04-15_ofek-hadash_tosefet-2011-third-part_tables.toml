body = """
ההסכם מיום 29.2.2012 קבע שטבלת השכר של סגן מנהל ראשון היא 85% מטבלת המנהלים (מיום 1.3.2011, במקום 75% שבהסכם הכולל), וכותרות הטבלאות כאן אומרות זאת: "לפי 85% משכר מנהל". טבלאות ה־75% מצורפות "לצורך המרה בלבד". ההסכם הזה מצרף חמש טבלאות לפי 85% (א'13, א'15, א'17, א'19, א'21) וארבע לפי 75% (א'14, א'16, א'18, א'20), כל אחת לצד טבלת המנהלים שלה (א'8–א'12).

החלק מכל תא בטבלת המנהלים, בעיגול לאגורה, נותן את התא שבטבלת הסגנים ב־92 מתוך 123 התאים של טבלאות ה־85% וב־86 מתוך 108 התאים של טבלאות ה־75%; בשאר התא המודפס רחוק אגורה אחת לכאן או לכאן. כבר בטבלת השכר (א'13), ברמה 2, דרגה א: 85% מ־14,595.62 הם 12,406.277, כלומר 12,406.28, והטבלה מדפיסה 12,406.27. נראה שהטבלאות חושבו מנתונים לא מעוגלים שההסכם אינו מדפיס — כפי שנמצא כבר בטבלאות ההסכם מיום 25.1.2011 (F-ofek-hadash-tosefet-2011-c).
"""
