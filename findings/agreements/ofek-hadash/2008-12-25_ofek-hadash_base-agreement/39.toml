§39(ב) מגביל את המורה לשני גמולי תפקיד, אלא אם מנהל המחוז אישר גמול בגין תפקיד נוסף (גמול חינוך מיוחד אינו נמנה). השיעורים שב־39(א) שונים זה מזה — מ־3% לרכז מעבדה עד 11.5% למחנך כיתה א'.

מורה הממלא שלושה תפקידים בלי אישור מקבל שניים, והטקסט אינו אומר אילו: את הגבוהים, לפי בחירתו, או לפי סדר המינוי. מחנך כיתה ורכז מקצוע בחטיבת ביניים שהוא גם רכז ביטחון מקבל 18% או 16% מהשכר המשולב, לפי התשובה.
"""
