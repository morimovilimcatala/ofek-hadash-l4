quote = "\"שכר משולב\"- שכר משולב למשרה מלאה (100%), ובלבד שעובד ההוראה הועסק ב- 1/3 משרה לפחות"
title = "גמולי התפקיד משולמים על משרה מלאה כבר משליש משרה: מורה בשני תפקידים בשליש משרה מקבל על כל משרה שהוא עובד יותר ממורה באותם תפקידים במשרה מלאה"
body = """
§39(א)(11) קובע שגמולי התפקיד (מלבד חינוך מיוחד ומורה משלב) מחושבים על "שכר משולב למשרה מלאה (100%), ובלבד שעובד ההוראה הועסק ב־1/3 משרה לפחות". מעל שליש משרה הגמול אינו גדל עם המשרה, ומתחת לשליש אין גמול כלל (F-ofek-hadash-base-39-b).

בשכר משולב של 8,000 ₪ למשרה מלאה, מחנך כיתה שהוא גם רכז מקצוע בחטיבת ביניים (10% ו־8%) מקבל 9,440 ₪ במשרה מלאה. בשליש משרה הוא מקבל 4,106.67 ₪ — 12,320 ₪ על כל משרה מלאה של עבודה, 30% יותר. ב־0.33 משרה, פחות משליש בכמה דקות שבועיות, הוא מקבל 2,640 ₪: הגמולים כולם, 1,440 ₪, נעלמים, ושליש משרה בדיוק שווה 1,466.67 ₪ בחודש יותר.

לכן הכלל מתגמל מורה בעל תפקידים שמחזיק בשליש משרה בדיוק ולא יותר: כל שעה שהוא מוסיף מעבר לשליש משולמת בשכר המשולב לבדו, בלי חלק בגמולים. מנהל ממנה לתפקיד לשנה אחת, ועד שני תפקידים (שלושה באישור מנהל המחוז, §39(ב)), כך שפיצול שליש משרה בין בתי ספר אינו מכפיל את הגמולים. המדרגה בשליש אינה צוק: משרה גדולה יותר משתלמת יותר, בכיוון הצפוי; המעוות הוא שהגמולים אינם קשורים לעבודה שמעל שליש.

הממצא עלה בציד הבאגים של mengwong (L2), שהריץ את קוד ה־L4 של המאגר והראה את הקפיצה גם ב־z3; שם הדוגמה היא רכזת פדגוגית המלווה שני מתמחים בטבלה 102, ומספריה 3,585.45 ₪ ב־0.33 משרה ו־5,012.38 ₪ בשליש.
"""
