severity_why = "כסף תלוי בכך — כ־1,400 ₪ בחודש למורה בשני תפקידים — והכלל מתגמל משרה של שליש בדיוק במקום משרה גדולה יותר; אבל הבסיס של משרה מלאה מעל שליש משרה כתוב בהסכם במפורש, החוזרים והסכם 2022 מחילים אותו כך, ובית משפט צפוי להחיל אותו כלשונו; בינונית."
