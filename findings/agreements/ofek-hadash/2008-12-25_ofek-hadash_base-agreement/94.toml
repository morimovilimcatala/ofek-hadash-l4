body = "מקרה קצה: סגן מנהל ראשון בתנאי הרפורמה, ששכרו המשולב 12,987 ₪, מחנך כיתה א' בשנת תשפ\"ז.\n\nסעיף 94 נותן לו \"גמול למחנך כיתה … כמפורט בסעיף 39 לעיל\". סעיף 39(א)(1) נותן למחנך כיתה 10%, וסעיף 39(א)(2) נותן למחנך כיתה א' 11.5%. לכן הגמול הוא 11.5% מ־12,987 ₪: 1,493.51 ₪ לחודש. תשפ\"ו/1 (סעיף 15.7) מונה את אותם שני שיעורים.\n\nהסימולטור של משרד החינוך, במחשבון לסגני מנהלים, משלם לסגן שמחנך כיתה 10% בכל שכבה, גם בכיתה א': 1,298.70 ₪, 194.81 ₪ פחות. אפשר לקרוא \"גמול למחנך כיתה\" כגמול של סעיף 39(א)(1) בלבד; אבל ההפניה לסעיף 39 כולו מביאה גם את השיעור של כיתה א'."
reading = "סגן מנהל ראשון שמחנך כיתה א' מקבל את השיעור של סעיף 39(א)(2), 11.5%; \"כמפורט בסעיף 39\" מביא איתו את השיעור של הכיתה שהוא מחנך."
