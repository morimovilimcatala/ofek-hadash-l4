§128(ב) מחייב יועץ חינוכי ללמד לפחות שישית ממשרתו (6 מתוך 36 שעות במשרה מלאה), "ובכל אופן לא פחות מ־4 שעות פרונטאליות לכל שיעור משרה".

אם "לכל שיעור משרה" פירושו 4 שעות למשרה מלאה, לפי חלקיות המשרה, הרצפה לעולם אינה חלה: שישית מ־36 היא 6, יותר מ־4, בכל היקף משרה — והבדיקה על כל היקפי המשרה מ־1% עד 100% מאשרת זאת. אם פירושו 4 שעות בכל היקף משרה, הרצפה חלה על כל יועץ במשרה של פחות משני שלישים — יועץ בחצי משרה מלמד 4 שעות ולא 3. הנוסח "ובכל אופן" מצביע על הקריאה השנייה, והמילים "לכל שיעור משרה" על הראשונה.
"""
