פרקים לז עד מ של ההסכם קובעים לגננות שבוע עבודה, טבלאות שכר, גמולים והמרת שכר בתנאי הרפורמה. §155(ב), המונה את הנושאים שעליהם ימשיך המשא ומתן, פותח את רשימת "העובדים הנוספים" שלהם ייחתם בעתיד הסכם ליישום הרפורמה ב"גננות" — בלי סייג — ורק אחר כך מונה גננות משלבות, פארא־רפואיות, מנהלות אשכולות, גננות מילו"א וגננות בתי חולים.

המבוא (ה"והואיל" האחרון) מנסח את אותה רשימה כ"גננות שלא נכללו בהגדרת 'גננת' להלן", ו־§156 מוציא את 155(ב) מחובת השקט התעשייתי. כפשוטו, 155(ב) משאיר פתוחה, ופטורה משקט תעשייתי, שאלה שההסכם עצמו הכריע בה.
"""
