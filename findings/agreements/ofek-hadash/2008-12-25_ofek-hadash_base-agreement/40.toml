title = "סעיף 40 משלם את גמול ליווי הטיולים רק עבור שעות שמעבר לשעות העבודה, וההסכם מיום 8.9.98 אינו משלם לפי שעות"
body = """
סעיף 40 קובע ש"גמול ליווי טיולים ישולם בהתאם להסכם הקיבוצי מיום 8.9.98, אולם בשינוי להסכם האמור, הגמול ישולם אך ורק עבור שעות שהינן מעבר לשעות העבודה החדשות". ההסכם מיום 8.9.98 (סעיפים 4.ג–4.ד) אינו משלם לפי שעות: הוא נותן לפעילות מספר יחידות לפי השעה שבה היא מסתיימת — 0.5 עד 15:00, 2 עד 18:00, 3.5 עד 21:00, 5 עד 24:00 — וכל יחידה שווה 0.7% מהשכר המשולב החודשי.

הסעיף אינו אומר איך מתרגמים "שעות שמעבר לשעות העבודה" ליחידות. אפשר לקרוא אותו כתנאי בלבד — פעילות שנמשכת אחרי שעות העבודה מזכה ביחידות של שעת סיומה, ופעילות שמסתיימת בתוכן אינה מזכה — ואפשר לקרוא אותו כהפחתה של היחידות שכנגד השעות שבתוך שעות העבודה. מורה שליווה טיול עד 20:00 כששעות העבודה שלו נגמרות ב־16:00 מקבל 3.5 יחידות בקריאה הראשונה, ופחות מזה בשנייה, בשיעור שהטקסט אינו קובע. הסכם ההשלמה מיום 29.2.2012 הוסיף לסעיף 40 טבלה משלו "בהתאם לאמור בסעיף-קטן (א)", אך רק משנחתם.
"""
