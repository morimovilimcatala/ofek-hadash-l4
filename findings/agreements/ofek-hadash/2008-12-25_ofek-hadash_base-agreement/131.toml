body = "מקרה קצה: יועץ חינוכי ברישיון קבוע, שכרו המשולב 11,387.80 ₪, מועסק ב־10 שעות ייעוץ ו־3 שעות הוראה פרונטליות, ו־36 שעות בשבוע, בשנת תשפ\"ז.\n\nסעיף 131 נותן גמול ייעוץ ליועץ \"המועסק בלפחות 7 שעות ייעוץ\". השיעור המרבי ברישיון קבוע הוא 18% מ־1.9.2023 (הסכם השכר מ־19.10.2022, סעיף 7.1). לפי סעיף 131(ג) מספר שעות הייעוץ הוא 36 כפול 10 חלקי 13, כ־27.7, יותר מ־16, ולכן נחשב 16, והשיעור הוא המרבי: 18% מ־11,387.80 ₪, 2,049.80 ₪ לחודש. תשפ\"ו/1 (סעיף 14.3) חוזר על התנאי של 7 שעות ייעוץ בלבד.\n\nהסימולטור של משרד החינוך משלם את הגמול רק כשמוזנות 4 שעות הוראה לפחות: עם 4 שעות 2,049.80 ₪, עם 3 שעות כלום. 4 השעות באות מסעיף 128(ב), שמחייב יועץ ללמד לפחות 4 שעות פרונטליות (F-ofek-hadash-base-128-a). זו חובה במבנה שבוע העבודה; סעיף 131 אינו עושה אותה תנאי לגמול. המעסיק יכול לטעון שיועץ שאינו מלמד את המינימום אינו עובד במבנה שההסכם קובע."
reading = "התנאי לגמול הייעוץ הוא 7 שעות ייעוץ לפחות, ותו לא. חובת ההוראה של סעיף 128(ב) אינה תנאי לגמול, וה־L4 משלם אותו גם ליועץ שמלמד פחות מ־4 שעות."
