§7(ו) מונה חמש דרכים להיות "מורה מוסמך", ושלוש מהן אינן תעודת הסמכה: רישיון הוראה קבוע לחינוך העל־יסודי (3), רישיון לעסוק בהוראה (4) ותעודת הוראה אוניברסיטאית (5). §7(ח) מגדיר "מורה בלתי מוסמך" כמורה "שאין ברשותו תעודת הסמכה להוראה" — לא כמי שאינו מורה מוסמך.

