[[finding]]
id = "F-ofek-hadash-base-7-c"
kind = "contradiction"
stage = "verification"
severity = "medium"
severity_why = "זכות תלויה בזה — שבוע עבודה מקוצר באותו שכר — וסעיף 4(א) לחוק שוויון ההזדמנויות בעבודה חל ישירות על המדינה כמעסיקה, ולכן בית משפט צפוי לפסוק לפי החוק. בינוני ולא חמור: הסטטוס קוו כבר לפי החוק — חוזר לבעלויות תשע\"ה/1 (11.3.2015) מכיר, בעקבות פסק הדין של בית הדין הארצי לעבודה מיום 27.2.2013, בזכותו של מורה אב שבת זוגו עובדת ואינה מקבלת את ההטבה לקצר את שבוע עבודתו בעין; מה שנשאר במחלוקת הוא תנאיו של החוזר (ראו F-2014-15_tashae_01-b)."
keys = ["art_7__para_c"]
quote = "מורה אם- מורה שהיקף משרתה אינו פחות מ – 79% משרה וכן היא אם לילד עד גיל 14, בתחילת שנת הלימודים וכן מורה שמתקיימים בו התנאים האמורים, אשר היה נשוי ואשר ילדיו נמסרו לחזקתו על-פי חוזה גירושין מאושר ותקף או על-פי פסק-דין תקף, או שנמצא בהליכי גירושין ומגדל לבד את ילדיו על-פי אישור של גורמי הרווחה המוסמכים או אלמן המגדל לבד את ילדיו."
title = "\"מורה אם\": ההסכם מונה מן האבות רק גרוש, אלמן או מי שבהליכי גירושין; סעיף 4(א) לחוק שוויון ההזדמנויות נותן את קיצור שבוע העבודה גם לאב שבת זוגו עובדת ואינה מקצרת את יום עבודתה"
body = """
§7(ג) מגדיר "מורה אם" כמורה במשרה של 79% לפחות שהיא אם לילד עד גיל 14, ומן האבות מונה רק מי "אשר היה נשוי ואשר ילדיו נמסרו לחזקתו" במסמך גירושין, מי ש"נמצא בהליכי גירושין ומגדל לבד את ילדיו" באישור הרווחה, ו"אלמן המגדל לבד את ילדיו". למורה אם נותן §24 שבוע עבודה מקוצר — חצי שעה ביום פחות משעות השהייה — "מבלי שיופחתו שכרה או שיעור משרתה".

זהו "יום עבודה מקוצר בשל היות העובדת אם לילד", זכות בקשר להורות לפי סעיף 4(ב)(2) לחוק שוויון ההזדמנויות בעבודה. סעיף 4(א) לחוק נותן זכות כזו, הנהוגה במקום העבודה לעובדת, גם לעובד שבת זוגו "היא עובדת או עובדת עצמאית" ולא נעדרה מעבודתה מכוח זכאותה שלה (4(א)(1)), או שהילד "נמצא בהחזקתו הבלעדית" (4(א)(2)) — באותם תנאים שהיא נדרשת להם (79%, ילד עד גיל 14), ובלי תנאי אחר. מורה נשוי במשרה מלאה, עם ילד בן 5, שאשתו עובדת ואינה מקצרת את יום עבודתה, אינו "מורה אם" לפי ההסכם, וזכאי לקיצור לפי החוק.

ההסכם אינו מכיר ב־4(א)(1) כלל; את 4(א)(2) הוא מכסה ברובו (גרוש עם חזקה, אלמן), ואף נותן יותר ממנו למי שבהליכי גירושין. סעיף 17 לחוק מחיל אותו על המדינה כמעסיק.
"""
reading = "החוק גובר (`the ruling under the statutes' floor`, לפי סעיף 21 לחוק הסכמים קיבוציים): אב שסעיף 4(א) מזכה הוא מורה אם לעניין קיצור שבוע העבודה (`a father the Equal Opportunities Law makes a mother teacher`); הגדרת 7(ג) נשארת כפי שנחתמה."
l4 = "l4/agreements/ofek-hadash/2008-12-25_ofek-hadash_base-agreement/base-agreement-7.l4"
evidence = "`7(ג) leaves out a father section 4(א)(1) reaches`"
