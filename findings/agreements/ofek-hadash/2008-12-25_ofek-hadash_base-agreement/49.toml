body = """
§49(א) קובע שלמורה בבית ספר יסודי בבסיס משרה של 24 ש"ש, מקדם ההמרה Y "יהיה גדול ב־12.5% מהתוספת הקבועה בסעיף 44". "גדול ב־12.5%" מגודל שהוא עצמו אחוז אפשר לקרוא כהגדלה יחסית (27 נעשה 30.375) או כתוספת של 12.5 נקודות (27 נעשה 39.5).

הדוגמה ש־§49(ג) עצמו מביא מכריעה: היא מחשבת "(100+27 +12.5)%", כלומר 39.5, ומגיעה ל־25.18; בקריאה היחסית היה יוצא 21.86. החוזרים שחוזרים על המשפט (F-2019-20_tashaf_01-l והחוזרים שאחריו) אינם מביאים דוגמה משלהם, וחוזר אינו גובר על ההסכם שהוא מיישם; לכן הקידוד שלהם קורא בהם את ההגדלה כ־12.5 נקודות, כמו הדוגמה של ההסכם, וגם הם רשומים כחריגים למוסכמה amounts.increase.
"""
