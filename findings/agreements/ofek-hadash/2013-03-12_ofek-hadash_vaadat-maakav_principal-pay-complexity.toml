body = """
סעיף 1(א) קובע שכשרמת המורכבות משתנה, "עליה או ירידה", כתוצאה משינוי במדד הטיפוח בלבד, "לא יחול שינוי בשכרו של מנהל בית הספר".

לגבי ירידה, סעיפים־קטנים (ג) ו־(ה) חלים רק "שלא בתנאים המפורטים בסעיף-קטן (א) או בסעיף-קטן (ב)". לגבי עלייה, לעומת זאת, (ו) חל "שלא בתנאים המפורטים בסעיף-קטן (ב)", ו־(ז) קובע שבעלייה "שלא בתנאים המפורטים בסעיף-קטן (ב) או בסעיף-קטן (ו)" יחולו הוראות ההסכם הכולל ללא שינוי. סעיף־קטן (א) אינו מוחרג.

