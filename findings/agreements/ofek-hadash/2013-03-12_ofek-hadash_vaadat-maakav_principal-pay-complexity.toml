אפשר לקרוא את המשפט כך שאף אחד משלושת הפרמטרים לא השתנה ב־15% או יותר, ואפשר לקרוא אותו כך שבאחד מהם (לפחות) לא חל שינוי כזה. בבית ספר שמספר התלמידים בו השתנה ב־20% ומספר הכיתות ב־5% שתי הקריאות נפרדות: לפי הראשונה סעיף־קטן (ב) אינו חל ושכר המנהל יורד (בכפוף ל־(ג)); לפי השנייה הוא חל, והשכר אינו משתנה.
"""
