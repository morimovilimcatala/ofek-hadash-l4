[[finding]]
id = "F-2000-10_tnai-sherut_tashsa_01_sichot-telefon-a"
kind = "contradiction"
stage = "writing"
keys = ["art_4/t1"]
quote = "12.15 … 50 שיחות · 29.13 … 125 שיחות · 36.45 … 150 שיחות · 42.53 … 175 שיחות · 48.60 … 200 שיחות"
title = "The 125-call row of the conversion table departs from the rate the other four rows share"
body = """
¶4 converts monthly call quotas into money amounts ("יומרו … לסכומים כספיים") by a table of five rows. Four of them convert at one rate to the agora: 12.15 for 50 calls is 0.243 a call, and 150 calls give 36.45, 175 give 42.525 (printed 42.53) and 200 give 48.60.

The row for 125 calls prints 29.13, where the same rate gives 30.375 (30.38) — about 1.25 a month less, an effective 0.233 a call. 125 calls is the deputy principal's quota (¶2), so the one post whose amount departs from the shared conversion is a deputy principal's. The text gives no reason for a different rate, and nothing in it says whether the table is a uniform conversion with one row misprinted or a set of amounts fixed one by one. The page prints 29.13 (checked against the source PDF), so this is not a transcription error.
"""
reading = "The printed amount governs: a deputy principal's 125-call quota is converted to 29.13. The table is the only conversion the circular states, and nothing in the text licenses replacing a printed amount by a rate inferred from the other rows."
l4 = "l4/circulars-tnai-sherut/2000-10_tnai-sherut_tashsa_01_sichot-telefon.l4"
evidence = "`the 125-call row alone departs from the rate the other rows share`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2000-10_tnai-sherut_tashsa_01_sichot-telefon-b"
kind = "gap"
stage = "writing"
keys = ["preamble/p5", "art_1", "art_2", "art_3", "art_4"]
quote = "בנספח להסכם השכר מפברואר 1970 הופיע: … חוזר סגן בכיר לחשב הכללי גורס כי: \"… התשלום המשולם כיום לעובדי מדינה בעלי טלפוניים פרטיים לא יתבסס יותר על מכסת שיחות טלפון והם יומרו החל מ-1 באפריל לסכומים כספיים"
title = "The circular quotes two instruments and never says the conversion applies to teaching employees"
body = """
Every numbered paragraph of the circular is a quotation. ¶¶1–3 are quoted from the annex to the February 1970 wage agreement: the monthly call quotas of a principal (150), a deputy principal (125) and a teacher (50). ¶4 is quoted from the senior deputy Accountant-General's circular: from 1.4.2000 the payment to "state employees who have private telephones" no longer rests on a quota of calls and is converted to money amounts by the table. The circular ends on the table and adds no sentence of its own.

It therefore never states that the teaching employees' quotas are converted, from when, or on what condition. The quoted conversion names state employees with private telephones; the teachers' quotas as quoted carry no such condition, so the text does not decide whether a teaching employee without a private telephone is paid anything after 1.4.2000, nor whether teaching employees who are not state employees are covered.
"""
reading = "The circular is read as applying the quoted conversion to teaching employees: from 1.4.2000 a teaching employee with a private telephone is paid, each month, the amount the table sets beside the quota of their post (150 → 36.45, 125 → 29.13, 50 → 12.15), and the condition of a private telephone carries over from the converted rule; without one, the circular gives no amount."
l4 = "l4/circulars-tnai-sherut/2000-10_tnai-sherut_tashsa_01_sichot-telefon.l4"
evidence = "`the circular quotes and never applies the conversion to teaching employees`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2000-10_tnai-sherut_tashsa_01_sichot-telefon-c"
kind = "gap"
stage = "writing"
keys = ["art_1", "art_2", "art_3", "art_4/t1"]
quote = "ישופה ב- 50 שיחות טלפון לחודש למשרה מלאה אחת"
title = "The quotas are set for one full position, and nothing says what another share of a position gets"
body = """
Each quota of ¶¶1–3 is "for one full position" (למשרה מלאה אחת). The circular does not say what an employee holding less than a full position, or more than one, is entitled to: whether the quota is pro-rated, paid in full, or not paid.

The conversion table makes the gap concrete. It converts only the quotas it prints (50, 125, 150, 175, 200 calls); a teacher on half a position, if the quota is pro-rated, has 25 calls, which no row converts, and a principal on 1.2 positions has a quota the words "one full position" do not size.
"""
reading = "The amount for one full position is pro-rated to the share of a position held, and never exceeds the amount for one full position — the words \"for one full position\" read as the measure of the quota and as its ceiling."
l4 = "l4/circulars-tnai-sherut/2000-10_tnai-sherut_tashsa_01_sichot-telefon.l4"
evidence = "`the table has no row for a half-position teacher's quota`"
depends_on = ["F-2000-10_tnai-sherut_tashsa_01_sichot-telefon-b"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"
