Each yearly update of the childcare supplement names, in its reference line, the update it continues: 2012-1-9 cites 2011-1-48, 2013-1-9 cites 2012-1-9, 2014-1-3 cites 2013-1-9, and 2016-1-7 cites 2015-1-8.

