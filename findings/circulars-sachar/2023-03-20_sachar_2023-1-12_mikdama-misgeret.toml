title = "האם חופשה ללא תשלום בתקופת האכשרה קוטעת את הרצף, או שמדלגים עליה?"
body = """
כדי להיות "עובד" לעניין המקדמה, §1(א)(2) דורש העסקה בשירות המדינה ביום 1.6.2022 וברצף עד ליום 28.2.2023. "לצורך חישוב רצף העסקה", תקופות של חופשה ללא תשלום "לא יובאו בחשבון" (א), ואילו שירות מילואים, תקופת לידה והורות וחופשת מחלה "יובאו בחשבון" (ב), והיעדרות באישור המעסיק ובתשלום "אינה קוטעת את רצף ההעסקה" (§1א.2ב, הפסקה "מובהר כי היעדרות באישור המעסיק ובתשלום…").

את "לא יובאו בחשבון" ניתן לקרוא בשתי דרכים במבחן של רצף. או שמדלגים על התקופה — היא אינה מוסיפה דבר, אך הרצף נמשך מעבר לה — או שהיא אינה נספרת כהעסקה, ולכן ההעסקה לא הייתה רצופה. ההבדל הוא הכול או לא כלום: עובד עם חודש אחד של חופשה ללא תשלום בדצמבר 2022 הוא "עובד" לפי הקריאה הראשונה (ומפסיד רק את אותו חודש ב־B), ואינו מקבל מקדמה כלל לפי השנייה. אין בטקסט "ולא תקטע את הרצף" אחרי (א), והאמירה המפורשת של הפסקה "מובהר כי היעדרות…" שהיעדרות בתשלום אינה קוטעת אותו מצביעה לשני הכיוונים.
"""
reading = "חופשה ללא תשלום בתקופת האכשרה קוטעת את הרצף: (א) הוא הצד שכנגד של (ב), הסופר את תקופותיו כהעסקה, והאמירה של §1א.2ב (הפסקה \"מובהר כי היעדרות באישור המעסיק…\") על היעדרות בתשלום אומרת משהו רק אם היעדרות ללא תשלום אכן קוטעת את הרצף."
