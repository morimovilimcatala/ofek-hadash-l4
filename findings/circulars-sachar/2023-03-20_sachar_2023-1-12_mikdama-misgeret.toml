[[finding]]
id = "F-2023-03-20_sachar_2023-1-12_mikdama-misgeret-a"
kind = "ambiguity"
stage = "examples"
keys = ["hc_1__para_1__subpara_b__cls_2__pnt_4/p5", "hc_1__para_1__subpara_b/p13"]
quote = "ובסך הכול יובאו בחשבון 21.5 חודשים העסקה לצורך חישוב B ולכן B = 21.5/30 = 0.716"
title = "The illustration cuts B to 0.716; used as printed it changes the advance"
body = """
§1(ב) defines B as the months of employment in the calculation period divided by 30, and rounds only M, the final amount, to the nearest shekel. The illustration in §1(ב)(2) computes B = 21.5/30 and prints it as 0.716 — 21.5/30 is 0.71666…, so 0.716 is the quotient cut at three decimals, not even rounded (0.717).

Whether B enters M as printed or exact matters: with C = 1, 6,000 × 0.716 = 4,296 NIS, while 6,000 × 21.5/30 = 4,300 NIS. The text does not say that B is cut or rounded before it is multiplied, and the illustration, the only place B is given as a decimal, does it.
"""
reading = "B is used exact (a fraction of 30) and only M is rounded, as §1(ב) says; the 0.716 is read as a display of the quotient. For the illustration's figures the advance is 4,300 NIS."
l4 = "l4/circulars-sachar/2023-03-20_sachar_2023-1-12_mikdama-misgeret.l4"
evidence = "`B as printed and B exact give different advances`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-03-20_sachar_2023-1-12_mikdama-misgeret-b"
kind = "contradiction"
stage = "examples"
keys = ["hc_1__para_1__subpara_b/p6", "hc_1__para_1__subpara_b__cls_2__pnt_4/p3"]
quote = "בגין התקופה שמיום 15.1.2021 ועד יום 30.6.21 - 5.5 חודשים יובאו בחשבון מתוך 5.5 החודשים שבתקופה"
title = "The illustration counts 15-31 January 2021 as half a month; the partial-month rule does not"
body = """
§1(ב) counts a month in which the employee was employed for part of the month proportionally: "the employee's days of employment in that month are divided by the number of work days in that month". The illustration in §1(ב)(2) has an employee who started on 15.1.2021 and counts 15.1.2021-30.6.2021 as 5.5 months — January 2021 as exactly half a month.

By the rule, January 2021 (which began on a Friday) has 21 work days in a five-day (Sunday-Thursday) workplace, of which the employee was employed on 11, a share of 11/21; in a six-day workplace it has 26, of which 14, a share of 14/26. Neither is a half. With the rest of the illustration unchanged, the advance is 4,305 NIS (five-day week) or 4,308 NIS (six-day week) by the rule, against 4,300 NIS by the illustration's half month (and 4,296 NIS with its printed B; see finding a). The worked example and the rule it illustrates give different advances for the same employee.
"""
reading = "The rule governs: a part month counts as the days employed divided by the work days of the month; the illustration's 5.5 is read as a rounded figure for the purpose of illustration (\"להמחשה\")."
l4 = "l4/circulars-sachar/2023-03-20_sachar_2023-1-12_mikdama-misgeret.l4"
evidence = "`the illustration's half month is not ¶6's share`"
depends_on = ["F-2023-03-20_sachar_2023-1-12_mikdama-misgeret-a"]
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2023-03-20_sachar_2023-1-12_mikdama-misgeret-c"
kind = "ambiguity"
stage = "writing"
keys = ["hc_1__para_1__subpara_a__cls_2", "hc_1__para_1__subpara_a__cls_2__pnt_a", "hc_1__para_1__subpara_a__cls_2__pnt_b/p2"]
quote = "לצורך חישוב רצף העסקה לעניין סעיף קטן (2) זה: (א) לא יובאו בחשבון תקופות בהן שהה העובד, מכל סיבה שהיא, בחופשה ללא תשלום"
title = "Does unpaid leave in the qualifying period break the continuity, or is it skipped?"
body = """
To be an "employee" for the advance, §1(א)(2) requires employment in the State service on 1.6.2022 and continuously until 28.2.2023. "For computing the continuity of employment", periods of unpaid leave "shall not be taken into account" (א), while reserve duty, birth and parenthood and sick leave "shall be taken into account" (ב), and a paid, approved absence "does not break the continuity" (¶2).

"Not taken into account" reads two ways for a continuity test. Either the period is skipped — it adds nothing, but the continuity runs across it — or it is not counted as employment, so the employment was not continuous. The difference is all or nothing: an employee with one month of unpaid leave in December 2022 is an "employee" on the first reading (and loses only that month in B) and is paid no advance at all on the second. The text has no "and shall not break the continuity" after (א), and ¶2's express statement that a PAID absence does not break it points both ways.
"""
reading = "Unpaid leave in the qualifying period breaks the continuity: (א) is the counterpart of (ב), which counts its periods as employment, and ¶2's statement about paid absence says something only if an unpaid one does break the continuity."
l4 = "l4/circulars-sachar/2023-03-20_sachar_2023-1-12_mikdama-misgeret.l4"
evidence = "`unpaid leave in the qualifying period reads two ways`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
