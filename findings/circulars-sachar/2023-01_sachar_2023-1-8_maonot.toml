quote = "תעודכן החל מיום 1.1.2023, בהתאם לשיעור השינוי במדד (5.26%) כדלקמן: … בעד ילד שני - 230 ש\"ח לחודש"
title = "The second-child amount is the 5.26% update rounded down, not to the nearest shekel"
body = """
The circular updates the childcare supplement from 1.1.2023 "in accordance with the rate of change in the index (5.26%)" and prints the result: 341 NIS for an only or first child and 230 NIS for a second child. It names no rounding.

The amounts in force before the update were 324 and 219 (circular 2022-1-1). 324 moved by 5.26% is 341.04, which any rounding makes 341. But 219 moved by 5.26% is 230.52 — between 230.51 and 230.53 for any change the two-decimal figure allows — whose nearest shekel is 231. The printed 230 is that figure rounded DOWN. The neighbouring updates round to the nearest shekel where the two roundings differ (2020: 316.89 to 317; 2024: 236.81 to 237).

So the circular's stated rule (the index change, applied to the amount in force) and its printed amount give a second-child supplement one shekel apart, and the text does not say which rounding the update uses. A circular never outranks the agreement it implements: if clause 11 of the framework agreement of 12.1.2011 calls for the nearest shekel, the printed 230 underpays by 1 NIS a month (pro rata for a part-time employee) from January 2023, and the 2024 update, built on 230, carries the difference forward.
"""
reading = "The printed amount (230 NIS) is what the circular sets and is encoded as printed; the update's rounding is left to clause 11 of the framework agreement, which this circular does not restate."
l4 = "l4/circulars-sachar/2023-01_sachar_2023-1-8_maonot.l4"
evidence = "`the second-child amount rounds the update down`"
