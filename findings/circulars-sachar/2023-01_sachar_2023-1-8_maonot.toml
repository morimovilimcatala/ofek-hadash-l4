title = "סכום הילד השני הוא עדכון 5.26% מעוגל כלפי מטה, לא לשקל הקרוב"
body = """
החוזר מעדכן את תוספת המעונות החל מ־1.1.2023 "בהתאם לשיעור השינוי במדד (5.26%)" ומדפיס את התוצאה: 341 ש"ח לילד יחיד או ראשון ו־230 ש"ח לילד שני. הוא אינו קובע עיגול.

הסכומים שהיו בתוקף לפני העדכון היו 324 ו־219 (חוזר 2022-1-1). 324 בתוספת 5.26% הם 341.04, שכל עיגול הופך ל־341. אבל 219 בתוספת 5.26% הם 230.52 — בין 230.51 ל־230.53 לכל שינוי שהשיעור בשתי ספרות עשרוניות מתיר — והשקל הקרוב להם הוא 231. ה־230 המודפס הוא סכום זה מעוגל כלפי מטה. העדכונים הסמוכים מעגלים לשקל הקרוב מקום ששני העיגולים נבדלים (2020: 316.89 ל־317; 2024: 236.81 ל־237).

כך שהכלל שהחוזר מצהיר עליו (שינוי המדד, המוחל על הסכום שבתוקף) והסכום שהוא מדפיס נותנים תוספת לילד שני הנבדלת בשקל אחד, והטקסט אינו אומר באיזה עיגול העדכון משתמש. חוזר לעולם אינו גובר על ההסכם שהוא מבצע: אם סעיף 11 להסכם המסגרת מיום 12.1.2011 מחייב עיגול לשקל הקרוב, ה־230 המודפס מחסיר 1 ש"ח לחודש (באופן יחסי לעובדת במשרה חלקית) החל מינואר 2023, ועדכון 2024, הבנוי על 230, ממשיך לגרור את ההפרש.
"""
