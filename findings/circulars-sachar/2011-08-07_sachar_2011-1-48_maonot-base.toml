title = "The supplement is set for a full position and pro-rated for part time; a position above full is not decided"
body = """
Section 3ד sets the supplement's amount for an employee in a full position and has it computed by the position share for one in a part-time position. It says nothing of an employee whose position is above a full one — common among teachers, whose positions pass 100% — and the two ways of extending it differ: the full-position amount (300 shekels for one child), or the same pro rata computation carried above 1 (360 shekels at 120%).
"""
reading = "A position above full is paid the full-position amount: the circular pro-rates only downwards, for \"part-time\" positions, and states the amount as the one for a full position."
