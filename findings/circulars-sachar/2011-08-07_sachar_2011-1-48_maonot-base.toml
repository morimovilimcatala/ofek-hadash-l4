keys = ["hc_1__para_3__subpara_3", "hc_1__para_3__subpara_3__cls_8/p2", "hc_1__para_3__subpara_3__cls_10", "hc_1__para_3__subpara_3__cls_10__pnt_2/p2", "hc_1__para_3__subpara_3__cls_11"]
quote = "3. תשלום תוספת מעונות · 3 החלפה/ביטול הסדר מעונות אחר · האמור בסעיף 3 א' הנ\"ל לא יחול במקרה בו קיים הסדר כללי"
title = "Two sections are numbered 3, so \"section 3 א'\" may lift the supplement or only the cancelling of the other arrangement"
body = """
The circular has two sections numbered 3: "3. paying the childcare supplement" (items א–ח) and "3. replacing or cancelling another childcare arrangement" (items א–ג). The second section's item ב says that "the stated in section 3 א' above shall not apply" where a general arrangement pays another childcare benefit of more than 300 shekels a month for one or a first child and more than 500 for two or more, and that "in such a case the general arrangement continues to apply".

"Section 3 א'" names either item א: of the payment section (the supplement is paid, as a partial participation in the cost), or of the replacing section (the supplement replaces and cancels every other arrangement for a child under 5). Read the first way, an employee under such a general arrangement receives the general arrangement instead of the supplement. Read the second way, only the cancelling is lifted: the general arrangement survives, and nothing in the text withholds the supplement, so the employee receives both — for a mother of two in a full position, 500 shekels a month more.
"""
reading = "Where the general arrangement is kept, it applies instead of the supplement: the outcome item ב describes (\"the general arrangement continues to apply, by its own provisions and eligibility rules\") and item ג's \"for a child up to 5 the arrangement in this circular applies subject to section 3 ב'\"."
l4 = "l4/circulars-sachar/2011-08-07_sachar_2011-1-48_maonot-base.l4"
evidence = "`two sections are numbered 3 and the readings of 3 א' differ`"
