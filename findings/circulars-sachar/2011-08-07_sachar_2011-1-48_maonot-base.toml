quote = "מדורגות באחד הדירוגים המיוצגים על ידי הסתדרות העובדים הכללית החדשה ומשכורתן מחושבת לפי הסכמים קיבוציים."
title = "תוספת המעונות: החוזר דורש שכר \"לפי הסכמים קיבוציים\"; ההסכם מיום 12.1.2011 מחיל את סעיף 11 גם על משפטן ששכרו צמוד לשכר שופט"
body = """
סעיף 2א של החוזר מחיל את התוספת על עובדות שמתקיימים בהן כל התנאים "במצטבר", ובהם (2): "מדורגות באחד הדירוגים המיוצגים על ידי הסתדרות העובדים הכללית החדשה ומשכורתן מחושבת לפי הסכמים קיבוציים". סעיף 3 להסכם המסגרת מיום 12.1.2011 קובע ש"הוראות סעיף 11 (תוספת מעונות) ... יחולו גם על מי ששכרו צמוד לשכר נושא משרה שיפוטית והמדורג בדירוג המשפטנים או בדירוג הסניגורים הציבוריים" — עובדים שנספח א' מוציא מיתר ההסכם, משום ששכרם אינו מחושב לפי ההסכמים הקיבוציים של הדירוג אלא צמוד לשכר שופט.

דוגמה: משפטנית בשירות המדינה ששכרה צמוד לשכר נושא משרה שיפוטית, במשרה מלאה, עם ילד בן 3. לפי ההסכם: 300 ₪ לחודש (בסכום של 2011). לפי תנאי 2א(2) של החוזר: 0, כי משכורתה אינה מחושבת לפי הסכמים קיבוציים.

(החוזר גם אינו חוזר על החרגת חמשת הדירוגים שבסעיף 3 סיפא — העובדים הסוציאליים, שירות החוץ, הפרקליטים, המחקר האזרחי והרופאים הווטרינרים. אם הם "מיוצגים על ידי ההסתדרות", לשון החוזר מכסה אותם וההסכם לא; אבל זו עובדה שאין לה מסמך בקורפוס, וההסכם עצמו משאיר את "טענות הצדדים בנוגע לדירוגים אלה" פתוחות. לכן היא אינה חלק מהממצא.)
"""
reading = "שכר הצמוד לשכר נושא משרה שיפוטית אינו \"מחושב לפי הסכמים קיבוציים\", ולכן תנאי 2א(2) אינו מתקיים בו (`section 2א(2) of wages circular 2011-1-48 holds for`). חוזר אינו גובר על ההסכם שהוא מבצע: משפטן או סנגור כזה זכאי לפי סעיף 3 להסכם."
