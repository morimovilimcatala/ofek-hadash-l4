quote = "בגובה 1,000 ₪ בלבד · מובהר כי הסכום האמור הוא לעובד הוראה שהועסק במשרה מלאה … סכום המענק יחושב באופן יחסי לחלקיות המשרה של כל עובד (ממוצע חודשי מייצג) ביחס למשרה מלאה"
title = "A teacher whose average position is above full: 1,000 shekels \"only\", or proportionally more?"
body = """
The grant is "1,000 shekels only" (said twice), stated as the amount for a full position, and computed "in proportion to each employee's position (a representative monthly average) relative to a full position".

A teacher's average position can exceed a full one. Read as a proportion, a teacher averaging 120% receives 1,200 shekels; read with "only" and "the amount for a full position", the grant is capped at 1,000. The circular speaks only of positions up to full.
"""
reading = "The grant is capped at 1,000 shekels: the proportion is written for part-time positions (section 2's \"relative to a full position\"), and the amount is twice called 1,000 \"only\"."
l4 = "l4/circulars-sachar/2016-02-22_sachar_2016-1-13_maanak-hora.l4"
