keys = ["hc_1__para_2", "hc_1__para_2/p2"]
quote = "לגבי עובד שהועסק במהלך התקופה שמיום 1.12.2014 ועד יום 30.11.2015 במשרה חלקית ואשר היה מועסק רק בחלק מהתקופה הנ\"ל, אך עבד ברציפות בתקופה הקובעת, יבוצע תחשיב חלקיות המשרה הממוצעת לפי התקופה בה הועסק בפועל"
title = "A full-time teacher employed for only part of 1.12.2014–30.11.2015: averaged over the months employed or over the year?"
body = """
Section 2 computes the grant in proportion to the teacher's position — "a representative monthly average" — relative to a full position over 1.12.2014–30.11.2015. Its second paragraph says that for a teacher employed in that period "in a part-time position" and only for part of it, but continuously in the qualifying period, the average is computed over the period actually employed.

A full-time teacher employed for only part of the period — one who began on 1.9.2015 qualifies under section 1 — is not in the second paragraph. Averaged over the months employed, that teacher's grant is 1,000 shekels; averaged over the twelve months, as section 2's first paragraph can be read, it is 250 — less than a part-time teacher at 99% who joined on the same day and whom the second paragraph gives 990.
"""
reading = "Every teacher employed for part of the period is averaged over the months actually employed, full-time or part-time."
l4 = "l4/circulars-sachar/2016-02-22_sachar_2016-1-13_maanak-hora.l4"
evidence = "`the two readings of section 2 differ for a full-timer employed part of the period`"
depends_on = []
