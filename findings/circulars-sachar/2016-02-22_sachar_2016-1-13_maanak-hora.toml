keys = ["hc_1__para_11", "hc_1__para_13", "hc_1__para_13__subpara_1__cls_1"]
quote = "חופשת מחלה כאמור בפסקה 1.25.3 לתקנון שירות עובדי ההוראה, בתקופה הקובעת, אינה קוטעת את רצף העסקה … תשלום המענק לעובד הוראה, בחופשת מחלה ללא משכורת, יבוצע במשכורת החודש הראשונה שתשולם לו עם חזרתו לעבודה · חופשה ללא תשלום והיעדרות מעבודה שדינה כדין חופשה ללא תשלום, לרבות חופשת מחלה ללא תשלום"
title = "Sick leave without salary is both a non-breaking absence (section 11) and unpaid leave with its own test (section 13)"
body = """
Section 11 says sick leave as in paragraph 1.25.3 of the teachers' service regulations does not break the continuity of employment and the teacher is entitled to the grant; for a teacher "on sick leave without salary" it is paid in the first salary on return. Section 13 governs unpaid leave and absences treated as unpaid leave, "including sick leave without pay": such a teacher qualifies only with four full salaried months and a day in a row between 1.9.2015 and 30.6.2016, and is paid in the June 2016 salary.

For a teacher salaried in September 2015 and then on sick leave without salary to the end of June 2016, section 11 gives the grant and section 13 refuses it; where both give it, they give different payment dates.
"""
reading = "Section 13 governs sick leave without salary: it is the provision made for absences without salary and names this one expressly. Section 11 governs sick leave with salary."
l4 = "l4/circulars-sachar/2016-02-22_sachar_2016-1-13_maanak-hora.l4"
evidence = "`sections 11 and 13 disagree on unpaid sick leave`"
