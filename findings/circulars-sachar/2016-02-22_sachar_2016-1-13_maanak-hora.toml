review = "unreviewed"

[[finding]]
id = "F-2016-02-22_sachar_2016-1-13_maanak-hora-c"
kind = "contradiction"
stage = "writing"
keys = ["hc_1__para_13__subpara_1__cls_3", "hc_1__para_13__subpara_1__cls_4"]
quote = "תילקח בחשבון לצורך חישוב חלקיות משרתו, התקופה שמיום 1.12.2015 עד יום 30.11.2016 · המענק ישולם לעובד הוראה כאמור במשכורת חודש יוני 2016 (המשתלמת בחודש יולי 2016) ולא יאוחר ממשכורת חודש יולי 2016"
title = "On the unpaid-leave route the grant is measured over a period ending 30.11.2016 and due by the July 2016 salary"
body = """
For a teacher on unpaid leave in the qualifying period who was due no salary at all in 1.12.2014–30.11.2015, section 13א(3) computes the position over 1.12.2015–30.11.2016. Section 13א(4) has the grant paid in the June 2016 salary and no later than the July 2016 salary, which is paid in August 2016.

The period the grant is computed on ends more than three months after the last date on which it may be paid, so the grant cannot be computed as 13א(3) says and paid when 13א(4) says.

(13א(4) prints the July 2016 salary as "paid in August 2017"; the July salary is paid in August 2016, and the finding does not rest on that slip.)
"""
reading = "The payment deadline governs; the position is averaged over the months of 1.12.2015–30.11.2016 that have passed when the grant is paid. The L4 takes the average as an input."
l4 = "l4/circulars-sachar/2016-02-22_sachar_2016-1-13_maanak-hora.l4"
evidence = "`13א(3) measures the grant over a period that ends after 13א(4) pays it`"
depends_on = []
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
