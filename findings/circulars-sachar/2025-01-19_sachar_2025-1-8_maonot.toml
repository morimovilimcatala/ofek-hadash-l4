quote = "סכום תוספת מעונות (זכויות הוריות) עד גיל 5 תעודכן החל מיום 1.1.2024, בהתאם לשיעור השינוי במדד (3.24%) כדלקמן: … 362 ש\"ח לחודש … 245 ש\"ח לחודש"
title = "The 2025 update takes effect on 1.1.2024, the date the 2024 update already set other amounts"
body = """
This circular, dated 19.1.2025, updates the childcare supplement "from 1.1.2024" by an index change of 3.24%, to 362 shekels for an only or first child and 245 for a second.

Circular 2024-1-7 of 31.1.2024 had already updated the same supplement from the same day, 1.1.2024, by 2.96%, to 351 and 237. For any month of 2024 the two circulars give two different amounts. This circular's own figures place it after that update, not on it: 351 moved by its 3.24% is 362.37 and 237 is 244.68, which are its 362 and 245 to the nearest shekel. Its amounts are the update that follows the one of 1.1.2024, while its date says they replace it.

The source document prints 1.1.2024 (the transcription agrees with it). Circular 2025-1-12 of 5.2.2025 later reprinted the same update, word for word and with the same amounts, from 1.1.2025 under the subject "תיקון טעות סופר" (a clerical-error correction), without naming this circular or the words it corrects.
"""
reading = "This file encodes the date as printed (1.1.2024), because it encodes this circular's own words. The amounts are read as running from 1.1.2025, the date the later circular 2025-1-12 prints in its place and the date under which this circular's amounts follow from the 2024 amounts by its own index change; that circular's encoding carries the corrected date."
