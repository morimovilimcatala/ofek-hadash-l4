title = "תעריף נסיעה בודדת אחד ליום, או הלוך ושוב?"
body = """
§2א משלם לעובד קיים הנוסע בנסיעות בינעירוניות "לפי תעריף נסיעה בודדת (בתעריפי הרפורמה) כפול ימי עבודה בפועל", ו־§§2ה-2ו חוזרים על הנוסחה ("תעריפי נסיעה בודדת כפול ימי עבודה בפועל"). כלשונו, זהו תעריף נסיעה בודדת אחד לכל יום עבודה, אף שיום עבודה מחייב נסיעה הלוך ונסיעה חזור.

מכתב המנכ"ל מיום 10.7.2016, שהחוזר מפנה אליו כמקורו ואומר שהוא מבצע אותו, משלם נסיעות בינעירוניות "לפי תעריפי נסיעות בודדות (הלוך ושוב)" — נסיעות בודדות, הלוך וחזור. לפי לשונו שלו החוזר משלם מחצית ממה שסוכם במכתב; בקריאה דרך המכתב הוא משלם שני תעריפים ליום. לנוסע שעובד 20 ימים ההפרש הוא עשרים תעריפים בחודש.
"""
reading = "שני תעריפי נסיעה בודדת (הלוך ושוב) לכל יום עבודה בפועל, כפי שקובע מכתב המנכ\"ל שהחוזר מבצע; \"נסיעה בודדת\" נקרא כמציין את סוג התעריף, לא את מספר הנסיעות."
convention = "precedence.agreement"
