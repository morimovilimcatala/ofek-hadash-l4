quote = "עובדים קיימים (עובדים שנקלטו לעבודה אצל מעסיקם הנוכחי לפני ה- 1/1/2016) שקיבלו \"חודשי חופשי\" עירוני (בסמל 614 בשירות המדינה) עד 31/12/2015"
title = "עובד קיים שלא קיבל קצובת נסיעה לפני הרפורמה אינו נכלל באף סעיף"
body = """
החוזר ממיין עובדים לפי מה שקיבלו עד 31.12.2015. עובד קיים (שנקלט לפני 1.1.2016) מקבל את ה"חודשי חופשי" העירוני המעודכן לפי §1א רק אם הוא מבין העובדים "שקיבלו "חודשי חופשי" עירוני (בסמל 614 בשירות המדינה) עד 31/12/2015", ונסיעות בינעירוניות בודדות לפי §2א רק אם קיבל עד אז קצובת נסיעה בינעירונית על בסיס פרטני. §2ב חל על תושבי מודיעין ובית שמש העובדים בירושלים, ו־§§2ה-2ז חלים על מעברים.

עובד קיים שלא קיבל אף אחד מאלה עד 31.12.2015 — למשל מי שחזר מחופשה ללא תשלום ב־2016, או מי שהחל לנסוע בתחבורה ציבורית בלי לעבור דירה — ושאינו גר במודיעין או בבית שמש ולא עבר, אינו נכלל באף אחד מהם. עובד כזה גם אינו "חדש" לפי §1ב, החל על עובדים שנקלטו החל מ־1.1.2016. החוזר אינו קובע כלל לקצובה של עובד כזה.
"""
reading = "עובד כזה מקבל \"חודשי חופשי\" עירוני לפי תעריפי הרפורמה המעודכנים (הכלל של §1א), שכן מכתב המנכ\"ל נותן לכל עובד קיים \"חודשי חופשי\" עירוני לפי מקום המגורים ומקום העבודה בהתאם לכללים המקובלים, בלי תנאי הנוגע ל־31.12.2015."
l4 = "l4/circulars-sachar/2016-08-23_sachar_2016-1-39_nesia-reform.l4"
