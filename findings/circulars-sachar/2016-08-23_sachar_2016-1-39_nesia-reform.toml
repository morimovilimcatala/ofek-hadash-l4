# Errors in the LAW that encoding it in L4 exposed — MMS-415's model.
#
#   kind      gap | overlap | contradiction | undefined-term | broken-reference | ambiguity
#   stage     writing | compiling | examples | verification
#   keys      the rows of the document the finding is about (tools/akn.py keys)
#   quote     the words at issue, verbatim from the corpus
#   reading   the reading the encoding adopts to get past it
#   evidence  a boolean the file #ASSERTs: TRUE while the flaw is in the text
#   read_by / review   whose legal reading this is; `unreviewed` until the lawyer has seen it
#
# One row per flaw, never per diagnostic; never a mistake in our own L4; never a corpus sic.

[[finding]]
id = "F-2016-08-23_sachar_2016-1-39_nesia-reform-a"
kind = "ambiguity"
stage = "writing"
keys = ["art_2__para_a", "art_2__para_e", "art_2__para_f"]
quote = "יקבלו לפי תעריף נסיעה בודדת (בתעריפי הרפורמה) כפול ימי עבודה בפועל"
title = "One single-trip fare a day, or a return?"
body = """
§2א pays an existing intercity traveller "the single-trip tariff (at the reform's tariffs) times the days actually worked", and §§2ה-2ו repeat the formula ("תעריפי נסיעה בודדת כפול ימי עבודה בפועל"). As written, that is ONE single-trip fare for each day worked, although a day's work needs a trip there and a trip back.

The Director-General's letter of 10.7.2016, which the circular cites as its source and says it carries out, pays intercity travel "לפי תעריפי נסיעות בודדות (הלוך ושוב)" — single trips, there and back. Read by its own words the circular pays half of what the letter agreed; read through the letter it pays two fares a day. For a commuter working 20 days the difference is twenty fares a month.
"""
reading = "Two single-trip fares (a return) for each day actually worked, as the Director-General's letter the circular carries out says; \"נסיעה בודדת\" is read as naming the kind of fare, not the number of trips."
l4 = "l4/circulars-sachar/2016-08-23_sachar_2016-1-39_nesia-reform.l4"
evidence = "`one fare a day as written and a return as read give different allowances`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2016-08-23_sachar_2016-1-39_nesia-reform-b"
kind = "gap"
stage = "writing"
keys = ["art_1", "art_1__para_a", "art_2__para_a"]
quote = "עובדים קיימים (עובדים שנקלטו לעבודה אצל מעסיקם הנוכחי לפני ה- 1/1/2016) שקיבלו \"חודשי חופשי\" עירוני (בסמל 614 בשירות המדינה) עד 31/12/2015"
title = "An existing employee with no pre-reform travel allowance is in no clause"
body = """
The circular sorts employees by what they received up to 31.12.2015. An existing employee (taken on before 1.1.2016) is paid the updated urban pass under §1א only if they "received an urban monthly free pass up to 31/12/2015", and single intercity trips under §2א only if they received an individual intercity allowance up to then. §2ב covers Modiin and Beit Shemesh residents working in Jerusalem, and §§2ה-2ז cover moves.

An existing employee who received neither by 31.12.2015 — one who returned from unpaid leave in 2016, for instance, or began to travel by public transport without moving — and who is not in Modiin or Beit Shemesh and has not moved, falls under none of them. Nor is such an employee "new" under §1ב, which is for employees taken on from 1.1.2016. The circular gives no rule for that employee's allowance.
"""
reading = "Such an employee is paid the urban monthly pass at the reform's updated tariffs (§1א's rule), as the Director-General's letter gives every existing employee the urban pass by the place of residence and work under the accepted rules, without a condition about 31.12.2015."
l4 = "l4/circulars-sachar/2016-08-23_sachar_2016-1-39_nesia-reform.l4"
evidence = "`an existing employee without a pre-reform allowance is in no clause`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2016-08-23_sachar_2016-1-39_nesia-reform-c"
kind = "overlap"
stage = "writing"
keys = ["art_1__para_a", "art_2", "art_2__para_h"]
quote = "עובד שעבר ממעסיק למעסיק – ינהגו כלפיו כמו כלפי עובד חדש, כלומר לפי כללי הרפורמה"
title = "An employee who changed employer before 2016 is both existing and new"
body = """
§1א and §2's heading define an existing employee as one "taken on by the current employer before 1/1/2016". §2ח says that an employee "who moved from employer to employer" is treated as a new employee, under the reform's rules, and names no date.

An employee who came to the current employer from another one in, say, 2014 was taken on by the current employer before 1.1.2016 and so is an existing employee; by §2ח's words, having moved from employer to employer, the same employee is treated as new. The two give different allowances — for an intercity commuter, single trips times days under §2א against the reform's rules under §1ב. For a move on or after 1.1.2016 the two agree, since the employee is new by the definition as well; §2ח decides something of its own only for a move made before the reform, which is exactly where it collides with the definition.
"""
reading = "§2ח applies to a move to a new employer on or after 1.1.2016, as the Director-General's letter puts it (\"עובד שיעבור למעסיק אחר\", in the future tense) and as its place among §§2ה-2ז, which deal with changes after the reform, suggests; an earlier move leaves the employee existing."
l4 = "l4/circulars-sachar/2016-08-23_sachar_2016-1-39_nesia-reform.l4"
evidence = "`a pre-reform change of employer is both existing and new`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2016-08-23_sachar_2016-1-39_nesia-reform-d"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_i", "art_1__para_a"]
quote = "עובדים קיימים הנוסעים בנסיעות בינעירוניות האמורים לקבל קצובה עפ\"י האמור לעיל, יחויבו בחתימה על הצהרה תקופתית שההחזר משקף את ההוצאה"
title = "The periodic declaration: for intercity travellers only, or for every existing employee?"
body = """
§2ט requires "existing employees who travel between cities" to sign a periodic declaration that the refund reflects the expense. By naming that group, it leaves an existing employee paid only the urban monthly pass under §1א without the requirement.

The Director-General's letter of 10.7.2016, which the circular cites and carries out, makes everything it gives an existing employee — the urban pass (its §1א) as well as the intercity trips (its §1ב) — "conditional on signing a periodic declaration that the payment reflects the expense of travel from home to work and back" (its §1ד). For an existing employee on the urban pass alone the circular requires no declaration and the letter conditions the payment on one. A circular never outranks the arrangement it carries out.
"""
reading = "The encoding follows the circular's words: the declaration is required of existing intercity travellers (§§2א-2ב, 2ו). Whether an existing employee paid only the urban pass must sign one is left open, the letter saying yes."
l4 = "l4/circulars-sachar/2016-08-23_sachar_2016-1-39_nesia-reform.l4"
evidence = "`an existing urban-pass employee is not required to declare`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"
