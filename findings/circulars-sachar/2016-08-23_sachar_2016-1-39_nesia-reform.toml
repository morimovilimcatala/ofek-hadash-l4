[[finding]]
id = "F-2016-08-23_sachar_2016-1-39_nesia-reform-c"
kind = "overlap"
stage = "writing"
keys = ["art_1__para_a", "art_2", "art_2__para_h"]
quote = "עובד שעבר ממעסיק למעסיק – ינהגו כלפיו כמו כלפי עובד חדש, כלומר לפי כללי הרפורמה"
title = "עובד שהחליף מעסיק לפני 2016 הוא גם עובד קיים וגם עובד חדש"
body = """
§1א וכותרת §2 מגדירים עובד קיים כמי "שנקלטו לעבודה אצל מעסיקם הנוכחי לפני ה- 1/1/2016". §2ח קובע כי עובד "שעבר ממעסיק למעסיק" ינהגו כלפיו כמו כלפי עובד חדש, לפי כללי הרפורמה, ואינו מציין מועד.

עובד שהגיע למעסיקו הנוכחי ממעסיק אחר, נניח ב־2014, נקלט אצל המעסיק הנוכחי לפני 1.1.2016 ולכן הוא עובד קיים; לפי לשון §2ח, משעבר ממעסיק למעסיק, ינהגו כלפי אותו עובד כמו כלפי עובד חדש. השניים נותנים קצובה שונה — לנוסע בינעירוני, נסיעות בודדות כפול ימים לפי §2א לעומת כללי הרפורמה לפי §1ב. במעבר ב־1.1.2016 או אחריו השניים מתיישבים, שכן העובד חדש גם לפי ההגדרה; §2ח מכריע דבר משלו רק במעבר שנעשה לפני הרפורמה, וזה בדיוק המקום שבו הוא מתנגש בהגדרה.
"""
reading = "§2ח חל על מעבר למעסיק חדש ב־1.1.2016 או אחריו, כפי שמנסח זאת מכתב המנכ\"ל (\"עובד שיעבור למעסיק אחר\", בלשון עתיד) וכפי שמרמז מקומו בין §§2ה-2ז, העוסקים בשינויים שלאחר הרפורמה; מעבר מוקדם יותר משאיר את העובד עובד קיים."
l4 = "l4/circulars-sachar/2016-08-23_sachar_2016-1-39_nesia-reform.l4"
evidence = "`a pre-reform change of employer is both existing and new`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2016-08-23_sachar_2016-1-39_nesia-reform-d"
kind = "contradiction"
stage = "writing"
keys = ["art_2__para_i", "art_1__para_a"]
quote = "עובדים קיימים הנוסעים בנסיעות בינעירוניות האמורים לקבל קצובה עפ\"י האמור לעיל, יחויבו בחתימה על הצהרה תקופתית שההחזר משקף את ההוצאה"
title = "ההצהרה התקופתית: לנוסעים בינעירוניים בלבד, או לכל עובד קיים?"
body = """
§2ט מחייב "עובדים קיימים הנוסעים בנסיעות בינעירוניות" לחתום על הצהרה תקופתית שההחזר משקף את ההוצאה. משנקב בקבוצה זו, הוא משאיר עובד קיים שמקבל רק "חודשי חופשי" עירוני לפי §1א בלי החובה.

מכתב המנכ"ל מיום 10.7.2016, שהחוזר מפנה אליו ומבצע אותו, מתנה את כל מה שהוא נותן לעובד קיים — את ה"חודשי חופשי" העירוני (§1א שלו) וגם את הנסיעות הבינעירוניות (§1ב שלו) — בחתימה על הצהרה תקופתית שהתשלום משקף את הוצאת הנסיעה מהבית לעבודה ובחזרה (§1ד שלו). לעובד קיים שמקבל רק "חודשי חופשי" עירוני החוזר אינו דורש הצהרה, ואילו המכתב מתנה בה את התשלום. חוזר לעולם אינו גובר על ההסדר שהוא מבצע.
"""
reading = "הקידוד הולך אחר לשון החוזר: ההצהרה נדרשת מעובדים קיימים הנוסעים בנסיעות בינעירוניות (§§2א-2ב, 2ו). השאלה אם עובד קיים שמקבל רק \"חודשי חופשי\" עירוני חייב לחתום על הצהרה נשארת פתוחה, והמכתב משיב עליה בחיוב."
l4 = "l4/circulars-sachar/2016-08-23_sachar_2016-1-39_nesia-reform.l4"
evidence = "`an existing urban-pass employee is not required to declare`"
read_by = "Claude (L4 encoder)"
review = "unreviewed"

[[finding]]
id = "F-2016-08-23_sachar_2016-1-39_nesia-reform-e"
kind = "overlap"
stage = "verification"
keys = ["art_2__para_b", "art_2__para_e", "art_2__para_f"]
quote = "עובדים קיימים הגרים בערים מודיעין ובית שמש ועובדים בירושלים, עובדים אלו יקבלו כחריג תעריף של יומי חופשי על בסיס ימי עבודה בפועל · עובד קיים כאמור בסעיף ה' לעיל – שעבר לעיר אחרת המרוחקת ממקום עבודתו (או למקום עבודה שונה אצל אותו מעסיק) והתחיל לנסוע בנסיעות בינעירוניות יתחיל לקבל על פי תעריפי נסיעה בודדת כפול ימי עבודה בפועל"
title = "עובד קיים שגר במודיעין או בבית שמש, עובד בירושלים ועבר דירה או מקום עבודה נכלל גם ב־§2ב וגם ב־§2ו, והם נותנים לו קצובה שונה"
body = """
§2ב נותן לעובדים קיימים הגרים במודיעין ובבית שמש ועובדים בירושלים, "כחריג", תעריף של יומי חופשי לכל יום עבודה בפועל (31 ₪ מ־1.1.2016, 26.5 ₪ מ־1.2.2016). §2ה–2ו קובעים שעובד קיים שעבר מקום עבודה אצל אותו מעסיק או החליף מקום מגורים, והתחיל לנסוע בנסיעות בינעירוניות, "יתחיל לקבל על פי תעריפי נסיעה בודדת כפול ימי עבודה בפועל".

הבדיקה על פני כל העובדים שהעובדות מתירות (מועד קליטה 31.12.2015 או 1.1.2016 ושבע העובדות של כן או לא) מראה ששני הסעיפים חלים יחד בדיוק על עובד קיים הגר במודיעין או בבית שמש ועובד בירושלים שעבר דירה או מקום עבודה — למשל עובד ירושלמי שקיבל "חודשי חופשי" עירוני ועבר ב־2016 לגור במודיעין. §2ב נותן לו יומי חופשי לכל יום עבודה, ו־§2ו נותן לו תעריף נסיעה בודדת לכל יום עבודה. ה"חריג" של §2ב נכתב מול §2א, שקודם לו; הטקסט אינו אומר אם הוא גובר גם על כלל המעבר שבא אחריו, ואינו מדרג בין השניים.
"""
reading = "§2ב קודם: \"כחריג\" נקרא כחריג לכל עובד קיים מהתושבים שהוא מונה, ובכללם מי שעבר, כך שעובד כזה מקבל יומי חופשי לכל יום עבודה בפועל."
l4 = "l4/circulars-sachar/2016-08-23_sachar_2016-1-39_nesia-reform.l4"
evidence = "`§2ב and §2ו both apply and give different rules`"
