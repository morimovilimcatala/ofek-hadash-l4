title = "טבלת קוד דירוג 106 מ־1.9.2016: האתר מוסיף 7.5% לכל דרגה, נספח א'7 להסכם 30.9.2016 מוסיף 7.8% לדרגה 7 ו־8.5% לדרגות 8 ו־9"
body = """הטבלה שאתר תנאי השירות מפרסם למורה קיים בדרגת "בלתי מוסמך" (קוד דירוג 106), "מעודכנת החל מיום 1.9.2016", מוסיפה 7.5% לכל דרגה שלמה. ההסכם הקיבוצי מיום 30.9.2016, סעיף 5(א), קובע שטבלאות השכר המשולב מאותו יום הן נספחים א'1 עד א'7, ונספח א'7 שלו — לאותו קוד ולאותו יום — מוסיף לדרגה 7 7.8% ולדרגות 8 ו־9 8.5%.

עד דרגה 6 כל תא בנספח הוא תא הטבלה שבאתר עד השקל. מדרגה 6.5 כל אחד מ־216 התאים של הנספח גבוה מתא האתר, עד 200 ₪ (ותק 36, דרגה 9: 9,455 ₪ בנספח מול 9,255.25 ₪ באתר).

נספח א'7 זהה עד השקל לנספח א'7 של ההסכם מיום 22.2.2016, שבו כל שבעת הנספחים מוסיפים 7.8% ו־8.5%; בהסכם מיום 30.9.2016 נספחים א'1–א'6 מוסיפים 7.5% לכל דרגה, ורק א'7 לא השתנה.
"""
