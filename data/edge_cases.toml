# Edge cases: an input at the extreme of a rule, where the rules give an
# answer nobody would expect or where the sources part only there (the
# client, 2026-10-21, MMS-534: "add an edge cases section to the findings").
# Each is proved by the L4, not described: `asserts` are the named values
# its file #ASSERTs, and tests/test_edge_cases.py refuses a case whose
# names are not asserted there. The findings page shows them under
# "מקרי קצה". Hebrew prose, as on the rest of the site.

[[case]]
id = "mentor-20-interns"
title = "מורה חונך בבית ספר יסודי עם 20 מתמחים"
question = "מה מקבל מורה באופק חדש שחונך 20 מתמחים בבת אחת?"
l4 = "l4/circulars/2025-26_tashpo_01.l4"
asserts = ["a mentor of 20 interns, by the agreements", "a mentor of 20 interns, by this circular"]
contradiction = "mentor-cap"
answer = "לפי ההסכם: 48% מהשכר המשולב — 5,466.14 ₪ בחודש על שכר משולב של 11,387.80 ₪. לפי החוזר: 7.2% — 819.92 ₪. ה־L4 משלם לפי ההסכם, כי ההסכם גובר על החוזר."
why = "ההסכם מיום 19.3.2017 (סעיף 39ב(ד) להסכם אופק חדש) משלם 2.4% \"עבור כל מתמחה\" ואינו קובע תקרה. החוזרים לבעלויות מוסיפים \"עד שלושה מתמחים\", אבל חוזר אינו גובר על הסכם. שום מסמך בקורפוס אינו מגביל את מספר המתמחים לחונך באופק חדש; הסכם עוז לתמורה מיום 14.3.2018 (סעיף 15.1) מגביל את שלו לשלושה בהסכם עצמו. הגבלה \"לכל היותר שני גמולי תפקיד\" אינה עוזרת: החניכה היא גמול אחד, בכל מספר מתמחים."

[[case]]
id = "mentor-20-and-class"
title = "חונך של 20 מתמחים שהוא גם מחנך כיתה"
question = "האם הכלל \"לכל היותר שני גמולי תפקיד\" מגביל את החונך של 20 מתמחים?"
l4 = "l4/circulars/2025-26_tashpo_01.l4"
asserts = ["a mentor of 20 interns who educates a class"]
contradiction = "mentor-cap"
answer = "לא. החניכה היא גמול תפקיד אחד, בכל מספר מתמחים, ולכן חונך של 20 מתמחים שמחנך גם כיתה מקבל 48% ועוד 10% — 58% מהשכר המשולב."
why = "הכלל סופר גמולים, לא יחידות בתוך גמול. התקרה היחידה על מספר המתמחים היא זו של החוזר (\"עד שלושה מתמחים\"), וההסכם גובר עליה."

[[case]]
id = "three-roles"
title = "עובד הוראה שממלא שלושה תפקידים"
question = "עובד הוראה ממלא שלושה תפקידים — רכז מעבדה (3%), מחנך כיתה (10%) וחינוך חברתי ביסודי (8%). מה הוא מקבל?"
l4 = "l4/circulars/2025-26_tashpo_01.l4"
asserts = ["three roles, the two highest paid", "which two of three roles are paid changes the pay"]
answer = "18% — שני הגמולים הגבוהים (10% ו־8%). לפי סדר הרישום היה מקבל 13%."
why = "החוזר קובע \"לכל היותר שני גמולי תפקיד\" ואינו אומר אילו שניים. ה־L4 בוחר את שני הגבוהים (המוסכמה amounts.highest, כמו סעיף 39(ב) להסכם); הממצא F-2025-26_tashpo_01-q מראה שהבחירה משנה את השכר."

[[case]]
id = "homeroom-three-classes"
title = "מחנך של שלוש כיתות"
question = "מורה מחנך שלוש כיתות. מה שיעור גמול החינוך שלו לפי התקנון?"
l4 = "l4/takanon/takanon-sherut-ovdei-horaa/1.12.l4"
asserts = ["a homeroom teacher of three classes has no rate", "a homeroom teacher of two classes is paid"]
answer = "התקנון אינו נותן שיעור: לכיתה אחת 10%, לשתי כיתות 20%, ולשלוש — כלום. ה־L4 אינו ממציא 30%."
why = "סעיף 1.12 קובע שיעור לכיתה אחת ו\"פעמיים\" לשתיים, ואינו מדפיס שורה לשלוש (הממצא F-1.12-j, פער). לפי המוסכמה thresholds.missing-row, שורה שהטקסט אינו מדפיס נשארת בלי ערך."

[[case]]
id = "third-child-daycare"
title = "שלושה ילדים במעון"
question = "לעובדת הוראה שלושה ילדים עד גיל 5 במעון. על כמה מהם משולמת תוספת המעונות?"
l4 = "l4/circulars-sachar/2026-01-20_sachar_2026-4-2_maonot.l4"
asserts = ["a third child in daycare, from February 2026", "three children in daycare, the most paid a month"]
answer = "על שניים בלבד: 372 ₪ לראשון ו־251 ₪ לשני, 623 ₪ בחודש לכל היותר (מ־1.1.2026, במשרה מלאה). לילד השלישי — כלום."
why = "הסכם המסגרת מיום 12.1.2011 (סעיף 11) קובע שתוספת המעונות \"תשולם בו זמנית בגין עד שני ילדים\", והעדכון של 2026 מדפיס סכומים לשני אלה בלבד. זו תקרה מפורשת, לא פער."
