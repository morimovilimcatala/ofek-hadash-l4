[[case]]
id = "mentor-20-interns"
title = "מורה חונך בבית ספר יסודי עם 20 מתמחים"
question = "מה מקבל מורה באופק חדש שחונך 20 מתמחים בבת אחת?"
l4 = "l4/circulars/2025-26_tashpo_01.l4"
asserts = ["a mentor of 20 interns, by the agreements", "a mentor of 20 interns, by this circular"]
contradiction = "mentor-cap"
answer = "לפי ההסכם: 48% מהשכר המשולב — 5,466.14 ₪ בחודש על שכר משולב של 11,387.80 ₪. לפי החוזר: 7.2% — 819.92 ₪. ה־L4 משלם לפי ההסכם, כי ההסכם גובר על החוזר."
why = "ההסכם מיום 19.3.2017 (סעיף 39ב(ד) להסכם אופק חדש) משלם 2.4% \"עבור כל מתמחה\" ואינו קובע תקרה. החוזרים לבעלויות מוסיפים \"עד שלושה מתמחים\", אבל חוזר אינו גובר על הסכם. שום מסמך בקורפוס אינו מגביל את מספר המתמחים לחונך באופק חדש; הסכם עוז לתמורה מיום 14.3.2018 (סעיף 15.1) מגביל את שלו לשלושה בהסכם עצמו. הגבלה \"לכל היותר שני גמולי תפקיד\" אינה עוזרת: החניכה היא גמול אחד, בכל מספר מתמחים."
